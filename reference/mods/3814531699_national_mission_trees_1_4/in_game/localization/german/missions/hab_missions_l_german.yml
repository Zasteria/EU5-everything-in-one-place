l_german:
 hab_habsburg_mission_pack: "Habsburgische Vorherrschaft und das Universalreich"
 hab_habsburg_mission_pack_DESCRIPTION:0 "Von den Ufern der Donau aus – der Ehrgeiz des Hauses Habsburg reicht über ganz Europa. Sichere den Thron des Kaisers des Heiligen Römischen Reiches, erobere Ungarn im Osten, Frankreich und Spanien im Westen, Italien im Süden. Dann lass Wien als größte Stadt der Welt erstrahlen und verwirkliche das Universalreich."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "Beherrsche das Reich, erobere den Westen, den Osten und Italien und verwirkliche das Universalreich."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Europa unter habsburgischer Vorherrschaft einen."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "„Andere mögen Kriege führen; du, glückliches Österreich, heirate!“ – werde durch Diplomatie und Eroberung zugleich zum Herrn Europas!"
 hab_habsburg_ascendancy: "Der Aufstieg des Hauses Habsburg"
 hab_habsburg_ascendancy_desc: "Das Blut Rudolfs von Habsburg pulsiert entlang der Donau – ein Zeitalter der Diplomatie und der Eroberung hat begonnen."
 hab_secure_electors: "Die Kurfürsten gewinnen"
 hab_secure_electors_desc: "Über den Thron des Kaisers des Heiligen Römischen Reiches entscheidet die Stimme der Kurfürsten. Durch Bündnis oder überwältigende Macht – sichere dem Haus Habsburg den dauerhaften Besitz der Kaiserkrone."
 hab_imperial_authority: "Kaiserliche Autorität festigen"
 hab_imperial_authority_desc: "Die Autorität des Heiligen Römischen Reiches laufe im Willen des Hauses Habsburg zusammen – die Zeit ist gekommen, dass das ganze Reich Wiens Befehl gehorcht."
 hab_counter_reformation: "Die Gegenreformation"
 hab_counter_reformation_desc: "Martin Luthers Ketzerei erschüttert Deutschland – setze die Beschlüsse des Konzils von Trient um und verteidige den katholischen Glauben."
 hab_charlemagne_legacy: "Das Erbe Karls des Großen"
 hab_charlemagne_legacy_desc: "Gewinne unter dem habsburgischen Banner das Süddeutschland zurück, das Karl der Große vor tausend Jahren einte – das Fundament der Reichsreform ist gelegt."
 hab_imperial_reform: "Reichsreform"
 hab_imperial_reform_desc: "Die Reichsreform – verewige die habsburgische Herrschaft durch die Neuordnung der Regierungseinrichtungen des Reiches."
 hab_emperors_of_rome: "Erbe der römischen Kaiser"
 hab_emperors_of_rome_desc: "Ein Traum seit Karl dem Großen – mit der Herrschaft über die Ewige Stadt Rom und das Reich erklärt sich das Haus Habsburg zum „Erben der römischen Kaiser“."
 hab_reclaim_burgundy: "Burgund zurückgewinnen"
 hab_reclaim_burgundy_desc: "Lothringen und Burgund – gewinne diese westlichen Lande zurück, die einst zum Haus Habsburg gehörten."
 hab_austrian_netherlands: "Die Österreichischen Niederlande"
 hab_austrian_netherlands_desc: "Die reichen Handelsstädte Flanderns und Brabants – der Reichtum der Niederlande trägt die Finanzen des habsburgischen Reiches."
 hab_weaken_france: "Frankreich schwächen"
 hab_weaken_france_desc: "Der alte Rivale Frankreich – das größte Hindernis für die Vorherrschaft in Europa. Schwäche es und beschneide seine Macht, sich in Deutschland und Italien einzumischen."
 hab_defeat_france: "Die Niederlage Frankreichs"
 hab_defeat_france_desc: "„Gallien ist gefallen“ – der alte Rivale Frankreich ist vom Haus Habsburg geschlagen worden. Die Vorherrschaft über Westeuropa gehört den Habsburgern."
 hab_iberian_marriage: "Heiratsdiplomatie mit Iberien"
 hab_iberian_marriage_desc: "„Andere mögen Kriege führen; du, glückliches Österreich, heirate“ – Heiraten mit Spanien und Portugal öffnen die Tür zu einem Reich, in dem die Sonne nie untergeht."
 hab_crown_of_spain: "Die Krone Spaniens"
 hab_crown_of_spain_desc: "Die gesamte Iberische Halbinsel – mit der Erklärung des Hauses Habsburg zum „König von Spanien“ beginnt das Reich, in dem die Sonne nie untergeht, Gestalt anzunehmen."
 hab_italian_ambition: "Ambitionen in Italien"
 hab_italian_ambition_desc: "Die reichen Stadtstaaten Norditaliens – bringe Mailand, Venedig und Neapel unter habsburgische Kontrolle."
 hab_duchy_of_milan: "Das Herzogtum Mailand einnehmen"
 hab_duchy_of_milan_desc: "Mailand – das Herz Norditaliens. Nimm diese wirtschaftliche und militärische Festung ein und errichte einen Stützpunkt für die Eroberung Italiens."
 hab_papal_alliance: "Beziehungen zum Papst"
 hab_papal_alliance_desc: "Der Papst – knüpfe Beziehungen zu dieser geistlichen Autorität der katholischen Welt und mehre die Legitimität des Hauses Habsburg."
 hab_venetian_ports: "Die Häfen Venedigs"
 hab_venetian_ports_desc: "Venedig, „Königin der Adria“ – nimm ihre Häfen und ihre Flotte in Besitz und sichere dir den Zugang zum Mittelmeerhandel."
 hab_king_of_naples: "König von Neapel"
 hab_king_of_naples_desc: "Das Königreich Neapel – der Schlüssel zu Süditalien. Diese Krone ist der erste Schritt zur habsburgischen Herrschaft über ganz Italien."
 hab_king_of_italy: "König von Italien"
 hab_king_of_italy_desc: "Die „Eiserne Krone“ erstrahlt auf der Stirn des habsburgischen Kaisers – ganz Italien, von der Lombardei bis Sizilien, ist geeint."
 hab_eastern_ambitions: "Ambitionen im Osten"
 hab_eastern_ambitions_desc: "Böhmen und Ungarn – begründe Ansprüche gegen diese beiden Großmächte Osteuropas und beginne den habsburgischen Vorstoß nach Osten."
 hab_crown_of_bohemia: "Die Krone Böhmens"
 hab_crown_of_bohemia_desc: "Die Wenzelskrone in Prag – diese Krone wird zum Fundament der habsburgischen Ausdehnung nach Osten."
 hab_royal_hungary: "Königliches Ungarn"
 hab_royal_hungary_desc: "Buda ist von den Osmanen befreit – die Krone Ungarns kehrt auf die Stirn des habsburgischen Kaisers zurück, und das „Königliche Ungarn“ ist geboren."
 hab_bohemian_union: "Eingliederung der Böhmischen Union"
 hab_bohemian_union_desc: "Die Personalunion mit Böhmen hat sich vertieft – entscheide nun, ob du es als eingegliedertes Kronland unmittelbar beherrschst oder den Status quo beibehältst."
 hab_secure_croatia: "Kroatien sichern"
 hab_secure_croatia_desc: "Errichte in Kroatien eine Militärgrenze, um osmanische Einfälle aufzuhalten, und nutze sie als Sprungbrett für die Eroberung des Balkans."
 hab_ottoman_menace: "Die osmanische Bedrohung"
 hab_ottoman_menace_desc: "Das Osmanische Reich – der größte Feind Osteuropas, das Konstantinopel niederwarf. Lass das Haus Habsburg zum Bollwerk werden, das die Christenheit verteidigt."
 hab_liberate_balkans: "Den Balkan befreien"
 hab_liberate_balkans_desc: "Befreie die Christen der Balkanhalbinsel von der osmanischen Herrschaft – die Stimme der orthodoxen Gläubigen ruft den Namen Habsburgs."
 hab_emperors_of_east: "Kaiser des Ostens"
 hab_emperors_of_east_desc: "Konstantinopel – Hauptstadt des Oströmischen wie des Weströmischen Reiches – fällt nun in habsburgische Hände. Die östliche und die westliche Kaiserkrone sind vereint."
 hab_austrian_heartland: "Das österreichische Kernland festigen"
 hab_austrian_heartland_desc: "Das österreichische Kernland entlang der Donau – sichere das Herz der kaiserlichen Ausdehnung und lege das Fundament seiner Wirtschaft und Wehrkraft."
 hab_tyrol_styria: "Tirol und Steiermark"
 hab_tyrol_styria_desc: "Silber aus Schwaz und Eisen aus Leoben – die Bergwerke Tirols und der Steiermark tragen die Finanzen und die Heere des habsburgischen Reiches."
 hab_dev_vienna: "Wien entwickeln"
 hab_dev_vienna_desc: "„Stadt der Musik“, „Weiße Stadt der Habsburger“ – erfülle Wien mit einem Glanz, der einer kaiserlichen Hauptstadt würdig ist."
 hab_graz_fortress: "Graz befestigen"
 hab_graz_fortress_desc: "Graz – baue die Hauptstadt der Steiermark zu einer uneinnehmbaren Festungsstadt aus, gewappnet gegen osmanische Einfälle."
 hab_baroque_vienna: "Das barocke Wien"
 hab_baroque_vienna_desc: "Barocke Musik, Baukunst und Malerei erblühen am Wiener Hof – Universitäten und Kunstakademien künden das goldene Zeitalter der habsburgischen Kultur an."
 hab_great_vienna: "Die Großstadt Wien"
 hab_great_vienna_desc: "Schloss Schönbrunn, der Stephansdom – Wien ist als größte und schönste Stadt Europas vollendet."
 hab_swiss_lands: "Die Schweizer Lande zurückgewinnen"
 hab_swiss_lands_desc: "Wasche die Schmach ab, die Wilhelm Tell verkörpert – gewinne das Land der Alpenbauern für das Haus Habsburg zurück."
 hab_south_german_cities: "Die Handelsstädte Süddeutschlands"
 hab_south_german_cities_desc: "Augsburg und Frankfurt – nimm diese reichen Städte, Wiege der Familien Fugger und Rothschild, in Besitz."
 hab_unify_germany: "Die Einigung Deutschlands"
 hab_unify_germany_desc: "Die zersplitterten deutschen Fürstentümer – nun endlich unter dem habsburgischen Banner vereint."
 hab_north_sea_trade: "Der Nordseehandel"
 hab_north_sea_trade_desc: "Hamburg und Amsterdam – übernimm die Kontrolle über den Nordseehandel und errichte ein neues Handelsreich anstelle der Hanse."
 hab_hegemon_of_west: "Hegemon des Westens"
 hab_hegemon_of_west_desc: "Frankreich, Spanien – jede Großmacht des Westens, die einst das Haus Habsburg herausforderte, ist nun unterworfen."
 hab_tuscany: "Die Eroberung der Toskana"
 hab_tuscany_desc: "Die Renaissancekultur von Florenz – nimm dieses Land der Künste, das unter der Förderung der Medici erblühte, unter die Fittiche des habsburgischen Reiches."
 hab_surpass_poland: "Polen übertreffen"
 hab_surpass_poland_desc: "Das Königreich Polen – begründe die habsburgische militärische Überlegenheit in der Auseinandersetzung mit dieser Großmacht Osteuropas."
 hab_wallachia_moldavia: "Walachei und Moldau"
 hab_wallachia_moldavia_desc: "Unterwirf die rumänischen Fürstentümer nördlich der Donau und vollende die habsburgische Herrschaft über den Balkan."
 hab_austrian_army: "Das österreichische Heer neu ordnen"
 hab_austrian_army_desc: "Das habsburgische Militär – forme das stärkste Heer Europas, geschmiedet aus einem Bund vielsprachiger Regimenter."
 hab_spanish_tercios: "Der spanische Tercio"
 hab_spanish_tercios_desc: "Der Tercio – führe diese revolutionäre spanische Kriegstaktik im gesamten habsburgischen Heer ein und vervollkommne die beste Infanterie Europas."
 hab_multicultural: "Das Vielvölkerreich"
 hab_multicultural_desc: "Deutsche, Tschechen, Ungarn, Kroaten, Italiener – das Experiment des habsburgischen Reiches, viele Völker unter einem Banner zu vereinen, ist vollendet."
 hab_alsace_lorraine: "Elsass-Lothringen"
 hab_alsace_lorraine_desc: "Elsass und Lothringen am Rhein – sichere dieses Land als westliche Grenze des habsburgischen Reiches."
 hab_renaissance_court: "Der Renaissancehof"
 hab_renaissance_court_desc: "Das Licht der Renaissance erstrahlt am Wiener Hof – italienische Kunst und byzantinische Gelehrsamkeit verschmelzen und bringen die habsburgische Kultur zur vollen Blüte."
 hab_carinthia: "Kärnten"
 hab_carinthia_desc: "Kärnten – gliedere dieses Alpenherzogtum in den habsburgischen Herrschaftsbereich ein und sichere den Korridor nach Italien und auf den Balkan."
 hab_colonialism: "Das Kolonialreich"
 hab_colonialism_desc: "Über Spanien nach Amerika – errichte ein Kolonialreich, in dem unter dem habsburgischen Banner die Sonne nie untergeht."
 hab_universal_empire: "Das Universalreich"
 hab_universal_empire_desc: "„Das Universalreich – von Lissabon im Westen bis Konstantinopel im Osten, von Hamburg im Norden bis Palermo im Süden“ – der Traum seit Karl dem Großen ist verwirklicht."
 hab_events.1.t: "Das Haus Habsburg auf dem Heiligen Römischen Thron"
 hab_events.1.d: "Die Kurfürsten haben ihre Unterstützung für das Haus Habsburg erklärt – der Kaiserthron gehört den Habsburgern."
 hab_events.1.a: "Es lebe der habsburgische Kaiser! Es lebe das Reich!"
 hab_events.10.t: "Erklärung zum Erben der römischen Kaiser"
 hab_events.10.d: "Die Reichsreform ist vollendet, und die Ewige Stadt Rom ist mit dem Reich vereint – das Haus Habsburg erklärt sich zum „Erben der römischen Kaiser“."
 hab_events.10.a: "Es lebe die Reichsreform! Es lebe der Erbe Roms!"
 hab_events.15.t: "Verkündung der deutschen Einigung"
 hab_events.15.d: "Von Norden bis Süden – ein Deutschland, das einst in unzählige Fürstentümer zersplittert war, ist unter dem habsburgischen Banner vereint."
 hab_events.15.a: "Es lebe die deutsche Einigung!"
 hab_events.20.t: "Frankreichs Niedergang – der Weg zum Thron"
 hab_events.20.d: "Frankreich hat sich dem Haus Habsburg endlich gebeugt. Nun ist es an der Zeit, einen förmlichen Anspruch auf den französischen Thron zu begründen – erkläre einen sechzigjährigen Anspruch und richte den Blick auf die Nachfolge im Königreich Frankreich."
 hab_events.20.a: "Einen Anspruch auf den französischen Thron erklären (60 Jahre)"
 hab_events.25.t: "Die Krone Spaniens"
 hab_events.25.d: "„König von Spanien und Erzherzog von Österreich“ – die Iberische Halbinsel liegt nun im Herrschaftsbereich des habsburgischen Reiches."
 hab_events.25.a: "Es lebe Spanien! Es lebe das habsburgische Reich!"
 hab_events.30.t: "König von Italien"
 hab_events.30.d: "Die „Eiserne Krone“ erstrahlt auf der Stirn des habsburgischen Kaisers – ganz Italien, von der Lombardei bis Sizilien, ist geeint."
 hab_events.40.t: "Die Gründung des Königlichen Ungarn"
 hab_events.40.d: "Buda ist befreit – das „Königliche Ungarn“ wird zur östlichen Säule des habsburgischen Reiches."
 hab_events.40.a: "Ungarn befreit! Es lebe Buda!"
 hab_events.50.t: "Kaiser des Ostens"
 hab_events.50.d: "Konstantinopel ist in habsburgische Hände gefallen – die Hauptstädte des Oströmischen wie des Weströmischen Reiches werden nun als eine gehalten."
 hab_events.50.a: "Es lebe Konstantinopel! Es lebe der Kaiser des Ostens!"
 hab_events.55.t: "Die Großstadt Wien"
 hab_events.55.d: "Schloss Schönbrunn, der Stephansdom – Wien ist als größte und schönste Stadt Europas vollendet."
 hab_events.55.a: "Es lebe die Großstadt Wien!"
 hab_events.65.t: "Böhmen – Eingliederung als Kronland"
 hab_events.65.d: "Die Personalunion mit Böhmen hat sich vertieft, und die Zeit für die volle Eingliederung ist gekommen. Beherrsche es unmittelbar als eingegliedertes Kronland oder behalte die jetzige Personalunion bei – entscheide."
 hab_events.65.a: "Böhmen als eingegliedertes Kronland einverleiben"
 hab_events.99.t: "Verkündung des Universalreiches"
 hab_events.99.d: "„Das Universalreich – der habsburgische Kaiser herrscht von Lissabon im Westen bis Konstantinopel im Osten“ – diese Verkündung hallt durch ganz Europa."
 hab_events.99.a: "Es lebe das Universalreich! Das habsburgische Reich auf ewig!"
 hab_events.65.b: "Die jetzige Personalunion beibehalten"
 STATIC_MODIFIER_NAME_hab_army_mod: "Das habsburgische Eliteheer"
 STATIC_MODIFIER_DESC_hab_army_mod: "Ein habsburgisches Heer, das vielsprachige Regimenter vereint, ist als stärkste Landstreitmacht Europas vollendet."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Befreiung des Balkans"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Die Christen des Balkans sind von der osmanischen Herrschaft befreit."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Das barocke Wien"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "Die Kunst des Barock blüht am Wiener Hof und macht ihn zum Mittelpunkt der europäischen Kultur."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Widerstand gegen die böhmische Eingliederung"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "In den Sälen Prags murren die böhmischen Adligen über den Verlust ihrer alten Freiheiten."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "Die Krone Böhmens"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "Die goldene Stadt Prag tritt dem Reich als zweite Hauptstadt des Hauses Habsburg bei."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Unterwerfung Kärntens"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Kärnten ist für das habsburgische Reich zu einem lebenswichtigen alpinen Korridor geworden, der Nord und Süd verbindet."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Triumph der Gegenreformation"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Der katholische Glaube ist im ganzen Reich geschützt."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "Das Erbe Karls des Großen"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "Das Erbe Karls des Großen verleiht dem habsburgischen Reich neue Legitimität."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "Die Kroatische Militärgrenze"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "In Kroatien ist eine Militärgrenze errichtet, die osmanische Einfälle aufhält."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Ausdehnung des Donaureiches"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Die untere Donau ist unterworfen, und die habsburgische Herrschaft über den gesamten Balkan ist vollendet."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "Das Erwachen des Hauses Habsburg"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "Der Ehrgeiz des Hauses Habsburg ist entfacht – ein Zeitalter der Diplomatie und der Eroberung beginnt."
 STATIC_MODIFIER_NAME_hab_france_mod: "Der Krieg mit Frankreich"
 STATIC_MODIFIER_DESC_hab_france_mod: "Der alte Rivale Frankreich ist geschwächt und öffnet den Weg zur habsburgischen Vorherrschaft über Europa."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Befestigung von Graz"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Graz ist zu einer uneinnehmbaren Festungsstadt ausgebaut und wehrt osmanische Einfälle ab."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "Die Großstadt Wien vollendet"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Wien ist als größte Stadt Europas vollendet und erstrahlt als ewige Hauptstadt des Reiches."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Stabilität des österreichischen Kernlandes"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "Das österreichische Kernland ist gefestigt und legt das Fundament für die kaiserliche Ausdehnung."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Hegemon des Westens"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "In Westeuropa bleibt keine Macht mehr übrig, die die habsburgische Vorherrschaft herausfordern könnte."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Festigung der kaiserlichen Autorität"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Das gesamte Heilige Römische Reich gehorcht nun dem Befehl des Hauses Habsburg."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Früchte der Italienischen Kriege"
 STATIC_MODIFIER_DESC_hab_italian_mod: "Die italienischen Feldzüge haben das habsburgische Heer zu einer Elitetruppe geschmiedet."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Begründung des Vielvölkerreiches"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "Das Wunder vieler Völker, die unter dem habsburgischen Banner zusammenleben, ist verwirklicht."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Vorherrschaft im Nordseehandel"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "Der Nordseehandel ist unter die Kontrolle des habsburgischen Reiches gekommen."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Der Krieg mit dem Osmanischen Reich"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "Durch den Sieg über das Osmanische Reich gilt das habsburgische Reich als Bollwerk der Christenheit."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Aussöhnung mit dem Papst"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Die Beziehungen zum Papst sind geknüpft, und das Haus Habsburg gilt als Beschützer der katholischen Welt."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Vollendung der Reichsreform"
 STATIC_MODIFIER_DESC_hab_reform_mod: "Die Neuordnung der Regierungseinrichtungen verewigt die habsburgische Herrschaft."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "Die Renaissance Wiens"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "Das Licht der Renaissance erstrahlt am Wiener Hof und macht das Reich zum Mittelpunkt der europäischen Kultur."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "Die Handelsstädte Süddeutschlands"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "Die reichen freien Städte Süddeutschlands sind zum Kern der Wirtschaft des Reiches geworden."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "Die Eisenbergwerke von Leoben"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "Das Eisen der Steiermark trägt die Wehrkraft des habsburgischen Reiches."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Unterwerfung der Schweiz"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "Der Staat der Alpenbauern ist erobert und die habsburgische Vorherrschaft begründet."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "Der spanische Tercio"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "Die Tercio-Taktik ist im gesamten habsburgischen Heer eingeführt und hat die beste Infanterie Europas hervorgebracht."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Wohlstand der Toskana"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "Die Renaissancekultur von Florenz erblüht unter dem Schutz des habsburgischen Reiches."
 STATIC_MODIFIER_NAME_hab_tyrol_silver_mod: "Die Silberbergwerke von Schwaz"
 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "Die Silberbergwerke Tirols tragen die Finanzen des habsburgischen Reiches."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Verkündung des Universalreiches"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "„Das Universalreich“ – ganz Europa ist unter dem habsburgischen Banner vereint."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "Einnahme Venedigs"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "Die „Königin der Adria“ trägt nun die Seemacht des habsburgischen Reiches."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Wien – Herz des Reiches"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Wien erstrahlt als kulturelles und administratives Zentrum des Reiches."
 hab_events.40.b: "Das jetzige Verhältnis beibehalten"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Widerstand gegen die ungarische Eingliederung"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "In den Palästen Budas murren die ungarischen Magnaten über den Verlust ihrer alten Freiheiten."
 hab_integrated_crown_desc: "Ein Eingegliedertes Kronland ist ein besonderer Untertanentyp, der seinen Herrscher mit dem habsburgischen Kaiser teilt, eingeschränkte Diplomatie besitzt und es dem Oberherrn erlaubt, Ressourcen unmittelbar aufzubauen und zu entwickeln. Es kann 100 Jahre lang nicht annektiert werden."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "Erwerb der Krone Spaniens"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "Die Iberische Halbinsel ist Teil des Herrschaftsbereichs des habsburgischen Reiches geworden und öffnet die Tür zu einem Reich, in dem die Sonne nie untergeht."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "Einnahme von Elsass-Lothringen"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "Der Doppeladler der Habsburger weht von den Grenzfestungen entlang des Rheins, und die westliche Verteidigung steht unerschüttert."
 hab_events.30.b: "Italien weiterhin so beherrschen, wie es ist"
 hab_events.15.b: "Es lebe das Deutsche Kaiserreich!"
 hab_events.30.a: "Das Königreich Italien als eingegliedertes Kronland neu ordnen"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Einigung des Heiligen Römischen Reiches"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "Das Heilige Römische Reich ist geeint, und die Straßen und Heere des Reiches sind zu einem Ganzen verbunden."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "Die Geburt des Deutschen Kaiserreichs"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "Das Deutsche Kaiserreich ist ausgerufen, und eine disziplinierte, mächtige Armee kündet von seiner Geburt."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "Das Erbe der römischen Kaiser"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Als Erbe der römischen Kaiser gepriesen, sieht das Haus Habsburg seinen Hof von Geistlichen und Gelehrten aus der gesamten Christenheit bevölkert."
 hab_stadtrechtsbriefe: "Die Stadtrechtsbriefe ausstellen"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe – Urkunden, die Städten ihr Recht verleihen. Verleihe unter der starken Königsmacht des habsburgischen Kaisers den Städten im ganzen Reich Privilegien – das Wiener Stadtrecht für Wien und Landstadtrechte für die Reichsstädte andernorts."
 hab_stadtrechtsbriefe_unlock_tt: "Schaltet die Stadtprivilegien Wiener Stadtrecht und Landstadt frei."
 hab_innsbruck_court: "Der Hof zu Innsbruck"
 hab_innsbruck_court_desc: "Innsbruck – nun, da diese zentrale Stadt Tirols zu einer wahren Stadt herangereift ist, errichte hier einen Hof als Mittelpunkt der habsburgischen Alpenkultur."
 hab_swarovski_crystal: "Swarovski-Kristall"
 hab_swarovski_crystal_desc: "Ab 1737 vervollkommneten die Glasmacher Innsbrucks die Kunst des feinen Kristallschliffs – lange bevor Swarovski selbst geboren war, schmückte Tiroler Kristall bereits die Höfe Europas."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Entwicklung des Innsbrucker Hofes"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Innsbruck beginnt als Mittelpunkt der habsburgischen Alpenkultur zu erstrahlen."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Tirols Kristallindustrie"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Die Glasmacher Innsbrucks haben die Kunst des feinen Kristallschliffs vervollkommnet."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Wiener Stadtrecht"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Ein besonderes Stadtrecht, das allein Wien verliehen wird – Vorteile in Handel und Markt tragen Wiens Wohlstand."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Landstadt"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Stadtrechte, die den Reichsstädten verliehen werden – sie verbessern das Straßennetz und halten Kronmacht und Adelseinfluss im Gleichgewicht."
