l_german:
 som_ottoman_mission_pack_desc: "Von einem Grenz-Beylik zum mächtigsten Sultanat der Welt. Festige Anatolien, setze nach Rumelien über und beanspruche Konstantinopel – die ewige Stadt, die dein Thron werden soll."
 som_tur_secure_bursa: "Bursa sichern"
 som_tur_secure_bursa_desc: "Bursa, die erste große Stadt der Osmanen, muss fest unter dynastischer Kontrolle stehen. Errichte Ordnung und lege das Fundament eines dauerhaften Staates."
 som_tur_frontier_warriors: "Die Grenzkrieger schmieden"
 som_tur_frontier_warriors_desc: "Die Ghazi-Krieger, die unser Beylik erkämpften, müssen an die Dynastie gebunden werden. Ihr Kampfgeist ist unsere größte Waffe."
 som_tur_cross_the_straits: "Die Meerenge überqueren"
 som_tur_cross_the_straits_desc: "Sichere Çanakkale und öffne den Weg nach Europa. Als Belohnung wird ein Kriegsgrund zur Eroberung der Provinz Gallipoli gewährt."
 som_tur_anatolian_heartland: "Anatolien festigen"
 som_tur_anatolian_heartland_desc: "Sichere Ankara und lege den Kurs seiner Entwicklung als Herz Anatoliens fest. Was dieses Land künftig erzeugt, wird die Zukunft des Reiches prägen."
 som_ottoman_events.18.t: "Das Herz Anatoliens – Ankaras Zukunft"
 som_ottoman_events.18.d: "Ankara, die Stadt im Herzen Anatoliens, ist unter die Kontrolle des Reiches gekommen. Am Hof wird debattiert, welches Gewerbe die Zukunft dieser Region bestimmen soll: die Verfeinerung ihrer langen Webtradition, die Anpflanzung von Maulbeerbäumen für die Seidenproduktion oder der Anbau leuchtender Färbepflanzen."
 som_ottoman_events.18.a: "Das Webgewerbe weiterentwickeln"
 som_ottoman_events.18.b: "Maulbeerbäume pflanzen und mit der Seidenproduktion beginnen"
 som_ottoman_events.18.c: "Den Anbau von Färbepflanzen fördern"
 som_tur_vassalize_beyliks: "Die Eroberung der Beyliks"
 som_tur_vassalize_beyliks_desc: "Die übrigen anatolischen Beyliks müssen sich beugen oder zerschlagen werden. Nur ein geeintes Anatolien kann den Mächten im Osten und Westen die Stirn bieten."
 som_tur_siege_constantinople: "Der Fall Konstantinopels"
 som_tur_siege_constantinople_desc: "Die ewige Stadt, Sitz des Oströmischen Reiches, muss osmanischen Kanonen und Stahl weichen. Ihre Eroberung wird unser Reich der Welt verkünden. Die Bevölkerung der Stadt wird unter osmanischer Herrschaft gewandelt."
 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Ghazi-Krieger"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "„Ghazi“ ist der Titel dessen, der im Namen des Islam gegen Ungläubige kämpft. Seit Osman Ghazi, dem Gründer der Dynastie, drangen die Grenzkrieger mit diesem heiligen Sendungsbewusstsein immer weiter in die geschwächten Grenzlande von Byzanz vor. Dieser religiöse Eifer war der geistige Motor der osmanischen Ausdehnung."
 som_ottoman_events.1.t: "Bursa – Wiege der Osmanen"
 som_ottoman_events.1.d: "Bursa, Iznik und Nikomedia sind in osmanische Hände gefallen. In Bursa leben griechisch-orthodoxe, armenische, jüdische und türkisch-muslimische Gemeinschaften unter der neuen Dynastie Seite an Seite. Der Hof des Sultans steht nun vor einer Frage: Wie sollen diese verschiedenen Völker in den osmanischen Staat eingegliedert werden?"
 som_ottoman_events.1.a: "Sie unter dem Banner des Islam und der türkischen Tradition einen"
 som_ottoman_events.1.a.tt: "Viele Bevölkerungsgruppen in Bursa werden zum sunnitischen Glauben übertreten und türkische Kultur annehmen."
 som_ottoman_events.4.t: "Der Fall Konstantinopels"
 som_ottoman_events.4.d: "Konstantinopel ist gefallen. Der letzte Kaiser von Byzanz, Konstantin XI., fiel im Kampf auf den Mauern, und Mehmeds II. Heere zogen in die Stadt ein. Wo einst die Glocken der Hagia Sophia läuteten, hallt nun der Gebetsruf. Der Sultan erklärt die Stadt in Kostantiniyye umbenannt und ruft sie zur neuen kaiserlichen Hauptstadt aus."
 som_ottoman_events.4.a: "Die Stadt in eine osmanische Hauptstadt verwandeln"
 som_ottoman_events.4.a.tt: "Die meisten Bevölkerungsgruppen Konstantinopels werden zum sunnitischen Glauben übertreten und türkische Kultur annehmen."
 som_tur_conquer_bulgaria: "Bulgarien erobern"
 som_tur_conquer_bulgaria_desc: "Tarnovo war die glanzvolle Hauptstadt des Zweiten Bulgarischen Reiches. Nimm diese Stadt und öffne den Weg nach Norden."
 som_tur_conquer_serbia: "Serbien erobern"
 som_tur_conquer_serbia_desc: "Novo Brdo birgt die größten Silberminen des Balkans, während Skopje das Tor nach Makedonien ist. Sichere beide Städte, um das südliche Serbien unter osmanische Kontrolle zu bringen."
 som_tur_conquer_hungary: "In Ungarn einfallen"
 som_tur_conquer_hungary_desc: "Zerschmettere das ungarische Feldheer bei Mohács und besetze Buda. Die Donau soll zur Nordgrenze des Osmanischen Reiches werden."
 som_tur_siege_vienna: "Die Belagerung Wiens"
 som_tur_siege_vienna_desc: "Pflanze das osmanische Banner vor den Mauern Wiens auf. Die Welt soll die Macht des Osmanischen Reiches bezeugen."
 som_tur_anatolia_unified: "Die Einheit Anatoliens"
 som_tur_anatolia_unified_desc: "Erobere Trapezunt und Erzurum, um ganz Anatolien unter osmanische Herrschaft zu bringen. Das pontische Gebirge markiert die östliche Grenze des Reiches."
 som_tur_conquer_syria: "Nach Syrien"
 som_tur_conquer_syria_desc: "Erobere Aleppo und Damaskus. Syrien ist das Herz islamischer Gelehrsamkeit und des Handels; seine Einnahme mehrt das Ansehen des Reiches."
 som_tur_defeat_mamluks: "Die Mamluken besiegen"
 som_tur_defeat_mamluks_desc: "Besetze im Krieg mit den Mamluken Kairo, um einen günstigen Frieden zu erzwingen. Mit besetztem Kairo können die Mamluken zur Annahme der Vasallität gezwungen werden."
 som_tur_holy_cities: "Die Heiligen Städte"
 som_tur_holy_cities_desc: "Sichere Jerusalem und rufe den Sultan zum Kalifen aus. Als Hüter der zwei heiligen Städte stehen die Osmanen an der Spitze der islamischen Welt."
 som_tur_red_sea_dominance: "Vorherrschaft am Roten Meer"
 som_tur_red_sea_dominance_desc: "Sichere Alexandria und beherrsche die Handelswege des Roten Meeres. Der Reichtum des Indischen-Ozean-Handels füllt die osmanische Schatzkammer."
 som_tur_age_of_suleiman: "Pax Ottomana"
 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "Donaugrenze"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "Die Donau ist als Nordgrenze festgelegt, und die Lehren des Heeres, das vor Wiens Toren stand, sind der kaiserlichen Doktrin eingeschrieben."
 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Anatolien geeint"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "Von Trapezunt bis Erzurum steht ganz Anatolien unter osmanischer Kontrolle. Das östliche Fundament des Reiches ist gesichert, Steuereinnahmen und Legitimität verbessert."
 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "Kaiserliches Straßennetz"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "Das Rote Meer war der goldene Weg, auf dem die Gewürze, Seiden und Farbstoffe Indiens und Südostasiens nach Europa gelangten. Selbst nachdem Portugal den neuen Weg um die Südspitze Afrikas eröffnet hatte, behielt der Weg über Kairo und Alexandria seinen Wert, und das Osmanische Reich wurde zum größten Nutznießer dieses Handelswegs."
 som_tur_fate_of_crimea: "Das Schicksal der Krim"
 som_tur_fate_of_crimea_desc: "Die Halbinsel Krim, mit dem genuesischen Handelsposten Kaffa als Herz, beherrscht den Handel an der nördlichen Schwarzmeerküste. Sichere diese Region und bringe den Schwarzmeerhandel unter osmanische Kontrolle."
 som_tur_black_sea_dominance: "Herrschaft über das Schwarze Meer"
 som_tur_black_sea_dominance_desc: "Mit gesicherter Krim, gefestigtem Edirne und geeintem Anatolien ist das Schwarze Meer zu einem osmanischen Binnensee geworden. Entwickle Konstantinopels Rohstoffproduktion und begründe die vollständige Vorherrschaft im Schwarzen Meer."
 som_tur_italy_south: "Süditalien"
 som_tur_italy_south_desc: "Erobere Neapel und Sizilien, um das Zentrum des Mittelmeers einzunehmen. Diese uralten Handelsstädte werden die kaiserliche Schatzkammer füllen."
 som_tur_italy_north: "Italien erobert"
 som_tur_italy_north_desc: "Erobere Rom, Florenz und Mailand, um die Eroberung der italienischen Halbinsel zu vollenden. Die Stadt des Papstes, die Stadt der Medici, die Stadt der Visconti – alle werden des Sultans."
 som_tur_arabia_conquest: "Herrschaft über Arabien"
 som_tur_arabia_conquest_desc: "Sichere Mekka, Medina und Suez, um die heiligen Städte der islamischen Welt und das Tor zum Indischen Ozean zu beherrschen."
 som_tur_persian_gulf: "Der Persische Golf"
 som_tur_persian_gulf_desc: "Nimm Hormus ein und beherrsche die Handelswege des Persischen Golfs. Der Reichtum des Indischen-Ozean-Handels fließt in die osmanische Schatzkammer."
 som_tur_north_africa: "Der Maghreb"
 som_tur_north_africa_desc: "Erobere Tunis, Algier und Tripolis, um die südliche Mittelmeerküste unter osmanische Herrschaft zu bringen. Die Barbareskenkorsaren beugen sich dem Banner des Sultans."
 som_tur_morocco: "Marokko"
 som_tur_morocco_desc: "Erobere Fes und Marrakesch, um ganz Nordafrika dem Osmanischen Reich hinzuzufügen. Die Küsten des Atlantiks werden zur Westgrenze des Reiches."
 som_tur_age_of_suleiman_desc: "Von Wien im Norden bis Arabien und Marokko im Süden – ein Weltreich über drei Kontinente ist vollendet. Erfordert die Belagerung Wiens, den Persischen Golf und Marokko, alle abgeschlossen."
 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Herr des Schwarzen Meeres"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "Das Schwarze Meer ist nun ein osmanischer Binnensee. Angesichts dieser Leistung debattiert der Hof über die Einführung neuer Regierungseinrichtungen und eröffnet Raum für eine neue Reform."
 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Herrschaft über Süditalien"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "Durch die Beherrschung Neapels und Siziliens ist das zentrale Mittelmeer in osmanische Hände übergegangen. Handelseinkommen und diplomatisches Ansehen sind verbessert."
 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Hüter Arabiens"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "„Hüter der beiden heiligen Moscheen“ – Mekka und Medina sind die zwei heiligsten Orte des Islam. 1517 eroberte Selim I. Ägypten und den Hedschas und nahm diese Orte in seine Hand, und der osmanische Sultan wurde zum religiösen Beschützer der gesamten sunnitisch-muslimischen Welt. Die Pflicht und Ehre, die jährliche Hadsch zu bewachen, wurde dem Sultan übertragen."
 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Handelsvorherrschaft am Persischen Golf"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "Die Straße von Hormus ist das einzige Tor, durch das die Gewürze und Seiden Indiens und Südostasiens in den Persischen Golf gelangen. Diese „Kehle der Welt“ zu beherrschen, wäre der entscheidende Trumpf gegen den Indischen-Ozean-Handelsweg, den Portugal um Afrika herum zu begründen suchte."
 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "Hegemonie über Afrika"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "Nordafrika erobert. Elitereiterei aus den Wüsten und Steppen tritt dem osmanischen Heer bei und verbessert sowohl die leichte als auch die schwere Reiterei."
 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Ankaras Webhandel"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "In Ankaras Werkstätten werden die traditionellen Webtechniken weiter verfeinert, was die Produktion feiner Stoffe steigert."
 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Ankaras Seidenhandel"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Maulbeerbäume werden auf Ankaras Feldern gepflanzt, was die Seidenproduktion steigert."
 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Ankaras Färbehandel"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "Der Anbau leuchtender Färbepflanzen breitet sich um Ankara aus und steigert die Farbstoffproduktion."
 eyalet: "Eyalet"
 eyalet_desc: "Ein Provinzvasallenstaat des Osmanischen Reiches. Er unterliegt strengerer Kontrolle als ein gewöhnlicher Vasall, zahlt doppelten Tribut und unterliegt der diplomatischen Annexion mit doppelter Geschwindigkeit."
 eyalet_plural: "Eyalets"
 som_ottoman_events.20.t: "Herrschaft über das Schwarze Meer"
 som_ottoman_events.20.d: "Das Schwarze Meer war einst ein genuesischer Binnensee. Doch mit dem Fall Kaffas 1475 und der osmanischen Kontrolle über den Bosporus ist die letzte genuesische Festung verschwunden. Das Schwarze Meer ist nun ein osmanischer Binnensee. Drei Jahrhunderte venezianischer und genuesischer Handelsvorherrschaft im östlichen Mittelmeer gehen zu Ende."
 som_ottoman_events.20.a: "Das Schwarze Meer ist ein osmanischer Binnensee"
 som_ottoman_events.30.t: "Die Tore Wiens"
 som_ottoman_events.30.d: "Das Heer Süleymans des Prächtigen hat Wien erreicht. Dreihunderttausend osmanische Soldaten haben die ganze Christenheit erschüttert. 1529 hielt die Stadt dem frühen Winter und den überdehnten Nachschublinien stand – doch diesmal ist es anders. „Fällt Wien, gehört Europa uns“, erklärt der Sultan."
 som_ottoman_events.30.a: "Wien einnehmen und Herr Europas werden"
 som_ottoman_events.99.t: "Das Zeitalter Süleymans"
 som_ottoman_events.99.d: "Das Osmanische Reich hat seinen Gipfel erreicht – das Zeitalter Süleymans des Prächtigen. Vom Balkan bis Arabien, von der Krim bis Nordafrika beugt sich eine Herrschaft, die selbst Rom übertrifft, dem Willen eines einzigen Sultans. Süleyman, „der Gesetzgeber“ (Kanuni) genannt, weil er das osmanische Recht kodifizierte, führt die größte Blüte von Kunst, Baukunst und Militärmacht in der Geschichte des Reiches an. Istanbuls Moscheen, Paläste und Basare verkünden den Ruhm der größten Stadt der Welt. Das Osmanische Reich ist zu einer der höchsten Mächte der Geschichte geworden."
 som_ottoman_events.99.a: "Das goldene Zeitalter des großen Osmanischen Reiches beginnt"
 som_tur_edirne_capital: "Die Festung Edirne"
 som_tur_edirne_capital_desc: "Das alte Hadrianopolis wurde zu Edirne, als Murad I. es 1363 zur osmanischen Hauptstadt machte – der Basis für die Eroberung des Balkans. Es blieb fast neunzig Jahre lang kaiserliche Hauptstadt, bis Konstantinopel 1453 fiel, und hier wurde Mehmed II. geboren. Befestige diese Stadt als Anker Rumeliens und Sprungbrett für die Eroberung des Balkans."
 som_tur_aegean_dominance: "Herrschaft über die Ägäis"
 som_tur_aegean_dominance_desc: "Die Ägäis war ein Schlachtfeld venezianischer und genuesischer Handelsrivalität. Die Einnahme Smyrnas als Eckpfeiler der östlichen Ägäisküste und der Aufbau einer Flotte geben den Osmanen den Stützpunkt für jede Ausdehnung im Mittelmeer. Die frühe osmanische Flotte muss von Grund auf aufgebaut werden – doch sie wird zu einer gewaltigen Macht heranwachsen."
 som_tur_janissary_corps: "Das Janitscharenkorps"
 som_tur_janissary_corps_desc: "Mitte des 14. Jahrhunderts schuf Orhans I. Sohn Murad I. die Janitscharen – „neue Soldaten“, gebildet aus christlichen Knaben, die durch das Devschirme-System erhoben, zum Islam bekehrt und zu treuem stehendem Fußvolk des Sultans ausgebildet wurden. Regelmäßig besoldet und streng diszipliniert, wurden die Janitscharen zum Rückgrat des osmanischen Heeres und spielten eine entscheidende Rolle beim Fall Konstantinopels und unzähligen anderen Schlachten."
 som_tur_devshirme_system: "Das Devschirme-System"
 som_tur_devshirme_system_desc: "Die Devschirme („Knabenlese“) erhob christliche Jugendliche aus dem Balkan, bekehrte sie zum Islam und bildete sie zu Janitscharen und Palastbeamten aus. Das System schuf eine Beamtenklasse, die allein dem Sultan treu war, ungebunden von Stammes- oder Familienbindungen. Aus dieser Klasse gingen viele der größten Großwesire des Reiches hervor – Männer, die von der Gefangenschaft zum höchsten Amt im Land aufstiegen."
 som_tur_elite_guard: "Die Elitegarde"
 som_tur_elite_guard_desc: "Die persönliche Garde des Sultans – ausgewählt aus den besten Janitscharen – war die disziplinierteste Truppe des Reiches. Sie diente als Palastwache und trug im Feldzug das kaiserliche Feldzeichen. Die Investition in strenge Ausbildung und hohe Maßstäbe schafft den Kern einer Berufsstreitmacht, die das Reich zum Ruhm tragen wird."
 som_tur_kanun_i_osmani: "Kanun-i Osmani"
 som_tur_kanun_i_osmani_desc: "Der Kanun-i Osmani („Osmanisches Gesetzbuch“) war ein weltliches Rechtssystem, das neben der Scharia entwickelt wurde. Sultan „Kanuni“ (der Gesetzgeber) Süleyman I. vollendete seine Kodifizierung, doch seine Grundlagen wurden im 14. und 15. Jahrhundert gelegt. Es umfasste Steuerrecht, Strafverfahren und Verwaltung und gab dem osmanischen Staat einen rationalisierten Rechtsrahmen, der neben dem islamischen heiligen Recht wirkte – und es ergänzte."
 som_tur_imperial_army: "Das kaiserliche Heer"
 som_tur_imperial_army_desc: "Janitscharen, Sipahi-Reiterei, Azaps, Akıncı-Leichtreiterei – das osmanische Heer war ein Verbund verschiedener Waffengattungen unter zentraler Führung. Diszipliniert, besoldet und zunehmend mit Feuerwaffen ausgerüstet, war das osmanische Heer des 16. Jahrhunderts eine der gewaltigsten Kriegsmaschinen, die die Welt je gesehen hatte. Bringe es zu seiner vollen Entfaltung."
 som_tur_timar_system: "Das Timar-System"
 som_tur_timar_system_desc: "Das Timar war die grundlegende Landbesitzeinrichtung des osmanischen Staates. Der Sultan verlieh eroberte Lande an Sipahi-Reiter als Timare im Austausch für Kriegsdienst – ähnlich dem europäischen Feudalwesen, jedoch ohne Erbrecht. Das Timar-System finanzierte eine große Streitmacht, ohne die kaiserliche Schatzkammer zu erschöpfen, und machte die osmanische Ausdehnung in ihren frühen Phasen selbsttragend."
 som_tur_sipahi_cavalry: "Die Sipahi-Reiterei"
 som_tur_sipahi_cavalry_desc: "Die Sipahi – gepanzerte Reiter, finanziert durch Timar-Landvergaben – bildeten im 15. und 16. Jahrhundert die Hauptstoßkraft des osmanischen Heeres. Ihre donnernden Angriffe wurden auf dem Balkan und in Anatolien gefürchtet. Mit der Ausdehnung des Reiches wurde der Sipahi-Stand zu einem mächtigen Provinzadel, dessen Interessen der Sultan sorgfältig lenken musste."
 som_tur_eyalet_system: "Das Eyalet-System"
 som_tur_eyalet_system_desc: "Ein Eyalet („Provinz“) war die größte Verwaltungseinheit des Osmanischen Reiches, regiert von einem vom Sultan unmittelbar ernannten Beylerbeyi. Rumelien, Anatolien, Ägypten, Syrien – jedes Eyalet war ein Reich im Kleinen mit eigenem militärischem Kontingent und Verwaltungsapparat. Das System erstreckte die kaiserliche Autorität bis in die fernsten Winkel des Reiches, ohne die persönliche Anwesenheit des Sultans zu erfordern."
 som_tur_grand_vizier: "Der Großwesir"
 som_tur_grand_vizier_desc: "Der Großwesir (Sadrazam) war der oberste Verwalter des Reiches, nur dem Sultan untergeordnet. Sein Amtssitz – die „Hohe Pforte“ (Bab-i Ali) – wurde zum Sinnbild der osmanischen Regierung selbst und war die Adresse, an der europäische Diplomaten ihre Beglaubigungsschreiben überreichten. Ein fähiger Großwesir konnte das Reich wirksam führen und dem Sultan erlauben, sich auf Legitimität und militärische Führung zu konzentrieren."
 som_tur_imperial_bureaucracy: "Die kaiserliche Bürokratie"
 som_tur_imperial_bureaucracy_desc: "Die osmanische Bürokratie – eine Mischung aus Devschirme-Beamten und traditionellen türkisch-islamischen Verwaltern – war eines der ausgefeiltesten Regierungssysteme ihrer Zeit. Schriftkultur, zentrale Aktenführung und spezialisierte Ministerien (Diwane) machten das gewaltige Reich überraschend beherrschbar. Die schiere Menge der von osmanischen Schreibern geführten Aufzeichnungen bleibt bis heute eine Fundgrube für Historiker."
 som_tur_new_capital: "Die Entwicklung Kostantiniyyes"
 som_tur_new_capital_desc: "Mehmed II. benannte die eroberte Stadt in „Kostantiniyye“ um und startete sogleich ein ehrgeiziges Wiederaufbauprogramm. Die zwangsweise Umsiedlung von Handwerkern und Kaufleuten, der Wiederaufbau der Infrastruktur und die Wiederherstellung ihrer Märkte verwandelten eine Stadt der Ruinen in eine blühende Metropole. Der Sultan verlangte, dass Kostantiniyye den Glanz der byzantinischen Hauptstadt, die es ersetzte, übertreffe – und lenkte die vollen Mittel des Reiches dahin, dies zu verwirklichen."
 som_tur_new_capital_unlock_tt: "Die Entscheidung „Der Wiederaufbau Kostantiniyyes“ ist nun verfügbar."
 som_develop_kostantiniyye_decision.title: "Der Wiederaufbau Kostantiniyyes"
 som_develop_kostantiniyye_decision.desc: "Die eroberte Hauptstadt ist gewachsen, doch ihre Viertel tragen noch die Narben der Belagerung. Die Schatzkammer des Sultans kann Umsiedlung, neue Märkte und wiederaufgebaute Straßen bezahlen, damit Kostantiniyye erneut aufblüht."
 som_develop_kostantiniyye_decision.a: "Gelder in den Wiederaufbau der Hauptstadt stecken."
 som_expand_kostantiniyye_decision.title: "Kostantiniyye zu neuem Glanz führen"
 som_expand_kostantiniyye_decision.desc: "Der Wiederaufbau hat Früchte getragen: Siedler und Handwerker füllen die neuen Viertel. Mit größeren Investitionen in Werkstätten, Karawansereien und das Umland kann Kostantiniyye selbst den Ruhm der byzantinischen Hauptstadt übertreffen."
 som_expand_kostantiniyye_decision.a: "In die Größe der Stadt investieren."
 som_tur_grand_bazaar: "Der Große Basar"
 som_tur_grand_bazaar_desc: "Auf Befehl Mehmeds II. zwischen 1455 und 1461 erbaut, war der Große Basar (Kapalıçarşı) einer der ersten überdachten Märkte der Welt und wurde rasch zum größten. Viertausend Läden, die Seide, Gewürze, Edelsteine, Keramik und Waffen verkauften, zogen täglich zehntausende Käufer an. In seinem Mittelpunkt diente die Halle der Gold- und Silberhändler – der Bedesten – als kaufmännisches Herz des Reiches."
 som_tur_grand_bazaar_condition_tt: "Die Entscheidung „Kostantiniyye zu neuem Glanz führen“ wurde genutzt"
 som_tur_suleiman_mosque: "Die Süleymaniye-Moschee"
 som_tur_suleiman_mosque_desc: "Vom Meisterarchitekten Sinan entworfen und 1557 vollendet, ist die Süleymaniye-Moschee das Meisterwerk osmanischer Baukunst. Vier Minarette durchbohren die Silhouette Istanbuls; die gewaltige Kuppel beherrscht das Stadtbild vom Bosporus aus. Ihr umgebender Gebäudekomplex (Külliye) umfasste Kollegien, ein Krankenhaus, Läden und eine Karawanserei – eine Stadt in der Stadt, die das osmanische Ideal kaiserlicher Förderung verkörpert."
 som_tur_topkapi_palace: "Der Topkapı-Palast"
 som_tur_topkapi_palace_desc: "Der Topkapı-Palast – erbaut auf dem Vorgebirge, das Bosporus, Goldenes Horn und Marmarameer beherrscht – diente vier Jahrhunderte lang als osmanischer Hof. Die Gemächer des Sultans, der kaiserliche Harem, die Schatzkammer und der Ratssaal (Divan-ı Hümayun) waren alle in seinen vier Höfen enthalten. Jeder Großwesir wurde hier ernannt und entlassen; jeder Feldzug begann aus seinem Schatten."
 som_tur_city_of_worlds_desire: "Stadt der Sehnsucht der Welt"
 som_tur_ulema_authority: "Die Autorität der Ulema"
 som_tur_ulema_authority_desc: "Die Ulema – islamische Gelehrte, die als Richter, Rechtsberater und Lehrer wirkten – verliehen dem osmanischen Staat seine religiöse Legitimität. Als Kadis (Richter), Muftis (Rechtsberater) und Madrasa-Professoren verwalteten sie Recht und Bildung im ganzen Reich. Ihre Billigung war für jede bedeutende Politik – einschließlich Kriegserklärungen – unentbehrlich, um von der muslimischen Bevölkerung als rechtmäßig angesehen zu werden."
 som_tur_millet_system: "Das Millet-System"
 som_tur_millet_system_desc: "Das Millet-System („Nation“ oder „Gemeinschaft“) organisierte die nichtmuslimischen Untertanen des Osmanischen Reiches in halbautonome Glaubensgemeinschaften. Das griechisch-orthodoxe Rum-Millet, das armenische Millet und das jüdische Millet hatten jeweils ihre eigenen Gerichte, Schulen und wohltätigen Einrichtungen unter Führung ihrer eigenen geistlichen Oberhäupter. Dieses bemerkenswerte System gelenkten Pluralismus erlaubte dem Reich, gewaltige Vielfalt zu regieren, ohne Zwangsbekehrung zu erfordern."
 som_tur_kadi_courts: "Die Kadi-Gerichte"
 som_tur_kadi_courts_desc: "Kadis – vom Sultan unmittelbar ernannte Richter – verwalteten das islamische Recht im ganzen Reich, von großen Städten bis zu entlegenen Dörfern. Ihre Gerichtsakten (Sicils) dokumentierten nicht nur Rechtsstreitigkeiten, sondern auch Verträge, Grundstücksurkunden und gesellschaftliche Beziehungen und schufen ein außerordentlich detailliertes Bild der osmanischen Gesellschaft. Das Kadi-System erstreckte die Rechtsstaatlichkeit – osmanisches Recht – bis in jeden Winkel des Reiches."
 som_tur_sufi_culture: "Die Sufi-Kultur"
 som_tur_sufi_culture_desc: "Sufi-Orden (Tarikas) waren in das Gewebe der osmanischen Gesellschaft eingewoben. Der Mevlevi-Orden – berühmt für seine tanzenden Derwische – wurde vom Hof gefördert. Der Bektaschi-Orden – geistliches Rückgrat der Janitscharen. Der Naqschbandi-Orden – einflussreich in der Palastpolitik. Sufische Mystik prägte osmanische Dichtung, Musik und Kunst und bot ein geistiges Gegengewicht zur rechtsförmigen Auslegung des Islam."
 som_tur_cultural_synthesis: "Kulturelle Synthese"
 som_tur_cultural_synthesis_desc: "Das Osmanische Reich nahm die Kulturen, die es eroberte, eher in sich auf, als sie zu zerstören. Byzantinische Verwaltungssysteme, arabische Gelehrsamkeit, persische Hofkultur und türkische Kriegertradition verschmolzen zu einer eigenständigen „osmanischen Zivilisation“. Diese kulturelle Synthese war nicht bloß schmückendes Beiwerk – sie war die Regierungsphilosophie des Reiches, die es ihm erlaubte, die Kräfte Dutzender eroberter Völker aufzunehmen und zu nutzen."
 som_tur_bursa_silk_industry: "Bursas Seidenindustrie"
 som_tur_bursa_silk_industry_desc: "Bursa, die erste osmanische Hauptstadt, entwickelte sich seit dem 14. Jahrhundert zur Seidenhauptstadt des Reiches. Handwerker, die zuvor unter byzantinischer Förderung gearbeitet hatten, fanden neue Auftraggeber am osmanischen Hof und erzeugten Luxusseide für den Export nach Europa und in den Nahen Osten. „Stadt der Seide“ wurde zu Bursas Identität – ein wirtschaftlicher Erfolg, der die osmanische Ausdehnung mitfinanzierte."
 som_tur_silk_road: "Die Seidenstraße"
 som_tur_silk_road_desc: "Trapezunt war der westliche Endpunkt der Handelsroute über das Kaspische Meer – der Kanal, durch den Seide, Gewürze und Luxusgüter Zentralasiens nach Anatolien gelangten. Die Beherrschung dieser Hafenstadt gab den Osmanen einen Würgegriff auf den Überlandhandel zwischen Asien und Europa. Allein die Einkünfte aus dem durch Trapezunt fließenden Handel halfen, kaiserliche Ambitionen über Generationen zu finanzieren."
 som_tur_ankara_prosperity: "Der Wohlstand Ankaras"
 som_tur_ankara_prosperity_desc: "Ankara war die zentralanatolische Drehscheibe des Überlandhandels – eine Stadt, die Kaufleuten seit Jahrtausenden diente. Ihre Angorawolle brachte die Luxusfaser hervor, deren Name (Angora, später Ankara) zum Sinnbild der Weichheit wurde. Färbepflanzen, Wollverarbeitung und ihre Lage auf dem Weg, der Bursa mit Trapezunt verband, machten sie zu einem unentbehrlichen Knoten im osmanischen Handelsnetz."
 som_tur_trade_routes: "Kaiserliche Handelswege"
 som_tur_trade_routes_desc: "Mit der Ausdehnung des Reiches investierten die Osmanen in Karawansereien (Straßenherbergen), gepflasterte Straßen, Brücken und Flottenpatrouillen gegen Piraten. Das Ergebnis war eine Handelsinfrastruktur, die Überland- und Seehandel sicherer und gewinnbringender machte, als es seit der Blütezeit des Römischen Reiches der Fall gewesen war. Konstantinopel im Mittelpunkt eines strahlenförmigen Handelsnetzes wurde zum schlagenden wirtschaftlichen Herzen dreier Kontinente."
 som_tur_commercial_empire: "Handelsreich"
 som_tur_commercial_empire_desc: "Aleppo, Alexandria, Konstantinopel – drei der größten Handelsstädte der Welt, nun alle osmanisch. Die Gewürze Indiens, die Seiden Chinas, das Silber Europas – alles ging auf seinem Weg vom Erzeuger zum Verbraucher durch osmanische Hände. Das Reich nahm von jeder Transaktion seinen Anteil. Selbst als die Portugiesen den Seeweg um Afrika eröffneten, behielten osmanische Zwischenhändler noch ein weiteres Jahrhundert lang gewaltigen kommerziellen Einfluss."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "Das Janitscharenkorps"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "Die Janitscharen – Elitefußvolk, gebildet aus bekehrten christlichen Knaben – wurden zum Rückgrat des osmanischen Heeres. Ihre unverwechselbaren weißen Mützen und blauen Uniformen waren der gefürchtetste Anblick auf den Schlachtfeldern des 15. Jahrhunderts. Ihre Rolle beim Fall Konstantinopels war entscheidend."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "Das Devschirme-System"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "Die Devschirme schuf eine Beamtenklasse, die allein dem Sultan treu war, ungebunden von Familien- oder Stammesbindungen. Dieses (nach osmanischen Maßstäben) leistungsbezogene System erlaubte Männern niederer christlicher Herkunft, zu den höchsten Ämtern des Reiches aufzusteigen – während es dem Sultan zugleich stets eine alternative Machtbasis zum etablierten türkischen Adel sicherte."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "Die Elitegarde"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "Ausgewählt aus den besten Janitscharen, war die persönliche Garde des Sultans die disziplinierteste Truppe des Reiches. Sie verkörperte nicht nur militärische Macht, sondern die symbolische Autorität des Sultanats – ihre Anwesenheit im Feldzug war eine Aussage, dass die Person des Sultans zugegen war, selbst wenn er es nicht war."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "Kanun-Gesetzbuch"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "Der Kanun – weltliches osmanisches Recht – wirkte neben der Scharia und schuf ein duales Rechtssystem für Steuern, Strafverfahren und Verwaltung. Die gesetzgeberische Autorität des Sultans, weltliches Recht zu schaffen, war eine theologische Neuerung, die dem osmanischen Staat eine Flexibilität verlieh, die rein scharia-basierten Staatswesen fehlte."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "Das kaiserliche Heer"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "Das voll entwickelte osmanische Heer – das Janitscharenfußvolk, Sipahi-Reiterei und den ausgefeiltesten Artillerietross der Welt vereinend – war das militärische Wunder des 16. Jahrhunderts. Seine Verbindung aus Disziplin, Feuerkraft und logistischer Organisation machte es zu Feldzügen in einem Maßstab fähig, den keine europäische Macht erreichen konnte."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "Das Timar-System"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "Indem sie erobertes Land als nicht erbliche Timare an Sipahi-Reiter im Austausch für Kriegsdienst vergaben, finanzierten die Osmanen ihr Heer, ohne die Schatzkammer zu erschöpfen. Der Sultan behielt das letzte Eigentum an allem Timar-Land und gab ihm damit einen Hebel über den Militärstand, um den ihn europäische Monarchen nur beneiden konnten."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "Sipahi-Reiterei"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "Die gepanzerten Sipahi-Reiter, finanziert durch Timar-Vergaben, waren im 15. und 16. Jahrhundert die primäre Stoßkraft des osmanischen Heeres. Ihre donnernden Angriffe zerschmetterten Heere vom Balkan bis zur persischen Grenze. Als das Reich reifte, wurde der Sipahi-Stand zu einem mächtigen Provinzadel mit eigenen politischen Interessen."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "Das Eyalet-System"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "Das Eyalet-System – mit einem vom Sultan ernannten Beylerbeyi, der jede große Provinz regierte – erstreckte die osmanische Verwaltungsreichweite über einen gewaltigen geografischen Raum. Jedes Eyalet war faktisch ein Reich im Kleinen, mit eigenem militärischem Kontingent, eigener Schatzkammer und eigenem Hof, der Mittel und Truppen an das Zentrum lieferte."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "Der Großwesir"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "Der Amtssitz des Großwesirs – die Hohe Pforte – wurde zu der Adresse, an der europäische Botschafter osmanische Diplomatie betrieben. Der von ihm geleitete Diwan war das politikgestaltende Organ des Reiches. Ein fähiger Großwesir konnte das Reich jahrzehntelang wirksam führen; ein unfähiger konnte es an den Rand des Zusammenbruchs bringen."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "Kaiserliche Bürokratie"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "Die osmanische Schreibkultur erzeugte eine papierne Aufzeichnung von erstaunlicher Menge und Genauigkeit. Grundbücher, Steuererhebungen, Gerichtsakten und kaiserliche Erlasse schufen eine Verwaltungsinfrastruktur, die das Osmanische Reich zu einem der bestdokumentierten Staaten der vormodernen Geschichte machte."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "Die Süleymaniye-Moschee"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "Sinans Meisterwerk verkündete der Welt, dass die Osmanen zugleich Erben Roms, Byzanz’ und der höchsten islamischen Zivilisation waren. Ihre Kuppel wetteiferte mit der Hagia Sophia in der Silhouette Istanbuls – ein bewusster architektonischer Dialog zwischen dem alten christlichen Reich und dem neuen muslimischen."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "Der Topkapı-Palast"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "Topkapı war das Nervenzentrum eines Reiches, das drei Kontinente umspannte. Jeder Sultan wurde hier gekrönt; jeder Feldzug begann an seinen Toren; jeder Großwesir diente nach seinem Willen. Der Harem innerhalb seiner Mauern prägte über Jahrhunderte die Nachfolgepolitik."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "Die Autorität der Ulema"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "Die Ulema verliehen dem osmanischen Staat seine religiöse Legitimität. Ihre Billigung der Kriege des Sultans als Dschihad, ihre Verwaltung des Scharia-Gerichtssystems und ihre Besetzung des Madrasa-Bildungsnetzes machten sie zu unentbehrlichen Partnern der osmanischen Regierung."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "Das Millet-System"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "Organisierter religiöser Pluralismus – Christen, Juden und Muslime, die unter einem einzigen kaiserlichen Dach lebten und je ihre eigenen Gemeinschaftsangelegenheiten regierten – war die osmanische Lösung des Problems, ein vielfältiges Reich zu regieren. Es war keine Gleichheit, aber eine Form des Zusammenlebens, die das Reich über Jahrhunderte trug."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "Die Kadi-Gerichte"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Kadi-Gerichte erstreckten die osmanische Rechtsstaatlichkeit in jeden Winkel des Reiches, von Istanbul bis zu entlegenen anatolischen Dörfern. Die von ihnen erzeugten Sicil-Aufzeichnungen sind ein Schatz für Historiker: Zehntausende Bände, die Grundstücksstreitigkeiten, Eheschließungen, Handelsverträge und Strafsachen über Jahrhunderte dokumentieren."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "Die Sufi-Kultur"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "Sufi-Orden verliehen dem osmanischen religiösen Leben eine geistliche Tiefe, die das formal-rechtliche Islam nicht bieten konnte. Die wirbelnden Mevlevis, die kriegerischen Bektaschis, die politisch verbundenen Naqschbandis – jeder Orden nahm eine eigene Nische in der osmanischen Gesellschaft ein, und zusammen webten sie ein Netz geistlicher Gemeinschaft über das gesamte Reich."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Kulturelle Synthese"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "Das osmanische Talent, eher aufzunehmen als zu zerstören, machte das Reich zu einem kulturellen Schwamm. Byzantinische Verwaltungskunst, persische Literaturkultur, arabische Wissenschaftstradition und türkische Kriegerenergie flossen alle zusammen zu etwas, das unverwechselbar – und großartig – osmanisch war."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "Bursas Seidenindustrie"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Bursa wurde zur Seidenhauptstadt des Reiches – eine Rolle, die es über Jahrhunderte behielt. Die Handwerker der Stadt erzeugten Luxusseide, die sowohl die Höfe Europas als auch des Nahen Ostens schmückte, und ihre Einkünfte halfen, die Feldzüge zu finanzieren, die das Reich errichteten."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "Kaiserliche Handelswege"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Karawansereien, Straßen und die Unterdrückung der Piraterie belebten den Handel im Reich. Ein strahlenförmiges Handelsnetz um Konstantinopel brachte wirtschaftliche Integration."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "Stadt der Sehnsucht der Welt"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "Istanbul – rittlings auf zwei Kontinenten, den einzigen Durchgang zwischen Schwarzem Meer und Mittelmeer beherrschend – war die Stadt, nach der sich die ganze Welt sehnte. Ihre Bevölkerung, ihr Handel, ihre Baukunst und ihre politische Bedeutung machten sie zur unbestrittenen Hauptstadt der bekannten Welt."
 som_ottoman_events.50.t: "Stadt der Sehnsucht der Welt"
 som_ottoman_events.50.d: "Konstantinopel – Istanbul – ist wahrhaft und vollständig zur Stadt geworden, nach der sich die ganze Welt sehnt. Mit einer halben Million Einwohnern ist sie die größte Stadt Europas und des Nahen Ostens zusammen. Sie rittelt auf zwei Kontinenten. Sie beherrscht den einzigen Seedurchgang zwischen Schwarzem Meer und Mittelmeer. Die anmutige Silhouette der Süleymaniye-Moschee und die gebieterische Höhe des Topkapı-Palastes spiegeln sich in den Wassern des Bosporus. In ihren Höfen wetteifern Dichter mit Philosophen, und Architekten mit Wissenschaftlern. Die osmanische Zivilisation hat ihren Gipfel erreicht. Diese Stadt wird tausend Jahre lang erstrahlen."
 som_ottoman_events.50.a: "Lass Istanbul tausend Jahre lang erstrahlen!"
 som_ottoman_events.50.breadbasket_tt: "Das Stadtrecht „Osmanische Kaiserliche Kornkammer“ ist nun verfügbar. Es kann Orten mit Stadtrang oder höher verliehen werden, die einen Kornspeicher der Stufe 5 oder höher besitzen."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Die Entwicklung Kostantiniyyes"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "Unter Mehmeds II. Befehl gehen Umsiedlung und Wiederaufbau weiter; die Stimmen neuer Bewohner füllen die Märkte, und wiederhergestelltes Mauerwerk verleiht der ehemaligen kaiserlichen Stadt neuen Glanz."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "Der Glanz Kostantiniyyes"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "Rund um das Goldene Horn entstehen neue Werkstätten, Karawansereien und Viertel; Siedler und Handwerker strömen in die Stadt, und das Hinterland trägt mehr ein als je zuvor. Die Hauptstadt des Sultans überstrahlt wieder jede Stadt der bekannten Welt."
 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Trapezunt – Tor der Seidenstraße"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "Im Hafen von Trapezunt an der südlichen Schwarzmeerküste türmen sich die Lasten der Karawanen, die von Zentralasien und dem Kaspischen Meer die Seidenstraße herabkamen, hoch auf und warten auf Schiffe, die zum Mittelmeer bestimmt sind."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "Handelsreich"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Aleppo, Alexandria, Konstantinopel – der Reichtum dreier Kontinente fließt nun durch die Märkte des Sultans."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "Der Große Basar"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "Entlang der überdachten Straßen des Kapalıçarşı verstummen die Rufe der Goldschmiede und Gewürzhändler nie, und die Waren der ganzen Welt versammeln sich hier."
 som_ottoman_events.19.t: "Das kommerzielle Schicksal Smyrnas"
 som_ottoman_events.19.d: "Smyrna (İzmir) ist die größte Hafenstadt an der östlichen Ägäisküste – das Tor, das Anatoliens Hinterland mit der Mittelmeerwelt verbindet. Griechische Kolonisten gründeten sie in der Antike; nun gehört sie den Osmanen. Der Sultan muss die künftige Ausrichtung der Stadt bestimmen: sie als blühende Handelsdrehscheibe entwickeln, die Kaufleute aus der ganzen bekannten Welt anzieht, oder in den Schiffbau investieren, um osmanische Macht über die Ägäis zu projizieren?"
 som_ottoman_events.19.a: "Smyrnas Kaufmannsviertel entwickeln und zu einem Handelszentrum machen"
 som_ottoman_events.19.b: "Eine Werft in Smyrna erbauen und als Marinestützpunkt für die Ausdehnung in der Ägäis nutzen"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Herrschaft über Anatolien"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "Von Konya bis Trapezunt erreichen die Steuereintreiber und Beamten des Sultans die Dörfer Anatoliens, und die kaiserliche Herrschaft erstreckt sich bis in jeden Winkel der Hochebene."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Vorherrschaft auf der Krim"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Blickt man vom Hafen Kaffas über das Schwarze Meer, durchschneiden nur Schiffe unter osmanischer Flagge die Wellen. Das Schwarze Meer wird zu einem „osmanischen Binnensee“."
 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "Die Gelehrsamkeit Aleppos"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Aleppo gehörte zu den großen geistigen Zentren der islamischen Welt. Berühmte Madrasas, Bibliotheken und Gelehrte, die sich hier konzentrierten, bringen dem Osmanischen Reich einen Zustrom arabischer Gelehrtentradition."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "Die Gelehrsamkeit von Damaskus"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Damaskus trägt das angesammelte geistige Erbe der Umayyaden-, Abbasiden- und Mamluken-Zeit. Unter osmanischer Herrschaft wächst dieses reiche Erbe weiter."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Nachfolger des Kalifats"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "Der Name des Sultans, nun Hüter der heiligen Stätten, wird von den Kanzeln als Kalif angerufen."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Ägäische Schiffbautechniken"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Schiffbauer von den Ägäischen Inseln bringen die über Generationen weitergegebenen Handwerke zu den Werften Istanbuls, und Kiel um Kiel wird gelegt."
 som_ottoman_events.61.t: "Die Schlacht von Marj Dabiq"
 som_ottoman_events.61.d: "1516 vernichtete Sultan Selim I. das mamlukische Heer des Sultans Qansuh al-Ghawri auf den Ebenen von Marj Dabiq. Qansuh selbst fiel auf dem Feld; ganz Syrien ging in osmanische Hände über. Mit besetztem Kairo liegt das Schicksal des Mamlukensultanats in osmanischer Hand."
 som_ottoman_events.61.a: "Das Mamlukensultanat durch verhandelten Frieden als Eyalet einverleiben"
 som_ottoman_events.61.b: "Frieden schließen und ihm die Unabhängigkeit belassen"
 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Edirne – Handelsdrehscheibe"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Edirne (Hadrianopolis) ist das Handelszentrum Rumeliens. Diese Stadt, die den Balkan und Anatolien verbindet, wird als Erzeugungsdrehscheibe für Farbstoffe, Seide und feinen Stoff entwickelt und stützt die frühe osmanische Finanzbasis."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "Die Silberminen von Novo Brdo"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Novo Brdo („Neuer Hügel“) besitzt die größten Silberminen des Balkans. Selbst nach der osmanischen Eroberung in den 1450er Jahren bereicherten seine reichen Minen weiterhin die kaiserliche Schatzkammer. Auch monatlicher Wohlstand und Bevölkerungswachstum werden gesteigert."
 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "Die ungarische Mark"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "Mit gefallenem Buda spüren osmanische Soldaten, die über die Donau nach Wien vordringen, selbst im Nachglanz des Sieges den Beginn eines langen Krieges mit den Habsburgern."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "Herrschaft über die italienische Halbinsel"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "Das Halbmondbanner weht über den Plätzen Roms, Florenz’ und Mailands, und die Bewohner der Städte der Renaissance beginnen, die Sprache ihrer neuen Herrscher zu lernen."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Herrschaft über den Maghreb"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "Die in den Häfen von Tunis und Algier versammelten Barbareskenkorsarenschiffe blicken nun als Flügel der Flotte des Sultans über das westliche Mittelmeer."
 som_tur_silk_road_revival: "Wiederbelebung der Seidenstraße"
 som_tur_silk_road_revival_desc: "Täbriz war die westlichste Drehscheibe der Seidenstraße – die Hauptstadt des Ilkhanats, die einst Persien und Zentralasien mit der Mittelmeerwelt verband. Die Einnahme dieser Stadt gibt dem Osmanischen Reich unmittelbare Kontrolle über den Fluss von Seide, Gewürzen und Edelsteinen aus Asien. Das gewaltige Handelsnetz, das das Schwarze Meer mit Zentralasien verbindet, belebt sich neu und steigert die kaiserliche Handelsmacht erheblich."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "Wiederbelebung der Seidenstraße"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "Von den Märkten von Täbriz ziehen Karawanen, beladen mit chinesischer Seide, wieder auf der Straße nach Istanbul, und die Seidenstraße hat ihre Geschäftigkeit zurückgewonnen."
 som_tur_city_of_worlds_desire_desc: "Istanbul – wahrhaft die Stadt, nach der sich die Welt sehnt. Mit einer Bevölkerung von über einer halben Million ist sie der unbestrittene Angelpunkt des Welthandels. Während diese große Stadt ihren vollen Glanz erreicht, wird das alte byzantinische Recht der Kaiserlichen Kornkammer auch dem Osmanischen Reich verfügbar."
 som_tur_true_rome: "Wahres Reich Roms"
 som_tur_true_rome_desc: "Der Balkan, Anatolien, die arabische Welt, Ägypten, Nordafrika, Italien – nahezu alle Lande, die einst Rom beherrschte, tragen nun das osmanische Banner. Mehmed II. beanspruchte nach dem Fall Konstantinopels den Titel des Kaisers (Kayser). Nun steht das Osmanische Reich als der wahre Nachfolger Roms da – Erbe seiner Straßen, seiner Gesetze, seiner Zivilisation. Belebe das Corpus Juris Justinians neu, erweitere das Aquäduktsystem und binde ein gewaltiges Reich unter einem Gesetz und einer Kultur zusammen."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "Wahres Reich Roms"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Unter einem Reich, das den Mantel Roms beansprucht, werden die Straßen ausgebessert, die Aquädukte erweitert und das Gesetzbuch Justinians als Recht eines neuen Zeitalters wiederbelebt."
 som_ottoman_mission_pack: "Der Aufstieg des Osmanischen Reiches"
 som_ottoman_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist das osmanische Gemeinwesen ein kleines anatolisches Beylik um Bursa, Iznik und Izmit. Binnen weniger Generationen wird es sich in ein Reich verwandeln, das sich vom Balkan bis Arabien, von der Krim bis Nordafrika und Italien erstreckt. Trage den Ghazi-Geist auf den Balkan, zwinge Konstantinopel in die Knie, verwirkliche das goldene Zeitalter Süleymans des Prächtigen – und beanspruche selbst den Mantel des wahren Rom."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "Erobere als Osmane den Balkan, Anatolien, die arabische Welt und das Mittelmeer; errichte solide innere Einrichtungen und erreiche das Zeitalter Süleymans."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um den Aufstieg des Osmanischen Reiches zu erfüllen."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "Von einem kleinen Beylik im Jahr 1337 zum größten Reich der Welt!"
