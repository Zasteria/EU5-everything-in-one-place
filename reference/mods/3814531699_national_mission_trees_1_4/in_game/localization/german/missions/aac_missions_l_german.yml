l_german:
 aac_carolingian_legacy_mission_pack: "Das karolingische Erbe – die Wiederherstellung des Frankenreiches"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist Aachen eine freie Stadt im Heiligen Römischen Reich, deren Bürgermeister ein Nachkomme der Karolinger ist. Von dieser Stadt aus, einst Sitz des Hofes Karls des Großen (742–814), gewinne den Glanz des Frankenreiches zurück. Vereine Rhein, Gallien und Flandern und herrsche als „Kaiser des Westens“ mit päpstlicher Krönung."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Vereine als Aachen Rhein, Gallien und Italien, um das Weströmische Reich wiederherzustellen."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Frankenreich wiederherzustellen."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "Vom Thron Karls des Großen zum Weströmischen Reich!"
 aac_throne_of_charlemagne: "Der Thron Karls des Großen"
 aac_throne_of_charlemagne_desc: "Der Aachener Dom – auf Karls Geheiß erbaut und Ort seiner Krönung zum weströmischen Kaiser im Jahr 800 – ist in karolingische Hände zurückgekehrt. Herrsche über Aachen, einst Mittelpunkt der abendländischen Zivilisation, und tu den ersten Schritt zur Wiederherstellung des Frankenreiches."
 aac_control_rhineland: "Den Rhein beherrschen"
 aac_control_rhineland_desc: "Köln, Trier, Mainz – die drei großen Erzbischofsstädte am Rhein waren wirtschaftlicher, religiöser und politischer Mittelpunkt des Frankenreiches. Sie in Besitz zu nehmen, bringt den gesamten Rhein zurück in karolingische Hände."
 aac_integrate_lorraine: "Lothringen eingliedern"
 aac_integrate_lorraine_desc: "Lothringen (Lotharingien) entstand als Mittelzone, als der Vertrag von Verdun (843) das Frankenreich unter Karls Enkeln aufteilte. Metz und Verdun zurückzugewinnen, gliedert den Kern des Frankenreiches, wie er vor der Teilung bestand, wieder ein."
 aac_conquer_hre: "Herr des Heiligen Römischen Reiches"
 aac_conquer_hre_desc: "Aachen war einst Krönungsort der Kaiser des Heiligen Römischen Reiches. Wer als Herr des Reiches dasteht, beansprucht Karls kaiserliches Erbe am rechtmäßigsten."
 aac_control_flanders: "Flandern beherrschen"
 aac_control_flanders_desc: "Flandern ist Mittelpunkt der größten Wolltuchindustrie Europas. Nimm Brüssel und Lüttich in Besitz und nutze Flanderns reiche Handels- und Gewerbekraft, um das Frankenreich wiederherzustellen."
 aac_brabant_trade: "Der Brabanter Handel"
 aac_brabant_trade_desc: "Das größte Handelsnetz der Niederlande breitet sich von der Handelsstadt Brüssel im Herzogtum Brabant aus. Die Kontrolle dieses Netzes stärkt das finanzielle Fundament des Frankenreiches erheblich."
 aac_push_into_france: "Marsch auf Paris"
 aac_push_into_france_desc: "Karl der Große herrschte als König der Franken über ganz Gallien einschließlich Paris. Paris zurückzuerobern rächt die Dynastie der Valois und belebt die karolingische Herrschaft über Gallien neu."
 aac_conquer_northern_france: "Nordfrankreich erobern"
 aac_conquer_northern_france_desc: "Reims ist der Krönungsort des Frankenreiches – in der Tradition Chlodwigs I., der hier getauft wurde, unterwirf die Normandie und die Picardie und errichte die vollständige Vorherrschaft über das nördliche Gallien."
 aac_conquer_burgundy: "Burgund erobern"
 aac_conquer_burgundy_desc: "Burgund spielte als weinreiches, fruchtbares Land eine wichtige Rolle im Frankenreich. Es zu unterwerfen, öffnet den Weg nach Südfrankreich."
 aac_conquer_southern_france: "Südfrankreich erobern"
 aac_conquer_southern_france_desc: "Unterwirf das Languedoc und die Gascogne, und das südliche Gallien kehrt in karolingische Hände zurück. Das Reich bis zu den Pyrenäen auszudehnen, verwirklicht die vollständige Herrschaft über Gallien, die Karl anstrebte."
 aac_reunite_gaul: "Gallien wiedervereinen"
 aac_reunite_gaul_desc: "Ganz Gallien – die Lande, die einst Karl der Große beherrschte – vereint unter dem Banner des Frankenreiches. Das durch den Vertrag von Verdun in drei Teile gespaltene Reich ist zum ersten Mal seit 500 Jahren wiedervereint."
 aac_develop_aachen: "Aachen entwickeln"
 aac_develop_aachen_desc: "Entwickle diese altehrwürdige Stadt um den Aachener Dom und lass sie als neue Hauptstadt des Frankenreiches wirken. Von diesem Ort, an dem Karls Vermächtnis ruht, strahlt Licht für den Wiederaufbau Westeuropas aus."
 aac_frankish_law: "Das fränkische Gesetzbuch"
 aac_frankish_law_desc: "Karl der Große entwickelte das Rechtswesen des Frankenreiches durch die Kapitularien (Erlasssammlung). Diese Tradition fortzuführen und ein neues fränkisches Gesetzbuch zu schaffen, legt das rechtliche Fundament des Reiches."
 aac_missi_dominici: "Missi dominici"
 aac_missi_dominici_desc: "Das von Karl dem Großen eingeführte System der Missi dominici (Königsboten) – königliche Gesandte, die im ganzen Reich die örtliche Verwaltung überwachen. Dieses System wiederzubeleben, ermöglicht die zentrale Regierung des riesigen Reiches."
 aac_carolingian_renaissance: "Karolingische Renaissance"
 aac_carolingian_renaissance_desc: "Karl der Große förderte die „Karolingische Renaissance“, indem er Gelehrte wie Alkuin und Einhard an seinen Hof lud. Belebe den Aachener Hof als Zentrum von Kultur und Gelehrsamkeit neu und führe die Erneuerung der abendländischen Zivilisation an."
 aac_trade_empire: "Handelsreich"
 aac_trade_empire_desc: "Das Frankenreich, das die Handelswege von Rhein, Maas und Schelde beherrscht, wird zur größten Handelsnation Westeuropas. Errichte die Vorherrschaft im Handel mit mehreren Marktzentren und reichen Einkünften."
 aac_frankish_levy: "Das fränkische Aufgebotswesen"
 aac_frankish_levy_desc: "Karls fränkisches Heer war das stärkste Europas. Belebe das Aufgebotswesen (Heerbann) neu und errichte die Wehrkraft des Frankenreiches wieder auf, mit einer breiten Heeresorganisation von Bauernkriegern bis zu Rittern."
 aac_palatine_guard: "Die Pfalzgarde"
 aac_palatine_guard_desc: "Die Pfalzgarde, die dem Kaiser zur Seite steht – eine Elitetruppe in der Tradition der Palastwache Karls des Großen – verkörpert den militärischen Ruhm des Frankenreiches."
 aac_carolingian_cavalry: "Karolingische Reiterei"
 aac_carolingian_cavalry_desc: "Das Herzstück von Karls militärischem Erfolg war mächtige Reiterei. Baue die legendäre berittene Streitmacht wieder auf, mit der schwer gepanzerte Ritter (Chevaliers) das Schlachtfeld beherrschten und Sachsen, Awaren und Muslime besiegten."
 aac_kingdom_of_franks: "Das Frankenreich wiederhergestellt"
 aac_kingdom_of_franks_desc: "Gallien wiedervereint, Lothringen eingegliedert, Missi dominici eingerichtet – die drei Säulen fügen sich, und das Frankenreich ist endlich wiederhergestellt. Zum ersten Mal seit 800 weht das karolingische Banner vom Rhein bis zu den Pyrenäen."
 aac_papal_alliance: "Päpstliches Bündnis"
 aac_papal_alliance_desc: "An Weihnachten des Jahres 800 setzte Papst Leo III. in der Peterskirche zu Rom Karl dem Großen die Krone des weströmischen Kaisers auf. Führe diese Tradition fort, schmiede ein festes Bündnis mit dem Papst und begründe deine Legitimität als „Stellvertreter Gottes“."
 aac_conquer_italy: "Italien erobern"
 aac_conquer_italy_desc: "Karl der Große eroberte 774 das Langobardenreich und erwarb den Titel eines Königs von Italien. Rom in Besitz zu nehmen, vollendet den Weg zur Wiederkehr des „weströmischen Kaisers“ mit päpstlicher Billigung."
 aac_western_roman_empire: "Wiederherstellung des Weströmischen Reiches"
 aac_western_roman_empire_desc: "Aachen, Paris, Rom – die drei Städte des Weströmischen Reiches unter dem karolingischen Banner wiedervereint. Das Reich, das Karl im Jahr 800 schuf, ersteht in der Neuzeit neu, und „Renovatio Imperii Romani“ (Erneuerung des Römischen Reiches) ist erfüllt."
 aac_alsace_swabia: "Elsass und Schwaben"
 aac_alsace_swabia_desc: "Elsass und Schwaben am östlichen Rheinufer sind ein wichtiger Teil des Frankenreiches. Dieses Land zwischen Vogesen und Alpen in Besitz zu nehmen, vollendet die Herrschaft über den Rhein."
 aac_champagne_fairs: "Die Champagne-Messen"
 aac_champagne_fairs_desc: "Die regelmäßigen Messen (foires) der Champagne waren Europas größte Handelstreffen. Die Kontrolle dieses Treffpunkts italienischer, flämischer und deutscher Kaufleute begründet die fränkische Vorherrschaft im Handel."
 aac_conquer_brittany: "Die Bretagne erobern"
 aac_conquer_brittany_desc: "Die Bretagne ist das Land der keltischen Bretonen – selbst Karl der Große konnte diese zähe Region nicht vollständig unterwerfen. Die Eroberung dieses westlichen Außenpostens bringt das westliche Gallien vollständig unter fränkische Kontrolle und sichert einen Zugang zum Atlantik."
 aac_holy_crown: "Die Heilige Krone"
 aac_holy_crown_desc: "Tiefes Vertrauen zum Papsttum und hohe Legitimität – als „Stellvertreter Christi“ bestätigt der Papst die Autorität des fränkischen Königs. Eine von Gott und den Menschen anerkannte Herrschaft ist begründet."
 aac_dev_reims: "Reims entwickeln"
 aac_dev_reims_desc: "Reims ist die Taufstätte des fränkischen Volkes – hier empfing Chlodwig I. die christliche Taufe, und seither finden hier die französischen Krönungen statt. Diese heilige Stadt weiterzuentwickeln, stärkt die karolingische Legitimität."
 aac_dev_paris: "Paris entwickeln"
 aac_dev_paris_desc: "Paris, um die Seineinsel (Île de la Cité) gelegen, ist Galliens größte Stadt. Sie als westliche Hauptstadt des Frankenreiches zu entwickeln, schafft ein Zweihauptstädtesystem aus Aachen und Paris, das das Frankenreich trägt."
 aac_bretagne_fleet: "Die bretonische Flotte"
 aac_bretagne_fleet_desc: "Die Seefahrtstraditionen der Bretagne und Flanderns vereinen sich, sodass das Frankenreich nun eine mächtige Flotte besitzt, die Atlantik und Nordsee gleichermaßen beherrscht."
 aac_events.20.t: "Paris fällt – Rückkehr der Karolinger"
 aac_events.20.d: "Das Banner der Valois wird von den Mauern von Paris gerissen und durch den Adler des Frankenreiches ersetzt. Während die Glocken von Notre-Dame läuten, zieht der Nachkomme des karolingischen Bürgermeisters in Paris ein. „Der Erbe Karls des Großen ist zurückgekehrt“ – so werden die Geschichtsschreiber es festhalten."
 aac_events.20.a: "Es lebe Paris! Erhebt das karolingische Banner hoch!"
 aac_events.40.t: "Gallien wiedervereint – die Rückkehr des Frankenkönigs"
 aac_events.40.d: "Vom Rhein bis zu den Pyrenäen, von Flandern bis zur Provence – ganz Gallien vereint unter dem Banner des Frankenreiches. Das im Jahr 843 durch den Vertrag von Verdun in drei Teile gespaltene Reich ist nach 500 Jahren wiedervereint. „Dieu le veut“ (Gott will es) – rufen die im Dom versammelten Menschen."
 aac_events.40.a: "Es lebe Gallien! Das Frankenreich ist ewig!"
 aac_events.50.t: "Verkündung der Wiederherstellung des Frankenreiches"
 aac_events.50.d: "Gallien wiedervereint, Lothringen eingegliedert, Missi dominici eingerichtet – die drei Säulen des Frankenreiches sind vollendet. Im Aachener Dom findet die Krönung eines fränkischen Königs statt, und zum ersten Mal seit Karl dem Großen ist ein fränkischer Kaiser geboren. „Im Namen von Carolus Magnus Rex Francorum (Karl der Große, König der Franken) verkünden wir das Reich.“"
 aac_events.50.a: "Es lebe das Frankenreich! Der karolingische Glanz ist wiedergeboren – färbt unsere Farben in das Blau Frankreichs!"
 aac_events.99.t: "Wiederherstellung des Weströmischen Reiches"
 aac_events.99.d: "Aachen, Paris, Rom – drei Städte, wiedervereint unter dem karolingischen Banner. Der legendäre Augenblick, als Papst Leo III. an Weihnachten 800 Karl dem Großen die Krone aufsetzte, wird in der Neuzeit nachgestellt. „Renovatio Imperii Romani“ – diese Worte sind für immer in die Geschichte eingemeißelt. Wirst du die Farbe des Reiches in das karolingische Karminrot ändern?"
 STATIC_MODIFIER_NAME_aac_rhineland_mod: "Herrschaft über den Rhein"
 STATIC_MODIFIER_DESC_aac_rhineland_mod: "Die drei großen Erzbischofsstädte am Rhein sind in Besitz genommen – das wirtschaftliche und religiöse Zentrum des Frankenreiches ist wiederbelebt."
 STATIC_MODIFIER_NAME_aac_lorraine_mod: "Lothringen eingegliedert"
 STATIC_MODIFIER_DESC_aac_lorraine_mod: "Das durch den Vertrag von Verdun abgespaltene Lothringen ist wiedereingegliedert. Das Sinnbild der fränkischen Reichsteilung ist aufgelöst."
 STATIC_MODIFIER_NAME_aac_hre_master_mod: "Herr des Heiligen Römischen Reiches"
 STATIC_MODIFIER_DESC_aac_hre_master_mod: "Als Herr des Reiches wird Karls kaiserliches Erbe rechtmäßig beansprucht."
 STATIC_MODIFIER_NAME_aac_flanders_mod: "Herrschaft über Flandern"
 STATIC_MODIFIER_DESC_aac_flanders_mod: "Flandern, Europas größtes Zentrum der Wolltuchindustrie, fällt in fränkische Hände."
 STATIC_MODIFIER_NAME_aac_brabant_mod: "Der Brabanter Handel"
 STATIC_MODIFIER_DESC_aac_brabant_mod: "Das Handelsnetz der Niederlande bereichert die Finanzen des Frankenreiches."
 STATIC_MODIFIER_NAME_aac_northern_france_mod: "Nordfrankreich erobert"
 STATIC_MODIFIER_DESC_aac_northern_france_mod: "Normandie und Picardie unterworfen – die vollständige Vorherrschaft über das nördliche Gallien ist errichtet."
 STATIC_MODIFIER_NAME_aac_burgundy_mod: "Burgund erobert"
 STATIC_MODIFIER_DESC_aac_burgundy_mod: "Das weinreiche Burgund ist ins Frankenreich eingegliedert."
 STATIC_MODIFIER_NAME_aac_southern_france_mod: "Südfrankreich erobert"
 STATIC_MODIFIER_DESC_aac_southern_france_mod: "Languedoc und Gascogne unterworfen – das südliche Gallien kehrt in karolingische Hände zurück."
 STATIC_MODIFIER_NAME_aac_gaul_unified_mod: "Gallien wiedervereint"
 STATIC_MODIFIER_DESC_aac_gaul_unified_mod: "Zum ersten Mal seit 843 ist ganz Gallien unter dem Banner des Frankenreiches vereint."
 STATIC_MODIFIER_NAME_aac_aachen_capital_mod: "Aachen – kaiserliche Hauptstadt"
 STATIC_MODIFIER_DESC_aac_aachen_capital_mod: "Aachen, die Hofstadt Karls des Großen, wird als Hauptstadt des Frankenreiches entwickelt."
 STATIC_MODIFIER_NAME_aac_frankish_law_mod: "Das fränkische Gesetzbuch"
 STATIC_MODIFIER_DESC_aac_frankish_law_mod: "Ein fränkisches Gesetzbuch in der Tradition der Kapitularien legt das rechtliche Fundament des Reiches."
 STATIC_MODIFIER_NAME_aac_missi_dominici_mod: "Missi dominici"
 STATIC_MODIFIER_DESC_aac_missi_dominici_mod: "Königliche Gesandte, die im ganzen Reich die örtliche Verwaltung überwachen – zentrale Herrschaft ist verwirklicht."
 STATIC_MODIFIER_NAME_aac_renaissance_mod: "Karolingische Renaissance"
 STATIC_MODIFIER_DESC_aac_renaissance_mod: "Der Aachener Hof ist als Zentrum von Gelehrsamkeit und Kultur der abendländischen Zivilisation wiederbelebt."
 STATIC_MODIFIER_NAME_aac_trade_empire_mod: "Handelsreich"
 STATIC_MODIFIER_DESC_aac_trade_empire_mod: "Das Frankenreich, das die Handelswege von Rhein, Maas und Schelde beherrscht, wird zur größten Handelsnation Westeuropas."
 STATIC_MODIFIER_NAME_aac_frankish_levy_mod: "Das fränkische Aufgebotswesen"
 STATIC_MODIFIER_DESC_aac_frankish_levy_mod: "Karls Heerbann ist wiederbelebt – die Wehrkraft des Frankenreiches ist neu aufgebaut."
 STATIC_MODIFIER_NAME_aac_palatine_mod: "Die Pfalzgarde"
 STATIC_MODIFIER_DESC_aac_palatine_mod: "Die Elitegarde des Kaisers verkörpert den militärischen Ruhm des Frankenreiches."
 STATIC_MODIFIER_NAME_aac_cavalry_mod: "Karolingische Reiterei"
 STATIC_MODIFIER_DESC_aac_cavalry_mod: "Schwer gepanzerte Ritter beherrschen das fränkische Schlachtfeld. Die legendäre Reiterei Karls des Großen ist wiedergeboren."
 STATIC_MODIFIER_NAME_aac_kingdom_of_franks_mod: "Frankenreich wiederhergestellt"
 STATIC_MODIFIER_DESC_aac_kingdom_of_franks_mod: "Der Glanz des Jahres 800 ist in der Neuzeit wiedergeboren. Das karolingische Frankenreich ist offiziell wiederhergestellt."
 STATIC_MODIFIER_NAME_aac_papal_mod: "Päpstliches Bündnis"
 STATIC_MODIFIER_DESC_aac_papal_mod: "Der Papst bestätigt die Autorität des fränkischen Königs. Eine von Gott und den Menschen anerkannte Herrschaft ist begründet."
 STATIC_MODIFIER_NAME_aac_italy_mod: "Italien erobert"
 STATIC_MODIFIER_DESC_aac_italy_mod: "Karls Eroberung der Langobarden wird nachgestellt. Italien einschließlich Roms fällt unter fränkische Herrschaft."
 STATIC_MODIFIER_NAME_aac_western_roman_empire_final_mod: "Weströmisches Reich wiederhergestellt"
 STATIC_MODIFIER_DESC_aac_western_roman_empire_final_mod: "Renovatio Imperii Romani erfüllt. Aachen, Paris und Rom sind unter dem karolingischen Banner wiedervereint."
 STATIC_MODIFIER_NAME_aac_alsace_mod: "Elsass und Schwaben"
 STATIC_MODIFIER_DESC_aac_alsace_mod: "Elsass und Schwaben am östlichen Rhein sind ins Frankenreich eingegliedert."
 STATIC_MODIFIER_NAME_aac_champagne_mod: "Die Champagne-Messen"
 STATIC_MODIFIER_DESC_aac_champagne_mod: "Europas größte regelmäßige Messe trägt die Vorherrschaft des Frankenreiches im Handel."
 STATIC_MODIFIER_NAME_aac_brittany_mod: "Bretagne erobert"
 STATIC_MODIFIER_DESC_aac_brittany_mod: "Das zähe keltische Land der Bretonen ist erobert – der Zugang zum Atlantik ist gesichert."
 STATIC_MODIFIER_NAME_aac_holy_crown_mod: "Die Heilige Krone"
 STATIC_MODIFIER_DESC_aac_holy_crown_mod: "Die von Papst und Gott gebilligte „Heilige Krone“ erstrahlt über dem fränkischen König."
 STATIC_MODIFIER_NAME_aac_reims_mod: "Reims entwickelt"
 STATIC_MODIFIER_DESC_aac_reims_mod: "Die fränkische Taufstätte Reims ist als religiöse Hauptstadt entwickelt."
 STATIC_MODIFIER_NAME_aac_paris_mod: "Paris entwickelt"
 STATIC_MODIFIER_DESC_aac_paris_mod: "Galliens größte Stadt Paris ist als westliche Hauptstadt des Frankenreiches entwickelt."
 STATIC_MODIFIER_NAME_aac_fleet_mod: "Die bretonische Flotte"
 STATIC_MODIFIER_DESC_aac_fleet_mod: "Die Seefahrtstraditionen der Bretagne und Flanderns vereinen sich – das Frankenreich beherrscht Atlantik und Nordsee."
 aac_aachen_megalopolis: "Aachen – Mitteleuropas größte Stadt"
 aac_aachen_megalopolis_desc: "Aachen, die Hofstadt Karls des Großen, ist endlich als Mitteleuropas größte Metropole vollendet. Mit 200.000 Einwohnern, fortgeschrittener Stadtentwicklung und prachtvoller Baukunst ist Aachen als Mittelpunkt der europäischen Zivilisation begründet."
 aac_events.10.t: "Der Thron Karls des Großen – das karolingische Erwachen"
 aac_events.10.d: "Aachen – diese Stadt, in der Karl der Große (742–814) einst Hof hielt und im Jahr 800 zum weströmischen Kaiser gekrönt wurde – ist in karolingische Hände zurückgekehrt. Unter der feierlichen Kuppel des Aachener Doms wartet der marmorne Thron auf die Rückkehr seines Herrn.\n\nDer Traum Karls des Großen, des „Vaters Europas (Pater Europae)“ – ein geeintes christliches Reich vom Rhein bis zu den Pyrenäen, von Rom bis zur Ostsee –, die Zeit ist gekommen, ihn zu verwirklichen. Verkünde die karolingische Restauration und tu den ersten Schritt zum Wiederaufbau des Frankenreiches."
 aac_events.10.a: "Als König der karolingischen Dynastie herrschen – die Monarchie ausrufen"
 aac_events.10.b: "Die Zeit ist noch nicht reif – Kräfte sammeln unter der jetzigen Regierungsform"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Aachen, die Megalopolis"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Soweit die Glocken des Doms tragen, drängen sich in den Gassen die Häuser von Handwerkern, Gelehrten und Kaufleuten – Aachen ist zur ersten Stadt des Abendlandes geworden."
 aac_events.50.b: "Es lebe das Frankenreich! Der karolingische Glanz ist wiedergeboren – unsere traditionellen Farben behalten"
 aac_events.99.a: "Das karminrote Banner erheben – Rom in karolingischen Farben färben (map_ROM)"
 aac_events.99.b: "Die traditionellen Farben behalten – kaiserliche Würde liegt in der Macht, nicht in der Farbe"
