l_german:
 ayy_ayyubid_mission_pack: "Der Neue Saladin und Herr des Nahen Ostens"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "Im Jahr 1337 überlebt die Ayyubiden-Dynastie als kleiner Staat in Nordsyrien. Gewinne den Ruhm Saladins (1138–1193) zurück, der Ägypten, Syrien und Mesopotamien einte und die Kreuzfahrer aus Jerusalem vertrieb. Erobere Ägypten, befreie Jerusalem, nimm Bagdad ein und werde Hüter Mekkas und Medinas, um als Neuer Saladin zu herrschen."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "Erobere Ägypten, die Levante, Mesopotamien und Arabien und herrsche als Herr des Nahen Ostens als Hüter des sunnitischen Islam."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "Herrsche als Neuer Saladin über den Nahen Osten."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "Besiege von einem kleinen Staat in Nordsyrien aus die Kreuzfahrer, gewinne Jerusalem zurück und errichte ein großes nahöstliches Reich!"
 ayy_rise_of_ayyubids: "Der Aufstieg der Ayyubiden"
 ayy_rise_of_ayyubids_desc: "Die Ayyubiden-Dynastie, Erben Saladins, beginnt ihre Wiederherstellung von einem kleinen Staat in Nordsyrien aus."
 ayy_secure_sinai: "Den Sinai sichern"
 ayy_secure_sinai_desc: "Sichere die Sinai-Halbinsel als Tor zwischen Ägypten und der Levante."
 ayy_conquer_lower_egypt: "Die Eroberung Unterägyptens"
 ayy_conquer_lower_egypt_desc: "Erobere das Nildelta und Alexandria, um Ägyptens reiches Kernland einzunehmen."
 ayy_seize_cairo: "Kairo einnehmen"
 ayy_seize_cairo_desc: "Nimm Kairo – die Stadt der tausend Minarette – als ayyubidische Hauptstadt ein."
 ayy_upper_egypt: "Die Eroberung Oberägyptens"
 ayy_upper_egypt_desc: "Erobere Oberägypten bis zu den Katarakten von Assuan und vollende die Beherrschung des Nils."
 ayy_nile_breadbasket: "Die Kornkammer des Nils"
 ayy_nile_breadbasket_desc: "Nutze die fruchtbaren Überschwemmungsebenen des Nils, um das Reich zu ernähren."
 ayy_dev_cairo: "Der Bau der kaiserlichen Hauptstadt Kairo"
 ayy_dev_cairo_desc: "Baue Kairo zur größten Stadt der islamischen Welt aus – kaiserliche Hauptstadt des Ayyubidenreiches."
 ayy_secure_levant: "Die Levante sichern"
 ayy_secure_levant_desc: "Sichere die Levante um Damaskus und vertreibe die Kreuzfahrer."
 ayy_seize_aleppo: "Aleppo einnehmen"
 ayy_seize_aleppo_desc: "Nimm Aleppo ein – die Krone Nordsyriens."
 ayy_reclaim_jerusalem: "Jerusalem zurückgewinnen"
 ayy_reclaim_jerusalem_desc: "Gewinne Jerusalem von den Kreuzfahrern zurück, wie Saladin es 1187 tat."
 ayy_coastal_levant: "Die levantinische Küste"
 ayy_coastal_levant_desc: "Nimm die mediterranen Küstenstädte der Levante ein, um den Seehandel zu beherrschen."
 ayy_antioch: "Antiochia unterwerfen"
 ayy_antioch_desc: "Unterwirf die uralte große Stadt Antiochia, um den nördlichen Einfluss auszudehnen."
 ayy_jazira: "Unabhängigkeit vom Ilkhanat"
 ayy_jazira_desc: "Die Region Dschasira zwischen Tigris und Euphrat ist unter mongolischen Ilkhan-Einfluss geraten. Bringe dieses reiche Land unter ayyubidische oder vasallische Kontrolle und befreie dich vom mongolischen Joch. Die Erhebung zum Herzogtum wird die ayyubidische Legitimität erhöhen."
 ayy_kurdish_highlands: "Die kurdischen Hochländer"
 ayy_kurdish_highlands_desc: "Gliedere die kurdischen Bergstämme – Saladins eigenes Volk – in das ayyubidische Heer ein."
 ayy_iraq_arabi: "Die Eroberung Iraq al-Arabis"
 ayy_iraq_arabi_desc: "Erobere Iraq al-Arabi, um das mesopotamische Kernland zu beherrschen."
 ayy_seize_baghdad: "Bagdad einnehmen"
 ayy_seize_baghdad_desc: "Nimm Bagdad ein – die Stadt des Friedens – und verkünde die ayyubidische Vorherrschaft."
 ayy_mesopotamia_trade: "Mesopotamischer Handel"
 ayy_mesopotamia_trade_desc: "Beherrsche das mesopotamische Handelsnetz um Bagdad."
 ayy_hejaz: "Vorstoß in den Hedschas"
 ayy_hejaz_desc: "Dringe in den Hedschas vor und nähere dich den heiligen Städten Mekka und Medina."
 ayy_holy_cities: "Hüter der Heiligen Städte"
 ayy_holy_cities_desc: "Werde Hüter der beiden Heiligen Städte – Mekka und Medina."
 ayy_north_yemen: "Nordjemen"
 ayy_north_yemen_desc: "Erobere Nordjemen und gewinne Zugang zum Rotmeerhandel."
 ayy_south_yemen: "Den Hafen Aden einnehmen"
 ayy_south_yemen_desc: "Nimm den Hafen Aden ein – das Tor zum Arabischen Meer."
 ayy_arabian_trade: "Arabischer Meereshandel"
 ayy_arabian_trade_desc: "Monopolisiere die arabischen Handelswege, die den Indischen Ozean mit dem Mittelmeer verbinden."
 ayy_madrasa: "Die Madrasa errichten"
 ayy_madrasa_desc: "Errichte Madrasen im ganzen Reich, um islamische Gelehrsamkeit wiederzubeleben."
 ayy_crusader_wars: "Heiliger Krieg gegen die Kreuzfahrer"
 ayy_crusader_wars_desc: "Führe Heiligen Krieg gegen die Kreuzfahrer, um das ayyubidische Heer zu Elitekriegern zu schmieden."
 ayy_dev_damascus: "Der Wohlstand Damaskus’"
 ayy_dev_damascus_desc: "Entwickle Damaskus – das irdische Paradies – als ayyubidische kulturelle Hauptstadt."
 ayy_spice_trade: "Gewürzhandel"
 ayy_spice_trade_desc: "Monopolisiere den Gewürzhandel vom Indischen Ozean über Aden zu den europäischen Märkten."
 ayy_silk_road_control: "Die Seidenstraße beherrschen"
 ayy_silk_road_control_desc: "Beherrsche die Seidenstraße über Bagdad, um den Ost-West-Landhandel zu beherrschen."
 ayy_kurdish_cavalry: "Kurdische Reiterei-Elite"
 ayy_kurdish_cavalry_desc: "Schmiede die kurdische Reiterei zur besten Kampftruppe der Ayyubiden."
 ayy_nile_fleet: "Die Nilflotte"
 ayy_nile_fleet_desc: "Baue eine Flotte auf Nil und Mittelmeer auf, um die Nachschublinien der Kreuzfahrer abzuschneiden."
 ayy_defeat_crusaders: "Die Kreuzfahrer besiegen"
 ayy_defeat_crusaders_desc: "Wiederhole Saladins Vernichtung des Kreuzfahrerheeres bei Hattin."
 ayy_egypt_navy: "Die ägyptische Marine"
 ayy_egypt_navy_desc: "Baue eine mächtige ägyptische Marine auf, um Mittelmeer und Rotes Meer zu beherrschen."
 ayy_sugar_egypt: "Der Zucker Ägyptens"
 ayy_sugar_egypt_desc: "Monopolisiere Ägyptens Zuckerproduktion – das süße Gold des mittelalterlichen Handels."
 ayy_iraq_ajam: "Vorstoß in den Iraq al-Ajam"
 ayy_iraq_ajam_desc: "Dringe in den Iraq al-Ajam vor, um ayyubidischen Einfluss nach Persien auszudehnen."
 ayy_build_mosques: "Moscheen überall errichten"
 ayy_build_mosques_desc: "Errichte Moscheen im ganzen Reich, um alle Untertanen unter dem sunnitischen Islam zu einen."
 ayy_sultan_of_egypt_syria: "Sultan von Ägypten und Syrien"
 ayy_sultan_of_egypt_syria_desc: "Verkünde dich zum Sultan von Ägypten, Syrien, Irak und dem Hedschas – Herr des Nahen Ostens."
 ayy_new_saladin: "Der Neue Saladin"
 ayy_new_saladin_desc: "Herrsche als Neuer Saladin – Herr des Nahen Ostens, Nachfolger Saladins Erbe."
 ayy_events.1.t: "Der Aufstieg der Ayyubiden – Saladins Eid"
 ayy_events.1.d: "Im Namen Gottes – im Jahr 1337 überlebt die Ayyubiden-Dynastie als kleiner Staat, doch Saladins Geist fließt durch ihre Adern. Die Erinnerung an die Schlacht von Hattin (1187) und die Befreiung Jerusalems treibt den ayyubidischen Sultan voran. Erobere Ägypten, befreie die heilige Stadt, beschütze Mekka – werde der Neue Saladin, Herr des Nahen Ostens."
 ayy_events.1.a: "Auf dem Pfad Gottes – erhebe dich, Ayyubiden!"
 ayy_events.10.t: "Die Befreiung Jerusalems – die Heilige Stadt kehrt zum Islam zurück"
 ayy_events.10.d: "Allahu Akbar! – Saladins große Tat von 1187 hat sich wiederholt. Jerusalem ist in muslimische Hände zurückgekehrt. Der Felsendom und die Heilige Moschee klingen wieder mit islamischem Gebet. Die islamische Welt jubelt."
 ayy_events.10.a: "Es lebe Jerusalem! Im Namen Gottes!"
 ayy_events.20.t: "Der Einzug in Bagdad – zum Herzen der islamischen Welt"
 ayy_events.20.d: "Die Stadt des Friedens, Bagdad – ayyubidische Streitkräfte sind in die Stadt eingezogen, wo einst die Abbasiden-Kalifen herrschten. Die Menschen rufen: „Saladins Nachfolger ist gekommen!“ Bagdads Kultur und Gelehrsamkeit blüht unter ayyubidischer Förderung."
 ayy_events.20.a: "Es lebe Bagdad! Es lebe der Ruhm des Islam!"
 ayy_events.30.t: "Hüter der beiden Heiligen Städte – schütze Mekka und Medina"
 ayy_events.30.d: "Mekka und Medina – die heiligen Stätten des Propheten Muhammad sind unter ayyubidischen Schutz gekommen. „Khadim al-Haramayn asch-Scharifain“ – dieser Titel wird dem ayyubidischen Sultan verliehen und von der gesamten islamischen Welt anerkannt."
 ayy_events.30.a: "Als Hüter der beiden Heiligen Städte – im Namen Gottes!"
 ayy_events.60.t: "Sultan von Ägypten und Syrien – Herr des Nahen Ostens"
 ayy_events.60.d: "Verkündet am Hof zu Kairo – „Sultan von Ägypten, Syrien, Irak und dem Hedschas, Herr der Ayyubiden-Dynastie.“ Jerusalem, Bagdad, Mekka und Kairo sind alle unter dem Banner der Ayyubiden vereint. Der Traum seit Saladins Zeiten ist verwirklicht."
 ayy_events.60.a: "Es lebe der Sultan! Es leben die Ayyubiden!"
 ayy_events.99.t: "Der Neue Saladin – ewiger Herr des Nahen Ostens"
 ayy_events.99.d: "„Salah ad-Din Ayyubi – Rechtschaffenheit des Glaubens, Herr des Nahen Ostens“ – dieser Titel ist in die Geschichte eingeschrieben. Vom Nil in Ägypten bis zum Tigris in Mesopotamien, von der arabischen Wüste bis zu den anatolischen Bergen – alle Lande unter dem Banner der Ayyubiden vereint."
 ayy_events.99.a: "Es lebe der Neue Saladin! Es lebe das Ayyubidenreich!"
 STATIC_MODIFIER_NAME_ayy_sinai_mod: "Sinai"
 STATIC_MODIFIER_DESC_ayy_sinai_mod: "Die Sinai-Halbinsel ist gesichert und öffnet das Tor zwischen Ägypten und der Levante."
 STATIC_MODIFIER_NAME_ayy_lower_egypt_mod: "Unterägypten"
 STATIC_MODIFIER_DESC_ayy_lower_egypt_mod: "Das Nildelta und Alexandria sind erobert – Ägyptens reiches Kernland gesichert."
 STATIC_MODIFIER_NAME_ayy_cairo_mod: "Kairo"
 STATIC_MODIFIER_DESC_ayy_cairo_mod: "Kairo – die Stadt der tausend Minarette – ist als ayyubidische Hauptstadt eingenommen."
 STATIC_MODIFIER_NAME_ayy_upper_egypt_mod: "Oberägypten"
 STATIC_MODIFIER_DESC_ayy_upper_egypt_mod: "Oberägypten bis Assuan ist erobert und vollendet die Beherrschung des Nils."
 STATIC_MODIFIER_NAME_ayy_nile_mod: "Der Nil"
 STATIC_MODIFIER_DESC_ayy_nile_mod: "Auf dem schwarzen Schlamm, den die Nilflut trägt, warten die Bauern auf die Jahreszeit, in der die Weizenähren im Wind wogen."
 STATIC_MODIFIER_NAME_ayy_cairo_great_mod: "Groß-Kairo"
 STATIC_MODIFIER_DESC_ayy_cairo_great_mod: "Kairo wird zur größten Stadt der islamischen Welt – der kaiserlichen Hauptstadt."
 STATIC_MODIFIER_NAME_ayy_aleppo_mod: "Aleppo"
 STATIC_MODIFIER_DESC_ayy_aleppo_mod: "Aleppo – die Krone Nordsyriens – ist eingenommen, um die Region zu beherrschen."
 STATIC_MODIFIER_NAME_ayy_coastal_mod: "Küstengebiet"
 STATIC_MODIFIER_DESC_ayy_coastal_mod: "Mediterrane Küstenstädte der Levante sind eingenommen und beherrschen den Seehandel."
 STATIC_MODIFIER_NAME_ayy_antioch_mod: "Antiochia"
 STATIC_MODIFIER_DESC_ayy_antioch_mod: "Die uralte Stadt Antiochia ist unterworfen und dehnt den nördlichen Einfluss aus."
 STATIC_MODIFIER_NAME_ayy_jazira_mod: "Unabhängigkeit vom Ilkhanat"
 STATIC_MODIFIER_DESC_ayy_jazira_mod: "Der Einfluss des Ilkhanats ist vertrieben – das ayyubidische Herzogtum von der internationalen Gemeinschaft anerkannt."
 STATIC_MODIFIER_NAME_ayy_kurdish_mod: "Kurdisch"
 STATIC_MODIFIER_DESC_ayy_kurdish_mod: "Kurdische Bergstämme – Saladins eigenes Volk – sind in das ayyubidische Heer eingegliedert."
 STATIC_MODIFIER_NAME_ayy_iraq_mod: "Irak"
 STATIC_MODIFIER_DESC_ayy_iraq_mod: "Iraq al-Arabi ist erobert und beherrscht das mesopotamische Kernland."
 STATIC_MODIFIER_NAME_ayy_mesopotamia_trade_mod: "Mesopotamischer Handel"
 STATIC_MODIFIER_DESC_ayy_mesopotamia_trade_mod: "Das mesopotamische Handelsnetz um Bagdad ist beherrscht."
 STATIC_MODIFIER_NAME_ayy_hejaz_mod: "Hedschas"
 STATIC_MODIFIER_DESC_ayy_hejaz_mod: "Entlang der Sandwege des Hedschas ziehen Pilgerscharen nach Mekka und Medina unter den wachenden Bannern der Ayyubiden."
 STATIC_MODIFIER_NAME_ayy_yemen_mod: "Jemen"
 STATIC_MODIFIER_DESC_ayy_yemen_mod: "Nordjemen ist erobert und gewinnt Zugang zum Rotmeerhandel."
 STATIC_MODIFIER_NAME_ayy_aden_mod: "Aden"
 STATIC_MODIFIER_DESC_ayy_aden_mod: "Der Hafen Aden – das Tor zum Arabischen Meer – fällt unter ayyubidische Kontrolle."
 STATIC_MODIFIER_NAME_ayy_arabian_trade_mod: "Arabischer Handel"
 STATIC_MODIFIER_DESC_ayy_arabian_trade_mod: "Arabische Handelswege, die den Indischen Ozean mit dem Mittelmeer verbinden, sind monopolisiert."
 STATIC_MODIFIER_NAME_ayy_madrasa_mod: "Madrasa"
 STATIC_MODIFIER_DESC_ayy_madrasa_mod: "Madrasen im ganzen Reich beleben islamische Gelehrsamkeit und Rechtswissenschaft wieder."
 STATIC_MODIFIER_NAME_ayy_jihad_mod: "Dschihad"
 STATIC_MODIFIER_DESC_ayy_jihad_mod: "Heiliger Krieg gegen die Kreuzfahrer schmiedet das ayyubidische Heer zu Elitekriegern."
 STATIC_MODIFIER_NAME_ayy_damascus_dev_mod: "Damaskus entwickelt"
 STATIC_MODIFIER_DESC_ayy_damascus_dev_mod: "Damaskus ist als bedeutende Handels- und Kulturdrehscheibe entwickelt."
 STATIC_MODIFIER_NAME_ayy_spice_mod: "Gewürz"
 STATIC_MODIFIER_DESC_ayy_spice_mod: "Der Gewürzhandel vom Indischen Ozean über Aden nach Europa ist monopolisiert."
 STATIC_MODIFIER_NAME_ayy_silk_mod: "Seide"
 STATIC_MODIFIER_DESC_ayy_silk_mod: "Die Seidenstraße über Bagdad ist beherrscht und dominiert den Ost-West-Landhandel."
 STATIC_MODIFIER_NAME_ayy_cavalry_mod: "Reiterei"
 STATIC_MODIFIER_DESC_ayy_cavalry_mod: "Die kurdische Reiterei – Saladins Elite – ist zur besten Streitmacht der Ayyubiden geschmiedet."
 STATIC_MODIFIER_NAME_ayy_fleet_mod: "Flotte"
 STATIC_MODIFIER_DESC_ayy_fleet_mod: "Eine Flotte auf Nil und Mittelmeer schneidet die Nachschublinien der Kreuzfahrer ab."
 STATIC_MODIFIER_NAME_ayy_crusader_mod: "Kreuzfahrer"
 STATIC_MODIFIER_DESC_ayy_crusader_mod: "Saladins Vernichtung des Kreuzfahrerheeres bei Hattin ist wiederholt – das Ansehen steigt sprunghaft."
 STATIC_MODIFIER_NAME_ayy_navy_mod: "Marine"
 STATIC_MODIFIER_DESC_ayy_navy_mod: "Eine mächtige ägyptische Marine beherrscht Mittelmeer und Rotes Meer."
 STATIC_MODIFIER_NAME_ayy_sugar_mod: "Zucker"
 STATIC_MODIFIER_DESC_ayy_sugar_mod: "Ägyptens Zuckerproduktion – das süße Gold des mittelalterlichen Handels – ist monopolisiert."
 STATIC_MODIFIER_NAME_ayy_iraq_ajam_mod: "Iraq Ajam"
 STATIC_MODIFIER_DESC_ayy_iraq_ajam_mod: "Die Pferde ayyubidischer Gesandter sind nun immer wieder in den Bergstädten Westpersiens zu sehen."
 STATIC_MODIFIER_NAME_ayy_mosque_mod: "Moschee"
 STATIC_MODIFIER_DESC_ayy_mosque_mod: "Moscheen im ganzen Reich einen alle Untertanen unter dem sunnitischen Islam."
 STATIC_MODIFIER_NAME_ayy_sultan_mod: "Sultan"
 STATIC_MODIFIER_DESC_ayy_sultan_mod: "Der Sultan von Ägypten, Syrien, Irak und dem Hedschas – Herr des Nahen Ostens."
 STATIC_MODIFIER_NAME_ayy_saladin_mod: "Saladin"
 STATIC_MODIFIER_DESC_ayy_saladin_mod: "Der Neue Saladin herrscht – Herr des Nahen Ostens, Nachfolger Saladins Erbe."
 STATIC_MODIFIER_NAME_ayy_rise_mod: "Der Aufstieg der Ayyubiden"
 STATIC_MODIFIER_DESC_ayy_rise_mod: "Mit dem Namen Saladins auf den Lippen versammeln sich Krieger der Stämme einer nach dem anderen unter den Bannern."
 ayy_mamluk_rivalry: "Konfrontation mit den Mamluken"
 ayy_mamluk_rivalry_desc: "Das Mamlukensultanat – ursprünglich türkische Sklavensoldaten, von den Ayyubiden erhoben, die die Dynastie 1250 stürzten – sind unsere geschworenen Feinde. Halte die Mamluken auf und begründe einen Anspruch auf Aleppo als Stützpunkt für die Rückeroberung Syriens."
 STATIC_MODIFIER_NAME_ayy_baghdad_city_mod: "Stadt des Kalifen"
 STATIC_MODIFIER_DESC_ayy_baghdad_city_mod: "Bagdad wiedergeboren als Zentrum von Handel und Kultur der islamischen Zivilisation."
 STATIC_MODIFIER_NAME_ayy_levant_control_mod: "Kontrolle über die Levante begründet"
 STATIC_MODIFIER_DESC_ayy_levant_control_mod: "Die Verwaltungsstruktur in der Levante ist begründet und verbessert Eingliederungs- und Annexionseffizienz."
 STATIC_MODIFIER_NAME_ayy_holy_cities_mod: "Hüter der beiden Heiligen Städte"
 STATIC_MODIFIER_DESC_ayy_holy_cities_mod: "Als Hüter Mekkas und Medinas gepriesen, zieht der ayyubidische Hof Gelehrte, Juristen und Konvertiten aus aller Welt an."
 STATIC_MODIFIER_NAME_ayy_jerusalem_mod: "Heiliger Krieg um Jerusalems Befreiung"
 STATIC_MODIFIER_DESC_ayy_jerusalem_mod: "Der Ruhm der Befreiung Jerusalems gewährt den ayyubidischen Streitkräften einen dauerhaften Vorteil im Kampf gegen andere Glaubensrichtungen."
