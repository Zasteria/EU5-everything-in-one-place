l_german:
 wal_wallachia_mission_pack: "Der Drachenorden – Hüter der Donau"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Die Walachei, eingekeilt zwischen den Karpaten und der Donau. Zähme den Bojarenadel und eine die rumänischen Fürstentümer zusammen mit der Moldau und Siebenbürgen, oder erhebe das Banner des Drachenordens und führe Krieg gegen das Osmanische Reich, um ein Donaureich zu errichten."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Stärke das Woiwodschaftsamt, eine die rumänischen Fürstentümer und besiege das Osmanische Reich, um ein Donaureich zu vollenden."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Führe den Willen des Pfählers fort und werde Hüter der Donau."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "„Wir sind die Kinder des Drachen“ – Wölfe der Karpaten, erhebt das Kreuz!"
 wal_voivode_beginnings: "Morgenröte des Woiwodschaftsamtes"
 wal_voivode_beginnings_desc: "1330 schlug Basarab I. den König von Ungarn in der Schlacht bei Posada zurück – erbe seinen Geist der Unabhängigkeit und lege das Fundament eines neuen Fürstentums zwischen Karpaten und Donau."
 wal_voivode_authority: "Die Autorität des Woiwoden"
 wal_voivode_authority_desc: "Der Thron des Woiwoden, durch Zustimmung des Bojarenadels gewählt – sichere diese Autorität und verhindere das Chaos umstrittener Thronfolge."
 wal_boyar_council: "Der Bojarenrat"
 wal_boyar_council_desc: "Die Versammlung der großen landbesitzenden Bojaren – ohne ihre Unterstützung kann die Walachei nicht regiert werden. Stabilisiere die Beziehungen zum Rat."
 wal_found_bucharest: "Bukarest gründen"
 wal_found_bucharest_desc: "Giurgiu, nahe der Donau – wo der Woiwode seinen Sommerhof gehalten hat. Entwickle diesen Ort als „Bucureşti“, ein Bollwerk südlicher Verteidigung und des Handels."
 wal_targoviste_dev: "Targoviște entwickeln"
 wal_targoviste_dev_desc: "Targoviște, die alte, am Fuß der Karpaten erbaute Hauptstadt, Sitz von Generationen von Woiwoden – bringe dieser Stadt weiteren Wohlstand."
 wal_fortify_carpathians: "Die Karpaten befestigen"
 wal_fortify_carpathians_desc: "Die Karpaten, sich von Süden nach Norden erstreckend – überziehe diesen natürlichen Wall mit von Menschenhand errichteten Festungen und errichte eine Verteidigungslinie, die kein Eindringling durchbrechen kann."
 wal_orthodox_church: "Die orthodoxe Kirche schützen"
 wal_orthodox_church_desc: "Die orthodoxe Kirche, Erbin des byzantinischen Glaubens – stehe an der Spitze ihres autokephalen Patriarchats und verleihe der Autorität des Woiwoden religiöse Legitimität."
 wal_dregatori: "Dregatori ernennen"
 wal_dregatori_desc: "Die Tyrannei erblicher Adliger ist der Feind des Staates. Ernenne „Dregatori“ – Beamte, gewählt nach Fähigkeit statt Abstammung – und baue eine der Krone loyale Verwaltung auf."
 wal_unite_voivodes: "Die Woiwoden einen"
 wal_unite_voivodes_desc: "Die Walachei und die Moldau – zwei rumänische Fürstentümer, doch noch immer gespalten, ihre Rivalität dient nur unseren Feinden. Jede Macht, die einen Stützpunkt in der Moldau hält, mag nun einen rechtmäßigen Anspruch auf das ganze Land erheben."
 wal_subdue_moldavia: "Die Moldau unterwerfen"
 wal_subdue_moldavia_desc: "Der Ruhm Stephans des Großen gehört nun der Vergangenheit an – bringe das Fürstentum Moldau unter walachische Herrschaft und lege den Grundstein rumänischer Einheit."
 wal_conquer_transylvania: "Siebenbürgen erobern"
 wal_conquer_transylvania_desc: "Siebenbürgen, lange von den Königen Ungarns und ihren Nachfolgern beherrscht – bringe dieses Land in die Walachei Herrschaftsbereich und setze der Einmischung von außen ein Ende."
 wal_szekely_land: "Land der Székler"
 wal_szekely_land_desc: "Die Székler, ein Kriegervolk Ostsiebenbürgens – achte ihre Autonomie und Kriegertradition und mache ihre Tapferkeit zur Stärke der Walachei."
 wal_saxon_towns: "Die sächsischen Städte eingliedern"
 wal_saxon_towns_desc: "Kronstadt, Hermannstadt und die anderen sächsischen Städte Siebenbürgens – mache diese seit dem Mittelalter blühenden Städte zur Säule der Wirtschaft des Königreichs."
 wal_secure_danube: "Die Donau sichern"
 wal_secure_danube_desc: "Der große Strom Donau, der den Balkan von den Karpaten trennt – sichere seine Ufer als Lebensader südlicher Verteidigung und des Handels."
 wal_carpathian_hegemony: "Die karpatische Hegemonie vollendet"
 wal_carpathian_hegemony_desc: "Die Zeit ist gekommen, dass sich das gesamte Land zwischen Karpaten und Donau der Autorität des Woiwoden unterwirft."
 wal_romanian_unity: "Die rumänische Einheit vollendet"
 wal_romanian_unity_desc: "Walachei, Moldau, Siebenbürgen – eine die lange gespaltenen Lande des rumänischen Volkes endlich unter einer Krone."
 wal_order_of_dragon_founding: "Dem Drachenorden beitreten"
 wal_order_of_dragon_founding_desc: "Kaiser Sigismund des Heiligen Römischen Reiches gründet den Drachenorden auf dem Ideal des Kreuzzugs gegen die Osmanen – lass unseren eigenen Herrscher seinen Platz in dieser erlauchten Gemeinschaft einnehmen."
 wal_impale_the_sultan: "Den Sultan pfählen"
 wal_impale_the_sultan_desc: "Der Sultan glaubt sich sicher, verborgen hinter seinen Mauern und Legionen. Auf dem Schlachtfeld gegen die Heere des Islam soll er am eigenen Leib lernen, dass sich niemand vor göttlichem Urteil verbergen kann."
 wal_drive_out_turks: "Die Türken vertreiben"
 wal_drive_out_turks_desc: "Die Zeit ist gekommen, das griechische und bulgarische Volk von der Unterdrückung zu befreien. Treibe die türkischen Eindringlinge zurück an das ferne Ufer des Bosporus."
 wal_liberate_serbia: "Serbien befreien"
 wal_liberate_serbia_desc: "Unsere serbischen Brüder, seit der Niederlage im Amselfeld unter dem osmanischen Joch leidend – befreie sie und werde Beschützer des orthodoxen Balkans."
 wal_reclaim_morea: "Die Morea zurückgewinnen"
 wal_reclaim_morea_desc: "Das Despotat Morea, wo Byzanz’ letztes Licht einst brannte – gewinne diesen Winkel des Peloponnes aus ungläubigen Händen zurück."
 wal_heir_of_rome: "Erbe Roms"
 wal_heir_of_rome_desc: "Was das Byzantinische Reich nie erreichte – die vollständige Niederlage und Vertreibung des Ungläubigen aus Europa – haben wir vollbracht. Niemand ist des Mantels Roms würdiger als wir."
 wal_bulwark_of_christendom: "Bollwerk der Christenheit"
 wal_bulwark_of_christendom_desc: "Die rumänischen Fürstentümer sind das Bollwerk der Christenheit. Die Befestigung unserer Grenzen ist unsere Pflicht vor Gott."
 wal_ottoman_downfall: "Der Untergang der Osmanen"
 wal_ottoman_downfall_desc: "Das Osmanische Reich, einst beherrschend über Balkan und Nahen Osten – seine Bedrohung ist endlich der Geschichte übergeben."
 wal_reclaim_constantinople: "Konstantinopel zurückgewinnen"
 wal_reclaim_constantinople_desc: "Konstantinopel, lange an den Ungläubigen gefallen – befreie als Erben des Drachenordens diese Kaiserstadt."
 wal_danubian_empire: "Das Donaureich vollendet"
 wal_danubian_empire_desc: "Von den Karpaten bis zum Balkan und weiter zum Bosporus – dieser Kampf, mit der Rache des Pfählers begonnen, endet mit der Vollendung eines großen Reiches, das die Donau beherrscht."
 wal_danube_trade: "Der Donauhandelsweg"
 wal_danube_trade_desc: "Der Handelsweg, der Westeuropa mit dem Schwarzen Meer entlang der Donau verbindet – ziehe diesen Strom des Reichtums in die Schatzkammer der Walachei."
 wal_treasury: "Eine Schatzkammer errichten"
 wal_treasury_desc: "Krieg, Diplomatie, der Unterhalt des Hofes – jede Staatsangelegenheit verlangt Gold. Errichte eine volle Schatzkammer und bereite dich auf jede Not vor."
 wal_manufactories: "Manufakturen entwickeln"
 wal_manufactories_desc: "Ein großer Wandel vollzieht sich im Bereich der Erzeugung – investiere ohne Zögern in Manufakturen und bereite dich auf ein Zeitalter der Industrie vor."
 wal_events.2.t: "Konstantinopel zurückgewonnen"
 wal_events.2.d: "Die große Kaiserstadt Konstantinopel ist endlich in unsere Hände gefallen. Das Banner des Drachenordens weht nun über dieser Stadt, einst vom Ungläubigen gehalten."
 wal_events.2.a: "Die Stadt Rom ist unser!"
 wal_events.99.t: "Die Verkündung des Donaureiches"
 wal_events.99.d: "Ein kleines Fürstentum am Fuß der Karpaten ist als großes Reich wiedergeboren, das Donau und Balkan beherrscht. Der Wille des Pfählers ist endlich vollständig verwirklicht."
 wal_events.99.a: "Ruhm sei dem Donaureich!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "Morgenröte des Woiwodschaftsamtes"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "Die Erinnerung an den Tag, da Basarab I. sich weigerte, vor einem fremden Lehnsherrn zu knien, ist der Stolz der Soldaten der Walachei."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "Die Autorität des Woiwoden"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "Der Thron des Woiwoden ist stabil, und das Vertrauen in die Thronfolge ist gewachsen."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "Der Bojarenrat"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Die Beziehungen zum Bojarenadel sind stabil und stärken das Fundament der Regierung."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Bukarest gegründet"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Giurgiu ist als „Bucureşti“, ein Bollwerk des Südens, entwickelt."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Targoviște entwickelt"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "Die alte Hauptstadt Targoviște gedeiht weiter."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "Das karpatische Festungsnetz"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "Ein Festungsnetz in den Bergen schlägt jeden Eindringling zurück."
 STATIC_MODIFIER_NAME_wal_church_mod: "Der Schutz der orthodoxen Kirche"
 STATIC_MODIFIER_DESC_wal_church_mod: "Die walachisch-orthodoxe Kirche steht unter staatlichem Schutz und erhöht die religiöse Legitimität."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Den Sultan pfählen"
 STATIC_MODIFIER_DESC_wal_impale_mod: "Das Gerücht von der Reihe der Pfähle, vor den Gesandten des Sultans aufgestellt, erschauert noch immer die Herzen der Heere des Islam."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Die Dregatori ernannt"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Nach Fähigkeit gewählte Beamte tragen nun eine loyale Verwaltung."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Die Moldau unterworfen"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "Das Fürstentum Moldau ist unter walachische Herrschaft gebracht."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Siebenbürgen erobert"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Siebenbürgen ist in die Walachei Herrschaftsbereich gebracht."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Die Tapferkeit der Székler"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Die Bergkrieger der Szeklerlande stellen ihre Speere in Reihe unter den Bannern der Walachei."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Der Wohlstand der sächsischen Städte"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "Die sächsischen Städte Siebenbürgens sind zur Säule der Wirtschaft des Königreichs geworden."
 STATIC_MODIFIER_NAME_wal_danube_mod: "Die Donau gesichert"
 STATIC_MODIFIER_DESC_wal_danube_mod: "Die Ufer der Donau sind gesichert und öffnen eine Lebensader des Handels."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Karpatische Hegemonie"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "Das Land zwischen Karpaten und Donau unterwirft sich vollständig der Autorität des Woiwoden."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Rumänische Einheit"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Walachei, Moldau und Siebenbürgen sind unter einer Krone vereint."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Mitglied des Drachenordens"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Gesandte, die das Abzeichen des Drachenordens tragen, bereisen die Höfe der Christenheit und weiten den Kreis des Bündnisses gegen die Osmanen."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Die Türken vertrieben"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "Der Krieg gegen die Ungläubigen hat die Stärke unseres Heeres bewiesen."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Serbien befreit"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Unsere serbischen Brüder sind befreit, was unser Ansehen im gesamten orthodoxen Balkan erhöht."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Die Morea zurückgewonnen"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Ladungen von Wein und Seide aus den Häfen des Peloponnes füllen die Lagerhäuser walachischer Kaufleute."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Erbe Roms"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "Am Hof der Walachei, der die Nachfolge der byzantinischen Kaiser beansprucht, neigen Klerus und Adel gleichermaßen ihre Häupter, ohne an seiner Rechtmäßigkeit zu zweifeln."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Bollwerk der Christenheit"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "Ein Netz von Grenzfestungen dient nun als Schild der Christenheit."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "Der Untergang der Osmanen"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "An Grenzen, die nicht mehr von osmanischen Überfällen heimgesucht werden, zeigen sich Soldaten stolz die Ausbildung, die sie verfeinert haben."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Manufakturen entwickelt"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "Aus den Schornsteinen der Werkstätten Bukarests steigt der unaufhörliche Rauch neuer Tuche und Werkzeuge, die entstehen."
 STATIC_MODIFIER_NAME_wal_trade_mod: "Der Donauhandelsweg"
 STATIC_MODIFIER_DESC_wal_trade_mod: "Ein Handelsnetz entlang der Donau schützt den Reichtum des Staates."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Eine volle Schatzkammer"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Truhen voller Silbermünzen sind in den Gewölben des Palastes gestapelt, und Kaufleute handeln, ohne am Gewicht der Münze zu zweifeln."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "Das Herrschaftsnetz des Donaureiches"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "Die Donau selbst ist zur Lebensader des Reiches geworden, ihre Wasser tragen Heere mühelos stromauf und stromab. Die Legitimität der Dynastie steht unerschüttert, und die Macht der Krone reicht in jeden Winkel des Reiches."
