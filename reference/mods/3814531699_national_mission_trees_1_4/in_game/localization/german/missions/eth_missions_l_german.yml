l_german:
 eth_ethiopia_mission_pack: "Das Neue Salomonische Reich – ein Kreuz, das über dem Horn von Afrika erstrahlt"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Unter einer Dynastie, die von der Königin von Saba und König Salomon abstammen soll, wetteifere mit den Mamluken als Beschützer der Kopten, siege im Todeskampf mit Adal und belebe den Ruhm Aksums wieder, um ein neues Reich zu errichten."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "Errichte das Reich, beanspruche die Hegemonie über das Horn von Afrika, schütze die Kopten und belebe den Ruhm Aksums wieder."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "Von einer Hochlandfestung zu einem Reich, das über dem Roten Meer erstrahlt."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "„König der Könige, Löwe von Juda“ – errichte als Erbe der Königin von Saba ein neues Salomonisches Reich!"
 eth_negus_authority: "Die Autorität des Negus Negest begründen"
 eth_negus_authority_desc: "„König der Könige“ – der Titel des Negus Negest. Lass diese Autorität jeden Winkel des Reiches erreichen."
 eth_amba_geshen: "Das Gefängnis von Amba Geschen"
 eth_amba_geshen_desc: "Um Thronfolgestreitigkeiten zu verhindern, werden königliche Prinzen in der natürlichen Festung von Amba Geschen eingesperrt – begründe diese Sitte als Einrichtung."
 eth_mobile_court: "Der wandernde Hof Äthiopiens"
 eth_mobile_court_desc: "Ohne feste Hauptstadt durchqueren der Kaiser und sein Heer das Reich in einem beweglichen Lager (Ketema) – begründe diesen eigenständigen Regierungsstil als staatliche Einrichtung."
 eth_coptic_church: "Die äthiopisch-orthodoxe Kirche schützen"
 eth_coptic_church_desc: "Die äthiopisch-orthodoxe Kirche, unter der Autorität Alexandrias – mache ihren Glauben zu einer Säule des Staates und werde Beschützer der Kopten."
 eth_gondar_founding: "Gondar entwickeln"
 eth_gondar_founding_desc: "Gondar, „das Camelot Afrikas“ genannt – entwickle es zu einer großen ummauerten Steinstadt."
 eth_royal_chronicle: "Die königlichen Chroniken zusammenstellen"
 eth_royal_chronicle_desc: "Erbe den Geist des „Kebra Nagast“, der Chronik, die die Taten vergangener Kaiser verzeichnet, und pflege eine Tradition der Gelehrsamkeit und Aufzeichnung."
 eth_feudal_levies: "Das feudale Aufgebotssystem"
 eth_feudal_levies_desc: "Begründe Äthiopiens eigenständiges feudales Militärsystem, in dem regionale Herren auf Ruf des Kaisers Truppen führen."
 eth_negus_dynasty: "Die Salomonische Dynastie gesichert"
 eth_negus_dynasty_desc: "Mit Kirche, Chroniken, Militärsystem und Hauptstadt allesamt an ihrem Platz, mache die Herrschaft der Salomonischen Dynastie unerschütterlich."
 eth_oromo_migration: "Die Oromo-Wanderungen"
 eth_oromo_migration_desc: "Im 16. Jahrhundert beginnen die Oromo-Völker eine große Wanderung – reagiere auf diese historische Völkerbewegung."
 eth_agaw_people: "Die Agaw regieren"
 eth_agaw_people_desc: "Die Agaw, uralte Bewohner des äthiopischen Hochlands – regiere sie als Untertanen des Reiches, während du ihre Kultur achtest."
 eth_beta_israel: "Koexistenz mit Beta Israel"
 eth_beta_israel_desc: "Beta Israel, die äthiopischen Juden, auch „Falascha“ genannt – errichte einen Weg der Koexistenz mit ihnen."
 eth_horn_hegemony: "Hegemonie über das Horn von Afrika"
 eth_horn_hegemony_desc: "Als Reich, das Sidama, Oromo, Agaw und Beta Israel eint, beanspruche die Hegemonie über das Horn von Afrika."
 eth_nubian_alliance: "Bündnis mit Nubien"
 eth_nubian_alliance_desc: "Makuria und Alodia, die koptischen Staaten im Norden – schmiede Bündnisse mit diesen Brüdern desselben Glaubens."
 eth_conquer_makuria: "Makuria eingliedern"
 eth_conquer_makuria_desc: "Makuria, das koptische Königreich, das einst am Nil blühte – schütze oder gliedere diesen nun schwindenden Staat ein."
 eth_conquer_alodia: "Alodia eingliedern"
 eth_conquer_alodia_desc: "Alodia, das koptische Königreich Südnubiens – bringe dieses Land in Äthiopiens Herrschaftsbereich."
 eth_sudan_dominion: "Herrschaft über den Sudan begründen"
 eth_sudan_dominion_desc: "Vom Niltal bis zur nubischen Wüste – begründe äthiopische Herrschaft über dieses weite Land."
 eth_mamluk_rivalry: "Rivalität mit den Mamluken"
 eth_mamluk_rivalry_desc: "Das Mamlukensultanat, das Ägypten beherrscht – bereinige als Beschützer der Kopten die Rivalität mit ihnen."
 eth_liberate_jerusalem: "Jerusalem befreien"
 eth_liberate_jerusalem_desc: "Die Heilige Stadt Jerusalem – befreie dieses Land, um die Anbetungsrechte der Kopten zu schützen."
 eth_coptic_patriarchate: "Das koptische Patriarchat befehligen"
 eth_coptic_patriarchate_desc: "Das koptische Patriarchat von Alexandria – bringe seine Autorität unter äthiopische Kontrolle."
 eth_protector_of_copts: "Beschützer der Kopten"
 eth_protector_of_copts_desc: "Für Kopten, verstreut über die Welt, ist der äthiopische Kaiser ihr letzter Beschützer – erfülle diese Rolle."
 eth_adal_wars: "Die Adal-Kriege"
 eth_adal_wars_desc: "Das Sultanat Adal, der islamische Staat an der Rotmeerküste – stelle dich dem Krieg mit diesem langjährigen Rivalen."
 eth_conquer_zeila: "Seila erobern"
 eth_conquer_zeila_desc: "Seila, Adals wichtige Hafenstadt – erobere sie und gewinne einen Stützpunkt im Rotmeerhandel."
 eth_conquer_harar: "Harar erobern"
 eth_conquer_harar_desc: "Harar, ein Zentrum islamischer Gelehrsamkeit – erobere diese heilige Stadt."
 eth_conquer_adal: "Adal erobern"
 eth_conquer_adal_desc: "Setze der Bedrohung durch „Ahmad den Linkshänder“ (Gran) ein Ende und erobere das langjährige Rivalensultanat Adal."
 eth_somali_coast: "Die somalische Küste sichern"
 eth_somali_coast_desc: "Die somalische Küste – fege die Überreste Adals hinweg und sichere dieses Land."
 eth_red_sea_access: "Zugang zum Roten Meer"
 eth_red_sea_access_desc: "Sichere den Hafen von Massaua und öffne dem landumschlossenen Äthiopien den lang ersehnten Weg zum Meer."
 eth_portuguese_contact: "Kontakt mit den Portugiesen"
 eth_portuguese_contact_desc: "Die Portugiesen, auf der Suche nach dem sagenhaften Land des „Priesterkönigs Johannes“ – der Kontakt mit ihnen bringt Äthiopien ein neues Zeitalter."
 eth_massawa_port: "Den Hafen von Massaua entwickeln"
 eth_massawa_port_desc: "Massaua, die Hafenstadt am Roten Meer – entwickle sie als Tor für den auswärtigen Handel."
 eth_firearms_adoption: "Feuerwaffen einführen"
 eth_firearms_adoption_desc: "Mit portugiesischer Unterstützung führe Musketen und Kanonen in das äthiopische Heer ein."
 eth_european_trade: "Handel mit Europa"
 eth_european_trade_desc: "Belebe über Massaua den Handel mit den Nationen Europas."
 eth_modernize_army: "Das Heer modernisieren"
 eth_modernize_army_desc: "Aufbauend auf Feuerwaffen und europäischem Handel, verwandle das äthiopische Heer in eine moderne Streitmacht."
 eth_aksum_heritage: "Das Erbe Aksums"
 eth_aksum_heritage_desc: "Das Aksumitische Reich, das einst durch Rotmeerhandel blühte – sichere seine heilige Stadt und erbe das Andenken an seinen Ruhm."
 eth_reclaim_aksum: "Tigray wiederbeleben"
 eth_reclaim_aksum_desc: "Tigray, die Geburtsstätte des Aksumitischen Reiches – belebe diese Region als Kerngebiet des Reiches wieder."
 eth_red_sea_empire: "Das Rotmeerreich wiederaufbauen"
 eth_red_sea_empire_desc: "Das Rotmeerhandelsreich, einst von Aksum errichtet – belebe es im gegenwärtigen Zeitalter wieder."
 eth_horn_unification: "Das Horn von Afrika einen"
 eth_horn_unification_desc: "Durch die Eingliederung kuschitischer Völker und die Wiederbelebung des Rotmeerreiches – eine das gesamte Horn von Afrika unter Äthiopiens Banner."
 eth_new_solomonic_empire: "Das Neue Salomonische Reich"
 eth_new_solomonic_empire_desc: "Beschützer der Kopten, ein modernisiertes Heer und ein geeintes Horn von Afrika – die Blutlinie der Königin von Saba und König Salomons ist hier als neues Reich vollendet."
 eth_events.1.t: "Jerusalem befreit"
 eth_events.1.d: "Die Heilige Stadt Jerusalem ist in koptische Hände zurückgekehrt. Für über die Welt verstreute Brüder wird dieser Tag für immer erinnert werden."
 eth_events.1.a: "Ruhm sei Gott!"
 eth_events.99.t: "Die Verkündung des Neuen Salomonischen Reiches"
 eth_events.99.d: "Ein kleines Hochlandkönigreich ist als großes Reich wiedergeboren – Beschützer der Kopten, Herr des Roten Meeres, Herrscher des Horns von Afrika. Die Blutlinie der Königin von Saba und König Salomons ist hier vollendet."
 eth_events.99.a: "Ruhm sei Äthiopien! Es lebe das Neue Salomonische Reich!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Die Autorität des Negus begründet"
 STATIC_MODIFIER_DESC_eth_negus_mod: "Die Autorität des Kaisers erreicht das Reich und erhöht die Legitimität der Herrschaft."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "Das Gefängnis von Amba Geschen"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "Auf den Klippen von Amba Geschen werden junge Prinzen des Blutes still alt, niemals erlaubt, den Thron zu begehren."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "Die orthodoxe Kirche geschützt"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "Die Glocken der Tewahedo-Kirche läuten von Tal zu Tal über das Hochland, und selbst Völker anderer Glaubensrichtungen halten inne, um zu lauschen."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Gondar entwickelt"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "Die steingemauerte Stadt ist zum Sinnbild des Wohlstands des Königreichs geworden."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "Die königlichen Chroniken zusammengestellt"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "In den dunklen Skriptorien der Klöster ruhen die Federn der Schreiber, die Ge’ez-Chroniken kopieren, nie."
 STATIC_MODIFIER_NAME_eth_levies_mod: "Das feudale Aufgebotssystem"
 STATIC_MODIFIER_DESC_eth_levies_mod: "Beim Klang der Trommeln versammeln sich die Herren des Hochlands, jeder seine Männer unter seinem eigenen Banner führend."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "Die Dynastie gesichert"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "Der Stolz der Abstammung von König Salomon und der Königin von Saba macht den Namen der Dynastie unter allen Völkern verehrt."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Hegemonie über das Horn"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "Vom abessinischen Hochland bis zu den Tiefländern des Horns zollen Völker unzähliger Sprachen Tribut im Namen eines einzigen Königs."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Bündnis mit Nubien"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Gesandte aus unseren Brüdern im nördlichen Nubien werden warm empfangen als solche, die denselben Glauben des Kreuzes teilen."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Makuria eingegliedert"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "Die Eingliederung des annektierten Makuria schreitet voran."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Alodia eingegliedert"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "Die Eingliederung des annektierten Alodia schreitet voran."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Herrschaft über den Sudan"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Karawanen, beladen mit Getreide und Gold, steigen ohne Unterlass von den Ebenen des Sudan den Nil entlang auf."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Rivalität mit den Mamluken"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Nachdem sie mit der mamlukischen Reiterei die Klingen gekreuzt haben, sind die Soldaten des Hochlands zu Veteranenkriegern gehärtet."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "Das koptische Patriarchat"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "Die Priester des Hochlands hatten lange auf den Tag gewartet, an dem ein eigener Patriarch den Segen erteilen würde."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Beschützer der Kopten"
 STATIC_MODIFIER_DESC_eth_protector_mod: "Der Ruf als Beschützer hilft, die diplomatischen Beziehungen zu verbessern."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "Die Adal-Kriege"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Soldaten, die die endlosen Kriege mit Adal überlebt haben, tragen ihre Narben wie Ehrenzeichen."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Seila erobert"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "Aus den Lagerhäusern des Hafens von Seila werden Gewürze und Perlen des Roten Meeres zum Hof des Hochlands hinaufgetragen."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Harar erobert"
 STATIC_MODIFIER_DESC_eth_harar_mod: "Als das Banner des Königs über den Mauern Harars erhoben wurde, sprachen die Soldaten des Hochlands mit einer Stimme vom Sieg, der eine heilige Stadt gewonnen hatte."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Adal erobert"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Selbst in den Dörfern Adals, unseres alten Rivalen, haben die Beamten des Königs begonnen, ihre Steuerbücher zu öffnen."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "Die somalische Küste gesichert"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "In den Häfen der somalischen Küste ankern Schiffe, beladen mit Weihrauch und Elfenbein, ohne Unterlass."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Zugang zum Roten Meer"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "Mit dem lange verschlossenen Weg zum Roten Meer nun offen, wenden sich die Augen der Hochlandkaufleute dem Horizont zu."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Kontakt mit den Portugiesen"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Portugiesische Gesandte aus Goa werden mit Ehren am Hof des Hochlands empfangen, seltene Geschenke tragend."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Massaua entwickelt"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "Der Hafen von Massaua blüht als Tor für den Handel."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Feuerwaffen eingeführt"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "Der Donner von Musketen und Kanonen in den Tälern verkündet, dass das Zeitalter von Speer und Schild geendet hat."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Handel mit Europa"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "Europäische Kaufleute, die im Hafen von Massaua landen, kaufen das Gold und den Moschus des Hochlands im Austausch für Silbermünzen."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "Das Heer modernisiert"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Soldaten in Uniformen neuen Stils marschieren und singen die alten Kriegslieder."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "Das Erbe Aksums"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Diejenigen, die vor den Stelen Aksums stehen, erinnern sich, dass die Namen tausendjähriger Könige noch immer in ihrem eigenen Blut fließen."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Tigray wiederbelebt"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "Die alten Felder und Märkte Aksums haben wieder Atem geschöpft, und die Beamten des Königs zählen erneut die Ernte."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "Das Rotmeerreich wiederaufgebaut"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "Mit dem Wiederaufbau des Handelsreiches, das die Häfen des Roten Meeres verbindet, entfalten die Flotten des Königs ihre Segel entlang der ganzen Küste."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "Das Horn von Afrika geeint"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Jeder Fürst des Horns von Afrika kniet nun nach dem Zeremoniell eines einzigen Hofes."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "Das Neue Salomonische Reich"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "Die Vollendung des neuen Reiches hat die Staatsmacht auf ihren Gipfel geführt."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Jerusalem befreit"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Vor dem Heiligen Grab in Jerusalem weinen äthiopische Priester am Ende ihrer langen Pilgerreise."
