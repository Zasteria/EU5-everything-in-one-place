l_german:
 gae_gaelic_ireland_mission_pack: "Der gälisch-irische Gegenschlag"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "Die englische Herrschaft wankt inmitten von Pest und der Bruce-Invasion – führe als gälischer Häuptling die Wiedererstarkung an, beanspruche den Thron des Hochkönigs, um Irland zu einen, und überquere schließlich das Meer, um England selbst zu erobern."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Eine den Clan, werde Hochkönig über ganz Irland und erobere England."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "Von einem gespaltenen Clan zu einem Hochkönig, der England erobert."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "Erhebe das gälische Banner über die Grüne Insel – und ebenso über das Meer!"
 gae_gaelic_resurgence: "Die gälische Wiedererstarkung"
 gae_gaelic_resurgence_desc: "Inmitten des Chaos des Schwarzen Todes und der Bruce-Invasion wankt die englische Kolonialherrschaft – das Zeitalter der gälischen Herren kehrt noch einmal auf diese Insel zurück."
 gae_brehon_law: "Das Brehon-Recht bewahren"
 gae_brehon_law_desc: "Das Brehon-Recht, eine Rechtstradition, die weder römischem noch englischem Brauch verpflichtet ist – bewahre dieses uralte System als Fundament der Regierung."
 gae_fili_and_bards: "Die Filid und die Barden"
 gae_fili_and_bards_desc: "Die Filid, gelehrte Dichter, die Geschichte und Abstammung des Clans bewahren – fördere ihre Kunst und lass die Ehre des Clans für Generationen besungen werden."
 gae_gallowglass_recruitment: "Die Gallóglaigh rekrutieren"
 gae_gallowglass_recruitment_desc: "Gewaltige Krieger von den schottischen Inseln – heiße diese „Gallóglaigh“ in deinen Reihen willkommen und stärke die Macht des Clans."
 gae_clan_unification: "Den Clan einen"
 gae_clan_unification_desc: "Gespaltene Nebenlinien und umstrittene Lande – bringe sie als eines zusammen und begründe deine Autorität als Häuptling."
 gae_lord_of_the_clan: "Herr des Clans"
 gae_lord_of_the_clan_desc: "Recht, Dichtung, Waffen und eine geeinte Blutlinie – baue auf all diesen auf und stehe als wahrer Herr des Clans da."
 gae_rout_the_settlers: "Die Siedler in die Flucht schlagen"
 gae_rout_the_settlers_desc: "Die englischen Siedler, ihre Zahl von der Pest gelichtet – ergreife diese Gelegenheit und vertreibe sie aus diesem Land."
 gae_ostmen_towns: "Die Städte der Ostmänner"
 gae_ostmen_towns_desc: "Hafenstädte, vor langem von den Nachkommen der Wikinger, den Ostmännern, gegründet – nimm Städte wie Dublin und Waterford ein."
 gae_resurgence_triumphant: "Der triumphierende Wiederaufstieg"
 gae_resurgence_triumphant_desc: "Die Vertreibung der Siedler und die Einnahme der Ostmänner-Städte – die gälische Wiedererstarkung erreicht hier ihren ersten Triumph."
 gae_ulster_hegemony: "Vorherrschaft über Ulster"
 gae_ulster_hegemony_desc: "Ulster, das nördliche Land der O’Neills und O’Donnells – begründe Vorherrschaft über diese Region."
 gae_connaught_hegemony: "Vorherrschaft über Connacht"
 gae_connaught_hegemony_desc: "Connacht, das wilde Land des Westens – herrsche als Erbe des Ruhms der O’Connors über diese Region."
 gae_munster_hegemony: "Vorherrschaft über Munster"
 gae_munster_hegemony_desc: "Munster im Süden, Land der MacCarthys und O’Briens – ergreife die Vorherrschaft über diese reiche Region."
 gae_leinster_hegemony: "Vorherrschaft über Leinster"
 gae_leinster_hegemony_desc: "Leinster, an das Pale selbst grenzend – begründe Vorherrschaft über diese strategisch bedeutende Region."
 gae_high_king_of_ireland: "Hochkönig von Irland"
 gae_high_king_of_ireland_desc: "Der uralte Titel des Ard Rí, Hochkönig, schlummernd auf dem Hügel von Tara – überschreite das Zeitalter der Spaltung und belebe diesen ehrenvollsten Rang wieder."
 gae_conquer_the_pale: "Das Pale erobern"
 gae_conquer_the_pale_desc: "Das Pale, Englands letzter Brückenkopf um Dublin – bringe dieses Land in gälische Hände."
 gae_expel_the_english: "Die Engländer vertreiben"
 gae_expel_the_english_desc: "Die letzten Überreste englischer Autorität, die noch an dieser Insel haften – fege sie vollständig hinweg."
 gae_master_of_the_emerald_isle: "Herr der Grünen Insel"
 gae_master_of_the_emerald_isle_desc: "Der Thron des Hochkönigs, die Eroberung des Pale und die vollständige Vertreibung der Engländer – Irland ist noch einmal wahrhaft gälisch geworden."
 gae_gaelic_fleet: "Eine gälische Flotte bauen"
 gae_gaelic_fleet_desc: "Um das Meer nach England selbst zu überqueren – baue eine mächtige Flotte auf und richte deinen Blick auf die Heimat der einstigen Eindringlinge."
 gae_invade_wales: "In Wales einfallen"
 gae_invade_wales_desc: "Wales, Land verwandten keltischen Blutes – lande an diesen Küsten und sichere einen Stützpunkt gegen England."
 gae_war_on_england: "Krieg gegen England"
 gae_war_on_england_desc: "Die Zeit ist gekommen, die Geschichte umzukehren – fordere England, den einstigen Eindringling, direkt heraus."
 gae_conquest_of_england: "Die Eroberung Englands vollendet"
 gae_conquest_of_england_desc: "Die Heimat derer, die einst diese Insel zertraten – dieses Land liegt nun unter der Herrschaft eines gälischen Königs. Die Geschichte ist hier völlig umgekehrt worden."
 gae_events.1.t: "Der Hochkönig inthronisiert"
 gae_events.1.d: "Auf dem Hügel von Tara ist, dem uralten Brauch gemäß, ein neuer Hochkönig verkündet worden. Das Zeitalter der Spaltung findet hier sein Ende."
 gae_events.1.a: "Ruhm sei dem Hochkönig!"
 gae_events.2.t: "Herr der Grünen Insel"
 gae_events.2.d: "Mit dem Fall des Pale und der vollständigen Vertreibung der Engländer ist diese Insel endlich noch einmal wahrhaft gälisch geworden."
 gae_events.2.a: "Ruhm sei Irland!"
 gae_events.99.t: "Die Eroberung Englands vollendet"
 gae_events.99.d: "Die Heimat Englands, das einst diese Insel zertrat, kniet nun vor dem Thron eines gälischen Königs. Die Geschichte ist völlig umgekehrt worden."
 gae_events.99.a: "Die Geschichte ist umgekehrt!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "Die gälische Wiedererstarkung"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "Da die Pest die Siedlerbevölkerung gelichtet hat, verbreiten sich Sprache und Sitten dieses Landes noch einmal über das Land."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "Das Brehon-Recht bewahrt"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "Die Erinnerung an Präzedenzfälle, weitergegeben durch Generationen von Brehon-Rechtsprechern, gebietet mehr Vertrauen als jedes geschriebene Gesetzbuch."
 STATIC_MODIFIER_NAME_gae_bards_mod: "Die Filid und die Barden"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Lehrlings-Filid verbringen noch immer sieben Jahre damit, die Abstammung und Taten des Clans dem Gedächtnis einzuprägen."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "Die Gallóglaigh rekrutiert"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Axtträgende Krieger, die von den Hebriden über das Meer kamen, bilden nun den Kern der stehenden Streitmacht des Clans."
 STATIC_MODIFIER_NAME_gae_clan_mod: "Der Clan geeint"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Benachbarte Häuptlinge, durch Heirat und Pakt gebunden, blicken nun über alte Fehden hinweg auf einen gemeinsamen Feind."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Herr des Clans"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Nach dem uralten Brauch der Wahlfolge gewählt, befehligt dieser Häuptling nun die Schwerter jeder Nebenlinie."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "Die Siedler in die Flucht geschlagen"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "Die von der Pest gelichteten Herrenhäuser der Siedler stehen verlassen, eines nach dem anderen zur Wildnis zurückkehrend."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "Die Städte der Ostmänner"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "Von den Kais, die von Nachkommen nordischen Blutes bearbeitet werden, segeln Schiffe, beladen mit Häuten und Wolle, ohne Ende hinaus."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "Der triumphierende Wiederaufstieg"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "Nach einem halben Jahrhundert des Rückzugs ist die englische Kolonie auf einen bloßen Küstenstreifen zurückgedrängt."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Vorherrschaft über Ulster"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "Unter dem Namen O’Neill stehen nun Krieger versammelt, aus den neun Grafschaften des Nordens gesammelt."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Vorherrschaft über Connacht"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "Als Erbe des Blutes der O’Connors werden die Aufgebote der in den westlichen Wildnissen wohnenden Clans als selbstverständlich hingenommen."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Vorherrschaft über Munster"
 STATIC_MODIFIER_DESC_gae_munster_mod: "Von den Hügeln der Decies bis zum Hafen Cork füllt der Reichtum des reichen Südens die Schatzkammer."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Vorherrschaft über Leinster"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Gälische Steuereintreiber gehen nun bis unmittelbar an den Graben des Pale selbst."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "Das Pale erobert"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "Das englische Banner, das einst von den Türmen Dublin Castles wehte, ist endlich gesenkt."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "Die Engländer vertrieben"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "Die fremde Herrschaft über diese Insel, begonnen in den Tagen Heinrichs II., hat endlich ein vollständiges Ende gefunden."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "Die gälische Flotte erbaut"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Gälische Seeleute, einst nur als Räuber gefürchtet, befehligen nun eine eigene richtige Flotte."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "Krieg gegen England"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "Der Krieg, den sie vor anderthalb Jahrhunderten auf diese Insel brachten, wird nun auf ihrem eigenen Boden heimgesucht."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "Hochkönig von Irland"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "Der Sitz des Ard Rí, seit den Tagen Brian Borus verwaist, hat auf dem Hügel von Tara noch einmal seinen Herrn gefunden."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Herr der Grünen Insel"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "Von Küste zu Küste verbleibt kein fremder Beamter mehr auf dieser Insel."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "Die Geschichte umgekehrt"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "Auf dem Thron, einst von selbsternannten Eroberern beansprucht, sitzt nun ein gälischer König."
