l_german:
 lit_lithuania_mission_pack: "Von der Ostsee zum Schwarzen Meer"
 lit_lithuania_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist das Großfürstentum Litauen unter Großfürst Gediminas die dynamischste Macht Osteuropas. Besiege den Deutschen Orden, erobere Ruthenien, erreiche das Schwarze Meer, bilde eine Adelsrepublik mit Polen – und wähle deinen Glauben, um Litauens Seele zu bestimmen."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "Erobere von der Ostsee bis zum Schwarzen Meer und bilde eine Adelsrepublik mit Polen, um das litauische Großreich zu errichten."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "Beherrsche als Litauen Osteuropa von der Ostsee bis zum Schwarzen Meer."
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "„Litauens Land, für immer“ – von Gediminas bis Vytautas, stelle den Glanz des Großfürstentums wieder her!"
 lit_gediminas_legacy: "Das Erbe der Gediminiden"
 lit_gediminas_legacy_desc: "Erbe die dynastischen Grundlagen, die Großfürst Gediminas gelegt hat, und beschreite den Weg zu einem großen Reich, das sich von der Ostsee bis zum Schwarzen Meer erstreckt."
 lit_teutonic_threat: "Die Bedrohung durch den Deutschen Orden"
 lit_teutonic_threat_desc: "Der Deutsche Orden, der unter dem Kreuzfahrerbanner ostwärts marschiert – dieser religiöse Militärstaat ist Litauens größter Feind. Halte ihn ein und sichere die Westgrenze."
 lit_black_ruthenia_integration: "Die Eingliederung Schwarzrutheniens"
 lit_black_ruthenia_integration_desc: "Schwarzruthenien – um Grodno und Brest gelegen, bringe dieses Land als Fundament für die Ausdehnung nach Osten in Litauens Herrschaftsbereich."
 lit_volhynia_podolia: "Wolhynien und Podolien"
 lit_volhynia_podolia_desc: "Wolhynien und Podolien – bringe die reichen Ebenen der Westukraine unter litauische Kontrolle und öffne den Weg zum Schwarzen Meer."
 lit_smolensk: "Die Eroberung Smolensks"
 lit_smolensk_desc: "Smolensk – ein strategisches Tor zur östlichen Rus. Nimm diese Festungsstadt ein und erhöhe den Druck auf Moskau."
 lit_kyiv: "Die Eroberung Kiews"
 lit_kyiv_desc: "Kiew – die Mutter aller Städte der Rus. Wenn Litauen Kiew einnimmt, öffnet sich der Weg, „Herrscher aller Rus“ zu werden."
 lit_steppe_frontier: "Die Steppengrenze"
 lit_steppe_frontier_desc: "Die große Steppe, durchstreift von Tataren und Kumanen – errichte eine Verteidigungslinie in diesem gefährlichen Grenzland und öffne den Weg zur Krim."
 lit_crimea: "Die Unterwerfung der Krim"
 lit_crimea_desc: "Die Halbinsel Krim – Schlüssel zum Schwarzen Meer. Unterwirf das Tatarenkhanat der Krim und sichere das Tor zum Schwarzen Meer."
 lit_black_sea: "Herr des Schwarzen Meeres"
 lit_black_sea_desc: "Das Schwarze Meer – Litauens Meer. Von der Krim bis Odessa färbe die gesamte Schwarzmeerküste mit dem litauischen Banner."
 lit_dominant_in_rus: "Vorherrschaft in der Rus"
 lit_dominant_in_rus_desc: "Moskau oder Litauen – im Kampf um die Vorherrschaft über Osteuropa triumphiert Litauen und herrscht als „Herrscher aller Rus“."
 lit_teutonic_defeat: "Der Fall des Deutschen Ordens"
 lit_teutonic_defeat_desc: "Der alte Feind seit Tannenberg, der Deutsche Orden, ist endlich gefallen – die Beherrschung der Ostsee gehört Litauen."
 lit_samogitia: "Schemaiten"
 lit_samogitia_desc: "Schemaiten – ein Land, lange mit dem Deutschen Orden umstritten. Gewinne die Heimat dieses trotzigen baltischen Volkes für Litauen zurück."
 lit_livonia: "Die Beherrschung Livlands"
 lit_livonia_desc: "Riga und Livland – bringe das Herz des Ostseehandels unter litauische Kontrolle und begründe Einfluss auf die Hanse."
 lit_jogaila_union: "Die Union Jogailas"
 lit_jogaila_union_desc: "Die Union Großfürst Jogailas mit dem Königreich Polen – durch Übertritt zum Katholizismus und Heirat werden Litauen und Polen verbunden."
 lit_jagiellonian_dynasty: "Die Jagiellonen-Dynastie"
 lit_jagiellonian_dynasty_desc: "Die Jagiellonen-Dynastie – über Litauen und Polen zugleich herrschend, erhebt sich dieses Haus als größte Macht Mitteleuropas."
 lit_lublin_union: "Die Union von Lublin"
 lit_lublin_union_desc: "Die Union von Lublin von 1569 – der historische Augenblick, da Litauen und Polen als „Polnisch-Litauische Adelsrepublik“ vereint werden."
 lit_polish_sejm: "Der polnische Sejm"
 lit_polish_sejm_desc: "Der Sejm – diese Einrichtung, durch die die Szlachta an den Entscheidungen des Staates teilhat, wird zum Herzen der Adelsrepublik."
 lit_commonwealth: "Die Vollendung der Adelsrepublik"
 lit_commonwealth_desc: "Die Polnisch-Litauische Adelsrepublik – der größte Staat Mitteleuropas, der sich von der Ostsee bis zum Schwarzen Meer erstreckt, ist vollendet. „Für unsere Freiheit“ – das Banner dieser Adelsrepublik erstrahlt über Europa."
 lit_faith_choice: "Die Wahl des Glaubens"
 lit_faith_choice_desc: "Katholisch, orthodox oder Romuva – welchen Glauben wird Litauen wählen? Diese Entscheidung wird die Zukunft der Nation bestimmen."
 lit_catholic_baptism: "Die Taufe zum katholischen Glauben"
 lit_catholic_baptism_desc: "Die Taufe Wilnas von 1387 – Litauen nimmt den Katholizismus an und wird Teil der europäischen Christenheit."
 lit_faith_romuva_chosen_tt: "Romuva gewählt"
 lit_faith_orthodox_chosen_tt: "Orthodoxie gewählt"
 lit_faith_catholic_chosen_tt: "Katholizismus gewählt"
 lit_catholic_crusade: "Katholischer Kreuzzug"
 lit_catholic_crusade_desc: "Unter dem katholischen Banner – durch den Gegenschlag gegen den heidnischen Kreuzfahrerstaat des Deutschen Ordens wird Litauen als Beschützer der katholischen Welt anerkannt."
 lit_catholic_bishoprics: "Die Errichtung der Bistümer"
 lit_catholic_bishoprics_desc: "Das Bistum Wilna – organisiere die Struktur der katholischen Kirche in Litauen und lass den Glauben tief Wurzeln schlagen."
 lit_catholic_king: "Die Krönung des katholischen Königs"
 lit_catholic_king_desc: "Der katholische König von Polen-Litauen – eine rechtmäßige, vom Papst anerkannte Krone erstrahlt nun über der Jagiellonen-Dynastie."
 lit_orthodox_metropolis: "Die orthodoxe Metropolie"
 lit_orthodox_metropolis_desc: "Die Metropolie Kiew – Litauen nimmt das Zentrum der Orthodoxie der Rus unter seinen Schutz. Herrsche über Osteuropa als Beschützer der orthodoxen Gläubigen."
 lit_orthodox_third_rome: "Das Dritte Rom"
 lit_orthodox_third_rome_desc: "Nun, da Konstantinopel gefallen ist – wird Kiew zum neuen Zentrum der Orthodoxie, dem „Dritten Rom“."
 lit_orthodox_unity: "Die Einheit der orthodoxen Kirche"
 lit_orthodox_unity_desc: "Die Einheit der orthodoxen Gläubigen – die orthodoxen Kirchen der ganzen Rus versammeln sich unter Litauens Schutz."
 lit_orthodox_tsar: "Der orthodoxe Zar"
 lit_orthodox_tsar_desc: "„Zar aller Rus“ – ein litauischer Monarch, der orthodoxe Autorität mit der Herrschaft über die Rus verbindet, übertrifft Moskau selbst."
 lit_romuva_maintained: "Romuva bewahren"
 lit_romuva_maintained_desc: "Romuva, der uralte baltische Glaube – die ewige Flamme des Žinis brennt neu, während Litauen unter dem heidnischen Banner steht."
 lit_romuva_sanctuary: "Das Heiligtum errichten"
 lit_romuva_sanctuary_desc: "Die heiligen Haine Litauens – schütze die Heiligtümer Romuvas und begründe das geistliche Zentrum des baltischen Glaubens."
 lit_romuva_expansion: "Heidnische Ausdehnung"
 lit_romuva_expansion_desc: "Verbreite Romuva mit dem Schwert – bekehre die umliegenden Orthodoxen, Katholiken und Muslime zu Romuva und errichte einen „großen heidnischen Staat“."
 lit_romuva_pagan_king: "Der Heidenkönig"
 lit_romuva_pagan_king_desc: "„Großer Heidenkönig“ – ein litauischer heidnischer Monarch ist geboren, der die Flamme Romuvas erhebt und von der Ostsee bis zur Steppe herrscht."
 lit_vilnius_capital: "Die Entwicklung Wilnas"
 lit_vilnius_capital_desc: "Wilna – Litauens goldene Stadt. Entwickle ihre Paläste, ihren Dom und ihre Märkte und verleih ihr eine Pracht, die einer kaiserlichen Hauptstadt würdig ist."
 lit_amber_road: "Die Bernsteinstraße"
 lit_amber_road_desc: "Die Bernsteinstraße – ergreife diesen Handelsweg, auf dem baltischer Bernstein zum Mittelmeer getragen wird, und mache Litauen zu einer Drehscheibe des europäischen Handels."
 lit_grand_duchy_law: "Das Litauische Statut"
 lit_grand_duchy_law_desc: "Das Litauische Statut – 1529 als das fortschrittlichste Gesetzbuch Mitteleuropas erlassen, modernisiere Litauens Regierung."
 lit_krakow: "Die Entwicklung Krakaus"
 lit_krakow_desc: "Krakau – entwickle diese Stadt jagiellonischen Glanzes und lass sie als zweite Hauptstadt der Polnisch-Litauischen Adelsrepublik erstrahlen."
 lit_red_ruthenia: "Die Eroberung Rotrutheniens"
 lit_red_ruthenia_desc: "Rotruthenien und Halytsch – von Polen und Ungarn umstritten, nimm dieses Land für Litauen ein und dehne sein Gebiet bis zu den Karpaten aus."
 lit_moldavia: "Die Unterwerfung der Moldau"
 lit_moldavia_desc: "Die Moldau – ein rumänisches Fürstentum an der Donau. Unterwirf diesen Staat und begründe einen Stützpunkt zum Balkan."
 lit_grand_empire: "Das litauische Großreich"
 lit_grand_empire_desc: "„Von der Ostsee bis zum Schwarzen Meer“ – Großfürst Vytautas’ Traum wird verwirklicht. Das Großfürstentum Litauen herrscht als Europas größtes Reich."
 lit_events.5.t: "Die Wahl des Glaubens"
 lit_events.5.d: "Litauen steht an einem Scheideweg. Zum Katholizismus übertreten und das Bündnis mit Polen vertiefen? Die Orthodoxie schützen und Beschützer der Rus werden? Oder den überlieferten Glauben Romuvas bewahren und als großer Heidenkönig dastehen?"
 lit_events.5.a: "Zum Katholizismus übertreten – der Christenheit beitreten und das polnische Bündnis vertiefen"
 lit_events.5.b: "Die Orthodoxie wählen – Beschützer der Rus und der Ostchristenheit werden"
 lit_events.5.c: "Romuva bewahren – niemals die heilige Flamme des Žinis erlöschen lassen"
 lit_events.10.t: "Die Eroberung Kiews"
 lit_events.10.d: "Kiew – die Mutter aller Städte der Rus – ist an Litauen gefallen. Es ist Litauen, nicht Moskau, das nun das Erbe der Kiewer Rus trägt."
 lit_events.10.a: "Es lebe Kiew! Es lebe der Beschützer aller Rus!"
 lit_events.15.t: "Der katholische König"
 lit_events.15.d: "Unter päpstlicher Anerkennung wird der katholische König Litauens und Polens gekrönt – Litauen ist nun förmlich Teil der katholischen Welt."
 lit_events.15.a: "Es lebe der katholische König! Möge das Königreich für immer bestehen!"
 lit_events.16.t: "Zar von Litauen"
 lit_events.16.d: "Der Herrscher Litauens erklärt sich zum „Zaren aller Rus“ – Beschützer des orthodoxen Glaubens. Es ist Wilna, nicht Moskau, das das Dritte Rom sein soll."
 lit_events.16.a: "Es lebe der Zar! Es lebe das Dritte Rom!"
 lit_events.17.t: "Der Heidenkönig"
 lit_events.17.d: "Die ewige Flamme des Žinis brennt hell – ein „Großer Heidenkönig“ ist unter dem Banner Romuvas aufgestiegen und herrscht von der Ostsee bis zur Steppe."
 lit_events.17.a: "Es lebe der Heidenkönig! Möge Romuvas Flamme ewig brennen!"
 lit_events.20.t: "Der Fall des Deutschen Ordens"
 lit_events.20.d: "Von Tannenberg bis zur letzten Abrechnung – der Deutsche Orden ist endlich gefallen. Die Ostsee gehört Litauen."
 lit_events.20.a: "Der Deutsche Orden ist besiegt! Die Ostsee ist unser!"
 lit_events.99.t: "Das litauische Großreich"
 lit_events.99.d: "Von der Ostsee bis zum Schwarzen Meer – Vytautas’ Traum ist erfüllt. Litauen herrscht als Osteuropas größtes Reich und übertrifft die alte Rus selbst."
 lit_events.99.a: "Es lebe das litauische Großreich! Ewiger Ruhm!"
 STATIC_MODIFIER_NAME_lit_amber_mod: "Die Beherrschung der Bernsteinstraße"
 STATIC_MODIFIER_DESC_lit_amber_mod: "Der baltische Bernsteinhandel verdoppelt Litauens Reichtum."
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "Die Organisation der Bistümer"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "Die Struktur der katholischen Kirche in Litauen ist begründet, und der Glaube hat tiefe Wurzeln geschlagen."
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "Herrschaft über das Schwarze Meer"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "Das Schwarze Meer ist zu Litauens Binnensee geworden und bringt einen gewaltigen Strom von Handelseinkommen."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Die Autorität des katholischen Königs"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "In ganz Europa als katholischer König anerkannt, ist Litauens diplomatische Autorität begründet."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Die Taufe zum Katholizismus"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "Litauen ist zum Katholizismus übergetreten und Teil der europäischen Christenheit geworden."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Die Unterwerfung der Krim"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "Die Halbinsel Krim ist unter litauische Kontrolle gekommen und öffnet das Tor zum Schwarzen Meer."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Kreuzzugsgeist"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "Der katholische Kreuzzugsgeist hat das litauische Heer geschmiedet."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "Das Erwachen der Gediminiden-Dynastie"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "Das Blut der Gediminiden entfacht Ambitionen zur Eroberung Osteuropas."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Die Vollendung des litauischen Großreiches"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "Von der Ostsee bis zum Schwarzen Meer – Großfürst Vytautas’ Traum ist verwirklicht."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Die Herrschaft der Jagiellonen-Dynastie"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "Die Jagiellonen-Dynastie erhebt sich als größtes Königshaus Mitteleuropas."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "Die Union Jogailas"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "Das Wachssiegel auf der Union von Krewo hat den Respekt, den litauische Gesandte am polnischen Hof erhalten, völlig verändert."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Der Wohlstand Krakaus"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Krakau erstrahlt als Stadt jagiellonischen Glanzes."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Die Beherrschung Livlands"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Livland, das Herz des Ostseehandels, steht nun unter dem litauischen Banner."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Die Unterwerfung der Moldau"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Die Moldau wird als Vasall Litauens zu einem Stützpunkt zum Balkan."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Der Schutz der orthodoxen Kirche"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Litauen hat die orthodoxe Kirche unter seinen Schutz genommen und wird als Beschützer der Rus anerkannt."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "Der orthodoxe Zar"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "Als Zar aller Rus herrscht Litauen als Führer der orthodoxen Welt."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Die Einheit der orthodoxen Kirche"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "Die orthodoxen Kirchen der ganzen Rus haben sich unter dem litauischen Banner versammelt."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Die Hegemonie des Großen Heidenkönigs"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Unter dem Banner Romuvas herrscht der Heidenkönig von der Ostsee bis zur Steppe."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Heidnische Ausdehnung"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Unter dem heidnischen Banner fegt das litauische Heer über die Nachbarstaaten."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Die Eroberung Rotrutheniens"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "Rotruthenien und Halytsch sind Litauens Herrschaftsbereich beigetreten."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Die Wiederbelebung Romuvas"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "Romuva, der uralte baltische Glaube, ist wiederbelebt, und Litauen steht als heidnischer Staat da."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Herrscher der Rus"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Litauen ist Herrscher aller Rus und Führer Osteuropas geworden."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Die Unterwerfung Schwarzrutheniens"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "Schwarzruthenien ist Litauens Herrschaftsbereich beigetreten und begründet ein Fundament für die Ausdehnung nach Osten."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Die Errichtung des Romuva-Heiligtums"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Die heiligen Haine Litauens sind begründet, und die heidnische Flamme brennt hell."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Die Errichtung des Sejm"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "Der Sejm ist errichtet und modernisiert Litauens Regierung."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Die Beherrschung Smolensks"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Smolensk wirkt als Litauens östlicher Torwächter."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Die Errichtung der Steppengrenze"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "Die Steppengrenze ist errichtet und hält tatarische Einfälle auf."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Widerstand gegen den Deutschen Orden"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "Die Bedrohung durch den Deutschen Orden hat das litauische Heer geschmiedet."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "Das Dritte Rom"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Kiew ist zum „Dritten Rom“, dem Zentrum der orthodoxen Kirche, geworden."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Die Eroberung Wolhyniens und Podoliens"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "Die Ebenen der Westukraine sind mit dem litauischen Banner gefärbt."
 lit_vilnius_jerusalem: "Das Jerusalem des Nordens"
 lit_vilnius_jerusalem_desc: "Wilna – „das Jerusalem des Nordens“. Kunst und Bevölkerung strömen in diese Stadt, in der vielfältige Religionen und Kulturen zusammenleben, und sie erstrahlt als Litauens kulturelles Zentrum in Europa."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "Jerusalem des Nordens"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Wilna wird zum „Jerusalem des Nordens“ – einem Zentrum vielfältiger Völker, Religionen und Kulturen."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Die Niederlage des Deutschen Ordens"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "Das Schwarzkreuzbanner der Marienburg ist gesenkt, und litauische Soldaten marschieren mit Siegesliedern nach Westen."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Wilna entwickelt"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Vom Gediminas-Turm in Wilna erstrecken sich die Dächer und Mauern der kaiserlichen Hauptstadt in den Blick."
 lit_memel: "Klaipėda – Tor zur Ostsee"
 lit_memel_desc: "Klaipėda (Memel) – eine Hafenstadt an der Ostseeküste. Vom Deutschen Orden zurückgewonnen, entwickle diese Stadt als Litauens Tor zum Meer und Zentrum des Bernsteinhandels."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Der Hafen Klaipėda entwickelt"
 STATIC_MODIFIER_DESC_lit_memel_mod: "Der Hafen Klaipėda ist als Tor zum Ostseehandel entwickelt."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Die Vorteile der Union von Lublin"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "Das parlamentarische System und die Verwaltung der Adelsrepublik sind begründet."
 lit_lublin_dev: "Die Entwicklung Lublins"
 lit_lublin_dev_desc: "Lublin – der künftige Ort der Union von Lublin. Entwickle diese Stadt als Verwaltungs- und Handelszentrum Südlitauens."
 lit_lviv_dev: "Die Entwicklung Lembergs"
 lit_lviv_dev_desc: "Lemberg (Lwów) – ein Kreuzungspunkt des östlichen Handels. Entwickle das Zentrum Halytschs und fördere den Wohlstand im Südosten des Reiches."
 lit_kaunas_dev: "Kaunas – Hüter des litauischen Rechts"
 lit_kaunas_dev_desc: "Kaunas (Kowno) – am Zusammenfluss von Neris und Nemunas gelegen, diente diese Stadt als Sitz des Obersten Tribunals des Großfürstentums Litauen (Lietuvos Vyriausiasis Tribunolas) und wirkte als höchste Berufungsinstanz für die litauische Seite der Adelsrepublik. Wie der königliche Hof zu Krakau in Polen oder das Parlement d’Aix in der Provence diente Kaunas als Hüter regionalen Rechts, das zentrale Gesetzgebung und örtliche Gewohnheit verband. Entwickle Kaunas als Zentrum der litauischen Rechtsverwaltung."
 lit_hrodna_dev: "Die Entwicklung Grodnos"
 lit_hrodna_dev_desc: "Grodno (Hrodna) – das Zentrum Schwarzrutheniens. Entwickle diese wichtige Westliche Stadt des Großfürstentums."
 lit_minsk_dev: "Die Entwicklung Minsks"
 lit_minsk_dev_desc: "Minsk – das Zentrum Weißrusslands. Entwickle es als östliche Verwaltungsdrehscheibe des litauischen Reiches."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "Die Adelsrepublik vollendet"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "Die Polnisch-Litauische Adelsrepublik ist vollendet – Verwaltung und Heer sind in allen Gebieten organisiert."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Lublin blüht"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Lublin ist als Verwaltungs- und Handelszentrum Südlitauens entwickelt."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Lemberg blüht"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Lemberg blüht als Kreuzungspunkt des östlichen Handels."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Das Oberste Tribunal des Großfürstentums Litauen"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Kaunas ist als Binnendrehscheibe für den Ostseehandel entwickelt."
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "Verwaltungsverstärkung Grodnos"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "Von den Toren Grodnos galoppieren die Pferde der Kuriere von morgens bis abends zur Hauptstadt Wilna."
 STATIC_MODIFIER_NAME_lit_minsk_mod: "Minsk blüht"
 STATIC_MODIFIER_DESC_lit_minsk_mod: "Minsk ist als östliche Verwaltungsdrehscheibe des litauischen Reiches entwickelt."
