l_german:
 teo_theodoro_mission_pack: "Fürstentum Theodoro: Gotia wiedergeboren und Herr des Schwarzen Meeres"
 teo_theodoro_mission_pack_DESCRIPTION:0 "Im Jahr 1337 klammert sich das Fürstentum Theodoro an die Bergfestung Mangup auf der Halbinsel Krim. Einst Teil des Byzantinischen Reiches, ist dieses griechische Fürstentum von Tataren, Genuesen und den aufstrebenden Osmanen umgeben. Nutze das kaufmännische Genie und die militärische Tüchtigkeit der Familie Gavras, um den Schwarzmeerhandel zu ergreifen, den Namen Gotia wiederzubeleben, Konstantinopel zurückzuerobern und als Gotisches Reich über das östliche Mittelmeer zu herrschen."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Beherrsche das Schwarze Meer, vertreibe die Genuesen, erobere Konstantinopel zurück und beherrsche als Gotisches Reich das östliche Mittelmeer, das Schwarze Meer und die Steppen."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Herrsche als Gotisches Reich über das östliche Mittelmeer."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "Errichte von der Bergfestung Mangup aus das Gotische Reich durch Schwarzmeerhandel, byzantinisches Erbe und Steppeneroberung!"
 teo_rise_of_theodoro: "Der Aufstieg Theodoros"
 teo_rise_of_theodoro_desc: "Von der Bergfestung Mangup aus beginnt das Fürstentum Theodoro seinen Aufstieg. Umgeben von Tataren, Genuesen und Osmanen, wird das Genie der Familie Gavras die Krise in eine Gelegenheit verwandeln."
 teo_black_sea_fleet: "Die Schwarzmeerflotte"
 teo_black_sea_fleet_desc: "Das Schwarze Meer wird von Genua, Venedig, Tataren und Osmanen umstritten. Baue eine Flotte auf, um theodoranische Macht auf diesen lebenswichtigen Gewässern zu behaupten."
 teo_build_theodoro_harbor: "Der Hafen Theodoros"
 teo_build_theodoro_harbor_desc: "Entwickle Theodoros Hafen am Fuß Mangups, um es als Schwarzmeerseemacht zu begründen."
 teo_genoese_question: "Die genuesische Frage"
 teo_genoese_question_desc: "Genuas Kolonie Gasaria beherrscht von Caffa aus den Schwarzmeerhandel. Kaufe Gasaria als Vasall – oder bewahre die Schatzkammer."
 teo_expel_genoese: "Die Genuesen vertreiben"
 teo_expel_genoese_desc: "Vertreibe die Genuesen von der Krim und nimm ihre Kolonien ein, um theodoranische Vorherrschaft zu begründen."
 teo_dominate_crimea: "Die Krim beherrschen"
 teo_dominate_crimea_desc: "Vertreibe alle Rivalen von der Krim und herrsche als ihr alleiniger Herr."
 teo_tana_trade: "Der Handel von Tana"
 teo_tana_trade_desc: "Nimm die Handelsdrehscheibe Tana an der Don-Mündung ein, um die östlichen Handelswege zu beherrschen."
 teo_black_sea_domination: "Die Beherrschung des Schwarzen Meeres"
 teo_black_sea_domination_desc: "Behaupte die vollständige Vorherrschaft über das Schwarze Meer und lass keinen Rivalen zurück, der theodoranische Vorherrschaft herausfordert."
 teo_greek_heritage: "Griechisches Erbe"
 teo_greek_heritage_desc: "Stärke den orthodoxen Glauben und das byzantinische kulturelle Erbe, das Theodoros Legitimität untermauert."
 teo_trebizond_relations: "Beziehungen zu Trapezunt"
 teo_trebizond_relations_desc: "Bestimme das Verhältnis zum Komnenischen Reich von Trapezunt – biete Vasallentum an oder wahre das Bündnis."
 teo_restore_pontus: "Pontos wiederherstellen"
 teo_restore_pontus_desc: "Erobere die pontische Küste und stelle das antike Königreich Pontos wieder her."
 teo_constantinople: "Konstantinopel zurückerobern"
 teo_constantinople_desc: "Gewinne das Zweite Rom von den Osmanen zurück und stelle das orthodoxe Kreuz über der Hagia Sophia wieder her."
 teo_gothia_ascendant: "Gotia im Aufstieg"
 teo_gothia_ascendant_desc: "Verkünde die Wiederbelebung Gotias und werde als rechtmäßiger Nachfolger von Byzanz anerkannt."
 teo_aegean_supremacy: "Vorherrschaft in der Ägäis"
 teo_aegean_supremacy_desc: "Nimm die Ägäischen Inseln und die Küste ein, um theodoranische Seemacht ins Mittelmeer auszudehnen."
 teo_balkans: "Den Balkan erobern"
 teo_balkans_desc: "Erobere den Balkan – das Kernland des ehemaligen Byzantinischen Reiches – um das Gotische Reich zu festigen."
 teo_azov_gateway: "Das Tor zum Asowschen Meer"
 teo_azov_gateway_desc: "Beherrsche das Asowsche Meer, um die Binnenhandelswege über Don und Wolga zu öffnen."
 teo_pryazovia: "Priasowien"
 teo_pryazovia_desc: "Sichere die Region Priasowien nördlich des Asowschen Meeres und öffne den Weg in die Steppen."
 teo_tatar_wars: "Kriege gegen die Tataren"
 teo_tatar_wars_desc: "Kämpfe gegen die Krimtataren, um theodoranische Reiterei zu elitären Steppenkriegern zu schmieden."
 teo_into_steppes: "In die Steppen"
 teo_into_steppes_desc: "Erobere die weite pontische Steppe und verwandle Theodoro in ein kontinentales Reich."
 teo_caucasus_gateway: "Das Tor zum Kaukasus"
 teo_caucasus_gateway_desc: "Dringe in die Bergländer des Kaukasus vor – Georgien, Armenien und Aserbaidschan."
 teo_caspian_reach: "Das Kaspische Meer erreichen"
 teo_caspian_reach_desc: "Erreiche das Kaspische Meer, um Zugang zu persischen und zentralasiatischen Handelswegen zu gewinnen."
 teo_russian_question: "Die russische Frage"
 teo_russian_question_desc: "Bestimme das Verhältnis zu Moskau und Nowgorod – schmiede ein Bündnis oder strebe die Eroberung an."
 teo_russian_claim: "Anspruch auf die Rus"
 teo_russian_claim_desc: "Weite theodoranischen Einfluss über die Fürstentümer der Rus aus."
 teo_ruthenia_conquest: "Die Eroberung Rutheniens"
 teo_ruthenia_conquest_desc: "Erobere Ruthenien einschließlich Kiews und beanspruche den Mantel sowohl von Byzanz als auch der Rus."
 teo_dev_theodoro: "Theodoro entwickeln"
 teo_dev_theodoro_desc: "Entwickle die Festungsstadt Theodoro zu einer Hauptstadt, die des Gotischen Reiches würdig ist."
 teo_trade_empire: "Handelsreich"
 teo_trade_empire_desc: "Errichte ein Handelsreich am Kreuzungspunkt von Schwarzem Meer, Mittelmeer und Seidenstraße."
 teo_silk_road: "Der Handel auf der Seidenstraße"
 teo_silk_road_desc: "Beherrsche die Seidenstraße und monopolisiere den Strom der Seide von Zentralasien zu den westlichen Märkten."
 teo_gothic_culture: "Gotische Kultur"
 teo_gothic_culture_desc: "Fördere eine eigenständige gotische Kultur, die griechisches, gotisches und tatarisches Erbe verschmilzt."
 teo_orthodox_fortress: "Orthodoxe Festung"
 teo_orthodox_fortress_desc: "Baue ein Netz orthodoxer Klöster und militärischer Festungen auf, um den Glauben zu verteidigen."
 teo_great_theodoro: "Groß-Theodoro"
 teo_great_theodoro_desc: "Verwandle Mangup in die ewige Hauptstadt des Gotischen Reiches, ein Leuchtfeuer der Zivilisation."
 teo_crimean_wine: "Krimwein"
 teo_crimean_wine_desc: "Belebe die uralte griechische Tradition des Weinbaus auf der Krim neu und liefere Wein an die Mittelmeermärkte."
 teo_fortress_mangup: "Die Festung Mangup"
 teo_fortress_mangup_desc: "Befestige Mangup – die natürliche Hochplateaufestung, die selbst die Osmanen nur mit Mühe einnehmen konnten."
 teo_anatolian_coast: "Die anatolische Küste"
 teo_anatolian_coast_desc: "Erobere die südliche Schwarzmeerküste Anatoliens, um das Schwarze Meer zu einem theodoranischen Binnensee zu machen."
 teo_orthodox_patriarch: "Orthodoxes Patriarchat"
 teo_orthodox_patriarch_desc: "Errichte ein Patriarchat in Konstantinopel, das Theodoro zum Beschützer aller orthodoxen Christen macht."
 teo_merchant_republic: "Kaufmannsrepublik"
 teo_merchant_republic_desc: "Errichte durch Handel und Eroberung das größte Handelsreich des Mittelmeers."
 teo_dev_trebizond_city: "Trapezunt entwickeln"
 teo_dev_trebizond_city_desc: "Entwickle Trapezunt zu einer wichtigen Handelsdrehscheibe an der südlichen Schwarzmeerküste."
 teo_gavras_triumphant: "Der Triumph der Gavras"
 teo_gavras_triumphant_desc: "Das kaufmännische Genie und die militärische Tapferkeit der Familie Gavras haben von einer Bergfestung aus ein großes Reich erschaffen."
 teo_gothia_empire: "Das Gotische Reich"
 teo_gothia_empire_desc: "Herrsche als Kaiser von Gotia – Herr des Schwarzen Meeres, des Mittelmeers und der Steppen."
 teo_events.1.t: "Theodoro erhebt sich – griechische Tradition oder gotischer Stolz?"
 teo_events.1.d: "Im Jahr 1337 beginnt von der Hochplateaufestung Mangup aus das Fürstentum Theodoro seinen Aufstieg. Umgeben von Tataren, Genuesen und Osmanen, werden das kaufmännische Genie und der militärische Mut der Familie Gavras diese Krise in eine Gelegenheit verwandeln. Ergreife den Schwarzmeerhandel, belebe Gotia wieder und gewinne Konstantinopel zurück."
 teo_events.1.a: "Die pontisch-griechische Tradition bewahren – wir sind die Erben von Byzanz"
 teo_events.10.t: "Wiedervereinigung mit Trapezunt – die Verbindung der Komnenen"
 teo_events.10.d: "Das Trapezuntische Reich der Komnenen-Dynastie schwindet unter osmanischem Druck. Sollen wir als Mitgriechen Trapezunt helfen oder es in Gotia eingliedern?"
 teo_events.10.a: "Trapezunt zum Vasall machen – das pontische Erbe unter Gotia schützen"
 teo_events.20.t: "Konstantinopel zurückerobert – die Krönung des Gotischen Königs"
 teo_events.20.d: "Konstantinopel ist in Gotias Hand! Die orthodoxe heilige Stadt von den Osmanen zurückzugewinnen bedeutet, dass Russland als „Drittes Rom“ zum geistlichen Führer der orthodoxen Welt wird. Das christliche Kreuz weht noch einmal über der Hagia Sophia."
 teo_events.20.a: "Es lebe der Gotische König! Es lebe Konstantinopel!"
 teo_events.30.t: "Die russische Frage – Bündnis oder Eroberung?"
 teo_events.30.d: "Die Familie Gavras hat tiefe Bande zu russischen Adelshäusern. Wie sollen wir unser Verhältnis zu Moskau und Nowgorod bestimmen – ein Bündnis schmieden, das gemeinsame Interessen schützt, oder die Rus unter Gotias Herrschaft bringen?"
 teo_events.30.a: "Mit Russland verbünden – als orthodoxe Brüder zusammenarbeiten"
 teo_events.30.b: "Auf die Eroberung der Rus zielen – Gotia soll der wahre Herr der Rus sein"
 teo_events.60.t: "Der Triumph der Gavras – die Geburt des Gotischen Reiches"
 teo_events.60.d: "Beherrschung des Schwarzen Meeres, Konstantinopel zurückerobert, Steppen erobert – die Familie Gavras herrscht nun als „Kaiser des Gotischen Reiches“ über das östliche Mittelmeer. Die Reise von der Bergfestung Mangup endet mit der Gründung eines Weltreiches."
 teo_events.60.a: "Es lebe das Gotische Reich! Es lebe die Familie Gavras!"
 teo_events.99.t: "Das Gotische Reich – ewiger Ruhm"
 teo_events.99.d: "„Kaiser von Gotia – Herr des Schwarzen Meeres, des Mittelmeers und der Steppe“ – dieses Reich am Kreuzungspunkt östlicher und westlicher Zivilisation herrscht höchst. Die wundersame Geschichte, die 1337 mit der kleinen Festung Mangup begann, findet hier ihren Abschluss."
 teo_events.99.a: "Es lebe das Gotische Reich! Es lebe ewiger Ruhm!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "Die Schwarzmeerflotte"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "Theodoros Schwarzmeerflotte behauptet die Vorherrschaft über die lebenswichtigen Handelsgewässer."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "Der Hafen Theodoros"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "Der Hafen am Fuß Mangups dient als Tor theodoranischer Seemacht."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Krimhandel"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "Die krimtatarischen Handelswege sind unter theodoranischer Kontrolle gesichert."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Die Krim beherrscht"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "Alle Rivalen sind von der Krim vertrieben – Theodoro herrscht als ihr alleiniger Herr."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Handelsdrehscheibe Tana"
 STATIC_MODIFIER_DESC_teo_tana_mod: "Die Handelsdrehscheibe Tana an der Don-Mündung ist beherrscht und öffnet den östlichen Handel."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Herr des Schwarzen Meeres"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Vollständige Vorherrschaft über das Schwarze Meer – kein Rivale wagt es, theodoranische Vorherrschaft herauszufordern."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "Griechisches Erbe"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "Die Ikonen und die Liturgie von Byzanz werden noch immer in den Kapellen Theodoros bewahrt und stützen still die Legitimität dieses Landes."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Pontos wiederhergestellt"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "Die pontische Küste ist gesichert und öffnet den Weg zur Vorherrschaft im Schwarzen Meer."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "Gotia im Aufstieg"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "Das Gotische Reich ist verkündet – die Wiederbelebung Gotias von der Welt anerkannt."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Vorherrschaft in der Ägäis"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "In den Häfen der Ägäischen Inseln liegen Schiffe unter der Flagge Gotias in Reihen, und die Ladungen des Mittelmeerhandels werden eine nach der anderen umgeschlagen."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Der Balkan erobert"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "Der Balkan ist erobert – das Gotische Reich erstreckt sich über das ehemalige byzantinische Kernland."
 STATIC_MODIFIER_NAME_teo_azov_mod: "Das Tor zum Asowschen Meer"
 STATIC_MODIFIER_DESC_teo_azov_mod: "Das Tor zum Asowschen Meer öffnet Binnenhandelswege über Don und Wolga."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Priasowien gesichert"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "Die nördliche Küste des Asowschen Meeres ist gesichert und öffnet den Weg in die Steppen."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Der Kampf gegen die Tataren"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "Kämpfe gegen die Krimtataren haben theodoranische Reiterei zu elitären Steppenkriegern geschmiedet."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Herr der Steppen"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "Die weite pontische Steppe fällt unter theodoranische Herrschaft – ein kontinentales Reich entsteht."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Der Kaukasusfeldzug"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "Das Tor zum Kaukasus öffnet den Zugang zum persischen und zentralasiatischen Handel."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Das Kaspische Meer erreicht"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "Das Kaspische Meer ist erreicht – persische und zentralasiatische Handelswege sind nun zugänglich."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Anspruch auf die Rus"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Gesandte der Fürsten der Rus besuchen den Hof Gotias, und auch russische Adlige treten einer nach dem anderen unter sein Banner."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Ruthenien erobert"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "Ruthenien einschließlich Kiews ist erobert – der Mantel von Byzanz und der Rus ist beansprucht."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Theodoro entwickelt"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "Die Festungsstadt Theodoro ist zu einer Hauptstadt entwickelt, die des Gotischen Reiches würdig ist."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "Handelsreich"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "Ein großes Handelsreich ist am Kreuzungspunkt der Zivilisationen errichtet."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Der Handel auf der Seidenstraße"
 STATIC_MODIFIER_DESC_teo_silk_mod: "Die Seidenstraße ist beherrscht – Seide fließt durch theodoranische Hände zu den westlichen Märkten."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "Gotische Kultur"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "Eine eigenständige gotische Kultur entsteht, die griechisches, gotisches und tatarisches Erbe verschmilzt."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Orthodoxe Festung"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Orthodoxe Klöster und militärische Festungen verteidigen Glauben und Grenze gleichermaßen."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "Groß-Theodoro"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Mangup ist zur ewigen Hauptstadt des Gotischen Reiches verwandelt."
 STATIC_MODIFIER_NAME_teo_wine_mod: "Krimwein"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Krims Weinberge sind wiederbelebt – feine Weine fließen zu den Mittelmeermärkten."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "Die Festung Mangup"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "Die Festung Mangup ist über jeden Angriff hinaus befestigt – der ewige Sitz des Gotischen Reiches."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Die anatolische Küste gesichert"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "Die südliche Schwarzmeerküste Anatoliens ist erobert – das Meer wird zu einem theodoranischen Binnensee."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "Orthodoxes Patriarchat"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "Konstantinopels Patriarchat macht Theodoro zum Beschützer aller orthodoxen Christen."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "Kaufmannsrepublik"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "Ein weites Handelsnetz erstreckt sich über Mittelmeer, Schwarzes Meer und Seidenstraße."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "Die Stadt Trapezunt"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Trapezunt ist als bedeutende Handelsdrehscheibe an der südlichen Schwarzmeerküste entwickelt."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Die Hegemonie des Gotischen Reiches"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "Die Vision der Gavras-Dynastie ist vollendet – das Gotische Reich herrscht über Meer und Steppe."
 teo_events.1.b: "Den gotischen Stolz wiederbeleben – wir sind die wahren Nachfolger Gotias"
 teo_events.5.t: "Gasaria – kaufen oder ablehnen?"
 teo_events.5.d: "Die Republik Genua verwaltet ihre krimtatarische Handelskolonie „Gasaria (GAZ)“. Gegen die Zahlung von 300 Dukaten schlägt Genua vor, Gasaria als Vasall an Theodoro zu übertragen.\n\nDies ist eine Gelegenheit, die Kontrolle über die Krim friedlich zu begründen – doch 300 Dukaten sind ein hoher Preis. Wirst du sie kaufen?"
 teo_events.5.a: "300 Dukaten zahlen, um Gasaria zu kaufen – die Krim soll unser sein"
 teo_events.5.b: "Ablehnen – die Schatzkammer vorerst bewahren"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "Der Schmerz der gotischen Bekehrung"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Die pontischen Griechen, unfähig, sich an die gotische Sprache und Sitten zu gewöhnen, nähren Groll, der in den Dörfern schwelt – doch alle wissen, dass größerer Lohn wartet, wenn das gotische Reich vollendet ist."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "Wahrer Nachfolger Gotias"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "Das Gotische Reich, unter Bewahrung gotischer Kultur vollendet – der Geist der alten Goten wiederbelebt, bringt dem Gotischen Reich ewigen Ruhm."
 teo_events.10.b: "Das Bündnis wahren – den Stolz der Komnenen achten"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Bündnis mit Russland"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "Freundschaftliches Bündnis mit den russischen Fürstentümern hat Gotias diplomatischen Einfluss erhöht."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "Der Wille, die Rus zu erobern"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "Gotias Wille, die Rus zu erobern, unterdrückt empfangene Feindseligkeit."
 teo_events.99.b: "Das Reich mit gotischem Stolz vollenden – das Recht freischalten, in Germanien einzufallen"
 cb_gothic_invasion: "Gotischer Einfall"
 cb_gothic_invasion_desc: "Ein einzigartiger Kriegsgrund gegen Nationen der deutschen Kulturgruppe – Eroberungskosten und Feindseligkeit um 80% verringert. Ausschließlich für die gotische Hauptkultur freigeschaltet, nach Abschluss der letzten Mission des Gotischen Reiches."
