l_german:
 mos_moscow_mission_pack: "Vom Tatarenjoch zum Selbstherrscher aller Reußen"
 mos_moscow_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist das Großfürstentum Moskau ein kleines Fürstentum unter der Herrschaft der Goldenen Horde. Durch Iwans I. Kalita klug gehäuften Reichtum und sein diplomatisches Geschick gegenüber den Tataren ist Moskau stetig gewachsen. Doch Nowgorod, Twer und Litauen umgeben es, während die Tatarengefahr im Süden fortbesteht. Brich das Tatarenjoch, einige die russischen Fürstentümer, rufe dich zum Zaren aus, herrsche als Drittes Rom und werde zum Selbstherrscher aller Reußen – Herr bis an die Enden Sibiriens."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Brich das Tatarenjoch, erobere Kasan, Astrachan und Nowgorod, um Russland zu einen, beanspruche den Zarentitel, werde zum Dritten Rom und erobere Sibirien."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Werde zum Selbstherrscher aller Reußen."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "Vom Großfürstentum Moskau zum Russischen Reich – erfülle die historische Bestimmung!"
 mos_rally_the_army: "Das Heer mobilisieren"
 mos_rally_the_army_desc: "Im Jahr 1337 ist das Großfürstentum Moskau durch das kluge Geschick Iwans I. Kalita stetig gewachsen. Bereite das Heer vor und beginne, Moskaus Vorherrschaft über die Fürstentümer der Rus auszuweiten."
 mos_break_tatar_yoke: "Das Tatarenjoch brechen"
 mos_break_tatar_yoke_desc: "Seit 1237 lastet Tributpflicht und Unterwerfung unter die Tataren auf Russland. Die Erinnerung an Dmitri Donskois Sieg bei Kulikowo lebt fort. Erkläre die volle Unabhängigkeit und brich das Tatarenjoch für immer."
 mos_conquer_kazan: "Die Eroberung Kasans"
 mos_conquer_kazan_desc: "Das Khanat Kasan beherrscht den Handelsweg der Wolga. Seine Eroberung gibt Moskau die Herrschaft über den großen Strom – nimm Iwans des Schrecklichen Sieg von 1552 vorweg."
 mos_subjugate_kazan: "Die mittlere Wolga unterwerfen"
 mos_subjugate_kazan_desc: "Nach der Eroberung Kasans nimm das mittlere Wolgabecken – Samara und Tambow – ein, um den Weg nach Süden zu öffnen."
 mos_conquer_astrakhan: "Die Eroberung Astrachans"
 mos_conquer_astrakhan_desc: "Das Khanat Astrachan beherrscht das untere Wolgadelta. Erobere es, um den Zugang zum Kaspischen Meer und den östlichen Handelsweg zu begründen."
 mos_destroy_hordes: "Die Vernichtung der Horden"
 mos_destroy_hordes_desc: "Zerschlage die tatarischen Nachfolgestaaten einschließlich der Nogaier-Horde und öffne den Weg in die Steppe."
 mos_claim_steppes: "Die Steppen beanspruchen"
 mos_claim_steppes_desc: "Nimm die pontische Steppe an der nördlichen Schwarzmeerküste ein, um Moskaus Gestalt als großes Kontinentalreich zu enthüllen."
 mos_black_sea_access: "Zugang zum Asowschen Meer"
 mos_black_sea_access_desc: "Stoße zum Asowschen Meer vor, um den Zugang zum Schwarzmeerhandel zu begründen – komm Peters des Großen Einnahme Asows von 1696 zuvor."
 mos_conquer_crimea: "Die Eroberung der Krim"
 mos_conquer_crimea_desc: "Erobere das Krimkhanat, um die Herrschaft über das Schwarze Meer zu begründen – nimm Katharinas der Großen Annexion von 1783 vorweg."
 mos_consolidate_russia: "Die Festigung Russlands"
 mos_consolidate_russia_desc: "Festige mit Moskau als Mittelpunkt die russischen Fürstentümer zu einem einzigen mächtigen Staatsfundament."
 mos_dev_moscow: "Die Entwicklung des Kremls"
 mos_dev_moscow_desc: "Entwickle den Moskauer Kreml – das Sinnbild russischer Macht. Die großen Kathedralen, die diesen heiligen Bezirk füllen, werden zum Herzen des Russischen Reiches."
 mos_conquer_novgorod: "Die Eroberung Nowgorods"
 mos_conquer_novgorod_desc: "Nowgorod – einst Russlands größter Handelsstadtstaat. Verwirkliche Iwans III. entscheidende Eroberung von 1478 noch früher."
 mos_conquer_tver: "Die Eroberung Twers"
 mos_conquer_tver_desc: "Twer, einst Moskaus Rivale – seine Macht ist geschwunden. Erobere diese Schlüsselstadt an der Wolga, um die Einigung der Rus voranzubringen."
 mos_conquer_ryazan: "Die Unterwerfung Rjasans"
 mos_conquer_ryazan_desc: "Rjasan, 1237 als erstes von den Mongolen verwüstet – erobere seine südliche Steppe und errichte eine Verteidigungslinie."
 mos_conquer_smolensk: "Die Eroberung Smolensks"
 mos_conquer_smolensk_desc: "Smolensk, der „Schlüssel Russlands“ – beherrsche diesen Kreuzungspunkt von Ost und West, um westlichen Einfluss zu begründen."
 mos_conquer_ruthenia: "Die Eroberung Rutheniens"
 mos_conquer_ruthenia_desc: "Weißruthenien – erobere die von Litauen beherrschte Region um Minsk und begründe die panslawische Vorherrschaft."
 mos_window_on_west: "Das Fenster zum Westen"
 mos_window_on_west_desc: "Nimm Wyborg und Karelien ein, um das „Fenster zum Westen“ zu öffnen – nimm Peters des Großen Traum vom Zugang zum Westen vorweg."
 mos_baltic_ambition: "Ostseeambitionen"
 mos_baltic_ambition_desc: "Die vom Livländischen Orden beherrschte östliche Ostseeküste – ihre Unterwerfung ermöglicht den Eintritt in den nordeuropäischen Handel."
 mos_conquer_riga: "Die Eroberung Rigas"
 mos_conquer_riga_desc: "Riga, Angelpunkt der Hanse – erobere dieses baltische Handelszentrum, um Zugang zum nordeuropäischen Handelsnetz zu erhalten."
 mos_partition_poland: "Die Teilung Polens"
 mos_partition_poland_desc: "Beende den langen Kampf mit der Polnisch-Litauischen Adelsrepublik um Ruthenien und Osteuropa."
 mos_metropolitan_see: "Der Metropolitansitz Moskau"
 mos_metropolitan_see_desc: "1448 errichtete Moskau eine unabhängige kirchliche Metropolie. Diese orthodoxe Autorität stützt Moskaus politische Legitimität."
 mos_land_of_churches: "Das Land der Kirchen"
 mos_land_of_churches_desc: "„Heiliges Russland“ – errichte im ganzen Land orthodoxe Kathedralen und weihe Russland als Reich Gottes."
 mos_tsar_title: "Der Zarentitel"
 mos_tsar_title_desc: "„Zar (Kaiser)“ – Iwan IV. nahm diesen Titel 1547 förmlich an. Erkläre die Autorität als Nachfolger Roms und erlange Anerkennung als europäische Macht."
 mos_russian_patriarchate: "Das russische Patriarchat"
 mos_russian_patriarchate_desc: "Das 1589 begründete Moskauer Patriarchat, unabhängig von Konstantinopel – festige das religiöse Fundament des „Dritten Roms“."
 mos_guardian_orthodoxy: "Hüter der Orthodoxie"
 mos_guardian_orthodoxy_desc: "Nach dem Fall Konstantinopels an die Osmanen 1453 wird Russland zum Hüter des orthodoxen Glaubens. Errichte ein orthodoxes Netz über das ganze Land."
 mos_conquer_constantinople: "Die Eroberung Konstantinopels"
 mos_conquer_constantinople_desc: "Gewinne die orthodoxe heilige Stadt Konstantinopel aus osmanischer Hand zurück – erfülle die Sendung des „Dritten Roms“ und schreibe die Geschichte neu."
 mos_third_rome: "Das Dritte Rom"
 mos_third_rome_desc: "„Moskau ist das Dritte Rom, und ein viertes wird es nicht geben“ – die Worte des Mönchs Philotheus werden Wirklichkeit. Moskau herrscht als geistiger Mittelpunkt der christlichen Welt."
 mos_march_caucasus: "Marsch in den Kaukasus"
 mos_march_caucasus_desc: "Erobere Georgien, Armenien und Aserbaidschan im Kaukasus und mache Russland zu einem wahren Kontinentalreich."
 mos_caspian_sea: "Herrschaft über das Kaspische Meer"
 mos_caspian_sea_desc: "Das „russische Binnenmeer“ Kaspi – nimm den Handelsweg nach Persien und Zentralasien ein."
 mos_beyond_urals: "Jenseits des Urals"
 mos_beyond_urals_desc: "Das Uralgebirge markiert die Grenze von Europa und Asien – dahinter liegt die riesige Weite Sibiriens. Komm Jermaks Eroberung von 1582 zuvor und beanspruche das Königreich der Pelze."
 mos_conquer_perm: "Die Eroberung Perms"
 mos_conquer_perm_desc: "Perm am oberen Kama – erobere diese Quelle der „Kama-Pelze“ und nutze sie als Sprungbrett für die Eroberung Sibiriens."
 mos_west_siberia: "Westsibirien"
 mos_west_siberia_desc: "Westsibirien um Tobolsk – die gewaltige Taiga liefert endlose Pelzvorkommen. Entwickle Tobolsk zur „Hauptstadt Sibiriens“."
 mos_east_siberia: "Ostsibirien"
 mos_east_siberia_desc: "Nach Irkutsk – das Erreichen des Baikalsees öffnet die Türen nach Ostsibirien."
 mos_pacific_coast: "Die Pazifikküste erreichen"
 mos_pacific_coast_desc: "„Die Kosaken erreichten den Pazifik“ – von Jakutsk bis zum Ochotskischen Meer. Die russische Flagge weht am Rand des Pazifiks."
 mos_fur_monopoly: "Das Pelzmonopol"
 mos_fur_monopoly_desc: "Sibirische Pelze – die am höchsten bewertete Ware auf europäischen Märkten. Monopolisiere ihre Lieferung und gewinne unermesslichen Reichtum."
 mos_sudebnik: "Der Sudebnik (Gesetzbuch)"
 mos_sudebnik_desc: "Der Sudebnik von 1497, Russlands erstes einheitliches Gesetzbuch unter Iwan III. – dieses Gesetzbuch, Fundament der Leibeigenschaft, wird zur Waffe der Zentralisierung."
 mos_handle_boyars: "Die Bojaren im Zaum halten"
 mos_handle_boyars_desc: "Die Bojaren beherrschen die örtliche Macht – brich diesen Zustand und setze unmittelbare zarische Verwalter ein, um die Zentralisierung voranzubringen."
 mos_oprichnina: "Die Opritschnina"
 mos_oprichnina_desc: "Iwans IV. finstere Opritschnina – die schwarzen Reiter des Zaren säuberten die aufsässigen Bojaren. Nutze diese brutale, aber wirksame Politik, um die zarische Autorität zu verabsolutieren."
 mos_dev_agriculture: "Landwirtschaftliche Entwicklung"
 mos_dev_agriculture_desc: "Russlands reiche Schwarzerde – entwickle das fruchtbare Ackerland, das sich von der Ukraine bis zur Wolga erstreckt, um die landwirtschaftliche Produktivität zu steigern."
 mos_dev_agriculture_unlock_tt: "Die Entscheidung „Die Landwirtschaft fördern“ ist nun verfügbar."
 mos_agriculture_decision.title: "Die Landwirtschaft fördern"
 mos_agriculture_decision.desc: "Die Schwarzerde erstreckt sich von der Ukraine bis zur Wolga, doch ihr Ertrag hängt von Geräten, Speichern und der Mitwirkung der Großgrundbesitzer ab. Schatzkammer und der Einfluss des Herrschers am Hof können aufgewendet werden, um sie zu organisieren."
 mos_agriculture_decision.a: "Die Ernten organisieren."
 mos_agriculture_upgrade_decision.title: "Die große Urbarmachung der Schwarzerde"
 mos_agriculture_upgrade_decision.desc: "Sind die ersten Ernten gesichert, kann der Staat die Steppengrenze selbst unter den Pflug nehmen: neue Dörfer, neue Mühlen und neue Wege für den Getreidetransport. Das kostet ein Vermögen und viel vom Einfluss des Herrschers, doch die Schwarzerde wird ertragen wie nie zuvor."
 mos_agriculture_upgrade_decision.a: "Die Steppengrenze unter den Pflug nehmen."
 mos_pomestye_system: "Das Pomestje-System"
 mos_pomestye_system_desc: "Das Pomestje-System – die Vergabe von Land im Austausch für Kriegsdienst bildet das Fundament der russischen Militärstärke."
 mos_streltsy: "Die Strelizen aufstellen"
 mos_streltsy_desc: "Die Strelizen – von Iwan IV. geschaffenes stehendes Schießpulverfußvolk. Diese Eliteeinheit wird zum Rückgrat des russischen Heeres."
 mos_zasechnaya_cherta: "Die Sassetschnaja Tscherta"
 mos_zasechnaya_cherta_desc: "Errichte die „Sassetschnaja Tscherta“ aus Baumverhauen und Festungen als Verteidigungslinie gegen Einfälle der tatarischen Reiterei."
 mos_dev_arkhangelsk: "Archangelsk erbauen"
 mos_dev_arkhangelsk_desc: "Archangelsk, der Hafen am Weißen Meer – vor Peter dem Großen Russlands einziger Überseehandelshafen. Entwickle diesen Hafen für den unmittelbaren Handel mit Westeuropa."
 mos_white_sea_trade: "Der Handel am Weißen Meer"
 mos_white_sea_trade_desc: "Die englische Muscovy Company (1555) gelangte hier nach Russland – komm ihr zuvor und nimm den Handelsweg am Weißen Meer in Besitz."
 mos_dev_nizhny: "Nischni Nowgorod entwickeln"
 mos_dev_nizhny_desc: "Am Zusammenfluss von Wolga und Oka – entwickle „Unter-Nowgorod“ zum Zentrum des Wolgahandels."
 mos_conquer_pskov: "Die Eroberung Pskows"
 mos_conquer_pskov_desc: "Pskow wurde 1510 von Moskau annektiert. Erobere nach Nowgorod auch Pskow und beherrsche Nordwestrussland vollständig."
 mos_dev_yaroslavl: "Jaroslawl entwickeln"
 mos_dev_yaroslavl_desc: "Jaroslawl am „Goldenen Ring“ – entwickle diese Wolga-Handelsstadt zu einem Umschlagplatz des nördlichen Handels."
 mos_conquer_vologda: "Wologda entwickeln"
 mos_conquer_vologda_desc: "Wologda – nimm diesen Schlüsselknoten der nördlichen Handelswege ein und sichere die Verbindung zum Handel am Weißen Meer."
 mos_amber_road: "Die Bernsteinstraße"
 mos_amber_road_desc: "Baltischer Bernstein – liefere diese Ware über Riga auf die europäischen Märkte und steigere die Handelseinkünfte."
 mos_reform_taxation: "Steuerreform"
 mos_reform_taxation_desc: "Errichte ein einheitliches Steuersystem und stärke die Staatsfinanzen. Zentralisierte Steuereinnahmen tragen das russische Heer."
 mos_dev_kazan_city: "Die Stadt Kasan entwickeln"
 mos_dev_kazan_city_desc: "Entwickle das eroberte Kasan zu einer Vielvölkerstadt, in der Tataren, Russen und Tschuwaschen nebeneinander leben."
 mos_conquer_vilnius: "Die Eroberung Wilnas"
 mos_conquer_vilnius_desc: "Wilna, Hauptstadt des Großfürstentums Litauen – ihre Eroberung beendet die litauische Vorherrschaft und verlagert die osteuropäische Hegemonie nach Moskau."
 mos_develop_moscow_university: "Die Moskauer Universität gründen"
 mos_develop_moscow_university_desc: "Errichte die Hallen der Gelehrsamkeit, ehe die Moskauer Universität (gegründet 1755) entsteht. Lomonossows Traum früh zu verwirklichen, fördert Russlands geistige Entwicklung."
 mos_teutonic_order: "Den Deutschen Orden besiegen"
 mos_teutonic_order_desc: "Der Deutsche Orden, Erbe der Ostseekreuzzüge – seine Gebiete zu unterwerfen, bringt die südliche Ostsee vollständig unter russischen Einfluss."
 mos_estonian_coast: "Die estnische Küste"
 mos_estonian_coast_desc: "Reval (Tallinn) – nimm diesen wichtigen Hansehafen ein und erlange vollen Zugang zum Ostseehandel."
 mos_dev_tobolsk_city: "Die Stadt Tobolsk entwickeln"
 mos_dev_tobolsk_city_desc: "Entwickle Tobolsk ernsthaft zur „Hauptstadt Sibiriens“ – lass es als Verwaltungsmittelpunkt der Eroberung Sibiriens wachsen."
 mos_streltsy_reform: "Heeresreform"
 mos_streltsy_reform_desc: "Modernisiere die Strelizen – übernimm westliche Militärtechnik, um das russische Heer auf europäisches Niveau zu heben."
 mos_siberian_ostrog: "Das sibirische Ostrog-Netz"
 mos_siberian_ostrog_desc: "Baue das Netz der Festungen (Ostrogs) aus, das Tobolsk, Jenisseisk und Irkutsk verbindet und die Eroberung Sibiriens trägt."
 mos_absolute_monarchy: "Die absolute Monarchie errichten"
 mos_absolute_monarchy_desc: "Errichte die absolute Zarenautorität – nimm Bojaren, Kirche und örtlichen Herren die Macht und bündele alle Autorität in den Händen des Kaisers."
 mos_peter_reforms: "Die Peterreformen"
 mos_peter_reforms_desc: "Peter der Große (1672–1725) wandelte Russland durch Verwestlichung in einen modernen Staat. Heeresreform, Flottenaufbau, Akademie der Wissenschaften. Verwirkliche den Geist des „Fensters zum Westen“."
 mos_dev_st_petersburg: "Sankt Petersburg erbauen"
 mos_dev_st_petersburg_desc: "1703 von Peter dem Großen in den Sümpfen der Newa gegründet – errichte Sankt Petersburg als Russlands erste Stadt nach westlichem Muster."
 mos_russian_navy: "Die russische Flotte aufbauen"
 mos_russian_navy_desc: "„Russland braucht eine Flotte“ – schaffe aus der Überzeugung Peters des Großen die Asowsche und die Ostseeflotte."
 mos_dev_suzdal: "Susdal entwickeln"
 mos_dev_suzdal_desc: "Susdal am „Goldenen Ring“ – entwickle diese uralte Stadt mit ihren vielen mittelalterlichen Kirchen zu einem Zentrum von Religion und Kultur."
 mos_dev_vladimir: "Wladimir entwickeln"
 mos_dev_vladimir_desc: "Wladimir, einst Hauptstadt des Großfürstentums – entwickle diese uralte Stadt zu einem Zentrum von Landwirtschaft und Nahrungsversorgung."
 mos_salt_works: "Die Salzindustrie"
 mos_salt_works_desc: "Salz aus Wologda und Solikamsk – begründe die stabile Versorgung mit Salz, das für die russische Nahrungsmittelkonservierung unentbehrlich ist."
 mos_beeswax_trade: "Der Bienenwachshandel"
 mos_beeswax_trade_desc: "Russisches Bienenwachs – eine Schlüsselware, die für orthodoxe Kirchenkerzen und den westeuropäischen Export stark nachgefragt wird."
 mos_iron_works: "Die Eisenindustrie"
 mos_iron_works_desc: "Eisenerz aus der Uralregion – lege das Fundament der Uraler Eisenerzeugung, die sich in der Petrinischen Ära verstärkt."
 mos_dev_astrakhan_city: "Die Stadt Astrachan entwickeln"
 mos_dev_astrakhan_city_desc: "Astrachan, das „südliche Tor“ – entwickle es zum Zentrum des Kaspischen Handels und nimm den Handel mit Persien und Zentralasien in Besitz."
 mos_cossack_cavalry: "Die Kosakenreiterei"
 mos_cossack_cavalry_desc: "Donkosaken und Saporoger Kosaken – gliedere diese besten Steppenreiter in das russische Heer ein."
 mos_book_of_royal_degrees: "Die Stepennaja Kniga"
 mos_book_of_royal_degrees_desc: "Die Stepennaja Kniga (das „Stufenbuch“) verzeichnet die Abstammung der Herrscher der Rus und stärkt Moskaus Legitimität und Verwaltungseffizienz."
 mos_kholmogory: "Cholmogory entwickeln"
 mos_kholmogory_desc: "Cholmogory an der Dwina – entwickle diesen Handelsposten am Weißen Meer."
 mos_protect_south_slavs: "Die Südslawen beschützen"
 mos_protect_south_slavs_desc: "Befreie die orthodoxen Christen des Balkans von osmanischer Herrschaft und errichte ein panslawisches Reich."
 mos_conquer_carpathia: "Die Eroberung der Karpaten"
 mos_conquer_carpathia_desc: "Die Karpaten – die Unterwerfung dieses Tors nach Mitteleuropa erweitert den westlichen Einfluss erheblich."
 mos_great_northern_war: "Der Große Nordische Krieg"
 mos_great_northern_war_desc: "Im Großen Nordischen Krieg (1700–1721) besiegte Peter der Große Schweden und begründete die Vorherrschaft in der Ostsee – verwirkliche diesen Sieg früh."
 mos_dev_perm_city: "Die Stadt Perm entwickeln"
 mos_dev_perm_city_desc: "Entwickle Perm, Drehscheibe des Pelzhandels, zu einer richtigen Stadt – lass es als Zentrum von Handel und Pelzsammlung am oberen Kama wachsen."
 mos_yakutsk_founded: "Jakutsk gründen"
 mos_yakutsk_founded_desc: "Jakutsk, gegründet 1632 – baue es als Zentrum Ostsibiriens auf und öffne den Weg zum Pazifik."
 mos_dev_irkutsk: "Irkutsk entwickeln"
 mos_dev_irkutsk_desc: "Irkutsk am Baikalsee – entwickle diese Stadt, später das „Paris Sibiriens“, zum Verwaltungs- und Handelszentrum Ostsibiriens."
 mos_dev_minsk: "Minsk entwickeln"
 mos_dev_minsk_desc: "Entwickle Minsk, das Zentrum Weißrusslands, als Stützpunkt der westlichen Herrschaft."
 mos_conquer_warsaw: "Die Eroberung Warschaus"
 mos_conquer_warsaw_desc: "Warschau, Hauptstadt Polens – vollende die Teilung Polens und begründe Einfluss über Mitteleuropa."
 mos_iron_ring_defense: "Die Eiserne-Ring-Verteidigung"
 mos_iron_ring_defense_desc: "Ein Festungsnetz gegen Einfälle aus Süden und Westen – ein eisernes Verteidigungssystem aus Bastionsfestungen schützt russisches Gebiet."
 mos_form_russia: "Russland bilden"
 mos_form_russia_desc: "Nachdem das Tatarenjoch gebrochen, Kasan erobert und die Fürstentümer der Rus geeint sind – verkünde förmlich den Staat „Russland“ und herrsche als Zar über alle."
 mos_russian_empire: "Das Russische Reich"
 mos_russian_empire_desc: "Peter der Große erklärte Russland mit dem Frieden von Nystad 1721 zum „Kaiserreich“ – verwirkliche diesen Augenblick früh durch Pelze, Landwirtschaft und Peterreformen."
 mos_autocrat_of_all_russias: "Selbstherrscher aller Reußen"
 mos_autocrat_of_all_russias_desc: "„Von Gottes Gnaden Kaiser und Selbstherrscher aller Reußen“ – von der Ostsee bis Sibirien, vom Kaukasus bis zum Nordpolarmeer liegen alle Lande unter der souveränen Gnade des Zaren."
 mos_events.1.t: "Großfürstentum Moskau – unter dem Tatarenjoch"
 mos_events.1.d: "1337 ist Moskau ein kleines Fürstentum. Doch durch das kluge Geschick Iwans I. Kalita („Geldbeutel“), des Steuereintreibers der Tataren, hat Moskau Kraft gesammelt.\n\nMoskaus Vorteil ist die Geografie – seine Lage inmitten der Wälder im Binnenland erschwert die unmittelbare Kontrolle durch die Tataren.\n\nDie Erinnerung an die Schlacht bei Kulikowo (1380), in der Dmitri Donskoi die Tataren zurückschlug, lebt fort. Brich das Tatarenjoch vollständig und einige die russischen Fürstentümer unter zarischer Herrschaft – das ist Moskaus Bestimmung."
 mos_events.1.a: "Zum Ruhm Moskaus!"
 mos_events.5.t: "Brich das Tatarenjoch!"
 mos_events.5.d: "Endlich hat Moskaus Heer die Tataren in der Schlacht besiegt – der Tribut an die Tataren ist für immer beendet. An diesem historischen Wendepunkt, vergleichbar dem „Stehen an der Ugra (1480)“, wird Moskau zum Bannerträger des freien Russlands. Die russischen Fürstentümer erkennen Moskaus Hegemonie an, und der Weg zu einem geeinten Staat öffnet sich."
 mos_events.5.a: "Russland ist frei! Nun zur Einigung der Rus!"
 mos_events.10.t: "Die Krönung des Zaren"
 mos_events.10.d: "„Zar und Großfürst von ganz Russland“ – mit der Annahme dieses Titels stellt sich Moskau als rechtmäßiger Nachfolger des Byzantinischen Reiches dar. Nimm Iwans IV. historische Krönungszeremonie von 1547 vorweg. Die Höfe Europas beginnen, Moskau als neue Großmacht anzuerkennen."
 mos_events.10.a: "Es lebe der Zar! Es lebe Moskau!"
 mos_events.30.t: "Rückeroberung Konstantinopels – Vollendung des Dritten Roms"
 mos_events.30.d: "Die orthodoxe heilige Stadt Konstantinopel ist in russischer Hand! Die Rückeroberung dieser Stadt, die 1453 an die Osmanen fiel, bedeutet, dass Russland als „Drittes Rom“ zum geistigen Führer der orthodoxen Welt wird. Das christliche Kreuz weht noch einmal über der Hagia Sophia."
 mos_events.30.a: "Es lebe das Dritte Rom! Es lebe die russische Orthodoxie!"
 mos_events.50.t: "Die Peterreformen – Verwestlichung oder Tradition?"
 mos_events.50.d: "Eine Welle der Verwestlichung steht kurz davor, Russland zu überfluten. Soll man westliche Technik, Militärsysteme und Wissenschaft tatkräftig aufnehmen, um Russland zu einer modernen europäischen Macht zu entwickeln – oder die orthodoxe Tradition und den „russischen Weg“ bewahren und ein einzigartiges Reich aufbauen?"
 mos_events.50.a: "Die Verwestlichung fördern – Russland ist Teil Europas"
 mos_events.60.t: "Die Bildung Russlands – Geburt eines neuen Reiches"
 mos_events.60.d: "Ukraine, Weißrussland und Galizien unter einer Flagge – der geeinte ostslawische Staat „Ruthenien“ tritt als neue Großmacht Osteuropas hervor. Alle Völker der Rus versammeln sich unter den goldenen Kuppeln Kiews."
 mos_events.60.a: "Es lebe Russland! Es lebe der Zar aller Reußen!"
 mos_events.99.t: "Selbstherrscher aller Reußen – Vollendung des Reiches"
 mos_events.99.d: "„Von Gottes Gnaden Kaiser und Selbstherrscher aller Reußen“ – von der Ostsee bis Sibirien, vom Kaukasus bis zum Nordpolarmeer weht die russische Flagge über dem größten Reich der Welt. Vom kleinen Fürstentum Moskau des Jahres 1337 bis zum größten Reich der Welt – diese historische Leistung wird in Ewigkeit erzählt werden."
 mos_events.99.a: "Es lebe der Selbstherrscher aller Reußen! Es lebe das Russische Reich!"
 mos_events.50.b: "Die Tradition bewahren"
 STATIC_MODIFIER_NAME_mos_moscow_dev_mod: "Die Festigung Russlands"
 STATIC_MODIFIER_DESC_mos_moscow_dev_mod: "Russland ist gefestigt – Moskau erhebt sich als unbestrittene Hauptstadt der Lande der Rus."
 STATIC_MODIFIER_NAME_mos_kremlin_mod: "Der Moskauer Kreml"
 STATIC_MODIFIER_DESC_mos_kremlin_mod: "Der Moskauer Kreml ist erbaut – der ewige Sitz russischer Macht und russischen Ansehens."
 STATIC_MODIFIER_NAME_mos_kazan_mod: "Die Eroberung Kasans"
 STATIC_MODIFIER_DESC_mos_kazan_mod: "Kasan ist erobert – das tatarische Khanat fällt, und die Wolga öffnet sich der russischen Ausdehnung."
 STATIC_MODIFIER_NAME_mos_volga_mod: "Die mittlere Wolga"
 STATIC_MODIFIER_DESC_mos_volga_mod: "Die mittlere Wolga ist gesichert – Russlands großer Strom wird zur kaiserlichen Straße."
 STATIC_MODIFIER_NAME_mos_astrakhan_mod: "Die Eroberung Astrachans"
 STATIC_MODIFIER_DESC_mos_astrakhan_mod: "Das Banner Moskaus weht von den Mauern Astrachans, und der Lauf der Wolga reicht bis zu den kaspischen Gestaden im Namen des Großfürsten."
 STATIC_MODIFIER_NAME_mos_steppes_mod: "Die Niederlage der Tataren"
 STATIC_MODIFIER_DESC_mos_steppes_mod: "Die Tataren sind besiegt – die pontische Steppe öffnet sich der russischen Besiedlung."
 STATIC_MODIFIER_NAME_mos_pontic_mod: "Herrschaft über die pontische Steppe"
 STATIC_MODIFIER_DESC_mos_pontic_mod: "Herrschaft über die pontische Steppe – Russland beherrscht die Lande nördlich des Schwarzen Meeres."
 STATIC_MODIFIER_NAME_mos_azov_mod: "Vorstoß zum Asowschen Meer"
 STATIC_MODIFIER_DESC_mos_azov_mod: "Jenseits des Schwarzen Meeres, vom Hafen Asows aus gesehen, erstrecken sich Seewege weiter zum Mittelmeer."
 STATIC_MODIFIER_NAME_mos_crimea_mod: "Die Eroberung der Krim"
 STATIC_MODIFIER_DESC_mos_crimea_mod: "Die Krim ist erobert – Russland gewinnt den eisfreien Hafen, den es lange suchte."
 STATIC_MODIFIER_NAME_mos_novgorod_mod: "Die Eroberung Nowgorods"
 STATIC_MODIFIER_DESC_mos_novgorod_mod: "Nowgorod ist erobert – die große Handelsrepublik ist in den russischen Staat aufgenommen."
 STATIC_MODIFIER_NAME_mos_tver_mod: "Twer – Handelsstadt an der Wolga"
 STATIC_MODIFIER_DESC_mos_tver_mod: "Twer – die Wolga-Handelsstadt – ist unterworfen und in Moskau eingegliedert."
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "Die Unterwerfung Rjasans"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "Rjasan ist unterworfen – das letzte unabhängige Fürstentum ist in Russland aufgenommen."
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "Smolensk – Schlüssel Russlands"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "Smolensk – der Schlüssel Russlands – ist zurückgewonnen und sichert die westliche Grenze."
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "Die Eroberung Rutheniens"
 STATIC_MODIFIER_DESC_mos_ruthenia_mod: "Ruthenien ist erobert – die orthodoxen Slawen des Westens kommen unter Moskaus Schutz."
 STATIC_MODIFIER_NAME_mos_vyborg_mod: "Wyborg – Tor zum Westen"
 STATIC_MODIFIER_DESC_mos_vyborg_mod: "Wyborg – das Tor zum Westen – ist eingenommen und verschafft Zugang zur Ostsee."
 STATIC_MODIFIER_NAME_mos_baltic_mod: "Ostseeambitionen"
 STATIC_MODIFIER_DESC_mos_baltic_mod: "Die Ostseeambitionen sind verwirklicht – Russland erhebt seinen Anspruch auf das nördliche Meer."
 STATIC_MODIFIER_NAME_mos_riga_mod: "Riga – Handelsdrehscheibe der Ostsee"
 STATIC_MODIFIER_DESC_mos_riga_mod: "Riga – die baltische Handelsdrehscheibe – fällt unter russische Kontrolle."
 STATIC_MODIFIER_NAME_mos_poland_mod: "Die Teilung Polens"
 STATIC_MODIFIER_DESC_mos_poland_mod: "Polen ist geteilt – sein Gebiet ist in das Russische Reich aufgenommen."
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "Der Moskauer Metropolitansitz"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "Moskaus Metropolitansitz ist erhöht – die Kirche verankert die russische Staatsmacht."
 STATIC_MODIFIER_NAME_mos_churches_mod: "Das Land der Kirchen"
 STATIC_MODIFIER_DESC_mos_churches_mod: "Ein Land der Kirchen – die Orthodoxie durchdringt jede Stadt, jeden Markt und jedes Dorf Russlands."
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "Das russische Patriarchat"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "Das russische Patriarchat ist begründet – Moskaus Kirche steht unabhängig von Konstantinopel da."
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "Hüter der Orthodoxie"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "Russland wird als Hüter der Orthodoxie anerkannt – der Verteidiger des Glaubens."
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "Das Dritte Rom"
 STATIC_MODIFIER_DESC_mos_third_rome_mod: "Moskau erklärt sich zum Dritten Rom – dem ewigen Sitz der orthodoxen Zivilisation."
 STATIC_MODIFIER_NAME_mos_caucasus_mod: "Marsch in den Kaukasus"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "Wachfeuer russischer Vorposten brennen in den Pässen des Kaukasus, und selbst die Bergkönigreiche haben den Namen des Kaisers des Nordens gehört."
 STATIC_MODIFIER_NAME_mos_caspian_mod: "Herrschaft über das Kaspische Meer"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "Die Herrschaft über das Kaspische Meer öffnet die Handelswege nach Persien und Zentralasien."
 STATIC_MODIFIER_NAME_mos_urals_mod: "Die Überschreitung des Urals"
 STATIC_MODIFIER_DESC_mos_urals_mod: "Der Ural ist überschritten – die Tür nach Sibirien schwingt auf."
 STATIC_MODIFIER_NAME_mos_perm_mod: "Die Eroberung Perms"
 STATIC_MODIFIER_DESC_mos_perm_mod: "Perm ist erobert – das Tor zum Ural und zur sibirischen Grenze ist gesichert."
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "Begründung des sibirischen Handels"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "Der sibirische Handel ist über Tobolsk begründet – Pelze und Rohstoffe fließen nach Westen."
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "Die Eroberung Ostsibiriens"
 STATIC_MODIFIER_DESC_mos_east_siberia_mod: "Ostsibirien ist erobert – Russlands Herrschaft reicht bis zum Horizont des Pazifiks."
 STATIC_MODIFIER_NAME_mos_pacific_mod: "Das Erreichen des Pazifiks"
 STATIC_MODIFIER_DESC_mos_pacific_mod: "Der Pazifik ist erreicht – Russland umspannt die gesamte Breite des eurasischen Kontinents."
 STATIC_MODIFIER_NAME_mos_fur_monopoly_mod: "Das Pelzmonopol"
 STATIC_MODIFIER_DESC_mos_fur_monopoly_mod: "Das sibirische Pelzmonopol bereichert Russland – das Zobelfell ist sein Gewicht in Silber wert."
 STATIC_MODIFIER_NAME_mos_sudebnik_mod: "Der Sudebnik"
 STATIC_MODIFIER_DESC_mos_sudebnik_mod: "Das Gesetzbuch des Sudebnik ist erlassen – Russlands Rechtswesen ist vereinheitlicht und modernisiert."
 STATIC_MODIFIER_NAME_mos_boyar_mod: "Die Bojaren im Zaum"
 STATIC_MODIFIER_DESC_mos_boyar_mod: "Die Bojaren können dem Zaren im Ratssaal nicht mehr trotzen und beugen ihr Haupt."
 STATIC_MODIFIER_NAME_mos_oprichnina_mod: "Die Opritschnina"
 STATIC_MODIFIER_DESC_mos_oprichnina_mod: "Die Opritschnina ist errichtet – Iwans Geheimpolizei erzwingt unbedingte Treue."
 STATIC_MODIFIER_NAME_mos_agriculture_mod: "Landwirtschaftliche Entwicklung"
 STATIC_MODIFIER_DESC_mos_agriculture_mod: "Über die weiten Ebenen der Schwarzerde wogen goldene Weizenähren bis zum Horizont."
 STATIC_MODIFIER_NAME_mos_black_earth_mod: "Die Ernten der Schwarzerde"
 STATIC_MODIFIER_DESC_mos_black_earth_mod: "Neue Dörfer und Mühlen säumen die Steppengrenze, und kornbeladene Karren rollen auf neuen Wegen nach Norden. Die Schwarzerde ernährt das Reich wie nie zuvor."
 STATIC_MODIFIER_NAME_mos_pomestye_mod: "Das Pomestje-System"
 STATIC_MODIFIER_DESC_mos_pomestye_mod: "Das Pomestje-System vergibt Land für Kriegsdienst – das Heer des Dienstadels ist geboren."
 STATIC_MODIFIER_NAME_mos_streltsy_mod: "Die Strelizen"
 STATIC_MODIFIER_DESC_mos_streltsy_mod: "Die Strelizen-Musketiere sind aufgestellt – Russlands erstes stehendes Berufsfußvolk."
 STATIC_MODIFIER_NAME_mos_zaseka_mod: "Die Sassetschnaja Tscherta"
 STATIC_MODIFIER_DESC_mos_zaseka_mod: "Die Sassetschnaja Tscherta – die große Waldverteidigungslinie – schützt Russland vor den Steppenräubern."
 STATIC_MODIFIER_NAME_mos_arkhangelsk_mod: "Archangelsk – Tor zum Weißen Meer"
 STATIC_MODIFIER_DESC_mos_arkhangelsk_mod: "Archangelsk öffnet Russlands Fenster zum Weißen Meer und zum nordeuropäischen Handel."
 STATIC_MODIFIER_NAME_mos_white_sea_mod: "Der Handel am Weißen Meer"
 STATIC_MODIFIER_DESC_mos_white_sea_mod: "Die Handelswege am Weißen Meer verbinden Russland mit englischen und niederländischen Kaufleuten."
 STATIC_MODIFIER_NAME_mos_nizhny_mod: "Nischni Nowgorod – Zusammenfluss von Wolga und Oka"
 STATIC_MODIFIER_DESC_mos_nizhny_mod: "Nischni Nowgorod – am Zusammenfluss von Wolga und Oka – wird zu einer großen Handelsmesse."
 STATIC_MODIFIER_NAME_mos_pskov_mod: "Pskow – Handelsstadt im Nordwesten"
 STATIC_MODIFIER_DESC_mos_pskov_mod: "Pskow – die Handelsstadt im Nordwesten – ist in den russischen Staat eingegliedert."
 STATIC_MODIFIER_NAME_mos_yaroslavl_mod: "Goldene Stadt der Wolga – Handelszentrum für Seide und Leinen"
 STATIC_MODIFIER_DESC_mos_yaroslavl_mod: "Jaroslawl – die goldene Stadt der Wolga – handelt mit Seide und Leinen von Ost nach West."
 STATIC_MODIFIER_NAME_mos_vologda_mod: "Wologda – nördlicher Handelsknoten"
 STATIC_MODIFIER_DESC_mos_vologda_mod: "Wologda – der nördliche Handelsknoten – verbindet das Weiße Meer mit dem Wolgabecken."
 STATIC_MODIFIER_NAME_mos_amber_mod: "Die Bernsteinstraße"
 STATIC_MODIFIER_DESC_mos_amber_mod: "Die Bernsteinstraße von der Ostsee führt durch russisch kontrolliertes Gebiet."
 STATIC_MODIFIER_NAME_mos_taxation_mod: "Steuerreform"
 STATIC_MODIFIER_DESC_mos_taxation_mod: "Steuereintreiber im ganzen Land verzeichnen ihre Einnahmen im selben Buchformat, und alles Silber fließt in die Schatzkammer des Zaren."
 STATIC_MODIFIER_NAME_mos_kazan_city_mod: "Bau einer Vielvölkerstadt"
 STATIC_MODIFIER_DESC_mos_kazan_city_mod: "Kasan wird als Vielvölkerstadt wieder aufgebaut – tatarische und russische Kultur bestehen unter Moskau nebeneinander."
 STATIC_MODIFIER_NAME_mos_vilnius_mod: "Wilna – Hauptstadt Litauens"
 STATIC_MODIFIER_DESC_mos_vilnius_mod: "Wilna – die Hauptstadt Litauens – fällt unter russische Herrschaft."
 STATIC_MODIFIER_NAME_mos_university_mod: "Die Moskauer Universität"
 STATIC_MODIFIER_DESC_mos_university_mod: "In den Hörsälen der Moskauer Universität erklingen die Stimmen von Studenten aus ganz Russland, und das Licht der Aufklärung hat auch dieses Land erreicht."
 STATIC_MODIFIER_NAME_mos_teutonic_mod: "Die Niederlage des Deutschen Ordens"
 STATIC_MODIFIER_DESC_mos_teutonic_mod: "Der Deutsche Orden ist besiegt – die baltische Grenze ist für Russland gesichert."
 STATIC_MODIFIER_NAME_mos_tallinn_mod: "Reval – nördlicher Hanseposten"
 STATIC_MODIFIER_DESC_mos_tallinn_mod: "Reval (Tallinn) – der nördliche Hanseposten – ist eingenommen und verschafft Zugang zum Ostseehandel."
 STATIC_MODIFIER_NAME_mos_tobolsk_city_mod: "Handelshauptstadt Sibiriens"
 STATIC_MODIFIER_DESC_mos_tobolsk_city_mod: "Sibirische Pelze und die Gaben der Wälder türmen sich auf den Märkten von Tobolsk, und die Stimmen der Kaufleute verstummen nie."
 STATIC_MODIFIER_NAME_mos_military_reform_mod: "Heeresreform"
 STATIC_MODIFIER_DESC_mos_military_reform_mod: "Soldaten in Uniformen nach westlichem Vorbild marschieren mit den neuen Musketen auf den Schultern über den Exerzierplatz."
 STATIC_MODIFIER_NAME_mos_ostrog_mod: "Das sibirische Ostrog-Netz"
 STATIC_MODIFIER_DESC_mos_ostrog_mod: "Aus den Holzforts tief in der sibirischen Taiga verkünden Beamte, die die Pelzsteuer einziehen, den Namen des Reiches den Menschen."
 STATIC_MODIFIER_NAME_mos_absolutism_mod: "Absolute Monarchie"
 STATIC_MODIFIER_DESC_mos_absolutism_mod: "Die absolute Monarchie ist gefestigt – das Wort des Zaren ist Gesetz von der Ostsee bis zum Pazifik."
 STATIC_MODIFIER_NAME_mos_st_petersburg_mod: "Sankt Petersburg – Fenster nach Europa"
 STATIC_MODIFIER_DESC_mos_st_petersburg_mod: "Sankt Petersburg – Russlands Fenster nach Europa – wird in den Sümpfen der Newa erbaut."
 STATIC_MODIFIER_NAME_mos_navy_mod: "Die russische Flotte"
 STATIC_MODIFIER_DESC_mos_navy_mod: "Die russische Flotte ist gegründet – eine mächtige Flotte befährt Ostsee und Schwarzes Meer."
 STATIC_MODIFIER_NAME_mos_suzdal_mod: "Susdal – Herz des Goldenen Rings"
 STATIC_MODIFIER_DESC_mos_suzdal_mod: "Susdal – Herz des Goldenen Rings – erstrahlt als Juwel altrussischer Kultur."
 STATIC_MODIFIER_NAME_mos_vladimir_mod: "Wladimir – alte Hauptstadt der Rus"
 STATIC_MODIFIER_DESC_mos_vladimir_mod: "Wladimir – alte Hauptstadt der Rus – ist als Mittelpunkt des russischen Reiches wiederbelebt."
 STATIC_MODIFIER_NAME_mos_salt_mod: "Die Salzindustrie"
 STATIC_MODIFIER_DESC_mos_salt_mod: "Salz aus den Salinen von Wologda wird in die Dörfer Russlands getragen, um die Wintervorräte zu konservieren."
 STATIC_MODIFIER_NAME_mos_beeswax_mod: "Der Bienenwachshandel"
 STATIC_MODIFIER_DESC_mos_beeswax_mod: "Der Bienenwachshandel bereichert Russland – Kerzen und Wachs besiegeln den Handel des Reiches."
 STATIC_MODIFIER_NAME_mos_iron_mod: "Die Eisenindustrie"
 STATIC_MODIFIER_DESC_mos_iron_mod: "Die Hochöfen des Urals glühen rot, und aus ihrem Eisen geschmiedete Schwerter und Pflugscharen werden über das Land getragen."
 STATIC_MODIFIER_NAME_mos_astrakhan_city_mod: "Astrachan – Tor zum Kaspischen Meer"
 STATIC_MODIFIER_DESC_mos_astrakhan_city_mod: "An den Kais Astrachans warten Schiffe, beladen mit persischen Teppichen und zentralasiatischen Gewürzen, auf den Tag, an dem sie die Wolga hinauffahren."
 STATIC_MODIFIER_NAME_mos_cossack_mod: "Die Kosakenreiterei"
 STATIC_MODIFIER_DESC_mos_cossack_mod: "Kosakenreiter dienen dem Zaren – die freien Reiter der Steppe kämpfen nun für Moskau."
 STATIC_MODIFIER_NAME_mos_royal_degrees_mod: "Die Stepennaja Kniga"
 STATIC_MODIFIER_DESC_mos_royal_degrees_mod: "Die in der Stepennaja Kniga niedergelegte Genealogie zeigt das Haus des Zaren als rechtmäßige, von Gott erwählte Linie."
 STATIC_MODIFIER_NAME_mos_kholmogory_mod: "Handelsposten am Weißen Meer"
 STATIC_MODIFIER_DESC_mos_kholmogory_mod: "Cholmogory dient als Handelsposten am Weißen Meer, der Russland mit dem Norden verbindet."
 STATIC_MODIFIER_NAME_mos_grand_duchy_mod: "Das Großfürstentum"
 STATIC_MODIFIER_DESC_mos_grand_duchy_mod: "Das Großfürstentum Moskau ist ausgerufen – das Fundament des russischen Staates."
 STATIC_MODIFIER_NAME_mos_balkans_mod: "Schutz der Südslawen"
 STATIC_MODIFIER_DESC_mos_balkans_mod: "Russland erklärt sich zum Beschützer der Südslawen gegen osmanische Unterdrückung."
 STATIC_MODIFIER_NAME_mos_carpathia_mod: "Die Eroberung der Karpaten"
 STATIC_MODIFIER_DESC_mos_carpathia_mod: "Russische Soldaten in den Karpatenpässen sehen den Schatten des Reiches über die Ebenen Mitteleuropas jenseits der Berge länger werden."
 STATIC_MODIFIER_NAME_mos_western_mod: "Verwestlichung"
 STATIC_MODIFIER_DESC_mos_western_mod: "Die Verwestlichungsreformen wandeln Russland – europäische Technik und Kultur werden übernommen."
 STATIC_MODIFIER_NAME_mos_northern_war_mod: "Der Große Nordische Krieg"
 STATIC_MODIFIER_DESC_mos_northern_war_mod: "Der Große Nordische Krieg ist gewonnen – Russland geht als beherrschende Ostseemacht hervor."
 STATIC_MODIFIER_NAME_mos_perm_city_mod: "Uraler Pelzhandelsposten"
 STATIC_MODIFIER_DESC_mos_perm_city_mod: "Perm wächst als Uraler Pelzhandelsposten – das Tor zwischen Europa und Sibirien."
 STATIC_MODIFIER_NAME_mos_yakutsk_mod: "Vorgeschobene Basis im Fernen Osten"
 STATIC_MODIFIER_DESC_mos_yakutsk_mod: "Jakutsk dient als vorgeschobene Basis im Fernen Osten – Russlands Präsenz an der Pazifikküste."
 STATIC_MODIFIER_NAME_mos_irkutsk_mod: "Stadt des Baikal"
 STATIC_MODIFIER_DESC_mos_irkutsk_mod: "Irkutsk – die Stadt des Baikal – wird zum Verwaltungsmittelpunkt Ostsibiriens."
 STATIC_MODIFIER_NAME_mos_minsk_mod: "Minsk – Zentrum Weißrutheniens"
 STATIC_MODIFIER_DESC_mos_minsk_mod: "Minsk – Zentrum Weißrutheniens – ist in das Russische Reich aufgenommen."
 STATIC_MODIFIER_NAME_mos_warsaw_mod: "Befriedung Polens"
 STATIC_MODIFIER_DESC_mos_warsaw_mod: "Warschau ist befriedet – Polens Hauptstadt erkennt die russische Oberhoheit an."
 STATIC_MODIFIER_NAME_mos_iron_ring_mod: "Die Eiserne-Ring-Verteidigung"
 STATIC_MODIFIER_DESC_mos_iron_ring_mod: "Das Verteidigungssystem des Eisernen Rings schützt Russlands Kernland vor Einfall."
 STATIC_MODIFIER_NAME_mos_great_mod: "Das Russische Reich"
 STATIC_MODIFIER_DESC_mos_great_mod: "Das Russische Reich ist ausgerufen – eine der größten Kontinentalmächte der Geschichte."
 STATIC_MODIFIER_NAME_mos_autocrat_final_mod: "Selbstherrscher aller Reußen"
 STATIC_MODIFIER_DESC_mos_autocrat_final_mod: "Selbstherrscher aller Reußen – der Zar herrscht unumschränkt von der Ostsee bis zum Pazifik."
 mos_great_moscow: "Grundlegung des Dritten Roms: Der große Ausbau Moskaus"
 mos_great_moscow_desc: "Baue Moskau zu einer großen Stadt aus, die des Dritten Roms würdig ist. Kathedralen, Paläste, Märkte und Festungen werden diese prachtvolle Stadt säumen und sie zum Herzen des Russischen Reiches machen. Erfülle alle drei Bedingungen – Entwicklung, Gebäude und Bevölkerung –, um Moskau den Titel der Ewigen Stadt zu verleihen."
 STATIC_MODIFIER_NAME_mos_great_moscow_mod: "Stadt des Dritten Roms"
 STATIC_MODIFIER_DESC_mos_great_moscow_mod: "Groß-Moskau, dessen goldene Kremltürme glänzen, ist zu einer Metropole geworden, die des Namens „Drittes Rom“ würdig ist."
