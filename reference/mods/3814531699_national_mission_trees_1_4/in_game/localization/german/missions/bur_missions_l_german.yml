l_german:
 bur_crown_of_lothair_mission_pack: "Die Krone Lothars"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337: Der Hundertjährige Krieg beginnt. Das Herzogtum Burgund, eingekeilt zwischen Frankreich und England, besitzt die List und die Mittel, beide Seiten gegeneinander auszuspielen – und schließlich Lotharingien wiederzuerwecken, das alte Zwischenreich der Erben Karls des Großen. Sichere den Hof zu Dijon, errichte den Orden vom Goldenen Vlies und beherrsche den flämischen Tuchhandel; navigiere dann durch den Krieg zwischen England und Frankreich, um höchste Zugeständnisse zu erlangen, ehe du Flandern, die Franche-Comté und Lothringen zu einem neuen „Königreich Lotharingien“ vereinst."
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "Navigiere als Burgund durch den Hundertjährigen Krieg, festige das Innere und stelle Lotharingien wieder her."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um die Krone Lothars zu beanspruchen."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "Überlebe zwischen England und Frankreich – und übertriff sie dann beide!"
 bur_duchy_of_burgundy: "Ambitionen des Herzogtums"
 bur_duchy_of_burgundy_desc: "1337: Das Haus Valois-Burgund steigt als Nebenlinie des französischen Königshauses auf. Indem es England und Frankreich gegeneinander ausspielt, strebt das Herzogtum die Ausdehnung nach Flandern, in die Franche-Comté und nach Lothringen an. Der Hundertjährige Krieg ist eine einmalige Gelegenheit für dieses kleine Herzogtum, zur Großmacht zu werden."
 bur_court_of_dijon: "Der Hof zu Dijon"
 bur_court_of_dijon_desc: "Der burgundische Hof zu Dijon war einer der prächtigsten Europas im 15. Jahrhundert. Jan van Eyck und Rogier van der Weyden wirkten unter burgundischer Förderung, und die herzogliche Bibliothek wetteiferte mit jeder in Frankreich. Diese „Nordische Renaissance“ avant la lettre wurde auf flämischen Tucheinnahmen und dem verschwenderischen Ehrgeiz des Herzogs erbaut."
 bur_flemish_cloth: "Die flämische Tuchindustrie"
 bur_flemish_cloth_desc: "Das Dreieck aus Brügge, Gent und Ypern war die größte Industrieregion des mittelalterlichen Europas. Englische Wolle wurde nach Flandern verschifft, von geschickten Handwerkern zu feinen Tuchen verarbeitet und auf den Champagne-Messen in ganz Europa verkauft. Diese Lieferkette war Burgunds wirtschaftliches Rückgrat."
 bur_golden_fleece: "Der Orden vom Goldenen Vlies"
 bur_golden_fleece_desc: "1430 in Brügge von Philipp dem Guten gegründet, war der Orden vom Goldenen Vlies der angesehenste Ritterorden der katholischen Christenheit – die Mitgliedschaft war Monarchen und großen Fürsten vorbehalten. Auf der Legende von Jason und den Argonauten gegründet, blieb das Abzeichen des Ordens (ein goldenes Vlies-Anhänger) bis ins 19. Jahrhundert die höchste Ehre."
 bur_estates_general: "Die Generalstände"
 bur_estates_general_desc: "Als Verbundstaat, der über Flandern, Brabant und die Franche-Comté herrschte – jede mit eigenen Rechtstraditionen – brauchte Burgund Vertretungseinrichtungen, um wirksam zu regieren. Die Generalstände vereinten die drei Stände über verschiedene Regionen hinweg in einem einzigen beratenden Rahmen."
 bur_feast_of_pheasants: "Das Fasanenfest"
 bur_feast_of_pheasants_desc: "1454, erschüttert vom Fall Konstantinopels, veranstaltete Philipp der Gute in Lille das „Fasanenfest“ – das prunkvollste Bankett des Mittelalters. Ritter schworen Kreuzzugsgelübde über einem lebenden Fasan; Philipp selbst gelobte, seinem König ins Heilige Land zu folgen. Der Kreuzzug fand nie statt, doch das Fest festigte Burgunds Ruf als Hüter christlicher Ritterlichkeit."
 bur_balance_of_power: "Zwischen zwei Reichen"
 bur_balance_of_power_desc: "Burgunds diplomatisches Genie lag in seiner Stellung als Ausgleicher. Ein französischer Vasall nach Lehnsrecht, durch seine östlichen Gebiete mit dem Reich verbunden, und ein möglicher englischer Verbündeter – Burgund konnte die Waage des Hundertjährigen Krieges in beide Richtungen kippen. Dieser Hebel war das Fundament burgundischer Macht."
 bur_ally_england: "Bündnis mit England"
 bur_ally_england_desc: "Nach dem Mord an Johann Ohnefurcht auf der Brücke von Montereau 1419 warf Burgund sein Gewicht hinter England. Der daraus resultierende Vertrag von Troyes (1420) erklärte Heinrich V. zum Erben der französischen Krone – ein Ausgang, undenkbar ohne burgundische Unterstützung. Das burgundisch-englische Bündnis war eine der entscheidenden militärischen Partnerschaften des Hundertjährigen Krieges."
 bur_treaty_of_troyes: "Der Vertrag von Troyes"
 bur_treaty_of_troyes_desc: "Der von Burgund gestützte Vertrag von Troyes machte Heinrich V. zum Erben Frankreichs – der Höhepunkt anglo-burgundischer Macht. Auf diesem Triumph aufbauend, positioniert sich Burgund als der wahre Herrscher des französischen Reiches."
 bur_ally_france: "Aussöhnung mit Frankreich"
 bur_ally_france_desc: "Auf dem Kongress von Arras 1435 wechselte Philipp der Gute die Seiten – er verließ England und versöhnte sich mit Karl VII. Im Gegenzug erhielt Burgund förmliche Befreiung von der Huldigung und die Abtretung strategischer Städte. Diese diplomatische Wende machte Burgund zum letztendlichen Gewinner des Hundertjährigen Krieges."
 bur_treaty_of_arras: "Der Geist von Arras"
 bur_treaty_of_arras_desc: "Der Vertrag von Arras (1435) war Burgunds größter diplomatischer Triumph – Karl VII. wurde zu einer öffentlichen Entschuldigung gedemütigt, während Philipp mit Gebietsgewinnen und erlassener Huldigung davonging. Diese Atempause nutzend, konnte Burgund sich darauf konzentrieren, Lothringen zu festigen und das Zwischenreich zu vollenden."
 bur_flanders_in_the_war: "Flandern im Hundertjährigen Krieg"
 bur_flanders_in_the_war_desc: "Die Grafschaft Flandern war eines der am heftigsten umkämpften Gebiete des Hundertjährigen Krieges. England lieferte Wolle an flämische Tuchstädte und hielt dort starken wirtschaftlichen Einfluss; flämische Städte standen oft auf Englands Seite gegen Frankreich. Doch Frankreich beanspruchte den Grafen von Flandern als Vasall. Burgund, abhängig von flämischen Tucheinnahmen, musste diese Schlüsselregion in seine Umlaufbahn ziehen."
 bur_integrate_brabant: "Der Weg nach Brüssel"
 bur_integrate_brabant_desc: "Antwerpen, Brabants Handelshauptstadt, sollte bis zum Ende des 15. Jahrhunderts zur größten Handelsstadt Nordeuropas werden. Das Plantin-Druckhaus, der Diamantenhandel, spanische Silberwechsel – alles hier zentriert. Die Sicherung Brabants vollendet burgundische Beherrschung der Niederlande."
 bur_integrate_franche_comte: "Dole einnehmen"
 bur_integrate_franche_comte_desc: "Dole, die Hauptstadt der Franche-Comté, war Heimat der Universität Dole (gegründet 1422) – vom burgundischen Herzogshaus gefördert. Die Sicherung dieser Stadt bedeutet wirksame Kontrolle über die gesamte Franche-Comté und öffnet den Weg nach Lothringen."
 bur_expand_into_lorraine: "Nach Lothringen ausdehnen"
 bur_expand_into_lorraine_desc: "Nancy war die Hauptstadt des Herzogtums Lothringen. Karl der Kühne starb in der Schlacht bei Nancy 1477, besessen von dieser Stadt – hier schreibt der Spieler ein anderes Ende. Die Einnahme Nancys öffnet den Weg nach Luxemburg und sichert den burgundischen Korridor zwischen den Niederlanden und dem Kernland."
 bur_crown_of_lothair: "Die Krone Lothars"
 bur_crown_of_lothair_desc: "843 schuf der Vertrag von Verdun Lotharingien – das Zwischenreich, das sich von Flandern bis Italien entlang des Rheins erstreckte. Vom Vertrag von Meerssen 870 verschluckt, zwischen Frankreich und Deutschland geteilt, verschwand dieses Königreich für tausend Jahre aus der Geschichte. Nun stellt das Haus Burgund durch List und Waffen wieder her, was die Karolinger nicht halten konnten: nicht Frankreich, nicht Deutschland, sondern etwas Neues – die Wiederauferstehung des karolingischen Zentrums."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "Der Hof zu Dijon"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "Der burgundische Hof zu Dijon zog Jan van Eyck, Rogier van der Weyden und die feinsten Musiker und Dichter des Zeitalters an – er machte ihn zur kulturellen Hauptstadt Nordeuropas und zum Vorreiter der flämischen Maltradition, die die westliche Kunst umgestalten sollte."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "Die flämische Tuchindustrie"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "Das Tuchdreieck aus Brügge, Gent und Ypern war der Motor der größten Industriewirtschaft des mittelalterlichen Europas. Flämische Tuche waren der Qualitätsmaßstab in ganz Europa, und die Beherrschung dieser Industrie gab Burgund finanzielle Mittel, die es mit jedem Königreich aufnehmen ließen."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Orden vom Goldenen Vlies"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "1430 gegründet, war der Orden vom Goldenen Vlies die exklusivste Ehre der Christenheit – seine Mitgliederliste las sich wie eine Aufzählung des europäischen Königtums. Die Verleihung des Vlieses gab Burgund diplomatischen Hebel über Könige wie Kaiser gleichermaßen."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "Die Generalstände"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Burgunds Generalstände einten die drei Stände über Flandern, Brabant und das eigentliche Burgund hinweg in einer einzigen beratenden Versammlung – ein frühes Modell repräsentativer Regierung, das die spätere Niederländische Republik und die französischen Revolutionsgremien beeinflusste."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "Das Fasanengelübde"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "Beim größten Bankett des Mittelalters schwor Philipp der Gute über einem lebenden Fasan, einen Kreuzzug gegen die Osmanen zu führen. Das Gelübde wurde nie erfüllt, doch das Spektakel verkündete Burgund als führende ritterliche Macht der Christenheit und vertiefte seine Bande zum Papsttum."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Zwischen zwei Reichen"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Als Ausgleicher zwischen England und Frankreich spielend, verweigert Burgund vollständige Unterwerfung unter beide Lehnsherren und nutzt die Zweideutigkeit seiner lehnsrechtlichen Verpflichtungen. Das Chaos des Hundertjährigen Krieges schafft die perfekte Gelegenheit, unabhängige Militärmacht aufzubauen, während man beide Seiten auf Distanz hält."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "Das englische Bündnis"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "Nach Montereau bildeten Burgund und England das folgenreichste militärische Bündnis des Hundertjährigen Krieges. Gemeinsam besetzten sie Paris und löschten fast die Valois-Linie aus – nur Jeanne d’Arcs Eingreifen wendete das Blatt."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Vertrag von Troyes"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "Der von Burgund gestützte Vertrag von Troyes machte Heinrich V. zum Erben Frankreichs – der Höhepunkt anglo-burgundischer Macht. Auf diesem Triumph aufbauend, positioniert sich Burgund als der wahre Herrscher des französischen Reiches."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "Das französische Bündnis"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "Der Kongress von Arras (1435) war Burgunds diplomatisches Meisterstück – England im Augenblick höchster Hebelwirkung verlassend und einem verzweifelten Karl VII. demütigende Zugeständnisse abringend. Burgund ging als der unentbehrliche Partner des schließlichen französischen Siegers hervor."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Vertrag von Arras"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "In Arras entlockte Philipp der Gute Karl VII. eine förmliche Entschuldigung und gewann Gebiet, während er die Pflicht persönlicher Huldigung erließ. Dies machte Burgund faktisch unabhängig, während es nominell im französischen Lehnssystem blieb – das perfekte diplomatische Ergebnis."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "Die Krone Lothars"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "870 verloren, ist das Königreich Lotharingien nach tausend Jahren wiedergeboren. Von Flandern bis zur Franche-Comté, von Lothringen bis zum eigentlichen Burgund, hat das Haus Burgund das Zwischenreich zusammengefügt, das Karls des Großen Enkel nicht halten konnten. Europa hat einen neuen Schwerpunkt."
 bur_events.1.t: "Ambitionen des Herzogtums Burgund"
 bur_events.1.d: "1337: Die ersten Schüsse des Hundertjährigen Krieges stehen kurz davor zu fallen. Eduard III. von England erhebt seinen Anspruch auf den französischen Thron – doch Burgund beobachtet von seiner einzigartigen Warte zwischen den beiden Giganten aus. Eine Nebenlinie des französischen Hauses Valois, doch im Besitz des mächtigen Flandern, einer elitären Ritterschaftstradition und Einnahmen, die es mit jedem Königreich aufnehmen – Burgund ist der Angelpunkt, um den sich dieser Krieg drehen wird. Vom prächtigen Hof zu Dijon bis zu den geschäftigen Tuchhallen von Brügge und Gent hegt das Herzogtum die größten Ambitionen jeder Macht Europas. Die Frage ist, welche Seite man unterstützt – oder ob man überhaupt eine Seite unterstützt."
 bur_events.1.a: "Burgund wird seinen eigenen Weg zwischen England und Frankreich wählen!"
 bur_events.2.t: "Das Fasanenfest"
 bur_events.2.d: "1454 veranstaltete Herzog Philipp in Lille das außerordentlichste Bankett des Mittelalters. Ein lebender Fasan wurde, mit einem goldenen Halsband geschmückt, in den Saal getragen; vor ihm schworen die versammelten Ritter Burgunds Kreuzzugsgelübde bei Gott, der Jungfrau und dem Fasan selbst. Philipp gelobte, seinem König ins Heilige Land zu folgen. Bühnenmaschinerie erzeugte eine Kapelle, ein Schiff und eine Burg auf den Speisetischen. Gaukler, Dichter und Musiker wetteiferten um Aufmerksamkeit. Der Kreuzzug fand nie statt – doch niemand in Europa zweifelte daran, dass Burgund der führende Hüter ritterlicher Tugend der Christenheit war."
 bur_events.2.a: "Wir schwören vor Gott und dem Fasan, die Christenheit zu verteidigen!"
 bur_events.3.t: "Die Krone Lothars"
 bur_events.3.d: "843 teilte der Vertrag von Verdun Karls des Großen Reich unter seinen drei Enkeln. Der mittlere Teil – von Flandern bis Italien entlang des Rheins reichend – ging an Lothar I. und wurde „Lotharingien“. 870 löschte der Vertrag von Meerssen es aus und teilte es zwischen Frankreich und Deutschland. Tausend Jahre lang war das Zwischenreich nicht mehr als eine Erinnerung – ein Geist, der die Grenzen Frankreichs und des Reiches heimsucht. Nun hat das Haus Burgund durch List und Waffen wiederaufgebaut, was die Karolinger nicht halten konnten. Möge die Krone Lothars an ihren rechtmäßigen Erben übergehen."
 bur_council_of_mechelen: "Der Große Rat von Mecheln"
 bur_council_of_mechelen_desc: "Philipps des Guten Berater errichteten in Mecheln einen „Großen Rat“ mit Zuständigkeit über alle burgundischen Gebiete – ein oberstes Gericht, das über den getrennten Rechtstraditionen Flanderns, Brabants und der Franche-Comté stand. Dies war der institutionelle Eckstein echter Zentralisierung."
 bur_siege_of_calais: "Calais eingenommen"
 bur_siege_of_calais_desc: "Calais war Englands letzter Stützpunkt auf französischem Festland – gehalten von 1347 bis 1558. Rodins berühmte „Bürger von Calais“ gedenken seiner heldenhaften Übergabe. Die Einnahme dieses strategischen Hafens gibt Burgund die Kontrolle über den Kanalübergang und maximiert den Wert des englischen Bündnisses."
 bur_hainaut_namur: "Hennegau und Namur erben"
 bur_hainaut_namur_desc: "Philipp der Gute kaufte Namur 1421 und erbte Hennegau 1433 – und vollendete so die Landbrücke zwischen Flandern und Brabant. Diese Grafschaften mit ihren Tuchstädten und strategischen Flussübergängen bildeten das verbindende Gewebe der burgundischen Niederlande."
 bur_holland_zeeland: "Holland und Seeland"
 bur_holland_zeeland_desc: "Die Grafschaften Holland und Seeland – mit ihren Heringsfischereien, neuen Handelsstädten wie Amsterdam und ausgezeichneten Häfen – wurden 1428 von Philipp dem Guten erworben. Diese Gebiete sollten zum Kernland der Niederländischen Republik werden; unter Burgund sind sie der Motor eines nordseeischen Handelsreiches."
 bur_luxemburg: "Luxemburg"
 bur_luxemburg_desc: "Philipp der Gute eroberte das Herzogtum Luxemburg 1443 nach einem Feldzug gegen Sigismund aus dem Hause Habsburg. Als eine der stärksten Festungen des Reiches war Luxemburg der östliche Anker der burgundischen Niederlande – und das Tor nach Lothringen und ins Elsass."
 bur_dominate_rhine: "Der Rhein"
 bur_dominate_rhine_desc: "Der Rhein ist von Rom bis heute das Rückgrat der europäischen Zivilisation gewesen. Den Fluss von den Niederlanden bis ins Elsass zu halten, bedeutet, Karls des Großen Kernland zu halten – das Rheinland, wo das karolingische Reich verwaltet wurde, wo Domstädte aufstiegen, wo die größten mittelalterlichen Handelswege zusammenliefen."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Großer Rat von Mecheln"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "Der Große Rat zu Mecheln war Burgunds Antwort auf das Problem, einen Verbundstaat mit unterschiedlichen Rechtstraditionen zu regieren. Indem sie ein oberstes Gericht über flämischem, brabantischem und burgundischem Recht gleichermaßen schufen, errichteten Philipps Berater das institutionelle Fundament echter Zentralisierung."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "Der Freihafen von Calais"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Calais, am schmalsten Punkt des Ärmelkanals, ist seit der Antike der Schlüsseldurchgangsknoten gewesen, der Nordsee-, Ostsee- und Mittelmeerhandel verbindet. England hielt es über zwei Jahrhunderte genau wegen dieses kaufmännischen Wertes. Burgund entwickelt Calais nun zur führenden Tuchhandelsdrehscheibe Nordeuropas."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Luxemburg"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "Das Festungsherzogtum Luxemburg, eine der stärksten Stellungen des Reiches, gab Burgund seinen östlichen Anker. Sein Erwerb 1443 vollendete die Umschließung des Maastals und öffnete den Weg nach Lothringen und ins Elsass."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "Der Rhein"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "Vom Delta bis zu den Weinbergen ist der Rhein nun burgundisch. Der größte Fluss des karolingischen Kernlandes, der Handelsweg des mittelalterlichen Europas, die Grenze zwischen Zivilisation und Wald – alles unter einer Flagge."
 bur_join_hre: "Dem Heiligen Römischen Reich beitreten"
 bur_join_hre_desc: "Burgund hat die Gelegenheit, förmlich als Fürst des Heiligen Römischen Reiches anerkannt zu werden. Ein doppelter Status – Vasall Frankreichs und Reichsfürst – würde Burgund eine einzigartig mächtige diplomatische Stellung verleihen. 1473 verhandelte Karl der Kühne mit Friedrich III. in Trier über die Erhebung zu einem „Königreich Burgund“ innerhalb des Reiches – nur dass der Kaiser sich im letzten Augenblick zurückzog. Nun kommt die Gelegenheit wieder."
 bur_franchecomte_fiefdom: "Vermählung mit der Franche-Comté"
 bur_franchecomte_fiefdom_desc: "Im 13. Jahrhundert schmiedete das Haus Burgund tiefe Bande zu den Grafen der Franche-Comté durch Heirat. Herzog Otto IV. von Burgund heiratete Gräfin Mahaut von Artois und sicherte der Franche-Comté die Treue zu Burgund. Die Salzminen, das Eisenerz und die Universität Dole dieser „Freigrafschaft“ machen sie zu einem lebenswichtigen Tor für Burgunds Ausdehnung nach Osten in Richtung Schweiz und Lothringen."
 bur_events.4.t: "Das Heilige Römische Reich"
 bur_events.4.d: "Burgund hat stets eine Zwischenstellung eingenommen – ein Vasall Frankreichs nach Lehnsrecht, doch durch seine östlichen Gebiete mit dem Reich verbunden. Die Gunst des Kaisers öffnet den Weg zur förmlichen Mitgliedschaft. 1473 traf Karl der Kühne Friedrich III. in Trier und verhandelte über den Status „Königreich Burgund“ innerhalb des Reiches – nur dass der Kaiser bei Tagesanbruch seine Barke bestieg und davonsegelte, ohne zu unterzeichnen. Nun, mit hinreichend warmen Beziehungen, steht die Tür wieder offen."
 bur_events.4.a: "Dem Reich beitreten und Reichsfürst werden"
 bur_events.4.b: "Unsere Unabhängigkeit vorerst bewahren"
 bur_events.5.t: "Vermählung mit der Franche-Comté"
 bur_events.5.d: "Im 13. Jahrhundert heiratete der burgundische Herzog Otto IV. in das gräfliche Haus der Franche-Comté ein und band diese reiche „Freigrafschaft“ durch Blut an Burgund. Die Salzminen des Jura, die Eisenschmieden, die Universität Dole und die Bergpässe, die die Wege in die Schweiz und nach Lothringen beherrschen – all dies war seit Generationen Teil der burgundischen Welt. Die Zeit ist gekommen, förmlich zu machen, was die Heirat bereits geschaffen hat."
 bur_events.5.a: "Die Bande der Heirat nutzen, um die Franche-Comté als belehnten Vasall zu erhalten"
 bur_events.5.b: "Die ehelichen Bande wahren und dabei ihre Autonomie achten"
 bur_events.6.t: "Flandern im Hundertjährigen Krieg"
 bur_events.6.d: "Die Grafschaft Flandern nimmt eine einzigartige Stellung im Hundertjährigen Krieg ein. Flämische Tucherzeugung kann ohne englische Wolle nicht funktionieren, und die reichen Bürger von Brügge, Gent und Ypern schätzen ihre englische Handelsbeziehung über alles. Frankreich beansprucht den Grafen als Vasall, doch die flämischen Städter widersetzen sich französischer Herrschaft und haben sich wiederholt auf Englands Seite gestellt. Indem er Flandern in die burgundische Umlaufbahn zieht, kann der Herzog den Reichtum dieser Tuchstädte nutzen. Die Wahl: Flandern als burgundischen Vasall belehnen, oder die Bande vertiefen, während man seine Unabhängigkeit achtet."
 bur_events.6.a: "Flandern als burgundischen Vasall erhalten"
 bur_events.6.b: "Flanderns Unabhängigkeit achten, während man das Bündnis vertieft"
 bur_nevers_union: "Union mit Nevers"
 bur_nevers_union_desc: "Die Grafschaft Nevers liegt südlich von Flandern und hat historische Bande zum burgundischen Herzogshaus. Mit Flandern fest in der Hand begründet die Errichtung eines Anspruchs auf Nevers Burgunds Einflusssphäre nach Süden. Die Lande zwischen Flandern und Nevers bilden einen Korridor für künftige Ausdehnung nach Frankreich."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "Die Niederlande geeint"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "Das Handelsnetz der Niederlande – das Holland, Seeland, Brabant und Flandern verbindet – ist geeint. Die kaufmännische Macht Antwerpens und Amsterdams, die das Fundament des späteren niederländischen Goldenen Zeitalters bildet."
 bur_events.3.a: "Erhebe dich als das wiederhergestellte Königreich Lotharingien"
 bur_events.3.b: "Bleibe als Burgund und beanspruche den kaiserlichen Titel (Status quo)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotharingien wiedergeboren"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "Das Königreich Lotharingien, Nachfolger Mittelfrankens, ist sechs Jahrhunderte nach seinem Untergang 869 wiederbelebt. Erbe von Karls des Großen Reich, wird dieses Königreich als dritte Kaisermacht anerkannt, stehend zwischen dem Heiligen Römischen Reich und dem Königreich Frankreich."
