l_german:
 hun_crown_of_saint_stephen_mission_pack: "Die Krone des Heiligen Stephan"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "Im Jahr 1337 wird das Königreich Ungarn von König Karl I. (Károly Róbert) aus dem Haus Anjou regiert. Sein Erbe, der glänzende Ludwig – später als Ludwig der Große bekannt – wartet im Hintergrund, mit einer Personalunion mit Polen, die in der nächsten Generation kommen wird. Dieses Reich, im Karpatenbecken gelegen, hegt Ambitionen in jede Richtung: nach Norden über Polen und Böhmen, nach Süden auf den Balkan, nach Osten gegen die Osmanen und nach Westen zur Adria. Errichte das Schwarze Heer, bringe die Renaissance nach Buda und stehe als Bollwerk der Christenheit."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "Dehne dich als Ungarn nach Norden über Polen und Böhmen aus, sichere den Balkan, besiege die Osmanen, erreiche die Adria und vollende innere Reformen."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um den Glanz der Krone des Heiligen Stephan wiederherzustellen."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "Vom Haus Anjou zum Zeitalter des Matthias Corvinus – Ungarns größte Tage erwarten dich!"
 hun_crown_of_st_stephen: "Die Krone des Heiligen Stephan"
 hun_crown_of_st_stephen_desc: "Der Heilige Stephan I. gründete im Jahr 1000 n. Chr. das Königreich Ungarn und trieb die Bekehrung zum Christentum voran. Die Krone des Heiligen Stephan – die Heilige Krone – bleibt bis heute das heilige Sinnbild des ungarischen Königtums. Im Jahr 1337 hält das Haus Anjou diese Krone und herrscht über das größte Königreich Mitteleuropas. Sichere Buda und Esztergom und festige die Grundlagen des Reiches."
 hun_angevin_diplomacy: "Angiovinische Diplomatie"
 hun_angevin_diplomacy_desc: "Ungarns Haus Anjou unterhält vielschichtige dynastische Bande zu Neapel, Polen und Böhmen. Ludwigs I. Mutter Elisabeth war die Schwester des polnischen Königs Kasimir III. und eröffnete die Aussicht, die polnische Krone zu erben. Baue ein Netz von Bündnissen und mehre den angiovinischen diplomatischen Einfluss in ganz Mitteleuropa."
 hun_polish_union: "Personalunion mit Polen"
 hun_polish_union_desc: "Als Kasimir III. der Große 1370 ohne männlichen Erben starb, wurde sein Neffe Ludwig I. neben Ungarn auch König von Polen. Diese ungarisch-polnische Personalunion war der Beginn einer mächtigen Doppelmonarchie in Mitteleuropa. Zwei große Königreiche unter einem König – das Kräftegleichgewicht in Mitteleuropa verschiebt sich dramatisch."
 hun_bohemian_ambitions: "Böhmische Ambitionen"
 hun_bohemian_ambitions_desc: "Das Königreich Böhmen, Brutstätte der hussitischen Ketzerei, wird von religiösen Wirren erschüttert. Während Anjous, Luxemburger und Habsburger um die böhmische Krone wetteifern, hat auch Ungarn einen rechtmäßigen Anspruch. Die Einnahme Prags schafft eine ungarisch-böhmische Doppelmonarchie im Herzen Mitteleuropas."
 hun_lord_of_the_north: "Herr des Nordens"
 hun_lord_of_the_north_desc: "Die Einnahme Krakaus und Danzigs dehnt die ungarische Herrschaft bis zur Ostsee aus und schafft ein gewaltiges mitteleuropäisches Reich von der Adria bis zur Ostsee. Der Glanz der Piasten- und Anjou-Dynastien Polens belebt sich neu unter der ungarischen Krone."
 hun_conquer_serbia: "Serbien erobern"
 hun_conquer_serbia_desc: "Das Königreich Serbien wurde nach der Schlacht auf dem Amselfeld (1389) osmanischer Vasall. Doch für Ungarn ist Belgrad (Nándorfehérvár) der unentbehrliche Schlüssel zur Donauverteidigung. 1440 verteidigten Skanderbeg und János Hunyadi Belgrad legendär gegen die Osmanen – lass diese Schlacht hier geschlagen werden."
 hun_subjugate_wallachia: "Die Walachei unterwerfen"
 hun_subjugate_wallachia_desc: "Die Walachei (Havasalföld) hat historisch die ungarische Lehnshoheit anerkannt. Vlad II. – der Vater Vlads des Pfählers – empfing vom ungarischen König Sigismund den Drachenorden. Begründe diesen Pufferstaat fest unter ungarischem Einfluss."
 hun_subjugate_moldavia: "Die Moldau unterwerfen"
 hun_subjugate_moldavia_desc: "Die Moldau liegt zwischen dem Donaudelta und Polen, umkämpft von Ungarn, Polen und den Osmanen. Dieses Fürstentum fest unter ungarische Oberherrschaft zu bringen, sichert die Ostgrenze."
 hun_danube_fortress_line: "Die Donaufestungslinie"
 hun_danube_fortress_line_desc: "Das Végvár-System – Ungarns Grenzfestungsnetz – war die ausgefeilteste antiosmanische Verteidigungsstruktur im Europa des 15. Jahrhunderts. Dutzende Festungen entlang der Donau kommunizierten miteinander und bildeten eine Frühwarn- und Verteidigungslinie, die osmanische Vorstöße im Keim erstickte. Dieses System machte Ungarn zum wahren ersten Schild der Christenheit."
 hun_order_of_the_dragon: "Der Drachenorden"
 hun_order_of_the_dragon_desc: "Der Drachenorden war ein 1408 vom ungarischen König Sigismund gegründeter Ritterorden. Vlad II., Skanderbeg und János Hunyadi gehörten zu seinen Mitgliedern. Dieser Orden versammelte den ungarischen Adel unter dem Banner des antiosmanischen Kreuzzugs und verkörperte die Sendung des christlichen Schutzes."
 hun_crusade_preparations: "Kreuzzugsvorbereitungen"
 hun_crusade_preparations_desc: "János Hunyadi war der größte antiosmanische Kreuzfahrer des 15. Jahrhunderts. Sein Langer Feldzug von 1442–43 drängte die Osmanen zurück und gab der Christenheit Hoffnung. Doch die Schlacht von Warna 1444 vernichtete das polnisch-ungarische Kreuzfahrerheer. Diesmal geh vorbereitet hinein."
 hun_battle_of_nicopolis: "Die Schlacht bei Nikopolis"
 hun_battle_of_nicopolis_desc: "1396 wurde das Kreuzfahrerheer unter König Sigismund von Ungarn in der Schlacht bei Nikopolis zerschmettert – die Katastrophe, die die osmanische Herrschaft über den Balkan sicherte. Doch diesmal ist es anders – ein voll vorbereitetes Ungarn nimmt Nikopolis ein und öffnet die Tür zur Rückeroberung des Balkans. Der Name Hunyadi hallt durch ganz Europa."
 hun_black_army: "Das Schwarze Heer"
 hun_black_army_desc: "Das Schwarze Heer (Fekete Sereg), um 1458 von König Matthias Corvinus geschaffen, war die fortschrittlichste Berufsstreitmacht im zeitgenössischen Europa – eine Verschmelzung von Söldnern und stehenden Truppen in schwarzer Rüstung, die Feuerwaffen tatkräftig übernahm. Trotz gewaltiger Unterhaltskosten versetzte dieses Heer Osmanen wie Habsburger gleichermaßen in Schrecken. Es ist der Schlüssel zur ungarischen Hegemonie."
 hun_bulwark_of_christendom: "Bollwerk der Christenheit"
 hun_bulwark_of_christendom_desc: "Jahrhundertelang kämpfte Ungarn an der Front der Christenheit gegen das Osmanische Reich. Nun, da die Osmanen vollständig aus Europa vertrieben sind, überhäufen Papst, Kaiser und Fürsten Europas Ungarns König mit der höchsten Ehre: Antemurale Christianitatis – dem Bollwerk der Christenheit."
 hun_croatian_union: "Union mit Kroatien"
 hun_croatian_union_desc: "Seit der Pacta Conventa von 1102 steht Kroatien mit Ungarn in Personalunion – kroatische Adlige nahmen den ungarischen König als den ihren an, im Austausch für weitreichende Autonomie. Stärke diese historische Union und sichere Ungarns Tor zur Adria."
 hun_reclaim_dalmatia: "Dalmatien zurückgewinnen"
 hun_reclaim_dalmatia_desc: "Die dalmatinische Küste war Teil des ungarisch-kroatischen Königreichs, bis Venedig sie 1409 kaufte. Die Rückgewinnung von Split und Ragusa (Dubrovnik) stellt den gesicherten Zugang zur Adria wieder her und öffnet den Weg nach Italien."
 hun_adriatic_supremacy: "Vorherrschaft in der Adria"
 hun_adriatic_supremacy_desc: "Es ist Zeit, Venedigs langes Monopol über die Adria – die „Braut der Adria“ – zu beenden. Die ungarisch-kroatische Flotte wird ihre Flagge über der Adria erheben."
 hun_angevin_naples: "Der angiovinische Anspruch auf Neapel"
 hun_angevin_naples_desc: "Ungarns Haus Anjou hält einen Anspruch auf den Thron Neapels. Ludwig I. besetzte Neapel zweimal, 1347 und 1350. Nun ist die Zeit gekommen, den angiovinischen Anspruch dauerhaft zu verwirklichen – lass den König von Ungarn für immer über Neapel herrschen."
 hun_strengthen_estates: "Die Stände stärken"
 hun_strengthen_estates_desc: "Ungarns Adel und Klerus errangen in der Goldenen Bulle (Aranybulla) von 1222 weitreichende Privilegien. Diese Tradition der Ständepolitik zu nutzen und die Unterstützung von Adel und Klerus zu gewinnen, stärkt die königliche Legitimität. Doch Vorsicht – übermäßige Zugeständnisse verursachen später Probleme. Bewahre das rechte Gleichgewicht."
 hun_tripartitum: "Das Tripartitum"
 hun_tripartitum_desc: "Das 1514 von István Werbőczy zusammengestellte Tripartitum war eine systematische Kodifizierung des ungarischen Gewohnheitsrechts. Es legte Adelsprivilegien, bäuerliche Pflichten und königliche Autorität fest. Dieses Gesetzbuch wurde zum Fundament des ungarischen Rechts – wenngleich seine Festschreibung der Leibeigenschaft auch zum Dózsa-Bauernaufstand von 1514 beitrug."
 hun_matthias_reforms: "Die Reformen König Matthias’"
 hun_matthias_reforms_desc: "König Matthias Corvinus (reg. 1458–90), „der Gerechte“ genannt, war der größte der ungarischen Könige. Zentralisierte Besteuerung, das Berufsheer Schwarzes Heer und die tatkräftige Übernahme der Renaissancekultur verwandelten Ungarn in den stärksten Staat Mitteleuropas."
 hun_buda_renaissance: "Die Renaissance von Buda"
 hun_buda_renaissance_desc: "Der Hof König Matthias’ brachte die italienische Renaissance nach Ungarn. Die Bibliotheca Corviniana im Palast von Buda beherbergte tausende lateinische und griechische Handschriften und zog Gelehrte und Künstler aus ganz Europa an. Diese kulturelle Blüte macht Ungarn zum kulturellen Zentrum Mitteleuropas."
 hun_great_hungary: "Groß-Ungarn"
 hun_great_hungary_desc: "Der Balkan, Polen, Böhmen, Dalmatien – das Königreich Ungarn ist zu einem großen Reich weit über das Karpatenbecken hinaus herangewachsen. Das Schwarze Heer, Budas Renaissancehof, die Donaufestungslinie – all dies zusammen hat ein mächtigeres Ungarn geschaffen als je zuvor."
 hun_glory_of_st_stephen: "Der Ruhm der Krone des Heiligen Stephan"
 hun_glory_of_st_stephen_desc: "Das vor tausend Jahren vom Heiligen Stephan gegründete Königreich Ungarn ist zu einem großen Reich geworden, das Mitteleuropa und den Balkan beherrscht. Von der Ostsee im Norden bis zur Adria und zum Mittelmeer im Süden, von den Karpaten bis in den Osten – die Krone des Heiligen Stephan erstrahlt mit beispiellosem Glanz. Als Bollwerk der Christenheit gefeiert, hat Ungarns Ruhm seinen absoluten Gipfel erreicht."
 hun_events.99.t: "Der Ruhm der Krone des Heiligen Stephan"
 hun_events.99.d: "Das Königreich des Heiligen Stephan – einst auf das Karpatenbecken beschränkt – erstreckt sich nun von der Ostsee bis zur Adria und zum Mittelmeer. Polen, Böhmen und Kroatien sind unter der ungarischen Krone vereint; die Osmanen sind vom Balkan vertrieben; der angiovinische Anspruch auf Neapel ist erfüllt. Der Renaissancehof von Buda ist in ganz Europa berühmt; das Schwarze Heer wird von jedem Feind gefürchtet. Die Krone des Heiligen Stephan erstrahlt mit dem größten Glanz ihrer tausendjährigen Geschichte."
 hun_events.99.a: "Heiliger Stephan, wir haben deinen Traum erfüllt!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Angiovinisches Ansehen"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "1308 erbte der angiovinische Prinz Karl (Károly Róbert) den ungarischen Thron. Die Blutlinien dieser Dynastie verbanden Ungarn mit Neapel, Sizilien, der Provence und Polen und rückten Ungarn in den Mittelpunkt der europäischen Diplomatie. Der päpstliche Hof in Avignon und die Habsburger in Wien konnten es sich nicht leisten, diesen angiovinischen Hof zu übersehen."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Angiovinisches diplomatisches Netz"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "Briefe angiovinischer Prinzessinnen, die von Neapel bis Polen verheiratet wurden, treffen ununterbrochen am Hof zu Visegrád ein."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "Krone Böhmens"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "Mit gesicherter böhmischer Krone ist eine ungarisch-polnisch-böhmische Dreifachmonarchie entstanden."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Herr des Nordens"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "Mit Zugang zur Ostsee ist Ungarn zu einer Großmacht geworden, die den wichtigen nord- und osteuropäischen Handel beherrscht."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Pufferstaat Walachei"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "Die Walachei wirkt als ungarischer Pufferstaat und sichert die Ostgrenze."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Pufferstaat Moldau"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "Die Moldau unter ungarischem Einfluss bietet eine doppelte Schicht der Sicherheit an der Ostgrenze."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "Das Végvár-Festungssystem"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "Das geordnete Festungsnetz entlang der Donau blockiert systematisch osmanische Vorstöße. Ungarn wird zum vordersten Schild der Christenheit."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "Der Drachenorden"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "König Sigismunds Drachenorden vereint Adel und Heer in einer einzigen Sache. Er wird zum geistlichen Rückgrat des antiosmanischen Kreuzzugs."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Kreuzzugseifer"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "Der Eifer des Kreuzzugs, der sich unter János Hunyadis Banner sammelte, brennt noch immer in den Herzen der Soldaten."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "Das Schwarze Heer"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "Das Fekete Sereg – das Schwarze Heer –, von Matthias Corvinus geschaffen, war die modernste Streitmacht im zeitgenössischen Europa: zehntausende Söldner und stehende Truppen in schwarzer Rüstung. Um einen Kern hussitischer Ritter aus Böhmen aufgebaut, übernahm es tatkräftig Feuerwaffen und wurde von Osmanen wie Habsburgern gleichermaßen gefürchtet. Die ruinösen Kosten belasteten die königliche Schatzkammer schwer – doch ohne dieses Heer hätte Ungarn zwischen solchen Giganten nicht überleben können."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Bollwerk der Christenheit"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Nachdem es die Osmanen aus Europa vertrieben hat, trägt Ungarn die Ehre der Antemurale Christianitatis."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Adriaküste gesichert"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "Die Rückgewinnung Dalmatiens gibt Ungarn unmittelbaren Zugang zur Adria."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "Angiovinisches Italien"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "Die ungarischen Anjous beherrschen Süditalien über Neapel."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "Tradition der Goldenen Bulle"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "Das Ständesystem, das den Geist der Goldenen Bulle von 1222 fortführt, stützt die Stabilität des Reiches."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "Das Tripartitum"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "Das 1514 von István Werbőczy zusammengestellte Tripartitum war die Vollendung des ungarischen Gewohnheitsrechts – drei Teile, die die „eine und selbe Freiheit“ des Adels, die Verknechtung der Bauern und die königliche Autorität behandelten. Der blutige Dózsa-Bauernaufstand war sein Preis. Und dennoch blieb dieses Gesetzbuch über Jahrhunderte das Fundament der ungarischen Gesellschaft."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "Die Reformen König Matthias’"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Matthias wurde „der Gerechte“ (Igazságos Mátyás) genannt, weil er ungeachtet des Ranges Gericht hielt und Bauern vor der Unterdrückung durch die Magnaten schützte. Er baute eine zentralisierte Bürokratie auf, beschnitt die Macht der Magnaten und erstreckte die königliche Autorität unmittelbar bis aufs Land. Seine Herrschaft wird als der vollkommenste Ausdruck ungarischen Königtums in der Geschichte erinnert."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "Die Renaissance von Buda"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "Der Hof des Matthias zog Humanisten, Architekten, Bildhauer und Musiker aus ganz Italien an. Der Palast von Buda wurde im Renaissancestil neu erbaut – prachtvoller als Wien – und die Bibliotheca Corviniana beherbergte über fünftausend Handschriften klassischer griechischer und römischer Texte. Als Matthias starb, schrieb ein Humanist: „Matthias ist tot. Die Gerechtigkeit ist untergegangen.“"
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "Groß-Ungarn"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "Das große ungarische Reich, das Mitteleuropa, den Balkan und die Adria umspannt, ist vollendet."
 hun_baltic_trade: "Ostseehandel"
 hun_baltic_trade_desc: "Danzig ist die Schlüsseldrehscheibe der Hanse – das Tor zwischen Nordsee und Ostsee. Ungarns Beherrschung dieses Hafens öffnet den Zugang zum Handel mit baltischem Bernstein, Pelzen und Holz und sichert eine direkte Route nach Westeuropa. Dies ist der Wendepunkt, an dem sich Ungarn von einem landumschlossenen Agrarstaat zu einer Seehandelsmacht wandelt."
 hun_hre_influence: "Einfluss auf das Heilige Römische Reich"
 hun_hre_influence_desc: "Mit gesichertem Polen und Böhmen ist Ungarn zum mächtigsten Nachbarn des Heiligen Römischen Reiches geworden. Dehne den ungarischen Einfluss über die deutschen Fürsten durch diplomatisches Ansehen und mehrere Bündnisse aus und wirke der habsburgischen Hegemonie entgegen."
 hun_challenge_habsburgs: "Die Habsburger herausfordern"
 hun_challenge_habsburgs_desc: "Die Dynastie der Habsburger Österreichs war Ungarns ewiger Rivale. Die Einnahme Wiens überträgt die Vorherrschaft an der Donau an Ungarn. Der größte Ehrgeiz Ungarns – die Habsburger zu stürzen und Kaiser des Reiches zu werden – wird hier verwirklicht."
 hun_conquer_bulgaria: "Bulgarien erobern"
 hun_conquer_bulgaria_desc: "Das Zweite Bulgarische Reich wurde 1396 von den Osmanen zerstört. Doch mit Ungarn nun beherrschend auf dem Balkan können Sofia und Tarnovo zurückgewonnen werden – und das bulgarische Erbe unter der ungarischen Krone wiederbeleben."
 hun_conquer_greece: "Griechenland erobern"
 hun_conquer_greece_desc: "Athen und Thessaloniki – die zwei großen Städte der antiken griechischen Zivilisation – fallen an Ungarn. Einige die zersplitterten griechischen Fürstentümer nach dem Fall von Byzanz und dehne das ungarische Banner bis an die Südspitze des Balkans aus."
 hun_balkan_empire: "Balkanreich"
 hun_balkan_empire_desc: "Serbien, Bulgarien, Griechenland, die Walachei, die Moldau – der gesamte Balkan unter ungarischer Herrschaft. Die Hegemonie, die einst Byzanz und dann die Osmanen über den Balkan ausübten, gehört nun gänzlich Ungarn."
 hun_push_into_anatolia: "Vorstoß nach Anatolien"
 hun_push_into_anatolia_desc: "Mit gesichertem Konstantinopel spannt Ungarn nun über zwei Kontinente. Führe einen Kreuzzug, um die anatolischen Lande zurückzugewinnen, die Byzanz verlor, und schlage ins Herz des Osmanischen Reiches."
 hun_hungarian_crusade: "Der ungarische Kreuzzug"
 hun_hungarian_crusade_desc: "Der ungarische König, der Jerusalem befreit, wird zum Helden der gesamten Christenheit. Der Traum seit den Tagen des Heiligen Stephan – das Heilige Land in christliche Hände zurückzugeben – wird endlich verwirklicht. Der Kreuzzugssieg, von dem Sigismund, der Gründer des Drachenordens, träumte, wird hier eingeschrieben."
 hun_mediterranean_fleet: "Mittelmeerflotte"
 hun_mediterranean_fleet_desc: "Mit gesichertem Neapel und Sizilien ist Ungarn zu einer bedeutenden Seemacht im Mittelmeer geworden. Eine Flotte von dreißig oder mehr Schiffen wetteifert um die Herrschaft über das Mittelmeer. Das Meer, einst von Venedig monopolisiert, gehört nun Ungarn."
 hun_conquer_north_africa: "Nordafrika erobern"
 hun_conquer_north_africa_desc: "Die Einnahme von Tunis dehnt ungarisches Gebiet bis an die Südküste des Mittelmeers aus. Zerschlage die Stützpunkte der Barbareskenpiraten und beseitige Hindernisse für den Mittelmeerhandel. Die ungarische Flagge weht am südlichen Rand des Mittelmeers."
 hun_latin_empire: "Die Wiederherstellung des Lateinischen Kaiserreichs"
 hun_latin_empire_desc: "Mit gesichertem Konstantinopel, Rom und Neapel kann der König von Ungarn beanspruchen, Erbe des Lateinischen Kaiserreichs zu sein. Der Traum des Vierten Kreuzzugs von 1204 wird nun durch rechtmäßige Eroberung verwirklicht. Das größte christliche Reich der Geschichte wird geboren."
 hun_corvinus_library: "Die Bibliotheca Corviniana"
 hun_corvinus_library_desc: "König Matthias’ Bibliotheca Corviniana war die größte Sammlung lateinischer und griechischer Handschriften im zeitgenössischen Europa – über fünftausend Kodizes im Palast von Buda, die Gelehrte und Künstler aus Italien, Frankreich und Deutschland anzogen. Diese kulturelle Investition verwandelt Ungarn in das kulturelle Zentrum Mitteleuropas."
 hun_hungarian_church: "Die ungarische Kirche"
 hun_hungarian_church_desc: "Um das Erzbistum Esztergom herum stärke die ungarische katholische Kirche und sichere klerikale Unterstützung. Ehe die Wogen der Reformation eintreffen, begründe fest das Verhältnis zwischen der katholischen Kirche und der ungarischen Königsmacht."
 hun_economic_powerhouse: "Die goldene Donau"
 hun_economic_powerhouse_desc: "Ungarn, das sich über den Balkan, den Norden und die Adria erstreckt, liegt am Schnittpunkt mehrerer bedeutender Handelswege – ein Wirtschaftsriese. Die landwirtschaftliche Erzeugung an der Donau, die siebenbürgischen Silberminen und die Einkünfte aus dem Mittelmeerhandel vereinen sich zu gewaltigem Reichtum."
 hun_danube_empire: "Das Donaureich"
 hun_danube_empire_desc: "Polen, Böhmen, der Balkan, die Adria, das Mittelmeer – alles unter ungarischer Herrschaft, mit ausgefeilten Verwaltungseinrichtungen und einer blühenden wirtschaftlichen Grundlage. Ungarn ist zum „Donaureich“ um den großen Strom geworden. Der vielsprachige Vielvölkerstaat, von dem einst Österreich-Ungarn träumte, ist nun unter ungarischer Führung verwirklicht."
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Ostseehandel"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Ungarische Handelsschiffe, die im Hafen von Danzig ankern, kehren beladen mit Bernstein und Pelzen zurück."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Ungarn-Österreich"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "Der Fall Wiens lässt die habsburgische Autorität zusammenbrechen und macht Ungarn zum Herrn der Donau."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Bulgarische Herrschaft"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Die neuen Statthalter auf dem Hügel von Tarnovo verbreiten ungarische Sprache und Recht in den Dörfern des südlichen Balkans."
 STATIC_MODIFIER_NAME_hun_greece_mod: "Das Licht Griechenlands"
 STATIC_MODIFIER_DESC_hun_greece_mod: "Der König von Ungarn, hinaufblickend zur Akropolis von Athen, nimmt den Ruhm des antiken Griechenlands als Stolz seines eigenen Hofes an."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "Balkanreich"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "Von der Donau bis zum Peloponnes weht das Banner der Krone des Heiligen Stephan von jeder Mauer des Balkans."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "Neuer Kreuzzug"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "Die Soldaten, die durch die Tore Konstantinopels zogen, schwören von neuem, das Kreuz noch weiter nach Osten zu tragen."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Kreuzzug vollbracht"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "Der Ruhm, Jerusalem befreit zu haben, bringt Ungarn beispielloses Ansehen, Legitimität und diplomatische Autorität."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "Mittelmeerflotte"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "Aus den Häfen der Adria rudern Galeeren, die des ungarischen Königs Banner tragen, eine nach der anderen ins Mittelmeer hinaus."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "Nordafrikanischer Stützpunkt"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "Entlang der Küste Nordafrikas ziehen ungarische Kaufleute und Korsarenjäger-Geschwader unablässig von Hafen zu Hafen."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Wiederherstellung des Lateinischen Kaiserreichs"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "Der Name des Königs, der Konstantinopel, Rom und Neapel hält, wird in jedem Hof mit Ehrfurcht geflüstert."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Die Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "Im Skriptorium der Bibliotheca Corviniana kopieren Schreiber bei Lampenlicht Tag und Nacht Handschriften."
 STATIC_MODIFIER_NAME_hun_church_mod: "Ungarische Kirche"
 STATIC_MODIFIER_DESC_hun_church_mod: "Eine starke ungarische Kirche bringt Legitimität, gesetzgeberische Effizienz und religiöse Stabilität."
 STATIC_MODIFIER_NAME_hun_economy_mod: "Die goldene Donau"
 STATIC_MODIFIER_DESC_hun_economy_mod: "Lastkähne, die die Donau befahren, und Karren, die aus den Bergwerken herangeschafft werden, halten die Märkte des Königreichs stets belebt."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "Das Donaureich"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "Das vielsprachige Donaureich um den großen Strom ist vollendet. Steuer, Bevölkerung, Verwaltung und gesetzgeberische Effizienz erreichen alle ihren Gipfel."
 hun_transylvanian_mines: "Die niederungarischen Bergstädte"
 hun_transylvanian_mines_desc: "Kremnitz (Körmöcbánya) beherbergt Ungarns größte Goldmünzstätte. Neusohl (Besztercebánya) ist berühmt für die größten Kupferbergwerke Mitteleuropas. Die Sicherung dieser zwei Städte macht Ungarn zum führenden Bergbaustaat Mitteleuropas. Matthias Corvinus ordnete diese Region 1467–68 als kaiserliche Domäne neu und finanzierte mit den Bergbaueinkünften das Schwarze Heer."
 hun_silver_mines: "Die Silberminen von Schemnitz"
 hun_silver_mines_desc: "Die Region Hont (mit Schemnitz) ist der größte Silberbergbaubezirk Niederungarns. Das Silber dieses Landes wurde in der königlichen Münze zu Talern geprägt und trug den Handel in ganz Mitteleuropa. Die „niederungarischen Bergstädte“ sind das wirtschaftliche Herz des Königreichs."
 hun_salt_mines: "Die Salzbergwerke Siebenbürgens"
 hun_salt_mines_desc: "Sighet (Máramarossziget) und Thorenburg (Turda) werden seit der Antike auf Steinsalz abgebaut. Salz wurde einst „weißes Gold“ genannt – so lebenswichtig, dass Ungarns königliches Salzmonopol eine entscheidende Säule der Kronfinanzen war. Sichere diese Salzbergwerke und begründe ein Monopol auf den Salzhandel."
 hun_tokaj_wine: "Die Weine von Tokaj"
 hun_tokaj_wine_desc: "Die Region Tokaj um Sátoraljaújhely erzeugt Tokajer Aszú – den „Wein der Könige, König der Weine“. So berühmt, dass Papst Benedikt XIV. ihn Ludwig XV. von Frankreich schenkte, ist dieser Edelfäule-Wein aus den ungarischen Hügeln Europas berühmtester Jahrgang. Entwickle die Weinberge und führe den feinsten Wein Europas aus."
 hun_mining_empire: "Das Bergbaureich"
 hun_mining_empire_desc: "Kremnitz’ Gold, Honts Silber, Neusohls Kupfer und das Salz von Sighet und Thorenburg – aller Ungarns Bodenschätze sind nun gesichert. Als Mitteleuropas führender Bergbaustaat erwirtschaftet Ungarn gewaltige Einkünfte aus dem Metallexport. Dieser Reichtum finanzierte Matthias’ Schwarzes Heer und den Glanz seines Renaissancehofes."
 hun_buda_capital: "Buda und Pest entwickeln"
 hun_buda_capital_desc: "Buda und Pest, einander über die Donau gegenüberliegend, sind das Herz des Königreichs Ungarn. Budas königlicher Palast und großer Markt, Pests kaufmännischer Hafen – wenn diese Zwillingsstadt blüht, gedeiht ganz Ungarn. Der Hof des Matthias war der größte Europas und berühmt als Zentrum der mitteleuropäischen Renaissance."
 hun_upper_hungary_cities: "Die Städte Oberungarns"
 hun_upper_hungary_cities_desc: "Pressburg (Pozsony) wacht über das westliche Tor gegen die Habsburger; Kaschau (Kassa) ist die größte Handelsstadt Oberungarns; Tyrnau (Nagyszombat) ist ein Bischofssitz. Die Entwicklung dieser drei Städte macht Oberungarn (die heutige Slowakei) zum wirtschaftlichen und politischen Angelpunkt des Nordens."
 hun_pannonian_cities: "Die Städte Pannoniens"
 hun_pannonian_cities_desc: "Raab (Győr) wacht über die österreichische Grenze; Ödenburg (Sopron) ist die reiche Handelsstadt Westungarns; Fünfkirchen (Pécs) beherbergt eine der ältesten Universitäten Mitteleuropas, 1367 von Ludwig I. gegründet. Entwickle diese pannonischen Städte, damit Westungarn erblüht."
 hun_great_plain_cities: "Die Städte der Großen Tiefebene"
 hun_great_plain_cities_desc: "Debrecen (Zentrum des ungarischen Calvinismus), Szeged (Schlüssel zur Theiß), Kecskemét (Hirtenstadt der Großen Tiefebene) – entwickle die Hauptstädte der ungarischen Puszta und erschließe das landwirtschaftliche Potenzial dieses gewaltigen Grünlands. Rinder, Schafe und Getreide der Großen Tiefebene werden zu Ungarns Hauptexportgütern."
 hun_transylvania_cities: "Die Städte Siebenbürgens"
 hun_transylvania_cities_desc: "Klausenburg (Kolozsvár) ist das politische und kulturelle Herz Siebenbürgens; Großwardein (Nagyvárad) ist eine große Pilgerstadt mit den Reliquien des Heiligen Ladislaus; Miskolc ist das Industriezentrum Nordostungarns. Gliedere die multiethnische Region Siebenbürgen durch städtische Entwicklung ein."
 hun_kingdom_of_cities: "Das Königreich der Städte"
 hun_kingdom_of_cities_desc: "Kremnitz’ Gold, Honts Silber, Tokajs Wein, Budas Hof, Kaschaus Handel, Fünfkirchens Universität, Debrecens Landwirtschaft, Klausenburgs Kultur – jede Stadt des Königreichs Ungarn wirkt organisch zusammen. Die größte Wirtschaftszone Mitteleuropas ist vollendet. Städtischer Wohlstand ist die wahre Quelle ungarischer Reichsmacht."
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "Königliche Münzstätte Kremnitz"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "Die Münzstätte Kremnitz wurde 1328 von Karl I. von Ungarn in Körmöcbánya errichtet. Der hier geprägte goldene „Forint“ galt als gleichwertig mit dem florentinischen Florin – und er zirkulierte von der Ostsee bis Konstantinopel. Die peinliche Genauigkeit der Münzstätte machte sie zum monetären Rückgrat des mitteleuropäischen Handels."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "Die Kupferbergwerke von Neusohl"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "In den Schächten von Neusohl verstummt der Klang der Hämmer, die Kupfer brechen, nie."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "Die Silberbergwerke von Schemnitz"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "Silber, das aus den Bergwerken von Hont gegraben wird, wird zur königlichen Münze getragen."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "Steinsalzbergwerk"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "Die seit römischer Zeit gegrabenen Steinsalzstollen versorgen noch immer die Tische des Königreichs."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Die Weinberge des Tokajer Aszú"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "Edelfäule-Trauben, gereift in den Weinbergen der Tokajer Hügel, reisen als „Wein der Könige“ zu den Höfen vieler Länder."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Königliche Hauptstadt Buda"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Von den Fenstern des königlichen Palastes zu Buda, hoch über der Donau, sind stets die Segel vorüberziehender Handelsschiffe zu sehen."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Handelshafen Pest"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "An den Kais von Pest hallen die Rufe der Hafenarbeiter von morgens bis abends."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Pozsony – Torstadt"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Die Tore von Pozsony sind zu einem Übergang geworden, an dem Wagen nach Österreich und die Kuriere des Königs Seite an Seite ziehen."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Kassa – Handelszentrum"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "Auf dem Marktplatz von Kassa wetteifern Kaufleute aus Polen und Schlesien um die Waren Oberungarns."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "Universität Fünfkirchen"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "In den Kreuzgängen der Universität zu Fünfkirchen hören Studenten, die das Erbe Ludwigs I. fortführen, lateinischen Vorlesungen zu."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "Festung Raab"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "Auf den Mauern Raabs halten Wachen, die die österreichische Grenze beobachten, die ganze Nacht ihre Fackeln hoch."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Ackerbaustadt Debrecen"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Herden von Rindern und Ladungen von Weizen, aufgezogen auf der Großen Tiefebene, strömen ohne Unterlass in den Markt von Debrecen."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Handelshafen Szeged"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Szeged, am Zusammenfluss von Theiß und Donau, ist als Drehscheibe des Binnenhandels ausgebaut."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Klausenburg – Herz Siebenbürgens"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "Auf den Märkten und in den Schulen Klausenburgs vermischen sich die Stimmen von Deutschen, Ungarn und Rumänen."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Großwardein – Pilgerstadt"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Züge von Pilgern aus dem ganzen Königreich machen sich auf den Weg zum Dom von Großwardein, der Heimstatt der Reliquien des Königs Heiliger Ladislaus."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "Bergbaureich"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "Gold, Silber, Kupfer, Salz – der aus den Bergwerken des Königreichs gezogene Reichtum übertrifft nun den jedes anderen Landes Mitteleuropas."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "Königreich der Städte"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "Von Buda bis Klausenburg tauschen die Märkte der Städte des Königreichs ihre Waren aus und atmen als eine große Wirtschaftssphäre."
 hun_secure_transylvania: "Die Beherrschung Siebenbürgens"
 hun_secure_transylvania_desc: "Siebenbürgen – seit langem ungarisches Kernland – zentriert sich um zwei große Städte: Klausenburg (Cluj) und Kronstadt (Brassó). Ungarn, Sachsen und Walachen (Rumänen) leben in diesem Land zusammen. Mit ausreichenden Mitteln in der Schatzkammer investiere ernsthaft in die Entwicklung Siebenbürgens und erhebe eine seiner zwei großen Städte zum vollen Stadtrang."
 hun_events.20.t: "Die Beherrschung Siebenbürgens"
 hun_events.20.d: "Mit gesichertem Klausenburg und Kronstadt und über 1.000 investierten Dukaten beginnt ein großes Entwicklungsprogramm für Siebenbürgen. Klausenburg (lateinisch: Claudiopolis; rumänisch: Cluj) ist Siebenbürgens größte Stadt; Kronstadt (lateinisch: Corona; deutsch: Kronstadt), von sächsischen Siedlern erbaut, ist das Handelstor zur Walachei. Welche Stadt bei der Entwicklung Vorrang erhält – diese Entscheidung prägt die künftige Richtung Siebenbürgens."
 hun_events.30.t: "Pacta Conventa – Die historische Übereinkunft mit Kroatien"
 hun_events.30.d: "1102 schloss König Koloman von Ungarn die Pacta Conventa mit Vertretern von zwölf kroatischen Adelsfamilien. Kroatische Adlige nahmen den ungarischen König als ihren eigenen Souverän an; im Gegenzug behielt Kroatien seine Autonomie und Rechtstraditionen. Mehr als zwei Jahrhunderte nach dieser historischen Übereinkunft ist die Zeit gekommen, das Verhältnis zwischen Ungarn und Kroatien zu klären. Soll Kroatien förmlich als Lehen eingegliedert werden, um seinen Rechtsstatus zu klären? Oder soll die jetzige flexible Regelung beibehalten werden? Die Wahl liegt beim König von Ungarn."
 hun_events.30.a: "Kroatien förmlich als Lehen eingliedern"
 hun_events.30.b: "Das jetzige Verhältnis beibehalten (+10 Ansehen)"
 hun_events.20.a: "Klausenburg zum Stadtrang erheben (kostet 1.000 Dukaten)"
 hun_events.20.b: "Kronstadt zum Stadtrang erheben (kostet 1.000 Dukaten)"
 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "Die ewige Krone des Heiligen Stephan"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "Am Weihnachtstag des Jahres 1000 sandte Papst Silvester II. dem Herzog der Ungarn, István, eine Krone und machte ihn zu Stephan I. – dem ersten König von Ungarn. Diese Krone – die Heilige Krone des Heiligen Stephan – kam als das Wesen des ungarischen Staates selbst zu gelten: Ein König ohne sie war überhaupt kein König von Ungarn. Nun, Jahrhunderte später, pilgern Diplomaten aus jedem Winkel der Welt an den ungarischen Hof, um seine Vorherrschaft anzuerkennen."
