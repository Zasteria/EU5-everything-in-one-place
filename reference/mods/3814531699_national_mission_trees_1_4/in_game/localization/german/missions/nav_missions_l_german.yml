l_german:
 nav_crown_mission_pack: "Das Erbe des Königreichs Navarra"
 nav_crown_mission_pack_DESCRIPTION:0 "Verwurzelt in den Vorbergen der Pyrenäen, ist das baskische Königreich Navarra eine kleine Macht, eingeengt von den drei großen Reichen Kastilien, Aragón und Frankreich. Doch sein Blut fließt durch die Königshäuser sowohl Frankreichs als auch Aragóns, und sollten sich die Räder der Geschichte fügen, mag sich noch ein unerwarteter Weg zur Größe vor ihm öffnen. Wirst du baskische Einheit schmieden, über die Gascogne hinaus in Frankreich intervenieren, oder die Vorherrschaft über die Iberische Halbinsel ergreifen? Das Schicksal dieses kleinen Königreichs liegt in den Händen seines Königs."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Schließe Missionen als Königreich Navarra ab und begründe baskische Einheit sowie Einfluss auf Iberien und Frankreich."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Erbe des Königreichs Navarra zu beschreiten."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "Schmiede baskische Einheit, dringe in die Gascogne vor und beanspruche die Vorherrschaft über Iberien!"
 nav_kingdom_of_pamplona: "Das Königreich Pamplona"
 nav_kingdom_of_pamplona_desc: "Von Íñigo Arista gegründet, ist das Königreich Pamplona eine uralte Linie, tief in den baskischen Landen verwurzelt. Doch umgeben von den Großmächten Kastilien, Aragón und Frankreich, ruhte sein Überleben stets auf einem zerbrechlichen Gleichgewicht."
 nav_secure_bayonne: "Bayonne sichern"
 nav_secure_bayonne_desc: "Die Zeit ist gekommen, unsere Stammesbrüder jenseits des Meeres, die französischen Basken von Bayonne, unter unserer Krone zu einen. Alle Basken müssen eines Tages unter einem einzigen Banner versammelt sein."
 nav_basque_unity: "Baskische Einheit"
 nav_basque_unity_desc: "Ein Volk, das unsere Sprache und Sitten teilt, bildet nun den Kern des Königreichs. Baskisch zu sein, ist zu unserem größten Stolz geworden."
 nav_fueros_and_privileges: "Die Fueros gewährleisten"
 nav_fueros_and_privileges_desc: "Die Fueros, uralte Privilegien der Selbstverwaltung, seit langem von den baskischen Städten gehalten. Während der Adel zufriedener wird, wird die Gewährleistung dieser Privilegien zu einem festen Fundament der Krone selbst."
 nav_efficient_administration: "Eine effiziente Verwaltung"
 nav_efficient_administration_desc: "Im ganzen Reich errichtete Kontore stärken unser Steuerfundament. Für ein kleines Königreich ist Verwaltungseffizienz eine Lebensader."
 nav_renaissance_of_pamplona: "Die Renaissance Pamplonas"
 nav_renaissance_of_pamplona_desc: "Die neuen Winde der Gelehrsamkeit, die aus Italien aufsteigen, haben selbst die Vorberge der Pyrenäen erreicht. So klein das Königreich auch sein mag, sein Geist schreitet an der Spitze des Zeitalters."
 nav_intervene_hundred_years_war: "Im Hundertjährigen Krieg intervenieren"
 nav_intervene_hundred_years_war_desc: "Der lange Kampf zwischen Frankreich und England tobt weiter. Unsere königliche Blutlinie fließt durch beide Kronen, und Navarra hat sowohl das Recht als auch die Gelegenheit, als dritte Macht zu intervenieren."
 nav_foothold_in_france: "Ein Stützpunkt in Frankreich"
 nav_foothold_in_france_desc: "Nutze das Chaos des Hundertjährigen Krieges, um einen Teil französischen Bodens zu sichern. Dies dehnt die Reichweite des Königreichs weit in das Herz Südwestfrankreichs aus."
 nav_secure_gascony: "Die Gascogne sichern"
 nav_secure_gascony_desc: "Die Beherrschung des Landes Tursan und die Einnahme des Hafens Bordeaux bringt die gesamte Gascogne unter unsere Herrschaft und öffnet das Tor zum Atlantik."
 nav_claims_on_france: "Ein Stützpunkt für die französische Krone"
 nav_claims_on_france_desc: "Da nun weite Gebiete innerhalb Frankreichs selbst gesichert sind, ist der Ehrgeiz, den unser Haus dem französischen Thron gegenüber hegt, nicht länger bloße Einbildung."
 nav_house_of_evreux: "Der Ehrgeiz des Hauses Évreux"
 nav_house_of_evreux_desc: "Ob durch eine Personalunion mit Frankreich oder die schlichte Besetzung von Paris selbst, die Legitimität, die unser Haus dem französischen Thron gegenüber hält, steht nun außer Zweifel."
 nav_claim_french_throne: "Den französischen Thron beanspruchen"
 nav_claim_french_throne_desc: "Da die französische Königslinie nun erloschen ist, steht unser Haus als rechtmäßiger Erbe seiner Krone da. Die Zeit ist gekommen, dass zwei Kronen, Navarra und Frankreich, auf einem einzigen Haupt ruhen."
 nav_aragonese_inheritance: "Blutsbande mit Aragón"
 nav_aragonese_inheritance_desc: "Unser Haus und das Königshaus Aragóns teilen dasselbe angestammte Blut. Die Schicksale der beiden Reiche mögen noch als eines verbunden werden."
 nav_castilian_question: "Die kastilische Frage"
 nav_castilian_question_desc: "Kastilien, die größte Macht der Iberischen Halbinsel. Ob wir uns ihm in Bündnis binden oder ihm als Rivale entgegenstehen, die Natur dieser Beziehung muss klargestellt werden."
 nav_reconquista_legacy: "Das Erbe der Reconquista"
 nav_reconquista_legacy_desc: "Die Erinnerung an Jahrhunderte des Kampfes gegen islamische Mächte ist ein von allen Reichen Iberiens geteilter Stolz. Auch unser Königreich trägt einen Anteil an diesem Ruhm."
 nav_dominate_iberia: "Vorherrschaft über Iberien"
 nav_dominate_iberia_desc: "Was einst ein kleines Königreich war, kann auf der Iberischen Halbinsel nicht mehr übersehen werden. Die baskische Krone ist mächtig genug geworden, um das Schicksal der ganzen Halbinsel zu formen."
 nav_basque_seafarers: "Baskische Fischer"
 nav_basque_seafarers_desc: "Das baskische Volk ist seit langem als furchtlose Fischer bekannt. Ihre Fertigkeit und ihr Mut müssen nun als Vorteil des Staates genutzt werden."
 nav_fearless_fishermen: "Furchtlose Seeleute"
 nav_fearless_fishermen_desc: "Baskische Seeleute fürchten nicht einmal die tobenden nördlichen Meere. Ihre Seemannskunst und ihr Mut sind bereits über den Kontinent hinweg berühmt."
 nav_transatlantic_whalers: "Walfänger über den Atlantik"
 nav_transatlantic_whalers_desc: "Schiffe baskischer Walfänger, ihrer Beute nachjagend, haben endlich das ferne Ufer des Atlantiks erreicht. Der Betrieb in diesen neuen Gewässern verspricht dem Königreich gewaltigen Reichtum."
 nav_basque_in_glory: "Baskisch in Herrlichkeit"
 nav_basque_in_glory_desc: "Ein kleines, in den Vorbergen der Pyrenäen geborenes Königreich hat in Kultur geblüht, den Thron Frankreichs ergriffen und über ein geeintes Iberien als Spanien geherrscht. Der Ruhm der Basken kann von niemandem mehr geleugnet werden."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Militärerfahrung aus Bayonne"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "Die Eingliederung Bayonnes hat unseren Streitkräften Kampferfahrung verschafft."
 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Baskische Einheit"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "Die Basken sind eines der ältesten Völker Europas, unbekannten Ursprungs, mit einer Sprache, die mit keiner indogermanischen Sprache verwandt ist. Die kulturelle Einheit der beiderseits der Pyrenäen lebenden Basken bewahrte ihre eigene Identität sowohl unter französischer als auch spanischer Herrschaft."
 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Fueros gewährleistet"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "Die Fueros (Privilegien und Gewohnheitsrecht) sind ein Rechtssystem, das die überlieferte Autonomie Navarras und des Baskenlandes gewährleistet. Seine eigenen Vollmachten über Besteuerung, Kriegsdienst und Rechtsprechung standen stets in Spannung zur zentralisierenden kastilischen Krone. Diese eigenständige Rechtstradition bildet den Kern der navarresischen Identität."
 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Effiziente Regierung"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "Das Königreich Navarra errichtete die „Cámara de Comptos“, ein Amt der Finanzverwaltung, und übernahm ein Verwaltungssystem französischen Stils. Die Verwaltungsverfeinerung, die aus seinen langen Banden zum französischen Königshaus erwuchs (das navarresische Königshaus heiratete oft in das französische ein), unterschied es von den anderen Königreichen Iberiens."
 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "Der neue Geist Pamplonas"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "Der Geist der Renaissance hat die Fertigkeit neu heranwachsender Künstler erhöht."
 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "Ein Brückenkopf in Frankreich"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "Das Königreich Navarra hielt auch Lande nördlich der Pyrenäen, mit Niederrnavarra (dem heutigen französischen Baskenland) in ihrem Mittelpunkt. Historisch heiratete das navarresische Königshaus häufig in das französische ein, und ein Stützpunkt in Frankreich war das Fundament seiner Diplomatie."
 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "Die Krone der Gascogne"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "Die Sicherung der gesamten Gascogne hat den Glanz der Krone gestärkt."
 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "Das Ansehen des Hauses Évreux"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "Eine feste Beziehung zum französischen Königshaus hat das diplomatische Ansehen unserer Nation erhöht."
 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "Zwillingskronen Navarras und Frankreichs"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Das Tragen der Zwillingskronen Navarras und Frankreichs hat den Glanz des Reiches und die Stabilität seiner Regierung erhöht."
 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "Ein klares Verhältnis zu Kastilien"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "Ein geklärtes Verhältnis zu Kastilien hat das diplomatische Ansehen unserer Nation erhöht."
 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Der Stolz der Reconquista"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "Die Erinnerung an den Kampf gegen islamische Mächte hat die Toleranz gegenüber unserer vorherrschenden Religion erhöht."
 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "Herr Iberiens"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "Dass Navarra, ein kleines Königreich der Iberischen Halbinsel, die Großmächte Kastilien und Aragón übertrifft und zum Herrn der Halbinsel wird, erinnert an den Traum, den Sancho III. der Große (reg. 1000–1035) kurzzeitig verwirklichte. Es ist eine historische Leistung, erreichbar durch die volle Nutzung des geografischen Vorteils, die Pyrenäenpässe zu halten."
 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "Die baskische Fischertradition"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "Das Wachstum der Fischerdörfer liefert dauerhaft jeden Monat 5 Seeleute."
 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "Die Moral der furchtlosen Seeleute"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "„Der baskische Seemann fürchtet keinen Sturm“ war ein Spruch, der in ganz Europa bekannt war. Die Seemannskunst und der Mut, gehärtet in den rauen Gewässern des Golfs von Biskaya („unser Meer“ für die Basken), stellten sie an die Spitze des atlantischen Zeitalters. Viele der Seeleute der Spanischen Armada waren Basken."
 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Seemannskunst der atlantischen Walfänger"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Man nimmt an, dass baskische Walfänger seit dem 15. Jahrhundert vor der Küste Labradors in Nordamerika Glattwale jagten. Die Überreste einer baskischen Walfangstation sind in Red Bay in Kanada erhalten und als UNESCO-Weltkulturerbe gelistet. Diese bahnbrechende transatlantische Tätigkeit legte den Grundstein für das koloniale Zeitalter."
 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Entschlossenheit einer unabhängigen dritten Kraft"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "Die Entschlossenheit, sich keiner Großmacht anzuschließen, hat die Moral des Heeres erhöht."
 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Baskisch in Herrlichkeit"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Nachdem sie Kultur, Diplomatie und Regierung gleichermaßen gemeistert hat, strahlt die baskische Krone nun einen Glanz aus, der weit über den eines kleinen Königreichs hinausgeht. Auch militärische Disziplin und die Kraft schwerer Schiffe sind dauerhaft gestärkt."
 nav_events.1.t: "Die Ursprünge des Königreichs Pamplona"
 nav_events.1.d: "Das Königreich Navarra ist der Erbe des Königreichs Pamplona, im 9. Jahrhundert von Íñigo Arista gegründet. Um das Baskenland zentriert, wurde diese Linie als Mark des Karolingischen Reiches geboren und hat weiter ihren eigenen Kurs zwischen den zwei Großmächten der islamischen Reiche und des Frankenreichs gesteuert. Nun ist die Zeit gekommen, ihr Banner noch einmal in den Vorbergen der Pyrenäen zu erheben."
 nav_events.1.a: "Die Geschichte des Königreichs wird zu Herzen genommen"
 nav_events.2.t: "Ehrgeiz nach dem französischen Thron"
 nav_events.2.d: "Unser Haus, das Haus Évreux, teilt Blut mit dem Königshaus Frankreichs selbst. Da nun weite Gebiete innerhalb Frankreichs gesichert sind, mag der König von Navarra offen seinen Anspruch auf dessen Nachfolge geltend machen. Diese Legitimität muss nun bewiesen werden, am Hof wie auf dem Schlachtfeld."
 nav_events.2.a: "Die Sache des Anspruchs wird erhoben"
 nav_events.3.t: "Blutsbande mit Aragón"
 nav_events.3.d: "Die Königshäuser Navarras und Aragóns teilen dasselbe angestammte Blut. Es ist keineswegs selten, dass die Erben beider Throne ein und dieselbe Person sind. Sollte eine der Linien erlöschen, mögen die beiden Reiche noch dazu bestimmt sein, sich unter einer einzigen Krone zu vereinen."
 nav_events.3.a: "Die Bedeutung dieser Verwandtschaft wird verstanden"
 nav_events.4.t: "Intervention im Hundertjährigen Krieg"
 nav_events.4.d: "Der Hundertjährige Krieg zwischen Frankreich und England ist längst kein einfacher Konflikt zweier Nationen mehr. Unser Haus, das Haus Évreux, stammt von der französischen kapetingischen Linie ab und hält zugleich tiefe Ehebande zum englischen Hof. Zudem hat die navarresische Krone selbst lange als wichtiger Präzedenzfall in den Debatten über die französischen Nachfolgegesetze gedient.\n\nIn diesem Zeitalter der Unruhe liegen Navarra drei Wege offen. Der eine ist, Frankreich zu unterstützen, aus Gründen der Blutsbande und langjähriger Freundschaft. Der andere ist, England zu unterstützen, um der Handelsinteressen willen und als Bollwerk gegen Kastilien. Und der letzte ist, sich keiner Großmacht anzuschließen und als unabhängige dritte Kraft die eigenen Interessen zu verfolgen. Diese Wahl wird schwer auf dem Schicksal des Königreichs lasten."
 nav_events.4.a: "Frankreich unterstützen"
 nav_events.4.b: "England unterstützen"
 nav_events.4.c: "Als unabhängige dritte Kraft in den Krieg eintreten"
