l_german:
 bul_bulgaria_mission_pack: "Das Neue Byzanz – Erbe des Zweiten Reiches und Hegemonie auf dem Balkan"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "Als Erbe des Zweiten Bulgarischen Reiches begründe Unabhängigkeit, beanspruche die Hegemonie über den Balkan, schlage die osmanische Bedrohung zurück und erhebe ein neues Byzanz in Konstantinopel."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "Begründe Unabhängigkeit, belebe das Balkanreich wieder, schlage die Osmanen zurück und gründe das Neue Byzanz."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "Von der uralten Stadt Tarnovo zu einem neuen Reich, das über dem Balkan erstrahlt."
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "„Herr von Zargrad“ – erbe den Ruhm des Zweiten Reiches und gründe das Dritte Bulgarische Reich!"
 bul_second_bulgarian_legacy: "Ein zerbrechendes Reich"
 bul_second_bulgarian_legacy_desc: "Das ruhmreiche Reich, von Iwan Assen I. und Iwan Assen II. erbaut, zersplittert nun unter adligem Ehrgeiz in Tarnovo, Widin und Dobrudscha – halte diesen Niedergang auf."
 bul_assert_independence: "Die Autorität von Zargrad"
 bul_assert_independence_desc: "Ein Reich am Rand der Spaltung – begründe als Zar von Tarnovo eine Autorität, die sich keiner rivalisierenden Macht beugt."
 bul_tarnovo_capital: "Tarnovo entwickeln"
 bul_tarnovo_capital_desc: "Tarnovo, einst „das Zweite Zargrad“ genannt – belebe den Ruhm der ehemaligen Kaiserhauptstadt in diesem Land noch einmal."
 bul_bulgarian_patriarchate: "Das bulgarische Patriarchat"
 bul_bulgarian_patriarchate_desc: "Eine von Konstantinopel unabhängige autokephale Kirche – mache die Autorität der bulgarisch-orthodoxen Kirche unerschütterlich."
 bul_boyar_council: "Der Bojarenrat"
 bul_boyar_council_desc: "Die Bojaren, Adlige, die Bulgarien lange gestützt haben – nutze ihren Rat als Säule der Regierung."
 bul_reunite_bulgaria: "Bulgarien wiedervereinen"
 bul_reunite_bulgaria_desc: "Bulgarien und Silistra – vereine diese historischen Kernlande wieder unter einem Banner."
 bul_bulgarian_independence: "Die Wiedervereinigung des Reiches"
 bul_bulgarian_independence_desc: "Das Reich ist in Widin und Dobrudscha zersplittert – bringe diese Lande wieder unter eine Krone und vereine das um Tarnovo zentrierte Reich wieder."
 bul_sofia: "Die Stadt der Heiligen Weisheit"
 bul_sofia_desc: "Serdika, Sredez, Triaditza – diese Stadt hat durch die Zeitalter viele Namen getragen. Benenne sie mit einem Titel, der einem neuen Zeitalter entspricht."
 bul_conquer_macedonia: "Makedonien erobern"
 bul_conquer_macedonia_desc: "Makedonien, seit der Antike lange ein Zentrum bulgarischer Kultur – gewinne dieses Land zurück in unser Herrschaftsgebiet."
 bul_conquer_serbia: "Serbien erobern"
 bul_conquer_serbia_desc: "Die benachbarten Lande Serbiens – unterwirf diesen Rivalen im Wettstreit um die Vorherrschaft auf dem Balkan."
 bul_bulgarian_empire: "Bulgarisches Reich"
 bul_bulgarian_empire_desc: "Bulgarien beherrschte einst ein großes Reich, das sich über weite Teile des Balkans erstreckte. Wir werden diese Lande in unser Herrschaftsgebiet zurückbringen!"
 bul_conquer_wallachia: "Die Walachei erobern"
 bul_conquer_wallachia_desc: "Die Walachei, am Nordufer der Donau – begründe unseren Einfluss über dieses Land."
 bul_conquer_moldavia: "Die Moldau erobern"
 bul_conquer_moldavia_desc: "Die Moldau, östlich der Karpaten – bringe dieses reiche Land in unser Herrschaftsgebiet."
 bul_conquer_transylvania: "Siebenbürgen erobern"
 bul_conquer_transylvania_desc: "Siebenbürgen, von Bergen umgeben – mache diese Region zu einem Teil unseres Reiches."
 bul_conquer_thrace_greece: "Thrakien und Nordgriechenland erobern"
 bul_conquer_thrace_greece_desc: "Das Land der antiken Thraker und Nordgriechenland – gliedere diese Region in unser Reich ein."
 bul_extend_the_empire: "Das Reich ausdehnen"
 bul_extend_the_empire_desc: "Die Grenzen des Reiches müssen noch weiter vorgeschoben werden. Lasst uns unseren Feldzug nach Griechenland und in die Karpaten fortsetzen."
 bul_chitalishte_movement: "Die Tschitalischte-Bewegung"
 bul_chitalishte_movement_desc: "Die „Lesestuben“, bekannt als Tschitalischte – gemeinschaftliche Kulturzentren – lass diese im ganzen Land Wurzeln schlagen und Bildung und nationales Bewusstsein unter den Städtern fördern. Hier beginnt die bulgarische Nationale Wiedergeburt."
 bul_chitalishte_unlock_tt: "Das Stadtprivileg „Stadt der Tschitalischte“ wird verfügbar."
 bul_ottoman_wars: "Die Osmanenkriege"
 bul_ottoman_wars_desc: "Das aufsteigende Osmanische Reich – stelle dich dem Kampf gegen diese neue Bedrohung."
 bul_varna_crusade: "Der Kreuzzug von Warna"
 bul_varna_crusade_desc: "Erhebe dich an der Seite Ungarns und führe einen Kreuzzug gegen die Osmanen an. 1444 wendet sich die Geschichte bei Warna."
 bul_end_ottoman_threat: "Der osmanischen Bedrohung ein Ende setzen"
 bul_end_ottoman_threat_desc: "Die einst gefürchtete osmanische Bedrohung – setze ihr ein Ende und sichere unsere Stellung auf dem Balkan."
 bul_constantinople_ambition: "Ehrgeiz nach Konstantinopel"
 bul_constantinople_ambition_desc: "Die Stadt, die einst das Zentrum der orthodoxen Welt war – hege Ehrgeiz nach dieser Stadt."
 bul_new_byzantium: "Der Besitz Konstantinopels und Roms"
 bul_new_byzantium_desc: "Konstantinopel, Zentrum der orthodoxen Welt, und Rom, Sitz der Westkirche – nimm beide Städte zugleich ein und lass Bulgarien als neues Reich aufsteigen, das über beide Hälften der Christenheit gebietet."
 bul_black_sea_trade: "Schwarzmeerhandel"
 bul_black_sea_trade_desc: "Warna, die Hafenstadt am Schwarzen Meer – entwickle sie als Stützpunkt für den Schwarzmeerhandel."
 bul_black_sea_dominion: "Herrschaft über das Schwarze Meer"
 bul_black_sea_dominion_desc: "Die weite Küste des Schwarzen Meeres – begründe Vorherrschaft im Handel über diese Gewässer."
 bul_third_bulgarian_empire: "Das Dritte Bulgarische Reich"
 bul_third_bulgarian_empire_desc: "Unabhängigkeit, die Einigung des Balkans, die Niederlage der Osmanen und die Gründung des Neuen Byzanz – hier ist das Dritte Bulgarische Reich vollendet."
 bul_events.1.t: "Die Verkündung der Reichseinigung"
 bul_events.1.d: "Tarnovo, Widin und Dobrudscha, einst zersplittert, sind noch einmal als ein einziges Reich geeint. Das Zweite Bulgarische Reich findet neue Kraft."
 bul_events.1.a: "Ruhm sei Bulgarien!"
 bul_events.4.t: "Die Geschichte Sofias"
 bul_events.4.d: "Diese uralte Stadt, von den Römern Serdika genannt und später von den Slawen Sredez, wird nun einen neuen Namen zu Ehren der Kirche der Heiligen Weisheit (Sophia) tragen. Thraker, Römer, Byzantiner und Bulgaren – möge das Gewicht der vielen Zivilisationen, die durch dieses Becken zogen, dem Andenken eingeprägt bleiben."
 bul_events.4.a: "Sie Sofia nennen"
 bul_events.4.b: "Sie Sofia nennen und zur neuen Kaiserhauptstadt machen"
 bul_events.2.t: "Die Verkündung des Bulgarischen Reiches"
 bul_events.2.d: "Als Herrscher über Makedonien und Serbien erklärt sich Bulgarien hier zum Reich."
 bul_events.2.a: "Es lebe der Kaiser!"
 bul_events.3.t: "Der Traum eines Neuen Byzanz"
 bul_events.3.d: "Innerhalb der Mauern Konstantinopels und auf den Hügeln des ewigen Roms gleichermaßen weht nun das Banner Bulgariens. Als neues Zentrum der orthodoxen Welt und Sitz der Westkirche sind diese beiden Städte hier als Zwillingssäulen eines neuen Reiches wiedergeboren."
 bul_events.3.a: "Gott ist mit uns!"
 bul_events.99.t: "Die Verkündung des Dritten Bulgarischen Reiches"
 bul_events.99.d: "Der lange Weg, der in der uralten Stadt Tarnovo begann, durch die Einigung des Balkans, die Niederlage der Osmanen und die Gründung des Neuen Byzanz, hat hier seine wahre Vollendung erreicht."
 bul_events.99.a: "Es lebe das Dritte Bulgarische Reich!"
 bul_hagia_sophia_sofia: "Kirche der Heiligen Sophia"
 bul_hagia_sophia_sofia_desc: "Eine im 6. Jahrhundert unter der Herrschaft Kaiser Justinians errichtete Basilika – ihr Name, „Heilige Weisheit“ bedeutend, sollte mit der Zeit der Stadt, die um sie herum wuchs, ihren Namen leihen. Nachdem sie unzählige Zeitalter überdauert hat, bezeugt diese Kirche still ihre Geschichte als Seele einer neuen Hauptstadt im Herzen Bulgariens."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "Das Erbe des Zweiten Bulgarischen Reiches"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Selbst inmitten des Sturms innerer Kämpfe halten die Maschinerie des Rechts und das Handwerk der Schreiber am Hof kaum zusammen."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Unabhängigkeit begründet"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Niemand wagt es mehr, die Autorität dessen infrage zu stellen, der auf dem Thron von Tarnovo sitzt."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Weliko Tarnovo"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Die auf dem Hügel von Tsarewez errichteten Paläste und Kirchen gewinnen die Pracht einer Kaiserhauptstadt zurück."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "Das bulgarische Patriarchat"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "Der Segen des Patriarchen bringt den Herzen der Gläubigen Frieden, wo auch immer sie wohnen."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "Der Bojarenrat"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Die Bojaren haben ihren Treueeid gegenüber dem Thron erneuert."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Bulgarien wiedervereint"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Über einst auseinandergerissene Lande weht nun noch einmal ein einziges Banner."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Makedonien erobert"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "Die Berge, die einst Samuils Ruhm bezeugten, sind in das Herrschaftsgebiet des Zaren zurückgekehrt."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "Das Reich ausgedehnt"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Unsere sich ausdehnenden Grenzen machen unsere Stärke jedem benachbarten Reich bekannt."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "Die Osmanenkriege"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Unzählige Zusammenstöße mit der türkischen Bedrohung haben unsere Soldaten gehärtet."
 STATIC_MODIFIER_NAME_bul_varna_mod: "Der Kreuzzug von Warna"
 STATIC_MODIFIER_DESC_bul_varna_mod: "Die Erinnerung an die, die auf den Hügeln Warnas fielen, wird bis heute erzählt."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Die osmanische Bedrohung beendet"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Ein Seufzer der Erleichterung geht über den Balkan, während eine lange gefürchtete Bedrohung weicht."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Ehrgeiz nach Konstantinopel"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "Der Schatten unserer Kriegsschiffe fällt nun über den Seeweg, der das Schwarze Meer mit dem Mittelmeer verbindet."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Schwarzmeerhandel"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Fremde Handelsschiffe kommen und gehen unaufhörlich aus dem Hafen Warnas."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Herrschaft über das Schwarze Meer"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Bulgarische Handelsschiffe befahren nun die Wellen des Schwarzen Meeres, als wäre es ihr eigenes."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "Das Dritte Bulgarische Reich"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "Das Licht, das einst von Tarnovo schien, erleuchtet nun den ganzen Balkan."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Bulgarische Unabhängigkeit verkündet"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "Die zersplitterten Lande sind noch einmal eins, und jede Nation muss mit dieser Wiedererweckung rechnen."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "Das Neue Byzanz"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "Neue Stimmen des Gebets hallen nun durch die Kirchen Konstantinopels."
