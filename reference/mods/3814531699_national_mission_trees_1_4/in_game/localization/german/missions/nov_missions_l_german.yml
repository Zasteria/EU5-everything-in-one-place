 nov_events.1.t: "Weliki Nowgorod – die Große Republik"
 nov_events.1.d: "Im Jahr 1337 ist die Republik Weliki Nowgorod (Groß-Nowgorod) Russlands größter Handelsstadtstaat.\n\nDiese Stadt, die sich über beide Ufer des Wolchow erstreckt, teilt sich in die „Sophienseite“ am Westufer und die „Handelsseite“ am Ostufer. In ihrem Mittelpunkt erhebt sich Nowgorods Wahrzeichen, die Sophienkathedrale.\n\nDas Wetsche (die Volksversammlung) wirkt als oberstes Entscheidungsorgan, während Possadnik (Bürgermeister), Tyssjazki (Anführer des Milizaufgebots) und Erzbischof die Verwaltung übernehmen.\n\n„Nowgorod gehört Nowgorod allein“ – nicht ein Fürst oder Kaiser, sondern der Wille der Bürger lenkt diese Republik.\n\nDas Kontor der Hanse ist hier errichtet, und der Handel blüht mit Lübeck, Brügge, London und Bergen. Pelze, Bienenwachs, Flachs und Fisch werden über Nowgorod nach Westeuropa geliefert.\n\nDoch Moskau erstarkt stetig, Litauen drängt aus dem Westen, und die Tataren lauern im Osten. Nowgorod hat überlebt, indem es dieses vielschichtige Kräftegleichgewicht nutzte. Nutze nun diese Weisheit und kaufmännische Stärke, um die Herrschaft über die Rus anzustreben."
 nov_events.1.a: "Verteidige Nowgorods Freiheit und Wohlstand!"
