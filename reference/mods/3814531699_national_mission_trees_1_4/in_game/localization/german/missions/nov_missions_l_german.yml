l_german:
 nov_novgorod_mission_pack: "Der Ruhm Nowgorods – von der Kaufmannsrepublik zum Herrscher der Rus"
 nov_novgorod_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist die Republik Weliki Nowgorod Russlands größter Handelsstaat. Das Wetsche (die Volksversammlung) treibt die Politik voran, und der Handel mit der Hanse bringt Reichtum. Doch Moskau erstarkt stetig, und die Tatarengefahr droht aus dem Osten. Pelzhandel, Vorherrschaft in der Ostsee, Niederlage Moskaus – herrsche als Großfürst aller Rus."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "Errichte ein Handelsreich, besiege Moskau, um Russland zu einen, beherrsche Ostsee und Sibirien und herrsche als Großfürst der Rus."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um Großfürst der Rus zu werden."
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "Von Nowgorods Kaufmannsrepublik zum Fundament des Russischen Reiches!"
 nov_veche_republic: "Die Wetsche-Republik"
 nov_veche_republic_desc: "Das Wetsche Nowgorods ist eine einzigartige demokratische Einrichtung, an der Bürger, Adlige und Kaufleute gleichermaßen teilhaben. „Nowgorod gehört Nowgorod allein“ – es ist der Wille der Bürger, nicht eines Fürsten, der diesen Staat lenkt und ihn von allen anderen russischen Fürstentümern unterscheidet. Stärke die Tradition des Wetsche und festige das Fundament der Kaufmannsrepublik."
 nov_dev_novgorod: "Groß-Nowgorod entwickeln"
 nov_dev_novgorod_desc: "„Weliki Nowgorod (Groß-Nowgorod)“ am Wolchow ist die größte Handelsstadt des mittelalterlichen Russlands. Hanseatische, byzantinische und östliche muslimische Kaufleute strömen hier zusammen und handeln mit Pelzen, Bienenwachs, Flachs und Fisch. Das nowgoroder „Kontor“ (der Handelsposten) unterhält Niederlassungen in Lübeck, Brügge, London und Bergen."
 nov_birch_bark: "Birkenrindenschriften"
 nov_birch_bark_desc: "Die Nowgoroder hatten die Gewohnheit, auf Birkenrinde zu schreiben – Zeugnis der schriftkundigsten mittelalterlichen Stadt der Welt. Nutze diese Tradition der Schriftkunde, um Gelehrsamkeit, Verwaltung und Handelsaufzeichnungen zu entwickeln."
 nov_hanseatic_league: "Hansehandel"
 nov_hanseatic_league_desc: "Nowgorod ist als eine von Nordeuropas größten Handelsstädten tief in das Netz der Hanse eingebunden. Stärke die Handelswege, die nach Lübeck, Hamburg und Brügge führen."
 nov_fur_trade: "Der Pelzhandel"
 nov_fur_trade_desc: "Nowgorods größte Handelsware ist Pelz – Eichhörnchen-, Zobel-, Biber- und Nerzfelle, aus den sibirischen Wäldern gewonnen, werden an den westeuropäischen Adel verkauft. Der Pelzhandel, das „Gold des Nordens“ genannt, ist Nowgorods Quelle des Reichtums."
 nov_dev_pskov: "Pskow entwickeln"
 nov_dev_pskov_desc: "Das trotzig unabhängige Pskow – Nowgorods „jüngere Bruderstadt“ wird zur kaufmännischen und kulturellen Nebenhauptstadt. Entwickle diese Stadt mit den Mauern des Pskower Kremls und der Dreifaltigkeitskathedrale."
 nov_trade_empire: "Handelsreich"
 nov_trade_empire_desc: "Pelze, Bienenwachs, Salz, Fisch – Nowgorods Handelsnetz umspannt Nordeuropa. Kaufmannsgilden führen den Staat, und überall entstehen Handelsposten. Der Ruhm des „Venedigs des Nordens“ verbreitet sich weltweit."
 nov_dev_staraya_russa: "Staraja Russa entwickeln"
 nov_dev_staraya_russa_desc: "Staraja Russa, das den Namen „Altes Russland“ trägt, ist für seine Salzgewinnung berühmt. Entwickle die Salzindustrie dieser uralten Stadt, um Nowgorods Nahrungserhalt und Handel zu fördern."
 nov_secure_novgorod_region: "Die Region Nowgorod sichern"
 nov_secure_novgorod_region_desc: "Nowgorods Heimatgebiet – die vollständige Beherrschung sowohl des West- als auch des Ostnowgoroder Gebiets begründet das Fundament für die Ausdehnung."
 nov_conquer_tver: "Twer erobern"
 nov_conquer_tver_desc: "Das Fürstentum Twer, einst Moskaus Rivale um die Vorherrschaft – seine Kraft ist nun geschwunden. Erobere diese wichtige Stadt an der oberen Wolga und öffne den Weg nach Süden."
 nov_conquer_yaroslavl: "Jaroslawl erobern"
 nov_conquer_yaroslavl_desc: "Jaroslawl, eine Stadt des „Goldenen Rings“ an der Wolga – erobere diese Handelsstadt und ergreife den nördlichen Handelsweg."
 nov_conquer_moscow: "Moskau erobern"
 nov_conquer_moscow_desc: "Seit Iwan I. (Kalita) hat sich Moskau mit tatarischer Unterstützung stetig ausgedehnt. „Moskau oder Krieg“ – besiege Nowgorods größte Bedrohung und ergreife die Führung Russlands."
 nov_conquer_suzdal: "Susdal und Wladimir erobern"
 nov_conquer_suzdal_desc: "Susdal und Wladimir – uralte Städte, die einst als Nachfolger der Kiewer Rus blühten. Erobere diese Städte mit ihren vielen goldkuppligen Kirchen und erbe die Legitimität der alten Rus."
 nov_defeat_muscovy: "Moskau vernichten"
 nov_defeat_muscovy_desc: "Das Großfürstentum Moskau wird zerstört, und die Führung Russlands geht an Nowgorod über. Die Ambitionen der Rurikiden-Dynastie sind zerschlagen – die Wetsche-Republik wird über Russlands Zukunft entscheiden."
 nov_conquer_smolensk: "Smolensk erobern"
 nov_conquer_smolensk_desc: "Smolensk, „der Schlüssel Russlands“ genannt – die Beherrschung dieses Ost-West-Verkehrsknotens begründet westlichen Einfluss."
 nov_conquer_ryazan: "Rjasan erobern"
 nov_conquer_ryazan_desc: "Das Fürstentum Rjasan, 1237 als erstes vom mongolischen Heer verwüstet – erobere seine südlichen Steppengebiete und errichte eine Verteidigungslinie gegen die Tataren."
 nov_form_russia: "Die Rus bilden"
 nov_form_russia_desc: "Ein geeinter Staat der Rus um Nowgorod nimmt Gestalt an – nicht Moskau, sondern Nowgorod einte Russland. Welche Form wird dieses neue Russland annehmen, geboren aus diesem historischen Wendepunkt?"
 nov_vologda_trade: "Handel in Wologda"
 nov_vologda_trade_desc: "Die Beherrschung Wologdas und Beloosero – Schlüsselpunkte des nördlichen Handelswegs – begründet den Zugang zum Weißen Meer und den Pelzhandelsweg."
 nov_found_arkhangelsk: "Archangelsk gründen"
 nov_found_arkhangelsk_desc: "Errichte die Hafenstadt Archangelsk an der Küste des Weißen Meeres – obwohl sie im Winter zufriert, ermöglicht dieser Hafen unmittelbaren Handel mit Nordeuropa und Britannien. In künftigen Zeitaltern werden englische Kaufleute hier nach Russland gelangen."
 nov_white_sea_trade: "Beherrschung des Weißmeerhandels"
 nov_white_sea_trade_desc: "Beherrsche den Handelsweg des Weißen Meeres und begründe unmittelbaren Handel mit Nordeuropa. Archangelsk entwickelt sich zum Zentrum des nördlichen Handels."
 nov_conquer_perm: "Perm erobern"
 nov_conquer_perm_desc: "Die Region Perm am oberen Kama – Erzeugerin der „Kama-Pelze“, der feinsten Felle. Die Eroberung dieses Ortes begründet das Pelzhandelsmonopol."
 nov_kola_fortress: "Die Festung Kola"
 nov_kola_fortress_desc: "Die nördlichste Spitze der Kola-Halbinsel – nimm den eisfreien Hafen der Murmansker Bucht ein und begründe einen Stützpunkt für die nördliche Seeroute."
 nov_siberian_frontier: "Die sibirische Grenze"
 nov_siberian_frontier_desc: "Überquere das Uralgebirge nach Sibirien – der Weg „jenseits des Landes“ mit unbegrenzten Pelzvorkommen ist offen. Dringe vor Jermaks Eroberung nach Sibirien vor."
 nov_fur_monopoly: "Pelzhandelsmonopol"
 nov_fur_monopoly_desc: "Von Perm bis Sibirien – alle Pelzhandelswege fallen unter Nowgorods Kontrolle. Monopolisiere die Lieferung der Luxuspelze, die von europäischen Königen und Adligen begehrt werden, um gewaltigen Reichtum zu gewinnen."
 nov_secure_karelia: "Karelien sichern"
 nov_secure_karelia_desc: "Nimm die Region Karelien am Nordufer des Finnischen Meerbusens ein, um den Zugang zur Ostsee zu sichern – ein wichtiger strategischer Punkt, der die Grenze zu Schweden begründet."
 nov_conquer_viborg: "Wyborg erobern"
 nov_conquer_viborg_desc: "Die von Schweden erbaute Festung Wyborg – die Erstürmung dieses Schlüsselpunkts im Finnischen Meerbusen öffnet die Tür zur Ostsee."
 nov_baltic_fleet: "Ostseeflotte"
 nov_baltic_fleet_desc: "Baue Nowgorods Ostseeflotte auf – Seemacht ist unentbehrlich, um den nordeuropäischen Handel zu beherrschen."
 nov_conquer_riga: "Riga erobern"
 nov_conquer_riga_desc: "Riga an der Mündung der Düna – die Eroberung dieser wichtigen Hansestadt ergreift die Führung im Ostseehandel. Mit dem Geist von „Danzig oder Krieg“ nimm auch Riga."
 nov_livonia: "Livland unterwerfen"
 nov_livonia_desc: "Die vom Livländischen Orden beherrschte östliche Ostseeküste – die Unterwerfung dieser Region begründet den Zugang zu den baltischen Landen."
 nov_neva_ports: "Die Häfen an der Newa"
 nov_neva_ports_desc: "Entwickle die Hafenstadt an der Newa – dieser Ort, an dem Peter der Große später „Petersburg“ erbauen wird, wird zum Tor zur Ostsee."
 nov_orthodox_archbishop: "Orthodoxes Erzbistum"
 nov_orthodox_archbishop_desc: "Nowgorods Erzbischof hält Autorität unabhängig von Moskau und Konstantinopel – religiöse Autonomie stützt Nowgorods Eigenständigkeit. Stärke die orthodoxe Tradition Nowgorods mit ihrer Sophienkathedrale."
 nov_cathedral_cities: "Städte der Kathedralen"
 nov_cathedral_cities_desc: "Errichte Kathedralen in allen Städten Nowgorods – verwirkliche das Ideal des „Heiligen Russlands“ und bedecke das ganze Land mit dem Glanz orthodoxen Glaubens."
 nov_guardian_of_orthodoxy: "Hüter der Orthodoxie"
 nov_guardian_of_orthodoxy_desc: "Mit dem Fall Konstantinopels an die Osmanen fällt die Sendung des orthodoxen Hüters an Nowgorod. Ergreife den Titel des „Dritten Roms“ – nicht Moskau, sondern Nowgorod soll ihn halten."
 nov_novgorod_chronicle: "Die Nowgoroder Chronik"
 nov_novgorod_chronicle_desc: "Die Nowgoroder Chronik (Nowgorodskaja Letopis) – dieses geschichtliche Werk, das die Ereignisse jedes Jahres sorgfältig verzeichnet, trägt Nowgorods geistiges Erbe an künftige Generationen weiter."
 nov_dev_torzhok: "Torschok entwickeln"
 nov_dev_torzhok_desc: "Torschok, gelegen zwischen Nowgorod und Moskau – entwickle es zu einer Handelsdrehscheibe und beherrsche den südlichen Handelsweg."
 nov_kazan_subjugation: "Kasan unterwerfen"
 nov_kazan_subjugation_desc: "Das Khanat Kasan – die Unterwerfung dieses tatarischen Nachfolgestaates, der die mittlere Wolga beherrscht, öffnet den Weg nach Osten."
 nov_ushkuiniks: "Die Uschkuiniki"
 nov_ushkuiniks_desc: "Uschkuiniki – Nowgorods gemischte Gruppe aus Flusspiraten, Entdeckern und Soldaten. Gliedere diese rauen Gesellen, die die Wolga hinabfahren und tatarische Handelsschiffe überfallen, in Nowgorods reguläres Heer ein und bilde sie zu Elitetruppen aus."
 nov_dev_suzdal: "Susdal entwickeln"
 nov_dev_suzdal_desc: "Susdal aus dem „Goldenen Ring“ – entwickle diese uralte Stadt mit ihren vielen mittelalterlichen Kirchen und Klöstern zu einem kulturellen und religiösen Zentrum."
 nov_conquer_beloozero: "Beloosero erobern"
 nov_conquer_beloozero_desc: "Die Region Beloosero am „Weißen See“ – reich an Pelzen und Fisch, nimm dieses Gebiet ein und sichere den nördlichen Handelsweg."
 nov_dev_kholmogory: "Cholmogory entwickeln"
 nov_dev_kholmogory_desc: "Cholmogory an der Dwina – entwickle diese Hafenstadt als Tor zum Weißen Meer und lege das Fundament für Archangelsks künftigen Wohlstand."
 nov_conquer_vladimir: "Wladimir erobern"
 nov_conquer_vladimir_desc: "Einst Hauptstadt des Großfürstentums Wladimir – diese uralte Stadt mit vielen religiösen Bauten, darunter die Dmitrijkathedrale, fällt an Nowgorod."
 nov_tatar_wars: "Kriege gegen die Tataren"
 nov_tatar_wars_desc: "Nowgorod war die einzige große Stadt der Rus, die sich dem Tatarenjoch nicht unterwarf – führe nun diesen Stolz als Waffe im Kampf gegen die Tataren. Mit dem Geist des Newa-Ufers besiege die Steppenreiter."
 nov_golden_horde: "Gegenschlag gegen die Goldene Horde"
 nov_golden_horde_desc: "Erhebe Nowgorods Banner im Gebiet der Goldenen Horde (Kiptschak-Khanat) – wer Russland von der mongolischen Herrschaft befreit, ist der wahre Herr der Rus."
 nov_nizhny_novgorod: "Nischni Nowgorod erobern"
 nov_nizhny_novgorod_desc: "„Unter-Nowgorod“, Nischni Nowgorod – unterwirf diese Handelsstadt am Zusammenfluss von Wolga und Oka und ergreife den Handel der mittleren Wolga."
 nov_orthodox_mission: "Orthodoxe Mission"
 nov_orthodox_mission_desc: "Verbreite den orthodoxen Glauben unter den Heiden des Nordens und Ostens – Missionstätigkeit unter finnischen Völkern, sibirischen Ureinwohnern und Tataren mehrt Nowgorods Legitimität."
 nov_hanseatic_kontors: "Hansekontore"
 nov_hanseatic_kontors_desc: "Errichte nowgoroder Handelsposten (Kontore) in den wichtigsten Hansestädten – Nowgorod, Riga, Lübeck – und beherrsche das nordeuropäische Handelsnetz unmittelbar."
 nov_ostrog_system: "Das Ostrog-System"
 nov_ostrog_system_desc: "Baue ein Netz von Festungen (Ostrogs) auf, die den Vorstoß nach Sibirien stützen – Vorposten für die Eroberung Sibiriens, die nach Tjumen, Tobolsk und Irkutsk führen."
 nov_dev_ryazan: "Rjasan entwickeln"
 nov_dev_ryazan_desc: "Rjasan, von den Mongolen vernichtet – eine neue Stadt Rjasan wurde auf ihren Ruinen erbaut. Entwickle diese wichtige südliche Stadt als Vorposten zur Steppe."
 nov_estonian_coast: "Die estnische Küste"
 nov_estonian_coast_desc: "Die Unterwerfung der estnischen Küste vollendet die Kontrolle über die südliche Ostseeküste. Nimm die hanseatische Handelsstadt Reval (Tallinn) ein."
 nov_conquer_teutonic: "Den Deutschen Orden besiegen"
 nov_conquer_teutonic_desc: "Das Erbe der Ostseekreuzzüge endet – die Niederlage des Deutschen Ordens bringt die südöstliche Ostseeküste vollständig unter Nowgorods Kontrolle."
 nov_moscow_capital: "Moskau entwickeln"
 nov_moscow_capital_desc: "Entwickle das eroberte Moskau als bedeutende Stadt unter nowgorodischer Herrschaft – wandle den ehemaligen Palast des Moskauer Großfürsten in den Statthaltersitz Nowgorods, das Sinnbild der Herrschaft."
 nov_iron_ring: "Der Eiserne Ring"
 nov_iron_ring_desc: "Der Festungsring, der Nowgorod schützt – das Verteidigungsnetz, das Pskow, Nowgorod, Ladoga und Twer verbindet, ist vollendet. Ein eisernes Verteidigungssystem, das Einfälle aus jeder Richtung zurückschlagen kann."
 nov_kholmogory_trade: "Handel in Cholmogory"
 nov_kholmogory_trade_desc: "Von der Handelsdrehscheibe Cholmogory an der Dwina zum Weißen Meer – ergreife diesen nördlichen Handelsweg vor der englischen Muscovy Company."
 nov_eastern_orthodoxy: "Die Ostkirche begründet"
 nov_eastern_orthodoxy_desc: "Nach dem Fall Konstantinopels tritt Nowgorod als Zentrum der Ostkirche hervor. Die Sophienkathedrale erstrahlt als Nachfolgerin der Hagia Sophia in Konstantinopel."
 nov_amber_road: "Die Bernsteinstraße"
 nov_amber_road_desc: "Der Bernsteinhandelsweg, der von der Ostsee nach Süden führt – baltischer Bernstein, nowgorodische Pelze und östliche Seide kreuzen sich auf diesem nun von Nowgorod beherrschten Weg."
 nov_great_novgorod: "Groß-Nowgorod vollendet"
 nov_great_novgorod_desc: "Handelsreich, Militärmacht, orthodoxe Autorität – die drei Säulen sind vollendet, und Nowgorod wird zu einem Staat, der des Titels „das Große (Weliki)“ würdig ist. Tue den letzten Schritt zum „Großfürsten der Rus“."
 nov_ruler_of_rus: "Großfürst der Rus"
 nov_ruler_of_rus_desc: "„Großfürst von Nowgorod und ganz Russland“ – dieser Titel hallte über den Wetsche-Platz Nowgorods. Von der Ostsee bis Sibirien, vom Weißen Meer bis zu den südlichen Steppen – Nowgorods Banner weht über ganz Russland. Die Kaufmannsrepublik hat eines der größten Reiche der Welt errichtet. Die Geschichte ist neu geschrieben – Nowgorod entscheidet über Russlands Zukunft."
 nov_events.10.t: "Moskau fällt – Russische Führung an Nowgorod"
 nov_events.10.d: "Der Moskauer Kreml ist in nowgorodische Hände gefallen. Die Ambitionen der als „Tatarenhunde“ verachteten Moskauer Großfürstenfamilie sind zerschlagen. Da Russlands Zukunft nun von der Wetsche-Republik Nowgorod entschieden wird, ist dieser Sieg nicht bloß territoriale Eroberung – er ist ein Wendepunkt, der die russische Geschichte grundlegend verändert."
 nov_events.10.a: "Moskau ist gefallen! Die Ära Nowgorods beginnt!"
 nov_events.20.t: "Die Bildung der Rus – ein neuer Staat um Nowgorod"
 nov_events.20.d: "Ein geeinter Staat der Rus um Nowgorod ist geboren. Wie soll er heißen? Das „Großfürstentum Rus“ verkünden, um einen neuen Anfang einzuläuten, oder stolz den Namen „Nowgorod“ bewahren?"
 nov_events.20.a: "Das „Großfürstentum Rus“ verkünden – Geburt eines neuen Russlands"
 nov_events.20.b: "Stolz den Namen „Nowgorod“ bewahren"
 nov_events.99.t: "Großfürst der Rus – Nowgorod beherrscht Russland"
 nov_events.99.d: "„Großfürst von Nowgorod und ganz Russland“ – dieser Titel hallte über den Wetsche-Platz Nowgorods. Von der Ostsee bis Sibirien, vom Weißen Meer bis zur Steppe – Nowgorods Banner weht über ganz Russland. Die Kaufmannsrepublik hat eines der größten Reiche der Geschichte errichtet. Die Geschichte ist neu geschrieben."
 nov_events.99.a: "Es lebe der Großfürst der Rus! Nowgorod für immer!"
