 STATIC_MODIFIER_DESC_nov_novgorod_city_mod: "Als hanseatische Drehscheibe ist Groß-Nowgorod entwickelt, und der Handel blüht."
 STATIC_MODIFIER_NAME_nov_literacy_mod: "Birkenrindentradition"
 STATIC_MODIFIER_DESC_nov_literacy_mod: "Die Tradition der Schriftkunde stützt Nowgorods geistigen und kaufmännischen Vorteil."
 STATIC_MODIFIER_NAME_nov_hansa_mod: "Hansehandel"
 STATIC_MODIFIER_DESC_nov_hansa_mod: "Die Partnerschaft mit Nordeuropas größtem Handelsnetz ist begründet."
