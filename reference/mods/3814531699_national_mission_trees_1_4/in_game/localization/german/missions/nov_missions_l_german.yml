 STATIC_MODIFIER_DESC_nov_pskov_mod: "Pskow entwickelt sich als kaufmännische Nebenhauptstadt Nowgorods."
 STATIC_MODIFIER_NAME_nov_trade_empire_mod: "Handelsreich"
 STATIC_MODIFIER_DESC_nov_trade_empire_mod: "Nowgorods Handelsnetz umspannt Nordeuropa."
