 STATIC_MODIFIER_DESC_nov_russa_mod: "Das Salzgewinnungszentrum Staraja Russa ist entwickelt."
 STATIC_MODIFIER_NAME_nov_novgorod_secured_mod: "Die Region Nowgorod gesichert"
 STATIC_MODIFIER_DESC_nov_novgorod_secured_mod: "Nowgorods Heimatgebiet ist vollständig beherrscht – das Fundament für die Ausdehnung ist begründet."
 STATIC_MODIFIER_NAME_nov_tver_mod: "Twer erobert"
 STATIC_MODIFIER_DESC_nov_tver_mod: "Das Twer an der oberen Wolga ist erobert – der südliche Weg ist geöffnet."
 STATIC_MODIFIER_NAME_nov_yaroslavl_mod: "Jaroslawl erblüht"
 STATIC_MODIFIER_DESC_nov_yaroslavl_mod: "Die Wolga-Handelsstadt Jaroslawl fällt an Nowgorod."
 STATIC_MODIFIER_NAME_nov_suzdal_mod: "Susdal-Wladimir"
 STATIC_MODIFIER_DESC_nov_suzdal_mod: "Die alten Kernlande der Rus, Susdal und Wladimir, sind eingegliedert."
 STATIC_MODIFIER_NAME_nov_defeat_muscovy_mod: "Moskau besiegt"
 STATIC_MODIFIER_DESC_nov_defeat_muscovy_mod: "Die tatarischen Klienten Moskaus sind vernichtet – die Führung der Rus geht an Nowgorod über."
 STATIC_MODIFIER_NAME_nov_smolensk_mod: "Smolensk unterworfen"
 STATIC_MODIFIER_DESC_nov_smolensk_mod: "Der Schlüssel Russlands, Smolensk, ist genommen – westlicher Einfluss ist begründet."
 STATIC_MODIFIER_NAME_nov_ryazan_mod: "Rjasan erobert"
 STATIC_MODIFIER_DESC_nov_ryazan_mod: "Das Steppentor Rjasan fällt unter Nowgorods Kontrolle."
 STATIC_MODIFIER_NAME_nov_vologda_mod: "Handel in Wologda"
 STATIC_MODIFIER_DESC_nov_vologda_mod: "Die nördliche Handelsdrehscheibe Wologda ist genommen – der Weg zum Weißen Meer ist geöffnet."
 STATIC_MODIFIER_NAME_nov_arkhangelsk_mod: "Archangelsk"
 STATIC_MODIFIER_DESC_nov_arkhangelsk_mod: "Der Weißmeerhafen Archangelsk ermöglicht unmittelbaren Handel mit Nordeuropa."
 STATIC_MODIFIER_NAME_nov_white_sea_mod: "Weißmeerhandel"
 STATIC_MODIFIER_DESC_nov_white_sea_mod: "Der Handelsweg des Weißen Meeres ist beherrscht – Nowgorods nördlicher Handel ist vollendet."
 STATIC_MODIFIER_NAME_nov_perm_mod: "Perm erobert"
 STATIC_MODIFIER_DESC_nov_perm_mod: "Das Kama-Pelzerzeugungszentrum Perm ist erobert – das Fundament des Pelzmonopols ist begründet."
 STATIC_MODIFIER_NAME_nov_kola_mod: "Die Festung Kola"
 STATIC_MODIFIER_DESC_nov_kola_mod: "Die arktische Kola-Halbinsel ist genommen – ein Stützpunkt für die nördliche Seeroute ist begründet."
 STATIC_MODIFIER_NAME_nov_siberia_mod: "Die sibirische Grenze"
 STATIC_MODIFIER_DESC_nov_siberia_mod: "Der Weg über den Ural nach Sibirien ist geöffnet."
 STATIC_MODIFIER_NAME_nov_fur_monopoly_mod: "Pelzhandelsmonopol"
 STATIC_MODIFIER_DESC_nov_fur_monopoly_mod: "Alle nördlichen Pelzhandelswege fallen unter Nowgorods ausschließliche Kontrolle."
 STATIC_MODIFIER_NAME_nov_karelia_mod: "Karelien gesichert"
 STATIC_MODIFIER_DESC_nov_karelia_mod: "Der Zugang zur Ostsee ist durch die Beherrschung Kareliens gesichert."
 STATIC_MODIFIER_NAME_nov_viborg_mod: "Wyborg erobert"
 STATIC_MODIFIER_DESC_nov_viborg_mod: "Das Ostseetor Wyborg ist erstürmt."
 STATIC_MODIFIER_NAME_nov_baltic_fleet_mod: "Ostseeflotte"
 STATIC_MODIFIER_DESC_nov_baltic_fleet_mod: "Nowgorods Ostseeflotte schützt den nördlichen Seehandel."
 STATIC_MODIFIER_NAME_nov_riga_mod: "Riga erobert"
 STATIC_MODIFIER_DESC_nov_riga_mod: "Die hanseatische Drehscheibe Riga fällt unter Nowgorods Kontrolle."
 STATIC_MODIFIER_NAME_nov_livonia_mod: "Livland unterworfen"
 STATIC_MODIFIER_DESC_nov_livonia_mod: "Die östliche Ostseeküste Livlands ist unterworfen – die baltischen Lande sind in Reichweite."
