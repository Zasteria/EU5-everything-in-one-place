l_german:
 por_portuguese_mission_pack: "Das Zeitalter der Entdeckungen – Portugals Seereich"
 por_portuguese_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist Portugal ein kleines Königreich an der Westspitze der Iberischen Halbinsel. Doch die von Prinz Heinrich dem Seefahrer (1394–1460) organisierten Expeditionen werden die Welt verändern – Madeira, die Azoren, Westafrika, das Kap der Guten Hoffnung, Indien, Malakka, Brasilien. Vom Atlantik bis zum Indischen Ozean errichte den „Estado da Índia“, wo portugiesische Seefahrer die Meere beherrschen."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "Entwickle das Mutterland, umsegle Afrika, um den Indischen Ozean zu erreichen, kolonisiere Brasilien und herrsche als Herr der Meere."
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um Portugals Reich des Zeitalters der Entdeckungen zu erfüllen."
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "Von Prinz Heinrich dem Seefahrer zu Philipps II. Portugal!"
 por_infante_henrique: "Portugals Seefahrertradition"
 por_infante_henrique_desc: "Im Jahr 1337 ist Portugal ein kleines Königreich an der Westspitze der Iberischen Halbinsel. Unter Alfons’ IV. Herrschaft unterstützte Portugal Kastilien in der Schlacht am Río Salado (1340) und schlug als Seemacht die Meriniden zurück. Dieses dem Atlantik zugewandte Königreich hat lange eine Affinität zum Meer. Lissabons Hafen, die Fischer der Algarve, die Atlantikwinde – diese Seefahrertradition ist das Fundament, das künftigen Generationen das Zeitalter der Entdeckungen hervorbringen wird."
 por_dev_lisbon: "Lissabon entwickeln"
 por_dev_lisbon_desc: "Lissabon an der Tejo-Mündung ist mit einem natürlichen Hafen gesegnet. Die Entwicklung dieser von antiken Phöniziern gegründeten Stadt zur Hauptstadt des portugiesischen Reiches macht sie zum Zentrum des Welthandels."
 por_dev_porto: "Porto entwickeln"
 por_dev_porto_desc: "Porto am Douro ist eine Stadt des Weins und der Fischerei. Entwickle diese uralte Stadt, die künftigen Generationen ihren Namen leihen wird für „Portugal (Hafen von Porto)“."
 por_university_coimbra: "Die Universität Coimbra"
 por_university_coimbra_desc: "Die 1290 gegründete Universität Coimbra – Portugals älteste Universität – bildet Seefahrer, Juristen und Geistliche aus. Viele Gelehrte, die unter Prinz Heinrich dienten, studierten hier."
 por_lisbon_entrepot_nmt: "Lissabon als Handelsdrehscheibe"
 por_lisbon_entrepot_nmt_desc: "Entwickle Lissabons Hafenverwaltung, damit östliche Waren von hier aus in ganz Europa verteilt werden. Pfeffer, Gewürze, Seide – Lissabon wird zu Europas größtem Gewürzmarkt."
 por_avis_dynasty: "Die Stärkung des Hauses Avis"
 por_avis_dynasty_desc: "Das Haus Avis, das die dynastische Krise von 1385 überlebte – João I.s Sieg begründete eine portugiesische Dynastie mit stabilem Fundament für die Regierung."
 por_ordenacoes_afonsinas: "Ordenações Afonsinas"
 por_ordenacoes_afonsinas_desc: "Die 1446 zusammengestellten Ordenações Afonsinas sind Portugals erstes systematisches Gesetzbuch. Als Vorbild für die späteren manuelinischen und philippinischen Gesetzbücher begründen sie Portugals Rechtstradition."
 por_dev_evora: "Évora entwickeln"
 por_dev_evora_desc: "Évora, die Hauptstadt der Region Alentejo – diese uralte, römische Tempel bewahrende Stadt wird als landwirtschaftliches und kulturelles Zentrum entwickelt."
 por_algarve_fisheries: "Die Fischerei der Algarve"
 por_algarve_fisheries_desc: "Die Region Algarve im südlichen Portugal grenzt an die atlantischen Fischgründe. Reiche Fischgründe für Kabeljau, Sardinen und Thunfisch nähren die portugiesische Affinität zum Meer, die zum Fundament des Zeitalters der Entdeckungen wird."
 por_ceuta_gateway: "Ceuta – Tor nach Afrika"
 por_ceuta_gateway_desc: "1415 eroberten João I.s portugiesische Truppen Ceuta – dies ist der Beginn von Portugals überseeischer Ausdehnung. Prinz Heinrich erhielt hier von muslimischen Kaufleuten Informationen über die saharischen Handelswege, was seinen Ehrgeiz nährte, südwärts entlang Afrikas zu segeln."
 por_conquer_tangier: "Tanger erobern"
 por_conquer_tangier_desc: "Tanger, gegenüber Ceuta an der Straße von Gibraltar gelegen – erhöhe den Druck auf nordafrikanische muslimische Kräfte und sichere den atlantischen Ausgang."
 por_moroccan_fortress: "Marokkanische Festungen"
 por_moroccan_fortress_desc: "Durch die Beherrschung marokkanischer Handelsstädte einschließlich Agadirs beherrsche den Endpunkt des transsaharischen Handels und monopolisiere die Gewinne aus Gold, Elfenbein und Salz."
 por_madeira_settlement: "Madeira besiedeln"
 por_madeira_settlement_desc: "Madeira, 1419 von den Portugiesen erreicht – die erste atlantische Kolonie. Die Einführung des Zuckers auf dieser unbewohnten Insel begründete das Zuckerplantagenmodell, das später in Brasilien und Westindien verwendet wurde."
 por_azores_settlement: "Die Azoren besiedeln"
 por_azores_settlement_desc: "Die Kolonisierung der Azoren mitten im Atlantik sichert eine Zwischenstation auf den transatlantischen Routen. Diese als Basis zu nutzen ermöglicht weitere Erkundung nach Westen."
 por_guinea_trade: "Der Handel mit Guinea"
 por_guinea_trade_desc: "Der Golf von Guinea, erreicht von den Portugiesen bei ihrer Fahrt südwärts entlang der westafrikanischen Küste – der Handel mit Gold, Elfenbein und später Sklaven beginnt. Prinz Heinrichs Traum wird Wirklichkeit."
 por_gold_coast: "Die Goldküste"
 por_gold_coast_desc: "Elmina (1482) – die erste dauerhafte Handelsfestung, die Portugal in Afrika errichtete. Große Goldmengen fließen aus dieser „Goldküste“-Region nach Portugal."
 por_sao_tome_sugar: "Der Zucker São Tomés"
 por_sao_tome_sugar_desc: "Die Insel São Tomé nahe dem Äquator ist ideal für Zuckerplantagen. Mit Zwangsarbeit vom afrikanischen Festland wird São Tomé zu Europas größtem Zuckerlieferanten."
 por_angola_colony: "Die Kolonie Angola"
 por_angola_colony_desc: "Angola wird als nächster Stützpunkt nach São Tomé zu einer wichtigen portugiesischen Kolonie. Errichte Handelsbeziehungen mit dem Königreich Kongo und weite den Einfluss ins zentral-westliche Afrika aus."
 por_cape_of_good_hope: "Das Kap der Guten Hoffnung"
 por_cape_of_good_hope_desc: "1488 erreichte Bartolomeu Dias die Südspitze Afrikas, das „Kap der Stürme“. João II. benannte es in „Kap der Guten Hoffnung“ um – denn der Weg nach Indien war nun offen."
 por_east_africa_trading_posts: "Ostafrikanische Handelsposten"
 por_east_africa_trading_posts_desc: "Mosambik, Sofala – die Einnahme der Gold- und Elfenbeinhandelsposten der Suaheliküste erreicht den Eintritt in das Handelsnetz des Indischen Ozeans."
 por_mombasa_fort: "Die Festung Mombasa"
 por_mombasa_fort_desc: "Mombasa und Malindi – die Unterwerfung von Ostafrikas größten Handelsstädten begründet die Kontrolle des Indischen Ozeans. 1498 erhielt Vasco da Gama von Malindi einen Navigationsführer nach Indien."
 por_vasco_da_gama: "Vasco da Gama erreicht Indien"
 por_vasco_da_gama_desc: "Am 20. Mai 1498 landete Vasco da Gama in Calicut (Kozhikode). In diesem Augenblick wurde der Seeweg zwischen Europa und Asien geöffnet, und die Struktur des von arabischen Kaufleuten und Venedig monopolisierten Gewürzhandels änderte sich grundlegend."
 por_conquer_goa: "Goa erobern"
 por_conquer_goa_desc: "1510 eroberte Albuquerque Goa – die Geburt von Portugals „östlicher Hauptstadt“. Der natürliche Hafen Goas an Indiens Westküste blüht als Zentrum des Estado da Índia (Portugiesisch-Indien)."
 por_malabar_trade: "Die Gewürze der Malabarküste"
 por_malabar_trade_desc: "Kochi, Calicut, Quilon – die Malabarküste erzeugt Pfeffer, Kardamom und Ingwer. Durch die Monopolisierung der Gewürze hier beherrscht Portugal die europäischen Gewürzpreise."
 por_hormuz_control: "Hormus beherrschen"
 por_hormuz_control_desc: "1515 eroberte Albuquerque Hormus am Eingang des Persischen Golfs. Diesen Punkt zu beherrschen bedeutet, den Persien-Indien-Handel zu beherrschen und den Handel der islamischen Welt abzuschneiden."
 por_conquer_malacca: "Malakka erobern"
 por_conquer_malacca_desc: "Im Juli 1511 eroberte Afonso de Albuquerque mit 1.200 portugiesischen Soldaten Malakka – der größte strategische Sieg des Zeitalters der Entdeckungen. Die Beherrschung der „Kehle des östlichen Handels“ ergreift alle Handelswege für Gewürze, Seide und Porzellan."
 por_spice_monopoly: "Das Gewürzhandelsmonopol"
 por_spice_monopoly_desc: "Mit gesichertem Goa, Hormus und Malakka stehen die Gewürzhandelswege des Indischen Ozeans vollständig unter portugiesischer Kontrolle. Pfeffer, Muskatnuss und Nelken werden über Lissabon nach Europa geliefert."
 por_indian_ocean_empire: "Das Reich des Indischen Ozeans"
 por_indian_ocean_empire_desc: "Von Ostafrika bis Malakka – die portugiesische Marine beherrscht den Indischen Ozean. Die Casa da Índia (Indienhaus) in Lissabon verwaltet den gesamten Gewürzhandel, und gewaltiger Reichtum fließt nach Portugal."
 por_brazil_discovery: "Die Entdeckung Brasiliens"
 por_brazil_discovery_desc: "Am 22. April 1500 – während der Fahrt nach Indien mit 13 Schiffen wich Pedro Álvares Cabral weit nach Westen aus, um einem Sturm zu entgehen, und entdeckte unbekanntes Land. „Ilha de Vera Cruz (Insel des Wahren Kreuzes)“ – später „Brasilien“ (vom Farbholzbaum Pau-Brasil) genannt. Unter dem Vertrag von Tordesillas wird dieses Land portugiesisches Gebiet und wird später Portugals größte Kolonie werden."
 por_brazil_colony: "Brasilien kolonisieren"
 por_brazil_colony_desc: "1532 errichtete Martim Afonso de Sousa Brasiliens erste dauerhafte Kolonie, „São Vicente“. Eine neue Gesellschaft entsteht, in der sich portugiesische Siedler und indigene Völker vermischen."
 por_brazil_sugar: "Brasiliens Zuckerindustrie"
 por_brazil_sugar_desc: "Mitte des 16. Jahrhunderts war Brasilien zu Europas größtem Zuckerlieferanten geworden. Die Engenhos (Zuckermühlen) Pernambucos und Bahias arbeiten mit Zwangsarbeit aus Afrika und erzeugen gewaltigen Reichtum."
 por_brazil_empire: "Das brasilianische Reich"
 por_brazil_empire_desc: "Bahia, Pernambuco, Rio de Janeiro – Brasiliens Kolonien sind zu kaiserlichem Ausmaß herangewachsen. Zucker, Farbholz und später Gold und Edelsteine schaffen Ströme des Reichtums nach Portugal."
 por_naval_supremacy: "Seeherrschaft"
 por_naval_supremacy_desc: "Die portugiesische Marine, die sowohl Atlantik als auch Indischen Ozean beherrscht – die überlegene Wendigkeit der Karavelle und die Kanonenfeuerkraft überwältigen arabische, indische und chinesische Handelsschiffe."
 por_caravel: "Die Karavelle"
 por_caravel_desc: "Die im Zeitalter Prinz Heinrichs entwickelte Karavelle (Caravela) – dieses kleine, schnelle Segelschiff mit Lateinersegeln, das gegen den Wind segeln konnte, machte das Zeitalter der Entdeckungen möglich. Auch die Santa María war eine Karavelle."
 por_padroes: "Padrões (Steinsäulen)"
 por_padroes_desc: "Portugiesische Entdecker errichteten an verschiedenen Orten Afrikas Steinsäulen (Padrões), die den Namen des portugiesischen Königs und das christliche Kreuz trugen. Dies war eine Erklärung von Entdeckung und Herrschaft – Portugals Reichweite, in Stein gemeißelt."
 por_royal_navy: "Die königliche Marine"
 por_royal_navy_desc: "Die stärkste Marine der Welt stützt die portugiesische Vorherrschaft – Galeonen, Karacken und Karavellen schützen alles vom Indischen Ozean bis Brasilien."
 por_dev_setubal: "Setúbal entwickeln"
 por_dev_setubal_desc: "Die Bucht von Setúbal südlich von Lissabon ist ein natürlicher Hafen. Entwickle sie als Hafenstadt, die Lissabon ergänzt und Salz, Fisch und Wein erzeugt."
 por_order_of_christ: "Der Christusorden"
 por_order_of_christ_desc: "Der 1319 gegründete Christusorden (Ordem de Cristo) – dieser Militärorden, in Portugal als Nachfolger der Templer gegründet, finanzierte Prinz Heinrichs Erkundungen. Das rote Kreuz des Ordens war auf die portugiesischen Segel gemalt."
 por_treaty_tordesillas: "Der Vertrag von Tordesillas"
 por_treaty_tordesillas_desc: "1494 schlossen Spanien und Portugal unter Vermittlung Papst Alexanders VI. den Vertrag von Tordesillas – der den Atlantik vertikal teilte, Westen Spanien und Osten Portugal zuwies. Dieser Vertrag bestätigte Brasilien als portugiesisches Gebiet."
 por_colonial_administration: "Kolonialverwaltung"
 por_colonial_administration_desc: "Verwaltungsapparat zur Führung von Portugals Reich, das Afrika, Indien und Brasilien umspannt – Statthalter und Vizekönige berichten dem König in Lissabon und senden Handelseinnahmen ins Mutterland."
 por_estado_da_india_nmt: "Estado da Índia"
 por_estado_da_india_nmt_desc: "„Estado da Índia (Staat Indien)“ – der Begriff, der sich auf Portugals gesamtes asiatisches Reich bezieht. Mit Goa als Hauptstadt und der Beherrschung der Seehandelswege von Ostafrika bis Malakka ist dieses „Reich“ das erste wahrhaft globale Seereich der Geschichte."
 por_dev_tomar: "Tomar entwickeln"
 por_dev_tomar_desc: "Tomar, Hauptsitz des Christusordens – das Christuskloster (Convento de Cristo) gilt als das feinste Beispiel portugiesischer manuelinischer Baukunst. Entwickle es mit den finanziellen Mitteln des Ordens."
 por_wine_trade: "Der portugiesische Weinhandel"
 por_wine_trade_desc: "Die Weine des Douro-Tals – der Prototyp des „Portweins“ – sind ein wichtiger Exportartikel nach England und Flandern. Errichte die anglo-portugiesische Handelsbeziehung, die dem Methuen-Vertrag (1703) vorausgeht."
 por_dev_faro: "Faro entwickeln"
 por_dev_faro_desc: "Faro, die Hauptstadt der Region Algarve – 1249 durch die christliche Reconquista in Portugal eingegliedert, entwickle diese südliche Stadt zur Drehscheibe von Fischerei und Handel."
 por_cape_verde: "Die Kapverdischen Inseln"
 por_cape_verde_desc: "Die 1456 entdeckten Kapverdischen Inseln nehmen eine strategische Lage auf halbem Weg zwischen Afrika und Amerika ein. Als Relaispunkt für den transatlantischen Handel werden sie zur Versorgungsbasis für die spätere brasilianische Kolonisierung."
 por_lisbon_megalopolis: "Lissabon – Weltstadt"
 por_lisbon_megalopolis_desc: "Im 16. Jahrhundert wurde Lissabon zu einer von Europas größten Städten mit einer Bevölkerung von über 100.000. Östliche Gewürze, afrikanisches Gold und brasilianischer Zucker treffen hier zusammen und erwerben ihr den Beinamen „Hauptstadt der Welt“."
 por_casa_india: "Casa da Índia"
 por_casa_india_desc: "Das in Lissabon errichtete Casa da Índia (Indienhaus) verwaltet Portugals östlichen Handel ausschließlich als staatliche Einrichtung. Alle Gewürzimporte laufen hier durch und erzeugen gewaltige Zolleinnahmen."
 por_brazil_wood: "Pau-Brasil (Brasilholz)"
 por_brazil_wood_desc: "Pau-Brasil (Brasilholz), von dem Brasilien seinen Namen hat – dieser rote Farbholzbaum wird in großen Mengen als unentbehrliche Ware für Europas Wollfärbeindustrie ausgeführt. Es ist das erste Erzeugnis des Brasilienhandels."
 por_atlantic_domination: "Herrschaft über den Atlantik"
 por_atlantic_domination_desc: "Von Lissabon bis zu den Azoren, Madeira, den Kapverden und Brasilien – Portugal beherrscht den gesamten Atlantik. Nach dem Sieg über Spaniens Konkurrenz herrscht Portugal als Hauptakteur des Atlantikhandels."
 por_empire_of_seas: "Herr der Meere"
 por_empire_of_seas_desc: "„Portugal ist ein kleines Land, doch beherrscht die halbe Welt“ – die Worte eines Historikers werden Wahrheit. Vom Atlantik bis zum Indischen Ozean, von Brasilien bis Malakka – Portugals Reich beherrscht die Meere der Welt. Der Estado da Índia ist vollendet."
 por_events.10.t: "Das Kap der Guten Hoffnung – der Weg nach Indien öffnet sich"
 por_events.10.d: "1488 umrundete Bartolomeu Dias’ Flotte das südlichste „Kap der Stürme“ Afrikas und erreichte den Indischen Ozean. João II. erzitterte bei dieser Nachricht – fünfzehn Jahre später sollte Vasco da Gama die direkte Route nach Indien eröffnen. Das Zeitalter, in dem arabische Kaufleute den Gewürzhandel monopolisierten, geht seinem Ende entgegen."
 por_events.10.a: "Ruhm sei Gott und Portugal! Der Weg nach Indien ist offen!"
 por_events.20.t: "Vasco da Gama erreicht Indien"
 por_events.20.d: "Am 20. Mai 1498 – zehn Monate nach der Abfahrt aus Lissabon mit vier Schiffen landete Vasco da Gama in Calicut. Der örtliche Herrscher (Zamorin) war skeptisch, doch Portugal sicherte sich den Eintritt in den Gewürzhandel. Während arabische Kaufleute vor Zorn kochten, begann Portugals Zeitalter des östlichen Handels."
 por_events.20.a: "Pfeffer und Gewürze – Portugal hat Indiens Reichtum ergriffen!"
 por_events.30.t: "Die Eroberung Malakkas – die Ergreifung der Kehle des Gewürzhandels"
 por_events.30.d: "Im Juli 1511 eroberte Afonso de Albuquerque mit 1.200 portugiesischen Kräften Malakka. „Der wichtigste Ort des Ostens“ – die Beherrschung Malakkas ergreift alle Handelswege für China, Indien und die Gewürzinseln. Albuquerque stellte Malakka neben Goa und Hormus als eine von drei Säulen des portugiesischen Reiches auf."
 por_events.30.a: "Malakka ist unser! Der östliche Handel ist Portugals Monopol!"
 por_events.40.t: "Cabrals Entdeckung Brasiliens"
 por_events.40.d: "Am 22. April 1500 – auf dem Weg nach Indien mit einer Flotte von 13 Schiffen wich Pedro Álvares Cabral weit nach Westen aus, um einem Sturm zu entgehen, und entdeckte unbekanntes Land. „Ilha de Vera Cruz“ – Teil des südamerikanischen Kontinents, später „Brasilien“ genannt. Unter dem Vertrag von Tordesillas wird dies portugiesisches Gebiet, und dieses Land wird später Portugals größte Kolonie werden."
 por_events.40.a: "Eine Entdeckung durch Gottes Führung! Brasilien gehört Portugal!"
 por_events.99.t: "Herr der Meere – Portugals Reich vollendet"
 por_events.99.d: "Von Lissabon bis Goa, von Malakka bis Brasilien – Portugals Reich beherrscht die Meere der Welt. Die „maritime Seidenstraße“, von der Prinz Heinrich träumte, ist Wirklichkeit geworden, und Gewürze, Gold, Zucker und Elfenbein treffen sich in Lissabon. Portugal hat sich von einer kleinen Nation von 92.000 Quadratkilometern zum ersten „globalen Seereich“ der Welt gewandelt."
 por_events.99.a: "Portugal für immer! Herrsche als Herr der Meere!"
