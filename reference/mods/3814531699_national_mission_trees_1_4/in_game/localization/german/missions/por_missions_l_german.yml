 STATIC_MODIFIER_DESC_por_ceuta_mod: "Das afrikanische Tor Ceuta wurde zum Ausgangspunkt portugiesischer überseeischer Ausdehnung."
 STATIC_MODIFIER_NAME_por_tangier_mod: "Tanger erobert"
 STATIC_MODIFIER_DESC_por_tangier_mod: "Die Straße von Gibraltar eingenommen, die Kontrolle über den afrikanischen Übergang begründet."
 STATIC_MODIFIER_NAME_por_morocco_mod: "Marokkanische Festungen"
 STATIC_MODIFIER_DESC_por_morocco_mod: "Die saharischen Handelsendpunkte beherrscht – portugiesischer Einfluss breitet sich über Nordafrika aus."
 STATIC_MODIFIER_NAME_por_madeira_mod: "Madeira entwickelt"
 STATIC_MODIFIER_DESC_por_madeira_mod: "Der Atlantiks erste Kolonie Madeira begründete das Zuckerplantagenmodell."
 STATIC_MODIFIER_NAME_por_azores_mod: "Die Azoren"
 STATIC_MODIFIER_DESC_por_azores_mod: "Die mittelatlantischen Azoren als transatlantische Relaisbasis gesichert."
 STATIC_MODIFIER_NAME_por_guinea_trade_mod: "Der Handel mit Guinea"
 STATIC_MODIFIER_DESC_por_guinea_trade_mod: "Säcke voller Goldstaub und Elfenbein, die aus den Häfen Guineas eintreffen, füllen Tag für Tag die Bücher des königlichen Handelshauses Lissabons."
 STATIC_MODIFIER_NAME_por_gold_coast_mod: "Die Goldküste"
 STATIC_MODIFIER_DESC_por_gold_coast_mod: "Gold aus der Festung Elmina bereicherte die portugiesische Wirtschaft."
 STATIC_MODIFIER_NAME_por_sao_tome_mod: "Der Zucker São Tomés"
 STATIC_MODIFIER_DESC_por_sao_tome_mod: "Das äquatoriale São Tomé wurde zu Europas größtem Zuckerlieferanten."
 STATIC_MODIFIER_NAME_por_angola_mod: "Die Kolonie Angola"
 STATIC_MODIFIER_DESC_por_angola_mod: "Angola als Portugals zentral-westafrikanischer Stützpunkt begründet."
 STATIC_MODIFIER_NAME_por_east_africa_mod: "Ostafrikanische Handelsposten"
 STATIC_MODIFIER_DESC_por_east_africa_mod: "Das Gold- und Elfenbeinhandelsnetz der Suaheliküste von Portugal eingenommen."
 STATIC_MODIFIER_NAME_por_mombasa_mod: "Die Festung Mombasa"
 STATIC_MODIFIER_DESC_por_mombasa_mod: "Ostafrikas größte Handelsstadt Mombasa eingenommen – die Kontrolle des Indischen Ozeans begründet."
 STATIC_MODIFIER_NAME_por_goa_mod: "Goa – östliche Hauptstadt"
 STATIC_MODIFIER_DESC_por_goa_mod: "Die Hauptstadt des Estado da Índia, Goa, wurde zum Zentrum des Handels im Indischen Ozean."
 STATIC_MODIFIER_NAME_por_malabar_mod: "Die Gewürze der Malabarküste"
