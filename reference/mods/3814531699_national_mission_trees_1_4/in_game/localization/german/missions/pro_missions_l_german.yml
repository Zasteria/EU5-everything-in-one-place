l_german:
 pro_jewel_of_occitania_mission_pack: "Juwel Okzitaniens"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "Als Nachkommen des kapetingischen Hauses Anjou halten die Grafen der Provence Ansprüche auf Neapel, Sizilien, Aragón, Ungarn und Jerusalem. Entwickle Marseille zur größten Hafenstadt des Mittelmeers, eine Okzitanien, und beweise der Welt die rechtmäßigen Erbrechte der Dynastie Anjou. Der Ruhm des „Königs der Könige“ wartet."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "Verwirkliche als Graf der Provence die Erbrechte des Hauses Anjou, eine Okzitanien und erobere Frankreich."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um König der Könige zu werden."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "Herrsche von Marseille aus über die Welt!"
 pro_house_of_anjou: "Ambitionen des Hauses Anjou"
 pro_house_of_anjou_desc: "Das kapetingische Haus Anjou blühte einst als Königshaus von Sizilien, Neapel und Ungarn, hält nun aber nur noch die Grafschaft Provence in Südfrankreich. Doch König Renés Herz hegt Träume vieler königlicher Ansprüche. Die Zeit ist gekommen, aus dem Boden der Provence Ruhm zurückzugewinnen."
 pro_statutes_of_aix: "Die Statuten von Aix"
 pro_statutes_of_aix_desc: "Aix-en-Provence, als Hauptstadt der Grafschaft Provence, hat ein eigenes Rechtssystem entwickelt, bekannt als die „Statuten von Aix“. Die Errichtung von Kontrolle und Rechtskodifizierung schaltet zwei einzigartige Einrichtungen frei: die Etats de Provence (Generalstände) und den Freihafen von Marseille."
 pro_statutes_of_aix_unlock_tt: "Schaltet die Stadtprivilegien États de Provence und Freihafen Marseille frei."
 pro_sponsor_the_arts: "Die Künste fördern"
 pro_sponsor_the_arts_desc: "König René ist als einer der größten Förderer der italienischen Renaissance bekannt. Lade Künstler und Gelehrte ein und mache die Provence zum westlichen Zentrum der Renaissancekultur."
 pro_develop_marseille: "Marseille entwickeln"
 pro_develop_marseille_desc: "Marseille, die von den antiken Griechen gegründete Hafenstadt, ist eine wichtige Drehscheibe des Mittelmeerhandels. Die Entwicklung dieser Stadt markiert die Provence ersten Schritt zu einer Handels- und Seemacht."
 pro_toulon_dockyard: "Die Werft von Toulon"
 pro_toulon_dockyard_desc: "Toulon, ein prächtiger natürlicher Hafen, ist eine der besten Marinepositionen des Mittelmeers. Errichte hier eine große Werft und ein Arsenal, um es zum Heimathafen der provenzalischen Flotte zu machen."
 pro_lords_of_the_rhone: "Herren des Rhône-Korridors"
 pro_lords_of_the_rhone_desc: "Die Rhône ist ein lebenswichtiger Transport- und Handelsweg, der die Alpen mit der Provence verbindet. Die vollständige Beherrschung dieses Korridors begründet die Provence als unbestrittenen Herrscher Südfrankreichs."
 pro_avignon_question: "Die Frage Avignons"
 pro_avignon_question_desc: "Avignon, von 1309 bis 1377 Sitz des Papsttums, besteht noch immer als päpstliche Enklave. Bringe diese Stadt durch Diplomatie oder Eroberung in die Provence."
 pro_piqure_de_marseilles: "Piqué de Marseille"
 pro_piqure_de_marseilles_desc: "Der „Piqué de Marseille“, ein kunstvoll gestepptes Gewebe, verkörpert die Provence hoch entwickelte Textilkunst. Die Ausweitung der Tuch- und Feinstofferzeugung bringt der Provence großen Reichtum."
 pro_la_marseillaise: "La Marseillaise"
 pro_la_marseillaise_desc: "Der Marsch, gesungen von den aus Marseille aufbrechenden Freiwilligen. Das provenzalische Heer ist nun die stärkste Militärmacht Südfrankreichs."
 pro_claims_of_king_rene: "Die Ansprüche König Renés"
 pro_claims_of_king_rene_desc: "Der gute König René wurde tragisch vom neapolitanischen Thron vertrieben und der Krone Aragóns verwehrt. Doch die rechtmäßigen Erbrechte des Hauses Anjou sind nicht verloren. Die Zeit ist gekommen, diese Rechte der Welt zu beweisen."
 pro_king_of_naples: "König von Neapel"
 pro_king_of_naples_desc: "Der neapolitanische Thron ist das rechtmäßige Erbe des Hauses Anjou. Gewinne diesen Sitz zurück, der von der Trastámara-Dynastie Aragóns geraubt wurde, und baue die angiovinische Herrschaft in Süditalien wieder auf."
 pro_king_of_sicily: "König von Sizilien"
 pro_king_of_sicily_desc: "Das große Königreich Sizilien, einst von den Normannen erbaut, wurde auch vom Haus Anjou geerbt. Bringe Sizilien noch einmal unter das Banner der Provence."
 pro_king_of_aragon: "König von Aragón"
 pro_king_of_aragon_desc: "Der aragonesische Thron wird vom größten Rivalen des Hauses Anjou gehalten. Räche dich an der Trastámara-Dynastie, die Neapel stahl, und ergreife die Vorherrschaft über die Iberische Halbinsel."
 pro_king_of_hungary: "König von Ungarn"
 pro_king_of_hungary_desc: "Das Haus Anjou herrschte einst als Ungarns Königshaus. Gewinne diesen Ende des 14. Jahrhunderts verlorenen Thron zurück und begründe Einfluss auf Osteuropa."
 pro_king_of_jerusalem: "König von Jerusalem"
 pro_king_of_jerusalem_desc: "Der Titel „König von Jerusalem“ wird seit langem vom Haus Anjou beansprucht. Setze diesem hohlen Titel ein Ende, indem du die Heilige Stadt tatsächlich eroberst und Beschützer der christlichen Welt wirst."
 pro_integrate_lorraine: "Lothringen eingliedern"
 pro_integrate_lorraine_desc: "Das Herzogtum Lothringen ist einer der wenigen Titel, die das Haus Anjou bewahren konnte. Gliedere die verschiedenen Fraktionen ein und bringe Lothringen vollständig unter provenzalische Kontrolle."
 pro_join_the_empire: "Dem Reich beitreten"
 pro_join_the_empire_desc: "Der Beitritt zum Heiligen Römischen Reich ist eine kluge diplomatische Wahl, um die Provence vor den Bedrohungen der Großmächte zu schützen. Alternativ ist auch die Führung des Reiches als Erzherzog eine Option."
 pro_unite_occitania: "Okzitanien einen"
 pro_unite_occitania_desc: "Das okzitanischsprachige Volk Südfrankreichs ist vom Albigenserkreuzzug und dem Hundertjährigen Krieg erschöpft. Eine Okzitanien unter dem Banner der Grafen der Provence und befreie es von französischer Herrschaft."
 pro_gascony: "Gascogne"
 pro_gascony_desc: "Die Gascogne, um Bordeaux gelegen, ist ein reiches Land mit historischen Banden zu England. Die Beherrschung von Toulouse und Bordeaux ergreift ganz Südfrankreich."
 pro_king_of_france: "König von Frankreich"
 pro_king_of_france_desc: "Das Königreich Frankreich war lange der Rivale der Provence, doch die Zeit ist gekommen, seinen Thron einzunehmen. Erobere Paris und erhebe das angiovinische Banner über ganz Frankreich."
 pro_king_of_kings: "König der Könige"
 pro_king_of_kings_desc: "Das Haus Anjou hat Neapel, Sizilien, Aragón, Ungarn, Jerusalem und Frankreich erobert. Dieses viele Kronen tragende Reich wird vom König der Könige beherrscht – ein mittelalterlicher Traum Wirklichkeit geworden."
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Die Statuten von Aix"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "Die in Aix-en-Provence ansässigen Grafen der Provence entwickelten ein eigenes Gesetzbuch, das auf römisch-rechtlichen Traditionen aufbaute. Dieses geschriebene Recht kodifizierte die Rechte und Pflichten von Adel, Klerus und Bürgern und machte die Provence zu einer der rechtlich fortschrittlichsten Regionen des mittelalterlichen Frankreichs."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Die Förderung der Künste"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "König René selbst führte den Pinsel und verfasste Gedichte – ein seltener Herrscher-Künstler. Sein Hof erbte die Troubadour-Tradition der Provence, während er Künstler aus Flandern und Italien anzog. Ein Großteil seines Rufes als „guter König René“ beruht auf dieser außerordentlichen kulturellen Förderung."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Der Wohlstand Marseilles"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "Um 600 v. Chr. von griechischen Kolonisten aus Phokäa als Massalia gegründet, ist Marseille seit der Antike eine Mittelmeerhandelsdrehscheibe. Während der Kreuzzüge diente es als Hauptausgangspunkt für Männer und Material, die ins Heilige Land bestimmt waren. Diese uralte Hafenstadt ist das wirtschaftliche Herz der Provence."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "Die Werft von Toulon"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "Die Bucht von Toulon, ein prächtiger, von Hügeln geschützter natürlicher Hafen, hat Seeleuten seit der Antike Zuflucht geboten. Die Grafen der Provence entwickelten dieses natürliche Bollwerk im 15. Jahrhundert zu einem Marinestützpunkt. Ludwig XIV. sollte hier später eines von Europas größten Marinearsenalen errichten – ein Erbe, das schon Wurzeln schlägt."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Herren des Rhône-Korridors"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "Die Rhône ist seit römischer Zeit die große Ader, die das Mittelmeer mit dem französischen Landesinneren verbindet. An diesem Wasserweg stehen Arles, Avignon und unzählige Handelsstädte, durch die seit Jahrhunderten Waren, Heere und Pilger geflossen sind. Diesen Korridor zu beherrschen bedeutet, das strategische Herz der Provence zu halten."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Avignon eingegliedert"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "Von 1309 bis 1377 residierten sieben Päpste in Avignon statt in Rom, in dem, was als „Avignonesisches Papsttum“ bekannt wurde. Diese eigentümliche Episode verwandelte Avignon in eine von Europas größten diplomatischen Städten. Die Erinnerung an den päpstlichen Hof haftet dieser Stadt noch an – sie einzunehmen trägt tiefes symbolisches Gewicht für die katholische Welt."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "Piqué de Marseille"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "Der „Piqué de Marseille“, ein gestepptes Gewebe mit kunstvollen Nähten auf beiden Seiten, fegte im 17. und 18. Jahrhundert über Europa hinweg. Seine Wurzeln liegen in den geschickten mittelalterlichen Textilarbeitern der Provence. Der über den Hafen Marseilles ausgeführte Feinstoff hat lange einen Eckstein des provenzalischen Handelsrufes gebildet."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "La Marseillaise"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "Das Lied, gesungen von den während der Revolution nach Paris marschierenden Freiwilligen Marseilles, sollte eines Tages Frankreichs Nationalhymne werden. Doch der Kriegergeist der Provence ist noch älter – gehärtet in den Turnierarenen von Arles, den Kreuzzügen und unzähligen Feldzügen unter dem angiovinischen Banner über das Mittelmeer."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "Die Ansprüche König Renés"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "Der „gute König René“ hielt Ansprüche auf Neapel, Sizilien, Aragón, Ungarn und Jerusalem, verlor aber fast alle seine Kriege. Dennoch hielt seine hartnäckige Behauptung dieser Titel – über Jahrzehnte der Diplomatie und kulturellen Förderung aufrechterhalten – die Legitimität der Dynastie Anjou an den Höfen Europas am Leben."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Titel König von Neapel"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "Das angiovinische Königreich Neapel, 1266 von Karl I. von Anjou gegründet, war einst die beherrschende Macht Süditaliens. Obwohl Sizilien in der Sizilianischen Vesper verloren ging, blieb Neapel das Kronjuwel französischer Ambitionen in Italien und das greifbarste Sinnbild angiovinischer Autorität auf der Halbinsel."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Titel König von Sizilien"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "Die Sizilianische Vesper von 1282 – als sich die Inselbewohner erhoben und ihre französischen Herrscher zum Läuten der Kirchenglocken massakrierten – vertrieb die Anjous für immer aus Sizilien und brachte die Aragonesen. Doch diese Insel, wo einst normannische, arabische und byzantinische Kulturen gemeinsam blühten, bleibt der größte unvollendete Traum der Anjous."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Titel König von Aragón"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "Die Krone von Aragón errichtete ein Mittelmeerreich, das Sizilien, Sardinien und Neapel umspannte – und tat dies größtenteils auf angiovinische Kosten. Über ein Jahrhundert Rivalität zwischen diesen zwei Dynastien prägte die Politik des westlichen Mittelmeers. Aragóns Krone aus den Händen der Trastámara zu reißen, ist die endgültige Rache."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Titel König von Ungarn"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "Als Karl Robert (Carobert) von Anjou 1310 König von Ungarn wurde, etablierte sich eine Nebenlinie der Familie in Mitteleuropa als Großmacht. Unter der Dynastie Anjou erlebte Ungarn eines seiner blühendsten Zeitalter, ehe Habsburger und Osmanen die Region umgestalteten."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Titel König von Jerusalem"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "Als Gottfried von Bouillon 1099 den Ersten Kreuzzug zum Sieg führte, wurde das Königreich Jerusalem geboren. 1187 an Saladin verloren und nie vollständig zurückgewonnen, wurde der Titel „König von Jerusalem“ zu einem hohlen Anspruch, weitergereicht unter europäischen Dynastien. Das Haus Anjou hält diesen Titel seit langem – nun wird er Wirklichkeit."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Lothringen eingegliedert"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "Lothringen ist seit dem Vertrag von Verdun, der Karls des Großen Reich teilte, ein umstrittenes Grenzland gewesen. René I.s Vater Ludwig II. hielt das Herzogtum Lothringen, und René selbst war Herzog von Lothringen, ehe er die Provence erbte. Dieses uralte Herzogtum überbrückt die französische und die deutsche Welt."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "Kaiserliche Diplomatie"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "Das Heilige Römische Reich hat lange an die Provence gegrenzt, und durch Lothringen hat das Haus Anjou bereits Bande zur kaiserlichen Welt. Ob als Mitglied beitretend oder als Erzherzog führend, die Einbettung der Provence in das komplexe Bündnisgeflecht des Reiches erweitert ihre diplomatische Reichweite erheblich."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "Union Okzitaniens"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "Der okzitanischsprachige Süden war einst Heimat der Troubadoure – Dichter, die die Kunst der höfischen Liebe erfanden und deren Lieder sich über Europa verbreiteten. Der Albigenserkreuzzug des 13. Jahrhunderts und der Hundertjährige Krieg zerschmetterten diese Welt. Okzitanien unter der Provence zu einen bedeutet, eine verlorene Zivilisation neu zu entfachen."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Gascogne eingenommen"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "Die Gascogne, um den großen Weinhafen Bordeaux gelegen, war Englands letzter bedeutender kontinentaler Besitz – drei Jahrhunderte gehalten, ehe sie 1453 verloren ging. Reich an Wein, Wolle und atlantischem Handel, war diese Region stets ein begehrter Preis. Sie dem englischen Einfluss zu entreißen, vollendet den südlichen Bogen eines provenzalischen Frankreichs."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Titel König von Frankreich"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "Die kapetingische Dynastie Frankreichs und ihre angiovinische Nebenlinie teilen gemeinsames Blut – doch ihre Wege trennten sich, als Karl von Anjou nach Süden segelte, um Sizilien zu erobern. Nun ergreift die Nebenlinie den Thron der Hauptlinie. Der „Allerchristlichste König“ von Frankreich, ältester Sohn der Kirche, trägt die angesehenste Krone der katholischen Christenheit."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "König der Könige"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Neapel, Sizilien, Aragón, Ungarn, Jerusalem, Frankreich – keine mittelalterliche Dynastie trug je so viele Kronen zugleich. Das Haus Anjou ist von einer kleinen provenzalischen Grafschaft zu einem Reich aufgestiegen, das sich vom Mittelmeer bis zur Donau erstreckt. Der Traum des „guten Königs René“ – als unmögliche Fantasie abgetan – steht erfüllt da."
 pro_events.2.t: "Die Ansprüche König Renés"
 pro_events.2.d: "Die Zeit ist gekommen, die rechtmäßigen Erbrechte des Hauses Anjou zu verkünden. Das Königreich Neapel war einst angiovinisch, wurde aber durch die Niederlage gegen Alfons’ V. aragonesische Streitkräfte verloren. Nun, im Namen König Renés, bestreiten wir diese ungerechte Besetzung. Erlange den Kriegsgrund gegen Neapel und beweise die Rechtmäßigkeit des Hauses Anjou mit Waffengewalt."
 pro_events.2.a: "Neapel gehört dem Haus Anjou!"
 pro_lorraine_marriage: "Vermählung mit Lothringen"
 pro_lorraine_marriage_desc: "Das Herzogtum Lothringen ist einer der Titel, die das Haus Anjou einst hielt. Vertiefe die Bande zum Haus Lothringen durch diplomatische Heirat und Bündnis und öffne den Weg zu seiner Belehnung. Begründe Beziehungen zu Lothringen durch Blutlinie, Heirat oder Bündnis."
 pro_events.3.t: "Die Herrschaft Roberts des Weisen"
 pro_events.3.d: "Im Jahr 1337 wird die Provence von Robert von Anjou (Roberto d’Angiò, ca. 1277–1343) regiert, gefeiert als „der Weise“. Als König von Neapel, Titularkönig von Jerusalem und Graf der Provence steht er als zentrale Figur der italienischen Politik da. Der Vorkämpfer der guelfischen (papstfreundlichen) Partei, der kaiserliche Invasionen zurückschlug, vertrieb 1336 Johann von Böhmen aus Italien. Ein tiefer Liebhaber der Künste und Gelehrsamkeit, geachtet von Petrarca und Boccaccio gleichermaßen, brachte Robert Neapel und der Provence ein kulturelles goldenes Zeitalter. Doch seine letzten Jahre sind vom Scheitern der Rückgewinnung Siziliens und einer Nachfolgekrise geplagt. Roberts Erbin Johanna ist jung, und die Zukunft des Hauses Anjou ist ungewiss. Die Zeit ist gekommen, den Willen dieses großen Königs fortzuführen und den Ruhm des Hauses Anjou wiederherzustellen."
 pro_events.3.a: "Den Willen König Roberts fortführen und den Ruhm Anjous wiederherstellen!"
 pro_events.4.t: "Vermählung mit Lothringen"
 pro_events.4.d: "Durch diplomatisches Manövrieren und Heiratspolitik ist unser Verhältnis zum Herzogtum Lothringen stärker geworden als je zuvor. Da sich angiovinisches und lothringisches Blut verflechten, sind die Interessen beider Häuser tief miteinander verbunden. Die Zeit ist gekommen, den Herzog von Lothringen als Vasall der Provence aufzunehmen und seine Mittel und militärische Macht der angiovinischen Sache zu widmen."
 pro_events.4.a: "Den Herzog von Lothringen als Vasall aufnehmen"
 pro_events.4.b: "Die Unabhängigkeit wahren, während man das Bündnis bewahrt"
 pro_events.5.t: "Die Bildung des Königreichs Jerusalem"
 pro_events.5.d: "Die Heilige Stadt Jerusalem ist endlich unter das Banner der Provence gekommen. Das Haus Anjou hält nun den Titel „König von Jerusalem“ sowohl dem Namen als auch der Tat nach und führt die Kreuzfahrertradition fort. Errichte das Königreich Jerusalem an den Schlüsselpunkten der Levante neu und lass es als Vasall der Provence regieren. Dieses heilige Königreich, erstmals vom Ersten Kreuzzug 1099 gegründet, wird durch die Hand des Hauses Anjou wiedergeboren. Verteidige als Hüter des katholischen Glaubens das Heilige Land gegen islamische Kräfte."
 pro_events.5.a: "Das Königreich Jerusalem neu errichten und als angiovinischen Vasall regieren lassen!"
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "Die Generalstände der Provence, an denen Adel, Klerus und Bürger teilhaben. Stärkt die drei Stände und gewährleistet regionale Autonomie und beratende Regierung. Verbessert auch die Kabinettseffizienz."
 pro_marseille_free_port_town_rights: "Freihafen von Marseille"
 pro_marseille_free_port_town_rights_desc: "Erklärt Marseille zum Freihafen. Weitet die Handelsrechte der Kaufleute erheblich aus und erhöht Bevölkerungswachstum, Wohlstand und Bürgermacht. Kann nur Marseille verliehen werden."
 pro_events.6.t: "Die Lösung der Frage Avignons"
 pro_events.6.d: "Avignon steht seit 1309, als das Papsttum dort seinen Sitz nahm, als päpstliche Enklave innerhalb provenzalischen Gebiets. Als Papst Gregor XI. 1377 nach Rom zurückkehrte, blieb die Stadt als päpstliches Bollwerk zurück und trieb einen Keil in provenzalisches Land, den der Graf der Provence lange verübelt hat. Nun, mit geordneten Beziehungen zum Papsttum, ist die Gelegenheit gekommen, die Frage Avignons friedlich zu lösen. Der Papst willigt ein, Avignon gegen angemessene Entschädigung an die Provence abzutreten."
 pro_events.6.a: "Avignon gehört der Provence"
