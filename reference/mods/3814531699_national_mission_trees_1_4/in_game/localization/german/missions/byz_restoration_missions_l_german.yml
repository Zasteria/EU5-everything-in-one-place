l_german:
 byz_restoration_mission_pack: "Die Wiederherstellung des Römischen Reiches"
 byz_restoration_mission_pack_desc: "Gewinne Konstantinopel zurück, nimm Anatolien und den Balkan wieder ein, vereine die vier Patriarchate, triumphiere in Rom und stelle die größte Ausdehnung des alten Römischen Reiches wieder her."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Stelle die Gebiete des Römischen Reiches wieder her."
 byz_restoration_mission_pack_DESCRIPTION:0 "Rette das bröckelnde Reich und stelle seinen einstigen Glanz wieder her. Als Erbe des Vermächtnisses Roms bringe die alten Lande des Ostens und des Westens noch einmal unter das kaiserliche Banner."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Baue das Byzantinische Reich vom Rand des Zusammenbruchs wieder auf und stelle die Mittelmeerwelt, die einst Rom beherrschte, in dein Reich zurück. Mach den Traum der Renovatio Imperii Wirklichkeit!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Gewinne als Byzanz die alten römischen Lande zurück und erreiche die Renovatio Imperii."
 byz_retake_anatolia_west: "Westanatolien zurückgewinnen"
 byz_retake_anatolia_west_desc: "Gewinne Smyrna zurück, um die kaiserliche Autorität in Westanatolien wiederherzustellen."
 byz_retake_anatolia_east: "Ostanatolien zurückgewinnen"
 byz_retake_anatolia_east_desc: "Erobere Ankara, Konya und Sivas, um ganz Anatolien unter kaiserliche Kontrolle zu bringen. Die Verwaltung der hier lebenden Völker griechischer Kultur wird einen neuen Verwaltungsansatz erfordern."
 byz_secure_greece: "Griechenland wiederherstellen"
 byz_secure_greece_desc: "Gewinne Athen und Korinth zurück und belebe Orthodoxie und griechische Kultur in Hellas neu."
 byz_balkan_dominance: "Die Beherrschung des Balkans"
 byz_balkan_dominance_desc: "Erobere Belgrad und Tarnovo, um die kaiserliche Ordnung auf dem ganzen Balkan wiederherzustellen."
 byz_invasion_of_syria: "Der Einfall in Syrien"
 byz_invasion_of_syria_desc: "Erobere die Lande Syriens, einschließlich Antiochia, eines der fünf großen Patriarchate. Uralte Handelswege und reiche Erzeugungszentren werden dem Reich neuen Wohlstand bringen."
 byz_protect_jerusalem: "Der Schutz Jerusalems"
 byz_protect_jerusalem_desc: "Gewinne das Heilige Land zurück, wo Christus litt. Der römische Kaiser trägt die Pflicht als Hüter der heiligen Stätten. Errichte eine tolerante Herrschaft, damit Völker vieler Glaubensrichtungen in Frieden in diesem Land leben können."
 byz_dominion_of_aegyptus: "Die Herrschaft über Ägypten"
 byz_dominion_of_aegyptus_desc: "Sichere Alexandria und Kairo, die großen Sitze der Gelehrsamkeit Ägyptens. Die fruchtbaren Lande des Nils werden die vielen Völker des Reiches ernähren."
 byz_control_aegean: "Die Beherrschung der Ägäis"
 byz_control_aegean_desc: "Sichere Kreta und baue eine mächtige Flotte auf, um die vollständige Beherrschung der Ägäis zu halten."
 byz_retake_italy_south: "Süditalien zurückgewinnen"
 byz_retake_italy_south_desc: "Gewinne Neapel und Sizilien zurück, um einen Stützpunkt auf der italienischen Halbinsel zu begründen."
 byz_reclaim_rome: "Die Ewige Stadt zurückgewinnen"
 byz_reclaim_rome_desc: "Gewinne die Ewige Stadt Rom zurück. Die Zeit ist gekommen, da der rechtmäßige Nachfolger des Römischen Reiches die westliche Hauptstadt zurückgewinnt."
 byz_iberian_conquest: "Iberien erobern"
 byz_iberian_conquest_desc: "Erobere Toledo und Córdoba, um die alte Provinz Hispania dem Reich wiederherzustellen."
 byz_north_africa: "Nordafrika zurückgewinnen"
 byz_north_africa_desc: "Erobere Tunis, Tripolis und Algier, um die alte Provinz Africa dem Reich wiederherzustellen."
 byz_north_italy: "Norditalien"
 byz_north_italy_desc: "Erobere Venedig, Genua, Mailand und Florenz, um die italienische Halbinsel unter dem römischen Namen zu einen."
 byz_invasion_of_france: "Der Einfall in Frankreich"
 byz_invasion_of_france_desc: "Mit Norditalien und Iberien in der Hand richtet sich der Blick des Reiches auf Gallien. Erobere die gesamte Region Frankreich und vollende das Reichsgebiet im Westen."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "Die Wiederherstellung des Reiches. Von Iberien bis Gallien, von Nordafrika bis Italien, von Kleinasien bis zum Balkan und dem Heiligen Land. Erfordert 1000+ Orte und 2000+ monatliches Einkommen."
 byz_events.2.t: "Der Wohlstand Smyrnas"
 byz_events.2.d: "Smyrna und die Häfen Westanatoliens sind zurückgewonnen. Diese uralten Handelsstädte werden noch einmal zur Domäne byzantinischer Kaufleute, und der Handel in der Ägäis belebt sich neu."
 byz_events.2.a: "Den Handel in Smyrna fördern"
 byz_events.3.t: "Athen – die Wiederherstellung von Hellas"
 byz_events.3.d: "Athen und Korinth sind zurückgewonnen. Die Stadt des Sokrates und Platon, der Hügel, auf dem der Parthenon steht, sind wieder byzantinisch. Orthodoxe Klöster werden wiederaufgebaut, und griechische Gelehrsamkeit belebt sich neu."
 byz_events.3.a: "Orthodoxie und griechische Kultur in Hellas wiederherstellen"
 byz_events.7.t: "Süditalien zurückgewonnen"
 byz_events.7.d: "Neapel und Palermo sind zurückgewonnen. Diese Lande, einst als Großgriechenland blühend, sind wieder Teil des Römischen Reiches. Der Reichtum des Mittelmeerhandels fließt in die kaiserliche Schatzkammer."
 byz_events.7.a: "Süditalien in das Reich eingliedern"
 byz_events.8.t: "Die Ewige Stadt – der Einzug in Rom"
 byz_events.8.d: "Rom – Stadt der sieben Hügel, Ort des Märtyrertods von Petrus und Paulus – ist zurückgewonnen. Wie einst Konstantin der Große das Reich von diesem Ort aus regierte, so sitzt nun wieder ein römischer Kaiser in Rom. Die Geschichte hat sich vollendet."
 byz_events.8.a: "Die Ewige Stadt zur westlichen Hauptstadt machen"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "Die Wiederherstellung des Römischen Reiches. Von Iberien bis Kleinasien, von Nordafrika bis zum Balkan, von Italien bis zum Heiligen Land. Was Justinian der Große von 527 bis 565 verfolgte, wovon durch das ganze Mittelalter geträumt wurde – die Wiederherstellung des Römischen Reiches ist endlich Wirklichkeit geworden. Das Mittelmeer ist wieder Mare Nostrum."
 byz_events.10.a: "Der Welt die Renovatio Imperii verkünden"
 byz_renovatio_unlock_tt: "Renovatio Imperii erreicht."
 byz_reclaim_bursa: "Bursa zurückgewinnen"
 byz_reclaim_bursa_desc: "Gewinne Bursa zurück, einst eine bedeutende byzantinische Stadt. An einem Schlüsselpunkt der Seidenstraße gelegen, ist die künftige Ausrichtung des Gewerbes dieser Stadt der Entscheidung des Reiches überlassen."
 byz_avoid_collapse: "Den Zusammenbruch abwenden"
 byz_avoid_collapse_desc: "Das Reich schwankt am Rand des Zusammenbruchs. Doch wenn Legitimität und innere Stabilität bewahrt werden können, ist der Weg zur Wiederherstellung noch nicht verschlossen."
 byz_events.20.t: "Die Zukunft Bursas"
 byz_events.20.d: "In den Werkstätten Bursas debattieren die Handwerker über einen neuen Weg der Erzeugung. Sollen sie auf der langen Tradition der Stadt in der Seidenweberei aufbauen, oder sich auf die Erzeugung feineren Stoffs konzentrieren? Die Entscheidung des Reiches wird die Zukunft der Stadt gestalten."
 byz_events.20.a: "Die Seidenproduktion fördern"
 byz_events.20.b: "Sich auf die Erzeugung feinen Stoffs konzentrieren"
 byz_events.21.t: "Die Zukunft Nikomedias"
 byz_events.21.d: "Nikomedia, die Schlüsselstadt am südlichen Ufer des Marmarameers, ist zum Reich zurückgekehrt. Der Hof debattiert, welches Gewerbe die Zukunft dieser Stadt bestimmen soll: die Förderung der Waffenerzeugung oder die Pflanzung von Maulbeerbäumen zum Beginn der Seidenproduktion."
 byz_events.21.a: "Die Waffenerzeugung fördern"
 byz_events.21.b: "Maulbeerbäume pflanzen und mit der Seidenproduktion beginnen"
 byz_reclaim_nicomedia: "Nikomedia zurückgewinnen"
 byz_reclaim_nicomedia_desc: "Nikomedia (Izmit) ist eine Schlüsselstadt am südlichen Ufer des Marmarameers. Wandle seine Rohstoffproduktion in Seide um und baue die Seidenwirtschaft des Reiches wieder auf. Die Sicherung von 50%+ Kontrolle markiert den ersten Schritt zur Wiederherstellung des Römischen Reiches."
 byz_orthodox_antioch: "Antiochia orthodoxieren"
 byz_orthodox_antioch_desc: "Bestätige, dass eine Mehrheit der Bevölkerung Antiochias zur Orthodoxie übergetreten ist. Die Stadt, in der der Name „Christ“ zuerst gebraucht wurde, soll noch einmal mit orthodoxem Licht erfüllt sein."
 byz_orthodox_jerusalem: "Jerusalem orthodoxieren"
 byz_orthodox_jerusalem_desc: "Bestätige, dass eine Mehrheit der Bevölkerung Jerusalems zur Orthodoxie übergetreten ist. Die Glocken der Grabeskirche läuten mit orthodoxer Liturgie."
 byz_orthodox_alexandria: "Alexandria orthodoxieren"
 byz_orthodox_alexandria_desc: "Bestätige, dass eine Mehrheit der Bevölkerung Alexandrias zur Orthodoxie übergetreten ist. Die Traditionen der koptischen Kirche werden in den orthodoxen Strom eingegliedert."
 byz_orthodox_rome: "Das Ende des Großen Schismas"
 byz_orthodox_rome_desc: "Bestätige, dass eine Mehrheit der Bevölkerung Roms zur Orthodoxie übergetreten ist. Die Spaltung von 1054 endet – nicht durch Aussöhnung, sondern durch den orthodoxen Triumph über Rom."
 byz_hellenic_athens: "Die Wiederbelebung des Parthenon"
 byz_hellenic_athens_desc: "Athen ist die Stadt der Athene. Noch einmal werden auf der Akropolis Opfergaben den olympischen Göttern dargebracht, und die Wiederbelebung des hellenischen Glaubens beginnt hier."
 byz_hellenic_corinth: "Das Heiligtum des Poseidon in Korinth"
 byz_hellenic_corinth_desc: "Auf dem Isthmus von Korinth besaß Poseidon – Hüter der beiden Meere – einst einen großen Tempel. Stelle dieses Heiligtum wieder her und ziehe den Segen des Meeresgottes zum Reich."
 byz_hellenic_mystras: "Das Heiligtum des Apollon in Mystras"
 byz_hellenic_mystras_desc: "Mystras nahe Sparta ist das geistliche Herz des Peloponnes. Stelle das Heiligtum des Apollon hier wieder her und erwecke den kühnen Geist Spartas, das Andenken an das Orakel von Delphi weitertragend."
 byz_hellenic_alexandria: "Der Wiederaufbau des Serapeions"
 byz_hellenic_alexandria_desc: "Das Serapeion von Alexandria war einst einer der größten Tempel der antiken Welt. Serapis geweiht – geboren aus der Verschmelzung griechischer und ägyptischer Religion – begründet sein Wiederaufbau die hellenische Religion in Ägypten und vereint noch einmal die Weisheit der antiken Welt."
 byz_events.11.t: "Antiochia – Rückkehr zur ersten Kirche"
 byz_events.11.d: "Antiochia, wo der Name „Christ“ zuerst gebraucht wurde, ist nun mit orthodoxem Licht erfüllt. Die Erinnerung an das Wirken von Petrus und Paulus hier ist wiederbelebt, und die Stadt nimmt eine neue Sendung als geistliches Zentrum der Orthodoxie an."
 byz_events.11.a: "Antiochia unter orthodoxe Obhut stellen"
 byz_events.12.t: "Jerusalem – Orthodoxe Glocken in der Heiligen Stadt"
 byz_events.12.d: "Die Heilige Stadt Jerusalem, ersehnt von allen orthodoxen Gläubigen, ist zu einer orthodoxen Stadt geworden. Die Grabeskirche läutet wieder mit östlicher Liturgie. Dies ist nicht bloß Eroberung – es ist der Triumph des Glaubens."
 byz_events.12.a: "Das Heilige Land für immer bewachen"
 byz_events.13.t: "Alexandria – die Orthodoxisierung der Stadt der Gelehrsamkeit"
 byz_events.13.d: "Alexandria, Schatzkammer antiken Wissens, ist zu einer orthodoxen Stadt geworden. Die alten Traditionen der koptischen Kirche verschmelzen mit dem größeren orthodoxen Strom, und der Dialog zwischen neuplatonischer Philosophie und Theologie beginnt wieder zu erblühen."
 byz_events.13.a: "Alexandria als Stadt orthodoxer Gelehrsamkeit entwickeln"
 byz_events.14.t: "Das Ende des Großen Schismas – die Einheit der Kirchen"
 byz_events.14.d: "Seit 1054, als Papst Leo IX. und Patriarch Kerularios einander exkommunizierten, sind Jahrhunderte vergangen. Nicht durch Aussöhnung, sondern durch orthodoxe Eroberung Roms – das Große Schisma endet. Eine Mehrheit der Bürger Roms ist zur Orthodoxie übergetreten. Die Ewige Stadt wird zur westlichen Säule der Ostkirche. Die Geschichte hat den byzantinischen Glauben gewählt."
 byz_events.14.a: "Der Welt das Ende des Großen Schismas verkünden"
 byz_events.15.t: "Der Parthenon – die Wiedererweckung der Athene"
 byz_events.15.d: "Noch einmal werden auf der Akropolis Opfergaben der Athene dargebracht. Der Parthenon, der eine christliche Kirche geworden war, wird als Tempel der alten Götter wiederhergestellt. Das Volk Athens ruft die olympischen Götter beim Namen an, und die Flamme des Hellenismus wird neu entfacht."
 byz_events.15.a: "Das Reich unter dem Schutz der Athene lenken"
 byz_events.16.t: "Korinth – Poseidon der Meerengen"
 byz_events.16.d: "Auf dem Hügel Korinths, der über zwei Meere blickt, wird der Tempel des Poseidon wiederhergestellt. Der Gott des Isthmus hat lange Kaufleute und Seeleute beschützt. Mit der Wiederherstellung seiner Riten wird Korinth noch einmal zum geistlichen Zentrum des Mittelmeerhandels."
 byz_events.16.a: "Den Handel mit Poseidons Segen gedeihen lassen"
 byz_events.17.t: "Delos – die Geburtsstätte des Gottes des Lichts"
 byz_events.17.d: "Auf der heiligen ägäischen Insel Delos, verehrt als Geburtsort von Apollon und Artemis, wird der uralte Tempel wiederaufgebaut. Pilger und Priester versammeln sich aus der ganzen Ägäis, und der Geist antiker griechischer Vernunft und Schönheit wird wiederbelebt. Das neuplatonische Reich, von dem Plethon träumte, beginnt Gestalt anzunehmen."
 byz_events.17.a: "Das Reich mit dem Glanz von Delos erleuchten"
 byz_events.18.t: "Das Serapeion – die Vollendung der hellenischen Wiedererweckung"
 byz_events.18.d: "Alexandria – in diesem Land, wo einst das Serapeion stand, ist der Glaube an die hellenischen Götter zurückgekehrt.\n\nMit dem vollendeten Wiederaufbau des Tempels steigen die Götter des Olymp noch einmal auf das große Land am Nil herab. Die Bürger Alexandrias nehmen die alten Riten wieder auf, und Gebete an Serapis hallen durch den Morgenhimmel.\n\nDiese heilige Wiedererweckung sendet Wellen hellenischen Glaubens durch das ganze Byzantinische Reich – neue Bekehrte treten nacheinander hervor, die Macht der Vorzeichen wächst, und der religiöse Einfluss steigt. Zeus, Apollon, Athene – alle Götter segnen die Wiederherstellung des Reiches."
 byz_events.18.a: "Das Serapeion zur heiligen Stadt der hellenischen Welt machen"
 byz_faith_choice: "Die Wahl des Glaubens"
 byz_faith_choice_desc: "Ein neues Zeitalter der Ideen bricht an. Am Hof zu Mystras wird über neuplatonische Lehren debattiert, während in Konstantinopel die Autorität der orthodoxen Kirche infrage gestellt wird. Das Reich steht an einem geistlichen Scheideweg."
 byz_faith_orthodox_chosen_tt: "Orthodoxie gewählt"
 byz_faith_hellenic_chosen_tt: "Hellenismus gewählt"
 byz_events.19.t: "Der Scheideweg des Glaubens – Orthodoxie oder Hellenismus"
 byz_events.19.d: "Griechenland ist zurückgewonnen. Von der Akropolis Athens aus ist Konstantinopel in der Ferne zu sehen, und die Ruinen antiker Tempel schlafen in den Gipfeln des Peloponnes. Die Wiederherstellung des Byzantinischen Reiches ist nicht bloß die Wiedergewinnung von Gebiet – sie ist der Wiederaufbau einer Seele. Zwei Stimmen streiten am kaiserlichen Hof. Die eine gehört dem Klerus: „Wir sind das Volk Christi. Wir müssen das Reich als Hüter der orthodoxen Kirche wiederaufbauen.“ Die andere gehört hellenischen Philosophen: „Warum einen fremden Gott im Land Platons und Aristoteles’ verehren? Die alten griechischen Götter sind die wahre Heimat unserer Seelen.“"
 byz_events.19.a: "Die orthodoxe Kirche bewahren – die östliche Tradition schützen"
 byz_events.19.a.tt: "Der orthodoxe Glaubenszweig ist freigeschaltet. Fahre fort zu den Missionen zur Orthodoxisierung von Antiochia, Jerusalem, Alexandria und Rom."
 byz_events.19.b: "Die alten Götter wiederbeleben – die hellenische Flamme neu entfachen"
 byz_events.19.b.tt: "Der hellenische Zweig ist freigeschaltet. Das Reich tritt zum Hellenismus über, und Missionen zur Wiederherstellung von Heiligtümern in Athen, Korinth, Mystras und Alexandria werden verfügbar."
 byz_orthodox_path_start: "Der orthodoxe Pfad"
 byz_orthodox_path_start_desc: "Der Pfad des orthodoxen Hüters ist offen. Fahre fort, die heiligen Städte zurückzugewinnen und zu orthodoxisieren."
 byz_hellenic_path_start: "Der hellenische Pfad"
 byz_hellenic_path_start_desc: "Der Pfad der alten Götter ist offen. Stelle die Heiligtümer von Hellas wieder her und baue die antike griechische Zivilisation wieder auf."
 byz_recovery_from_decline: "Erholung vom Niedergang"
 byz_recovery_from_decline_desc: "Beschneide die Macht des Hofadels und stelle die Autorität der Krone wieder her. Während sich die kaiserliche Autorität erholt, wird Stabilität in der Regierung folgen."
 byz_city_the_world_desires: "Die Stadt der Sehnsucht der Welt"
 byz_city_the_world_desires_desc: "Konstantinopel ist noch einmal zu einer großen Stadt herangewachsen, die Menschen aus der ganzen Welt zu sehen ersehnen. Lass diesen Wohlstand dauerhaft werden."
 byz_islamic_heartland: "Das Herzland des Islam"
 byz_islamic_heartland_desc: "Mekka und Medina, die zwei heiligsten Städte des Islam, sind in unsere Hände gefallen. Das Reich muss nun eine folgenschwere Entscheidung über das Schicksal dieser heiligen Stätten treffen."
 byz_events.22.t: "Die heiligen Stätten des Islam"
 byz_events.22.d: "Die Kaaba von Mekka und die Prophetenmoschee von Medina – die heiligsten Stätten der islamischen Welt – liegen nun unter kaiserlicher Kontrolle. Sollen sie zerstört werden, um die Vorherrschaft der Orthodoxie zu zeigen, oder angenommen werden, damit das Reich vom Reichtum der Pilger profitiert?"
 byz_events.22.a: "Die heiligen Stätten zerstören"
 byz_events.22.b: "Die heiligen Stätten annehmen"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Westanatolien wiederhergestellt"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Die vielfältigen Völker Westanatoliens werden allmählich in die Kultur des Reiches eingegliedert."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Ostanatolien"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Die vielfältigen Völker Ostanatoliens werden allmählich in die Kultur des Reiches eingegliedert."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Hellas wiederhergestellt"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Athen, Thessaloniki, der Peloponnes – das Kernland der antiken griechischen Zivilisation und der byzantinisch-griechischen Kultur. Diese Lande zurückzugewinnen, nach lateinischer Herrschaft (dem fränkischen Herzogtum Athen und anderen), der Plünderung durch die Katalanische Kompanie und der Eroberung durch die Osmanen, ist die Erfüllung des tausendjährigen Traums eines wiederbelebten „Hellenismus“."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Balkanordnung"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Die Manneskraft und militärische Stärke des Balkans sind verstärkt."
 STATIC_MODIFIER_NAME_byz_syria_province: "Die Provinz Syrien"
 STATIC_MODIFIER_DESC_byz_syria_province: "Syrien war seit der Antike als westliches Ende der Seidenstraße ein Zentrum von Handel und Handwerk. Damaszener Stahl, Aleppo-Seife, syrisches Glaswerk – diese berühmten Waren wurden in die gesamte Mittelmeerwelt ausgeführt. Im 4. bis 7. Jahrhundert war sie auch die reichste Provinz des Byzantinischen Reiches und brachte gewaltige Steuereinnahmen."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Die Provinz Judäa"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Die Verwaltung Judäas, Heimat des Heiligen Landes, fördert größere Toleranz gegenüber den vielen Glaubensrichtungen des Reiches."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Die Provinz Ägypten"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "Die fruchtbaren Lande des Nils erlauben dem Reich, eine größere Bevölkerung in all seinen Gebieten zu erhalten."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Beherrschung der Ägäis"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "In den Häfen der Ägäischen Inseln legen die Kriegsschiffe und Handelsschiffe des Reiches unablässig an, und das Meer ist wieder einmal „unser Meer“ geworden."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Die Ewige Stadt wiederhergestellt"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Als das Banner von Byzanz noch einmal über den sieben Hügeln wehte, wusste der Hof zu Konstantinopel, dass das Reich endlich seinen Gipfel erreicht hatte."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Die Provinz Hispania"
 STATIC_MODIFIER_DESC_byz_hispania_province: "Die weiten Lande Hispaniens entsenden viele Soldaten, um die Reihen des kaiserlichen Heeres zu mehren."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Die Provinz Gallien"
 STATIC_MODIFIER_DESC_byz_gallia_province: "Die römischen Adler fliegen noch einmal über den Ebenen Galliens, und die Soldaten an den Ufern der Loire marschieren stolz für einen Kaiser fern im Osten."
 STATIC_MODIFIER_NAME_byz_true_rome: "Wahres Rom"
 STATIC_MODIFIER_DESC_byz_true_rome: "Die Segel und Wagen der Kaufleute von Venedig, Genua und Mailand treiben nun ihren Handel unter dem Banner des Kaisers. Die italienische Halbinsel ist nicht mehr ein Zweig Roms, sondern sein Stamm."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "Das Römische Reich vollständig wiederhergestellt – die Straßen, von denen Justinian träumte, binden noch einmal jeden Winkel des Reiches, und die Kuriere des Kaisers reiten ungehindert zu den fernen Ufern des Mittelmeers."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Zusammenbruch abgewendet"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "Das Reich ist noch nicht gefallen. Nachdem er die Krise überstanden hat, erleichtert der Hof die Last, den Mächtigen Privilegien zu entziehen, und mindert den Widerstand gegen solche Reformen."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Bursas Seidenhandel"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "In den Maulbeerhainen Bursas verstummt das Geräusch spinnender Seidenraupen in den Frühlingsnächten nie."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Bursas Feinstoffhandel"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "Aus den Webstühlen der Werkstätten Bursas kommen einer nach dem anderen die feinen Stoffe, um die die Höflinge wetteifern."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Nikomedias Waffenhandel"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "In den Schmieden Nikomedias klingen Tag und Nacht die Hämmer, und Schwerter und Rüstungen für das kaiserliche Heer türmen sich hoch."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Nikomedias Seidenhandel"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Junge Maulbeerbäume sind auf den Hügeln um Nikomedia gepflanzt und warten auf den Tag, an dem die Stadt als Heimat der Seide berühmt sein wird."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Hellenisches Heiligtum"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "Noch einmal werden im Heiligtum der alten Götter Opfergaben dargebracht, und die Füße der Pilger nutzen die Pflastersteine ab."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "Das Serapeion"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "Mit dem Wiederaufbau des Serapeions ist Alexandria zum geistlichen Zentrum der antiken Welt geworden, und Gelehrte wie Pilger versammeln sich vor seinen Toren."
 STATIC_MODIFIER_NAME_byz_schism_ended: "Das Ende des Großen Schismas"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Jahrhunderte nach den gegenseitigen Exkommunikationen von 1054 haben sich die Kirchen des Ostens und des Westens endlich durch den Triumph der Orthodoxie um einen einzigen Altar versammelt."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Die heiligen Stätten zerstört"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "Die Zerstörung der islamischen heiligen Stätten hat die Vorherrschaft der Orthodoxie machtvoll bewiesen und den Glauben an die Staatsreligion sowie das Ansehen des Reiches gestärkt."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Die heiligen Stätten angenommen"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "Durch die Annahme der islamischen heiligen Stätten ist die Toleranz gegenüber Häretikern und Heiden gewachsen, und das kaufmännische Treiben ist inmitten des Zustroms der Pilger erblüht."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Erholung vom Niedergang"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "Die dunkle Jahreszeit des Niedergangs ist vergangen, und das Morgenlicht scheint wieder auf den Hof des Kaisers und die Felder des Reiches."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "Die Stadt der Sehnsucht der Welt"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Konstantinopel als Verwaltungszentrum des Reiches wiederaufgebaut."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Die Provinz Afrika"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "Die kaiserliche Flotte ist zum Hafen von Karthago zurückgekehrt, und der Traum aus Justinians Zeitalter zeichnet sich noch einmal auf dem Meer ab."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "Der Ruhm der Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "Die Wiederherstellung des Römischen Reiches erkannte Byzanz als Herrn eines Weltreiches an."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Die Orthodoxie Antiochias"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Antiochia als orthodoxe heilige Stätte wiederhergestellt, was die religiöse Autorität des Reiches erhöht."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Die Orthodoxie Jerusalems"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "Die Heilige Stadt Jerusalem orthodoxisiert, was Vorteile im Kampf gegen Heiden gewährt."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Die Orthodoxie Alexandrias"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "Orthodoxer Gesang erklingt in den Kirchen Alexandrias, und die Märkte quellen über von den Familien der Gläubigen."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Das Serapeion wiederhergestellt"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "Das Serapeion von Alexandria ist wiederaufgebaut, und die Götter des Olymp steigen noch einmal auf das Land Ägyptens herab."
