l_german:
 mon_montferrat_mission_pack: "Der Palaiologos-Ehrgeiz und Herr Italiens"
 mon_montferrat_mission_pack_DESCRIPTION:0 "Im Jahr 1337 wird die Markgrafschaft Montferrat von einem Herrn regiert, in dessen Adern das Blut der byzantinischen Palaiologen-Dynastie fließt. Beanspruche Thessaloniki und marschiere ostwärts nach Konstantinopel, oder schmiede mit Diplomatie und dem Schwert der Condottieri ein Reich in Norditalien – zwei Ambitionen brennen in einem Herrscher."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "Östlicher Traum oder westliche Herrschaft – das Blut der Palaiologen öffnet beide Wege."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "Nutze das Blut der Palaiologen, um Italien und Griechenland zu erobern."
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "Von Thessaloniki bis Athen unter dem Namen Palaiologos, von Casale bis Genua durch Stahl und Münze – erobere Ost und West!"
 mon_palaiologos_ambition: "Der Palaiologos-Ehrgeiz"
 mon_palaiologos_ambition_desc: "Der Herrscher von Montferrat trägt palaiologisches Blut. Zwei Ambitionen brennen: nach Osten zu Thessaloniki, oder nach Westen zur italienischen Herrschaft."
 mon_claim_thessaloniki: "Anspruch auf Thessaloniki"
 mon_claim_thessaloniki_desc: "Beanspruche Thessaloniki – einst Byzanz’ zweite Stadt – als Stützpunkt für östliche Ambitionen."
 mon_seize_thessaloniki: "Thessaloniki einnehmen"
 mon_seize_thessaloniki_desc: "Nimm Thessaloniki ein und pflanze das Palaiologen-Banner auf den Weißen Turm."
 mon_conquer_macedonia: "Die Eroberung Makedoniens"
 mon_conquer_macedonia_desc: "Erobere Makedonien – das Tor zu Griechenland und Geburtsland Alexanders des Großen."
 mon_northern_greece: "Nordgriechenland"
 mon_northern_greece_desc: "Sichere Nordgriechenland als Fundament für weitere Ausdehnung."
 mon_conquer_morea: "Die Eroberung der Morea"
 mon_conquer_morea_desc: "Erobere die Morea und Athen – das Herz der antiken griechischen Zivilisation."
 mon_aegean_control: "Die Ägäis beherrschen"
 mon_aegean_control_desc: "Nimm die Ägäischen Inseln ein, um Montferrats maritime Reichweite auszudehnen."
 mon_new_byzantium: "Das Neue Byzanz"
 mon_new_byzantium_desc: "Beanspruche das byzantinische Erbe und werde als Nachfolger Ostroms anerkannt."
 mon_secure_piedmont: "Piemont sichern"
 mon_secure_piedmont_desc: "Sichere Piemont als Fundament für die norditalienische Vorherrschaft."
 mon_casale_capital: "Casale Monferrato"
 mon_casale_capital_desc: "Entwickle Casale Monferrato zu einer Hauptstadt, die der Markgrafschaft würdig ist."
 mon_rival_savoy: "Rivale Savoyen"
 mon_rival_savoy_desc: "Wirke Savoyen entgegen – dem Rivalen um die piemontesische Vorherrschaft – und begründe die Vorherrschaft."
 mon_control_lombardy: "Die Lombardei beherrschen"
 mon_control_lombardy_desc: "Erobere die Lombardei – das Herz Norditaliens."
 mon_seize_genoa: "Genua einnehmen"
 mon_seize_genoa_desc: "Nimm Genua – La Superba – ein und gewinne Zugang zum Mittelmeerhandel."
 mon_north_italy_trade: "Norditalienisches Handelsreich"
 mon_north_italy_trade_desc: "Errichte ein Handelsreich, das Lombardei, Ligurien und Venetien umspannt."
 mon_emilia: "Die Eroberung Emilias"
 mon_emilia_desc: "Erobere das fruchtbare Südufer des Po-Tals – Bologna, Parma und Modena."
 mon_king_of_italy: "König von Italien"
 mon_king_of_italy_desc: "Verkünde den König von Italien, nachdem du Lombardei, Ligurien und Emilia geeint hast."
 mon_hre_relations: "Beziehungen zum Heiligen Römischen Reich"
 mon_hre_relations_desc: "Bestimme das Verhältnis zum Heiligen Römischen Reich – Verbündeter, Rivale oder Führer."
 mon_dev_casale: "Casale – Stadt der Gelehrsamkeit und des Reichtums"
 mon_dev_casale_desc: "Verwandle Casale in eine Stadt der Gelehrsamkeit und des Reichtums, in der sich Renaissance und byzantinisches Erbe vereinen."
 mon_renaissance_court: "Renaissancehof"
 mon_renaissance_court_desc: "Errichte einen Renaissancehof, an dem byzantinisches klassisches Wissen mit italienischer künstlerischer Innovation verschmilzt."
 mon_mercenary_tradition: "Die Condottiere-Tradition"
 mon_mercenary_tradition_desc: "Baue die Condottiere-Tradition auf – Montferrats söldnerisches militärisches Erbe."
 mon_papal_alliance: "Bündnis mit dem Papst"
 mon_papal_alliance_desc: "Verbünde dich mit dem Papst, um Montferrats Ambitionen in ganz Italien zu legitimieren."
 mon_tuscany: "Die Eroberung der Toskana"
 mon_tuscany_desc: "Erobere die Toskana – Heimat der medizeischen Renaissancekultur – und rücke gegen Rom vor."
 mon_veneto: "Die Eroberung Venetiens"
 mon_veneto_desc: "Erobere Venetien einschließlich Venedigs, um die norditalienische Vorherrschaft zu vollenden."
 mon_byzantine_heritage: "Byzantinisches Erbe"
 mon_byzantine_heritage_desc: "Beanspruche das volle byzantinische Erbe – in griechischer Kultur und Orthodoxie gewinnst du größeren Lohn."
 mon_navy_adriatic: "Adriatische Flotte"
 mon_navy_adriatic_desc: "Baue eine mächtige adriatische Flotte auf, die genuesische und venezianische Seemacht vereint."
 mon_southern_italy: "Süditalien"
 mon_southern_italy_desc: "Dringe nach Süditalien vor und nimm Neapel ein, um die italienische Halbinsel zu vereinen."
 mon_marquis_of_italy: "Großmarkgraf von Italien"
 mon_marquis_of_italy_desc: "Herrsche als Großmarkgraf von Italien – Ost und West, Nord und Süd vereinend."
 mon_new_roman_empire: "Neues Römisches Reich"
 mon_new_roman_empire_desc: "Verkünde das Neue Römische Reich – Nachfolger sowohl des östlichen als auch des westlichen Rom."
 mon_events.10.t: "Thessaloniki eingenommen – das Palaiologen-Banner über dem Weißen Turm"
 mon_events.10.d: "Thessaloniki – einst die zweite Stadt des Byzantinischen Reiches – fällt nun an Montferrat. Der Herrscher mit palaiologischem Blut beginnt, östliche Ambitionen Wirklichkeit werden zu lassen. Die Glocken des Weißen Turms läuten – ein neues Zeitalter hat begonnen."
 mon_events.10.a: "Es lebe Thessaloniki! Unter dem Palaiologen-Banner!"
 mon_events.20.t: "König von Italien – Triumph von Casale bis zur Heiligen Stadt"
 mon_events.20.d: "„König von Italien“ – Montferrat, nachdem es Lombardei, Ligurien und Emilia geeint hat, wird zum neuen Herrn der italienischen Halbinsel erklärt. Jubel hallt durch den Hof von Casale."
 mon_events.20.a: "Es lebe der König von Italien!"
 mon_events.50.t: "Die Geburt des Neuen Byzanz – der Palaiologen-Traum verwirklicht"
 mon_events.50.d: "„Palaiologen-Kaiser – Nachfolger Roms und Konstantinopels“ – Montferrat erbt den byzantinischen Namen. Die Reise von einer kleinen norditalienischen Markgrafschaft hat ihren Weg zur Beherrschung des östlichen Mittelmeers begonnen."
 mon_events.50.a: "Es lebe der Palaiologen-Kaiser! Es lebe das Neue Byzanz!"
 mon_events.60.t: "Großmarkgraf von Italien – Herrschaft am Kreuzungspunkt von Ost und West"
 mon_events.60.d: "Von Casale Monferrato bis Genua, Florenz, Neapel – das Montferrat-Reich ist geboren. Renaissancekunst, byzantinischer Geist, das Schwert der Condottieri – drei Mächte verschmolzen, um den Herrn Italiens zu erschaffen."
 mon_events.60.a: "Es lebe der Großmarkgraf von Italien!"
 mon_events.99.t: "Neues Römisches Reich – Einiger von Ost und West"
 mon_events.99.d: "„Palaiologen-Kaiser – Nachfolger von Ost- und Westrom, König von Italien, Herr von Griechenland“ – dieser Titel hallt über die Mittelmeerwelt. Der Ehrgeiz, der 1337 im kleinen Hof Casales keimte, gipfelt nun im Aufbau eines Weltreiches. Der Name Roms ist wiederhergestellt."
 mon_events.99.a: "Es lebe das Neue Römische Reich! Es lebe ewiger Ruhm!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Palaiologos"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "Die Blutlinie der Palaiologen erweckt Montferrats Ambitionen nach Osten und Westen."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Anspruch auf Thessaloniki"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Thessaloniki winkt – bald wird das Palaiologen-Banner über der Ägäis wehen."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Makedonien"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Makedonien ist erobert – das Tor zu Griechenland und Geburtsland Alexanders des Großen."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Nordgriechenland"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Nordgriechenland ist gesichert als Fundament für weitere Ausdehnung nach Süden."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Morea"
 STATIC_MODIFIER_DESC_mon_morea_mod: "Die Morea und Athen sind erobert – das Herz der antiken griechischen Zivilisation wiederhergestellt."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Ägäis"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Ägäische Inseln sind eingenommen und dehnen Montferrats maritime Reichweite ins Mittelmeer aus."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Piemont"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Piemont ist gesichert – die Aufgebote Norditaliens marschieren nun unter Montferrats Banner."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Casale"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Casale Monferrato schlägt als kaufmännisches Herz der Markgrafschaft."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Savoyen"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Savoyen – der Rivale um die piemontesische Vorherrschaft – ist entgegengetreten und unterdrückt."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Lombardei"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Die Lombardei – das Herz Norditaliens – fällt unter Montferrats Kontrolle."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Genua"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "La Superba Genua ist eingenommen – die Tür zum Mittelmeerhandel schwingt auf."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Handel"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Ein Handelsreich, das Lombardei, Ligurien und Venetien umspannt, ist errichtet."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Emilia"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "Das fruchtbare Südufer des Po-Tals – Bologna, Parma, Modena – ist erobert."
 STATIC_MODIFIER_NAME_mon_hre_mod: "HRR"
 STATIC_MODIFIER_DESC_mon_hre_mod: "Das Verhältnis zum Heiligen Römischen Reich ist bestimmt – Montferrat gewinnt diplomatisches Ansehen."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Casale entwickelt"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Casale tritt in sein goldenes Zeitalter der Gelehrsamkeit und des Reichtums ein – das kulturelle Leuchtfeuer Norditaliens."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Renaissance"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Ein Renaissancehof ist errichtet – byzantinisches klassisches Wissen verschmilzt mit italienischer künstlerischer Innovation."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Condottieri"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Die Condottieri Montferrats sind zur Legende geworden – Elitesoldaten versammeln sich unter ihren Bannern und haben die Schlachtfelder Italiens beherrscht."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Papst"
 STATIC_MODIFIER_DESC_mon_papal_mod: "Der Segen des Papstes legitimiert Montferrats Ambitionen auf der ganzen italienischen Halbinsel."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Toskana"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Die Toskana – Heimat der medizeischen Renaissancekultur – ist erobert und gesichert."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Venetien"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "Venetien einschließlich Venedigs ist erobert – die norditalienische Vorherrschaft ist vollendet."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Erbe"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "Das volle byzantinische Erbe ist beansprucht – Bürokratie, Aquädukte und Legitimität fließen aus dem antiken Rom."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Marine"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Eine mächtige adriatische Flotte, die genuesische und venezianische Seemacht vereint, ist errichtet."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Süditalien"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Süditalien und Neapel sind eingenommen – die italienische Halbinsel unter einem Banner geeint."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Markgraf"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "Der Großmarkgraf von Italien herrscht – Ost und West, Nord und Süd vereinend."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Neu-Rom"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "Das Neue Römische Reich ist verkündet – Nachfolger sowohl des östlichen als auch des westlichen Rom."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "Die Carta di Franchigia – die „Freiheitscharta“. Der Markgraf von Montferrat gewährt jeder Stadt Autonomie und Privilegien und schafft fruchtbaren Boden, auf dem Kaufleute, Bauern und Bürger gedeihen können. Wie einst Casale unter solch einer Charta blühte, wird die ganze Markgrafschaft von ihrem Segen profitieren."
 mon_carta_di_franchigia_unlock_tt: "Das Stadtprivileg „Carta di Franchigia“ wird verfügbar."
 mon_acqui_terme: "Die Entwicklung von Acqui Terme"
 mon_acqui_terme_desc: "Acqui Terme – seit der römischen Antike als „Stadt der Thermalquellen“ bekannt. Stelle seine berühmten Wasser wieder her. Die Heilquellen, einst von römischen Kaisern besucht, werden zu Montferrats neuem Stolz und zu einer Stadt der Gesundheit wiedergeboren, die Besucher von fern anzieht."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Acqui Terme wiederhergestellt"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Die antiken römischen Thermalquellen sind wiederhergestellt – Acqui wiedergeboren als Stadt der Gesundheit und des Wohlstands."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "Das schwindende Licht von Byzanz"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "Das byzantinische Erbe erleuchtet Montferrat – seine Legitimität beginnt still zu steigen."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "Die Majestät des Neuen Byzanz"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "Der Palaiologen-Traum verwirklicht – kaiserliche Verwaltung, Seemacht und Straßennetze kristallisieren sich zu Montferrats Stärke."
