l_german:
 nap_restoration_mission_pack: "Der Weg des Königreichs Neapel"
 nap_restoration_mission_pack_DESCRIPTION:0 "Nachdem es Sizilien verloren hat, sucht das Königreich Wiedervereinigung und die Wiederherstellung seiner Macht im Mittelmeer. Unter dem Blut und Glanz des Hauses Anjou errichte ein neues Goldenes Zeitalter um Neapel."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Schließe Missionen als Königreich Neapel ab, arbeite auf die Wiedervereinigung Siziliens und die Wiederherstellung des Lateinischen Kaiserreichs hin."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um den Weg des Königreichs Neapel zu beschreiten."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "Vereine das entzweite Königreich Sizilien wieder und schreibe deinen Namen als Herr des westlichen Mittelmeers und Erbe des alten Lateinischen Kaiserreichs in die Geschichte!"
