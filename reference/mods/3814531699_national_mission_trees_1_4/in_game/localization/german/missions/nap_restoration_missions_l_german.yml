 nap_new_capital_of_sicily: "Die neue Hauptstadt des Königreichs Sizilien"
 nap_apulian_granary: "Die Kornkammer Apuliens"
 nap_mediterranean_greatest_city: "Die größte Stadt des Mittelmeers"
 nap_control_of_transumanza: "Die Kontrolle der Transumanza"
 nap_university_of_frederick_ii: "Das Wachstum der Universität Friedrichs II."
 nap_magnificent_royal_palace: "Der prächtige Königspalast"
 nap_expansion_of_naples_port: "Die Erweiterung des Hafens von Neapel"
 nap_patronage_of_diverse_arts: "Die Förderung vielfältiger Künste"
 nap_dynastic_stability: "Dynastische Stabilität"
 nap_subjugation_of_epirus: "Die Unterwerfung des Epirus"
 nap_southern_renaissance: "Die südliche Renaissance"
 nap_caserta_palace: "Der Palast von Caserta"
 nap_charles_dream: "Der Traum Karls I."
 nap_never_die_without_seeing_naples: "Neapel sehen und sterben"
 nap_latin_empire: "Das Lateinische Kaiserreich"
 nap_new_capital_of_sicily_desc: "Nachdem wir Sizilien verloren haben, haben wir Neapel als unsere neue Hauptstadt an Palermos Stelle gewählt. Diese Stadt muss zu einem Sitz entwickelt werden, der des Königreichs würdig ist."
 nap_apulian_granary_desc: "Apuliens fruchtbare Ebenen sind lange als Getreidequelle berühmt gewesen. Ihre Ernten ernähren unser Volk und bilden einen wichtigen Exportartikel des Königreichs. Apulien liegt auch Griechenland über die Straße von Otranto gegenüber, was es zu einem lebenswichtigen Vorposten macht."
 nap_control_of_transumanza_desc: "Die Transumanza, die überlieferte Wandertierhaltung, wie sie in Abruzzen und Molise praktiziert wird, bildet das wirtschaftliche Rückgrat dieser Regionen. Wenn der Staat die Tratturi verwaltet und die Hirten schützt, wird die Erzeugung von Wolle, Käse und anderen Gütern gedeihen."
 nap_patronage_of_diverse_arts_desc: "Sizilien wurde von Griechen, Karthagern, Römern, Germanen, Arabern, Normannen und Franzosen durchquert, und ihre Kulturen haben sich hier vermischt. Kunst, verwurzelt in dieser kulturellen Vielfalt, ist die wahre Kunst Siziliens."
 nap_dynastic_stability_desc: "Nie hat eine stabile Dynastie in Sizilien Wurzeln geschlagen, und dies hat wiederholt fremde Invasion herbeigerufen. Die Stabilisierung der Dynastie ist der sicherste Weg zur Stabilität Siziliens selbst."
 nap_southern_renaissance_desc: "Künstler und Gelehrte aus dem ganzen Land, angezogen von einem stabilen und würdevollen Hof, haben auch Neapel eine Renaissance gebracht – eine höfisch geführte Kultur, verschieden von der Norditaliens, erblüht nun hier."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Eine neue Hauptstadt"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Neapel ist zu einem Sitz entwickelt, der des Königreichs würdig ist, und fördert das Wachstum und die Produktivität der Stadt."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "Die Kornkammer Apuliens"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "Die fruchtbaren Lande Apuliens tragen dauerhaft die Rohstofferzeugung hier bei."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Die Kontrolle der Transumanza"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "Der Schutz der Hirten und die Verwaltung der Tratturi haben die Rohstofferzeugung hier dauerhaft erhöht."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Die Förderung vielfältiger Künste"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Künstler, verwurzelt in vielen Kulturen, haben sich am Hof versammelt und das Ansehen des Königreichs sowie seine Toleranz gegenüber anderen Glaubensrichtungen erhöht."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Dynastische Stabilität"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "Unter einer stabilen Dynastie wächst die Legitimität der Krone, und innere Unruhe lässt nach."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "Die südliche Renaissance"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Die in Neapel versammelten Künstler haben ihre Kunst verfeinert, und die Fertigkeit neuer Künstler, die in den Dienst des Königreichs treten, ist gewachsen."
 nap_divided_kingdom_desc: "1282 erhob sich das Volk Siziliens gegen die Herrschaft unseres Hauses Anjou und hieß das Haus Aragón als neuen König willkommen. Seither ist das Königreich Sizilien in zwei geteilt. Wir herrschen über das Festland um Neapel, doch die Rückgewinnung der Insel Sizilien bleibt die historische Sendung, die unserer Dynastie anvertraut ist."
 nap_papal_blessing_desc: "Seit Karl I. das Königreich Sizilien auf Einladung des Papstes eroberte, hat unsere Dynastie enge Bande zum Papsttum bewahrt. Das Vertrauen des Papstes zu bewahren ist unentbehrlich, um die Legitimität unserer Herrschaft aufrechtzuerhalten."
 nap_army_buildup_desc: "Stärke das stehende Heer des Königreichs in Vorbereitung auf den Kampf zur Rückgewinnung Siziliens. Ein starkes Heer wird auch für jede Intervention in Norditalien oder zur Niederschlagung von Aufständen auf dem Festland nötig sein."
 nap_match_aragon_navy_desc: "Um der aragonesischen Flotte entgegenzutreten, die die Straße von Sizilien beherrscht, muss auch unser Königreich eine mächtige Marine besitzen. Wer das Meer beherrscht, wird mit der Zeit Sizilien beherrschen."
 nap_sword_of_the_guelphs_desc: "Der Kampf zwischen den Guelfen (päpstliche Partei) und den Ghibellinen (kaiserliche Partei) erschüttert ganz Norditalien. Als Verbündeter des Papstes mag unser Königreich sich diesem Kampf als das Schwert der Guelfen anschließen und die Gelegenheit ergreifen, unseren Einfluss nach Norden auszudehnen."
 nap_sicilian_reunification_war_desc: "Endlich ist die Zeit gekommen, unsere Heere auf die Insel Sizilien zu entsenden. Wenn wir die aragonesische Garnison brechen und Palermo einnehmen können, wird sich der Weg öffnen, das entzweite Königreich wiederzuvereinen."
 nap_invest_in_provence_desc: "Die Grafschaft Provence, Geburtsstätte des Hauses Anjou, hält noch immer tiefe Bande zu unserer Dynastie. Investition hier wird einen Stützpunkt im Westen schaffen und zugleich unser Band zur angestammten Heimat stärken."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Päpstliche Unterstützung"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Durch unsere engen Bande zum Papsttum wächst unser religiöser Einfluss stetig."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Ein neu geordnetes königliches Heer"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "Das neu geordnete königliche Heer rühmt sich hoher Moral und reichlicher Manneskraftreserven."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Die Anti-Aragon-Flotte"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "Die königliche Flotte, aufgebaut, um Aragón entgegenzutreten, rühmt sich hoher Moral und schneller Bewegung."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "Das Schwert der Guelfen"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Nachdem es in den Streit Norditaliens als Schwert des Papsttums eingegriffen hat, ist unser Heer geschickt in Belagerungskunst und Disziplin geworden."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "Der Krieg der sizilianischen Wiedervereinigung"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Nachdem es sich durch den erbitterten Krieg um Sizilien gekämpft hat, kann das königliche Heer mehr Truppen aufbieten, und die Last des Krieges wiegt weniger schwer auf dem Reich."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Investition in die Provence"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Für das Haus Anjou war die Provence „Heimat“. Nachdem er Neapel verloren hatte, verbrachte König René den Rest seines Lebens in der Provence und ließ Aix-en-Provence zu einem kulturellen Zentrum heranwachsen. Das Band zwischen Neapel und der Provence ist tief, geknüpft durch Blut und Geschichte des Hauses Anjou."
 nap_events.1.t: "Ein in zwei Teile gespaltenes Königreich"
 nap_events.1.d: "1282 erhob sich das Volk Siziliens im Aufstand, bekannt als die Sizilianische Vesper, und stürzte die Herrschaft des Hauses Anjou. Sie hießen König Peter III. von Aragón als neuen Herrscher willkommen, und das Königreich Sizilien wurde so in zwei geteilt. Wir, die vom Festland aus Neapel regieren, bleiben die rechtmäßigen Könige von Sizilien, doch jenseits der Meerenge hält eine Nebenlinie des Hauses Aragón die Insel selbst unter demselben Titel. Die Rivalität zwischen den beiden Reichen dauert bis heute an."
 nap_events.1.a: "Verstanden"
 nap_cross_the_strait_of_otranto_desc: "Die Straße von Otranto, kaum 70 Kilometer breit, ist das maritime Tor zwischen der italienischen und der Balkanhalbinsel. Wenn wir sie überqueren und einen Stützpunkt in Albanien errichten können, werden unsere Flotten und Handelsschiffe einen Weg weiter in den Osten gewinnen."
 nap_influence_over_the_papacy_desc: "Wenn wir unsere Bande zum Papsttum weiter vertiefen und dabei Stabilität im Inneren bewahren, wird unsere Dynastie einen Einfluss auf den Heiligen Stuhl gewinnen, der nicht ignoriert werden kann."
 nap_the_bells_fall_silent_desc: "Die Insel Sizilien ist wieder unser, und das entzweite Königreich ist ganz gemacht. Wir müssen unsere Herrschaft mit Sorgfalt festigen, damit die „Glocken“, die einst das Königreich zerrissen, nie wieder läuten."
 nap_defeat_of_aragon_desc: "Seines sizilianischen Besitzes beraubt, ist das Haus Aragón nicht mehr die Bedrohung für unser Königreich, die es einst war. Wenn Aragón selbst gestürzt oder seine Krone unter unsere Oberhoheit gebracht werden kann, mag die lange Rivalität über das Mittelmeer endlich beendet werden."
 nap_expand_influence_in_southern_france_desc: "Von unserem Stützpunkt in der Provence aus reicht unser Einfluss nun die Rhône hinauf bis nach Lyon. Unsere Präsenz in ganz Südfrankreich wächst weiter."
 nap_western_mediterranean_hegemony_desc: "Wenn wir Sardinien und die Balearen, die zwei großen Bollwerke des westlichen Mittelmeers, einnehmen können, werden unsere Flotten die Gewässer von Genua bis Iberien beherrschen und uns zu unbestrittenen Herren des westlichen Meeres machen."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Ein Stützpunkt jenseits von Otranto"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Unser Stützpunkt in Albanien erlaubt unseren Flotten und Handelsschiffen, weiter hinaus zu segeln."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Einfluss auf das Papsttum"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Unsere Bande zum Papsttum haben sich vertieft und stärken die Legitimität unserer Herrschaft sowie unsere Toleranz gegenüber Häretikern."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Die stillen Glocken"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "Die Herrschaft des wiedervereinten Königreichs hat sich stabilisiert; die Unzufriedenheit des Volkes ist gemindert, und die Legitimität der Krone ist gewachsen."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "Die Niederlage Aragóns"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "Der Konflikt zwischen Aragón und dem Haus Anjou begann mit der Sizilianischen Vesper von 1282 und dauerte über 160 Jahre, bis Alfons’ V. Eroberung Neapels 1442. Diesen alten Feind endlich zu besiegen würde die Vollendung der größten Rache in der Geschichte des Königreichs Neapel bedeuten."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Einfluss in Südfrankreich"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "Die Handels- und diplomatische Präsenz des Königreichs in ganz Südfrankreich wächst weiter."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Hegemonie des westlichen Mittelmeers"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Nachdem sie Sardinien und die Balearen erobert hat, beherrscht unsere Flotte das gesamte westliche Mittelmeer, ihre Moral hoch."
 nap_anjou_hungary_desc: "Unser Haus Anjou hat Nebenlinien nicht nur in Neapel, sondern auch in Ungarn. Sollten sich die Bande zwischen unseren zwei Reichen gemeinsamen Blutes vertiefen, mögen wir noch einen gerechten Grund finden, die ungarische Krone zu beanspruchen."
 nap_foothold_in_northern_italy_desc: "Wenn wir einen Stützpunkt in der Toskana sichern können, mögen wir unsere Bande zu den reichen Stadtstaaten Norditaliens wie Florenz und Pisa vertiefen und den Vorteil in jedem Feldzug über die Halbinsel gewinnen."
 nap_crossroads_of_civilizations_desc: "Das Königreich Sizilien stand lange am Kreuzungspunkt griechischer, römischer, arabischer und normannischer Zivilisationen. Die gewaltige Kunstsammlung, die sich an unserem Hof angesammelt hat, steht als Beweis dafür, dass unser Königreich wahrhaft ein Kreuzungspunkt der Zivilisationen ist."
 nap_anjou_homeland_desc: "Nachdem wir Angers gesichert haben, reicht unser Einfluss nun bis zur angestammten Heimat unseres Hauses Anjou. Dieses Band zu den Landen unserer Vorväter mag uns noch einen Anspruch auf den französischen Thron selbst bringen."
 nap_french_throne_claim_desc: "Das Haus Anjou wurde als Nebenlinie der französischen Königslinie geboren. Wenn wir Paris selbst sichern oder eine Personalunion mit der französischen Krone bilden können, wird unser König sowohl die Krone Frankreichs als auch die Neapels tragen."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Ein Stützpunkt in Norditalien"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Unsere Bande zu den Städten der Toskana erlauben uns, militärische Gewinne effizienter in Kriegspunkte über die Halbinsel umzusetzen."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Kreuzungspunkt der Zivilisationen"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "Die gewaltige Kunstsammlung, die sich an unserem Hof angesammelt hat, verbreitet weiterhin den kulturellen Einfluss des Königreichs in die Nachbarlande."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "Die angestammten Lande Anjous"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "Der Name des Hauses Anjou stammt von Angers in Frankreich, einer Stadt an der Loire. Heinrich II., der das Plantagenet-England gründete, war auch Graf von Anjou. Das Band zur angestammten Heimat Angers wiederherzustellen würde das angiovinische Netz über ganz Europa neu beleben."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "König von Frankreich"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "Das Haus Anjou, Nachkommen der Kapetinger, nimmt die Krone des kapetingischen Lehnsherrn an – eine Umkehrung der Geschichte. Der Titel „Allerchristlichster König“ von Frankreich ist einer der angesehensten Europas, und mit seinem Erwerb steigt eine Dynastie Süditaliens zum politischen Gipfel der ganzen Christenheit auf."
 nap_mediterranean_greatest_city_desc: "Die Bevölkerung Neapels hat nun ein Ausmaß erreicht, das selbst im Mittelmeer selten ist. Seit dem antiken Rom hat keine Stadt an diesem Meer solchen Wohlstand gekannt."
 nap_university_of_frederick_ii_desc: "Die von Friedrich II. gegründete Universität Neapel ist das Zentrum der Gelehrsamkeit des Königreichs. Indem man sie mit Hallen der Kunst und Wissenschaft ausstattet, wird sich ihr Ruhm über ganz Europa verbreiten."
 nap_magnificent_royal_palace_desc: "Die Anlage von Gärten am Königspalast ist ein unentbehrliches Unterfangen, um den Untertanen wie den Fremden gleichermaßen die Pracht der Krone zu zeigen. Prächtige Gärten werden allen Besuchern vom Wohlstand des Königreichs künden."
 nap_expansion_of_naples_port_desc: "Durch den Bau eines Docks im Hafen von Neapel können Schiffe effizienter repariert und gebaut werden, was der Unterhaltung und dem Wachstum der königlichen Flotte erheblich hilft."
 nap_subjugation_of_epirus_desc: "Nachdem wir die Straße von Otranto überquert und einen Stützpunkt errichtet haben, haben unsere Streitkräfte endlich ganz Epirus unterworfen. Die Küste Albaniens liegt nun unter der Herrschaft des Königreichs."
 nap_caserta_palace_desc: "Die Errichtung eines neuen Palastes in Caserta wird die Pracht der Krone zeigen und der königlichen Familie zugleich einen ruhigen Regierungssitz fernab des Hofes von Neapel geben."
 nap_charles_dream_desc: "Karl I. träumte einst davon, im östlichen Mittelmeer ein großes Reich zu errichten, eine Erweiterung des Kreuzzugsgeistes. Nun, mit einem Stützpunkt in der Morea, beginnt dieser Traum, sich noch einmal zu formen."
 nap_never_die_without_seeing_naples_desc: "Wie das alte Sprichwort sagt, „Neapel sehen und sterben“ – Neapel ist zu einer Stadt geworden, nach der sich Reisende aus aller Welt sehnen. Seine Schönheit und sein Wohlstand werden über Generationen besprochen werden."
 nap_latin_empire_desc: "Das Königreich Sizilien ist nicht mehr bloß eine regionale Macht. Im Westen beherrscht es das Mittelmeer; im Osten liegt der Weg von der Morea nach Konstantinopel offen vor ihm. Nun ist die Zeit gekommen, sich vor der Welt als Erbe des alten Lateinischen Kaiserreichs zu erklären."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "Die größte Stadt des Mittelmeers"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Neapel ist zu einer der großen Städte des Mittelmeers geworden, seine Produktivität und sein Wachstum weit über die der Nachbarn hinaus."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "Die Universität Friedrichs II."
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Die an der Universität Neapel versammelten Gelehrten bringen dem Königreich neues Wissen und Innovation."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "Der prächtige Königspalast"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Die prächtigen Gärten des Königspalastes zeigen allen das Ansehen des Königreichs und die Legitimität der Krone."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Die Erweiterung des Hafens von Neapel"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "Der Golf von Neapel, mit dem Vesuv im Hintergrund, wirkt seit der Antike als natürlicher Hafen. Die in der angiovinischen und aragonesischen Ära errichteten Hafenanlagen wurden zu einer großen Drehscheibe des Mittelmeerhandels, wo die Gewürze des Ostens, das Getreide Nordafrikas und die Wolle Iberiens hindurchgingen."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Die Unterwerfung des Epirus"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Nachdem es sich durch den Feldzug in Epirus gekämpft hat, kann das königliche Heer mehr Truppen aufbieten, und die Last des Krieges wiegt weniger schwer auf dem Reich."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "Der Palast von Caserta"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "Der von Vanvitelli entworfene Palast von Caserta (begonnen 1752) rühmt sich eines Ausmaßes, das mit Versailles wetteifert, und versinnbildlichte das Ansehen des bourbonischen Königreichs Neapel. Über 1.200 Zimmer, drei Kilometer lange Gärten, von einem Aquädukt gespeiste Brunnen – das Fundament vor der Entstehung dieses prächtigen Palastes zu legen, ist das Ziel dieser Mission."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "Der Traum Karls I."
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "Der alte Ehrgeiz nach dem Osten brennt neu und erhöht das Ansehen des Königreichs sowie die Moral seiner Heere."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Neapel sehen und sterben"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "„Neapel sehen und sterben“ (Vedi Napoli e poi muori) – so überlieferten es die europäischen Reisenden des 18. Jahrhunderts in Worten, denn Neapel überwältigte jeden Besucher mit dem Vesuv, dem prächtigen Ausblick über die Bucht, den antiken Ruinen und seinen lebhaften Straßen."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "Das Lateinische Kaiserreich"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "Die Pracht des wiederhergestellten Lateinischen Kaiserreiches reicht über das Mittelmeer, erhöht das Ansehen und die Legitimität des Königreichs und stärkt seine Hand in den Verhandlungen des Krieges."
