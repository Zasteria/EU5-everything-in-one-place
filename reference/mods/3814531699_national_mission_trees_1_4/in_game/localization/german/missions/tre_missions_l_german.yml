l_german:
 tre_trebizond_mission_pack: "Die Wiederbelebung der Komnenen-Dynastie und die Wiederherstellung von Byzanz"
 tre_trebizond_mission_pack_DESCRIPTION:0 "Im Jahr 1337 überlebt das Kaiserreich Trapezunt als kleiner Staat an der pontischen Küste, Erben der Komnenen-Dynastie. Ergreife den Schwarzmeerhandel, erobere Anatolien zurück, befreie Konstantinopel und stelle das Byzantinische Reich wieder her."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "Erobere Anatolien, gewinne Konstantinopel zurück, unterwirf den Balkan und stelle das Byzantinische Reich wieder her."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "Stelle das Komnenische Reich wieder her."
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "Erbe von den Küsten des Pontos aus das byzantinische Vermächtnis und marschiere triumphierend nach Konstantinopel!"
 tre_komnenian_legacy: "Das Erbe der Komnenen"
 tre_komnenian_legacy_desc: "Das Erbe der Komnenen-Dynastie treibt Trapezunts Ehrgeiz an, byzantinische Größe wiederherzustellen."
 tre_pontus_coast: "Die pontische Küste sichern"
 tre_pontus_coast_desc: "Sichere die pontische Küste als Fundament für die Vorherrschaft im Schwarzmeerhandel."
 tre_black_sea_trade: "Schwarzmeerhandel"
 tre_black_sea_trade_desc: "Ergreife den Schwarzmeerhandel von genuesischen und venezianischen Konkurrenten."
 tre_dev_trebizond: "Trapezunt entwickeln"
 tre_dev_trebizond_desc: "Entwickle Trapezunt zu einer blühenden Drehscheibe, die des Komnenischen Reiches würdig ist."
 tre_orthodox_stronghold: "Orthodoxes Bollwerk"
 tre_orthodox_stronghold_desc: "Stärke die orthodoxen Klöster, um Trapezunt als geistlichen Erben von Byzanz zu behaupten."
 tre_armenia_campaign: "Armenien unterwerfen"
 tre_armenia_campaign_desc: "Unterwirf Armenien, um die östliche Grenze zu sichern und Bergkrieger zu gewinnen."
 tre_cappadocia: "Die Eroberung Kappadokiens"
 tre_cappadocia_desc: "Erobere das Höhlenkloster-Kernland Kappadokiens und dringe nach Zentralanatolien vor."
 tre_central_anatolia: "Zentralanatolien zurückgewinnen"
 tre_central_anatolia_desc: "Gewinne Zentralanatolien einschließlich Ankaras von türkischer Herrschaft zurück."
 tre_west_anatolia: "Nach Westanatolien marschieren"
 tre_west_anatolia_desc: "Marschiere in die reiche Ägäisküste Westanatoliens."
 tre_reclaim_nicaea: "Nikäa zurückgewinnen"
 tre_reclaim_nicaea_desc: "Gewinne Nikäa und Bursa zurück – die byzantinische Hauptstadt im Exil – und nähere dich Konstantinopel."
 tre_anatolian_emperor: "Kaiser von Anatolien"
 tre_anatolian_emperor_desc: "Eine ganz Anatolien unter dem Banner der Komnenen."
 tre_thrace_campaign: "Thrakien einnehmen"
 tre_thrace_campaign_desc: "Nimm Thrakien ein, um Konstantinopel zu umzingeln und seine Befreiung vorzubereiten."
 tre_reclaim_constantinople: "Konstantinopel zurückgewinnen"
 tre_reclaim_constantinople_desc: "Befreie Konstantinopel und stelle das orthodoxe Kreuz über der Hagia Sophia wieder her."
 tre_northern_greece: "Nordgriechenland zurückgewinnen"
 tre_northern_greece_desc: "Gewinne Nordgriechenland einschließlich Thessalonikis – Byzanz’ zweite Stadt – zurück."
 tre_bulgaria: "Die Eroberung Bulgariens"
 tre_bulgaria_desc: "Erobere Bulgarien, um die Vorherrschaft auf dem Balkan zu festigen."
 tre_morea: "Die Morea zurückgewinnen"
 tre_morea_desc: "Gewinne die Morea und Athen zurück – das Herz der antiken griechischen Zivilisation."
 tre_aegean_islands: "Die Ägäischen Inseln"
 tre_aegean_islands_desc: "Gewinne die Ägäischen Inseln von der lateinischen Kreuzfahrerbesetzung zurück."
 tre_macedonian_campaign: "Die Eroberung Makedoniens"
 tre_macedonian_campaign_desc: "Erobere Makedonien – die Geburtsstätte Alexanders des Großen."
 tre_silk_trade: "Der Seidenhandel"
 tre_silk_trade_desc: "Beherrsche den Seidenstraßenhandel über Trapezunt, um den Ost-West-Handel zu dominieren."
 tre_komnenian_army: "Das komnenische Heer"
 tre_komnenian_army_desc: "Baue das komnenische Heer auf – eine Verschmelzung von Söldnern und provinziellen Aufgeboten."
 tre_greek_culture: "Griechische kulturelle Wiedererweckung"
 tre_greek_culture_desc: "Belebe byzantinische Gelehrsamkeit und Künste wieder, um Trapezunt zu einem kulturellen Leuchtfeuer zu machen."
 tre_cilicia_campaign: "Kilikien unterwerfen"
 tre_cilicia_campaign_desc: "Unterwirf Kilikien, um Zugang zum Mittelmeer zu sichern."
 tre_dev_constantinople: "Konstantinopel wiederaufbauen"
 tre_dev_constantinople_desc: "Baue Konstantinopel als prächtige Hauptstadt des wiederhergestellten Byzantinischen Reiches wieder auf."
 tre_orthodox_patriarch: "Orthodoxes Patriarchat"
 tre_orthodox_patriarch_desc: "Errichte das Patriarchat von Konstantinopel und mache Trapezunt zum Hüter der Orthodoxie."
 tre_georgia_campaign: "Georgischer Feldzug"
 tre_georgia_campaign_desc: "Führe einen Feldzug nach Georgien, um die kaukasische Flanke zu sichern."
 tre_komnenian_navy: "Die komnenische Marine"
 tre_komnenian_navy_desc: "Baue eine mächtige Marine auf, um Schwarzes Meer und Ägäis zu beherrschen."
 tre_antioch_crusade: "Antiochia zurückgewinnen"
 tre_antioch_crusade_desc: "Gewinne Antiochia zurück – einst das Juwel des byzantinischen Syrien."
 tre_greek_population: "Das Wachstum der griechischen Bevölkerung"
 tre_greek_population_desc: "Lass die griechische Bevölkerung als kulturelles Rückgrat des wiederhergestellten Reiches wachsen."
 tre_restore_byzantium: "Byzanz wiederherstellen"
 tre_restore_byzantium_desc: "Verkünde die Wiederherstellung des Byzantinischen Reiches unter komnenischer Führung."
 tre_komnenos_dynasty: "Der Ruhm der Komnenen-Dynastie"
 tre_komnenos_dynasty_desc: "Herrsche als ewiger komnenischer Kaiser – Nachfolger Ostroms, Hüter der Orthodoxie."
 tre_events.20.t: "Konstantinopel zurückgewonnen – Byzanz lebt"
 tre_events.20.d: "Konstantinopel ist in komnenischer Hand! Das orthodoxe Kreuz weht noch einmal über der Hagia Sophia. Die Welt erzittert – Byzanz ist auferstanden."
 tre_events.20.a: "Es lebe Konstantinopel in Gottes Herrlichkeit!"
 tre_events.60.t: "Die Verkündung der byzantinischen Wiederherstellung"
 tre_events.60.d: "Anatolien, der Balkan und Konstantinopel vereint – die Komnenen-Dynastie verkündet die Wiederherstellung des Byzantinischen Reiches. Auferstanden aus der Tragödie von 1204."
 tre_events.60.a: "Es lebe Byzanz! Es lebe die Komnenen-Dynastie!"
 tre_events.99.t: "Der ewige Ruhm der Komnenen-Dynastie"
 tre_events.99.d: "„Komnenischer Kaiser – Nachfolger Ostroms und Hüter der Orthodoxie“ – dieser Titel hallt über die Mittelmeerwelt. Das kleine Reich, das in Trapezunt begann, herrscht als Nachfolger des größten Reiches der Geschichte."
 tre_events.99.a: "Es lebe die Komnenen-Dynastie! Es lebe ewiger Ruhm!"
 STATIC_MODIFIER_NAME_tre_komnenian_mod: "Komnenisch"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "Wer zum purpurnen Banner der Komnenen aufblickt, stellt sich am Hof den Tag vor, an dem der Ruhm von Byzanz in Trapezunts Händen wiedergewonnen wird."
 STATIC_MODIFIER_NAME_tre_pontus_mod: "Pontos"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "Die pontische Küste ist gesichert als Fundament für die Vorherrschaft im Schwarzmeerhandel."
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "Schwarzes Meer"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "Kein Handelsschiff auf dem Schwarzen Meer kann die Seiden des Ostens aufnehmen, ohne im Hafen von Trapezunt zu ankern."
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "Die Stadt Trapezunt"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "Trapezunt ist zu einer blühenden Handelsdrehscheibe des Komnenischen Reiches entwickelt."
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "Orthodox"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "Orthodoxe Klöster sind gestärkt und behaupten Trapezunt als geistlichen Erben von Byzanz."
 STATIC_MODIFIER_NAME_tre_armenia_mod: "Armenien"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "Armenien ist unterworfen, sichert die Ostgrenze und gewinnt Bergkrieger."
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "Kappadokien"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "Kappadokiens Höhlenkloster-Kernland fällt unter komnenische Kontrolle."
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "Anatolien"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "Zentralanatolien ist zurückerobert – der Weg nach Konstantinopel ist offen."
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "Westanatolien"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "Westanatoliens reiche Ägäisküste ist für das Komnenische Reich gesichert."
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "Nikäa"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "Nikäa ist zurückgewonnen – die byzantinische Hauptstadt im Exil kehrt zur orthodoxen Herrschaft zurück."
 STATIC_MODIFIER_NAME_tre_thrace_mod: "Thrakien"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "Thrakien ist eingenommen und umzingelt Konstantinopel in Vorbereitung auf seine Befreiung."
 STATIC_MODIFIER_NAME_tre_greece_mod: "Griechenland"
 STATIC_MODIFIER_DESC_tre_greece_mod: "Nordgriechenland einschließlich Thessalonikis ist gesichert – Byzanz’ zweite Stadt wiederhergestellt."
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "Bulgarien"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "Bulgarien ist erobert und festigt die Vorherrschaft auf dem Balkan."
 STATIC_MODIFIER_NAME_tre_morea_mod: "Morea"
 STATIC_MODIFIER_DESC_tre_morea_mod: "Die Morea und Athen sind zurückerobert – das Herz der antiken griechischen Zivilisation wiederhergestellt."
 STATIC_MODIFIER_NAME_tre_aegean_mod: "Ägäis"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "Ägäische Inseln sind von der lateinischen Kreuzfahrerbesetzung zurückgewonnen."
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "Makedonien"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "Makedonien – Geburtsstätte Alexanders – fällt unter komnenische Herrschaft."
 STATIC_MODIFIER_NAME_tre_silk_mod: "Seide"
 STATIC_MODIFIER_DESC_tre_silk_mod: "Der Seidenstraßenhandel über Trapezunt beherrscht den Ost-West-Handel."
 STATIC_MODIFIER_NAME_tre_army_mod: "Heer"
 STATIC_MODIFIER_DESC_tre_army_mod: "Söldner und provinzielle Aufgebote üben unter demselben Banner, und das Heer der Komnenen hat neue Stärke gefunden."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Kultur"
 STATIC_MODIFIER_DESC_tre_culture_mod: "Byzantinische Gelehrsamkeit und Künste sind wiederbelebt und machen Trapezunt zu einem kulturellen Leuchtfeuer."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Kilikien"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Kilikien ist unterworfen und sichert den Zugang zum Mittelmeer."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "Die Stadt Konstantinopel"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "Konstantinopel ist als prächtige Hauptstadt des wiederhergestellten Byzantinischen Reiches wiederaufgebaut."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Patriarch"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "Das Patriarchat von Konstantinopel ist unter komnenischer Obhut errichtet."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Georgien"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Georgien ist gesichert und stabilisiert die kaukasische Flanke des Reiches."
 STATIC_MODIFIER_NAME_tre_navy_mod: "Marine"
 STATIC_MODIFIER_DESC_tre_navy_mod: "Eine mächtige komnenische Marine beherrscht Schwarzes Meer und Ägäis."
 STATIC_MODIFIER_NAME_tre_antioch_mod: "Antiochia"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "Antiochia – das Juwel des byzantinischen Syrien – ist zurückerobert."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "Griechische Bevölkerung"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "Griechische Gebete und Marktrufe erfüllen die Straßen jeder Stadt des wiederhergestellten Reiches."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Byzanz wiederhergestellt"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "Das Byzantinische Reich ist förmlich unter komnenischer Führung wiederhergestellt."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Komnenen, vollendet"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "Das Komnenische Reich steht ewig – Herr des östlichen Mittelmeers."
 tre_rize_tea: "Teeanbau in Rize"
 tre_rize_tea_desc: "Rize – gesegnet mit warmem, feuchtem Klima zwischen dem Pontischen Gebirge und dem Schwarzen Meer, wird diese Region zu Anatoliens größtem Teeanbaugebiet. Ab 1737 wandle Rizes Hänge in Teeplantagen um, unter Nutzung von Anbautechniken, die über Georgien eintrafen. Bringe das edle östliche Getränk zum Komnenischen Reich."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Teeplantagen von Rize"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "Die Hänge von Rize sind in Teeplantagen umgewandelt und begründen eine Teeerzeugungsbasis für das Reich."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "Konstantinopel wiederhergestellt"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "Konstantinopel beginnt, als Verwaltungs- und Regierungszentrum des Reiches zu wirken."
