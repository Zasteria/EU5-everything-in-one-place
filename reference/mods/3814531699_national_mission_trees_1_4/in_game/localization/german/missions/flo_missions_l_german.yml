l_german:
 flo_magnifico_mission_pack: "Das Erbe Il Magnificos"
 flo_magnifico_mission_pack_DESCRIPTION:0 "Die Republik Florenz führt unter dem außerordentlichen Haus der Medici ganz Europa in Handel, Kunst und Gelehrsamkeit an. Wirst du auf dem gewaltigen Reichtum aufbauen, den der Wollhandel und die Medici-Bank erzeugen, und als Wiege der Renaissance erblühen? Oder wirst du die Toskana einen, auf Rom marschieren und Herr Italiens werden – Il Magnifico? In Florenz treffen die Weisheit des Kaufmanns und der Ehrgeiz des Fürsten aufeinander."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Schließe Missionen als Florenz ab und erreiche sowohl blühenden Handel und Kultur als auch die Eroberung Italiens."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Erbe Il Magnificos zu beschreiten."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "Lass die Renaissance erblühen, beherrsche die Toskana und werde Herr Italiens!"
 flo_rise_of_the_commune: "Der Aufstieg der Kommune"
 flo_rise_of_the_commune_desc: "Im Jahr 1337 ist Florenz inmitten des Kampfes zwischen den Guelfen (päpstliche Partei) und den Ghibellinen (kaiserliche Partei) zu einer „Comune“ herangewachsen – einem selbstverwalteten Stadtstaat von Kaufleuten und Handwerkern. Die großen Banken der Familien Bardi und Peruzzi beherrschen die europäischen Finanzen, und der Wollhandel entlang des Arno bereichert die Stadt. Doch der innere Fraktionsstreit hört nicht auf. Überwinde dieses Zeitalter der Unruhe und führe Florenz zu wahrer Größe."
 flo_the_prince: "Der Fürst"
 flo_the_prince_desc: "Während der Italienischen Kriege, als fremde Mächte Italien verwüsteten, schrieb der florentinische Diplomat Niccolò Machiavelli „Der Fürst“. Ein revolutionäres Werk, das die politische Wirklichkeit mit kalten Augen betrachtete, drückte es eine tiefe Sehnsucht nach einem neuen Herrscher aus, der Italien einen könnte."
 flo_arte_della_lana: "Die Wollindustrie"
 flo_arte_della_lana_desc: "Die Arte della Lana – die Wollhändlerzunft – ist der Kern der florentinischen Wirtschaft. Durch den Import englischer Wolle und den Export fertigen Tuchs in ganz Europa erzeugt sie den Reichtum, der die Stadt groß macht."
 flo_medici_bank: "Die Gründung der Medici-Bank"
 flo_medici_bank_desc: "Die von der Familie Medici gegründete Bank wirkt als offizielle Bank des römischen Papsttums, mit Zweigstellen über ganz Europa verstreut. Diese Finanzmacht ist das Fundament, auf dem Florenz seinen Einfluss sowohl in Kultur als auch Politik ausübt."
 flo_arno_renewal: "Die Erneuerung des Arno"
 flo_arno_renewal_desc: "Während sich die Stadt entwickelt, sind die Arbeiten entlang des Arno vorangeschritten, und Florenz ist zu einer von Italiens blühendsten Städten geworden. Das hohe Entwicklungsniveau bringt der Stadt einen dauerhaften Schub im monatlichen Wachstum."
 flo_arno_corridor: "Der Korridor über dem Arno"
 flo_arno_corridor_desc: "Der Ponte Vecchio und die Kanäle, die den Arno überspannen, sind die kaufmännischen und verwaltungstechnischen Adern von Florenz. Die Errichtung von Brücken und Wassertransport wird die Entwicklung der Stadt beschleunigen."
 flo_arno_trade_network: "Das Handelsnetz des Arno"
 flo_arno_trade_network_desc: "Das Handelsnetz, das sich entlang des Arno über die Toskana erstreckt, ist die Quelle von Florenz’ kaufmännischer Macht. Durch die Beherrschung dieses Netzes können wir den gesamten Handel Norditaliens unter unsere Kontrolle bringen."
 flo_dominate_italian_trade: "Den italienischen Handel beherrschen"
 flo_dominate_italian_trade_desc: "Florenz’ Handelsnetz erfasst nun ganz Italien. Von Norden bis Süden kann die italienische Wirtschaft ohne florentinische Kaufleute nicht funktionieren."
 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "Die Vollendung von Brunelleschis Kuppel ist eine Leistung, die die Grenzen der Baukunst ihrer Zeit sprengte. Ihre große Kuppel erfüllt die Bürger von Florenz mit tiefem Stolz und ist zum ewigen Sinnbild der Stadt geworden."
 flo_birthplace_of_renaissance: "Die Geburtsstätte der Renaissance"
 flo_birthplace_of_renaissance_desc: "Florenz führt als Geburtsstätte der Renaissance die geistige Erneuerung ganz Europas an. Der Geist der Rückkehr zur klassischen Antike und zum Humanismus hat in dieser Stadt tiefe Wurzeln geschlagen."
 flo_florentine_school_of_painting: "Die florentinische Malschule"
 flo_florentine_school_of_painting_desc: "Der von Botticelli und anderen begründete florentinische Malstil ist ganz Europa in Perspektive und Realismus voraus."
 flo_the_mona_lisa: "Die Mona Lisa"
 flo_the_mona_lisa_desc: "Leonardo da Vincis Meisterwerk hat den Begriff der Malerei selbst verändert. Der künstlerische Nährboden von Florenz, der weiterhin solche Genies hervorbringt, ist unvergleichlich."
 flo_uffizi: "Die Uffizien"
 flo_uffizi_desc: "Durch die Vereinigung der von der Familie Medici angehäuften Kunstsammlung könnten die Uffizien zum größten Museum der Welt werden. Ihr kulturelles Ansehen wird den Namen von Florenz dauerhaft erheben."
 flo_the_rise_of_medici: "Der Aufstieg der Medici"
 flo_the_rise_of_medici_desc: "Nach dem Zusammenbruch der Familien Bardi und Peruzzi erhob sich eine neue Bankendynastie: die Medici. Die 1397 von Giovanni di Bicci de’ Medici gegründete Medici-Bank wuchs rasch dank ihrer Beziehung zum römischen Papsttum und weitete Zweigstellen über ganz Europa aus. Diese Familie wird die Zukunft von Florenz tragen."
 flo_pazzi_conspiracy: "Die Pazzi-Verschwörung"
 flo_pazzi_conspiracy_desc: "Der von Papst Sixtus IV. und der Familie Pazzi unterstützte Mordanschlag auf Lorenzo de’ Medici endete in Fehlschlag und diente paradoxerweise nur dazu, die Autorität der Medici zu festigen."
 flo_machiavelli: "Die Schriften Machiavellis"
 flo_machiavelli_desc: "In „Der Fürst“ analysierte Niccolò Machiavelli kühl die Wirklichkeit der Macht. Sein Denken hat die florentinische politische Philosophie tief beeinflusst."
 flo_republic_of_virtue: "Die Republik der Tugend"
 flo_republic_of_virtue_desc: "Florenz strebt danach, nicht bloß ein Handelsstaat zu sein, sondern einer, der auf Tugend und republikanischen Idealen gegründet ist. Legitimität und Stabilität sind die Eckpfeiler der Republik."
 flo_camerata_fiorentina_nmt: "Die Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "Die Camerata, in der sich florentinische Gelehrte und Musiker versammeln, wird zu einer Brutstätte musikalischer Neuerung, die zur Geburt der Oper führen wird. Eine Stadt, in der Kunst und Wissenschaft als eins erblühen."
 flo_subjugate_pisa: "Pisa unterwerfen"
 flo_subjugate_pisa_desc: "Pisa, die Hafenstadt, die Florenz lange als Tor zum Meer begehrt hat, muss gesichert werden. Die Einnahme dieses Hafens am Arno wird Florenz’ kaufmännische Reichweite erheblich erweitern."
 flo_siena_submitted: "Die Unterwerfung Sienas"
 flo_siena_submitted_desc: "Unser langjähriger Rivale Siena ist endlich gezähmt. Nachdem die Schmach von Montaperti gerächt ist, nimmt Florenz seine Seidenhändler und Bankiers auf und sichert die vollständige Kontrolle über die südliche Toskana."
 flo_lucca_absorbed: "Lucca einverleibt"
 flo_lucca_absorbed_desc: "Lucca, das lange seine Unabhängigkeit bewahrt hat, ist eines der letzten Hindernisse für Florenz’ Einigung der Toskana. Bringe seine Seidenindustrie unter florentinische Autorität."
 flo_unify_tuscany: "Die Toskana einen"
 flo_unify_tuscany_desc: "Da nun beinahe die ganze Toskana unter florentinischer Kontrolle steht, ist die Erhebung zum Königreich eine natürliche Folge. Florenz ist nicht mehr bloß ein Stadtstaat."
 flo_push_into_lombardy: "Vorstoß in die Lombardei"
 flo_push_into_lombardy_desc: "Jenseits der Toskana ist die Zeit gekommen, unser Herrschaftsgebiet ins Herz Norditaliens auszudehnen. Konflikt mit Mailand, Genua und Venedig ist unvermeidlich."
 flo_march_on_rome: "Marsch auf Rom"
 flo_march_on_rome_desc: "Wer Rom beherrscht, beherrscht Italien. Indem es die antike Hauptstadt des Römischen Reiches in sein Herrschaftsgebiet bringt, beansprucht Florenz eine Legitimität, der niemand ebenbürtig ist."
 flo_the_new_rome: "Das Neue Rom"
 flo_the_new_rome_desc: "Florenz, das Rom erobert hat, beherrscht nun den größten Teil der italienischen Halbinsel und ist zu einem Reich geworden. Die Zeit ist gekommen, ein neues Rom zu errichten."
 flo_il_magnifico_of_italy: "Il Magnifico von Italien"
 flo_il_magnifico_of_italy_desc: "Wie Lorenzo de’ Medici „Il Magnifico“ genannt wurde, so ist nun ganz Florenz zum „Herrlichen“ Italiens geworden."
 flo_medici_oriental_press: "Die Medici-Presse für orientalische Schriften"
 flo_medici_oriental_press_desc: "Die von der Familie Medici errichtete Druckerei sammelt und druckt griechische Handschriften, die nach dem Fall des Byzantinischen Reiches hereinströmten. Antikes Wissen haucht Europa noch einmal neues Leben ein."
 flo_clock_tower: "Der Uhrturm der Piazza della Signoria"
 flo_clock_tower_desc: "Der Präzisionsuhrturm, im Palazzo della Signoria errichtet, ist zu einem Sinnbild florentinischer technischer Meisterschaft geworden. Die Verwaltung der Zeit verbessert die Effizienz von Handel und Regierung."
 flo_first_modern_engineer: "Der erste moderne Ingenieur"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi entwickelte revolutionäre Baumethoden, die beim Bau der Kuppel das antike Rom übertrafen. Sein technisches Erbe wird auf den Festungsbau in ganz Italien angewandt."
 flo_humiliate_venice: "Venedig demütigen"
 flo_humiliate_venice_desc: "Die Zeit ist gekommen, unseren langjährigen Rivalen zur See, die Republik Venedig, zu übertreffen. Indem wir die Königin der Adria in ihre Schranken weisen, werden wir beweisen, dass Florenz Italiens führende Nation ist."
 flo_papal_relations: "Beziehungen zum Papsttum"
 flo_papal_relations_desc: "Da nun Rom gesichert ist, müssen die Beziehungen zum Papsttum auf ein festes Fundament gestellt werden. Ob durch Bündnis oder Vorherrschaft, Florenz wird zum größten Förderer der römischen Kirche werden."
 flo_vasari_corridor: "Die Uffizien und der Vasari-Korridor"
 flo_vasari_corridor_desc: "Der Vasari-Korridor, der den Uffizien-Palast und den Ponte Vecchio verbindet, wurde von Giorgio Vasari im Auftrag Cosimos I. de’ Medici entworfen. Dieser geheime erhöhte Gang versinnbildlicht die Autorität und künstlerische Vortrefflichkeit der Medici."
 flo_academy_of_florence: "Die Akademie von Florenz"
 flo_academy_of_florence_desc: "Die in Florenz errichtete Akademie ist zu einem Ort umfassender Forschung in Kunst, Wissenschaft und Philosophie geworden. Das Wissen der Renaissance verbreitet sich von hier in die Welt."
 flo_italian_cultural_hegemon: "Kultureller Hegemon Italiens"
 flo_italian_cultural_hegemon_desc: "Florenz, wo Handel, Kunst und Gelehrsamkeit als eins erblüht sind, ist zum kulturellen Zentrum ganz Italiens geworden. Sein Einfluss reicht selbst über die Alpen hinaus."
 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "Von einer Kaufmannsstadt ist Florenz zum Gipfel der Kultur aufgestiegen, hat ganz Italien erobert und sich als Nachfolger des Römischen Reiches begründet. „Il Magnifico“ – der Name des Herrlichen ist auf ewig in die Geschichte eingeschrieben."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Blühende Wollindustrie"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "Die Arte della Lana (die Wollzunft) war Florenz’ größte Zunft und das Fundament des städtischen Wohlstands. Fein verarbeitetes Tuch aus in England und Spanien gekaufter Rohwolle wurde in ganz Europa geschätzt und wurde zur Quelle des gewaltigen Vermögens der Medici."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Die Vorherrschaft der Medici-Bank"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "1397 von Giovanni di Bicci de’ Medici gegründet, hatte die Medici-Bank auf ihrem Höhepunkt Zweigstellen in sechzehn Städten, darunter Rom, Venedig, London und Brügge. Als offizielle Bank des päpstlichen Hofes erntete sie gewaltige Gewinne, während sie das kirchliche Zinsverbot unter dem Deckmantel von „Wechselgewinnen“ umging."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "Das Handelsnetz des Arno"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "Der Arno war die große Ader des Wasserverkehrs, die Florenz mit dem Seehafen Pisa verband. Durch die Beherrschung der Handelswege entlang seines Laufes nahm Florenz, obwohl eine Binnenstadt, unmittelbar am Mittelmeerhandel teil und bildete eine eigentümliche Wirtschaftssphäre, die Tuch, Bankwesen und Handel verband."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Die Vorherrschaft im italienischen Handel"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "Das spätmittelalterliche Italien war die größte Handelszone Europas, mit den Kaufleuten von Florenz, Venedig und Genua an ihrem Gipfel. Florentinische Kaufleute spannen ein Finanznetz über ganz Nordeuropa und übten genug Einfluss aus, um beiden Seiten im Hundertjährigen Krieg zwischen England und Frankreich zu leihen."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Die Vollendung des Doms"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "Die Kuppel des Doms von Florenz (Santa Maria del Fiore) wurde 1436 von Brunelleschi vollendet. Eine revolutionäre technische Leistung – eine gewaltige Kuppel, ohne hölzernes Lehrgerüst oder Gerüst errichtet, die seit über tausend Jahren seit dem Pantheon in Rom niemand vollbracht hatte – sie versinnbildlicht den Geist der Renaissance."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Die Geburtsstätte der Renaissance"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "Die „Renaissance“ – Wiedergeburt – wurde in Florenz geboren. In der von Cosimo de’ Medici gegründeten Platonischen Akademie belebten Marsilio Ficino und andere das Denken des antiken Griechenlands und Roms wieder, und verbunden mit der literarischen Tradition Dantes, Petrarcas und Boccaccios wandelte sie die westliche Zivilisation bis in ihre Grundfesten."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Die florentinische Malschule"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "Die von Giotto di Bondone Ende des 13. Jahrhunderts begründete Tradition realistischer Malerei ging über auf Masaccios Perspektive, Botticellis Anmut und Leonardos Vielseitigkeit. Die florentinische Malerei verkörperte den Übergang von mittelalterlichen heiligen Bildern zur modernen Kunst und bestimmte die Richtung der europäischen Malerei."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "Die Wirkung der Mona Lisa"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Um 1503–1519 von Leonardo da Vinci gemalt, wurde die „Mona Lisa“, mit ihrem rätselhaften Lächeln und ihrer innovativen Perspektive und Sfumato-Technik, zum berühmtesten Werk in der Geschichte der westlichen Kunst. Leonardo war ein universeller Genius, der nicht nur Malerei, sondern Anatomie, Ingenieurwesen, Architektur und Musik umspannte."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "Der Ruhm der Uffizien"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "Der Uffizien-Palast, den Cosimo I. de’ Medici 1560 von Vasari entwerfen ließ, war zunächst ein Verwaltungsbüro (Uffizien bedeutet „Ämter“), beherbergte aber später die Sammlungen der Medici und wurde zu einem der ersten Museen der Welt – ein Tempel der Kunst, in dem sich die Werke Botticellis, Leonardos und Michelangelos versammeln."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Die Lehren des Fürsten"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Niccolò Machiavelli diente der Florentinischen Republik von 1498 bis 1512 als Diplomat und Verwalter. „Der Fürst“, nach der Vertreibung der Medici geschrieben, war ein Werk realistischen politischen Denkens, das vertrat, „der Zweck heiligt die Mittel“, und wurde zum Fundament moderner politischer Theorie."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "Die Republik der Tugend"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Florenz besaß eine eigentümliche Regierungsform, die eine republikanische Fassade wahrte, während die Medici in Wahrheit herrschten. Einrichtungen wie die Signoria (Stadtregierung), die Priori (Magistrate) und der Große Rat verschmolzen geschickt die Ideale des Republikanismus mit der Wirklichkeit der Oligarchie."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "Die „Camerata“, ein Kreis von Musikern, Dichtern und Gelehrten, die sich in den 1570er und 1580er Jahren in der Residenz Graf Giovanni de’ Bardis in Florenz versammelten, strebte danach, das antike griechische Drama wiederzubeleben. Ihre Experimente brachten eine völlig neue Kunstform hervor, die Oper, und veränderten die Geschichte der westlichen Musik für immer."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "Der Hafen von Pisa"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Pisa herrschte einst als Seerepublik neben Venedig und Genua über das Mittelmeer, verfiel aber nach seiner vernichtenden Niederlage gegen Genua in der Schlacht bei Meloria 1284. Mit Florenz’ Eroberung Pisas 1406 gewann das einst landumschlossene Florenz endlich einen Zugang zum Meer."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Die Unterwerfung Sienas"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Siena war Florenz’ überlieferter Rivale, lange im Streit um die Vorherrschaft in der Toskana. Siena bewahrte seine Unabhängigkeit mit spanischer Unterstützung, fiel aber schließlich 1555. Die stolzen Sienesen, bekannt für das Palio-Pferderennen, unter florentinische Herrschaft zu bringen, ist ein Sinnbild der Einigung der Toskana."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Die Seide und das Tuch Luccas"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Lucca war die Stadt mit der feinsten Seidenindustrie der Toskana. Im 13. und 14. Jahrhundert wurde lucchesische Seide in ganz Europa geschätzt und zierte die Gewänder von Fürsten und Adligen. Der Reichtum der Bankiers Luccas, Rivalen der Medici, verdient ebenfalls Beachtung."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Herr der Toskana"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Arezzo, uralte Stadt der Etrusker; Siena, Stadt der Dichtung; Lucca, Stadt der Handwerke; Pisa, der Hafen – durch ihre Vereinigung wird Florenz zum Mittelpunkt der Toskana als historisches, kulturelles und geografisches Ganzes. Es ist das Werk, das römische „Tuscia“ unter dem Banner der Medici wiederzuvereinen."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Vorstoß in die Lombardei"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Florenz und Mailand waren die zwei Großmächte der italienischen Politik des 15. Jahrhunderts, stets in Spannung. Gegen die expansionistische Politik der Visconti- und Sforza-Herzöge von Mailand widerstand Florenz mit Diplomatie und Condottieri, den Söldnerführern. Dieses Kräftegleichgewicht brachte die Verfeinerung der Renaissance-Diplomatie hervor."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "Das Neue Rom"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Florenz wurde oft das „Neue Rom“ genannt. Cosimo und Lorenzo de’ Medici ahmten bewusst die Förderungskultur Roms nach und suchten die Tugenden des antiken Roms im Geist der Renaissance nachzubilden. Rom selbst zu beherrschen ist die symbolische Vollendung dieses Ziels."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "Il Magnifico von Italien"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Lorenzo de’ Medici (Lorenzo der Prächtige, 1449–1492) stand als Künstler, Dichter, Diplomat und Staatsmann am Gipfel seines Zeitalters. Die Politik des Gleichgewichts, die er das „Gleichgewicht Italiens“ nannte, bewahrte den Frieden am Vorabend der Italienischen Kriege, und sein Hof verströmte den feinsten Glanz der Renaissancekultur."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "Das Erbe östlicher Gelehrsamkeit"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "Auf dem Konzil von Florenz 1438–1439 kaufte Cosimo de’ Medici in großer Zahl griechische Handschriften von den aus Byzanz gekommenen Gelehrten. Diese Sammlung führte zur lateinischen Übersetzung Platons und zur Wiederbelebung des Neuplatonismus und veränderte die Geschichte des westlichen Denkens. Verbunden mit Gutenbergs Druckrevolution verbreitete sich Wissen rasch."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Die Präzision des Uhrturms"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Mechanische Uhren begannen im 14. Jahrhundert auf den Plätzen norditalienischer Städte zu erscheinen. Der Glockenturm (Campanile) des Doms von Florenz, von Giotto entworfen, ist ein typisches Beispiel. Gemeinsame Zeitmessung einte Handel und Verwaltung einer Stadt und wurde zur Infrastruktur, die den Übergang vom Mittelalter zur Neuzeit stützte."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "Der Aufstieg der Medici"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Cosimo de’ Medici (genannt Pater Patriae, 1389–1464), gestützt auf seine Bankgewinne, verbannte seine politischen Feinde und wurde zum faktischen Herrscher von Florenz. Als Schatzmeister des päpstlichen Hofes, Förderer der Künste und Schlichter in der Diplomatie legte er das Fundament des Ruhms des Hauses Medici."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Der Pionier moderner Ingenieurskunst"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Filippo Brunelleschi (1377–1446) brachte Revolution in Architektur, Bildhauerei und Ingenieurwesen. Er theoretisierte die lineare Perspektive und verwirklichte die große Kuppel des Doms von Florenz durch eine innovative Doppelschalenstruktur und Rahmentechniken. Er ist der Archetyp des Renaissance-„Universalmenschen“ (uomo universale)."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "Die Demütigung Venedigs"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Florenz und Venedig, die zwei großen Handelsmächte des mittelalterlichen Italiens, wetteiferten im Wohlstand und lagen lange sowohl diplomatisch als auch militärisch im Streit. Der Konflikt um die Ausdehnung nach Mailand im 15. Jahrhundert war besonders erbittert, und Florenz empfand Venedigs landgestützte Ausdehnung (die Terraferma-Politik) stets als Bedrohung."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Das Band zum Papsttum"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "Das Verhältnis zwischen den Medici und dem päpstlichen Hof war verwickelt. Nach der Pazzi-Verschwörung von 1478 (einem Mordkomplott, in das Erzbischof Francesco Salviati verwickelt war), die Lorenzos Bruder Giuliano tötete, lag Lorenzo eine Zeitlang im Streit mit Sixtus IV., versöhnte sich aber danach und baute eine feste Beziehung wieder auf."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "Die Akademie von Florenz"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "Die von Cosimo de’ Medici geförderte Platonische Akademie unternahm unter Marsilio Ficino die Wiederbelebung der antiken Philosophie. Die lateinische Übersetzung der vollständigen Werke Platons, die Übersetzung des Corpus Hermeticum, die Systematisierung des Neuplatonismus – diese geistigen Unternehmungen erneuerten die Grundfesten westlicher Philosophie, Theologie und Wissenschaft."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "Förderer italienischer Kunst"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "Das Florenz der Renaissance war der kulturelle Schwerpunkt ganz Europas. Die Fürsten und Adligen Frankreichs, der Niederlande, Deutschlands und Englands beriefen florentinische Künstler, Architekten und Gelehrte und wetteiferten darin, die „italienische“ Hofkultur nachzuahmen."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "Der Ruhm Il Magnificos"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "„Il Magnifico“ ist eine Wendung, die nicht nur den Glanz eines Mannes, sondern der ganzen Stadt Florenz ausdrückt. Der Ruhm von Florenz, das am Gipfel Europas in Kunst, Philosophie, Diplomatie und Finanzwesen gleichermaßen stand, verkörpert das Wesen des Zeitalters, das spätere Generationen die „Renaissance“ nennen."
 flo_events.1.t: "Der Aufstieg der florentinischen Kommune"
 flo_events.1.d: "Im Jahr 1337 ist Florenz im langen Kampf zwischen den Fraktionen der Guelfen und Ghibellinen gefangen. Die großen Banken der Familien Bardi und Peruzzi, mit gewaltigen Krediten an den König von England belastet, beginnen zu wanken. Der Schatten des Schwarzen Todes kriecht aus dem Osten heran, und manche schmieden Pläne, den Tyrannen Walter de Brienne einzuladen. Und dennoch lebt der Geist der florentinischen Kommune – der selbstverwalteten Kaufmannsstadt – fort. Auf dem Fundament von Wollhandel und Kaufmannszünften überlebe dieses Zeitalter der Stürme."
 flo_events.1.a: "Die Zukunft von Florenz liegt in unseren Händen"
 flo_events.3.t: "Die Nachwirkungen der Pazzi-Verschwörung"
 flo_events.3.d: "Der von Papst Sixtus IV. und der Familie Pazzi unterstützte Mordanschlag auf Lorenzo de’ Medici ist in Fehlschlag geendet und diente paradoxerweise nur dazu, die Autorität der Medici zu festigen. Die Verschwörer sind hingerichtet, und die Bürger von Florenz haben ihre Unterstützung für die Medici noch weiter gestärkt. Nachdem sie diese Prüfung überstanden hat, ist die politische Struktur der Republik bereit, zu etwas Feinerem wiedergeboren zu werden."
 flo_events.3.a: "Die Prüfung hat uns stärker gemacht"
 flo_events.4.t: "Der Marsch auf Rom"
 flo_events.4.d: "Die antike Hauptstadt des Römischen Reiches steht nun unter dem Banner von Florenz. Die Konstantinische Schenkung ist bereits als Fälschung erwiesen – wenn dem so ist, gehört die rechtmäßige Autorität, über Italien zu herrschen, Florenz, durch Kraft und Weisheit errungen. Diese kleine Republik, geboren als Kaufmannsstadt, beschreitet nun den Pfad zu einem Reich, dessen Name in die Geschichte gemeißelt wird."
 flo_events.4.a: "Rom erstrahlt im Ruhm von Florenz"
 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "Überschwemmungen des Arno plagten Florenz über Jahre (die Flut von 1966 wird noch heute besprochen). Doch durch die Verbesserung der Ufer, den Bau von Brücken und die Stärkung der Deiche wurde der Fluss vielmehr zum Vorteil der Stadt. Die Werkstätten, Färbereien und Wollwaschplätze entlang des Flusses wirkten als Herz der florentinischen Wirtschaft."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Der Wohlstand des Ponte Vecchio"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "Der Ponte Vecchio (die Alte Brücke) ist die älteste Brücke über den Arno und ist seit dem 14. Jahrhundert das Sinnbild florentinischen Handels, gesäumt von den Läden der Goldschmiede und Juweliere. Als Teil des Vasari-Korridors erneuert, den Cosimo I. errichten ließ, um die Uffizien mit dem Palazzo Pitti zu verbinden, wurde sie zu einem symbolischen Durchgang, der Herrscher und Stadt vereint."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "Der Vasari-Korridor"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "1565 von Giorgio Vasari in nur fünf Monaten vollendet, ist der Vasari-Korridor ein erhöhter Gang, der den Uffizien-Palast über den Ponte Vecchio mit dem Palazzo Pitti verbindet. Entworfen, damit Cosimo I. sich bewegen konnte, ohne sich unter die Menge zu mischen, ist er eine technische Kristallisation der Sicherheit eines Herrschers und seiner Meisterschaft über die Stadt."
 flo_events.5.t: "Die Uffizien und der Vasari-Korridor"
 flo_events.5.d: "Cosimo I. de’ Medici befahl dem Architekten Giorgio Vasari, den Uffizien-Palast (Sitz der Verwaltung) mit dem Palazzo Pitti durch einen geheimen erhöhten Gang zu verbinden. Dieser „Vasari-Korridor“, der über den Ponte Vecchio führt, ist ein verborgener Durchgang, der es dem Herrscher erlaubt, sich zu bewegen, ohne von der Öffentlichkeit gesehen zu werden – ein Sinnbild der Autorität der Medici und ihrer Meisterschaft über die Stadt. Diese geniale, den Arno überspannende Architektur zeigt deutlich, dass Politik und Kunst in Florenz eins und dasselbe sind."
 flo_events.5.a: "Die Vollendung des Korridors hat die Regierung von Florenz auf eine neue Ebene gehoben"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "Der Neue Fürst"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "In „Der Fürst“ (1513) predigte Machiavelli, man solle „sowohl die Stärke des Löwen als auch die List des Fuchses“ besitzen. Der Realismus, dass es sicherer ist, gefürchtet zu werden als geliebt, und dass man nötigenfalls die Bewahrung der Macht vor die Moral stellen solle, wurde zum Ausgangspunkt der modernen Politikwissenschaft."
 flo_events.6.t: "Der Fürst"
 flo_events.6.d: "Die Italienischen Kriege haben Florenz eine schwere Lehre erteilt. Der Diplomat Niccolò Machiavelli schrieb „Der Fürst“, ein Werk, das das Wesen der Macht selbst enthüllte. Um ein gespaltenes Italien zu einen, wird ein neuer Herrscher gebraucht, der reale Macht über Moral stellt. „Nur ein Fürst, der sowohl Tugend als auch Fortuna besitzt, kann ein Italien im Chaos retten“ – und vielleicht liegt diese Antwort in Florenz selbst."
 flo_events.6.a: "Ein neuer Fürst, um Italien zu retten, trete hervor!"
