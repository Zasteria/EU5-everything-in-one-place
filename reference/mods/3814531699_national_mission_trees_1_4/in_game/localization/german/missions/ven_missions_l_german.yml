l_german:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "Das Ereignis „Erweiterung des Dogenpalastes“ ist eingetreten"
 ven_mainland_food_crisis: "Nahrungskrise des Festlandes"
 ven_mainland_food_crisis_desc: "Venedig, eine auf einer Lagune erbaute Stadt, ist auf Getreidelieferungen vom Festland angewiesen. Errichte ein stabiles Netz der Nahrungsversorgung."
 ven_scaliger_war: "Der Krieg gegen die Scaliger"
 ven_scaliger_war_desc: "Besiege das Haus della Scala, das über Verona herrscht, und sichere Treviso und Vicenza."
 ven_mainland_consolidation: "Festigung des Festlandes"
 ven_mainland_consolidation_desc: "Gliedere die neu erworbenen Festlandgebiete verwaltungsmäßig ein und stabilisiere die Beziehungen zu Adel und Regierungseinrichtungen."
 ven_terraferma_expansion: "Ausdehnung der Terraferma"
 ven_terraferma_expansion_desc: "Erobere Verona und Bergamo und dehne den Festlandbesitz der Terraferma weiter aus."
 ven_warehouse_expansion: "Lagerhauserweiterung"
 ven_warehouse_expansion_desc: "Erweitere Venedigs Lagerhauseinrichtungen, um das wachsende Handelsvolumen zu bewältigen."
 ven_piazza_san_marco: "Die Entwicklung des Markusplatzes"
 ven_piazza_san_marco_desc: "Entwickle den Markusplatz, das Sinnbild der Republik, um das Ansehen des Adels zu mehren."
 ven_canal_administration: "Kanalverwaltung"
 ven_canal_administration_desc: "Verbessere das Netz der Kanäle, die durch Venedig führen, um die Effizienz der Flottenoperationen zu steigern."
 ven_fondaco: "Der Fondaco"
 ven_fondaco_desc: "Errichte ein Netz von Handelshäusern (Fondachi) für ausländische Kaufleute und weite die Handelsstützpunkte aus."
 ven_bridge_of_wealth: "Die Brücke des Reichtums"
 ven_bridge_of_wealth_desc: "Eine ununterbrochene Reihe von Kaufleuten überquert die Brücke zum Fondaco. Entwickle das Handelsviertel um diese Brücke und lass den Strom des Reichtums weiter anschwellen."
 ven_doges_palace: "Die Erneuerung des Dogenpalastes"
 ven_doges_palace_desc: "Entwickle den Dogenpalast, das Sinnbild der Autorität des Dogen, um die Regierungsstruktur der Republik zu stärken."
 ven_doges_palace_event_occurred_tt: "Die Entscheidung „Den Dogenpalast erweitern“ wurde genutzt"
 ven_arsenal: "Das Arsenale di Venezia"
 ven_arsenal_desc: "Erweitere die staatliche Werft, das Arsenale, und hebe die Schiffbaukapazität der Republik auf weltführendes Niveau."
 ven_marciana_library: "Die Biblioteca Marciana"
 ven_marciana_library_desc: "Errichte eine Nationalbibliothek mit Bibliothek und Universität und mehre das gelehrte Ansehen der Republik."
 ven_lombardy_hegemony: "Vorherrschaft über die Lombardei"
 ven_lombardy_hegemony_desc: "Mit dem Banner der Republik über den Märkten Mailands erkennen die Kaufleute ganz der Lombardei einen neuen Herrn an."
 ven_settling_with_genoa: "Abrechnung mit Genua"
 ven_settling_with_genoa_desc: "Bringe die langjährige Handelsrivalität mit Genua zu ihrem endgültigen Abschluss. Nimm seinen Heimathafen ein oder tilge Genua ganz von der Karte."
 ven_city_of_water: "Die Stadt des Wassers"
 ven_city_of_water_desc: "Vollende die Lagunenstadt Venedig als eine Stadt von unvergleichlichem Wohlstand, verwoben durch Wasserwege und Handel."
 ven_secure_ferrara: "Ferrara sichern"
 ven_secure_ferrara_desc: "Erwerbe Ferrara, beherrscht vom Haus Este, und gewinne einen Stützpunkt im Potal."
 ven_northern_expansion: "Ausdehnung nach Norden"
 ven_northern_expansion_desc: "Sichere Trient und Udine und treibe die Ausdehnung nach Norden mit Blick auf die Alpenpässe voran."
 ven_papal_conflict: "Konflikt mit dem Kirchenstaat"
 ven_papal_conflict_desc: "Die Spannungen mit dem Kirchenstaat um den Status Ferraras wachsen. Überwinde diesen Konflikt."
 ven_alpine_trade: "Handel über die Alpen"
 ven_alpine_trade_desc: "Karawanen, die die Alpenpässe überqueren, sind nicht länger an einen einzigen Markt gebunden, da sie ein weites Handelsnetz aus mehreren Marktzentren errichtet haben."
 ven_render_unto_caesar: "Gebt dem Kaiser, was des Kaisers ist"
 ven_render_unto_caesar_desc: "Nachdem sie sich das Vertrauen von Klerus und Bürgern gleichermaßen erworben hat, bleibt die Autorität der Republik selbst in der Ewigen Stadt Rom unangefochten."
 ven_league_of_cambrai: "Die Liga von Cambrai zersprengen"
 ven_league_of_cambrai_desc: "Durchbrich die von den Mächten Europas gebildete Einkreisung der Liga von Cambrai und verteidige die Unabhängigkeit der Republik."
 ven_terraferma_completed: "Die Vollendung der Terraferma"
 ven_terraferma_completed_desc: "Vollende die Verwaltungsstruktur des Festlandbesitzes Terraferma und begründe die Autorität der Republik über Norditalien."
 ven_italian_unity_route: "La Serenissima"
 ven_italian_unity_route_desc: "Werde als führende Macht unter den italienischen Staaten zum Mittelpunkt einer neuen Ordnung auf der Halbinsel."
 ven_fleet_unification: "Die Flotten bereitmachen"
 ven_fleet_unification_desc: "Vereinige die Führung der verschiedenen Flotten der Republik und verbessere die Effizienz der Marineunterhaltung."
 ven_black_sea_insurance: "Den Schwarzmeerhandel absichern"
 ven_black_sea_insurance_desc: "Errichte mit Negroponte als Basis ein System zur Begleitung der Handelswege zum Schwarzen Meer."
 ven_secure_adriatic: "Die Adria sichern"
 ven_secure_adriatic_desc: "Sichere Zara und Pola und bringe die Beherrschung der Adria in die Hände der Republik."
 ven_expel_genoa_black_sea: "Genua aus dem Schwarzen Meer vertreiben"
 ven_expel_genoa_black_sea_desc: "Sichere Kaffa und Tana, die Schlüsselposten des Schwarzmeerhandels, und übernimm die Interessen Genuas, des größten Rivalen der Republik."
 ven_aegean_expansion: "Ausdehnung in der Ägäis"
 ven_aegean_expansion_desc: "Sichere Kreta und Naxos und weite den Stützpunkt der Republik in der Ägäis aus."
 ven_dalmatian_subjugation: "Die Unterwerfung Dalmatiens"
 ven_dalmatian_subjugation_desc: "Sichere die gesamte kroatische Küste und bringe die Region Dalmatien unter die Herrschaft der Republik."
 ven_dominate_eastern_trade: "Den östlichen Handel beherrschen"
 ven_dominate_eastern_trade_desc: "Bringe die Handelswege des Schwarzen Meeres und des östlichen Mittelmeers unter die Kontrolle der Republik und ergreife die Vorherrschaft über den östlichen Handel."
 ven_greek_bridgehead: "Brückenkopf in Griechenland"
 ven_greek_bridgehead_desc: "Sichere Kreta und Methoni und begründe einen Brückenkopf ins griechische Kernland und die Ägäis."
 ven_pearl_of_adriatic: "Die Perle der Adria zurückgewinnen"
 ven_pearl_of_adriatic_desc: "Stelle den Wohlstand der Handelsstadt Ragusa wieder her und bringe den als „Perle der Adria“ bekannten Reichtum der Republik zu."
 ven_protect_corfu: "Korfu schützen"
 ven_protect_corfu_desc: "Stationiere eine Garnison auf Korfu, das den Eingang zur Adria beherrscht, und sichere seine Verteidigung."
 ven_occupy_cyprus: "Besetzung Zyperns"
 ven_occupy_cyprus_desc: "Sichere Larnaka und mache die strategisch bedeutende Insel Zypern zu einem Gebiet der Republik."
 ven_second_conquest_of_constantinople: "Die zweite Eroberung Konstantinopels"
 ven_second_conquest_of_constantinople_desc: "Bringe, wie schon der Vierte Kreuzzug einst, Konstantinopel noch einmal unter die Kontrolle der Republik."
 ven_queen_of_the_adriatic: "Die Königin der Adria"
 ven_queen_of_the_adriatic_desc: "Vollende das Handels- und Verteidigungsnetz über die gesamte Adria und erhebe die Republik zum Rang der „Königin der Adria“."
 ven_pen_not_sword: "Zur Feder greifen, nicht zum Schwert"
 ven_pen_not_sword_desc: "Sichere die Interessen der Republik im östlichen Mittelmeer durch Diplomatie und Verträge statt durch militärische Gewalt und gewährleiste dauerhaften Wohlstand."
 ven_latin_empire: "Das Lateinische Kaiserreich"
 ven_latin_empire_desc: "Errichte ein neues Lateinisches Kaiserreich mit Mittelpunkt Konstantinopel und schreibe der Republik ihren Platz in der Geschichte als Herrin des Mittelmeers ein."
 ven_grand_strategy_mission_pack: "Die große Strategie der Seerepublik"
 ven_grand_strategy_mission_pack_desc: "Die kleine, auf einer Lagune erbaute Republik beschreitet zwei Pfade zugleich: die Ausdehnung auf das Festland und den Aufbau eines Seereiches. Vollende die Terraferma, werde Königin der Adria und schreibe deinen Namen letztlich als Mittelpunkt Italiens – oder als Erbe des Lateinischen Kaiserreichs – in die Geschichte."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "Begründe die Vorherrschaft der Republik zu Land und zu Wasser."
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "Die kleine, auf der Lagune erbaute Republik beschreitet zwei Pfade zugleich: die Ausdehnung auf das Festland und den Aufbau eines Seereiches. Schreibe als Königin der Adria deinen Namen in die Geschichte des Mittelmeers."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "Vollende die Terraferma, werde Königin der Adria und stehe als Erbin des Lateinischen Kaiserreichs da – schreibe den Namen der Republik in die Geschichte!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "Vollende als Venedig die Terraferma und werde Königin der Adria."
 ven_events.1.t: "Der Fall der della Scala"
 ven_events.1.d: "Der Krieg gegen die Tyrannen della Scala von Verona endet mit venezianischem Sieg. Die Bürger von Treviso und Vicenza heißen ihre neuen Herrscher willkommen. Der erste Schritt aufs Festland ist getan."
 ven_events.1.a: "Die neuen Gebiete willkommen heißen"
 ven_events.2.t: "Der Aufstieg der Terraferma"
 ven_events.2.d: "Verona und Bergamo treten unter das Banner der Republik. Das fruchtbare Ackerland und die Handelsstädte der lombardischen Ebene stärken Venedigs Wirtschaftskraft weiter."
 ven_events.2.a: "Die wirtschaftliche Entwicklung der neuen Gebiete fördern"
 ven_events.3.t: "Die Pracht des Dogenpalastes"
 ven_events.3.d: "Der wiederaufgebaute Dogenpalast steht vollendet da und verkörpert die Autorität des Dogen und das Ansehen der Republik. In seinen Sälen versammelt sich der Adel, um über die Zukunft der Republik zu beraten."
 ven_events.3.a: "Die Vollendung des Palastes feiern"
 ven_events.4.t: "Erweiterung des Arsenale"
 ven_events.4.d: "Die staatliche Werft, das Arsenale, ist erweitert und erzeugt nun Galeeren und Handelsschiffe in nie gekanntem Ausmaß. Die Seemacht der Republik erreicht neue Höhen."
 ven_events.4.a: "Das erweiterte Arsenale besichtigen"
 ven_events.5.t: "Die Vollendung der Stadt des Wassers"
 ven_events.5.d: "Kanäle, Handelshäuser, Bibliotheken, Werften – die auf der Lagune erbaute Stadt hat einen Wohlstand erreicht, dem nichts auf der Welt gleichkommt. Die „Stadt des Wassers“ ist ihres Namens würdig geworden."
 ven_events.5.a: "Die Vollendung der Stadt des Wassers verkünden"
 ven_events.6.t: "Der Krieg um Ferrara"
 ven_events.6.d: "Die Beziehungen zum Kirchenstaat werden über den Status Ferraras angespannt. Der Klerus verurteilt die Ambitionen der Republik, doch die Bürger heißen den Gebietserwerb willkommen."
 ven_events.6.a: "Die Spannungen mit dem Kirchenstaat angehen"
 ven_events.7.t: "Gebt dem Kaiser, was des Kaisers ist"
 ven_events.7.d: "Die Republik hat die Grenze zwischen kirchlichem Vorrecht und weltlicher Handelstätigkeit geklärt. Die Autorität der Kirche wird geachtet, doch Handel und Gewerbe bleiben fest unter der Kontrolle der Republik."
 ven_events.7.a: "Die Errichtung weltlicher Autorität verkünden"
 ven_events.8.t: "Der Zusammenbruch der Liga von Cambrai"
 ven_events.8.d: "Die vom Papst, dem Kaiser des Heiligen Römischen Reiches, Frankreich und Spanien gebildete Liga von Cambrai suchte die Republik zu teilen. Doch innere Zwistigkeiten ließen die Liga zusammenbrechen, und Venedig bewahrte seine Unabhängigkeit."
 ven_events.8.a: "Den Zusammenbruch der Liga bezeugen"
 ven_events.9.t: "Die Terraferma, vollendet"
 ven_events.9.d: "Die weiten Gebiete Norditaliens sind endlich in das Verwaltungssystem der Republik eingegliedert. Die Terraferma steht nun als unerschütterliches Fundament von Venedigs wirtschaftlicher und militärischer Kraft."
 ven_events.9.a: "Die Vollendung der Terraferma feiern"
 ven_events.10.t: "Der Mittelpunkt Italiens"
 ven_events.10.d: "Nachdem sie Macht zu Land und zu Wasser gesammelt hat, ist die Republik nicht länger bloß eine regionale Macht auf der italienischen Halbinsel. Die anderen Staaten beobachten Venedigs jeden Schritt, und eine neue Ordnung auf der Halbinsel beginnt Gestalt anzunehmen."
 ven_events.10.a: "Eine führende Stellung in Italien begründen"
 ven_events.11.t: "Das Tor zur Adria"
 ven_events.11.d: "Mit Zara und Pola unter der Kontrolle der Republik sind Schlüsselstellungen gesichert, die den Eingang zur Adria beherrschen. Die Flotten der Republik können nun mit größerer Sicherheit segeln."
 ven_events.11.a: "Die Verteidigung der neuen Stützpunkte stärken"
 ven_events.12.t: "Genuas Rückzug aus dem Schwarzen Meer"
 ven_events.12.d: "Genua, der langjährige Rivale der Republik, hat seine wichtigsten Stützpunkte im Schwarzmeerhandel verloren. Venezianische Kaufleute beginnen, in die neu geöffneten Märkte vorzudringen."
 ven_events.12.a: "Die Ausdehnung in die neuen Märkte fördern"
 ven_events.13.t: "Ein Stützpunkt in der Ägäis"
 ven_events.13.d: "Mit gesichertem Kreta und Methoni ist ein Stützpunkt in die Ägäis und das griechische Kernland begründet. Die Handelsschiffe der Republik weiten ihre östlichen Routen weiter aus und nutzen diese Häfen als Zwischenstationen."
 ven_events.13.a: "Die neuen Zwischenhäfen entwickeln"
 ven_events.14.t: "Die Perle Zyperns"
 ven_events.14.d: "Famagusta und Nikosia sind dem Gebiet der Republik beigetreten. Die strategisch bedeutende Insel Zypern bringt der Republik durch den Handel mit Gewürzen, Zucker und Baumwolle weiteren Reichtum."
 ven_events.14.a: "Die Wirtschaft Zyperns entwickeln"
 ven_events.15.t: "Nach Konstantinopel, noch einmal"
 ven_events.15.d: "Zum ersten Mal seit dem Vierten Kreuzzug hat Venedig die Besetzung Konstantinopels erreicht. Die Erinnerung an die alte Teilung entfacht die Ambitionen der Republik von neuem."
 ven_events.15.a: "Eine neue Verwaltungsstruktur aufbauen"
 ven_events.16.t: "Die Königin der Adria"
 ven_events.16.d: "Der Wohlstand Ragusas, die „Perle der Adria“ genannt, und die feste Verteidigung Korfus sind nun vollendet. Die Republik ist nicht länger bloß eine Macht in der Adria – sie ist die Herrin des Meeres selbst."
 ven_events.16.a: "Den Titel „Königin der Adria“ annehmen"
 ven_events.17.t: "Der Triumph der Feder"
 ven_events.17.d: "Die Republik hat ihre Interessen auf Zypern und in der umliegenden Region nicht durch militärische Gewalt, sondern durch Diplomatie und Verträge gesichert. „Greift zur Feder, nicht zum Schwert“ – dies wird zum neuen Glaubenssatz der Republik."
 ven_events.17.a: "Den diplomatischen Triumph feiern"
 ven_events.18.t: "Das Lateinische Kaiserreich, wiedergeboren"
 ven_events.18.d: "Ein neues Lateinisches Kaiserreich ist errichtet, mit Mittelpunkt Konstantinopel. Die Handelswege des Mittelmeers, die Kornkammern des Festlandes und der Reichtum des Ostens – all das liegt nun in Venedigs Händen. Die Republik hat einen neuen Vasallenstaat erhoben, das „Lateinische Kaiserreich“, mit der Hauptstadt Konstantinopel, um Thrakien, Makedonien, das griechische Kernland, die Morea und die Ägäischen Inseln zu regieren – und die kleine Republik der Adria steht nun selbst als Kaiserreich da. Der Senat verkündet der Welt den neuen kaiserlichen Rang der Republik."
 ven_events.18.a: "Die Errichtung des Lateinischen Kaiserreichs verkünden"
 STATIC_MODIFIER_NAME_ven_grain_reserves: "Getreidevorräte"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "Vom Festland herbeigeschafftes Getreide füllt die Lagunenstadt und bringt ihrem Volk Erleichterung."
 STATIC_MODIFIER_NAME_ven_scaliger_victory: "Sieg im Krieg gegen die Scaliger"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "Nachdem sie die Tyrannen von Verona gebrochen haben, tragen die Soldaten neues Vertrauen in die kommenden Feldzüge auf dem Festland."
 STATIC_MODIFIER_NAME_ven_mainland_order: "Ordnung auf dem Festland"
 STATIC_MODIFIER_DESC_ven_mainland_order: "Selbst in den neu erworbenen Gebieten laufen nun Gesetz und Verwaltung der Republik reibungslos."
 STATIC_MODIFIER_NAME_ven_terraferma_growth: "Wachstum der Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "Die fruchtbaren Lande der Terraferma bringen der Republik neuen Reichtum."
 STATIC_MODIFIER_NAME_ven_fondaco_supply: "Das Versorgungsnetz des Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "Die erweiterten Lagerhäuser sind unablässig mit Waren gefüllt, die aus jedem Winkel des Handelsnetzes eintreffen."
 STATIC_MODIFIER_NAME_ven_san_marco_square: "Der Markusplatz"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "Der erneuerte Markusplatz zeigt jedem Besucher das Ansehen der Republik."
 STATIC_MODIFIER_NAME_ven_canal_efficiency: "Kanaleffizienz"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "Boote gleiten nun geschmeidiger denn je durch die verbesserten Kanäle."
 STATIC_MODIFIER_NAME_ven_fondaco_network: "Der Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "Ausländische Kaufleute, die sich in den Handelshäusern versammeln, bringen neues Leben in die Märkte der Republik."
 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "Die Brücke des Reichtums"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "Karawanen, die die Brücke über die Lagune überqueren, tragen ihre Waren mit kaum einem Halt an den Zollschranken entlang des Weges."
 STATIC_MODIFIER_NAME_ven_doges_authority: "Die Autorität des Dogen"
 STATIC_MODIFIER_DESC_ven_doges_authority: "Die Pracht des Dogenpalastes verleiht jedem Wort des Dogen Gewicht."
 STATIC_MODIFIER_NAME_ven_arsenal_production: "Die Produktion des Arsenale"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "Im erweiterten Arsenale arbeiten Handwerker Tag und Nacht am Zusammenbau von Galeeren."
 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "Die Biblioteca Marciana"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "Die Biblioteca Marciana, entworfen von Sansovino (begonnen 1537), ist eine Schatzkammer alter Handschriften, gegründet auf der Sammlung Petrarcas. Griechische Handschriften, gebracht von Gelehrten, die nach dem Fall Konstantinopels 1453 flohen, sammelten sich in Venedig und trugen erheblich zur Verbreitung der Renaissance nach Westen bei."
 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "Vorherrschaft über die Lombardei"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "Die Werkstätten und Handwerker Mailands erzeugen unter der Leitung der Republik mehr."
 STATIC_MODIFIER_NAME_ven_genoese_settlement: "Abrechnung mit Genua"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "Mit beendeter Rivalität gegen Genua gewinnen die Kaufleute der Republik immer mehr Erfahrung in Verhandlung und Handel."
 STATIC_MODIFIER_NAME_ven_queen_of_canals: "Die Königin der Kanäle"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "Die Schiffe, die die Kanäle füllen, und die Paläste, die ihre Ufer säumen, verzaubern Reisende aus aller Welt."
 STATIC_MODIFIER_NAME_ven_ferrara_secured: "Ferrara gesichert"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "Mit gesichertem Ferrara erschüttern die Spannungen mit dem Kirchenstaat die Republik nicht mehr wie einst."
 STATIC_MODIFIER_NAME_ven_alpine_frontier: "Die Alpengrenze"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "Karawanen, die die Alpenpässe überqueren, fürchten die Gefahren der Straße nicht mehr."
 STATIC_MODIFIER_NAME_ven_papal_tension: "Spannung mit dem Kirchenstaat"
 STATIC_MODIFIER_DESC_ven_papal_tension: "Die Spannungen mit dem Papsttum halten an, doch die Kaufleute der Republik setzen ihren Handel unbeirrt fort."
 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "Transalpine Handelswege"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "Karawanen, die die Alpenpässe überqueren, fürchten die steilen Bergstraßen nicht mehr, während sie ihre Waren tragen."
 STATIC_MODIFIER_NAME_ven_secular_authority: "Weltliche Autorität"
 STATIC_MODIFIER_DESC_ven_secular_authority: "Obwohl ein katholischer Staat, zögerte Venedig nicht, die kirchliche Autorität unter staatliche Kontrolle zu stellen. Die Republik griff sogar in die Ernennung von Geistlichen, die Verwaltung des Kirchenbesitzes und die Zucht der Klöster ein und verhandelte mit dem Papst ohne Furcht vor der Exkommunikation. Dieser Säkularismus, fast eine „heilige Gotteslästerung“, verlieh Venedig eine eigentümliche Flexibilität."
 STATIC_MODIFIER_NAME_ven_cambrai_survived: "Die Liga von Cambrai überstanden"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "Nachdem sie die Belagerung überstanden haben, tragen die Soldaten und Diplomaten der Republik erneuertes Vertrauen zur Schau."
 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "Der Gipfel der Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "Die weiten Gebiete Norditaliens folgen nun dem Willen der Republik."
 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "Rang als Mittelpunkt Italiens"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "Kein Staat auf der italienischen Halbinsel kann handeln, ohne zuvor Venedigs Haltung zu bedenken."
 STATIC_MODIFIER_NAME_ven_unified_fleet: "Die vereinigte Flotte"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "Die vereinigte Flotte steht bereit, jederzeit in See zu stechen."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Schutz des Schwarzmeerhandels"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Begleitete Geleitzüge segeln zuversichtlich vom Hafen Negropontes zum Schwarzen Meer."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "Die Adria gesichert"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "Die Häfen von Zara und Pola dienen nun als sichere Zufluchtsorte für die Schiffe der Republik."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "Der Handelsposten Zadar"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "Am wiederaufgebauten Hafen von Zadar löschen Handelsschiffe, die die Adria überqueren, eines nach dem anderen ihre Fracht."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Sieg über die genuesische Rivalität"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "Das genuesische Banner weht nicht mehr über den Handelsposten des Schwarzen Meeres."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Vorherrschaft über die Ägäis"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Schiffe unter der Flagge der Republik durchqueren beständig die Häfen Kretas und Naxos’."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Dalmatien unterworfen"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "Die dalmatinische Küste ist nun auf jeder Karte als Eigentum der Republik verzeichnet."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Vorherrschaft im östlichen Handel"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "Gewürze und Seide aus dem Osten gehen nun selbstverständlich durch die Märkte Venedigs."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "Der griechische Brückenkopf gesichert"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "Von Kreta und Methoni aus dringen die Schiffe der Republik weiter ostwärts in die griechischen Meere vor."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "Der Wohlstand der Perle"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "Die Märkte Ragusas hallen wieder von den Stimmen der Kaufleute wider, zu alter Kraft zurückgekehrt."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "Die Garnison Korfus"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "Die Garnison auf den Mauern Korfus hält still Wache über das Tor zur Adria."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Zypern gesichert"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "Zucker und Baumwolle aus den Häfen Zyperns füllen die Lagerhäuser der Republik."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Grundlegung des Lateinischen Kaiserreichs"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "Wieder einmal weht das Banner der Lateiner über den Palästen Konstantinopels. Unter der Herrschaft der Republik leben Menschen vieler Glaubensrichtungen in stillem Frieden."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "Die Königin der Adria"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "Als Herrin der Adria gewinnt die Republik die Vollmacht, einen weiteren Admiral zur Führung ihrer Flotten zu ernennen."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Meisterschaft der Diplomatie"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "Die Gesandten der Republik sichern günstige Bedingungen, ohne je das Schwert zu ziehen. Die Feindseligkeit gegenüber der Republik im Ausland lässt nach, und ihre Unterhändler nutzen ihren Vorteil im Krieg mit großem Geschick."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "Das Lateinische Kaiserreich"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "Die Handelswege des Mittelmeers, die Kornkammern des Festlandes, der Reichtum des Ostens – all das liegt nun in Venedigs Händen."
 ven_italian_unity_unlock_tt: "Venedig hat das Fundament der italienischen Einheit vollendet. La Serenissima eint die italienische Halbinsel von der Adria bis zu den Alpen – zum ersten Mal seit dem antiken Rom wird ganz Italien unter einem einzigen Banner regiert."
 ven_latin_empire_unlock_tt: "Das Lateinische Kaiserreich (LAT), mit Konstantinopel als Hauptstadt, ist als Vasallenstaat unter venezianischem Schutz gegründet."
