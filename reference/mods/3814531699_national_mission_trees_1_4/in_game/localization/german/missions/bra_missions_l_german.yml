l_german:
 bra_brandenburg_mission_pack: "Blut und Eisen – von Brandenburg zum Deutschen Kaiserreich"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "Baue aus der kleinen Mark des Hauses Askanien unter den Hohenzollern das Königreich Preußen auf und erreiche durch Blut und Eisen die deutsche Einigung."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Festige die Mark, gründe das Königreich Preußen und vollende das Deutsche Kaiserreich."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "Von der Streusandbüchse des Heiligen Römischen Reiches zum Hegemon Europas."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "Die großen Fragen der Zeit werden nicht durch Reden und Mehrheitsbeschlüsse entschieden, sondern durch Eisen und Blut – einige Deutschland!"
 bra_ascanian_legacy: "Das Erbe der Askanier"
 bra_ascanian_legacy_desc: "Tritt das Erbe der vom Haus Askanien errichteten Markgrafschaft Brandenburg an und beginne ein neues Zeitalter der Herrschaft."
 bra_march_authority: "Markgräfliche Autorität festigen"
 bra_march_authority_desc: "Bändige die zersplitterten Adelslande und lass die Autorität des Markgrafen das ganze Land erreichen."
 bra_turmoil_ended_tt: "Die Katastrophe „Aufruhr in Brandenburg“ ist beendet"
 bra_altmark_secure: "Die Altmark sichern"
 bra_altmark_secure_desc: "Die Altmark, Wiege der Mark – mache ihre Herrschaft unerschütterlich."
 bra_neumark_colonization: "Die Neumark besiedeln"
 bra_neumark_colonization_desc: "Treibe die Ostsiedlung in die Neumark jenseits der Oder voran und gründe neue Siedlungen."
 bra_uckermark_integration: "Die Uckermark eingliedern"
 bra_uckermark_integration_desc: "Gliedere die Uckermark vollständig in die Markgrafschaft ein."
 bra_pomeranian_rivalry: "Rivalität mit Pommern"
 bra_pomeranian_rivalry_desc: "Löse die Rivalität mit dem Herzogtum Pommern um den Zugang zur Ostsee."
 bra_wendish_lands: "Die wendischen Lande"
 bra_wendish_lands_desc: "Dieses Land ist die Heimat der Kaschuben, Nachfahren der slawischen Wenden – begegne ihrer Kultur mit Toleranz und vertiefe ihr Verständnis für deutsche Art, um zu zeigen, dass beide Völker miteinander leben können."
 bra_berlin_dev: "Berlin entwickeln"
 bra_berlin_dev_desc: "Berlin, eine Stadt an der Spree, die nach der Vereinigung mit Cölln zum Herzen der Mark heranwuchs – entwickle sie noch weiter."
 bra_electoral_dignity: "Kurwürde"
 bra_electoral_dignity_desc: "Begründe deinen Rang als Kurfürst des Heiligen Römischen Reiches und mehre dein Ansehen darin."
 bra_hohenzollern_investiture: "Belehnung der Hohenzollern"
 bra_hohenzollern_investiture_desc: "Im Jahr 1417 verlieh Kaiser Sigismund dem Haus Hohenzollern die Kurwürde – festige die Herrschaft dieser neuen Dynastie."
 bra_hohenzollern_dynasty: "Die Hohenzollern-Dynastie gesichert"
 bra_hohenzollern_dynasty_desc: "Mache das Blut der Hohenzollern zur Säule des Staates und lege das Fundament dauerhafter Herrschaft."
 bra_imperial_diet: "Stimme im Reichstag"
 bra_imperial_diet_desc: "Stärke deine Stimme im Reichstag und nimm eine Rolle in der Reichspolitik ein."
 bra_reformation_choice: "Die Wahl der Reformation"
 bra_reformation_choice_desc: "Luthers Lehren erschüttern ganz Deutschland – auch Brandenburg muss seinen Glauben wählen."
 bra_secularize_prussia: "Preußen säkularisieren"
 bra_secularize_prussia_desc: "Fördere die Säkularisierung des Ordensstaates des Deutschen Ordens und bringe Preußen unter Brandenburgs Einfluss."
 bra_cleves_inheritance: "Das Klevische Erbe"
 bra_cleves_inheritance_desc: "Gewinne den Jülich-Klevischen Erbfolgekrieg am Rhein und sichere eine westliche Exklave."
 bra_thirty_years_war: "Den Dreißigjährigen Krieg überstehen"
 bra_thirty_years_war_desc: "Der Dreißigjährige Krieg verheert Deutschland – überstehe diese Katastrophe und bewahre die Mark."
 bra_great_elector: "Die Herrschaft des Großen Kurfürsten"
 bra_great_elector_desc: "Baue unter Friedrich Wilhelm, später „Großer Kurfürst“ genannt, die Stärke des Staates wieder auf."
 bra_standing_army: "Ein stehendes Heer aufstellen"
 bra_standing_army_desc: "Schaffe ein stehendes Heer, das unmittelbar dem Kurfürsten untersteht und nicht auf das Aufgebot des Adels angewiesen ist."
 bra_absolutism: "Den Absolutismus errichten"
 bra_absolutism_desc: "Beschneide die Macht der Stände und errichte einen Staat, in dem der Wille des Kurfürsten jeden Winkel erreicht."
 bra_sovereign_prussia: "Souveränität über Preußen"
 bra_sovereign_prussia_desc: "Streife im Frieden von Oliva die polnische Lehnshoheit über das Herzogtum Preußen ab."
 bra_king_in_prussia: "Zum König in Preußen gekrönt"
 bra_king_in_prussia_desc: "Im Jahr 1701 krönt sich Friedrich I. in Königsberg selbst zum „König in Preußen“."
 bra_prussian_administration: "Die preußische Verwaltung"
 bra_prussian_administration_desc: "Errichte eine leistungsfähige und disziplinierte Bürokratie und beschreite den Weg zum modernen Staat."
 bra_junker_integration: "Die Junker einbinden"
 bra_junker_integration_desc: "Führe den ostelbischen Junkeradel in den Kern von Heer und Verwaltung."
 bra_potsdam_dev: "Potsdam entwickeln"
 bra_potsdam_dev_desc: "Entwickle Potsdam, Sitz der königlichen Residenz, zu einem Zentrum der Hofkultur."
 bra_soldier_king: "Das Erbe des Soldatenkönigs"
 bra_soldier_king_desc: "Tritt das genügsame, militaristische Erbe Friedrich Wilhelms I., des „Soldatenkönigs“, an."
 bra_royal_treasury: "Eine volle Königliche Schatzkammer"
 bra_royal_treasury_desc: "Baue durch sparsame Finanzführung eine der vollsten Schatzkammern Europas auf."
 bra_silesian_ambition: "Ambitionen auf Schlesien"
 bra_silesian_ambition_desc: "Erhebe einen rechtmäßigen Anspruch auf das reiche Schlesien, das vom Haus Habsburg beherrscht wird."
 bra_first_silesian_war: "Der Erste Schlesische Krieg"
 bra_first_silesian_war_desc: "Der junge Friedrich II. marschiert in einem Blitzfeldzug in Schlesien ein."
 bra_silesia_annexed: "Schlesien annektiert"
 bra_silesia_annexed_desc: "Annektiere die reiche Bergbau- und Industrieregion Schlesien vollständig als wirtschaftliches Fundament Preußens."
 bra_prussian_enlightenment: "Die preußische Aufklärung"
 bra_prussian_enlightenment_desc: "Das aufklärerische Denken erblüht unter Friedrich dem Großen – verkörpere das Ideal, „der König ist der erste Diener seines Staates“."
 bra_seven_years_war: "Den Siebenjährigen Krieg überstehen"
 bra_seven_years_war_desc: "Der Siebenjährige Krieg stellt ganz Europa gegen dich – bestehe diese Prüfung und verteidige deinen Rang als Großmacht."
 bra_frederick_the_great: "Das Erbe Friedrichs des Großen"
 bra_frederick_the_great_desc: "Trage das Erbe des großen Königs, an den man sich als „Friedrich den Großen“ erinnert, in das nächste Zeitalter."
 bra_partitions_of_poland: "An den Teilungen Polens teilnehmen"
 bra_invasion_of_poland: "Einmarsch in Polen"
 bra_invasion_of_poland_desc: "Führe unsere Truppen nach Großpolen und schneide Land aus diesem geschwächten Nachbarn heraus."
 bra_partitions_of_poland_desc: "Beteilige dich an der Teilung der niedergehenden Polnisch-Litauischen Adelsrepublik und gewinne Westpreußen."
 bra_prussian_academy: "Die Preußische Akademie der Wissenschaften"
 bra_prussian_academy_desc: "Pflege die Berliner Akademie der Wissenschaften und werde ein Zentrum von Gelehrsamkeit und Wissenschaft."
 bra_prussian_army_reform: "Die preußische Heeresreform"
 bra_prussian_army_reform_desc: "Qualität oder Quantität – bestimme den Charakter des preußischen Heeres und verankere eine eigene Militärdoktrin im Staat."
 bra_napoleonic_crisis: "Die napoleonische Krise"
 bra_napoleonic_crisis_desc: "Die Niederlage bei Jena und Auerstedt – vor Napoleon steht Preußen vor einer Krise um sein Überleben."
 bra_stein_hardenberg_reforms: "Die Stein-Hardenbergschen Reformen"
 bra_stein_hardenberg_reforms_desc: "Die Zeit ist gekommen, die finanziellen Grundlagen eines uns noch immer überragenden Frankreichs zu untergraben – erreiche durch die Befreiung der Leibeigenen und Verwaltungsreformen die Wiedergeburt aus der Krise."
 bra_rhineland_acquisition: "Das Rheinland erwerben"
 bra_rhineland_acquisition_desc: "Gewinne die reichen Gebiete entlang des Rheins und lege das Fundament der Industrialisierung."
 bra_show_of_strength: "Eine Demonstration der Stärke"
 bra_show_of_strength_desc: "Bevor du nach den weiten Räumen Deutschlands greifst, zeige den Fürsten des Nordens Preußens Macht."
 bra_lower_saxony_conquest: "Niedersachsen erobern"
 bra_lower_saxony_conquest_desc: "Besiege unsere Rivalen in Lüneburg und Magdeburg, sichere den Hafen Emden in Holstein und dehne unsere Reichweite über Niedersachsen aus."
 bra_westphalian_conquest: "Die westfälische Eroberung"
 bra_westphalian_conquest_desc: "Dehne unsere Vorherrschaft über Norddeutschland weiter nach Westen aus, in die Lande Westfalens."
 bra_zollverein: "Der Zollverein"
 bra_zollverein_desc: "Führe den Zollverein, die Zollunion, die die deutschen Staaten wirtschaftlich vereint."
 bra_prussian_constitution: "Die preußische Verfassung"
 bra_prussian_constitution_desc: "Errichte durch die Verfassung von 1850 den Rahmen einer konstitutionellen Monarchie."
 bra_army_reform_1860s: "Die Heeresreform der 1860er"
 bra_army_reform_1860s_desc: "Die Militärreformen Roons und Moltkes – verfeinere die zuvor gewählte Militärdoktrin von Qualität oder Quantität zu noch größerer Höhe."
 bra_danish_war: "Krieg gegen Dänemark"
 bra_danish_war_desc: "Greife in der schleswig-holsteinischen Frage zu den Waffen gegen Dänemark."
 bra_austro_prussian_war: "Der Preußisch-Österreichische Krieg"
 bra_austro_prussian_war_desc: "Entscheide die Sache in der Schlacht bei Königgrätz und gewinne die Führung Deutschlands."
 bra_north_german_confederation: "Der Norddeutsche Bund"
 bra_north_german_confederation_desc: "Vereine die deutschen Staaten nördlich des Mains, mit Ausnahme Österreichs, und gründe den Norddeutschen Bund."
 bra_south_german_states: "Bündnis mit den süddeutschen Staaten"
 bra_south_german_states_desc: "Schmiede Militärbündnisse mit den süddeutschen Staaten Bayern, Württemberg und anderen."
 bra_franco_prussian_war: "Der Deutsch-Französische Krieg"
 bra_franco_prussian_war_desc: "Von der Emser Depesche provoziert, stelle dich dem entscheidenden Krieg gegen das Zweite Französische Kaiserreich."
 bra_alsace_lorraine_annexed: "Elsass-Lothringen annektiert"
 bra_alsace_lorraine_annexed_desc: "Annektiere Elsass und Lothringen als Kriegsbeute und präge damit eine bleibende Feindschaft mit Frankreich ein."
 bra_german_empire: "Das Deutsche Kaiserreich gegründet"
 bra_german_empire_desc: "Errichte das Deutsche Kaiserreich mit dem König von Preußen als Kaiser als Europas jüngste Großmacht."
 bra_kulturkampf: "Der Kulturkampf"
 bra_kulturkampf_desc: "Beschneide den Einfluss der katholischen Kirche und bestimme das Verhältnis von Staat und Kirche neu."
 bra_social_legislation: "Die Sozialgesetzgebung"
 bra_social_legislation_desc: "Errichte Kranken-, Unfall- und Altersversicherungssysteme als Gegenmaßnahme gegen den Sozialismus."
 bra_colonial_empire: "Ein Kolonialreich"
 bra_colonial_empire_desc: "Auf der Suche nach einem „Platz an der Sonne“ errichte Kolonien in Afrika und im Pazifik."
 bra_high_seas_fleet: "Die Hochseeflotte"
 bra_high_seas_fleet_desc: "Baue unter der Leitung von Admiral Tirpitz eine Hochseeflotte auf, die mit Großbritannien wetteifern kann."
 bra_weltpolitik: "Weltpolitik"
 bra_weltpolitik_desc: "Nimm unter Wilhelms II. Banner der „Weltpolitik“ deinen Platz unter den großen Mächten der Welt ein."
 bra_berlin_metropolis: "Groß-Berlin vollendet"
 bra_berlin_metropolis_desc: "Entwickle Berlin zu einer Weltstadt, die es mit Paris und London aufnehmen kann."
 bra_ruhr_industry_complete: "Ruhrindustrie vollendet"
 bra_ruhr_industry_complete_desc: "Treibe die Industriekraft des Ruhrgebiets an ihre Grenzen und werde eine der großen Schwerindustriemächte der Welt."
 bra_german_science: "Der Aufstieg der deutschen Wissenschaft"
 bra_german_science_desc: "Errichte ein goldenes Zeitalter der deutschen Wissenschaft, das die Welt in Physik und Chemie anführt."
 bra_naval_race: "Das Flottenwettrüsten"
 bra_naval_race_desc: "Gewinne das Flottenwettrüsten mit Großbritannien und zeige der Welt eine Seemacht, die mit jeder wetteifert."
 bra_balkan_influence: "Einfluss auf dem Balkan"
 bra_balkan_influence_desc: "Erweitere über deinen österreichischen Verbündeten den Einfluss auf der Balkanhalbinsel."
 bra_ottoman_partnership: "Partnerschaft mit den Osmanen"
 bra_ottoman_partnership_desc: "Verbünde dich mit dem „kranken Mann“ Europas, dem Osmanischen Reich, als Fußhalt im Osten."
 bra_mitteleuropa: "Mitteleuropa"
 bra_mitteleuropa_desc: "Verfolge die Vision „Mitteleuropas“ und binde Mitteleuropa in eine deutsche Wirtschaftssphäre ein."
 bra_grossdeutschland: "Großdeutschland"
 bra_grossdeutschland_desc: "Verwirkliche endlich das Ideal eines „Großdeutschlands“, das auch Österreich umfasst."
 bra_hegemon_of_europe: "Hegemon Europas"
 bra_hegemon_of_europe_desc: "Errichte eine unangefochtene Vorherrschaft über Europa in Wirtschaft, Militär und Diplomatie gleichermaßen."
 bra_second_reich_eternal: "Das Zweite Reich, ewig"
 bra_second_reich_eternal_desc: "Von einer kleinen Grenzmark zu einem Reich, das Europa beherrscht – die Geschichte des Hauses Hohenzollern erreicht ihre Vollendung."
 bra_events.1.t: "König in Preußen"
 bra_events.1.d: "Am 18. Januar 1701 krönte sich Friedrich I. in Königsberg selbst zum „König in Preußen“. Der Kurfürst von Brandenburg ist nun ein König aus eigenem Recht."
 bra_events.1.a: "Es lebe der König! Das Königreich Preußen ist gegründet!"
 bra_events.2.t: "Die Kaiserproklamation von Versailles"
 bra_events.2.d: "Am 18. Januar 1871 wurde im Spiegelsaal von Versailles König Wilhelm I. von Preußen zum Deutschen Kaiser ausgerufen. Das Zeitalter der Teilung ist zu Ende, und ein geeintes Deutsches Kaiserreich ist geboren."
 bra_events.2.a: "Es lebe der Kaiser! Es lebe das Deutsche Kaiserreich!"
 bra_events.99.t: "Das Zweite Reich, ewig"
 bra_events.99.d: "Der lange Weg, der mit der kleinen Mark des Hauses Askanien begann, hat sein Ziel erreicht. Unter den Hohenzollern herrscht Deutschland nun als Reich ohne Rivalen in Europa."
 bra_events.99.a: "Ruhm Deutschland! Es lebe das Zweite Reich!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "Das Erbe der Askanier"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "Die Erinnerung an die Askanier, deren Bärenwappen einst die Marken kennzeichnete, bleibt in die Steine der Grenzburgen gemeißelt."
 STATIC_MODIFIER_NAME_bra_march_mod: "Markgräfliche Autorität gefestigt"
 STATIC_MODIFIER_DESC_bra_march_mod: "Erlasse mit dem Siegel des Markgrafen wandern von Gut zu Gut, und selbst die Herren gehorchen nun."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Die Altmark verteidigt"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "Die Verteidigungsanlagen der Altmark, der Wiege der Mark, sind verstärkt worden."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Die Neumark besiedelt"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "Jenseits der Oder treiben deutsche Siedler ihre Pflüge in die Wildnis der Neumark."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Rivalität mit Pommern"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "Die lange Fehde mit den Herzögen von Pommern lehrte die Herren der Marken, wie man eroberte Lande regiert."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Die Uckermark eingegliedert"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "Die Kornlande der Uckermark erscheinen nun in den Büchern der markgräflichen Steuereintreiber."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Berlin entwickelt"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Berlin blüht als Herz der Mark."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Kurwürde"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Gesandte, die das Siegel eines Kurfürsten tragen, nehmen nun am kaiserlichen Hof neben den Fürsten Platz."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Belehnung der Hohenzollern"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "Ein Geschlecht, hervorgegangen aus den Burggrafen von Nürnberg, erhebt nun in den Burgen Brandenburgs das Banner einer neuen Dynastie."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Dynastie gesichert"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "Das Blut der Hohenzollern gilt nun in den Grenzburgen wie bei Hofe als unbestrittene Autorität."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Stimme im Reichstag"
 STATIC_MODIFIER_DESC_bra_diet_mod: "Auf dem Reichstag zu Regensburg lauschen die Fürsten aufmerksam, wenn der Gesandte Brandenburgs spricht."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "Wahl der Reformation"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Unter einem Kurfürsten, der Luthers Lehre annahm, lernen seine Untertanen Toleranz gegenüber Unterschieden im Glauben."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Preußen säkularisiert"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "Die Einkünfte von Landen, die einst Bistümer waren, werden nun von den eigenen Beamten des Kurfürsten verwaltet."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "Das Klevische Erbe"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "Die westliche Exklave Kleve bringt der Schatzkammer neuen Reichtum."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "Prüfung des Dreißigjährigen Krieges"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "Die Erfahrung, den Krieg überstanden zu haben, ist zum Schlüssel der Landesverteidigung geworden."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "Herrschaft des Großen Kurfürsten"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "Der Name des Großen Kurfürsten, des Siegers von Fehrbellin, ist zur Autorität der Dynastie selbst geworden."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Stehendes Heer geschaffen"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Soldaten des stehenden Heeres, allein dem Kurfürsten vereidigt, üben Tag um Tag auf den Exerzierplätzen Potsdams."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Absolutismus errichtet"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "Die Befehle des Königs reichen nun vom Hof zu Berlin bis in die Dorfstuben jedes Winkels des Staates."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Preußische Souveränität"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "Der Herzog von Preußen, der die einst dem polnischen König geschuldete Huldigung abgeworfen hat, wird an fremden Höfen nun als gleichrangiger Souverän empfangen."
 STATIC_MODIFIER_NAME_bra_administration_mod: "Preußische Verwaltung"
 STATIC_MODIFIER_DESC_bra_administration_mod: "Die von den Schreibern des Generaldirektoriums entworfenen Bücher und Vorschriften tragen die Verwaltung jedes Winkels des Königreichs."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Junker eingebunden"
 STATIC_MODIFIER_DESC_bra_junker_mod: "Die Junker fungieren nun als Kern von Heer und Verwaltung."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Potsdam entwickelt"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "Die königliche Residenz Potsdam blüht als Zentrum der Hofkultur."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "Das Erbe des Soldatenkönigs"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "Die vom Soldatenkönig hinterlassene Genügsamkeit und strenge Disziplin haften noch immer an den Mauern der Kasernen."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "Eine volle Schatzkammer"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "In den sparsam geführten königlichen Gewölben stapeln sich Truhen voll Silber für die kommenden Kriege."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Ambitionen auf Schlesien"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "Offiziere, die von den fruchtbaren Tälern Schlesiens träumen, warten ungeduldig auf den Marschbefehl."
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "Der Erste Schlesische Krieg"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "Blitzartig durch den Schnee marschierend, stand das Heer vor den Toren Breslaus, ehe Österreich seine Mobilmachung auch nur beendet hatte."
 STATIC_MODIFIER_NAME_bra_silesia_mod: "Schlesien annektiert"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "Der Reichtum, geboren aus Schlesiens Schmelzöfen und Webstühlen, fließt unablässig in die Schatzkammer zu Berlin."
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "Die preußische Aufklärung"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "Die Ideale der Aufklärung, die sich vom Hof von Sanssouci ausbreiten, vermehren die Schulen in den Dörfern."
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "Prüfung des Siebenjährigen Krieges"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "Die Erfahrung, gegen ganz Europa gekämpft zu haben, hat militärische Disziplin geschmiedet."
 STATIC_MODIFIER_NAME_bra_frederick_mod: "Das Erbe Friedrichs des Großen"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "Der Name Friedrichs des Großen wird weitergetragen als Stolz des Soldaten wie als Glanz des Staates."
 STATIC_MODIFIER_NAME_bra_partitions_mod: "Die Teilungen Polens"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "Preußische Beamte und Landvermesser ziehen einer nach dem anderen in die in den Teilungen gewonnenen Dörfer Westpreußens ein."
 STATIC_MODIFIER_NAME_bra_academy_mod: "Die Preußische Akademie"
 STATIC_MODIFIER_DESC_bra_academy_mod: "Die Vorlesungen der an der Berliner Akademie versammelten Gelehrten ziehen Studenten aus dem ganzen Land an."
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "Einmarsch in Polen"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "In den eroberten Städten Großpolens erheben sich nach und nach deutsche Schilder und Ämter."
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "Die napoleonische Krise"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "Die Erfahrung, die Krise überwunden zu haben, wird zum Fundament der Landesverteidigung."
 STATIC_MODIFIER_NAME_bra_reforms_mod: "Die Stein-Hardenbergschen Reformen"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "Die Reformen Steins und Hardenbergs befreiten den Bauern von der Leibeigenschaft und öffneten die Türen des Staatsdienstes."
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "Das Rheinland erworben"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "Die Steuern, die aus den reichen Städten und Kohlebergwerken am Rhein aufsteigen, erfreuen die Schatzmeister in Berlin."
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "Eine Demonstration der Stärke"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "Die Fürsten Norddeutschlands zogen sich, nachdem sie das Aufgebot der Truppen auf dem Berliner Exerzierplatz gesehen hatten, mit wenigen Worten zurück."
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "Niedersachsen erobert"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "Der Sieg des preußischen Heeres auf den Ebenen Hannovers hat die Karte Norddeutschlands neu gezeichnet."
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "Westfalen erobert"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "Die Bürgermeister der westfälischen Städte beginnen, den Weisungen der Berliner Beamten zu folgen."
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "Der Zollverein"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "An den Grenzen der Zollunion fahren die Wagen durch, ohne auf das Heben der Zollschranke zu warten."
 STATIC_MODIFIER_NAME_bra_constitution_mod: "Die preußische Verfassung"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "Die in den Artikeln der Verfassung niedergelegten Rollen von Parlament und Monarch haben der politischen Praxis eine neue Ordnung gebracht."
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "Krieg gegen Dänemark"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "Die triumphale Heimkehr der preußischen Soldaten, die die Schanzen von Düppel stürmten, beschleunigte die Vereinigung von Schleswig und Holstein."
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "Der Preußisch-Österreichische Krieg"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "Auf dem Feld von Königgrätz hat das Hinterladergewehr alles umgestürzt, was Soldaten für die Regeln des Krieges hielten."
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "Norddeutscher Bund"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "An dem Tag, als die Flagge des Norddeutschen Bundes zum ersten Mal über dem Berliner Schloss wehte, wussten die Gesandten der Staaten, dass eine neue Zeit begonnen hatte."
 STATIC_MODIFIER_NAME_bra_south_german_mod: "Bündnis mit dem Süden"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "Gesandte, die den Pakt mit Preußen halten, gehen nun selbst an den Höfen Bayerns und Württembergs ein und aus."
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "Der Deutsch-Französische Krieg"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "In der Nacht, als die Nachricht vom Sieg bei Sedan Berlin erreichte, war jede Straße von Jubel erfüllt."
 STATIC_MODIFIER_NAME_bra_alsace_mod: "Elsass-Lothringen annektiert"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "Die Schornsteine der elsässischen Textilfabriken und Eisenbergwerke treiben die Industrie des neuen Deutschen Kaiserreichs an."
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "Der Kulturkampf"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "Die neuen Einrichtungen, die im Gefolge des Ringens zwischen Staat und Kirche geformt wurden, haben die Grenzen zwischen den Ämtern des Staates und den Pfarreien neu gezogen."
 STATIC_MODIFIER_NAME_bra_social_mod: "Sozialgesetzgebung"
 STATIC_MODIFIER_DESC_bra_social_mod: "Arbeiter, die an den Schaltern für Krankenversicherung und Altersrente anstehen, wissen, dass der Staat sie nicht im Stich lässt."
 STATIC_MODIFIER_NAME_bra_colonial_mod: "Ein Kolonialreich"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "Auf den Decks der Dampfer, die zu den Kolonien Afrikas und der Südsee auslaufen, stehen Auswanderer, die von einer neuen Welt träumen."
 STATIC_MODIFIER_NAME_bra_fleet_mod: "Die Hochseeflotte"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "Aus den Schornsteinen der im Kieler Kriegshafen aufgereihten Panzerschiffe steigt der Rauch eines Entschlusses, die Handelswege zu schützen."
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "Weltpolitik"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "Die Karten im Auswärtigen Amt zu Berlin zeigen nun eine Weltpolitik, die von Afrika bis Asien reicht."
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "Groß-Berlin vollendet"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "Die Weltstadt Berlin erstrahlt als Zentrum von Wohlstand und Regierung."
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "Ruhrindustrie vollendet"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "Die Hochöfen des Ruhrgebiets speien Tag und Nacht Feuer und schicken deutschen Stahl in die Welt hinaus."
 STATIC_MODIFIER_NAME_bra_science_mod: "Der Aufstieg der deutschen Wissenschaft"
 STATIC_MODIFIER_DESC_bra_science_mod: "Entdeckungen, geboren in den Laboratorien von Göttingen und Berlin, haben Deutschland zum Zentrum der Wissenschaft der Welt gemacht."
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "Das Flottenwettrüsten"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "Auf den Helgen zu Wilhelmshaven ist der Kiel des nächsten Schlachtschiffs bereits gelegt."
 STATIC_MODIFIER_NAME_bra_balkan_mod: "Einfluss auf dem Balkan"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "Die Angelegenheiten des Balkans, die die Diplomaten Wiens und Berlins täglich erörtern, schmieden die beiden Verbündeten immer enger aneinander."
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "Partnerschaft mit den Osmanen"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "Mit jeder Meile der verlegten Bagdadbahn vertieft sich das Band zwischen Berlin und Konstantinopel."
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "Mitteleuropa"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "Die Vision einer einzigen Wirtschaftssphäre in Mitteleuropa verbreitet sich leise selbst unter den Kaufleuten und Beamten der Nachbarländer."
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "Großdeutschland"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "„Was ist des Deutschen Vaterland?“ – die von Wien bis Berlin gesungene alte Frage findet endlich ihre Antwort."
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "Hegemon Europas"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "Kein Hof Europas kann mehr eine wichtige Entscheidung treffen, ohne zuvor die Wünsche Berlins zu erkunden."
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "König in Preußen"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "Seit dem Tag der Krönung in der Schlosskirche von Königsberg ging der preußische Hof daran, die Zeremonien eines Königreichs zu gestalten."
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "Das Zweite Reich, ewig"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "Seit der Proklamation im Spiegelsaal von Versailles strahlt die Krone der Hohenzollern an der Spitze Europas."
