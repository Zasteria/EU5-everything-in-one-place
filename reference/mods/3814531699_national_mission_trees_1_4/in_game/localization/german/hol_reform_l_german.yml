l_german:
 hol_republican_reform: "Republik unter der Souveränität der Staaten"
 hol_republican_reform_desc: "Eine einzigartige Regierungsform ohne Statthalter, in der die Souveränität bei den Versammlungen der sieben Provinzen liegt – sie begünstigt den Handel und die Interessen des Bürgerstandes, doch fällt der Unterhalt eines stehenden Heeres einigermaßen schwer."
