 noble_auto_marry.63.h: "Menüyü Kapat"
 noble_auto_marry.64.t: "Saray Nüfus Sınırları"
 noble_auto_marry.64.d: "Saray ancak belirli sayıda saraylıyı barındırabilir. Sarayın herkesi ağırlayamayacağını cümleye duyuran bir politika belirleyebilir, böylece saraya yeni katılımları caydırabiliriz.\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_pop_limit')]. Saray nüfus sınırının üzerindeyken otomatik evlilikler gerçekleşemez."
 noble_auto_marry.64.a: "Sarayda herkese yer olduğunu ilan et (nüfus sınırı yok)"
 noble_auto_marry.64.g: "Nüfus sınırını 500 olarak belirle"
 noble_auto_marry.64.b: "Nüfus sınırını 200 olarak belirle"
 noble_auto_marry.64.c: "Nüfus sınırını 100 olarak belirle"
 noble_auto_marry.64.e: "Nüfus sınırını 50 olarak belirle"
 noble_auto_marry.64.f: "Değişiklik yapmadan menüyü kapat"
 noble_auto_marry.65.t: "Evlilik Uygunluk Ayarları"
 noble_auto_marry.65.d: "Devletin, saray erkânının evlilikleri üzerindeki denetimi mutlak olmak zorunda değildir. Belirli ölçütlerimizi karşılamaları hâlinde kimi saray mensuplarının evlenmesine müsaade edecek bazı politikalar ilan edebiliriz.\n\nŞu anda, geçerli saray evlilik politikası [ROOT.GetCountry.Custom('get_nobles_auto_marry_eligibility_settings')]"
 noble_auto_marry.65.a: "Saray mensupları serbestçe evlenebilir"
 noble_auto_marry.65.b: "Saray mensupları, aileleri fazla büyük olmadığı sürece evlenebilir"
 noble_auto_marry.65.c: "Saray mensupları, yalnızca soylarını sürdürmek maksadıyla evlenebilir"
 noble_auto_marry.65.e: "Değişiklik yapmadan menüyü kapat"
 noble_auto_marry.66.t: "Soylu Olmayan Evlilikler"
 noble_auto_marry.66.d: "Soyluların işleri sıkı sıkıya denetlenir; her aileden, mevkilerine yakışır biriyle evlenmesi beklenir. Ne var ki sarayımızın yegâne mensupları onlar değildir; diğer zümrelerden kişiler, kiminle evlenecekleri hususunda daha az beklentiyle karşı karşıyadır. Dilersek, soylu olmayanların evlenmesine müsaade eden politikalar ilan edebiliriz.\n\n Şu anda, [ROOT.GetCountry.Custom('get_noble_only_auto_marry_setting')]#color_yellow [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]#![ROOT.GetCountry.Custom('get_burghers_auto_marry_setting')][ROOT.GetCountry.Custom('get_clergy_auto_marry_setting')][ROOT.GetCountry.Custom('get_peasants_auto_marry_setting')][ROOT.GetCountry.Custom('get_dhimmi_auto_marry_setting')][ROOT.GetCountry.Custom('get_tribes_auto_marry_setting')][ROOT.GetCountry.Custom('get_cossacks_auto_marry_setting')] gözetim olmaksızın evlenmesine müsaade edilir."
 noble_auto_marry.66.a: "Evlilik haklarını [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] ile sınırla"
 noble_auto_marry.66.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] için evliliği aç/kapat"
 noble_auto_marry.66.c: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] mensupları için evliliği aç/kapat"
