l_turkish:

 noble_auto_marry.1.t: "[target_male.GetNameWithNoTooltip], [target_female.GetNameWithNoTooltip] ile evleniyor"
 noble_auto_marry.1.d: "Aylar süren hazırlık ve kur yapmanın ardından [target_male.GetName], [target_female.GetName] ile evlendi ve [target_male.GetDynasty.GetName] ile [target_female.GetDynasty.GetName] soylu hanedanları arasında bir köprü daha kurdu. İkilinin soylu hanedan çizgilerini sürdürmeleri, gelecek nesli soylarına yakışır biçimde yetiştirmeleri beklenmektedir."
 noble_auto_marry.1.a: "Geline ve Damada Tebriklerimizi Sunarız"
 noble_auto_marry.1.b: "Bırakalım soylular şenliklerinin tadını çıkarsın"
 hide_marriage_events.tt: "Soyluların birbiriyle evlenmesine dair olayları artık almayacaksınız"
 noble_auto_marry.2.t: "[unmarried_royal.GetNameWithNoTooltip] Kısmetini Bekliyor"
 noble_auto_marry.2.d: "[unmarried_royal.GetName], henüz evlenmemiş olması meselesini [ROOT.GetCountry.GetGovernment.GetRuler.GetName] ile dile getirdi ve bu süregelen kararsızlık karşısındaki endişelerini ifade etti"
 noble_auto_marry.2.a: "[unmarried_royal.GetNameWithNoTooltip] için elbette uygun bir eş bulacağız"
 noble_auto_marry.2.b: "[unmarried_royal.GetNameWithNoTooltip] gönlünün muradını soylularımızın arasından seçebilir"
 unmarried_royal_will_find_suitable_spouse.tt: "[unmarried_royal.GetName] kendi eşini seçecek ve önümüzdeki bir yıl içinde yerel bir soylu ile evlenecek"
 noble_auto_marry.3.t: "[unmarried_royal.GetNameWithNoTooltip], [target_suitor.GetNameWithNoTooltip] ile evleniyor"
 noble_auto_marry.3.d: "Aylar süren hazırlık ve kur yapmanın ardından [unmarried_royal.GetName], [target_suitor.GetName] ile evlendi ve [unmarried_royal.GetDynasty.GetName] ile [target_suitor.GetDynasty.GetName] soylu hanedanları arasında bir köprü daha kurdu. İkilinin soylu hanedan çizgilerini sürdürmeleri, gelecek nesli soylarına yakışır biçimde yetiştirmeleri beklenmektedir."
 noble_auto_marry.3.a: "Geline ve Damada Tebriklerimizi Sunarız"
 auto_marry_reminder_sent: "Evlilik Hususunda Görüştü"
 auto_marry_reminder_sent_desc: "Bu karakter daha önce hükümdara başvurarak evlilik beklentilerini sormuştu"
 noble_auto_marry.63.t: "Saray Evlilik Politikaları"
 noble_auto_marry.63.d: "Kuramda [ROOT.GetCountry.GetGovernment.GetRulerTitle], saray erkânı arasında düzenlenen her evliliği onaylama ya da reddetme ayrıcalığına sahiptir. Ne var ki uygulamada, saray içindeki ilişkiler üzerinde bu denli eksiksiz bir denetim sağlamak çoğu zaman güç, hatta neredeyse olanaksızdır.\n\nŞu anda, [ROOT.GetCountry.Custom('get_noble_auto_marry_disabled')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_message_settings')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_royal_reminder_settings')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_pop_limit')]\n\nGeçerli saray evlilik politikası [ROOT.GetCountry.Custom('get_nobles_auto_marry_eligibility_settings')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_culture_settings')]\n\nŞu an itibarıyla, [ROOT.GetCountry.Custom('get_noble_only_auto_marry_setting')]#color_yellow [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]#![ROOT.GetCountry.Custom('get_burghers_auto_marry_setting')][ROOT.GetCountry.Custom('get_clergy_auto_marry_setting')][ROOT.GetCountry.Custom('get_peasants_auto_marry_setting')][ROOT.GetCountry.Custom('get_dhimmi_auto_marry_setting')][ROOT.GetCountry.Custom('get_tribes_auto_marry_setting')][ROOT.GetCountry.Custom('get_cossacks_auto_marry_setting')] gözetim olmaksızın evlenmesine müsaade edilir."
 noble_auto_marry.63.a: "Evlilik Olay Bildirimlerini Aç/Kapat"
 noble_auto_marry.63.b: "Saray Nüfus Sınırlarını Yönet"
 noble_auto_marry.63.c: "Evlilik Uygunluk Ayarları"
 noble_auto_marry.63.e: "Soylu Olmayan Evlilik İzinlerini Yönet"
 noble_auto_marry.63.f: "Otomatik Evlilikleri Aç/Kapat"
