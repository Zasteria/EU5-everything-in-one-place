 eu5ab_step_dec_100: "-100"
 eu5ab_step_inc_100: "+100"
 eu5ab_building_rules_title: "建筑规则"
 eu5ab_building_rules_desc: "第一行按就业阶层筛选，第二行按解锁时代分组。建筑优先级范围为 0.0–10.0；0 表示完全禁止建造。特殊页仅展示当前国家在至少一个自有地点满足建造前置的特殊建筑。"
