 eu5ab_diag_result_help: "食物紧急保障开启且满足条件时，优先安排产粮项目；其他工程按「自动建造顺序」安排，同类项目无法开工时会尝试备选。\n原产按短缺、价格、就业及战略需求判断，仍须满足游戏建造条件。\n成功开工后才扣减预算并占用名额；本轮安排结束后，开工地点等待 3 个月再安排新工程。"
