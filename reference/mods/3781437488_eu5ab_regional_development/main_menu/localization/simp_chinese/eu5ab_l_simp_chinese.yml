 eu5ab_reset_confirm_desc: "保留模板和设置，取消地点应用，并重置计划、等待间隔、报告、总督建议及在建和年度支出记录。已花费金币不退还，已有工程继续施工；需重新应用模板。\n若刚切换国家，用切换前保存的模板和设置替换当前国家的对应设置。"
 eu5ab_deep_confirm_desc: "重新检查全国使用已启用模板的地点，替换本月未执行的计划。采用当前策略、食物紧急保障和建造顺序，最后一项可超出剩余预算。\n领土较多时可能需要等待，完成前窗口无法关闭。保存后，本月设置变化不再影响这份计划；23 日起安排开工，次月恢复通常检查。"
 eu5ab_decision_continue: "继续，开始计算"
 eu5ab_decision_cancel: "取消"
 eu5ab_decision_done: "完成"
 eu5ab_deep_event_finish: "完成"
 eu5ab_deep_event_cancel: "取消"
 eu5ab_manual_before_23: "必须在每月 23 日之前使用（1–22 日）"
 eu5ab_manual_not_dispatched: "本月尚未开始安排工程开工"
 eu5ab_manual_waiting: "正在制定本月建造计划，请稍候。完成后即可关闭此窗口。"
 eu5ab_manual_rgo: "原产扩建"
 eu5ab_manual_expired: "游戏日期已跨月，本次未执行计划已作废。新月份恢复正常调度。"
 eu5ab_manual_results: "本月建造计划已保存。\n计划工程：[Player.MakeScope.ScriptValue('eu5ab_manual_count_ui')|0] 项\n预计支出：[Player.MakeScope.ScriptValue('eu5ab_manual_cost_ui')|2]\n23 日起安排开工；0 项表示没有符合条件的工程。"
 eu5ab_reset_decision.title: "重置自动建造"
 eu5ab_reset_decision.desc: "保留模板和设置，取消地点应用并重置建造记录。之后需重新应用模板。"
