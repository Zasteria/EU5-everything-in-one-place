 eu5ab_cash_short_desc: "Saldo mínimo que debe permanecer en el tesoro."
 eu5ab_cash_label: "Reserva del tesoro"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] de oro"
 eu5ab_cash_help: "Antes de construir, los costes estimados de este y otros proyectos previstos deben dejar suficiente oro para la reserva del tesoro.\nCon 1.050 de oro y una reserva de 1.000, un proyecto estimado en 100 no puede iniciarse. Los costes reales de ORR pueden diferir de las estimaciones. También debe quedar parte del presupuesto anual."
 eu5ab_budget_section_title: "Presupuesto anual de construcción"
 eu5ab_budget_short_desc: "Elige una cantidad fija o una asignación anual basada en los ingresos mensuales totales."
 eu5ab_budget_mode_fixed: "Presupuesto fijo"
 eu5ab_budget_mode_income: "Vinculado a ingresos"
 eu5ab_budget_multiplier_4: "×4 Conservador"
 eu5ab_budget_multiplier_6: "×6 Recomendado"
 eu5ab_budget_multiplier_8: "×8 Activo"
 eu5ab_budget_effective_label: "Presupuesto del año actual"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] de oro"
 eu5ab_budget_label: "Presupuesto anual"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] de oro/año"
 eu5ab_budget_cash_comparison: "El presupuesto anual fija el gasto planificado; la reserva del tesoro establece cuánto oro conservar. El proyecto final puede superar el presupuesto restante, pero debe superar la comprobación de reserva."
 eu5ab_budget_reset_note: "Se reinicia en la primera comprobación del nuevo año; deduce el gasto real solo tras iniciar la construcción. Modificar el presupuesto no borra los gastos registrados."
 eu5ab_budget_help: "Los edificios comunes y las expansiones de ORR comparten un presupuesto anual: una cantidad fija o 4, 6 u 8 veces los ingresos mensuales totales. Se reinicia en la primera comprobación del nuevo año; modificarlo durante el año mantiene los gastos ya registrados.\nSolo cuentan los inicios de obra exitosos, a su coste real. El proyecto final puede superar el presupuesto restante; luego no se añadirán más proyectos. Los requisitos de reserva del tesoro siguen siendo obligatorios."
 eu5ab_quota_section_title: "Límite de construcciones simultáneas de este Mod"
 eu5ab_quota_short_desc: "Establece cuántos proyectos civiles puede gestionar este mod al mismo tiempo además del espacio base."
 eu5ab_hard_cap_label: "Proyectos simultáneos adicionales"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] proyectos (el límite total es este valor + 1)"
 eu5ab_quota_help: "Establece las plazas adicionales más allá del primer proyecto: 0 permite 1 proyecto simultáneo; 599 permite 600. Los edificios comunes y las ORR las comparten. Solo cuentan los proyectos inconclusos de este mod; la construcción manual, carreteras y otros mods no cuentan. Cada ciclo solo cubre las plazas libres. Una ubicación puede recibir varios proyectos si el espacio lo permite, y luego espera 3 meses tras el ciclo antes de recibir nuevos proyectos."
