 eu5ab_diag_result_help: "Cuando se aplican las salvaguardas alimentarias activadas, los proyectos de comida van primero. Los demás proyectos siguen el Orden de Construcción Automática, probando alternativas si un proyecto no puede comenzar.\nLas ORR se evalúan por escasez, precios, empleo y necesidades estratégicas, sujetos a los requisitos de construcción del juego base.\nSolo los inicios de obra exitosos consumen presupuesto y espacio de construcción. Tras el ciclo, las ubicaciones con nuevos proyectos esperan 3 meses antes de recibir nuevas construcciones."
 eu5ab_diag_rgo_title: "Comprobaciones de candidatos ORR"
 eu5ab_diag_rgo_short_desc: "Cada ubicación registra un resultado; un rechazo cuenta para la primera causa encontrada."
 eu5ab_diag_rgo_help: "Muestra la última comprobación de expansión de ORR. Los puestos existentes deben estar cubiertos. Considerar población prevé nuevos trabajadores; Flexible no lo hace. Los precios, las ganancias de producción aún no logradas y la escasez actual de mano de obra afectan a la prioridad. Las ganancias de producción se combinan para proyectos propios que producen el mismo bien en el mismo mercado; las cifras incompletas solo muestran importes conocidos. Alcanzar el límite pausa los nuevos inicios, no los proyectos existentes."
