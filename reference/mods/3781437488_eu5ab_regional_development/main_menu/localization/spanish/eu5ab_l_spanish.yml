 eu5ab_set_cash_reserve_0: "Este Mod: reserva del tesoro 0"
 eu5ab_set_cash_reserve_0_desc: "Fija en 0 la reserva mínima del tesoro para la construcción automatizada de esta ubicación."
 eu5ab_set_cash_reserve_500: "Este Mod: reserva del tesoro 500"
 eu5ab_set_cash_reserve_500_desc: "Fija en 500 la reserva mínima del tesoro para la construcción automatizada de esta ubicación."
 eu5ab_set_cash_reserve_1000: "Este Mod: reserva del tesoro 1000"
 eu5ab_set_cash_reserve_1000_desc: "Fija en 1000 la reserva mínima del tesoro para la construcción automatizada de esta ubicación."
 eu5ab_set_cash_reserve_2000: "Este Mod: reserva del tesoro 2000"
 eu5ab_set_cash_reserve_2000_desc: "Fija en 2000 la reserva mínima del tesoro para la construcción automatizada de esta ubicación."
 eu5ab_enable_special_buildings_for_location: "Este Mod: permitir edificios especiales"
 eu5ab_enable_special_buildings_for_location_desc: "Permite que la construcción automatizada construya o mejore edificios especiales en la ubicación seleccionada."
 eu5ab_disable_special_buildings_for_location: "Este Mod: prohibir edificios especiales"
 eu5ab_disable_special_buildings_for_location_desc: "Impide que la construcción automatizada construya o mejore edificios especiales en la ubicación seleccionada."
 eu5ab_decouple_selected_location: "Este Mod: dejar de seguir la plantilla provincial"
 eu5ab_decouple_selected_location_desc: "Los cambios futuros de la plantilla provincial ya no actualizarán la ubicación seleccionada."
 eu5ab_clear_selected_location_policy: "Este Mod: borrar política de ubicación"
 eu5ab_clear_selected_location_policy_desc: "Selecciona una ubicación y luego elimina su asignación de plantilla y los ajustes relacionados."
 eu5ab_rgo_short_desc: "Los puestos existentes deben estar cubiertos. El ajuste predeterminado es Flexible; elige Considerar población para prever trabajadores en los nuevos puestos."
 eu5ab_rgo_help: "Los puestos existentes de ORR deben estar totalmente cubiertos. El modo Flexible, por defecto, no prevé nuevos trabajadores; Considerar población requiere que se prevea suficiente mano de obra dentro del plazo establecido.\nLos precios iguales o inferiores al mínimo pausan la expansión. Los precios bajos reducen la prioridad y los altos la aumentan. Los proyectos con puntuación inferior a 0 no comienzan.\nLos edificios comunes y las ORR de tu propiedad que producen el mismo bien en el mismo mercado comparten un límite de expansión. Incluye ganancias de producción aún no logradas de proyectos en curso o terminados, y tiene en cuenta la nueva demanda de insumos de proyectos previstos. La construcción adicional pierde prioridad a medida que las ganancias previstas se acercan al déficit de demanda más el 10% de la demanda. Los nuevos inicios se pausan al alcanzar dicha cantidad. El último nivel puede superarla; los proyectos existentes continúan.\nDesactivar la protección de mano de obra detiene las previsiones, pero la escasez actual sigue reduciendo la prioridad. Las salvaguardas alimentarias activadas pueden priorizar las ORR pertinentes y eximir de límites de precio y expansión. El pleno empleo existente y los requisitos aplicables de mano de obra, presupuesto y construcción del juego base siguen siendo obligatorios."
 eu5ab_workforce_help: "Los edificios comunes utilizan por defecto una previsión de 12 meses; las ORR en modo Considerar población usan 180 meses. Las estimaciones se basan en las tasas actuales de ascenso, modificadores locales y nacionales, Numerosas oportunidades, alfabetización y población apta. La migración, cambios de tasas y otros puestos competidores pueden alterar los resultados.\nDesactivar la protección de mano de obra detiene las previsiones. La escasez actual reduce la prioridad sin cambiar el beneficio previsto; las salvaguardas alimentarias siguen aplicándose según la configuración."
