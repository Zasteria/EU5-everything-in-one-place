 eu5ab_open_confirmation: "Abrir confirmación"
 eu5ab_reset_confirm: "Confirmar restablecimiento"
 eu5ab_reset_confirm_desc: "Conserva plantillas y ajustes, pero borra asignaciones de ubicaciones, planes, periodos de espera, informes, recomendaciones y registros de proyectos y gastos anuales. El oro gastado no se reembolsa; las construcciones existentes continúan. Vuelve a asignar las plantillas después.\nTras cambiar de país, sustituye las plantillas y ajustes de este país por los guardados antes del cambio."
 eu5ab_deep_confirm_desc: "Vuelve a comprobar las ubicaciones propias con plantillas activadas y sustituye el plan no ejecutado de este mes. Usa la estrategia actual, salvaguardas alimentarias y orden de construcción; el último proyecto puede superar el presupuesto restante.\nLos países grandes pueden tardar; la ventana no puede cerrarse hasta que termine la planificación. Los cambios posteriores de ajustes no modificarán este plan. Organiza la construcción a partir del día 23; reanuda las comprobaciones habituales el mes que viene."
