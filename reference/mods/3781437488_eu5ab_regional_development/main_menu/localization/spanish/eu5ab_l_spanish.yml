 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Define el presupuesto, requisitos de construcción, estrategia de decisión y rendimiento compartidos por todas las plantillas. Cada plantilla guarda su estado, cobertura y prioridades."
 eu5ab_regional_development__general_name: "Controles y límites"
 eu5ab_regional_development__finance_name: "Finanzas y mercado"
 eu5ab_regional_development__automation_name: "Seguridad y clasificación"
 eu5ab_regional_development__performance_name: "Optimización del rendimiento"
 eu5ab_regional_development__performance__preset_name: "Preajuste de rendimiento"
 eu5ab_regional_development__performance__preset_desc: "Los preajustes ajustan las opciones siguientes. Cambiar una opción avanzada pasa a Personalizado; los valores nuevos se aplican en la siguiente comprobación mensual."
 eu5ab_regional_development__performance__advanced_name: "Ajustes avanzados"
 eu5ab_regional_development__performance__advanced_desc: "Ajusta las comprobaciones diarias de ubicaciones, los nuevos proyectos por ciclo y el número de alternativas. Comprobar más proyectos puede llevar más tiempo."
 eu5ab_regional_development__general__limits_name: "Controles y límite simultáneo"
 eu5ab_regional_development__general__limits_desc: "Controla si el mod se ejecuta y cuántos proyectos civiles puede gestionar simultáneamente."
 eu5ab_regional_development__general__returns_name: "Reglas de rendimiento y excepciones de emergencia"
 eu5ab_regional_development__general__returns_desc: "Define el rendimiento mínimo de edificios normales y si la falta de alimentos, materiales, bienes militares o insumos estratégicos puede eximirlo."
 eu5ab_regional_development__finance__budget_name: "Presupuesto anual compartido"
 eu5ab_regional_development__finance__budget_desc: "Todas las plantillas, edificios y ORR comparten un único presupuesto anual nacional."
 eu5ab_regional_development__finance__market_name: "Rango de precios de mercado"
 eu5ab_regional_development__finance__market_desc: "Define porcentajes compartidos de precio mínimo y referencia alta respecto al precio base."
 eu5ab_regional_development__automation__safety_name: "Reglas de seguridad de construcción"
 eu5ab_regional_development__automation__safety_desc: "Reglas compartidas para edificios especiales, fuentes previas, mano de obra y falta de insumos."
 eu5ab_regional_development__automation__rgo_name: "Ampliación de ORR"
 eu5ab_regional_development__automation__workforce_name: "Previsión de mano de obra"
 eu5ab_regional_development__automation__workforce_desc: "Configura el horizonte máximo de previsión al proyectar la disponibilidad futura de mano de obra."
 eu5ab_regional_development__automation__ranking_name: "Estrategia de decisión de construcción"
 eu5ab_regional_development__automation__ranking_desc: "Elige la estrategia de edificios normales, ordena mejoras, ampliaciones, ORR y construcciones nuevas y ajusta la influencia de insumos locales."
 eu5ab_regional_development__candidate_ranking_mode_name: "Estrategia de edificios normales"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Probar otros proyectos"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Si los proyectos principales del tipo actual no pueden comenzar, prueba alternativas de menor clasificación. Cada ubicación obtiene hasta 2 intentos adicionales por ciclo en Planificación de oferta y demanda o 5 en Selección por beneficio previsto, compartidos entre los tipos comunes. Se detiene en cuanto se inicia un edificio común allí. Cargar una partida no restaura los intentos. Todos los requisitos siguen vigentes. Desactivado por defecto; surte efecto en el siguiente ciclo y puede aumentar el tiempo de comprobación."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Elige cómo se priorizan los edificios comunes válidos. Las salvaguardas alimentarias y el Orden de Construcción Automática tienen prioridad. Las ORR se evalúan por separado según escasez, precios, empleo y necesidades estratégicas."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Oferta y demanda"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Clasifica los proyectos por escasez de mercado, necesidad estratégica, eficiencia de recetas, insumos locales, precios y riesgo laboral, favoreciendo cadenas completas y estabilidad a largo plazo."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Beneficio previsto"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtra candidatos según las reglas de plantilla y seguridad, y prioriza la construcción por el beneficio neto mensual previsto, incluidas las ganancias de molinos y los ahorros de graneros. Con beneficios cercanos, las prioridades de plantilla sirven como criterio secundario."
 eu5ab_regional_development__automation__candidate_priority_name: "Orden de construcción automatizada"
 eu5ab_regional_development__automation__candidate_priority_desc: "Arrastre los cuatro tipos al orden deseado. El mod intenta todos los proyectos posibles del tipo actual antes de pasar al siguiente; si un proyecto no puede iniciarse, busca otro del mismo tipo. Durante una crisis alimentaria, los proyectos de comida se procesan primero respetando este orden."
 eu5ab_regional_development__candidate_priority_name: "Orden de construcción automatizada"
 eu5ab_regional_development__candidate_priority_desc: "Arrastra para ordenar mejoras, ampliaciones normales, ampliaciones de ORR y edificios nuevos."
 eu5ab_regional_development__candidate_priority_item_column_name: "Tipo de construcción"
 eu5ab_regional_development__candidate_priority_i1_name: "Mejorar edificios"
 eu5ab_regional_development__candidate_priority_i1_desc: "Sustituye un edificio obsoleto por el nivel desbloqueado más reciente de su cadena."
 eu5ab_regional_development__candidate_priority_i2_name: "Ampliar edificios existentes"
 eu5ab_regional_development__candidate_priority_i2_desc: "Añade un nivel a un edificio normal existente, sin sustituciones ni ORR."
 eu5ab_regional_development__candidate_priority_i3_name: "Ampliar ORR"
 eu5ab_regional_development__candidate_priority_i3_desc: "Expande las ORR locales, exigiendo pleno empleo existente y cumpliendo las reglas de precio, presupuesto anual y reserva del tesoro."
 eu5ab_regional_development__candidate_priority_i4_name: "Construir edificios nuevos"
 eu5ab_regional_development__candidate_priority_i4_desc: "Construye desde cero un edificio normal que aún no existe en la ubicación."
 eu5ab_regional_development__enabled_name: "Activar construcción automatizada"
 eu5ab_regional_development__enabled_desc: "Activa o desactiva las comprobaciones mensuales de construcción automatizada. Las plantillas y asignaciones de ubicaciones se conservan cuando está desactivado."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Proyectos simultáneos adicionales"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Cuántos proyectos civiles puede gestionar este mod al mismo tiempo además del espacio base. 0 significa 1 proyecto en total y 599 significa 600; la construcción manual, carreteras y otros mods no usan este límite."
 eu5ab_regional_development__budget_mode_name: "Modo de presupuesto anual"
 eu5ab_regional_development__budget_mode_desc: "Elige una cantidad fija o 4, 6 u 8 veces los ingresos mensuales totales. Se recalcula en la primera comprobación del nuevo año; modificar los ajustes conserva los gastos ya registrados."
 eu5ab_regional_development__budget_mode_option_1_name: "Presupuesto anual fijo"
 eu5ab_regional_development__budget_mode_option_2_name: "Ingresos mensuales ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Ingresos mensuales ×6 (recomendado)"
 eu5ab_regional_development__budget_mode_option_4_name: "Ingresos mensuales ×8"
 eu5ab_regional_development__economic_metric_name: "Umbral económico de edificios ordinarios"
 eu5ab_regional_development__economic_metric_desc: "Los edificios de producción comunes deben cumplir la condición seleccionada: ingreso o beneficio mensual previsto positivo, o una rentabilidad anualizada del 5%. Los rendimientos reales pueden variar. La infraestructura pública común está exenta. Los molinos requieren ganancias netas positivas de la producción adicional y un rendimiento anual del 5% en los modos de tasa de rentabilidad. Los graneros construidos para evitar el deterioro siempre requieren un 5%. Las ORR siguen reglas independientes."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Ingreso mensual > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Inicia solo si el juego prevé ingresos mensuales positivos."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Beneficio mensual > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Inicia solo si el juego prevé beneficio mensual total positivo."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Rentabilidad anualizada de ingresos ≥ 5%"
 eu5ab_regional_development__economic_metric_option_3_desc: "El ingreso mensual previsto debe ser de al menos el 5% del coste de construcción dividido entre 12. Esto compara el ingreso antes de los costes operativos."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Rentabilidad anualizada del beneficio ≥ 5%"
 eu5ab_regional_development__economic_metric_option_4_desc: "El beneficio mensual previsto debe ser de al menos el 5% del coste de construcción dividido entre 12. El beneficio real puede variar según las condiciones operativas."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Se agotarán los alimentos: construir primero, ignorar rendimiento"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Cuando se prevea el agotamiento de alimentos en el mercado, atiende primero los proyectos alimentarios y exime a los edificios de comida del umbral de rentabilidad. Los proyectos alimentarios siguen el Orden de Construcción Automática, y todas las reglas de presupuesto, tesoro, mano de obra, insumos, materiales y construcción del juego siguen vigentes."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Alimentos al 25 % o menos: construir primero, ignorar rendimiento"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Si las reservas de comida del mercado caen al 25% o menos, prioriza proyectos de alimentos y exime a los edificios de comida del umbral de rentabilidad. El Orden de Construcción Automática y las reglas de seguridad siguen activos."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Suministro de construcción bajo 65 %: ignorar rendimiento"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Cuando un material de construcción clave tiene menos del 65% del suministro necesario, sus edificios quedan exentos del umbral de rentabilidad. El resto de reglas de construcción siguen vigentes."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Suministro militar en guerra bajo 65 %: ignorar rendimiento"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "En guerra, si un bien militar tiene menos del 65% del suministro necesario, los edificios que lo producen quedan exentos del umbral de rentabilidad. El resto de reglas siguen vigentes."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Producción estratégica sin insumos: ignorar rendimiento previo"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Cuando la oferta de una materia prima en el mercado sea inferior al 65% de la demanda y en ese mismo mercado haya un edificio nacional abierto que produzca alimentos, materiales básicos de construcción o bienes militares, consuma esa materia prima y sufra escasez de insumos, los productores de esa materia prima quedan exentos del umbral de rentabilidad seleccionado. El edificio consumidor no tiene que haber detenido la producción, y el insumo que le falta no tiene que ser precisamente esa materia prima. Todas las demás reglas de construcción siguen vigentes."
 eu5ab_regional_development__fixed_annual_budget_name: "Presupuesto anual fijo"
 eu5ab_regional_development__fixed_annual_budget_desc: "Usado solo en modo fijo; todas las plantillas comparten esta cantidad."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Reserva mínima del tesoro"
 eu5ab_regional_development__min_cash_reserve_desc: "Conserva esta reserva tras los costes estimados de todos los proyectos previstos. Los costes reales de ORR pueden diferir."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Porcentaje de precio mínimo"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Porcentaje de referencia de precio alto"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Permitir edificios especiales"
 eu5ab_regional_development__allow_special_buildings_desc: "Permite considerar edificios especiales; los requisitos de construcción del juego siguen vigentes."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Cubrir escasez de mercado con plazas libres de construcción"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "Tras los proyectos regulares, usa el espacio de construcción libre para cubrir la escasez en ubicaciones propias revisadas en este ciclo dentro del mismo mercado. Tiene en cuenta las necesidades de insumos de proyectos previstos y las ganancias de producción aún no logradas. Los preajustes integrados pueden añadir industrias no planificadas; las prohibiciones, prioridad personalizada 0 y demás requisitos de construcción siguen vigentes."
 eu5ab_regional_development__auto_build_input_sources_name: "Construir fuentes previas con escasez"
 eu5ab_regional_development__auto_build_input_sources_desc: "Comprueba de forma independiente la escasez en el mercado de insumos y construye fuentes previas permitidas, incluso cuando las fábricas posteriores tengan todo su personal pero carezcan de insumos."
 eu5ab_regional_development__pause_low_workforce_name: "Pausar con poca mano de obra"
 eu5ab_regional_development__stop_input_shortage_name: "Detener con escasez de insumos críticos"
 eu5ab_regional_development__stop_input_shortage_desc: "Los insumos industriales clave necesarios deben tener un suministro de mercado que cubra al menos el 75% de la demanda antes de poder organizar la construcción correspondiente."
 eu5ab_regional_development__allow_rgo_name: "Permitir ampliación de ORR"
 eu5ab_regional_development__allow_rgo_desc: "Permite que todas las plantillas consideren ampliar ORR."
 eu5ab_regional_development__native_input_priority_name: "Prioridad de insumos locales"
 eu5ab_regional_development__native_input_priority_desc: "0–10; valores mayores aumentan la prioridad de edificios que consumen materias primas de la misma provincia."
 eu5ab_regional_development__performance_preset_name: "Preajuste de rendimiento"
 eu5ab_regional_development__performance_preset_desc: "Un preajuste sincroniza las opciones avanzadas siguientes. Personalizado conserva sus valores actuales."
 eu5ab_regional_development__performance_preset_option_1_name: "Conservador"
 eu5ab_regional_development__performance_preset_option_1_desc: "Comprueba hasta 10 ubicaciones al día e inicia como máximo 30 proyectos por ejecución. Candidatos de planificación: 5; de beneficio: 15. Se detiene al reunir suficientes."
 eu5ab_regional_development__performance_preset_option_2_name: "Equilibrado"
 eu5ab_regional_development__performance_preset_option_2_desc: "Comprueba hasta 20 ubicaciones al día e inicia como máximo 50 proyectos por ejecución. Candidatos de planificación: 4; de beneficio: 12. Se detiene al reunir suficientes."
 eu5ab_regional_development__performance_preset_option_3_name: "Rendimiento máximo"
 eu5ab_regional_development__performance_preset_option_3_desc: "Para países con muchas ubicaciones. Comprueba hasta 30 al día sin límite por ejecución. Candidatos de planificación: 3; de beneficio: 10. Se detiene al reunir suficientes."
 eu5ab_regional_development__performance_preset_option_4_name: "Personalizado"
 eu5ab_regional_development__performance_preset_option_4_desc: "Usa los ajustes avanzados actuales."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Muchas ubicaciones con plantillas pueden reducir el rendimiento."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "En Rendimiento Máximo se revisan hasta 30 ubicaciones diarias sin límite por ciclo. Estados muy extensos pueden experimentar mayor tiempo en el cambio mensual."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Oferta y demanda\" tarda demasiado: reduzca \"Candidatos de planificación\"."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Solo aparece con Oferta y demanda. Menos Candidatos de planificación reduce los proyectos por ubicación y tipo enviados a comprobaciones posteriores."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Consecuencia: menos candidatos alternativos pueden omitir proyectos viables posteriores."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Los proyectos se revisan por puntuación de planificación. Reducir el límite de candidatos deja menos opciones si fallan los primeros, pudiendo omitir proyectos viables posteriores."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "«Beneficio previsto» tarda demasiado: reduce «Candidatos de beneficio por ubicación»."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Se muestra solo con «Beneficio previsto». Reduce «Candidatos de beneficio por ubicación» para disminuir las alternativas comprobadas más tarde."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Menos alternativas pueden dejar sin opciones si los proyectos principales no pueden comenzar."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Las alternativas se conservan tras clasificarlas por beneficio previsto y preferencias de edificios. Conservar menos deja menos opciones cuando los proyectos principales no pueden comenzar."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "También reduce ubicaciones diarias o adiciones por ejecución."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Menos ubicaciones diarias reparten las comprobaciones en más días. Menos adiciones por ciclo reducen los proyectos organizados de una vez. Establecer las adiciones en 0 elimina el límite por ciclo."
 eu5ab_regional_development__parallel_location_scan_name: "Procesar ubicaciones por separado"
 eu5ab_regional_development__parallel_location_scan_desc: "Comprueba ubicaciones por separado para reducir pausas, o juntas cada día cuando está desactivado. Las prioridades, el presupuesto y el orden de construcción permanecen iguales."
 eu5ab_regional_development__daily_location_task_limit_name: "Ubicaciones comprobadas al día"
 eu5ab_regional_development__daily_location_task_limit_desc: "Máximo de ubicaciones revisadas en detalle cada día. Valores menores implican menos trabajo diario pero más días para cubrir el país."
 eu5ab_regional_development__max_additions_per_run_name: "Adiciones máximas por ejecución"
 eu5ab_regional_development__max_additions_per_run_desc: "Limita el número máximo de proyectos iniciados en una sola ejecución (0 a 600). Cero significa sin límite."
 eu5ab_regional_development__candidates_per_location_name: "Candidatos de planificación por ubicación"
 eu5ab_regional_development__candidates_per_location_desc: "Activo solo en 'Planificación de oferta y demanda'. Establece, para cada ubicación y categoría de construcción ordinaria, el número de candidatos retenidos por puntuación de planificación para comprobaciones posteriores (3–30). Retener más opciones evita perder alternativas viables, pero aumenta la carga computacional."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Candidatos de beneficio por ubicación"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Solo para Selección por beneficio previsto. Mantiene 3–30 alternativas por ubicación y tipo de construcción común, clasificadas por beneficio previsto y preferencias de edificios. Más alternativas ofrecen más opciones cuando los proyectos principales no pueden comenzar, pero pueden ralentizar comprobaciones posteriores."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Detener al encontrar suficientes candidatos"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Detiene las comprobaciones detalladas de otras ubicaciones una vez que las alternativas alcancen el doble de los proyectos que se pueden añadir en este ciclo. Las plazas libres y las Adiciones máximas por ciclo determinan este número; 0 solo elimina el tope por ciclo. Los requisitos de construcción siguen vigentes."
 eu5ab_diagnostics_cmm_hint: "Cambia las reglas compartidas en los Ajustes de mod de Community Mod Framework. El informe de construcción muestra el último resultado automatizado."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "Aumentar en 10"
 eu5ab_cmm_shift_decrease_10: "Reducir en 10"
 eu5ab_cmm_shift_increase_1000: "Aumentar en 1000"
 eu5ab_cmm_shift_decrease_1000: "Reducir en 1000"
 eu5ab_cmm_shift_increase_max: "Fijar al máximo"
 eu5ab_cmm_shift_decrease_min: "Fijar al mínimo"
 eu5ab_regional_development__automation__rgo_desc: "Considera la expansión de ORR una vez que los puestos existentes estén cubiertos. Elige si deseas prever trabajadores para nuevos puestos."
 eu5ab_regional_development__rgo_workforce_mode_name: "Modo de mano de obra de ORR"
 eu5ab_regional_development__rgo_forced_relaxed_name: "Modo de ORR: Flexible (pausa por mano de obra desactivada)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "Sin previsión de mano de obra. Los puestos existentes deben estar cubiertos; la falta de trabajadores para nuevos puestos solo reduce la prioridad de construcción."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Flexible por defecto. Desactivar la protección de mano de obra usa temporalmente el modo Flexible y reduce la prioridad por falta actual de mano de obra. Reactivarla restaura el modo seleccionado. Los puestos existentes siempre deben estar cubiertos."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Flexible"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Sigue las reglas generales de expansión del juego base: una vez cubiertos los puestos existentes, evalúa precios, necesidades del mercado y producción esperada sin prever nuevos trabajadores. Con la protección de mano de obra activada, la escasez de mano de obra para nuevos puestos no reduce la prioridad."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Considerar población"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "Tras comprobar el pleno empleo existente, estima los ascensos cualificados durante el horizonte previsto. Pausa si la mano de obra no puede cubrir el siguiente nivel."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "Horizonte poblacional de ORR (meses)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "En el modo Considerar población, la expansión requiere que se prevea suficiente mano de obra dentro de este periodo para cubrir los nuevos puestos. Por defecto: 180 meses. Rango: 0-1200; cero solo cuenta los trabajadores disponibles actualmente. La estimación considera Numerosas oportunidades, alfabetización y la población apta para cambiar de profesión. Las previsiones más largas pueden diferir más de los resultados reales. Haz clic para ajustar en 1 mes, mantén Ctrl para 12 meses o Shift para 120 meses."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "Cuando está activado, los edificios comunes necesitan suficiente previsión de trabajadores; las ORR usan su modo seleccionado. Desactivarlo detiene las previsiones y usa temporalmente el modo Flexible para ORR. La escasez actual reduce la prioridad sin bloquear nuevos proyectos por sí sola. Los puestos de ORR existentes aún deben estar cubiertos. Reactivarlo restaura el modo anterior de ORR."
 eu5ab_regional_development__job_fill_deadline_months_name: "Horizonte de mano de obra de edificios comunes (meses)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Horizonte independiente para edificios comunes: por defecto 12 meses, rango de 0 a 240. Cero solo cuenta trabajadores inactivos cualificados actuales. Las ORR que consideran población usan su propio horizonte. Las tasas de ascenso actuales son una estimación, no una garantía."
 eu5ab_regional_development__price_min_desc: "Por defecto: 80% del precio base. Precios más bajos reducen la prioridad. Pausa la construcción cuando todas las producciones estén en el umbral o por debajo; pondera múltiples producciones por cantidad y precio base. Al 100% o más, solo se aplica el umbral. Las salvaguardas alimentarias activadas pueden eximir de límites de precio."
 eu5ab_regional_development__price_max_desc: "Por defecto: 125%. Los precios superiores al base añaden prioridad gradualmente hasta la referencia. Con una referencia del 125%, un precio del 112,5% añade 70 puntos; 125% o más añade 140. Si la referencia es del 100% o inferior, cualquier precio sobre el base añade 140."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
 eu5ab_cmm_shift_increase_120: "Aumentar en 120 meses"
 eu5ab_cmm_ctrl_increase_12: "Aumentar en 12 meses"
 eu5ab_cmm_ctrl_increase_default: "Aumentar en [Multiply_CFixedPoint(Player.MakeScope.GetVariableFromVariableMap('cmm_step', MakeScopeFlag(Scope.GetFlagName)).GetValue, '(CFixedPoint)5')]"
 EU5AB_CMM_NUMERIC_DECREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_decrease_12', 'eu5ab_cmm_ctrl_decrease_default')]"
 eu5ab_cmm_shift_decrease_120: "Disminuir en 120 meses"
 eu5ab_cmm_ctrl_decrease_12: "Disminuir en 12 meses"
 eu5ab_cmm_ctrl_decrease_default: "Disminuir en [Multiply_CFixedPoint(Player.MakeScope.GetVariableFromVariableMap('cmm_step', MakeScopeFlag(Scope.GetFlagName)).GetValue, '(CFixedPoint)5')]"
 eu5ab_regional_development__governors_name: "Recomendaciones de gobernadores"
 eu5ab_regional_development__governors__recommendations_name: "Recomendaciones y actualización"
 eu5ab_regional_development__governors__recommendations_desc: "Analiza candidatos a gobernador local y gobernador naval sin construir, demoler ni reubicar edificios."
 eu5ab_regional_development__governors__scoring_name: "Preferencias de puntuación"
 eu5ab_regional_development__governors__scoring_desc: "Elige cómo se pondera el valor de la ubicación y si se incluye un valor estratégico limitado."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Activar recomendaciones de gobernadores"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Sugiere periódicamente emplazamientos para gobernador local y naval. Desactivarlo conserva los últimos resultados pero elimina las alertas de recomendación."
 eu5ab_regional_development__governor_refresh_interval_name: "Intervalo de actualización"
 eu5ab_regional_development__governor_refresh_interval_desc: "Establece el intervalo de actualización. Ciertos cambios de territorio, capital, rango de ubicación y gobierno activan actualizaciones anticipadas. Las carreteras y otros cambios de proximidad se incluyen en las comprobaciones programadas."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "Cada mes"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "Se actualiza más rápido y es adecuado para países pequeños. Comprobaciones frecuentes pueden causar pausas más largas en países grandes."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "Cada 3 meses"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Equilibrio entre respuesta a cambios viales y rendimiento en países grandes."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "Cada 6 meses"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Menor frecuencia de recálculo para países grandes."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "Cada 12 meses"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "Coste mínimo, pero los cambios en carreteras y proximidad pueden tardar hasta un año en reflejarse."
 eu5ab_regional_development__governor_refresh_now_name: "Recalcular ahora"
 eu5ab_regional_development__governor_refresh_now_text: "Recalcular ahora"
 eu5ab_regional_development__governor_refresh_now_desc: "Recalcula las recomendaciones de sedes locales y navales ahora mismo, incluso durante la pausa. Los países grandes pueden experimentar una breve ralentización."
 eu5ab_regional_development__governor_scoring_profile_name: "Perfil de valor de ubicación"
 eu5ab_regional_development__governor_scoring_profile_desc: "Pondera la base impositiva potencial, la población y el desarrollo. Las puntuaciones se estiman a partir del valor de las ubicaciones multiplicado por las mejoras previstas de proximidad, en lugar de un valor final de control; el control actual no suma ni resta."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Mixto"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Equilibra el valor económico y el administrativo-demográfico."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Económico"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Prioriza la base fiscal potencial y la escala económica consolidada."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "Población administrativa"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Prioriza la población y el desarrollo."
 eu5ab_regional_development__governor_strategic_value_name: "Incluir valor estratégico"
 eu5ab_regional_development__governor_strategic_value_desc: "Aplica una ponderación limitada a puertos, ubicaciones fronterizas y fortificadas. Solo modifica el valor de ubicación y no constituye un componente de puntuación independiente."
 eu5ab_governor_window_title: "Detalles de recomendaciones de gobernadores"
 eu5ab_governor_window_intro: "Consulte sugerencias de nuevos sitios y de reubicación. Los cambios en edificios quedan a su discreción."
 eu5ab_governor_road_tier_help: "Las estimaciones usan el nivel de camino más alto desbloqueado; las ganancias reales pueden variar.\nCada plan fija el otro tipo de sede. Recalcula tras los cambios; las ganancias no se pueden sumar."
 eu5ab_governor_refresh_button: "Recalcular"
 eu5ab_governor_refresh_button_tt: "Reevalúa nuevos emplazamientos, traslados y disposiciones para sedes de gobernador local y naval. Los países grandes pueden experimentar una breve pausa; las comprobaciones incompletas muestran un aviso."
 eu5ab_governor_local_section: "Gobernador local"
 eu5ab_governor_local_diagnostics: "Último cálculo de sede local: etapa [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0], estado [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0]; capacidad [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0], recuento del motor [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0] sedes locales y [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0] lugartenencias; otras plazas ocupadas [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0].\nRecuento por ubicación: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0] sedes locales y [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0] lugartenencias; otras plazas ocupadas [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0]; plaza libre (motor/ubicación) [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0]; discrepancia [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0] (1 significa diferente).\nUmbral de ganancia de nuevo sitio [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1]; sitios candidatos [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0], sitios evaluados [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]."
 eu5ab_governor_naval_section: "Gobernador naval"
 eu5ab_governor_naval_diagnostics: "Último cálculo de sedes navales: estado [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_status_ui')|0]; actualizaciones [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_runs_ui')|0]."
 eu5ab_governor_new_slot_state: "Hay un hueco disponible. Puede construir una sede de gobernador en uno de estos sitios."
 eu5ab_governor_empty_title: "No hay candidatos adecuados"
 eu5ab_governor_no_recommendation: "#weak Recalcule después de desarrollar su territorio o ciudades.#!"
 eu5ab_governor_candidate_1: "Rango 1"
 eu5ab_governor_candidate_2: "Rango 2"
 eu5ab_governor_candidate_3: "Rango 3"
 eu5ab_governor_view_location: "Ver ubicación"
 eu5ab_governor_view_location_tt: "Mueve la cámara del mapa a este candidato."
 eu5ab_governor_local_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1').GetLocation.GetName]"
 eu5ab_governor_local_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2').GetLocation.GetName]"
 eu5ab_governor_local_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "Puntuación global [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Ganancia por mejora de proximidad local [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Ganancia por mejora de proximidad circundante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nSe espera que la proximidad mejore en [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] ubicaciones (incluida la sede).\nLas puntuaciones se calculan multiplicando el valor de las ubicaciones por el aumento previsto de proximidad, no siendo un valor final de control; el control actual no suma ni resta, y el control real sigue evolucionando mediante el control máximo y las mecánicas normales del juego."
 eu5ab_governor_local_candidate_2_breakdown: "Puntuación global [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Ganancia por mejora de proximidad local [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Ganancia por mejora de proximidad circundante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nSe espera que la proximidad mejore en [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] ubicaciones (incluida la sede).\nLas puntuaciones se calculan multiplicando el valor de las ubicaciones por el aumento previsto de proximidad, no siendo un valor final de control; el control actual no suma ni resta, y el control real sigue evolucionando mediante el control máximo y las mecánicas normales del juego."
 eu5ab_governor_local_candidate_3_breakdown: "Puntuación global [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Ganancia por mejora de proximidad local [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Ganancia por mejora de proximidad circundante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nSe espera que la proximidad mejore en [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] ubicaciones (incluida la sede).\nLas puntuaciones se calculan multiplicando el valor de las ubicaciones por el aumento previsto de proximidad, no siendo un valor final de control; el control actual no suma ni resta, y el control real sigue evolucionando mediante el control máximo y las mecánicas normales del juego."
 eu5ab_governor_naval_candidate_1_breakdown: "Puntuación general [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = Ganancia de mejora de proximidad del sitio [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Ganancia de mejora de proximidad del entorno [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nSe espera que la proximidad mejore en [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] lugares (incluido el sitio).\nLas puntuaciones se estiman multiplicando los valores de los lugares por el aumento de proximidad esperado, sin constituir el valor de control final; el control actual no suma ni resta puntos, y el control real seguirá evolucionando según el control máximo y las mecánicas normales del juego."
 eu5ab_governor_naval_candidate_2_breakdown: "Puntuación general [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = Ganancia de mejora de proximidad del sitio [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + Ganancia de mejora de proximidad del entorno [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\nSe espera que la proximidad mejore en [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] lugares (incluido el sitio).\nLas puntuaciones se estiman multiplicando los valores de los lugares por el aumento de proximidad esperado, sin constituir el valor de control final; el control actual no suma ni resta puntos, y el control real seguirá evolucionando según el control máximo y las mecánicas normales del juego."
 eu5ab_governor_naval_candidate_3_breakdown: "Puntuación general [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = Ganancia de mejora de proximidad del sitio [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + Ganancia de mejora de proximidad del entorno [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\nSe espera que la proximidad mejore en [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] lugares (incluido el sitio).\nLas puntuaciones se estiman multiplicando los valores de los lugares por el aumento de proximidad esperado, sin constituir el valor de control final; el control actual no suma ni resta puntos, y el control real seguirá evolucionando según el control máximo y las mecánicas normales del juego."
