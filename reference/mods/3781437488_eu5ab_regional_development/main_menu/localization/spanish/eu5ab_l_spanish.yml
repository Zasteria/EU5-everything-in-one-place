 eu5ab_operating_rules_title: "Reglas de construcción"
 eu5ab_operating_rules_short_desc: "Configura edificios especiales, construcción de fuentes y escasez de insumos."
 eu5ab_operating_rules_help: "Los edificios especiales deben cumplir las condiciones de desbloqueo y construcción del juego.\nLa escasez de insumos puede impulsar la construcción de proveedores permitidos por la plantilla, incluso si las fábricas existentes cuentan con todo su personal.\nCon la protección de insumos activada, el suministro de los insumos industriales clave necesarios debe cubrir el 75% de la demanda. Usa los métodos de producción actuales siempre que sea posible; en caso contrario, estima un método disponible. Los métodos alternativos se evalúan por separado; los métodos de producción no se cambian automáticamente."
 eu5ab_rgo_section_title: "ORR"
 eu5ab_rgo_allow: "Permitir que esta plantilla amplíe ORR"
 eu5ab_toggle_special_buildings: "Permitir edificios especiales"
 eu5ab_toggle_auto_build_input_sources: "Construir fuentes cuando falten insumos"
 eu5ab_toggle_pause_low_workforce: "Pausar expansión por falta de mano de obra"
 eu5ab_ranking_mode_section_title: "Estrategia de decisión de construcción"
 eu5ab_town_rights_preference_desc: "Los derechos urbanos y Promover industria añaden hasta 500 puntos de planificación cada uno de forma independiente. El apoyo industrial solo se aplica a producciones directas de edificios coincidentes en tu zona promocionada, ponderadas por la producción de la receta elegida a precios base; no se propaga por las cadenas de suministro. Ambos se acumulan con los puntos de insumos locales. El modo de beneficio solo usa estos puntos para la preselección. La expansión de ORR solo conserva la bonificación de derechos urbanos. Todas las condiciones de construcción siguen vigentes."
 eu5ab_ranking_mode_current_label: "Modo actual"
 eu5ab_ranking_mode_composite_value: "#G Planificación de oferta y demanda#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Selección por beneficio previsto#!"
 eu5ab_ranking_mode_common_desc: "Ambas estrategias solo consideran edificios desbloqueados y construibles con prioridad superior a 0. También deben cumplir los requisitos de rendimiento, presupuesto, reserva, insumos, mano de obra y seguridad. Las emergencias alimentarias y el orden automático tienen prioridad."
 eu5ab_ranking_mode_composite_desc: "Equilibra escasez de mercado, demanda estratégica, eficiencia, materias primas locales, precios y mano de obra, priorizando cadenas productivas completas y estabilidad duradera."
 eu5ab_ranking_mode_actual_profit_desc: "Filtra proyectos candidatos según las reglas de plantilla y seguridad, priorizando la construcción por el beneficio neto mensual previsto, incluidas las ganancias de recursos de molinos y el valor de comida preservada por graneros. Cuando los beneficios son cercanos, las prioridades de la plantilla sirven como referencia secundaria."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Conserva las 3–30 alternativas configuradas por ubicación y tipo de construcción común. Las salvaguardas alimentarias y el Orden de Construcción Automática tienen prioridad; los requisitos de rentabilidad y construcción siguen vigentes. Las ORR se evalúan por separado según escasez, precios, empleo y necesidades estratégicas."
 eu5ab_ranking_mode_help: "Estrategia de decisión\nCambie de estrategia en Community Mod Framework → Configuración de mods → Construcción automática avanzada → Seguridad y clasificación → Estrategia de decisión de construcción.\n• Planificación de oferta y demanda: Enfatiza la oferta y la demanda del mercado, cadenas de producción completas y estabilidad económica a largo plazo.\n• Selección por beneficio previsto: Utiliza el beneficio neto mensual previsto, incluidas ganancias de molinos y ahorro de descomposición en graneros, con prioridades de la plantilla como desempate."
 eu5ab_workforce_section_title: "Mano de obra"
 eu5ab_pause_workforce_short_desc: "Controla si la falta de mano de obra bloquea la expansión."
 eu5ab_job_fill_deadline_label: "Horizonte de previsión de mano de obra"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_value: "Horizonte de previsión de mano de obra: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_desc: "Establece el horizonte máximo de previsión de mano de obra en meses (0–240). Cero cuenta únicamente los trabajadores disponibles actualmente, sin futuros ascensos sociales. «Pausar con poca mano de obra» determina si la escasez de trabajadores impide iniciar las obras: si está activado, una previsión insuficiente bloquea el inicio; si está desactivado, la escasez solo reduce la prioridad de construcción."
 eu5ab_deadline_0: "0 mes"
 eu5ab_deadline_3: "3 meses"
 eu5ab_deadline_6: "6 meses"
 eu5ab_deadline_12: "12 meses"
 eu5ab_toggle_stop_input_shortage: "Detener expansión por escasez crítica de insumos"
 eu5ab_prediction_status_label: "Estimación de mano de obra"
 eu5ab_status_promotion_forecast: "#G Previsión de ascensos para el plazo elegido#!"
 eu5ab_status_conservative_fallback: "#L Estimación prudente según mano de obra actual#!"
 eu5ab_prediction_promotion_short_desc: "Combina trabajadores disponibles con ascensos previstos a la clase requerida en el horizonte (hasta 240 meses)."
 eu5ab_prediction_unavailable_short_desc: "Sin previsión fiable, se basa estrictamente en los trabajadores desempleados actuales."
 eu5ab_native_input_section_title: "Preferencia por insumos locales"
 eu5ab_native_input_short_desc: "Mejora la clasificación de edificios que usan materias primas de la misma provincia."
 eu5ab_native_input_priority_label: "Prioridad de insumos locales"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Prioridad de insumos locales: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Preferencia de materias primas locales\nLocal se refiere a la provincia del edificio. El sistema verifica las materias primas requeridas por la receta y otorga una bonificación de clasificación si existen ORR correspondientes en la provincia; insumos con mayor peso en la receta otorgan mayor bonificación.\n• 0 ignora materias primas locales, 5 es la recomendación predeterminada y 10 otorga el peso máximo.\n• Este ajuste solo afecta las puntuaciones de clasificación; la construcción real sigue sujeta a escasez, beneficios, mano de obra y condiciones del juego base.\n• Solo comprueba la existencia de una ORR correspondiente, no su nivel o producción.\n• La escasez de insumos, bajo acceso mercantil o bajo control reducen la bonificación. Las propias ORR no reciben esta bonificación. Las estimaciones usan métodos de producción disponibles; los métodos de producción no se cambian automáticamente."
 eu5ab_price_section_title: "Rango de precios"
 eu5ab_price_short_desc: "Filtra y clasifica edificios de producción por precio de mercado."
 eu5ab_price_min_label: "Precio mínimo"
 eu5ab_price_max_label: "Referencia de precio alto"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Los precios usan el precio base como 100%. Los precios bajos reducen la prioridad; pausa la construcción si todas las producciones están en el mínimo o por debajo. Pondera las producciones múltiples por cantidad y precio base. Las bonificaciones por precio alto dejan de crecer en el valor de referencia; los precios altos no bloquean la construcción. Los edificios sin bienes producidos están exentos. Las salvaguardas alimentarias se aplican según la configuración."
 eu5ab_active_cash_value: "Reserva del tesoro: [GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Precio mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Referencia de precio alto: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Precio mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Referencia de precio alto: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Reglas de construcción automatizada"
 eu5ab_prediction_diagnostics_title: "Estimación de mano de obra y estado de construcción"
 eu5ab_prediction_section_body: "Organiza mejoras, expansiones comunes, expansiones de ORR y nuevos edificios según tu Orden de Construcción Automática elegido, intentando primero los proyectos válidos del tipo actual.\nCuando se aplican las salvaguardas alimentarias activadas, los proyectos de comida relevantes van primero y los límites de rentabilidad, precio u otros se relajan según la configuración. Las salvaguardas activadas para materiales de construcción, suministros de guerra o insumos estratégicos también pueden relajar los requisitos de rentabilidad.\nEl presupuesto, la reserva del tesoro y los requisitos aplicables de insumos, mano de obra, capacidad de edificios y construcción del juego base siguen vigentes. Solo se considera el nivel desbloqueado más reciente de edificios comunes; las mejoras solo computan los puestos de trabajo añadidos."
 eu5ab_diagnostics_title: "Estado de la construcción automatizada"
 eu5ab_diagnostics_snapshot_note: "Los ajustes se guardan de inmediato. Los informes se actualizan a medida que avanzan las comprobaciones y comienzan los proyectos, conservando los resultados después."
 eu5ab_diagnostics_snapshot_help: "El informe se actualiza a medida que avanzan las comprobaciones y comienza la construcción, conservando los resultados hasta el siguiente ciclo. Los proyectos se organizan a partir del día 23, por lo que los recuentos y gastos pueden cambiar gradualmente. Algunos resultados quedan pendientes hasta que finalicen las comprobaciones."
