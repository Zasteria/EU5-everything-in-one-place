 eu5ab_diag_result_help: "Etkin gıda korumaları devreye girdiğinde gıda projeleri önceliklidir. Diğer projeler Otomatik İnşa Sırasını izler; bir proje başlayamazsa alternatifler denenir.\nK.T.O projeleri, oyunun inşaat gereksinimleri çerçevesinde kıtlık, fiyat, istihdam ve stratejik ihtiyaçlara göre değerlendirilir.\nYalnızca başarıyla başlatılan projeler bütçe ve inşaat yuvası kullanır. Yeni proje atanan iller, tur sona erdikten sonra ek inşaat için 3 ay bekler."
 eu5ab_diag_rgo_title: "K.T.O Aday Denetimleri"
 eu5ab_diag_rgo_short_desc: "Her il bir sonuç kaydeder; ret ilk karşılaşılan nedene yazılır."
 eu5ab_diag_rgo_help: "Son K.T.O genişletme denetimini gösterir. Mevcut işler tamamen dolu olmalıdır. Nüfusu Dikkate Al modu yeni işçileri tahmin eder; Rahat modu etmez. Fiyatlar, henüz gerçekleşmemiş çıktı artışları ve mevcut işçi eksiklikleri önceliği etkiler. Çıktı artışları, aynı pazarda aynı malı üreten sahip olduğunuz projeler için toplanır; veriler eksikse yalnızca bilinen miktarlar gösterilir. Sınıra ulaşılması yeni başlangıçları duraklatır; mevcut projeler devam eder."
