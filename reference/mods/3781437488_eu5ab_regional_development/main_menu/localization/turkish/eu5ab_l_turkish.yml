 eu5ab_reset_decision: "Gelişmiş Otomatik İnşaatı Sıfırla"
 eu5ab_reset_decision_desc: "Şablonları ve ayarları korur, il atamalarını kaldırır ve inşaat kayıtlarını sıfırlar. Ardından şablonları yeniden atamanız gerekir."
 eu5ab_deep_decision: "Bu Ayın Ülke Çapındaki İnşaatını Yeniden Planla"
 eu5ab_deep_decision_desc: "Etkin şablonları kullanan sahip olunan illeri yeniden değerlendirin, bu ayın planını kaydedin ve ayın 23'ünden itibaren inşaatı başlatın."
 eu5ab_open_confirmation: "Onayı aç"
 eu5ab_reset_confirm: "Sıfırlamayı Onayla"
 eu5ab_reset_confirm_desc: "Şablonlar ve ayarlar korunur; ancak il atamaları, planlar, bekleme süreleri, raporlar, vali önerileri ile proje ve yıllık harcama kayıtları temizlenir. Harcanan altınlar iade edilmez; mevcut inşaatlar devam eder. Ardından şablonları yeniden atayın.\nÜlke değiştirdikten sonra, bu ülkenin şablonlarını ve ayarlarını geçiş öncesinde kaydedilenlerle değiştirin."
 eu5ab_deep_confirm_desc: "Etkin şablonları kullanan sahip olunan illeri yeniden kontrol edin ve bu ayın yürütülmemiş planını değiştirin. Geçerli stratejiyi, gıda güvencelerini ve inşa sırasını kullanın; son proje kalan bütçeyi aşabilir.\nBüyük ülkelerde işlem biraz zaman alabilir; planlama bitene kadar pencere kapatılamaz. Sonraki ayar değişiklikleri bu planı etkilemez. Ayın 23'ünden itibaren inşaatı başlatın; gelecek ay düzenli kontrollere geri dönün."
