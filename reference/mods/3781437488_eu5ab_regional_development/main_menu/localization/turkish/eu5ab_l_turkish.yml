 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "Genel puan [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Merkez Yakınlık İyileştirme Kazanımı [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Çevre Yakınlık İyileştirme Kazanımı [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nMerkez dahil [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] ilde Yakınlığın artması beklenmektedir.\nPuanlar il değerlerinin beklenen Yakınlık artışıyla çarpılmasıyla tahmin edilir, nihai bir Kontrol değeri değildir; mevcut Kontrol eklenmez veya çıkarılmaz ve gerçek Kontrol Azami Kontrol gibi olağan oyun mekanikleriyle gelişmeye devam eder."
 eu5ab_governor_local_candidate_2_breakdown: "Genel puan [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Merkez Yakınlık İyileştirme Kazanımı [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Çevre Yakınlık İyileştirme Kazanımı [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nMerkez dahil [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] ilde Yakınlığın artması beklenmektedir.\nPuanlar il değerlerinin beklenen Yakınlık artışıyla çarpılmasıyla tahmin edilir, nihai bir Kontrol değeri değildir; mevcut Kontrol eklenmez veya çıkarılmaz ve gerçek Kontrol Azami Kontrol gibi olağan oyun mekanikleriyle gelişmeye devam eder."
 eu5ab_governor_local_candidate_3_breakdown: "Genel puan [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Merkez Yakınlık İyileştirme Kazanımı [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Çevre Yakınlık İyileştirme Kazanımı [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nMerkez dahil [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] ilde Yakınlığın artması beklenmektedir.\nPuanlar il değerlerinin beklenen Yakınlık artışıyla çarpılmasıyla tahmin edilir, nihai bir Kontrol değeri değildir; mevcut Kontrol eklenmez veya çıkarılmaz ve gerçek Kontrol Azami Kontrol gibi olağan oyun mekanikleriyle gelişmeye devam eder."
 eu5ab_governor_naval_candidate_1_breakdown: "Genel Puan [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = İl Yakınlık İyileştirme Kazancı [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Çevre Yakınlık İyileştirme Kazancı [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nYakınlığın [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] ilde (ilin kendisi dahil) iyileşmesi beklenmektedir.\nPuanlar, il değerlerinin beklenen yakınlık artışlarıyla çarpılmasıyla tahmin edilir ve nihai kontrol değerine karşılık gelmez; mevcut kontrol puan eklemez veya düşürmez ve gerçek kontrol maksimum kontrol ve olağan oyun mekanikleri aracılığıyla gelişmeye devam edecektir."
 eu5ab_governor_naval_candidate_2_breakdown: "Genel Puan [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = İl Yakınlık İyileştirme Kazancı [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + Çevre Yakınlık İyileştirme Kazancı [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\nYakınlığın [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] ilde (ilin kendisi dahil) iyileşmesi beklenmektedir.\nPuanlar, il değerlerinin beklenen yakınlık artışlarıyla çarpılmasıyla tahmin edilir ve nihai kontrol değerine karşılık gelmez; mevcut kontrol puan eklemez veya düşürmez ve gerçek kontrol maksimum kontrol ve olağan oyun mekanikleri aracılığıyla gelişmeye devam edecektir."
 eu5ab_governor_naval_candidate_3_breakdown: "Genel Puan [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = İl Yakınlık İyileştirme Kazancı [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + Çevre Yakınlık İyileştirme Kazancı [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\nYakınlığın [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] ilde (ilin kendisi dahil) iyileşmesi beklenmektedir.\nPuanlar, il değerlerinin beklenen yakınlık artışlarıyla çarpılmasıyla tahmin edilir ve nihai kontrol değerine karşılık gelmez; mevcut kontrol puan eklemez veya düşürmez ve gerçek kontrol maksimum kontrol ve olağan oyun mekanikleri aracılığıyla gelişmeye devam edecektir."
