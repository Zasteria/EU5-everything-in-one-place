 eu5ab_cash_short_desc: "Hazinede kalması gereken asgari bakiye."
 eu5ab_cash_label: "Hazine Rezervi"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] altın"
 eu5ab_cash_help: "İnşaattan önce, bu proje ve planlanan diğer projelerin tahmini maliyetleri rezerv için yeterli altını bırakmalıdır.\n1.050 altın ve 1.000 rezerv varken, tahmini maliyeti 100 olan bir proje başlayamaz. Gerçek K.T.O maliyetleri tahminlerden farklı olabilir. Yıllık inşaat bütçesinde de bir miktar bakiye kalmalıdır."
 eu5ab_budget_section_title: "Yıllık İnşaat Bütçesi"
 eu5ab_budget_short_desc: "Sabit bir tutar veya toplam aylık gelire dayalı yıllık bir ödenek seçin."
 eu5ab_budget_mode_fixed: "Sabit Bütçe"
 eu5ab_budget_mode_income: "Gelire Bağlı"
 eu5ab_budget_multiplier_4: "×4 Temkinli"
 eu5ab_budget_multiplier_6: "×6 Önerilen"
 eu5ab_budget_multiplier_8: "×8 Etkin"
 eu5ab_budget_effective_label: "Mevcut Yıl Bütçesi"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] altın"
 eu5ab_budget_label: "Yıllık Bütçe"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] altın/yıl"
 eu5ab_budget_cash_comparison: "Yıllık inşaat bütçesi planlanan harcamayı belirler; hazine rezervi ise ne kadar altın tutulacağını belirler. Son proje kalan bütçeyi aşabilir ancak rezerv kontrolünü geçmelidir."
 eu5ab_budget_reset_note: "Yeni yılın ilk kontrolünde sıfırlanır; yalnızca inşaat başladıktan sonra fiili harcama düşülür. Bütçeyi değiştirmek kaydedilen harcamaları silmez."
 eu5ab_budget_help: "Sıradan binalar ve K.T.O genişletmeleri yıllık bir bütçeyi paylaşır: sabit bir tutar veya toplam aylık gelirin 4, 6 veya 8 katı. Yeni yılın ilk kontrolünde sıfırlanır; yıl içinde değiştirmek kaydedilmiş harcamaları korur.\nYalnızca başarıyla başlayanlar gerçek maliyetleriyle sayılır. Son proje kalan bütçeyi aşabilir; sonrasında başka proje eklenmez. Hazine rezervi gereksinimleri geçerliliğini korur."
 eu5ab_quota_section_title: "Bu Modun Eşzamanlı İnşaat Sınırı"
 eu5ab_quota_short_desc: "Bu Modun temel yuva haricinde aynı anda yürütebileceği sivil inşaat projelerinin sayısını belirler."
 eu5ab_hard_cap_label: "Ek Eşzamanlı Projeler"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] proje (toplam sınır bu değer + 1)"
 eu5ab_quota_help: "İlk projenin ötesindeki ek alanı ayarlayın: 0, eşzamanlı 1 projeye izin verir; 599 ise 600'e izin verir. Sıradan binalar ve K.T.O'lar bunu paylaşır. Yalnızca bu Modun bitmemiş projeleri sayılır; manuel inşaat, yollar ve diğer Modlar sayılmaz. Her tur yalnızca boş alanı doldurur. Alan izin verirse bir ile birkaç proje verilebilir, ardından tur bittikten sonra yeni projeler düzenlenmeden önce 3 ay beklenir."
