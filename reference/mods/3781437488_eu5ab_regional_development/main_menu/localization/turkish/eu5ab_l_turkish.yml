 eu5ab_operating_rules_title: "İnşaat Kuralları"
 eu5ab_operating_rules_short_desc: "Özel binaları, üst kaynak inşasını ve girdi kıtlıklarını ayarlayın."
 eu5ab_operating_rules_help: "Özel binalar oyunun kilit açma ve inşa gereksinimlerini karşılamalıdır.\nGirdi kıtlıkları, mevcut fabrikalar tamamen dolu olsa bile şablonun izin verdiği tedarikçilerin inşasını tetikleyebilir.\nGirdi koruması etkinken, gerekli kilit endüstriyel girdilerin arzı talebin %75'ini karşılamalıdır. Mümkün olduğunda mevcut üretim yöntemlerini kullanın, aksi takdirde kullanılabilir bir yöntemi tahmin edin. Alternatif yöntemler ayrı ayrı değerlendirilir; üretim yöntemleri otomatik olarak değiştirilmez."
 eu5ab_rgo_section_title: "K.T.O"
 eu5ab_rgo_allow: "Bu Şablonun K.T.O Genişletmesine İzin Ver"
 eu5ab_toggle_special_buildings: "Özel Binalara İzin Ver"
 eu5ab_toggle_auto_build_input_sources: "Girdi Eksikliğinde Üst Kaynak İnşa Et"
 eu5ab_toggle_pause_low_workforce: "Düşük İş Gücünde Genişlemeyi Duraklat"
 eu5ab_ranking_mode_section_title: "İnşaat Karar Stratejisi"
 eu5ab_town_rights_preference_desc: "Kent hakları ve Endüstriyi Destekle, bağımsız olarak en fazla 500'er planlama puanı ekler. Endüstri desteği yalnızca teşvik edilen alanınızdaki doğrudan eşleşen bina çıktıları için geçerlidir ve temel fiyatlardaki seçilen tarif çıktısına göre ağırlıklandırılır; tedarik zincirleri boyunca yayılmaz. Her ikisi de yerel girdi puanlarıyla birikir. Kâr modu bu puanları yalnızca ön eleme için kullanır. K.T.O genişletmesi yalnızca kent hakkı bonusunu korur. Tüm inşaat gereksinimleri geçerliliğini korur."
 eu5ab_ranking_mode_current_label: "Mevcut Mod"
 eu5ab_ranking_mode_composite_value: "#G Arz-Talep Planlaması#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Öngörülen Kâr#!"
 eu5ab_ranking_mode_common_desc: "İki strateji de yalnızca açılmış, inşa edilebilir ve önceliği 0'ın üzerinde olan binaları değerlendirir. Getiri, bütçe, rezerv, girdiler, iş gücü ve diğer güvenlik koşulları da karşılanmalıdır. Gıda acilleri ve otomatik inşaat sırası her zaman önce gelir."
 eu5ab_ranking_mode_composite_desc: "Piyasa kıtlıklarını, stratejik talebi, üretim verimliliğini, yerel hammaddeleri, fiyatları ve iş gücü riskini dengeler; eksiksiz tedarik zincirlerine ve uzun vadeli istikrara öncelik verir."
 eu5ab_ranking_mode_actual_profit_desc: "Aday projeleri şablon ve güvenlik kurallarına göre filtreler ve yel değirmeni kaynak getirileri ile ambarların koruduğu gıda değeri dahil olmak üzere beklenen aylık net faydaya göre inşaat önceliği belirler. Beklenen faydalar yakın olduğunda, şablonda yapılandırılan öncelikler ikincil referans işlevi görür."
 eu5ab_ranking_mode_actual_profit_scope_desc: "İl ve olağan inşaat türü başına yapılandırılmış 3–30 alternatifi saklayın. Gıda güvenceleri ve Otomatik İnşa Sırası önceliklidir; getiri ve inşaat gereksinimleri geçerliliğini korur. K.T.O'lar kıtlıklar, fiyatlar, istihdam ve stratejik ihtiyaçlara göre ayrı olarak değerlendirilir."
 eu5ab_ranking_mode_help: "Karar Stratejisi\nCommunity Mod Framework → Mod Ayarları → Gelişmiş Otomatik İnşa → Güvenlik ve Sıralama → İnşaat Karar Stratejisi üzerinden stratejileri değiştirin.\n• Arz ve Talep Planlaması: Piyasa arz ve talebini, eksiksiz üretim zincirlerini ve uzun vadeli ekonomik istikrarı vurgular.\n• Öngörülen Kâr: Yel Değirmeni getirileri ve ambar bozulma tasarrufları dahil beklenen aylık net faydayı kullanır; şablon öncelikleri eşitlik bozar."
 eu5ab_workforce_section_title: "İş Gücü"
 eu5ab_pause_workforce_short_desc: "İş Gücü kıtlığının inşaatı doğrudan engelleyip engellemeyeceğini denetler."
 eu5ab_job_fill_deadline_label: "İş Gücü Tahmin Ufku"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] ay"
 eu5ab_job_fill_deadline_value: "İş Gücü tahmin ufku: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] ay"
 eu5ab_job_fill_deadline_desc: "Azami iş gücü tahmin süresini ay cinsinden (0–240) belirler. Sıfır, gelecekteki toplumsal sınıf yükselmelerini hesaba katmadan yalnızca şu anda kullanılabilir işçileri sayar. «Düşük İş Gücünde Duraklat» ayarı, işçi eksikliğinin inşaata başlamayı engelleyip engellemeyeceğini belirler: açıksa yetersiz tahminî iş gücü başlangıcı engeller; kapalıysa eksiklik yalnızca inşaat önceliğini düşürür."
 eu5ab_deadline_0: "0 ay"
 eu5ab_deadline_3: "3 ay"
 eu5ab_deadline_6: "6 ay"
 eu5ab_deadline_12: "12 ay"
 eu5ab_toggle_stop_input_shortage: "Kritik Girdi Kıtlığında Genişlemeyi Durdur"
 eu5ab_prediction_status_label: "İş Gücü Tahmini"
 eu5ab_status_promotion_forecast: "#G Seçilen Süre İçin Terfi Tahmini#!"
 eu5ab_status_conservative_fallback: "#L Mevcut İş Gücüne Göre İhtiyatlı Tahmin#!"
 eu5ab_prediction_promotion_short_desc: "Mevcut boşta işçileri tahmin ufku içindeki hedef sınıfa terfi edecek uygun nüfusla birleştirir (240 aya kadar)."
 eu5ab_prediction_unavailable_short_desc: "Güvenilir bir tahmin olmadığında strictly şu anki boşta işçilere dayanır."
 eu5ab_native_input_section_title: "Yerel Girdi Tercihi"
 eu5ab_native_input_short_desc: "Aynı vilayetteki ham maddeleri kullanan binaları daha üst sıraya taşır."
 eu5ab_native_input_priority_label: "Yerel Girdi Önceliği"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Yerel girdi önceliği: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Yerel Ham Madde Tercihi\nYerel, binayı içeren vilayeti ifade eder. Sistem, binanın tarifinin gerektirdiği ham maddeleri kontrol eder ve vilayette eşleşen K.T.O.'lar mevcut olduğunda sıralama bonusu verir; tarifte daha yüksek paya sahip girdiler daha büyük bir bonus kazandırır.\n• 0 yerel ham maddeleri yok sayar, 5 varsayılan öneridir ve 10 maksimum ağırlığı verir.\n• Bu ayar yalnızca sıralama puanlarını etkiler; gerçek inşaat diğer kıtlıklara, kâra, işgücüne ve ana oyun koşullarına tabi olmaya devam eder.\n• Yalnızca eşleşen bir K.T.O.'nun mevcut olup olmadığını kontrol eder, kademesini veya çıktısını kontrol etmez.\n• Girdi kıtlığı, düşük pazar erişimi veya düşük kontrol bonusu azaltır. K.T.O.'ların kendileri bu bonusu almaz. Tahminler uygun üretim yöntemlerine dayanır; üretim yöntemleri otomatik olarak değiştirilmez."
 eu5ab_price_section_title: "Fiyat Aralığı"
 eu5ab_price_short_desc: "Üretim binalarını pazar fiyatına göre süzer ve sıralar."
 eu5ab_price_min_label: "Asgari Fiyat"
 eu5ab_price_max_label: "Yüksek Fiyat Referansı"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Fiyatlar taban fiyatı %100 olarak kullanır. Düşük fiyatlar önceliği düşürür; tüm çıktılar asgari fiyatta veya altındaysa inşaatı duraklatın. Birden fazla çıktıyı miktar ve taban fiyata göre ağırlıklandırın. Yüksek fiyat bonuslarının artışı referans değerde durur; yüksek fiyatlar inşaatı engellemez. Çıktı malı olmayan binalar muaftır. Gıda güvenceleri yapılandırıldığı gibi uygulanır."
