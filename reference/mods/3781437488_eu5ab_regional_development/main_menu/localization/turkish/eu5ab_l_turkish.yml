 eu5ab_prediction_diagnostics_title: "İş Gücü Tahmini ve İnşaat Durumu"
 eu5ab_prediction_section_body: "Yükseltmeleri, sıradan genişletmeleri, K.T.O genişletmelerini ve yeni binaları seçtiğiniz Otomatik İnşa Sırasına göre düzenleyin ve önce geçerli türdeki uygun projeleri deneyin.\nEtkinleştirilmiş gıda güvenceleri uygulandığında, ilgili gıda projeleri ilk sırayı alır ve getiri, fiyat veya diğer sınırlar yapılandırıldığı gibi esnetilir. İnşaat malzemeleri, savaş dönemi ikmalleri veya stratejik girdiler için etkinleştirilen güvenceler de getiri gereksinimlerini esnetebilir.\nBütçe, hazine rezervi ve geçerli girdi, iş gücü, bina kapasitesi ve oyun inşaat gereksinimleri geçerliliğini korur. Sıradan binalar için yalnızca kilidi açılmış en son kademe dikkate alınır; yükseltmeler yalnızca eklenen işleri sayar."
 eu5ab_diagnostics_title: "Otomatik İnşaat Durumu"
 eu5ab_diagnostics_snapshot_note: "Ayarlar anında kaydedilir. Raporlar kontroller ve başlangıçlar gerçekleştikçe güncellenir ve bittiğinde sonuçları korur."
 eu5ab_diagnostics_snapshot_help: "Rapor, denetimler ilerledikçe ve inşaatlar başladıkça güncellenir; sonuçlar sonraki tura kadar korunur. Projeler ayın 23’ünden itibaren atandığından sayılar ve harcamalar kademeli olarak değişebilir. Denetimler tamamlanana kadar bazı sonuçlar beklemede kalır."
