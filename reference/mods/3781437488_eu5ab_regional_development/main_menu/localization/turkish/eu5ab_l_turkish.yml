 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Tüm şablonların paylaştığı bütçeyi, inşaat koşullarını, karar stratejisini ve performansı ayarlayın. Her şablon etkinliğini, kapsamını ve önceliklerini ayrı saklar."
 eu5ab_regional_development__general_name: "Genel Denetimler ve Sınırlar"
 eu5ab_regional_development__finance_name: "Maliye ve Pazar"
 eu5ab_regional_development__automation_name: "Güvenlik ve Sıralama"
 eu5ab_regional_development__performance_name: "Performans İyileştirmesi"
 eu5ab_regional_development__performance__preset_name: "Performans Ön Ayarı"
 eu5ab_regional_development__performance__preset_desc: "Ön ayarlar aşağıdaki seçenekleri düzenler. Gelişmiş bir ayarı değiştirmek Özel seçeneğine geçirir; yeni değerler sonraki aylık denetimde uygulanır."
 eu5ab_regional_development__performance__advanced_name: "Gelişmiş Ayarlar"
 eu5ab_regional_development__performance__advanced_desc: "Günlük il kontrollerini, tur başına yeni projeleri ve alternatiflerin sayısını ayarlayın. Daha fazla projeyi kontrol etmek daha uzun sürebilir."
 eu5ab_regional_development__general__limits_name: "Genel Denetimler ve Eşzamanlı Sınır"
 eu5ab_regional_development__general__limits_desc: "Modun çalışıp çalışmayacağını ve aynı anda yönetebileceği sivil inşaat projelerinin toplam sınırını denetler."
 eu5ab_regional_development__general__returns_name: "Getiri Kuralları ve Acil Durum İstisnaları"
 eu5ab_regional_development__general__returns_desc: "Normal binaların asgari getirisini ve gıda, malzeme, askerî mal veya stratejik girdi kıtlığında gevşetilip gevşetilmeyeceğini belirleyin."
 eu5ab_regional_development__finance__budget_name: "Paylaşılan Yıllık Bütçe"
 eu5ab_regional_development__finance__budget_desc: "Tüm şablonlar, binalar ve K.T.O'lar tek bir ulusal yıllık bütçeyi paylaşır."
 eu5ab_regional_development__finance__market_name: "Pazar Fiyat Aralığı"
 eu5ab_regional_development__finance__market_desc: "Temel fiyata göre paylaşılan asgari ve yüksek fiyat yüzdelerini ayarlayın."
 eu5ab_regional_development__automation__safety_name: "İnşaat Güvenlik Kuralları"
 eu5ab_regional_development__automation__safety_desc: "Özel binalar, üst kaynaklar, iş gücü ve girdi kıtlığı için paylaşılan kurallar."
 eu5ab_regional_development__automation__rgo_name: "K.T.O Genişletmesi"
 eu5ab_regional_development__automation__workforce_name: "İş Gücü Tahmini"
 eu5ab_regional_development__automation__workforce_desc: "Gelecekteki iş gücü arzını öngörürken azami tahmin ufkunu yapılandırır."
 eu5ab_regional_development__automation__ranking_name: "İnşaat Karar Stratejisi"
 eu5ab_regional_development__automation__ranking_desc: "Normal bina stratejisini, yükseltme, genişletme, K.T.O ve yeni bina sırasını ve yerel girdi etkisini ayarlayın."
 eu5ab_regional_development__candidate_ranking_mode_name: "Normal Bina Stratejisi"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Diğer Projeleri Dene"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Geçerli türdeki önde gelen projeler başlayamazsa, daha alt sıradaki alternatifleri deneyin. Her il, sıradan türler arasında paylaşılan, Arz ve Talep Planlaması için tur başına en fazla 2 veya Öngörülen Kâr için 5 ek deneme hakkı alır. Orada sıradan bir bina başladığında durur. Bir kaydı yüklemek denemeleri geri yüklemez. Tüm gereksinimler hala geçerlidir. Varsayılan olarak kapalıdır; bir sonraki turda yürürlüğe girer ve kontrol süresini artırabilir."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Uygun sıradan binaların nasıl önceliklendirileceğini seçin. Gıda güvenceleri ve Otomatik İnşa Sırası önceliklidir. K.T.O'lar kıtlıklar, fiyatlar, istihdam ve stratejik ihtiyaçlara göre ayrı olarak değerlendirilir."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Arz ve Talep"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Projeleri pazar kıtlığı, stratejik ihtiyaç, tarif verimi, yerel girdiler, fiyatlar ve iş gücü riskine göre sıralar; tam üretim zincirlerini ve uzun vadeli istikrarı öne çıkarır."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Öngörülen Kâr"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Adayları şablon ve güvenlik kurallarına göre filtreler ve yel değirmeni getirileri ile ambarların koruduğu gıda dahil olmak üzere beklenen aylık net faydaya göre inşaata öncelik verir. Faydalar yakın olduğunda şablon öncelikleri ikincil referans işlevi görür."
 eu5ab_regional_development__automation__candidate_priority_name: "Otomatik İnşaat Sırası"
 eu5ab_regional_development__automation__candidate_priority_desc: "Dört türü istediğiniz sıraya sürükleyin. Mod bir sonrakine geçmeden önce mevcut türde başlayabileceği her projeyi dener; bir proje başlayamazsa aynı türden bir başkasını arar. Gıda aciliyeti durumunda gıda projeleri önce işlenir ancak yine bu sırayı takip eder."
 eu5ab_regional_development__candidate_priority_name: "Otomatik İnşaat Sırası"
 eu5ab_regional_development__candidate_priority_desc: "Yükseltmeleri, normal genişletmeleri, K.T.O genişletmelerini ve yeni binaları sıralamak için sürükleyin."
 eu5ab_regional_development__candidate_priority_item_column_name: "İnşaat Türü"
 eu5ab_regional_development__candidate_priority_i1_name: "Binaları Yükselt"
 eu5ab_regional_development__candidate_priority_i1_desc: "Eski bir binayı yükseltme zincirindeki açılmış en yeni kademeyle değiştirir."
 eu5ab_regional_development__candidate_priority_i2_name: "Mevcut Binaları Genişlet"
 eu5ab_regional_development__candidate_priority_i2_desc: "Mevcut normal binaya bir seviye ekler; değiştirme ve K.T.O hariçtir."
 eu5ab_regional_development__candidate_priority_i3_name: "K.T.O Genişlet"
 eu5ab_regional_development__candidate_priority_i3_desc: "Yerel K.T.O'ları genişletir; mevcut tam istihdamı ve fiyat, yıllık inşaat bütçesi, hazine rezervi ve diğer kurallara uyumu gerektirir."
 eu5ab_regional_development__candidate_priority_i4_name: "Yeni Binalar İnşa Et"
 eu5ab_regional_development__candidate_priority_i4_desc: "İlde henüz bulunmayan normal bir binayı sıfırdan kurar."
 eu5ab_regional_development__enabled_name: "Otomatik İnşaatı Etkinleştir"
 eu5ab_regional_development__enabled_desc: "Ana açma/kapatma düğmesi. Devre dışı bırakmak şablon ayarlarını ve il atamalarını korur; ancak aylık otomatik inşaat kontrollerini durdurur."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Ek Eşzamanlı Projeler"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Bu Modun temel yuva haricinde aynı anda yürütebileceği sivil proje sayısı. 0 toplam 1 proje, 599 ise 600 proje demektir; manuel inşaat, yollar ve diğer Modlar bu sınırı kullanmaz."
 eu5ab_regional_development__budget_mode_name: "Yıllık Bütçe Modu"
 eu5ab_regional_development__budget_mode_desc: "Sabit bir tutar veya toplam aylık gelirin 4, 6 veya 8 katını seçin. Yeni yılın ilk kontrolünde yeniden hesaplanır; ayarları değiştirmek kaydedilmiş harcamaları korur."
 eu5ab_regional_development__budget_mode_option_1_name: "Sabit Yıllık Bütçe"
 eu5ab_regional_development__budget_mode_option_2_name: "Aylık Gelir ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Aylık Gelir ×6 (Önerilen)"
 eu5ab_regional_development__budget_mode_option_4_name: "Aylık Gelir ×8"
 eu5ab_regional_development__economic_metric_name: "Sıradan Bina Ekonomik Eşiği"
 eu5ab_regional_development__economic_metric_desc: "Olağan üretim binaları seçilen koşulu karşılamalıdır: pozitif öngörülen aylık gelir veya kâr ya da yıllıklandırılmış %5 getiri. Gerçek getiri değişebilir. Olağan kamu altyapısı muaftır. Yel değirmenleri ek çıktıdan pozitif net kazanç sağlamalı, getiri oranı modlarında ayrıca yıllık %5 getiri sunmalıdır. Bozulma kayıplarını azaltmak için yapılan ambarlar her zaman %5 getiri gerektirir. K.T.O için ayrı kurallar geçerlidir."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Aylık Gelir > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Yalnızca oyun pozitif aylık gelir öngörürse başlatın."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Aylık Kâr > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Yalnızca oyun pozitif toplam aylık kâr öngörürse başlatın."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Yıllıklandırılmış Gelir Getirisi ≥ %5"
 eu5ab_regional_development__economic_metric_option_3_desc: "Tahmini aylık gelir, inşaat maliyetinin 12'ye bölünmüş %5'i kadar olmalıdır. Bu, işletme maliyetlerini düşmeden yalnızca geliri karşılaştırır."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Yıllıklandırılmış Kâr Getirisi ≥ %5"
 eu5ab_regional_development__economic_metric_option_4_desc: "Tahmini aylık kâr, inşaat maliyetinin 12'ye bölünmüş %5'i kadar olmalıdır. Gerçek kâr işletme koşullarına göre değişebilir."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Yiyecek Tükenecek: Önce İnşa Et, Getiriyi Yok Say"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Yiyecek tükenecekse gıda projelerini önce ele alın ve normal gıda binalarının getiri şartını kaldırın. Sıra ve diğer tüm kurallar geçerlidir."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Yiyecek %25 veya Altında: Önce İnşa Et, Getiriyi Yok Say"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Piyasadaki gıda stoku %25 veya altına düştüğünde gıda projelerine öncelik verilir ve sıradan gıda binaları getiri eşiğinden muaf tutulur. Otomatik İnşa Sırası ve diğer güvenlik kuralları devrededir."
 eu5ab_regional_development__emergency_construction_goods_override_name: "İnşaat Arzı %65 Altında: Getiriyi Yok Say"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Temel bir inşaat malzemesinin arzı %65'in altına düştüğünde, onu üreten binalar getiri eşiği denetiminden muaf tutulur. Diğer tüm inşaat kuralları geçerliliğini korur."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Savaşta Askerî Arz %65 Altında: Getiriyi Yok Say"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Savaş halindeyken bir askeri malın arzı %65'in altındaysa, onu üreten binalar getiri eşiği denetiminden muaf tutulur. Diğer tüm inşaat kuralları geçerlidir."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Stratejik Üretimde Girdi Yok: Üst Getiriyi Yok Say"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Bir hammaddenin piyasa arzı talebin %65'inin altındaysa ve aynı piyasada bu hammaddeyi tüketen, açık durumda olan ve girdi eksikliği yaşayan yerli bir gıda, temel inşaat malzemesi veya askerî mal üretim binası varsa, bu hammaddenin üreticileri seçilen getiri eşiğinden muaf tutulur. Tüketici binanın üretimi durdurmuş olması gerekmez; eksik girdinin tam olarak bu hammadde olması da gerekmez. Diğer tüm inşaat kuralları geçerliliğini korur."
 eu5ab_regional_development__fixed_annual_budget_name: "Sabit Yıllık Bütçe"
 eu5ab_regional_development__fixed_annual_budget_desc: "Yalnızca sabit modda kullanılır; tüm şablonlar bu tutarı paylaşır."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Asgari Hazine Rezervi"
 eu5ab_regional_development__min_cash_reserve_desc: "Planlanan tüm projelerin tahmini maliyetlerinden sonra bu hazine rezervini koruyun. Gerçek K.T.O maliyetleri farklı olabilir."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Asgari Fiyat Yüzdesi"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Yüksek Fiyat Referans Yüzdesi"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Özel Binalara İzin Ver"
 eu5ab_regional_development__allow_special_buildings_desc: "Özel binaların değerlendirilmesine izin verir; oyunun inşaat koşulları geçerlidir."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Boş İnşaat Yuvalarıyla Pazar Açıklarını Doldur"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "Olağan projelerden sonra boş inşaat yuvalarını, aynı pazarda bu tur denetlenen sahip olduğunuz illerdeki kıtlıkları gidermek için kullanır. Planlanan projelerin girdi ihtiyaçları ve henüz gerçekleşmemiş çıktı artışları hesaba katılır. Yerleşik ön ayarlar planlanmamış endüstriler ekleyebilir; yasaklar, özel öncelik 0 ve diğer inşaat gereksinimleri geçerliliğini korur."
 eu5ab_regional_development__auto_build_input_sources_name: "Kıtlıkta Üst Kaynakları İnşa Et"
 eu5ab_regional_development__auto_build_input_sources_desc: "Girdi pazarı açıklarını bağımsız olarak kontrol edin ve mevcut alt binalar tamamen dolu olsa bile girdileri eksik olduğunda şablonun izin verdiği üst tedarikçileri inşa edin. Bina kilitleri ve tüm inşaat koşulları geçerliliğini korur."
 eu5ab_regional_development__pause_low_workforce_name: "Düşük İş Gücünde Duraklat"
 eu5ab_regional_development__stop_input_shortage_name: "Kritik Girdi Kıtlığında Dur"
 eu5ab_regional_development__stop_input_shortage_desc: "İnşaatın devam edebilmesi için gerekli kilit endüstriyel girdilerin pazar arzı, talebin en az %75'ini karşılamalıdır."
 eu5ab_regional_development__allow_rgo_name: "K.T.O Genişletmesine İzin Ver"
 eu5ab_regional_development__allow_rgo_desc: "Tüm şablonların K.T.O genişletmesini değerlendirmesine izin verir."
 eu5ab_regional_development__native_input_priority_name: "Yerel Girdi Önceliği"
 eu5ab_regional_development__native_input_priority_desc: "0–10; yüksek değerler aynı vilayette üretilen hammaddeleri doğrudan kullanan binalara öncelik verir."
 eu5ab_regional_development__performance_preset_name: "Performans Ön Ayarı"
 eu5ab_regional_development__performance_preset_desc: "Ön ayar aşağıdaki gelişmiş seçenekleri eşler. Özel, geçerli değerleri korur."
 eu5ab_regional_development__performance_preset_option_1_name: "Temkinli"
 eu5ab_regional_development__performance_preset_option_1_desc: "Günde en fazla 10 ili denetler, çalışma başına en çok 30 proje başlatır. Planlama Adayı: 5; Kâr Adayı: 15. Yeterli aday bulununca durur."
 eu5ab_regional_development__performance_preset_option_2_name: "Dengeli"
 eu5ab_regional_development__performance_preset_option_2_desc: "Günde en fazla 20 ili denetler, çalışma başına en çok 50 proje başlatır. Planlama Adayı: 4; Kâr Adayı: 12. Yeterli aday bulununca durur."
 eu5ab_regional_development__performance_preset_option_3_name: "Azami Verim"
 eu5ab_regional_development__performance_preset_option_3_desc: "Çok konumlu ülkeler içindir. Günde en fazla 30 ili denetler, çalışma başına sınır yoktur. Planlama Adayı: 3; Kâr Adayı: 10. Yeterli aday bulununca durur."
 eu5ab_regional_development__performance_preset_option_4_name: "Özel"
 eu5ab_regional_development__performance_preset_option_4_desc: "Geçerli gelişmiş ayarları kullanın."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Çok sayıda şablonlu il oyun performansını düşürebilir."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Azami İşlem Hacmi modunda günde en fazla 30 il denetlenir ve kontrol başına sınır yoktur. Çok büyük ülkelerde ay sonu geçiş süresi uzayabilir."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Arz-Talep\" çok uzun sürüyor: \"Planlama Adaylarını\" düşürün."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Yalnızca Arz ve Talepte gösterilir. Planlama Adaylarını azaltmak, il ve tür başına sonraki denetimlere giden proje sayısını düşürür."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Sonuç: Daha az alternatif aday, sonraki uygun projelerin atlanmasına yol açabilir."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Projeler planlama puanı sırasına göre kontrol edilir. Aday sınırını düşürmek ilk projeler başarısız olduğunda daha az alternatif bırakır ve sonraki uygun projelerin kaçırılmasına neden olabilir."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "“Öngörülen Kâr” yavaşsa “İl Başına Kâr Adayı” değerini azaltın."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Yalnızca “Öngörülen Kâr” modunda gösterilir. Sonraki denetimlerde değerlendirilen alternatifleri azaltmak için “İl Başına Kâr Adayı” değerini düşürün."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Daha az alternatif, önde gelen projeler başlayamadığında başka seçenek bırakmayabilir."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Alternatifler tahmini kâr ve inşa tercihlerine göre sıralandıktan sonra saklanır. Bu sayıyı azaltmak, en iyi projeler engellendiğinde daha az yedek seçenek bırakır."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Günlük İlleri veya Çalışma Başına Eklemeleri de Azaltın."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Daha az günlük il, kontrolleri daha fazla güne yayar. Yeni projelerdeki daha düşük bir sınır, çalıştırma başına işi azaltır. Sıfır, yeni projeleri sınırsız bırakır."
 eu5ab_regional_development__parallel_location_scan_name: "İlleri Ayrı İşle"
 eu5ab_regional_development__parallel_location_scan_desc: "Duraklamaları azaltmak için illeri ayrı ayrı veya her gün tek bir adımda birlikte kontrol edin. Öncelik, bütçe ve inşa sırası aynı kalır."
 eu5ab_regional_development__daily_location_task_limit_name: "Günlük Denetlenen İl"
 eu5ab_regional_development__daily_location_task_limit_desc: "Her gün ayrıntılı olarak kontrol edilen azami il sayısı. Daha düşük sayılar günde daha az iş yapar ancak tüm ülkeyi taramak daha fazla gün sürer."
 eu5ab_regional_development__max_additions_per_run_name: "Çalışma Başına Azami Ekleme"
 eu5ab_regional_development__max_additions_per_run_desc: "Tek bir kontrolde başlatılan azami proje sayısını sınırlar (0 ila 600). Sıfır sınırsız anlamına gelir."
 eu5ab_regional_development__candidates_per_location_name: "İl Başına Planlama Adayı"
 eu5ab_regional_development__candidates_per_location_desc: "Yalnızca 'Arz-Talep Planlaması' altında etkindir. Her il ve sıradan inşaat kategorisi için, sonraki koşul denetimlerine planlama puanıyla tutulacak aday sayısını belirler (3–30). Daha fazla aday tutmak alternatifleri kaçırma riskini azaltır ancak işlem yükünü artırır."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "İl Başına Kâr Adayı"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Yalnızca Öngörülen Kâr modu için geçerlidir. İl ve olağan inşaat türü başına, öngörülen kâr ve bina tercihlerine göre sıralanan 3–30 alternatif tutar. Daha fazla alternatif, öndeki projeler başlayamadığında daha çok seçenek sunar ancak sonraki denetimleri yavaşlatabilir."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Yeterli Aday Bulununca Denetimi Durdur"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Alternatif sayısı bu tur eklenebilecek proje sayısının iki katına ulaştığında diğer illerin ayrıntılı denetimini durdurur. Bu sayıyı boş yuvalar ve Çalışma Başına Azami Ekleme belirler; 0 yalnızca tur başına sınırı kaldırır. İnşaat gereksinimleri geçerliliğini korur."
 eu5ab_diagnostics_cmm_hint: "Paylaşılan kuralları Community Mod Framework Mod Ayarları'nda değiştirin. İnşaat Raporu son otomatik sonucu gösterir."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "10 Artır"
 eu5ab_cmm_shift_decrease_10: "10 Azalt"
 eu5ab_cmm_shift_increase_1000: "1000 Artır"
 eu5ab_cmm_shift_decrease_1000: "1000 Azalt"
 eu5ab_cmm_shift_increase_max: "Azamiye Ayarla"
 eu5ab_cmm_shift_decrease_min: "Asgariye Ayarla"
 eu5ab_regional_development__automation__rgo_desc: "Mevcut işler dolduktan sonra K.T.O genişletmesini değerlendirin. Yeni işler için işçilerin tahmin edilip edilmeyeceğini seçin."
 eu5ab_regional_development__rgo_workforce_mode_name: "K.T.O İş Gücü Modu"
 eu5ab_regional_development__rgo_forced_relaxed_name: "K.T.O Modu: Rahat (İş Gücü Duraklatma Kapalı)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "İş gücü tahmini yapılmaz. Mevcut işler dolu olmalıdır; yeni işler için eksiklikler yalnızca inşaat önceliğini düşürür."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Varsayılan olarak Rahat modudur. İş gücü korumasını kapatmak geçici olarak Rahat modunu kullanır ve mevcut işçi eksikliklerinde önceliği düşürür. Yeniden etkinleştirmek seçilen modu geri yükler. Mevcut işler her zaman dolu olmalıdır."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Rahat"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Oyunun genel genişleme kurallarını izler: mevcut işler dolduktan sonra, yeni işçileri tahmin etmeden fiyatları, pazar ihtiyaçlarını ve beklenen çıktıyı değerlendirir. İş gücü koruması etkinken, yeni işler için yaşanan eksiklikler önceliği düşürmez."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Nüfusu Dikkate Al"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "Mevcut tam istihdamı kontrol ettikten sonra, tahmin ufku boyunca uygun terfileri tahmin edin. İşçiler bir sonraki seviyeyi dolduramıyorsa duraklatın."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "K.T.O Nüfus Tahmin Ufku (Ay)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "Nüfusu Dikkate Al modunda genişletme, yeni işleri doldurmak için bu süre içinde yeterli işçinin beklenmesini gerektirir. Varsayılan: 180 ay. Aralık: 0-1200; sıfır yalnızca şu anda mevcut olan işçileri sayar. Tahmin Fırsat Bolluğunu, okuryazarlığı ve iş değiştirmeye uygun nüfusu hesaba katar. Daha uzun tahminler gerçek sonuçlardan daha fazla sapabilir. 1 ay ayarlamak için tıklayın, 12 ay için Ctrl veya 120 ay için Shift tuşunu basılı tutun."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "Etkinleştirildiğinde sıradan binalar yeterli tahmin edilen işçiye ihtiyaç duyar; K.T.O'lar seçtikleri modu kullanır. Bunu kapatmak tahminleri durdurur ve K.T.O'lar için geçici olarak Rahat modunu kullanır. Mevcut eksiklikler tek başlarına yeni projeleri engellemeden önceliği düşürür. Mevcut K.T.O işleri yine de dolu olmalıdır. Yeniden etkinleştirmek önceki K.T.O modunu geri yükler."
 eu5ab_regional_development__job_fill_deadline_months_name: "Sıradan Bina İş Gücü Ufku (Ay)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Sıradan binalar için bağımsız ufuk: varsayılan 12 ay, aralık 0-240. Sıfır yalnızca şu anda nitelikli boşta olan işçileri sayar. Nüfusa duyarlı K.T.O'lar ayrı ufuklarını kullanır. Mevcut terfi oranları bir tahmindir, garanti değildir."
 eu5ab_regional_development__price_min_desc: "Varsayılan: taban fiyatın %80'i. Daha düşük fiyatlar önceliği düşürür. Tüm çıktılar eşiğin altında veya eşikte olduğunda inşaatı duraklatın; birden fazla çıktıyı miktar ve taban fiyata göre ağırlıklandırın. %100 veya üzerinde yalnızca eşik geçerlidir. Etkinleştirilmiş gıda güvenceleri fiyat sınırlarından muaf tutabilir."
 eu5ab_regional_development__price_max_desc: "Varsayılan: %125. Taban fiyatın üzerindeki fiyatlar, referansa kadar kademeli olarak öncelik ekler. %125 referansında %112,5'lik bir fiyat 70 puan ekler; %125 veya fazlası 140 ekler. Referans %100 veya daha düşükse, taban fiyatın üzerindeki herhangi bir fiyat 140 ekler."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
