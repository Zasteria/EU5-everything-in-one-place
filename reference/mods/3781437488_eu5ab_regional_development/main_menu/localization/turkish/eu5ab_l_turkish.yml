 eu5ab_template_editor_desc: "Bu şablonun bina önceliklerini ve kapsamını ayarlayın. Ülke genelinde paylaşılan bütçe, pazar, iş gücü ve inşaat güvenliği kuralları Community Mod Framework Mod Ayarları'nda yapılandırılır."
