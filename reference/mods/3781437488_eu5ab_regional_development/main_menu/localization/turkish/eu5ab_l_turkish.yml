 eu5ab_rgo_short_desc: "Mevcut işler dolu olmalıdır. Rahat varsayılandır; yeni işler için işçileri tahmin etmek üzere Nüfusu Dikkate Al seçeneğini belirleyin."
 eu5ab_rgo_help: "Mevcut K.T.O işleri dolu olmalıdır. Varsayılan olan Rahat modu yeni işçileri tahmin etmez; Nüfusu Dikkate Al modu seçilen süre içinde yeterli işçinin beklenmesini gerektirir.\nAsgari fiyat veya altındaki fiyatlar genişletmeyi duraklatır. Düşük fiyatlar önceliği düşürür, yüksek fiyatlar artırır. Puanı 0'ın altında olan projeler başlamaz.\nAynı pazarda aynı malı üreten sahip olunan sıradan binalar ve K.T.O'lar bir genişletme sınırını paylaşır. Devam eden veya tamamlanan projelerden henüz gerçekleşmemiş çıktı artışlarını içerir ve planlanan projelerin yeni girdi talebini hesaba katar. Beklenen kazanımlar talep açığı artı talebin %10'una yaklaştıkça ilave inşaat daha az tercih edilir hale gelir. Yeni başlangıçlar bu miktarda duraklatılır. Son kademe bunu aşabilir; mevcut projeler devam eder.\nİş gücü korumasını kapatmak tahminleri durdurur ancak mevcut eksiklikler önceliği düşürmeye devam eder. Etkinleştirilmiş gıda güvenceleri ilgili K.T.O'lara öncelik verebilir, fiyat ve genişletme sınırlarından muaf tutabilir. Mevcut tam istihdam ile geçerli iş gücü, bütçe ve oyun inşaat gereksinimleri geçerliliğini korur."
 eu5ab_workforce_help: "Sıradan binalar varsayılan olarak 12 aylık bir tahmin kullanır; Nüfusu Dikkate Al modundaki K.T.O'lar 180 ay kullanır. Tahminler mevcut terfi oranlarını, yerel ve ulusal değiştiricileri, Fırsat Bolluğunu, okuryazarlığı ve uygun nüfusu kullanır. Göç, değişen oranlar ve rekabet eden işler sonuçları etkileyebilir.\nİş gücü korumasını kapatmak tahminleri durdurur. Mevcut eksiklikler tahmini kârı değiştirmeden önceliği düşürür; gıda güvenceleri yapılandırıldığı gibi geçerliliğini korur."
