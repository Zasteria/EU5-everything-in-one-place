 eu5ab_regional_development__governors_name: "Vali Tavsiyeleri"
 eu5ab_regional_development__governors__recommendations_name: "Tavsiyeler ve Yenileme"
 eu5ab_regional_development__governors__recommendations_desc: "Binaları inşa etmeden, yıkmadan veya taşımadan Yerel Vali ve Donanma Valisi adaylarını analiz eder."
 eu5ab_regional_development__governors__scoring_name: "Puanlama Tercihleri"
 eu5ab_regional_development__governors__scoring_desc: "İl değerinin nasıl ağırlıklandırılacağını ve sınırlı stratejik değerin dahil edilip edilmeyeceğini seçin."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Vali Tavsiyelerini Etkinleştir"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Yerel ve Donanma Valisi merkezleri için periyodik olarak iller önerin. Devre dışı bırakmak son sonuçları korur ancak öneri uyarılarını kaldırır."
 eu5ab_regional_development__governor_refresh_interval_name: "Yenileme Aralığı"
 eu5ab_regional_development__governor_refresh_interval_desc: "Güncelleme aralığını ayarlayın. Bazı toprak, başkent, il kademesi ve yönetim değişiklikleri daha erken güncellemeleri tetikler. Yollar ve diğer Yakınlık değişiklikleri planlı kontrollere dahil edilir."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "Her Ay"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "Değişiklikleri en hızlı şekilde günceller ve daha küçük ülkelere uygundur. Sık kontroller büyük ülkelerde daha uzun duraklamalara neden olabilir."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "3 Ayda Bir"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Yol değişimi tepkisi ile büyük ülke performansı arasında dengeli."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "6 Ayda Bir"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Büyük ülkeler için daha düşük yeniden hesaplama sıklığı."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "12 Ayda Bir"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "En düşük maliyet, ancak yol ve yakınlık değişikliklerinin yansıması bir yıla kadar sürebilir."
 eu5ab_regional_development__governor_refresh_now_name: "Şimdi Yeniden Hesapla"
 eu5ab_regional_development__governor_refresh_now_text: "Şimdi Yeniden Hesapla"
 eu5ab_regional_development__governor_refresh_now_desc: "Yerel ve donanma merkezi önerilerini şimdi (duraklatma sırasında dahi) yeniden hesaplar. Büyük ülkelerde kısa bir gecikme yaşanabilir."
 eu5ab_regional_development__governor_scoring_profile_name: "İl Değeri Profili"
 eu5ab_regional_development__governor_scoring_profile_desc: "Potansiyel vergi matrahı, nüfus ve gelişmişliğin göreli ağırlığını belirler. Puanlar nihai bir Kontrol değeri yerine il değerlerinin beklenen Yakınlık iyileştirmesiyle çarpılmasıyla tahmin edilir; mevcut Kontrol eklenmez veya çıkarılmaz."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Karma"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Ekonomik değer ile idari-nüfus değerini dengeler."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Ekonomik"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Potansiyel vergi tabanını ve oturmuş ekonomik ölçeği öne çıkarır."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "İdari Nüfus"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Nüfusu ve gelişimi öne çıkarır."
 eu5ab_regional_development__governor_strategic_value_name: "Stratejik Değeri Dahil Et"
 eu5ab_regional_development__governor_strategic_value_desc: "Limanlara, sınır illerine ve tahkimatlı illere sınırlı ağırlık uygular. Bu yalnızca il değerini değiştirir ve ayrı bir puan bileşeni değildir."
 eu5ab_governor_window_title: "Vali Tavsiyesi Ayrıntıları"
 eu5ab_governor_window_intro: "Yeni il ve taşıma önerilerini görüntüleyin. Bina değişiklikleri size aittir."
 eu5ab_governor_road_tier_help: "Tahminler açılmış en yüksek yol kademesini kullanır; gerçek kazançlar farklılık gösterebilir.\nHer plan diğer merkez türünü sabit tutar. Değişikliklerden sonra yeniden hesaplayın; kazançlar toplanamaz."
 eu5ab_governor_refresh_button: "Yeniden Hesapla"
 eu5ab_governor_refresh_button_tt: "Yerel ve Donanma Valisi merkezleri için yeni illeri, taşınmaları ve düzenlemeleri yeniden değerlendirin. Büyük ülkelerde kısa bir gecikme yaşanabilir; tamamlanmamış kontroller bir bildirim gösterir."
 eu5ab_governor_local_section: "Yerel Vali"
