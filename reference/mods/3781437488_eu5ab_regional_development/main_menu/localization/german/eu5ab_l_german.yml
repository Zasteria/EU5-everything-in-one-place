 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Lege Budget, Baubedingungen, Entscheidungsstrategie und Leistung für alle Vorlagen fest. Jede Vorlage speichert Aktivierung, Abdeckung und Prioritäten getrennt."
 eu5ab_regional_development__general_name: "Steuerung und Limits"
 eu5ab_regional_development__finance_name: "Finanzen und Markt"
 eu5ab_regional_development__automation_name: "Sicherheit und Rangfolge"
 eu5ab_regional_development__performance_name: "Leistungsoptimierung"
 eu5ab_regional_development__performance__preset_name: "Leistungsvoreinstellung"
 eu5ab_regional_development__performance__preset_desc: "Voreinstellungen passen die folgenden Optionen an. Eine manuelle Änderung wechselt zu Benutzerdefiniert; neue Werte gelten ab der nächsten Monatsprüfung."
 eu5ab_regional_development__performance__advanced_name: "Erweiterte Einstellungen"
 eu5ab_regional_development__performance__advanced_desc: "Passe die täglichen Ortsprüfungen, neue Projekte pro Runde und die Anzahl der Alternativen an. Das Prüfen von mehr Projekten kann länger dauern."
 eu5ab_regional_development__general__limits_name: "Steuerung und gleichzeitiges Limit"
 eu5ab_regional_development__general__limits_desc: "Steuert, ob die Mod aktiv ist und wie viele zivile Bauprojekte sie gleichzeitig verwalten darf."
 eu5ab_regional_development__general__returns_name: "Renditeregeln und Notfallausnahmen"
 eu5ab_regional_development__general__returns_desc: "Legt die Mindestrendite normaler Gebäude fest und ob Mangel an Nahrung, Baumaterial, Militärgütern oder strategischen Inputs sie aussetzen darf."
 eu5ab_regional_development__finance__budget_name: "Gemeinsames Jahresbudget"
 eu5ab_regional_development__finance__budget_desc: "Alle Vorlagen, Gebäude und RG teilen ein nationales Jahresbudget."
 eu5ab_regional_development__finance__market_name: "Marktpreisspanne"
 eu5ab_regional_development__finance__market_desc: "Legt gemeinsame Mindest- und Hochpreis-Prozentsätze relativ zum Grundpreis fest."
 eu5ab_regional_development__automation__safety_name: "Bausicherheitsregeln"
 eu5ab_regional_development__automation__safety_desc: "Gemeinsame Regeln für Spezialgebäude, vorgelagerte Quellen, Arbeitskräfte und Inputmangel."
 eu5ab_regional_development__automation__rgo_name: "RG-Erweiterung"
 eu5ab_regional_development__automation__workforce_name: "Arbeitskräfteprognose"
 eu5ab_regional_development__automation__workforce_desc: "Konfiguriert den maximalen Prognosezeitraum für künftige Arbeitskräfteverfügbarkeit."
 eu5ab_regional_development__automation__ranking_name: "Bauentscheidungsstrategie"
 eu5ab_regional_development__automation__ranking_desc: "Wähle die Strategie für normale Gebäude, ordne Verbesserungen, Erweiterungen, RG und Neubauten und bestimme den Einfluss lokaler Rohstoffe."
 eu5ab_regional_development__candidate_ranking_mode_name: "Strategie für normale Gebäude"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Andere Projekte versuchen"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Wenn führende Projekte des aktuellen Typs nicht beginnen können, prüfe niedriger eingestufte Alternativen. Jeder Ort erhält bis zu 2 zusätzliche Versuche pro Runde bei der Angebots- und Bedarfsplanung oder 5 bei der Auswahl nach prognostiziertem Gewinn, geteilt über gewöhnliche Typen. Stoppt, sobald dort ein gewöhnliches Gebäude beginnt. Das Laden eines Spielstands stellt Versuche nicht wieder her. Alle Anforderungen gelten weiterhin. Standardmäßig deaktiviert; wird in der nächsten Runde wirksam und kann die Prüfdauer verlängern."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Wähle, wie geeignete gewöhnliche Gebäude priorisiert werden. Nahrungssicherung und die Automatische Baureihenfolge haben Vorrang. RG werden separat nach Engpässen, Preisen, Beschäftigung und strategischem Bedarf bewertet."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Angebot und Nachfrage"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Ordnet Projekte nach Marktengpässen, strategischem Bedarf, Rezepteffizienz, lokalen Inputs, Preisen und Arbeitskräfterisiko und bevorzugt vollständige Ketten sowie langfristige Stabilität."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Prognostizierter Gewinn"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtert Kandidaten nach Vorlagen- und Sicherheitsregeln und priorisiert den Bau nach dem geschätzten monatlichen Nettonutzen, einschließlich Windmühlenerträgen und Getreidespeichereinsparungen. Bei ähnlichem Nutzen dienen Vorlagenprioritäten als sekundäre Entscheidungshilfe."
 eu5ab_regional_development__automation__candidate_priority_name: "Automatische Baureihenfolge"
 eu5ab_regional_development__automation__candidate_priority_desc: "Ziehen Sie die vier Typen in die gewünschte Reihenfolge. Die Mod prüft alle baubaren Projekte des aktuellen Typs, bevor sie zum nächsten übergeht; scheitert ein Projekt, sucht sie nach Alternativen desselben Typs. Bei Nahrungskrisen werden Nahrungsprojekte vorgezogen, folgen aber dennoch dieser Reihenfolge."
 eu5ab_regional_development__candidate_priority_name: "Automatische Baureihenfolge"
 eu5ab_regional_development__candidate_priority_desc: "Ziehe, um Verbesserungen, normale Erweiterungen, RG-Erweiterungen und Neubauten zu ordnen."
 eu5ab_regional_development__candidate_priority_item_column_name: "Bautyp"
 eu5ab_regional_development__candidate_priority_i1_name: "Gebäude verbessern"
 eu5ab_regional_development__candidate_priority_i1_desc: "Ersetzt ein veraltetes Gebäude durch die neueste freigeschaltete Stufe seiner Kette."
 eu5ab_regional_development__candidate_priority_i2_name: "Bestehende Gebäude erweitern"
 eu5ab_regional_development__candidate_priority_i2_desc: "Fügt einem bestehenden normalen Gebäude eine Stufe hinzu, ohne Ersatzbauten oder RG."
 eu5ab_regional_development__candidate_priority_i3_name: "RG ausbauen"
 eu5ab_regional_development__candidate_priority_i3_desc: "Baut lokale RG aus; erfordert volle Besetzung bestehender Arbeitsplätze und die Einhaltung der Regeln für Preise, jährliches Baubudget und Schatzkammerreserve."
 eu5ab_regional_development__candidate_priority_i4_name: "Neue Gebäude bauen"
 eu5ab_regional_development__candidate_priority_i4_desc: "Baut ein normales Gebäude neu, das am Ort noch nicht existiert."
 eu5ab_regional_development__enabled_name: "Automatisierten Bau aktivieren"
 eu5ab_regional_development__enabled_desc: "Schalte monatliche automatische Bauprüfungen ein oder aus. Vorlagen und Ortszuweisungen bleiben bei Deaktivierung erhalten."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Zusätzliche gleichzeitige Projekte"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Wie viele zivile Projekte diese Mod über den Basisplatz hinaus gleichzeitig betreiben darf. 0 bedeutet insgesamt 1 Projekt, 599 bedeutet 600; manueller Bau, Straßen und andere Mods zählen nicht hierzu."
 eu5ab_regional_development__budget_mode_name: "Jahresbudgetmodus"
 eu5ab_regional_development__budget_mode_desc: "Wähle einen festen Betrag oder das 4-, 6- bzw. 8-Fache des monatlichen Gesamteinkommens. Neuberechnung bei der ersten Prüfung eines neuen Jahres; eine Änderung der Einstellungen behält bereits erfasste Ausgaben bei."
 eu5ab_regional_development__budget_mode_option_1_name: "Festes Jahresbudget"
 eu5ab_regional_development__budget_mode_option_2_name: "Monatseinkommen ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Monatseinkommen ×6 (empfohlen)"
 eu5ab_regional_development__budget_mode_option_4_name: "Monatseinkommen ×8"
 eu5ab_regional_development__economic_metric_name: "Wirtschaftlicher Schwellenwert für gewöhnliche Gebäude"
 eu5ab_regional_development__economic_metric_desc: "Gewöhnliche Produktionsgebäude müssen die gewählte Bedingung erfüllen: positives prognostiziertes Monatseinkommen oder Gewinn bzw. 5 % annualisierte Rendite. Tatsächliche Erträge können sich ändern. Gewöhnliche öffentliche Infrastruktur ist ausgenommen. Windmühlen benötigen positive Nettoerträge aus Mehrproduktion und 5 % Jahresrendite in Rendite-Modi. Zur Verderbnisvermeidung errichtete Getreidespeicher benötigen stets 5 %. RG folgen separaten Regeln."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Monatseinkommen > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Nur beginnen, wenn das Spiel positives Monatseinkommen vorhersagt."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Monatsgewinn > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Nur beginnen, wenn das Spiel positiven gesamten Monatsgewinn vorhersagt."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Annualisierte Einkommensrendite ≥ 5 %"
 eu5ab_regional_development__economic_metric_option_3_desc: "Das prognostizierte Monatseinkommen muss mindestens 5 % der Baukosten geteilt durch 12 betragen. Dies vergleicht das Einkommen vor Betriebskosten."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Annualisierte Gewinnrendite ≥ 5 %"
 eu5ab_regional_development__economic_metric_option_4_desc: "Der prognostizierte Monatsgewinn muss mindestens 5 % der Baukosten geteilt durch 12 betragen. Der tatsächliche Gewinn kann sich je nach Betriebsbedingungen ändern."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Nahrung geht aus: zuerst bauen, Rendite ignorieren"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Wenn Nahrung ausgeht, Nahrungsprojekte zuerst behandeln und normale Nahrungsgebäude von der Rendite befreien. Reihenfolge und alle anderen Regeln gelten weiter."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Nahrung höchstens 25 %: zuerst bauen, Rendite ignorieren"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Liegen die Nahrungsvorräte am Markt bei 25 % oder darunter, werden Nahrungsprojekte bevorzugt und von der Renditeprüfung befreit. Baureihenfolge und Sicherheitsregeln bleiben voll aktiv."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Bauversorgung unter 65 %: Rendite ignorieren"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Fällt die Marktversorgung eines Kernbaumaterials unter 65 %, sind dessen Produktionsstätten von der Renditeschwelle befreit. Alle anderen Bauregeln bleiben in Kraft."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Militärversorgung im Krieg unter 65 %: Rendite ignorieren"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Fällt im Kriegszustand die Versorgung eines Militärguts unter 65 %, sind dessen Produktionsgebäude von der Renditeprüfung befreit. Alle sonstigen Bauregeln bleiben aktiv."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Strategische Produktion ohne Inputs: vorgelagerte Rendite ignorieren"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Liegt das Marktangebot eines Vorprodukts unter 65 % der Nachfrage und gibt es auf demselben Markt ein geöffnetes inländisches Gebäude für Nahrung, grundlegende Baumaterialien oder Militärgüter, das dieses Vorprodukt verbraucht und unter Inputmangel leidet, sind die Erzeuger dieses Vorprodukts von der gewählten Renditeschwelle befreit. Das verbrauchende Gebäude muss seine Produktion nicht eingestellt haben, und der fehlende Input muss nicht genau dieses Vorprodukt sein. Alle anderen Bauregeln gelten weiterhin."
 eu5ab_regional_development__fixed_annual_budget_name: "Festes Jahresbudget"
 eu5ab_regional_development__fixed_annual_budget_desc: "Nur im festen Modus verwendet; alle Vorlagen teilen diesen Betrag."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Mindest-Schatzkammerreserve"
 eu5ab_regional_development__min_cash_reserve_desc: "Behalte diese Reserve nach den geschätzten Kosten für alle geplanten Projekte bei. Tatsächliche RG-Kosten können abweichen."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Mindestpreis-Prozentsatz"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Hochpreis-Referenzprozentsatz"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Sondergebäude erlauben"
 eu5ab_regional_development__allow_special_buildings_desc: "Erlaubt Spezialgebäude; die Baubedingungen des Spiels gelten weiter."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Marktengpässe mit freien Bauplätzen ausgleichen"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "Nutze nach regulären Projekten freie Bauplätze, um Engpässe an in dieser Runde geprüften eigenen Orten desselben Marktes zu beheben. Berücksichtigt den Rohstoffbedarf geplanter Projekte und noch nicht realisierte Produktionssteigerungen. Integrierte Voreinstellungen können ungeplante Wirtschaftszweige ergänzen; Verbote, eigene Priorität 0 und sonstige Bauanforderungen gelten weiterhin."
 eu5ab_regional_development__auto_build_input_sources_name: "Vorgelagerte Quellen bei Mangel bauen"
 eu5ab_regional_development__auto_build_input_sources_desc: "Prüfe Rohstoffmarktengpässe unabhängig und baue erlaubte vorgelagerte Betriebe, auch wenn nachgelagerte Fabriken voll besetzt sind, ihnen aber Rohstoffe fehlen."
 eu5ab_regional_development__pause_low_workforce_name: "Bei Arbeitskräftemangel pausieren"
 eu5ab_regional_development__stop_input_shortage_name: "Bei kritischem Inputmangel stoppen"
 eu5ab_regional_development__stop_input_shortage_desc: "Das Marktangebot an benötigten industriellen Schlüsselrohstoffen muss mindestens 75 % des Bedarfs decken, bevor entsprechende Bauarbeiten eingeleitet werden können."
 eu5ab_regional_development__allow_rgo_name: "RG-Erweiterung erlauben"
 eu5ab_regional_development__allow_rgo_desc: "Erlaubt allen Vorlagen, den Ausbau der RG zu berücksichtigen."
 eu5ab_regional_development__native_input_priority_name: "Priorität lokaler Inputs"
 eu5ab_regional_development__native_input_priority_desc: "0–10; höhere Werte bevorzugen Gebäude, die Rohstoffe aus derselben Provinz verarbeiten können."
 eu5ab_regional_development__performance_preset_name: "Leistungsvoreinstellung"
 eu5ab_regional_development__performance_preset_desc: "Eine Voreinstellung synchronisiert die erweiterten Optionen. Benutzerdefiniert behält ihre aktuellen Werte."
 eu5ab_regional_development__performance_preset_option_1_name: "Konservativ"
 eu5ab_regional_development__performance_preset_option_1_desc: "Prüft bis zu 10 Orte täglich und startet höchstens 30 Projekte je Lauf. Planungskandidaten: 5; Gewinnkandidaten: 15. Stoppt bei genügend Kandidaten."
 eu5ab_regional_development__performance_preset_option_2_name: "Ausgewogen"
 eu5ab_regional_development__performance_preset_option_2_desc: "Prüft bis zu 20 Orte täglich und startet höchstens 50 Projekte je Lauf. Planungskandidaten: 4; Gewinnkandidaten: 12. Stoppt bei genügend Kandidaten."
 eu5ab_regional_development__performance_preset_option_3_name: "Maximaler Durchsatz"
 eu5ab_regional_development__performance_preset_option_3_desc: "Für Länder mit vielen Orten. Prüft bis zu 30 täglich ohne Lauf-Limit. Planungskandidaten: 3; Gewinnkandidaten: 10. Stoppt bei genügend Kandidaten."
 eu5ab_regional_development__performance_preset_option_4_name: "Benutzerdefiniert"
 eu5ab_regional_development__performance_preset_option_4_desc: "Verwendet die aktuellen erweiterten Einstellungen."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Viele Vorlagenorte können die Spielleistung senken."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Unter Maximalem Durchsatz werden bis zu 30 Orte täglich ohne Rundenbegrenzung geprüft. Sehr große Reiche können verlängerte Monatsberechnungszeiten aufweisen."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Angebot & Nachfrage\" dauert zu lang: \"Planungskandidaten\" senken."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Nur bei Angebot und Nachfrage. Weniger Planungskandidaten reduziert Projekte je Ort und Typ in späteren Prüfungen."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Folge: Weniger Alternativkandidaten können spätere rentable Projekte überspringen."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Projekte werden nach Planungswertung geprüft. Das Senken des Limits lässt weniger Ausweichmöglichkeiten bei Vorbedingungsfehlern, wodurch spätere baubare Projekte übersprungen werden könnten."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "„Prognostizierter Gewinn“ dauert zu lange: „Gewinnkandidaten je Ort“ verringern."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Wird nur bei „Prognostizierter Gewinn“ angezeigt. Verringert „Gewinnkandidaten je Ort“, um die Anzahl der später geprüften Alternativen zu reduzieren."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Weniger Alternativen können dazu führen, dass keine Wahl bleibt, wenn führende Projekte nicht beginnen können."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Alternativen werden nach der Rangfolge nach prognostiziertem Gewinn und Gebäudepräferenzen beibehalten. Weniger Optionen zu behalten lässt weniger Auswahl, wenn führende Projekte nicht beginnen können."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Auch tägliche Orte oder Zusätze je Lauf senken."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Weniger tägliche Orte verteilen die Prüfungen auf mehr Tage. Weniger Zusätze pro Runde verringern die auf einmal eingeleiteten Projekte. Der Wert 0 hebt das Rundenlimit auf."
 eu5ab_regional_development__parallel_location_scan_name: "Orte getrennt verarbeiten"
 eu5ab_regional_development__parallel_location_scan_desc: "Orte getrennt prüfen, um Pausen zu reduzieren, oder bei Deaktivierung täglich gemeinsam verarbeiten. Prioritäten, Budget und Baureihenfolge bleiben unverändert."
 eu5ab_regional_development__daily_location_task_limit_name: "Geprüfte Orte pro Tag"
 eu5ab_regional_development__daily_location_task_limit_desc: "Maximale Anzahl täglich detailliert geprüfter Orte. Niedrigere Werte bedeuten weniger tägliche Arbeit, aber mehr Tage, um das Land abzudecken."
 eu5ab_regional_development__max_additions_per_run_name: "Maximale Zusätze je Lauf"
 eu5ab_regional_development__max_additions_per_run_desc: "Begrenzt die maximal pro Durchlauf begonnenen Projekte (0 bis 600). Null bedeutet unbegrenzt."
 eu5ab_regional_development__candidates_per_location_name: "Planungskandidaten je Ort"
 eu5ab_regional_development__candidates_per_location_desc: "Nur unter 'Angebots- und Nachfrageplanung' aktiv. Bestimmt für jeden Ort und jede gewöhnliche Baukategorie die Anzahl der nach Planungswertung für Folgeprüfungen vorgehaltenen Kandidaten (3–30). Mehr Kandidaten senken das Risiko, machbare Optionen zu verpassen, erhöhen aber die Rechenzeit."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Gewinnkandidaten je Ort"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Nur für die Auswahl nach prognostiziertem Gewinn. Behalte 3–30 Alternativen pro Ort und gewöhnlichem Bautyp bei, gereiht nach prognostiziertem Gewinn und Gebäudepräferenzen. Mehr Alternativen bieten mehr Auswahl, wenn führende Projekte nicht beginnen können, verlangsamen jedoch möglicherweise spätere Prüfungen."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Bei genügend Kandidaten stoppen"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Detaillierte Prüfungen weiterer Orte stoppen, sobald Alternativen das Doppelte der in dieser Runde hinzufügbaren Projekte erreichen. Freie Plätze und Maximale Zusätze je Lauf bestimmen diese Anzahl; 0 hebt nur die Obergrenze pro Runde auf. Bauanforderungen gelten weiterhin."
 eu5ab_diagnostics_cmm_hint: "Ändere gemeinsame Regeln in den Mod-Einstellungen von Community Mod Framework. Der Baubericht zeigt das letzte automatische Ergebnis."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "Um 10 erhöhen"
 eu5ab_cmm_shift_decrease_10: "Um 10 senken"
 eu5ab_cmm_shift_increase_1000: "Um 1000 erhöhen"
 eu5ab_cmm_shift_decrease_1000: "Um 1000 senken"
 eu5ab_cmm_shift_increase_max: "Auf Maximum setzen"
 eu5ab_cmm_shift_decrease_min: "Auf Minimum setzen"
 eu5ab_regional_development__automation__rgo_desc: "RG-Ausbau in Betracht ziehen, sobald bestehende Arbeitsplätze voll besetzt sind. Wähle, ob Arbeitskräfte für neue Stellen prognostiziert werden sollen."
 eu5ab_regional_development__rgo_workforce_mode_name: "RG-Arbeitskräftemodus"
 eu5ab_regional_development__rgo_forced_relaxed_name: "RG-Modus: Entspannt (Arbeitskräfte-Pausieren aus)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "Keine Arbeitskräfteprognose. Bestehende Arbeitsplätze müssen voll besetzt sein; ein Mangel an neuen Arbeitskräften senkt lediglich die Baupriorität."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Standardmäßig „Entspannt“. Bei Deaktivierung des Arbeitskräfteschutzes wird vorübergehend der Modus „Entspannt“ verwendet und die Priorität bei akutem Arbeitskräftemangel gesenkt. Ein erneutes Aktivieren stellt den gewählten Modus wieder her. Bestehende Arbeitsplätze müssen stets voll besetzt sein."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Entspannt"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Folgt den allgemeinen Ausbauregeln des Grundspiels: Sobald bestehende Arbeitsplätze voll besetzt sind, werden Preise, Marktbedarf und erwartete Produktion bewertet, ohne neue Arbeitskräfte zu prognostizieren. Bei aktivem Arbeitskräfteschutz senkt ein Mangel an neuen Arbeitskräften nicht die Priorität."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Bevölkerung berücksichtigen"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "Schätzt nach Prüfung der Vollbeschäftigung bestehender Plätze die qualifizierten Schichtaufstiege im Prognosezeitraum ab. Pausiert, falls nicht genügend Arbeitskräfte für die nächste Ausbaustufe bereitstehen."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "RG-Bevölkerungsprognosezeitraum (Monate)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "Im Modus „Bevölkerung berücksichtigen“ erfordert der Ausbau, dass im festgelegten Zeitraum genügend Arbeitskräfte erwartet werden, um die neuen Stellen zu besetzen. Standard: 180 Monate. Bereich: 0–1200; null zählt nur aktuell verfügbare Arbeitskräfte. Die Schätzung berücksichtigt „Reichlich Gelegenheiten“, Alphabetisierung und berufswechselfähige Bevölkerung. Längere Prognosen können stärker von den tatsächlichen Ergebnissen abweichen. Klick zum Anpassen um 1 Monat, Strg gedrückt halten für 12 Monate oder Umschalt für 120 Monate."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "Wenn aktiviert, benötigen gewöhnliche Gebäude ausreichend prognostizierte Arbeitskräfte; RG nutzen ihren gewählten Modus. Das Deaktivieren stoppt Prognosen und nutzt für RG vorübergehend den Modus „Entspannt“. Akuter Mangel senkt die Priorität, ohne neue Projekte für sich allein zu blockieren. Bestehende RG-Arbeitsplätze müssen weiterhin voll besetzt sein. Ein erneutes Aktivieren stellt den vorherigen RG-Modus wieder her."
 eu5ab_regional_development__job_fill_deadline_months_name: "Arbeitskräfteprognosezeitraum für gewöhnliche Gebäude (Monate)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Unabhängiger Prognosezeitraum für gewöhnliche Gebäude: Standard 12 Monate, Bereich 0–240. Null berücksichtigt nur derzeit qualifizierte untätige Arbeitskräfte. RG mit Bevölkerungsberücksichtigung nutzen ihren eigenen Prognosezeitraum. Aktuelle Aufstiegsraten sind eine Schätzung, keine Garantie."
 eu5ab_regional_development__price_min_desc: "Standard: 80 % des Basispreises. Niedrigere Preise verringern die Priorität. Pausiere den Bau, wenn alle Erträge beim oder unter dem Schwellenwert liegen; gewichte mehrfache Erträge nach Menge und Basispreis. Bei 100 % oder mehr gilt nur der Schwellenwert. Aktive Nahrungssicherungen können Preisgrenzen aufheben."
 eu5ab_regional_development__price_max_desc: "Standard: 125 %. Preise über dem Basiswert erhöhen die Priorität schrittweise bis zum Referenzwert. Bei einer Referenz von 125 % bringt ein Preis von 112,5 % 70 Punkte; 125 % oder mehr bringt 140 Punkte. Liegt die Referenz bei 100 % oder darunter, bringt jeder Preis über dem Basiswert 140 Punkte."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
 eu5ab_cmm_shift_increase_120: "Um 120 Monate erhöhen"
 eu5ab_cmm_ctrl_increase_12: "Um 12 Monate erhöhen"
 eu5ab_cmm_ctrl_increase_default: "Um [Multiply_CFixedPoint(Player.MakeScope.GetVariableFromVariableMap('cmm_step', MakeScopeFlag(Scope.GetFlagName)).GetValue, '(CFixedPoint)5')] erhöhen"
 EU5AB_CMM_NUMERIC_DECREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_decrease_12', 'eu5ab_cmm_ctrl_decrease_default')]"
 eu5ab_cmm_shift_decrease_120: "Um 120 Monate verringern"
 eu5ab_cmm_ctrl_decrease_12: "Um 12 Monate verringern"
 eu5ab_cmm_ctrl_decrease_default: "Um [Multiply_CFixedPoint(Player.MakeScope.GetVariableFromVariableMap('cmm_step', MakeScopeFlag(Scope.GetFlagName)).GetValue, '(CFixedPoint)5')] verringern"
 eu5ab_regional_development__governors_name: "Statthalter-Empfehlungen"
 eu5ab_regional_development__governors__recommendations_name: "Empfehlungen & Aktualisierung"
 eu5ab_regional_development__governors__recommendations_desc: "Analysiert Kandidaten für örtliche Statthalter und Marinestatthalter, ohne Gebäude zu bauen, abzureißen oder zu verlegen."
 eu5ab_regional_development__governors__scoring_name: "Bewertungspräferenzen"
 eu5ab_regional_development__governors__scoring_desc: "Wähle, wie der Ortswert gewichtet wird und ob begrenzter strategischer Wert einfließt."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Statthalter-Empfehlungen aktivieren"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Regelmäßig Standorte für örtliche Statthalter und Marinestatthalter vorschlagen. Das Deaktivieren behält die letzten Ergebnisse bei, entfernt jedoch Empfehlungsbenachrichtigungen."
 eu5ab_regional_development__governor_refresh_interval_name: "Aktualisierungsintervall"
 eu5ab_regional_development__governor_refresh_interval_desc: "Lege das Aktualisierungsintervall fest. Einige Änderungen an Territorium, Hauptstadt, Ortsrang und Regierung lösen vorzeitige Aktualisierungen aus. Straßen und andere Änderungen der Nähe werden bei geplanten Prüfungen berücksichtigt."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "Jeden Monat"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "Aktualisiert am schnellsten und eignet sich für kleinere Länder. Häufige Prüfungen können in großen Ländern zu längeren Pausen führen."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "Alle 3 Monate"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Ausgewogene Reaktion auf Straßenänderungen und Leistung bei großen Ländern."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "Alle 6 Monate"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Geringere Neuberechnungsfrequenz für große Länder."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "Alle 12 Monate"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "Niedrigste Kosten, aber Änderungen an Straßen und Nähe können bis zu ein Jahr brauchen, um zu erscheinen."
 eu5ab_regional_development__governor_refresh_now_name: "Jetzt neu berechnen"
 eu5ab_regional_development__governor_refresh_now_text: "Jetzt neu berechnen"
 eu5ab_regional_development__governor_refresh_now_desc: "Berechnet Empfehlungen für örtliche Statthalter und Marinestatthalter jetzt neu, auch während der Pause. Bei großen Ländern kann es kurzzeitig ruckeln."
 eu5ab_regional_development__governor_scoring_profile_name: "Ortswertprofil"
 eu5ab_regional_development__governor_scoring_profile_desc: "Gewichtet potenzielle Steuerbasis, Bevölkerung und Entwicklung. Wertungen werden aus dem Ortswert multipliziert mit erwarteten Nähenverbesserungen geschätzt, anstatt eines festen Kontrollwerts; derzeitige Kontrolle wird weder addiert noch abgezogen."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Gemischt"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Gleicht wirtschaftlichen Wert und administrativ-demografischen Wert aus."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Wirtschaft"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Betont potenzielle Steuergrundlage und bestehende wirtschaftliche Größe."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "Verwaltung & Bevölkerung"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Betont Bevölkerung und Entwicklung."
 eu5ab_regional_development__governor_strategic_value_name: "Strategischen Wert einbeziehen"
 eu5ab_regional_development__governor_strategic_value_desc: "Gewichtet Häfen, Grenzorte und befestigte Orte begrenzt. Dies ändert nur den Ortswert und ist keine separate Wertungskomponente."
 eu5ab_governor_window_title: "Details der Statthalter-Empfehlungen"
 eu5ab_governor_window_intro: "Vorschläge für neue Standorte und Verlegungen anzeigen. Gebäudeänderungen liegen in Ihrer Hand."
 eu5ab_governor_road_tier_help: "Schätzungen verwenden die höchste freigeschaltete Straßenstufe; tatsächliche Gewinne können abweichen.\nJeder Plan fixiert den anderen Sitztyp. Nach Änderungen neu berechnen; Gewinne können nicht addiert werden."
 eu5ab_governor_refresh_button: "Neu berechnen"
 eu5ab_governor_refresh_button_tt: "Standorte, Verlegungen und Layouts für örtliche Statthalter- und Marinestatthaltersitze neu bewerten. Große Länder können kurzzeitig pausieren; unvollständige Prüfungen zeigen einen Hinweis."
 eu5ab_governor_local_section: "Örtlicher Statthalter"
