 eu5ab_rgo_short_desc: "Bestehende Arbeitsplätze müssen voll besetzt sein. Standard ist „Entspannt“; wähle „Bevölkerung berücksichtigen“, um Arbeitskräfte für neue Stellen zu prognostizieren."
 eu5ab_rgo_help: "Bestehende RG-Arbeitsplätze müssen voll besetzt sein. Der Standardmodus „Entspannt“ prognostiziert keine neuen Arbeitskräfte; „Bevölkerung berücksichtigen“ erfordert, dass im gewählten Zeitraum genügend Arbeitskräfte erwartet werden.\nPreise beim oder unter dem Mindestwert pausieren den Ausbau. Niedrige Preise senken die Priorität, hohe Preise heben sie an. Projekte mit einer Wertung unter 0 beginnen nicht.\nEigene gewöhnliche Gebäude und RG, die dieselbe Ware auf demselben Markt produzieren, teilen sich ein Ausbaulimit. Es umfasst noch nicht realisierte Produktionssteigerungen aus laufenden oder abgeschlossenen Projekten und berücksichtigt den neuen Rohstoffbedarf geplanter Projekte. Ein weiterer Ausbau wird weniger bevorzugt, je näher die erwarteten Gewinne an den Bedarfsengpass plus 10 % des Bedarfs herankommen. Neue Baustarts pausieren bei dieser Menge. Die letzte Ausbaustufe darf sie überschreiten; bestehende Projekte laufen weiter.\nDas Deaktivieren des Arbeitskräfteschutzes stoppt Prognosen, aber akuter Mangel senkt weiterhin die Priorität. Aktive Nahrungssicherungen können relevante RG priorisieren und Preis- sowie Ausbaubeschränkungen aufheben. Vollbeschäftigung auf bestehenden Plätzen sowie anwendbare Arbeitskräfte-, Budget- und Grundspiel-Bauanforderungen gelten weiterhin."
 eu5ab_workforce_help: "Gewöhnliche Gebäude nutzen standardmäßig eine 12-Monats-Prognose; RG im Modus „Bevölkerung berücksichtigen“ nutzen 180 Monate. Schätzungen nutzen aktuelle Aufstiegsraten, lokale und nationale Modifikatoren, „Reichlich Gelegenheiten“, Alphabetisierung und berechtigte Bevölkerung. Migration, veränderte Raten und konkurrierende Berufe können die Ergebnisse beeinflussen.\nDas Deaktivieren des Arbeitskräfteschutzes stoppt Prognosen. Akuter Mangel senkt die Priorität, ohne den prognostizierten Gewinn zu ändern; die Nahrungssicherung greift weiterhin wie konfiguriert."
