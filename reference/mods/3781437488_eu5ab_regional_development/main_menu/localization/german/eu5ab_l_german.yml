 eu5ab_governor_local_candidate_1_breakdown: "Gesamtwertung [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Zugewinn durch eigene Nähenverbesserung [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Zugewinn durch Nähenverbesserung des Umlands [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nDie Nähe verbessert sich voraussichtlich in [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] Orten (einschließlich des Standorts).\nWertungen werden aus dem Ortswert multipliziert mit dem erwarteten Nähenzuwachs geschätzt und stellen keinen endgültigen Kontrollwert dar; derzeitige Kontrolle wird weder addiert noch abgezogen, und die tatsächliche Kontrolle entwickelt sich weiterhin über maximale Kontrolle und reguläre Spielmechaniken."
 eu5ab_governor_local_candidate_2_breakdown: "Gesamtwertung [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Zugewinn durch eigene Nähenverbesserung [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Zugewinn durch Nähenverbesserung des Umlands [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nDie Nähe verbessert sich voraussichtlich in [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] Orten (einschließlich des Standorts).\nWertungen werden aus dem Ortswert multipliziert mit dem erwarteten Nähenzuwachs geschätzt und stellen keinen endgültigen Kontrollwert dar; derzeitige Kontrolle wird weder addiert noch abgezogen, und die tatsächliche Kontrolle entwickelt sich weiterhin über maximale Kontrolle und reguläre Spielmechaniken."
 eu5ab_governor_local_candidate_3_breakdown: "Gesamtwertung [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Zugewinn durch eigene Nähenverbesserung [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Zugewinn durch Nähenverbesserung des Umlands [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nDie Nähe verbessert sich voraussichtlich in [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] Orten (einschließlich des Standorts).\nWertungen werden aus dem Ortswert multipliziert mit dem erwarteten Nähenzuwachs geschätzt und stellen keinen endgültigen Kontrollwert dar; derzeitige Kontrolle wird weder addiert noch abgezogen, und die tatsächliche Kontrolle entwickelt sich weiterhin über maximale Kontrolle und reguläre Spielmechaniken."
 eu5ab_governor_naval_candidate_1_breakdown: "Gesamtwert [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = Standort-Näheverbesserungsgewinn [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Umgebungs-Näheverbesserungsgewinn [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nDie Nähe wird sich voraussichtlich an [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] Orten verbessern (einschließlich des Standorts selbst).\nDie Werte werden geschätzt, indem die Ortspunkte mit dem erwarteten Nähezuwachs multipliziert werden, und entsprechen nicht dem endgültigen Kontrollwert; die aktuelle Kontrolle erhöht oder verringert die Punkte nicht, und die tatsächliche Kontrolle entwickelt sich weiterhin über die maximale Kontrolle und reguläre Spielmechaniken."
 eu5ab_governor_naval_candidate_2_breakdown: "Gesamtwert [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = Standort-Näheverbesserungsgewinn [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + Umgebungs-Näheverbesserungsgewinn [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\nDie Nähe wird sich voraussichtlich an [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] Orten verbessern (einschließlich des Standorts selbst).\nDie Werte werden geschätzt, indem die Ortspunkte mit dem erwarteten Nähezuwachs multipliziert werden, und entsprechen nicht dem endgültigen Kontrollwert; die aktuelle Kontrolle erhöht oder verringert die Punkte nicht, und die tatsächliche Kontrolle entwickelt sich weiterhin über die maximale Kontrolle und reguläre Spielmechaniken."
 eu5ab_governor_naval_candidate_3_breakdown: "Gesamtwert [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = Standort-Näheverbesserungsgewinn [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + Umgebungs-Näheverbesserungsgewinn [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\nDie Nähe wird sich voraussichtlich an [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] Orten verbessern (einschließlich des Standorts selbst).\nDie Werte werden geschätzt, indem die Ortspunkte mit dem erwarteten Nähezuwachs multipliziert werden, und entsprechen nicht dem endgültigen Kontrollwert; die aktuelle Kontrolle erhöht oder verringert die Punkte nicht, und die tatsächliche Kontrolle entwickelt sich weiterhin über die maximale Kontrolle und reguläre Spielmechaniken."
