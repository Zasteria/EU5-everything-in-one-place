 eu5ab_select_template_tooltip: "Wähle diese Vorlage aus und sieh dir ihre Regeldetails an."
 eu5ab_preset_readonly_desc: "Integrierte Voreinstellungen haben feste Prioritäten und können separat pausiert, fortgesetzt oder zugewiesen werden. Kopiere eine als eigene Vorlage, um Prioritäten zu bearbeiten. Gemeinsame Regeln befinden sich in den CMF-Mod-Einstellungen."
