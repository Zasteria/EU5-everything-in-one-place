 eu5ab_automation_buildings_intro: "Eigene Vorlagen ermöglichen das freie Festlegen von Gebäudeprioritäten und Zuweisen von Orten. Integrierte Voreinstellungen haben feste Prioritäten; kopiere eine als eigene Vorlage, um sie zu bearbeiten."
