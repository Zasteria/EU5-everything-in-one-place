 eu5ab_reset_decision: "Advanced Auto Build zurücksetzen"
 eu5ab_reset_decision_desc: "Vorlagen und Einstellungen beibehalten, Ortszuweisungen aufheben und Bauaufzeichnungen zurücksetzen. Weisen Sie Vorlagen anschließend neu zu."
 eu5ab_deep_decision: "Bauprojekte dieses Monats landesweit neu planen"
 eu5ab_deep_decision_desc: "Eigene Orte mit aktiven Vorlagen landesweit neu bewerten, den Monatsplan speichern und Bauarbeiten ab dem 23. einleiten."
 eu5ab_open_confirmation: "Bestätigung öffnen"
 eu5ab_reset_confirm: "Zurücksetzen bestätigen"
 eu5ab_reset_confirm_desc: "Vorlagen und Einstellungen beibehalten, aber Ortszuweisungen, Pläne, Wartezeiten, Berichte, Empfehlungen sowie Projekt- und Jahresausgabenaufzeichnungen löschen. Ausgegebenes Gold wird nicht erstattet; bestehende Bauvorhaben werden fortgesetzt. Weisen Sie Vorlagen anschließend neu zu.\nErsetzen Sie nach einem Länderwechsel die Vorlagen und Einstellungen dieses Landes durch die vor dem Wechsel gespeicherten."
 eu5ab_deep_confirm_desc: "Eigene Orte mit aktiven Vorlagen neu prüfen und den noch nicht ausgeführten Plan dieses Monats ersetzen. Verwendet die aktuelle Strategie, Nahrungssicherung und Baureihenfolge; das letzte Projekt darf das verbleibende Budget überschreiten.\nGroße Länder können Zeit in Anspruch nehmen; das Fenster kann erst nach Abschluss der Planung geschlossen werden. Spätere Einstellungsänderungen verändern diesen Plan nicht mehr. Baubeginn ab dem 23.; regelmäßige Prüfungen werden im Folgemonat fortgesetzt."
