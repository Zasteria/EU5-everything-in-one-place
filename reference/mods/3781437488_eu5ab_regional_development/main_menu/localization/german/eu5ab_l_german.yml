 eu5ab_cash_section_title: "Schatzkammerreserve"
 eu5ab_cash_short_desc: "Mindestbetrag, der in der Staatskasse verbleiben muss."
 eu5ab_cash_label: "Schatzkammerreserve"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] Gold"
 eu5ab_cash_help: "Vor dem Baubeginn müssen die geschätzten Kosten für dieses und andere geplante Projekte genügend Gold für die Reserve belassen.\nBei 1.050 Gold und einer Reserve von 1.000 kann ein Projekt mit geschätzten Kosten von 100 nicht beginnen. Die tatsächlichen RG-Kosten können von den Schätzungen abweichen. Ein Rest des jährlichen Baubudgets muss ebenfalls verbleiben."
 eu5ab_budget_section_title: "Jährliches Baubudget"
 eu5ab_budget_short_desc: "Wählt einen festen Betrag oder ein jährliches Budget auf Grundlage der gesamten monatlichen Einnahmen."
 eu5ab_budget_mode_fixed: "Festes Budget"
 eu5ab_budget_mode_income: "Einkommensabhängig"
 eu5ab_budget_multiplier_4: "×4 Konservativ"
 eu5ab_budget_multiplier_6: "×6 Empfohlen"
 eu5ab_budget_multiplier_8: "×8 Aktiv"
 eu5ab_budget_effective_label: "Budget des laufenden Jahres"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] Gold"
 eu5ab_budget_label: "Jahresbudget"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] Gold/Jahr"
 eu5ab_budget_cash_comparison: "Das jährliche Baubudget legt die geplanten Ausgaben fest; die Schatzkammerreserve bestimmt, wie viel Gold behalten werden muss. Das letzte Projekt darf das verbleibende Budget überschreiten, muss aber die Reserveprüfung bestehen."
 eu5ab_budget_reset_note: "Wird bei der ersten Prüfung eines neuen Jahres zurückgesetzt; tatsächliche Ausgaben werden erst nach Baubeginn angerechnet. Eine Änderung des Budgets löscht erfasste Ausgaben nicht."
 eu5ab_budget_help: "Gewöhnliche Gebäude und RG-Ausbauten teilen sich ein jährliches Baubudget: einen festen Betrag oder das 4-, 6- bzw. 8-Fache des monatlichen Gesamteinkommens. Es setzt sich bei der ersten Prüfung eines neuen Jahres zurück; eine unterjährige Anpassung behält bereits erfasste Ausgaben bei.\nNur erfolgreiche Baustarts zählen zu ihren tatsächlichen Kosten. Das letzte Projekt darf das verbleibende Budget überschreiten; danach werden keine weiteren Projekte hinzugefügt. Die Anforderungen an die Schatzkammerreserve gelten weiterhin."
 eu5ab_quota_section_title: "Gleichzeitiges Baulimit dieser Mod"
 eu5ab_quota_short_desc: "Legt fest, wie viele zivile Bauprojekte diese Mod über den Basisplatz hinaus gleichzeitig betreiben darf."
 eu5ab_hard_cap_label: "Zusätzliche gleichzeitige Projekte"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] Projekte (Gesamtlimit ist dieser Wert + 1)"
 eu5ab_quota_help: "Lege zusätzliche Plätze über das erste Projekt hinaus fest: 0 erlaubt 1 gleichzeitiges Projekt, 599 erlaubt 600. Gewöhnliche Gebäude und RG teilen sich dieses Limit. Nur unvollendete Projekte dieser Mod zählen; manueller Bau, Straßen und andere Mods zählen nicht. Jede Runde füllt nur freie Plätze auf. Ein Ort kann mehrere Projekte erhalten, sofern Plätze frei sind, und wartet nach der Runde 3 Monate, bevor neue Projekte geplant werden."
