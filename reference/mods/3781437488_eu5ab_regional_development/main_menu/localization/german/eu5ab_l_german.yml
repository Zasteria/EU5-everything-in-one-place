 eu5ab_operating_rules_title: "Bauregeln"
 eu5ab_operating_rules_short_desc: "Konfiguriere Sondergebäude, vorgelagerte Bauten und Inputengpässe."
 eu5ab_operating_rules_help: "Spezialgebäude müssen die Freischaltungs- und Baubedingungen des Grundspiels erfüllen.\nRohstoffengpässe können den Bau von durch die Vorlage erlaubten Zulieferern auslösen, selbst wenn bestehende Betriebe voll besetzt sind.\nBei aktivem Rohstoffschutz muss das Angebot an benötigten industriellen Schlüsselrohstoffen 75 % des Bedarfs decken. Verwende wenn möglich aktuelle Produktionsmethoden, andernfalls schätze eine verfügbare Methode ab. Alternative Methoden werden separat bewertet; Produktionsmethoden werden nicht automatisch geändert."
 eu5ab_rgo_section_title: "RG"
 eu5ab_rgo_allow: "Dieser Vorlage RG-Ausbau erlauben"
 eu5ab_toggle_special_buildings: "Sondergebäude erlauben"
 eu5ab_toggle_auto_build_input_sources: "Bei fehlenden Vorprodukten vorgelagerte Quellen bauen"
 eu5ab_toggle_pause_low_workforce: "Ausbau bei Arbeitskräftemangel pausieren"
 eu5ab_ranking_mode_section_title: "Bauentscheidungsstrategie"
 eu5ab_town_rights_preference_desc: "Stadtrechte und Industrie fördern bringen unabhängig voneinander jeweils bis zu 500 Planungspunkte. Die Industrieförderung gilt nur für direkt passende Gebäudeerträge in Ihrem geförderten Gebiet, gewichtet nach der gewählten Rezeptproduktion zu Basispreisen; sie überträgt sich nicht entlang von Lieferketten. Beide Boni stapeln sich mit Punkten für lokale Rohstoffe. Der Gewinnmodus nutzt diese Punkte nur für die Vorauswahl. Der RG-Ausbau behält nur den Stadtrechte-Bonus. Alle Bauanforderungen gelten weiterhin."
 eu5ab_ranking_mode_current_label: "Aktueller Modus"
 eu5ab_ranking_mode_composite_value: "#G Angebots- und Bedarfsplanung#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Auswahl nach erwartetem Gewinn#!"
 eu5ab_ranking_mode_common_desc: "Beide Strategien berücksichtigen nur freigeschaltete, baubare Gebäude mit Priorität über 0. Rendite, Budget, Reserve, Inputs, Arbeitskräfte und weitere Sicherheitsregeln gelten ebenfalls. Nahrungsnotfälle und die automatische Baureihenfolge haben Vorrang."
 eu5ab_ranking_mode_composite_desc: "Gleicht Marktknappheit, strategischen Bedarf, Produktionseffizienz, lokale Rohstoffe, Preise und Arbeitskräfterisiko aus; priorisiert geschlossene Lieferketten und langfristige Stabilität."
 eu5ab_ranking_mode_actual_profit_desc: "Filtert Kandidatenprojekte nach Vorlagen- und Sicherheitsregeln und priorisiert den Bau nach dem geschätzten monatlichen Nettonutzen, einschließlich der Ressourcenerträge von Windmühlen und des Werts der durch Getreidespeicher erhaltenen Nahrung. Bei ähnlichem geschätztem Nutzen dienen die in der Vorlage festgelegten Prioritäten als sekundäre Richtlinie."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Behält die konfigurierten 3–30 Alternativen pro Ort und gewöhnlichem Bautyp bei. Nahrungssicherung und die Automatische Baureihenfolge haben Vorrang; Rendite- und Bauanforderungen gelten weiterhin. RG werden separat nach Engpässen, Preisen, Beschäftigung und strategischem Bedarf bewertet."
 eu5ab_ranking_mode_help: "Entscheidungsstrategie\nStrategien wechseln unter Community Mod Framework → Mod-Einstellungen → Erweiterter Autobau → Sicherheit & Rangfolge → Bauentscheidungsstrategie.\n• Angebot-und-Nachfrage-Planung: Betont Marktangebot und -nachfrage, vollständige Produktionsketten und langfristige wirtschaftliche Stabilität.\n• Auswahl nach geschätztem Gewinn: Verwendet den geschätzten monatlichen Nettonutzen, einschließlich Windmühlenerträgen und Verderbniseinsparungen in Getreidespeichern, mit Vorlagenprioritäten als Entscheidungshilfe bei Gleichstand."
 eu5ab_workforce_section_title: "Arbeitskräfte"
 eu5ab_pause_workforce_short_desc: "Steuert, ob Arbeitskräftemangel den Bau blockiert."
 eu5ab_job_fill_deadline_label: "Prognosezeitraum für Arbeitskräfte"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] Monate"
 eu5ab_job_fill_deadline_value: "Prognosezeitraum für Arbeitskräfte: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] Monate"
 eu5ab_job_fill_deadline_desc: "Legt den maximalen Prognosezeitraum für Arbeitskräfte in Monaten fest (0–240). Null berücksichtigt nur derzeit verfügbare Arbeitskräfte, ohne künftige Aufstiege. „Bei Arbeitskräftemangel pausieren“ bestimmt, ob Arbeitskräftemangel den Baubeginn verhindert: Ist die Option aktiviert, blockiert eine unzureichende Prognose den Bau; andernfalls senkt der Mangel nur die Baupriorität."
 eu5ab_deadline_0: "0 Mon."
 eu5ab_deadline_3: "3 Mon."
 eu5ab_deadline_6: "6 Mon."
 eu5ab_deadline_12: "12 Mon."
 eu5ab_toggle_stop_input_shortage: "Ausbau bei kritischem Vorproduktmangel stoppen"
 eu5ab_prediction_status_label: "Arbeitskräfteschätzung"
 eu5ab_status_promotion_forecast: "#G Aufstiegsprognose für gewählten Zeitraum#!"
 eu5ab_status_conservative_fallback: "#L Konservative Schätzung nach aktuellen Arbeitskräften#!"
 eu5ab_prediction_promotion_short_desc: "Kombiniert derzeit freie Arbeiter mit Aufstiegen in die Zielschicht innerhalb des Prognosezeitraums (bis zu 240 Monate)."
 eu5ab_prediction_unavailable_short_desc: "Ohne verlässliche Prognose wird streng konservativ mit derzeit freien Arbeitern gerechnet."
 eu5ab_native_input_section_title: "Präferenz für lokale Inputs"
 eu5ab_native_input_short_desc: "Wertet Gebäude auf, deren Rohstoffe in derselben Provinz vorkommen."
 eu5ab_native_input_priority_label: "Priorität lokaler Inputs"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Priorität lokaler Inputs: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Präferenz für lokale Rohstoffe\nLokal bezieht sich auf die Provinz des Gebäudes. Das System prüft die für das Rezept benötigten Rohstoffe und gewährt einen Rangfolgen-Bonus, wenn entsprechende RGs in der Provinz existieren; Rohstoffe mit höherem Anteil am Rezept erhalten einen größeren Bonus.\n• 0 ignoriert lokale Rohstoffe, 5 ist die Standardempfehlung und 10 verleiht maximales Gewicht.\n• Diese Einstellung beeinflusst nur Rangfolgenwerte; der tatsächliche Bau unterliegt weiterhin Rohstoffmängeln, Gewinnen, Arbeitskräften und Spielregeln.\n• Prüft nur die Existenz einer entsprechenden RG, nicht deren Stufe oder Produktion.\n• Rohstoffknappheit, geringer Marktzugriff oder geringe Kontrolle verringern den Bonus. RGs selbst erhalten diesen Bonus nicht. Die Schätzung verwendet zulässige Produktionsmethoden; Produktionsmethoden werden nicht automatisch gewechselt."
 eu5ab_price_section_title: "Preisspanne"
 eu5ab_price_short_desc: "Filtert und ordnet Produktionsgebäude nach Marktpreis."
 eu5ab_price_min_label: "Mindestpreis"
 eu5ab_price_max_label: "Hochpreisreferenz"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Preise nutzen den Basispreis als 100 %. Niedrige Preise verringern die Priorität; pausieren Sie den Bau, wenn alle Erträge beim oder unter dem Mindestwert liegen. Mehrfache Erträge werden nach Menge und Basispreis gewichtet. Hochpreisboni hören beim Referenzwert auf zu steigen; hohe Preise blockieren den Bau nicht. Gebäude ohne Warendirektausstoß sind ausgenommen. Die Nahrungssicherung greift wie konfiguriert."
 eu5ab_active_cash_value: "Schatzkammerreserve: [GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Mindestpreis: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Hochpreisreferenz: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Mindestpreis: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Hochpreisreferenz: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Regeln für automatisierten Bau"
 eu5ab_prediction_diagnostics_title: "Arbeitskräfteschätzung und Baustatus"
 eu5ab_prediction_section_body: "Ordnet Aufwertungen, gewöhnliche Erweiterungen, RG-Ausbauten und Neubauten in der gewählten Automatischen Baureihenfolge an und versucht zuerst geeignete Projekte des aktuellen Typs.\nWenn aktive Nahrungssicherungen greifen, haben relevante Nahrungsprojekte Vorrang und Rendite-, Preis- oder andere Grenzen werden wie konfiguriert gelockert. Aktive Sicherungen für Baumaterialien, Kriegsgüter oder strategische Rohstoffe können ebenfalls Renditeanforderungen lockern.\nBudget, Schatzkammerreserve sowie anwendbare Rohstoff-, Arbeitskräfte-, Baukapazitäts- und Grundspiel-Bauanforderungen gelten weiterhin. Es wird nur die neueste freigeschaltete Stufe gewöhnlicher Gebäude berücksichtigt; Aufwertungen zählen nur neu geschaffene Arbeitsplätze."
 eu5ab_diagnostics_title: "Status des automatisierten Baus"
 eu5ab_diagnostics_snapshot_note: "Einstellungen werden sofort gespeichert. Berichte werden mit fortschreitender Prüfung und Baubeginn aktualisiert und behalten die Ergebnisse danach bei."
 eu5ab_diagnostics_snapshot_help: "Der Bericht wird mit fortschreitender Prüfung und Baubeginn aktualisiert und behält die Ergebnisse bis zur nächsten Runde bei. Projekte werden ab dem 23. eingeleitet, sodass sich Anzahl und Ausgaben schrittweise ändern können. Einige Ergebnisse bleiben ausstehend, bis die Prüfungen abgeschlossen sind."
