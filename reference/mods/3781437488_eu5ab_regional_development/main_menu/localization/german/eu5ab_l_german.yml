 eu5ab_diag_result_help: "Wenn aktive Nahrungssicherungen greifen, haben Nahrungsprojekte Vorrang. Andere Projekte folgen der Automatischen Baureihenfolge und prüfen Alternativen, falls ein Projekt nicht starten kann.\nRG werden nach Engpässen, Preisen, Beschäftigung und strategischem Bedarf bewertet, vorbehaltlich der Bauanforderungen des Grundspiels.\nNur erfolgreiche Baustarts verbrauchen Budget und Bauplätze. Nach der Runde warten Orte mit neuen Projekten 3 Monate vor weiteren Bauvorhaben."
 eu5ab_diag_rgo_title: "RG-Kandidatenprüfungen"
 eu5ab_diag_rgo_short_desc: "Jeder Ort verzeichnet ein Ergebnis; eine Ablehnung zählt beim ersten gefundenen Grund."
 eu5ab_diag_rgo_help: "Zeigt die letzte RG-Ausbauprüfung. Bestehende Arbeitsplätze müssen voll besetzt sein. „Bevölkerung berücksichtigen“ prognostiziert neue Arbeitskräfte; „Entspannt“ nicht. Preise, noch nicht realisierte Produktionssteigerungen und akuter Arbeitskräftemangel beeinflussen die Priorität. Produktionssteigerungen werden für eigene Projekte derselben Ware auf demselben Markt zusammengefasst; unvollständige Zahlen zeigen nur bekannte Beträge. Das Erreichen des Limits pausiert neue Baustarts, nicht bestehende Projekte."
