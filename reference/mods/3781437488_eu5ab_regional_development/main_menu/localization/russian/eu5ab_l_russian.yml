 eu5ab_template_intro_title: "Редактор шаблонов"
 eu5ab_automation_buildings_intro: "Пользовательские шаблоны позволяют настраивать приоритеты зданий и назначать районы. Встроенные шаблоны имеют фиксированные приоритеты; скопируйте один как пользовательский шаблон, чтобы редактировать их."
 eu5ab_player_templates_button: "Шаблоны игрока"
 eu5ab_copy_preset_to_player_button: "Скопировать как шаблон игрока"
 eu5ab_delete_template_button: "Удалить шаблон"
 eu5ab_delete_template_tooltip: "Удалить этот пользовательский шаблон. Использующие его районы также потеряют назначение."
 eu5ab_delete_template_confirm_prompt: "Удалить текущий шаблон?"
 eu5ab_delete_template_confirm_button: "Подтвердить удаление"
 eu5ab_delete_template_confirm_tooltip: "Безвозвратно удалить этот шаблон и снять его со всех назначенных районов. Это действие нельзя отменить."
 eu5ab_delete_template_cancel_button: "Отмена"
 eu5ab_delete_template_cancel_tooltip: "Отменить удаление и вернуться к действиям с шаблоном."
 eu5ab_pause_template_button: "Приостановить шаблон"
 eu5ab_resume_template_button: "Возобновить шаблон"
 eu5ab_template_paused_badge: " (Приостановлен)"
 eu5ab_pause_template_tooltip: "Приостановить или возобновить этот шаблон. Приоритеты и назначения районов сохраняются, но автоматическое строительство пропускает эти районы во время паузы."
 eu5ab_select_template_tooltip: "Выберите этот шаблон и просмотрите подробности его правил."
 eu5ab_preset_readonly_desc: "Встроенные шаблоны имеют фиксированные приоритеты; их можно отдельно приостанавливать, возобновлять или назначать. Скопируйте один как пользовательский шаблон для редактирования приоритетов. Общие правила находятся в настройках модов CMF."
 eu5ab_template_name_pencil_hint: "Название шаблона"
 eu5ab_template_name_click_hint: "Нажмите на название, чтобы переименовать"
 eu5ab_template_name_click_tooltip: "Введите новое название текущего шаблона."
 eu5ab_template_rename_desc: "Введите новое название текущего шаблона длиной до 42 символов."
 eu5ab_template_rename_input: "Название шаблона"
 eu5ab_template_rename_accept: "Подтвердить"
 eu5ab_template_rename_cancel: "Отмена"
 eu5ab_target_location_title: "Целевой район"
 eu5ab_target_location_desc: "Выберите район, прежде чем очищать его настройки или прекращать обновления от шаблона провинции. Для назначения шаблона используйте кнопки выбора на соответствующей карточке."
 eu5ab_template_editor_desc: "Настройте приоритеты зданий и область применения этого шаблона. Общие для всей страны правила бюджета, рынка, рабочей силы и безопасности строительства задаются в настройках мода Community Mod Framework."
 eu5ab_template_auto_save_hint: "Изменения сохраняются сразу. Закройте окно, чтобы вернуться."
 eu5ab_rules_tab_finance: "Финансы и строительство"
 eu5ab_rules_tab_automation: "Рабочая сила и строительные предпочтения"
 eu5ab_rules_tab_diagnostics: "Отчёт о строительстве"
 eu5ab_template_editor_sections_title: "Настройки шаблона"
 eu5ab_template_editor_sections_desc: "Каждый шаблон хранит состояние, область применения и приоритеты зданий. Последний месячный результат показан в отчёте о строительстве."
 eu5ab_open_buildings_editor_button: "Правила строительства"
 eu5ab_open_rules_editor_button: "Отчёт о строительстве"
 eu5ab_edit_template_button: "Изменить"
 eu5ab_copy_to_slot_button: "Копировать сюда"
 eu5ab_policy_section_title: "Правила шаблона"
 eu5ab_cash_section_title: "Резерв казны"
 eu5ab_cash_short_desc: "Минимальная сумма, которая должна остаться в казне."
 eu5ab_cash_label: "Резерв казны"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] золота"
 eu5ab_cash_help: "Перед началом строительства расчетные затраты на этот и другие запланированные проекты должны оставлять достаточно золота для резерва.\nПри 1050 золота и резерве 1000 проект с расчетной стоимостью 100 не сможет начаться. Фактические затраты на добычу ресурсов могут отличаться от расчетов. Также должен оставаться остаток годового бюджета."
 eu5ab_budget_section_title: "Годовой строительный бюджет"
 eu5ab_budget_short_desc: "Выберите фиксированную сумму или годовой лимит на основе общего месячного дохода."
 eu5ab_budget_mode_fixed: "Фиксированный бюджет"
 eu5ab_budget_mode_income: "Связан с доходом"
 eu5ab_budget_multiplier_4: "×4 Осторожный"
 eu5ab_budget_multiplier_6: "×6 Рекомендуемый"
 eu5ab_budget_multiplier_8: "×8 Активный"
 eu5ab_budget_effective_label: "Бюджет текущего года"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] золота"
 eu5ab_budget_label: "Годовой бюджет"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] золота/год"
 eu5ab_budget_cash_comparison: "Годовой строительный бюджет задает плановые расходы; резерв казны определяет, сколько золота нужно сохранить. Последний проект может превысить остаток бюджета, но обязан пройти проверку резерва."
 eu5ab_budget_reset_note: "Сбрасывается при первой проверке нового года; фактические траты списываются только после начала строительства. Изменение бюджета не стирает учтенные расходы."
 eu5ab_budget_help: "Обычные здания и расширение добычи ресурсов делят общий годовой бюджет: фиксированную сумму или 4-, 6- либо 8-кратный общий месячный доход. Он сбрасывается при первой проверке нового года; изменение в течение года сохраняет уже учтенные расходы.\nЗасчитываются только успешные запуски по их фактической стоимости. Последний проект может превысить остаток бюджета; после этого новые проекты не добавляются. Требования к резерву казны по-прежнему действуют."
 eu5ab_quota_section_title: "Лимит одновременного строительства этого мода"
 eu5ab_quota_short_desc: "Задает число гражданских строек, которые мод может вести одновременно сверх базовой ячейки."
 eu5ab_hard_cap_label: "Дополнительные одновременные проекты"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] проектов (общий лимит равен этому значению + 1)"
 eu5ab_quota_help: "Настройте дополнительные слоты сверх первого проекта: 0 разрешает 1 одновременный проект; 599 разрешает 600. Обычные здания и проекты добычи ресурсов делят этот лимит. Учитываются только незавершенные проекты этого мода; ручное строительство, дороги и другие моды не учитываются. Каждый раунд заполняет только свободные места. Район может получить несколько проектов при наличии места, затем ожидает 3 месяца после раунда перед назначением новых."
 eu5ab_template_cash_value: "Резерв казны: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
