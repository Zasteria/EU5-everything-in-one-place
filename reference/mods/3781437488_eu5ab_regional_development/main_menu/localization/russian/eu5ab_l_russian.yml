 eu5ab_diag_result_help: "При активной защите от нехватки пищи продовольственные проекты идут первыми. Прочие проекты следуют Автоматическому порядку строительства, проверяя альтернативы при невозможности старта.\nПроекты добычи ресурсов оцениваются по дефициту, ценам, занятости и стратегическим нуждам с соблюдением требований строительства игры.\nТолько успешные запуски расходуют бюджет и лимит строительства. После раунда районы с новыми проектами ждут 3 месяца перед следующим строительством."
 eu5ab_diag_rgo_title: "Проверки кандидатов добычи ресурсов"
 eu5ab_diag_rgo_short_desc: "Для каждого района записывается один результат; отказ относится к первой найденной причине."
 eu5ab_diag_rgo_help: "Показывает последнюю проверку расширения добычи ресурсов. Текущие места должны быть заполнены. Режим «С учётом населения» прогнозирует новых рабочих; «Облегчённый» — нет. Цены, еще не полученный прирост производства и текущая нехватка рабочих влияют на приоритет. Прирост выпуска суммируется для собственных проектов одного товара на одном рынке; неполные данные отображают только известные объемы. Достижение лимита приостанавливает новые запуски, а не текущие проекты."
