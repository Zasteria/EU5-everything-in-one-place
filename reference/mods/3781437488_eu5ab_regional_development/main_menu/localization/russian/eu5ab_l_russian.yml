 eu5ab_reset_decision: "Сбросить Advanced Auto Build"
 eu5ab_reset_decision_desc: "Сохранить шаблоны и настройки, снять назначения районов и сбросить записи о строительстве. Затем назначьте шаблоны заново."
 eu5ab_deep_decision: "Перепланировать строительство в стране на этот месяц"
 eu5ab_deep_decision_desc: "Заново оценить собственные районы с включенными шаблонами по всей стране, сохранить план на этот месяц и начать стройку с 23-го числа."
 eu5ab_open_confirmation: "Открыть подтверждение"
 eu5ab_reset_confirm: "Подтвердить сброс"
 eu5ab_reset_confirm_desc: "Сохранить шаблоны и настройки, но очистить назначения районов, планы, периоды ожидания, отчёты, рекомендации, а также записи о проектах и годовых расходах. Потраченное золото не возвращается; начатое строительство продолжается. Затем назначьте шаблоны заново.\nПосле смены страны замените её шаблоны и настройки сохранёнными до переключения."
 eu5ab_deep_confirm_desc: "Повторно проверить собственные районы с включенными шаблонами и заменить невыполненный план на этот месяц. Использует текущую стратегию, защиту от нехватки пищи и порядок строительства; последний проект может превысить остаток бюджета.\nДля крупных государств это может занять время; окно нельзя закрыть до завершения планирования. Последующие изменения настроек не повлияют на этот план. Строительство начинается с 23-го числа; со следующего месяца вернутся обычные проверки."
 eu5ab_decision_continue: "Продолжить и рассчитать"
 eu5ab_decision_cancel: "Отмена"
 eu5ab_decision_done: "Готово"
 eu5ab_deep_event_finish: "Готово"
 eu5ab_deep_event_cancel: "Отмена"
 eu5ab_manual_before_23: "Следует использовать до 23-го числа (1–22 дни)"
 eu5ab_manual_not_dispatched: "Распоряжения о строительстве на этот месяц ещё не отданы"
 eu5ab_manual_waiting: "Подготовка плана строительства на этот месяц. Пожалуйста, подождите; окно можно закрыть после завершения."
 eu5ab_manual_rgo: "Расширение добычи ресурсов"
 eu5ab_manual_expired: "Наступил новый игровой месяц. Этот невыполненный план устарел; обычное планирование возобновлено."
 eu5ab_manual_results: "План на этот месяц сохранён.\nЗапланировано проектов: [Player.MakeScope.ScriptValue('eu5ab_manual_count_ui')|0]\nОжидаемые расходы: [Player.MakeScope.ScriptValue('eu5ab_manual_cost_ui')|2]\nСтроительство организуется с 23-го числа. Значение 0 означает отсутствие подходящих проектов."
 eu5ab_reset_decision.title: "Сбросить Advanced Auto Build"
 eu5ab_reset_decision.desc: "Сохранить шаблоны и настройки, снять назначения районов и сбросить записи о строительстве. Затем назначьте шаблоны заново."
 eu5ab_deep_decision.title: "Перепланировать строительство в стране на этот месяц"
 eu5ab_deep_decision.desc: "Заново оценить собственные районы с включенными шаблонами по всей стране, сохранить план на этот месяц и начать стройку с 23-го числа."
