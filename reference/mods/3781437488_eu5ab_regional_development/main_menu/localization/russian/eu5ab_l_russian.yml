 eu5ab_prediction_section_title: "Правила автоматизированного строительства"
 eu5ab_prediction_diagnostics_title: "Оценка рабочей силы и состояние строительства"
 eu5ab_prediction_section_body: "Распределяет улучшения, обычные расширения, расширения добычи ресурсов и новые здания в выбранном Автоматическом порядке строительства, сначала проверяя подходящие проекты текущего типа.\nПри срабатывании активной защиты от нехватки пищи соответствующие продовольственные проекты идут первыми, а требования окупаемости, цен и прочие ограничения смягчаются согласно настройке. Включенная защита для стройматериалов, военного снабжения или стратегического сырья также может смягчать требования доходности.\nТребования бюджета, резерва казны, а также ресурсов, рабочей силы, вместимости зданий и условий игры продолжают действовать. Рассматривается только последний открытый уровень обычных зданий; улучшения учитывают только добавленные рабочие места."
 eu5ab_diagnostics_title: "Состояние автоматического строительства"
 eu5ab_diagnostics_snapshot_note: "Настройки сохраняются мгновенно. Отчёты обновляются по мере проверок и начала проектов, сохраняя результаты после завершения."
 eu5ab_diagnostics_snapshot_help: "Отчёт обновляется по мере проверок и начала строительства, сохраняя результаты до следующего раунда. Проекты назначаются с 23-го числа, поэтому их количество и расходы могут меняться постепенно. Часть результатов остается в ожидании до завершения проверок."
