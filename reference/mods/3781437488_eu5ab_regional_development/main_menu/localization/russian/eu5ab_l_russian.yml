 eu5ab_native_input_priority_value: "Приоритет местного сырья: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Приоритет местного сырья\nМестное сырье относится к провинции, где расположено здание. Система проверяет сырье, требуемое рецептом, и дает бонус к рейтингу, если в провинции существуют соответствующие постройки добычи ресурсов; сырье с большей долей в рецепте дает больший бонус.\n• 0 игнорирует местное сырье, 5 — значение по умолчанию, 10 дает максимальный вес.\n• Настройка влияет только на рейтинг; фактическое строительство зависит от наличия ресурсов, прибыли, рабочей силы и условий игры.\n• Проверяет только наличие соответствующей постройки добычи ресурсов, а не ее уровень или выработку.\n• Дефицит ресурсов, низкий доступ к рынку или слабый контроль снижают бонус. Сами постройки добычи ресурсов этот бонус не получают. Оценка основана на доступных методах производства; методы производства автоматически не переключаются."
 eu5ab_price_section_title: "Диапазон цен"
 eu5ab_price_short_desc: "Фильтрует и ранжирует производственные здания по рыночной цене."
 eu5ab_price_min_label: "Минимальная цена"
 eu5ab_price_max_label: "Ориентир высокой цены"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Цены используют базовую цену как 100%. Низкие цены снижают приоритет; строительство приостанавливается, если весь выпуск на уровне минимума или ниже. Несколько видов продукции взвешиваются по объему и базовой цене. Бонусы за высокую цену перестают расти при достижении ориентира; высокие цены не блокируют стройку. Здания без выпуска товаров освобождены. Защита от нехватки пищи применяется согласно настройке."
