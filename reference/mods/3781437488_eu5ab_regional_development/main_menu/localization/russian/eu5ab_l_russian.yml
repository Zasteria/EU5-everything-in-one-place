 eu5ab_rgo_short_desc: "Текущие места должны быть заполнены. По умолчанию «Облегчённый»; выберите «С учётом населения» для прогноза рабочих на новые места."
 eu5ab_rgo_help: "Существующие рабочие места в добыче ресурсов должны быть полностью заполнены. Режим по умолчанию «Облегчённый» не прогнозирует новых рабочих; «С учётом населения» требует, чтобы за выбранный период ожидалось достаточно рабочих.\nЦены на уровне минимума или ниже приостанавливают расширение. Низкие цены снижают приоритет, а высокие — повышают. Проекты с оценкой ниже 0 не начинаются.\nСобственные обычные здания и проекты добычи ресурсов, производящие один товар на одном рынке, делят общий лимит расширения. Он включает еще не полученный прирост выпуска от текущих или завершенных проектов и учитывает новую потребность в сырье от запланированных строек. Дальнейшее строительство становится менее предпочтительным по мере приближения ожидаемого прироста к дефициту спроса плюс 10% от спроса. Новые запуски приостанавливаются при достижении этого объема. Последний уровень может превысить его; начатые проекты продолжаются.\nОтключение защиты рабочей силы останавливает прогнозы, но текущая нехватка по-прежнему снижает приоритет. Включенная защита от нехватки пищи может отдавать приоритет нужным проектам добычи ресурсов и снимать ограничения по ценам и расширению. Полная занятость на существующих местах и применимые требования рабочей силы, бюджета и условий игры продолжают действовать."
 eu5ab_workforce_help: "Обычные здания по умолчанию используют прогноз на 12 месяцев; проекты добычи ресурсов в режиме «С учётом населения» — 180 месяцев. Оценки используют текущую скорость продвижения, местные и государственные модификаторы, «Обилие возможностей», грамотность и подходящее население. Миграция, меняющиеся темпы и конкурирующие профессии могут повлиять на результат.\nОтключение защиты рабочей силы останавливает прогнозы. Текущая нехватка снижает приоритет без изменения прогнозируемой прибыли; защита от нехватки пищи действует согласно настройке."
