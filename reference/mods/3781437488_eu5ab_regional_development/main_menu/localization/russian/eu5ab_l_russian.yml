 eu5ab_building_rules_title: "Правила зданий"
 eu5ab_building_rules_desc: "В первой строке фильтруйте по рабочей силе, во второй — по эпохе открытия. Приоритеты от 0,0 до 10,0; 0 запрещает строительство. На странице особых зданий показаны только те, которые страна может построить хотя бы в одном своем районе."
