 eu5ab_regional_development__governors_name: "Рекомендации губернаторов"
 eu5ab_regional_development__governors__recommendations_name: "Рекомендации и обновление"
 eu5ab_regional_development__governors__recommendations_desc: "Анализирует варианты для домов местных и морских губернаторов без автоматического строительства, сноса или переноса зданий."
 eu5ab_regional_development__governors__scoring_name: "Настройки оценки"
 eu5ab_regional_development__governors__scoring_desc: "Выберите способ оценки ценности районов и решите, учитывать ли ограниченную стратегическую ценность."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Включить рекомендации губернаторов"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Периодически предлагать места для местных и морских губернаторов. Отключение сохраняет последние результаты, но убирает оповещения с рекомендациями."
 eu5ab_regional_development__governor_refresh_interval_name: "Интервал обновления"
 eu5ab_regional_development__governor_refresh_interval_desc: "Задайте интервал обновления. Некоторые изменения территории, столицы, ранга района и формы правления вызывают досрочное обновление. Дороги и другие изменения близости учитываются в плановых проверках."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "Каждый месяц"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "Обновляется быстрее всего и подходит для небольших стран. Частые проверки могут вызывать более заметные задержки в крупных странах."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "Каждые 3 месяца"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Баланс между скоростью реакции на дорожные изменения и производительностью крупных держав."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "Каждые 6 месяцев"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Сниженная частота перерасчета для крупных держав."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "Каждые 12 месяцев"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "Минимальная нагрузка, но отражение изменений дорог и близости может занять до одного года."
 eu5ab_regional_development__governor_refresh_now_name: "Пересчитать сейчас"
 eu5ab_regional_development__governor_refresh_now_text: "Пересчитать сейчас"
 eu5ab_regional_development__governor_refresh_now_desc: "Пересчитать рекомендации для местных и морских резиденций прямо сейчас, даже во время паузы. В крупных странах возможны кратковременные задержки."
 eu5ab_regional_development__governor_scoring_profile_name: "Профиль ценности района"
 eu5ab_regional_development__governor_scoring_profile_desc: "Балансирует вес налоговой базы, населения и развития. Оценки рассчитываются на основе ценности районов и ожидаемого улучшения близости, а не итогового контроля; текущий контроль не прибавляется и не вычитается."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Смешанный"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Баланс между экономической и административно-демографической ценностью."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Экономика"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Упор на потенциальную налоговую базу и сложившийся масштаб экономики."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "Администрация и население"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Упор на население и развитие."
 eu5ab_regional_development__governor_strategic_value_name: "Учитывать стратегическую ценность"
 eu5ab_regional_development__governor_strategic_value_desc: "Дает ограниченный вес портам, приграничным и укрепленным районам. Это влияет только на ценность района и не является отдельным компонентом оценки."
 eu5ab_governor_window_title: "Подробности рекомендаций губернаторов"
 eu5ab_governor_window_intro: "Просматривайте рекомендации по новым районам и переносу. Изменения в постройках остаются на ваше усмотрение."
 eu5ab_governor_road_tier_help: "Оценки используют высший открытый уровень дорог; фактический прирост может отличаться.\nКаждый план фиксирует другой тип резиденции. Пересчитайте после изменений; приросты не суммируются."
 eu5ab_governor_refresh_button: "Пересчитать"
 eu5ab_governor_refresh_button_tt: "Заново оценить новые места, перенос и размещение резиденций местных и морских губернаторов. В больших странах возможна кратковременная пауза; при неполной проверке появится уведомление."
 eu5ab_governor_local_section: "Дом местного губернатора"
 eu5ab_governor_local_diagnostics: "Последний расчет местных резиденций: этап [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0], статус [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0]; вместимость [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0], подсчет движка: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0] резиденций местных губернаторов и [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0] лейтенантств; другие занятые слоты [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0].\nПодсчет по районам: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0] резиденций местных губернаторов и [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0] лейтенантств; другие занятые слоты [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0]; свободные слоты (движок/район) [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0]; расхождение [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0] (1 означает расхождение).\nПорог выгоды для нового места [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1]; районы-кандидаты [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0], оцененные районы [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]."
 eu5ab_governor_naval_section: "Дом морского губернатора"
 eu5ab_governor_naval_diagnostics: "Последний расчет морских резиденций: статус [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_status_ui')|0]; обновлений [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_runs_ui')|0]."
 eu5ab_governor_new_slot_state: "Доступен свободный слот. Вы можете построить резиденцию губернатора в одном из этих районов."
 eu5ab_governor_empty_title: "Подходящих вариантов не найдено"
 eu5ab_governor_no_recommendation: "#weak Пересчитайте после развития вашей территории или городов.#!"
 eu5ab_governor_candidate_1: "Ранг 1"
 eu5ab_governor_candidate_2: "Ранг 2"
 eu5ab_governor_candidate_3: "Ранг 3"
 eu5ab_governor_view_location: "Показать район"
 eu5ab_governor_view_location_tt: "Переместить камеру карты к этому району."
 eu5ab_governor_local_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1').GetLocation.GetName]"
 eu5ab_governor_local_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2').GetLocation.GetName]"
 eu5ab_governor_local_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "Общий счет [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Прирост от улучшения близости в самой резиденции [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Прирост от улучшения близости окрестностей [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nОжидается улучшение близости в [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] районах (включая сам район резиденции).\nОценка рассчитывается умножением ценности районов на ожидаемый рост близости, а не является итоговым контролем; текущий контроль не прибавляется и не вычитается, а реальный контроль продолжает развиваться по стандартным правилам игры."
 eu5ab_governor_local_candidate_2_breakdown: "Общий счет [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Прирост от улучшения близости в самой резиденции [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Прирост от улучшения близости окрестностей [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nОжидается улучшение близости в [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] районах (включая сам район резиденции).\nОценка рассчитывается умножением ценности районов на ожидаемый рост близости, а не является итоговым контролем; текущий контроль не прибавляется и не вычитается, а реальный контроль продолжает развиваться по стандартным правилам игры."
 eu5ab_governor_local_candidate_3_breakdown: "Общий счет [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Прирост от улучшения близости в самой резиденции [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Прирост от улучшения близости окрестностей [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nОжидается улучшение близости в [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] районах (включая сам район резиденции).\nОценка рассчитывается умножением ценности районов на ожидаемый рост близости, а не является итоговым контролем; текущий контроль не прибавляется и не вычитается, а реальный контроль продолжает развиваться по стандартным правилам игры."
 eu5ab_governor_naval_candidate_1_breakdown: "Общий балл [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = Прирост досягаемости района [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Прирост досягаемости окружения [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nОжидается улучшение досягаемости в [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] районах (включая сам район).\nБаллы рассчитываются умножением ценности районов на ожидаемый рост досягаемости и не являются итоговым значением контроля; текущий контроль не влияет на баллы, а реальный контроль будет меняться в зависимости от максимального контроля и механик игры."
 eu5ab_governor_naval_candidate_2_breakdown: "Общий балл [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = Прирост досягаемости района [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + Прирост досягаемости окружения [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\nОжидается улучшение досягаемости в [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] районах (включая сам район).\nБаллы рассчитываются умножением ценности районов на ожидаемый рост досягаемости и не являются итоговым значением контроля; текущий контроль не влияет на баллы, а реальный контроль будет меняться в зависимости от максимального контроля и механик игры."
 eu5ab_governor_naval_candidate_3_breakdown: "Общий балл [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = Прирост досягаемости района [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + Прирост досягаемости окружения [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\nОжидается улучшение досягаемости в [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] районах (включая сам район).\nБаллы рассчитываются умножением ценности районов на ожидаемый рост досягаемости и не являются итоговым значением контроля; текущий контроль не влияет на баллы, а реальный контроль будет меняться в зависимости от максимального контроля и механик игры."
 eu5ab_governor_migration_threshold: "Порог прироста при переносе: Местные [GetPlayer.MakeScope.GetVariable('eu5ab_global_governor_migration_threshold_percent').GetValue|0]%; Морские [GetPlayer.MakeScope.GetVariable('eu5ab_global_naval_governor_migration_threshold_percent').GetValue|0]%."
