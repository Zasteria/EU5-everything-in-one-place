 eu5ab_regional_development__finance_name: "Финансы и рынок"
 eu5ab_regional_development__automation_name: "Безопасность и рейтинг"
 eu5ab_regional_development__performance_name: "Оптимизация производительности"
 eu5ab_regional_development__performance__preset_name: "Предустановка производительности"
 eu5ab_regional_development__performance__preset_desc: "Предустановки меняют параметры ниже. Ручное изменение расширенного параметра переключает на «Пользовательский»; новые значения действуют со следующей проверки."
 eu5ab_regional_development__performance__advanced_name: "Расширенные настройки"
 eu5ab_regional_development__performance__advanced_desc: "Настройте ежедневные проверки районов, новые проекты за раунд и число альтернатив. Проверка большего числа проектов может занять больше времени."
 eu5ab_regional_development__general__limits_name: "Управление и одновременный лимит"
 eu5ab_regional_development__general__limits_desc: "Управляет работой мода и общим лимитом одновременно возводимых им гражданских проектов."
 eu5ab_regional_development__general__returns_name: "Доходность и экстренные исключения"
 eu5ab_regional_development__general__returns_desc: "Задайте минимальную доходность обычных зданий и возможность отмены при нехватке продовольствия, стройматериалов, военных товаров или стратегических ресурсов."
 eu5ab_regional_development__finance__budget_name: "Общий годовой бюджет"
 eu5ab_regional_development__finance__budget_desc: "Все шаблоны, здания и проекты добычи ресурсов используют единый национальный годовой бюджет."
 eu5ab_regional_development__finance__market_name: "Диапазон рыночных цен"
 eu5ab_regional_development__finance__market_desc: "Задайте общие проценты минимальной и высокой цены относительно базовой."
 eu5ab_regional_development__automation__safety_name: "Правила безопасного строительства"
 eu5ab_regional_development__automation__safety_desc: "Общие правила для особых зданий, источников сырья, рабочей силы и нехватки ресурсов."
 eu5ab_regional_development__automation__rgo_name: "Расширение добычи ресурсов"
 eu5ab_regional_development__automation__workforce_name: "Прогноз рабочей силы"
 eu5ab_regional_development__automation__workforce_desc: "Настраивает максимальный горизонт прогнозирования будущей рабочей силы."
 eu5ab_regional_development__automation__ranking_name: "Стратегия выбора строительства"
 eu5ab_regional_development__automation__ranking_desc: "Выберите стратегию обычных зданий, порядок улучшений, обычных расширений, расширений добычи ресурсов и новых строек, а также влияние местного сырья."
 eu5ab_regional_development__candidate_ranking_mode_name: "Стратегия обычных зданий"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Пробовать другие проекты"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Если ведущие проекты текущего типа не могут начаться, проверять альтернативы с более низким рейтингом. Каждый район получает до 2 дополнительных попыток за раунд при планировании спроса и предложения или 5 при выборе по прогнозируемой прибыли, разделяемых между обычными типами. Прекращается, как только там начнется обычное здание. Загрузка сохранения не восстанавливает попытки. Все требования сохраняются. По умолчанию выключено; вступает в силу в следующем раунде и может увеличить время проверки."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Выберите способ приоритизации подходящих обычных зданий. Защита от нехватки пищи и Автоматический порядок строительства имеют приоритет. Проекты добычи ресурсов оцениваются отдельно по дефициту, ценам, занятости и стратегическим нуждам."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Спрос и предложение"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Ранжирует проекты по рыночному дефициту, стратегической потребности, эффективности рецептов, местным ресурсам, ценам и риску рабочей силы, отдавая предпочтение полным цепочкам и долгосрочной стабильности."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Прогнозируемая прибыль"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Фильтрует кандидатов по правилам шаблона и безопасности, отдавая приоритет расчетной ежемесячной чистой выгоде с учетом мельниц и амбаров. При близких значениях выгоды приоритеты шаблона служат вторичным критерием."
 eu5ab_regional_development__automation__candidate_priority_name: "Порядок автоматического строительства"
 eu5ab_regional_development__automation__candidate_priority_desc: "Перетащите четыре типа в желаемом порядке. Мод проверяет все возможные проекты текущего типа перед переходом к следующему; если проект нельзя начать, ищет замену в той же категории. При продовольственном кризисе еда строится первой, но строго по этому порядку."
 eu5ab_regional_development__candidate_priority_name: "Порядок автоматического строительства"
 eu5ab_regional_development__candidate_priority_desc: "Перетащите, чтобы упорядочить улучшения, обычные расширения, расширения добычи ресурсов и новые здания."
 eu5ab_regional_development__candidate_priority_item_column_name: "Тип строительства"
 eu5ab_regional_development__candidate_priority_i1_name: "Улучшать здания"
 eu5ab_regional_development__candidate_priority_i1_desc: "Заменить устаревшее здание новейшим открытым уровнем его цепочки."
 eu5ab_regional_development__candidate_priority_i2_name: "Расширять существующие здания"
 eu5ab_regional_development__candidate_priority_i2_desc: "Добавить уровень существующему обычному зданию, без замен и проектов добычи ресурсов."
 eu5ab_regional_development__candidate_priority_i3_name: "Расширять добычу ресурсов"
 eu5ab_regional_development__candidate_priority_i3_desc: "Расширяет местную добычу ресурсов; требует полной занятости на текущих местах и соблюдения правил цен, годового строительного бюджета и резерва казны."
 eu5ab_regional_development__candidate_priority_i4_name: "Строить новые здания"
 eu5ab_regional_development__candidate_priority_i4_desc: "Построить с нуля обычное здание, которого ещё нет в районе."
 eu5ab_regional_development__enabled_name: "Включить автоматическое строительство"
 eu5ab_regional_development__enabled_desc: "Включить или выключить ежемесячные проверки автоматического строительства. Шаблоны и назначения районов сохраняются при отключении."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Дополнительные одновременные проекты"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Число гражданских проектов, которые мод может вести одновременно сверх базовой ячейки. 0 означает всего 1 проект, 599 — 600 проектов; ручное строительство, дороги и другие моды не расходуют этот лимит."
 eu5ab_regional_development__budget_mode_name: "Режим годового бюджета"
 eu5ab_regional_development__budget_mode_desc: "Выберите фиксированную сумму или 4-, 6- либо 8-кратный общий месячный доход. Пересчитывается при первой проверке нового года; изменение настроек сохраняет уже учтенные расходы."
 eu5ab_regional_development__budget_mode_option_1_name: "Фиксированный годовой бюджет"
 eu5ab_regional_development__budget_mode_option_2_name: "Месячный доход ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Месячный доход ×6 (рекомендуется)"
 eu5ab_regional_development__budget_mode_option_4_name: "Месячный доход ×8"
 eu5ab_regional_development__economic_metric_name: "Экономический порог для обычных построек"
 eu5ab_regional_development__economic_metric_desc: "Обычные производственные здания должны отвечать выбранному условию: положительный прогнозируемый месячный доход или прибыль либо 5% годовой доходности. Фактическая доходность может меняться. Обычная общественная инфраструктура освобождена. Ветряным мельницам требуется положительный чистый прирост от дополнительного выпуска и 5% годовых в режимах нормы доходности. Амбары, построенные для уменьшения порчи, всегда требуют 5%. Проекты добычи ресурсов подчиняются отдельным правилам."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Месячный доход > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Начинать только при положительном прогнозе месячного дохода."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Месячная прибыль > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Начинать только при положительном прогнозе общей месячной прибыли."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Годовая доходность по доходу ≥ 5%"
 eu5ab_regional_development__economic_metric_option_3_desc: "Прогнозируемый месячный доход должен составлять не менее 5% от стоимости строительства, деленных на 12. Здесь сравнивается доход до вычета эксплуатационных расходов."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Годовая доходность по прибыли ≥ 5%"
 eu5ab_regional_development__economic_metric_option_4_desc: "Прогнозируемая месячная прибыль должна составлять не менее 5% от стоимости строительства, деленных на 12. Фактическая прибыль может меняться в зависимости от условий работы."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Продовольствие закончится: строить первым, игнорировать доходность"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Если продовольствие заканчивается, выполнять продовольственные проекты первыми и отменить доходность обычных продовольственных зданий. Порядок и прочие правила сохраняются."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Продовольствие 25% или меньше: строить первым, игнорировать доходность"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Когда запасы продовольствия на рынке падают до 25% и ниже, производство еды приоритетно и освобождается от порога доходности. Порядок строительства и правила безопасности сохраняются."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Снабжение стройматериалами ниже 65%: игнорировать доходность"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Если обеспеченность ключевым стройматериалом падает ниже 65%, производящие его здания освобождаются от проверки доходности. Все остальные правила строительства остаются в силе."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Военное снабжение в войну ниже 65%: игнорировать доходность"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Во время войны при обеспеченности военными товарами ниже 65% производящие их здания освобождаются от проверки доходности. Все прочие правила действуют."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Стратегическому производству не хватает ресурсов: игнорировать доходность поставщиков"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Если предложение сырья на рынке ниже 65% спроса и на том же рынке есть открытое отечественное здание, производящее продовольствие, основные стройматериалы или военные товары, которое потребляет это сырьё и испытывает нехватку ресурсов, производители этого сырья освобождаются от выбранного порога доходности. Здание-потребитель не обязательно должно прекратить производство, а недостающий ресурс не обязательно должен быть именно этим сырьём. Все остальные правила строительства сохраняются."
 eu5ab_regional_development__fixed_annual_budget_name: "Фиксированный годовой бюджет"
 eu5ab_regional_development__fixed_annual_budget_desc: "Используется только в фиксированном режиме; все шаблоны делят эту сумму."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Минимальный резерв казны"
 eu5ab_regional_development__min_cash_reserve_desc: "Сохранять этот резерв после вычета расчетных затрат на все запланированные проекты. Фактические расходы на добычу ресурсов могут отличаться."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Процент минимальной цены"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Процент высокой цены"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Разрешить особые здания"
 eu5ab_regional_development__allow_special_buildings_desc: "Разрешает учитывать особые здания; требования игры сохраняются."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Восполнять дефицит на рынке при свободных слотах строительства"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "После обычных проектов используйте свободные слоты строительства для устранения дефицита в собственных районах, проверенных в этом раунде на том же рынке. Учитывает потребность запланированных проектов в сырье и еще не реализованный прирост выпуска. Встроенные шаблоны могут добавлять незапланированные отрасли; запреты, пользовательский приоритет 0 и другие требования к строительству сохраняются."
 eu5ab_regional_development__auto_build_input_sources_name: "Строить источники сырья при дефиците"
 eu5ab_regional_development__auto_build_input_sources_desc: "Независимо проверять дефицит на рынке сырья и строить разрешенные предприятия верхнего звена, в том числе когда перерабатывающие фабрики полностью укомплектованы, но испытывают нехватку сырья."
 eu5ab_regional_development__pause_low_workforce_name: "Останавливать при нехватке рабочей силы"
 eu5ab_regional_development__stop_input_shortage_name: "Останавливать при нехватке критических ресурсов"
 eu5ab_regional_development__stop_input_shortage_desc: "Рыночное предложение необходимого ключевого промышленного сырья должно покрывать не менее 75% спроса перед началом связанного строительства."
 eu5ab_regional_development__allow_rgo_name: "Разрешить расширение добычи ресурсов"
 eu5ab_regional_development__allow_rgo_desc: "Разрешить всем шаблонам рассматривать расширение добычи ресурсов."
 eu5ab_regional_development__native_input_priority_name: "Приоритет местного сырья"
 eu5ab_regional_development__native_input_priority_desc: "0–10; более высокие значения отдают приоритет зданиям, перерабатывающим сырье из той же провинции."
 eu5ab_regional_development__performance_preset_name: "Предустановка производительности"
 eu5ab_regional_development__performance_preset_desc: "Предустановка синхронизирует расширенные параметры ниже. Пользовательская сохраняет текущие значения."
 eu5ab_regional_development__performance_preset_option_1_name: "Консервативный"
 eu5ab_regional_development__performance_preset_option_1_desc: "Проверяет до 10 районов в день и запускает не более 30 проектов за проход. Кандидаты планирования: 5; прибыли: 15. Останавливается, когда кандидатов достаточно."
 eu5ab_regional_development__performance_preset_option_2_name: "Разносторонность"
 eu5ab_regional_development__performance_preset_option_2_desc: "Проверяет до 20 районов в день и запускает не более 50 проектов за проход. Кандидаты планирования: 4; прибыли: 12. Останавливается, когда кандидатов достаточно."
 eu5ab_regional_development__performance_preset_option_3_name: "Максимальная производительность"
 eu5ab_regional_development__performance_preset_option_3_desc: "Для стран с большим числом районов. Проверяет до 30 районов в день без лимита за проход. Кандидаты планирования: 3; прибыли: 10. Останавливается, когда кандидатов достаточно."
 eu5ab_regional_development__performance_preset_option_4_name: "Пользовательский"
 eu5ab_regional_development__performance_preset_option_4_desc: "Использовать текущие расширенные настройки."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Много районов с шаблонами могут снизить производительность."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "В режиме максимальной производительности проверяется до 30 районов в день без лимита на цикл. Для огромных государств это может увеличивать время перехода месяца."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Спрос и предложение\" длится долго: снизьте \"Кандидатов планирования\"."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Только для «Спроса и предложения». Меньше кандидатов планирования сокращает число проектов на район и тип постройки для последующих проверок."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Последствие: меньше альтернатив, можно пропустить последующие доступные проекты."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Проекты проверяются по оценке планирования. Снижение лимита оставляет меньше альтернатив при отказе первых вариантов, что может привести к пропуску доступных построек."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Режим «Прогнозируемая прибыль» работает медленно: уменьшите «Кандидатов прибыли на район»."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Отображается только в режиме «Прогнозируемая прибыль». Уменьшите значение «Кандидатов прибыли на район», чтобы сократить количество альтернатив, проверяемых позже."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Меньшее число альтернатив может не оставить выбора, если ведущие проекты не смогут начаться."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Альтернативы сохраняются после ранжирования по прогнозируемой прибыли и предпочтениям строительства. Сохранение меньшего их числа оставляет меньше вариантов, если ведущие проекты не смогут начаться."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Также уменьшите число районов в день или добавлений за проход."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Меньшее число районов в день распределяет проверки на большее количество дней. Меньше добавлений за раунд сокращает проекты, назначаемые за раз. Значение 0 снимает ограничение на раунд."
 eu5ab_regional_development__parallel_location_scan_name: "Обрабатывать районы отдельно"
 eu5ab_regional_development__parallel_location_scan_desc: "Проверять районы по отдельности для уменьшения пауз либо вместе каждый день при отключении. Приоритеты, бюджет и порядок строительства остаются прежними. "
 eu5ab_regional_development__daily_location_task_limit_name: "Районов проверяется в день"
 eu5ab_regional_development__daily_location_task_limit_desc: "Максимальное количество районов, детально проверяемых каждый день. Меньшие значения означают меньше работы в день, но больше дней для охвата всей страны."
 eu5ab_regional_development__max_additions_per_run_name: "Максимум добавлений за запуск"
 eu5ab_regional_development__max_additions_per_run_desc: "Ограничивает число проектов, запускаемых за один цикл (от 0 до 600). Ноль означает без ограничений."
 eu5ab_regional_development__candidates_per_location_name: "Кандидатов планирования на район"
 eu5ab_regional_development__candidates_per_location_desc: "Действует только при «Планировании спроса и предложения». Для каждого района и категории обычного строительства задает число кандидатов, сохраняемых по оценке планирования для последующих проверок (3–30). Большее число снижает риск упустить варианты, но повышает нагрузку."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Кандидатов прибыли на район"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Только для выбора по прогнозируемой прибыли. Сохранять 3–30 альтернатив на район и тип обычного строительства, ранжированных по прогнозируемой прибыли и предпочтениям зданий. Больше альтернатив дает больше вариантов, если ведущие проекты не могут начаться, но может замедлить последующие проверки."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Остановить при достаточном числе кандидатов"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Остановить подробные проверки других районов, как только число альтернатив достигнет удвоенного количества проектов, которые можно добавить в этом раунде. Свободные места и Максимум добавлений за запуск определяют это число; 0 снимает только ограничение за раунд. Требования к строительству сохраняются."
 eu5ab_diagnostics_cmm_hint: "Измените общие правила в настройках модов Community Mod Framework. Отчёт о строительстве показывает последний автоматический результат."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "Увеличить на 10"
 eu5ab_cmm_shift_decrease_10: "Уменьшить на 10"
 eu5ab_cmm_shift_increase_1000: "Увеличить на 1000"
 eu5ab_cmm_shift_decrease_1000: "Уменьшить на 1000"
 eu5ab_cmm_shift_increase_max: "Установить максимум"
 eu5ab_cmm_shift_decrease_min: "Установить минимум"
 eu5ab_regional_development__automation__rgo_desc: "Рассматривать расширение добычи ресурсов после заполнения текущих мест. Выберите, прогнозировать ли рабочих для новых мест."
 eu5ab_regional_development__rgo_workforce_mode_name: "Режим рабочей силы добычи ресурсов"
 eu5ab_regional_development__rgo_forced_relaxed_name: "Режим добычи ресурсов: Облегчённый (Пауза из-за рабочей силы выкл.)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "Без прогноза рабочей силы. Текущие рабочие места должны быть заполнены; нехватка на новых местах лишь снижает приоритет строительства."
 eu5ab_regional_development__rgo_workforce_mode_desc: "По умолчанию «Облегчённый». Отключение защиты рабочей силы временно переводит в режим «Облегчённый» и снижает приоритет при текущей нехватке рабочих. Повторное включение восстанавливает выбранный режим. Существующие рабочие места всегда должны быть полностью заняты."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Облегчённый"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Следует общим правилам расширения базовой игры: после заполнения текущих мест оценивает цены, рыночные нужды и ожидаемый выпуск без прогнозирования новых рабочих. При включенной защите рабочей силы дефицит на новых местах не снижает приоритет."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "С учётом населения"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "После проверки полной занятости на текущих местах оценивает квалифицированные переходы классов за прогнозный срок. Приостанавливает стройку, если рабочих недостаточно для заполнения следующего уровня."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "Прогнозный горизонт населения добычи ресурсов (Месяцы)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "В режиме «С учётом населения» расширение требует, чтобы за этот срок ожидалось достаточно рабочих для заполнения новых мест. По умолчанию: 180 месяцев. Диапазон: 0–1200; ноль учитывает только доступных рабочих прямо сейчас. Оценка принимает во внимание «Обилие возможностей», грамотность и население, способное сменить профессию. Чем длиннее прогноз, тем сильнее он может отличаться от фактических данных. Клик изменяет на 1 месяц, удержание Ctrl — на 12 месяцев, Shift — на 120 месяцев."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "При включении обычным зданиям требуется достаточный прогноз рабочих; проекты добычи ресурсов используют выбранный режим. Выключение останавливает прогнозы и временно применяет режим «Облегчённый» для добычи ресурсов. Текущая нехватка снижает приоритет, не блокируя новые проекты сама по себе. Существующие рабочие места в добыче ресурсов по-прежнему должны быть полностью заняты. Повторное включение восстанавливает прежний режим добычи ресурсов."
 eu5ab_regional_development__job_fill_deadline_months_name: "Прогнозный горизонт рабочей силы для обычных зданий (Месяцы)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Независимый горизонт для обычных зданий: по умолчанию 12 месяцев, диапазон 0–240. Ноль учитывает только квалифицированных свободных рабочих прямо сейчас. Проекты добычи ресурсов с учетом населения используют собственный горизонт. Текущая скорость продвижения — это оценка, а не гарантия."
 eu5ab_regional_development__price_min_desc: "По умолчанию: 80% от базовой цены. Более низкие цены снижают приоритет. Приостановить строительство, если весь выпуск на уровне порога или ниже; несколько видов продукции взвешивать по объему и базовой цене. При 100% и выше применяется только порог. Включенная защита от нехватки пищи может снимать ценовые ограничения."
 eu5ab_regional_development__price_max_desc: "По умолчанию: 125%. Цены выше базовой постепенно повышают приоритет вплоть до ориентира. При ориентире 125% цена 112,5% дает 70 очков; 125% и более — 140. Если ориентир 100% или ниже, любая цена выше базовой дает 140 очков."
