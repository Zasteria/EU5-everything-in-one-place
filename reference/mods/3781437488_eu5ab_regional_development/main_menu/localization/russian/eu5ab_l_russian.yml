 eu5ab_diag_failure_help: "Причины отмены проектов\nПоказывает факторы блокировки, зафиксированные в ходе прошлой проверки; значения не суммируются между месяцами.\nОтдельно учитываются блокировки из-за нехватки рабочих, дефицита сырья, перепроизводства, нехватки годового бюджета, нехватки резерва казны, прибыли ниже нормы, дефицита стройматериалов и несоблюдения условий игры."
