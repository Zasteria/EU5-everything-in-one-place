 eu5ab_building_age_6: "Эпоха революций"
 eu5ab_status_enabled: "#G Включено#!"
 eu5ab_status_disabled: "#L Отключено#!"
 eu5ab_status_currently_available: "#G Доступно#!"
 eu5ab_operating_rules_title: "Правила строительства"
 eu5ab_operating_rules_short_desc: "Настройте особые здания, строительство источников сырья и нехватку ресурсов."
 eu5ab_operating_rules_help: "Особые здания должны отвечать требованиям разблокировки и строительства базовой игры.\nДефицит ресурсов может стимулировать постройку поставщиков, разрешенных шаблоном, даже если существующие предприятия полностью укомплектованы.\nПри включенной защите ресурсов снабжение ключевым промышленным сырьем должно покрывать 75% спроса. По возможности используются текущие методы производства, иначе оценивается доступный метод. Альтернативные методы оцениваются отдельно; методы производства не переключаются автоматически."
 eu5ab_rgo_section_title: "Добыча ресурсов"
 eu5ab_rgo_allow: "Разрешить этому шаблону расширять добычу ресурсов"
 eu5ab_toggle_special_buildings: "Разрешить особые здания"
 eu5ab_toggle_auto_build_input_sources: "Строить источники при нехватке ресурсов"
 eu5ab_toggle_pause_low_workforce: "Приостанавливать стройку при нехватке рабочих"
 eu5ab_ranking_mode_section_title: "Стратегия выбора строительства"
 eu5ab_town_rights_preference_desc: "Городские права и поддержка отрасли независимо добавляют до 500 очков планирования каждое. Поддержка отрасли распространяется только на прямое производство подходящих зданий в стимулируемой области с весом по базовым ценам рецепта; она не распространяется по цепочкам поставок. Оба бонуса суммируются с очками за местное сырьё. Режим прибыли использует эти очки только для предварительного отбора. Расширение добычи ресурсов сохраняет только бонус городских прав. Все требования к строительству продолжают действовать."
 eu5ab_ranking_mode_current_label: "Текущий режим"
 eu5ab_ranking_mode_composite_value: "#G Планирование спроса и предложения#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Выбор по прогнозируемой прибыли#!"
 eu5ab_ranking_mode_common_desc: "Обе стратегии рассматривают только открытые и доступные здания с приоритетом выше 0. Также действуют требования доходности, бюджета, резерва, ресурсов, рабочей силы и безопасности. Продовольственные чрезвычайные ситуации и автоматический порядок всегда важнее."
 eu5ab_ranking_mode_composite_desc: "Учитывает дефицит на рынке, стратегический спрос, эффективность, местное сырье, цены и рабочую силу, отдавая предпочтение полным цепочкам и стабильности."
 eu5ab_ranking_mode_actual_profit_desc: "Фильтрует проекты-кандидаты по правилам шаблона и безопасности, отдавая приоритет строительству по расчетной ежемесячной чистой выгоде, включая ресурсы от ветряных мельниц и стоимость сохраненной амбарами пищи. При близких значениях выгоды приоритеты шаблона служат вторичным ориентиром."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Сохраняет настроенные 3–30 альтернатив на район и тип обычного строительства. Защита от нехватки пищи и Автоматический порядок строительства имеют приоритет; требования окупаемости и строительства сохраняются. Проекты добычи ресурсов оцениваются отдельно по дефициту, ценам, занятости и стратегическим нуждам."
 eu5ab_ranking_mode_help: "Стратегия принятия решений\nПереключайте стратегии в меню Community Mod Framework → Настройки модов → Продвинутое автостроительство → Безопасность и рейтинг → Стратегия принятия решений о строительстве.\n• Планирование спроса и предложения: Делает упор на рыночный спрос и предложение, полные производственные цепочки и долгосрочную экономическую стабильность.\n• Выбор по ожидаемой прибыли: Использует расчетную ежемесячную чистую выгоду, включая доход мельниц и снижение порчи в амбарах, с приоритетами шаблона в качестве решающего фактора при равенстве."
 eu5ab_workforce_section_title: "Рабочая сила"
 eu5ab_pause_workforce_short_desc: "Определяет, блокирует ли нехватка рабочей силы строительство."
 eu5ab_job_fill_deadline_label: "Прогнозный горизонт рабочей силы"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] мес."
 eu5ab_job_fill_deadline_value: "Прогнозный горизонт рабочей силы: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] мес."
 eu5ab_job_fill_deadline_desc: "Задаёт максимальный горизонт прогноза рабочей силы в месяцах (0–240). Ноль учитывает только доступных сейчас работников, без будущего перехода населения в нужное сословие. Настройка «Останавливать при нехватке рабочей силы» определяет, блокирует ли нехватка работников начало строительства: если она включена, недостаточная прогнозируемая рабочая сила не позволяет начать стройку; если выключена, нехватка лишь снижает приоритет."
 eu5ab_deadline_0: "0 мес."
 eu5ab_deadline_3: "3 мес."
 eu5ab_deadline_6: "6 мес."
 eu5ab_deadline_12: "12 мес."
 eu5ab_toggle_stop_input_shortage: "Останавливать стройку при дефиците сырья"
 eu5ab_prediction_status_label: "Оценка рабочей силы"
 eu5ab_status_promotion_forecast: "#G Прогноз продвижения на выбранный срок#!"
 eu5ab_status_conservative_fallback: "#L Оценка по текущей рабочей силе#!"
 eu5ab_prediction_promotion_short_desc: "Объединяет текущих рабочих и прогнозируемый переход населения в целевой класс за горизонт (до 240 месяцев)."
 eu5ab_prediction_unavailable_short_desc: "При отсутствии надежного прогноза расчет ведется строго по текущим свободным рабочим."
 eu5ab_native_input_section_title: "Предпочтение местного сырья"
 eu5ab_native_input_short_desc: "Повышает рейтинг зданий, использующих сырьё из той же провинции."
 eu5ab_native_input_priority_label: "Приоритет местного сырья"
