 eu5ab_budget_effective_label: "Budżet na bieżący rok"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] złota"
 eu5ab_budget_label: "Budżet roczny"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] złota/rok"
 eu5ab_budget_cash_comparison: "Roczny budżet budowlany określa planowane wydatki; rezerwa skarbca wyznacza, ile złota należy zachować. Ostatni projekt może przekroczyć pozostały budżet, lecz musi przejść kontrolę rezerwy."
 eu5ab_budget_reset_note: "Resetuje się przy pierwszej kontroli w nowym roku; pobiera rzeczywiste wydatki dopiero po rozpoczęciu budowy. Zmiana budżetu nie kasuje zarejestrowanych wydatków."
 eu5ab_budget_help: "Zwykłe budynki i rozbudowa pozyskiwania surowców dzielą wspólny roczny budżet: stałą kwotę lub 4-, 6- albo 8-krotność całkowitego miesięcznego dochodu. Resetuje się przy pierwszej kontroli w nowym roku; zmiana w trakcie roku zachowuje już zarejestrowane wydatki.\nLiczą się tylko udane rozpoczęcia budów według ich rzeczywistego kosztu. Ostatni projekt może przekroczyć pozostały budżet; po nim nie są dodawane kolejne. Wymogi rezerwy skarbca nadal obowiązują."
 eu5ab_quota_section_title: "Limit równoczesnych budów tego moda"
 eu5ab_quota_short_desc: "Określa liczbę projektów cywilnych, które ten Mod może prowadzić jednocześnie ponad miejsce bazowe."
 eu5ab_hard_cap_label: "Dodatkowe równoczesne projekty"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] projektów (łączny limit to ta wartość + 1)"
 eu5ab_quota_help: "Ustaw dodatkowe miejsca ponad pierwszy projekt: 0 pozwala na 1 jednoczesny projekt; 599 pozwala na 600. Zwykłe budynki i projekty pozyskiwania surowców dzielą ten limit. Liczą się tylko nieukończone projekty z tego moda; budowa ręczna, drogi i inne mody nie wliczają się. Każda tura uzupełnia tylko wolne miejsca. Lokacja może otrzymać kilka projektów, jeśli pozwala na to miejsce, a po turze czeka 3 miesiące przed zaplanowaniem nowych."
