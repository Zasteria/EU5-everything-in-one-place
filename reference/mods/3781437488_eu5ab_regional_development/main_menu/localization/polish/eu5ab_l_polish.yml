 eu5ab_reset_decision: "Zresetuj Advanced Auto Build"
 eu5ab_reset_decision_desc: "Zachowaj szablony i ustawienia, usuń przypisania lokacji i zresetuj rejestry budowy. Następnie przypisz szablony ponownie."
 eu5ab_deep_decision: "Zaplanuj na nowo ogólnokrajową budowę w tym miesiącu"
 eu5ab_deep_decision_desc: "Ponownie oceń własne lokacje z włączonymi szablonami w całym kraju, zapisz plan na ten miesiąc i zaplanuj budowę od 23. dnia."
 eu5ab_open_confirmation: "Otwórz potwierdzenie"
 eu5ab_reset_confirm: "Potwierdź zresetowanie"
 eu5ab_reset_confirm_desc: "Zachowaj szablony i ustawienia, lecz wyczyść przypisania lokacji, plany, czasy oczekiwania, raporty, rekomendacje oraz rejestry wydatków na projekty i rocznych. Wydane złoto nie jest zwracane; trwające budowy są kontynuowane. Następnie przypisz szablony ponownie.\nPo zmianie kraju zastąp szablony i ustawienia tego kraju tymi zapisanymi przed zmianą."
 eu5ab_deep_confirm_desc: "Ponownie sprawdź własne lokacje z włączonymi szablonami i zastąp niewykonany plan na ten miesiąc. Wykorzystaj bieżącą strategię, zabezpieczenia żywnościowe i kolejność budowy; ostatni projekt może przekroczyć pozostały budżet.\nWielkie państwa mogą wymagać czasu; okna nie można zamknąć przed zakończeniem planowania. Późniejsze zmiany ustawień nie wpłyną na ten plan. Rozpocznij budowę od 23. dnia; wznów regularne kontrole w następnym miesiącu."
