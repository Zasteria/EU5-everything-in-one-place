 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "Ogólny wynik [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Zysk z poprawy bliskości siedziby [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Zysk z poprawy bliskości otoczenia [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nOczekuje się poprawy bliskości w [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] lokacjach (w tym w samej siedzibie).\nWyniki są szacowane przez pomnożenie wartości lokacji przez oczekiwany wzrost bliskości, a nie ostateczną wartość kontroli; bieżąca kontrola nie jest ani dodawana, ani odejmowana, a rzeczywista kontrola rozwija się dalej poprzez maksymalną kontrolę i normalną mechanikę gry."
 eu5ab_governor_local_candidate_2_breakdown: "Ogólny wynik [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Zysk z poprawy bliskości siedziby [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Zysk z poprawy bliskości otoczenia [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nOczekuje się poprawy bliskości w [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] lokacjach (w tym w samej siedzibie).\nWyniki są szacowane przez pomnożenie wartości lokacji przez oczekiwany wzrost bliskości, a nie ostateczną wartość kontroli; bieżąca kontrola nie jest ani dodawana, ani odejmowana, a rzeczywista kontrola rozwija się dalej poprzez maksymalną kontrolę i normalną mechanikę gry."
 eu5ab_governor_local_candidate_3_breakdown: "Ogólny wynik [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Zysk z poprawy bliskości siedziby [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Zysk z poprawy bliskości otoczenia [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nOczekuje się poprawy bliskości w [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] lokacjach (w tym w samej siedzibie).\nWyniki są szacowane przez pomnożenie wartości lokacji przez oczekiwany wzrost bliskości, a nie ostateczną wartość kontroli; bieżąca kontrola nie jest ani dodawana, ani odejmowana, a rzeczywista kontrola rozwija się dalej poprzez maksymalną kontrolę i normalną mechanikę gry."
 eu5ab_governor_naval_candidate_1_breakdown: "Wynik ogólny [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = Zysk z poprawy bliskości lokalizacji [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Zysk z poprawy bliskości otoczenia [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nOczekuje się poprawy bliskości w [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] lokalizacjach (w tym w samej lokalizacji).\nWyniki są szacowane przez pomnożenie wartości lokalizacji przez oczekiwany wzrost bliskości i nie stanowią ostatecznej wartości kontroli; bieżąca kontrola nie dodaje ani nie odejmuje punktów, a rzeczywista kontrola będzie dalej ewoluować w oparciu o maksymalną kontrolę i mechaniki gry."
 eu5ab_governor_naval_candidate_2_breakdown: "Wynik ogólny [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = Zysk z poprawy bliskości lokalizacji [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + Zysk z poprawy bliskości otoczenia [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\nOczekuje się poprawy bliskości w [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] lokalizacjach (w tym w samej lokalizacji).\nWyniki są szacowane przez pomnożenie wartości lokalizacji przez oczekiwany wzrost bliskości i nie stanowią ostatecznej wartości kontroli; bieżąca kontrola nie dodaje ani nie odejmuje punktów, a rzeczywista kontrola będzie dalej ewoluować w oparciu o maksymalną kontrolę i mechaniki gry."
 eu5ab_governor_naval_candidate_3_breakdown: "Wynik ogólny [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = Zysk z poprawy bliskości lokalizacji [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + Zysk z poprawy bliskości otoczenia [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\nOczekuje się poprawy bliskości w [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] lokalizacjach (w tym w samej lokalizacji).\nWyniki są szacowane przez pomnożenie wartości lokalizacji przez oczekiwany wzrost bliskości i nie stanowią ostatecznej wartości kontroli; bieżąca kontrola nie dodaje ani nie odejmuje punktów, a rzeczywista kontrola będzie dalej ewoluować w oparciu o maksymalną kontrolę i mechaniki gry."
