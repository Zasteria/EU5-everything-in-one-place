 eu5ab_diag_result_help: "Gdy obowiązują włączone zabezpieczenia żywnościowe, projekty żywnościowe mają pierwszeństwo. Inne projekty podążają za Automatyczną Kolejnością Budowy, sprawdzając alternatywy, jeśli dany projekt nie może wystartować.\nProjekty pozyskiwania surowców są oceniane według niedoborów, cen, zatrudnienia i potrzeb strategicznych, z zastrzeżeniem wymagań budowy gry.\nTylko udane rozpoczęcia zużywają budżet i miejsca budowlane. Po turze lokacje z nowymi projektami czekają 3 miesiące przed dalszą budową."
 eu5ab_diag_rgo_title: "Kontrole kandydatów do rozbudowy pozyskiwania surowców"
 eu5ab_diag_rgo_short_desc: "Każda lokacja zapisuje jeden wynik; odrzucenie zalicza się do pierwszego napotkanego powodu."
 eu5ab_diag_rgo_help: "Pokazuje ostatnią kontrolę rozbudowy pozyskiwania surowców. Istniejące miejsca pracy muszą być obsadzone. Tryb „Uwzględniaj populację” prognozuje nowych pracowników; „Zrelaksowany” tego nie robi. Ceny, jeszcze niezrealizowane przyrosty produkcji i bieżące braki rąk do pracy wpływają na priorytet. Wzrost produkcji jest sumowany dla własnych projektów tego samego dobra na tym samym rynku; niepełne dane pokazują tylko znane wielkości. Osiągnięcie limitu wstrzymuje nowe rozpoczęcia, a nie trwające projekty."
