 eu5ab_regional_development__governors_name: "Rekomendacje gubernatorów"
 eu5ab_regional_development__governors__recommendations_name: "Rekomendacje i odświeżanie"
 eu5ab_regional_development__governors__recommendations_desc: "Analizuj kandydatów na gubernatora lokalnego i morskiego bez budowania, usuwania ani przenoszenia budynków."
 eu5ab_regional_development__governors__scoring_name: "Preferencje oceny"
 eu5ab_regional_development__governors__scoring_desc: "Wybierz sposób ważenia wartości lokacji i zdecyduj, czy uwzględnić ograniczoną wartość strategiczną."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Włącz rekomendacje gubernatorów"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Okresowo sugeruj lokalizacje dla gubernatorów lokalnych i morskich. Wyłączenie zachowuje ostatnie wyniki, lecz usuwa powiadomienia z rekomendacjami."
 eu5ab_regional_development__governor_refresh_interval_name: "Częstotliwość odświeżania"
 eu5ab_regional_development__governor_refresh_interval_desc: "Ustaw interwał aktualizacji. Niektóre zmiany terytorium, stolicy, rangi lokacji i rządu wywołują wcześniejsze aktualizacje. Zmiany dróg i bliskości są uwzględniane w planowanych kontrolach."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "Co miesiąc"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "Aktualizuje najszybciej i pasuje do mniejszych państw. Częste kontrole mogą powodować dłuższe przestoje w dużych państwach."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "Co 3 miesiące"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Zrównoważona reakcja na zmiany dróg i wydajność w dużych państwach."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "Co 6 miesięcy"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Mniejsza częstotliwość przeliczania dla dużych państw."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "Co 12 miesięcy"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "Najniższy koszt, ale zmiany dróg i bliskości mogą pojawić się dopiero po roku."
 eu5ab_regional_development__governor_refresh_now_name: "Przelicz teraz"
 eu5ab_regional_development__governor_refresh_now_text: "Przelicz teraz"
 eu5ab_regional_development__governor_refresh_now_desc: "Przelicza rekomendacje siedzib lokalnych i morskich natychmiast, nawet podczas pauzy. W dużych państwach może wystąpić chwilowe spowolnienie."
 eu5ab_regional_development__governor_scoring_profile_name: "Profil wartości lokacji"
 eu5ab_regional_development__governor_scoring_profile_desc: "Określa wagę potencjalnej bazy podatkowej, ludności i rozwoju. Wyniki są szacowane na podstawie wartości lokacji pomnożonej przez oczekiwaną poprawę bliskości, a nie ostateczną wartość kontroli; bieżąca kontrola nie jest ani dodawana, ani odejmowana."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Mieszany"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Równoważy wartość ekonomiczną oraz administracyjno-ludnościową."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Ekonomiczny"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Kładzie nacisk na potencjalną podstawę opodatkowania i istniejącą skalę gospodarki."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "Administracja i populacja"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Kładzie nacisk na populację i rozwój."
 eu5ab_regional_development__governor_strategic_value_name: "Uwzględnij wartość strategiczną"
 eu5ab_regional_development__governor_strategic_value_desc: "Nadaje ograniczoną wagę portom, lokacjom granicznym i ufortyfikowanym. Zmienia to tylko wartość lokacji i nie stanowi osobnej składowej oceny."
 eu5ab_governor_window_title: "Szczegóły rekomendacji gubernatorów"
 eu5ab_governor_window_intro: "Zobacz sugestie dotyczące nowych lokalizacji i przeniesień. Zmiany w budynkach zależą od Twojej decyzji."
 eu5ab_governor_road_tier_help: "Szacunki opierają się na najwyższym odblokowanym poziomie dróg; rzeczywiste zyski mogą się różnić.\nKażdy plan blokuje drugi typ siedziby. Przelicz ponownie po zmianach; zyski nie sumują się."
 eu5ab_governor_refresh_button: "Przelicz"
 eu5ab_governor_refresh_button_tt: "Ponownie oceń nowe miejsca, relokacje i układy dla siedzib gubernatorów lokalnych i morskich. W dużych państwach gra może na chwilę zwolnić; niekompletne kontrole wyświetlają powiadomienie."
 eu5ab_governor_local_section: "Gubernator lokalny"
 eu5ab_governor_local_diagnostics: "Ostatnie obliczenia siedzib lokalnych: etap [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0], status [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0]; pojemność [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0], liczba wg silnika: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0] siedzib gubernatorów lokalnych i [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0] porucznikostw; inne zajęte miejsca [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0].\nLiczba wg lokacji: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0] siedzib gubernatorów lokalnych i [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0] porucznikostw; inne zajęte miejsca [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0]; wolne miejsca (silnik/lokacja) [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0]; rozbieżność [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0] (1 oznacza rozbieżność).\nPróg zysku dla nowej lokalizacji [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1]; lokalizacje kandydujące [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0], ocenione [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]."
