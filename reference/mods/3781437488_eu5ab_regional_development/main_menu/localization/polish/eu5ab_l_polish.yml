 eu5ab_diag_failure_help: "Powody nierozpoczęcia projektów\nWyświetla przyczyny blokady zarejestrowane podczas poprzedniej comiesięcznej weryfikacji; wartości nie kumulują się z miesiąca na miesiąc.\nOsobno zlicza projekty zablokowane przez brak siły roboczej, brak surowców, nadpodaż produkcji, niewystarczający budżet roczny, niewystarczającą rezerwę skarbca, zysk poniżej progu, brak materiałów budowlanych oraz niespełnienie warunków gry podstawowej."
