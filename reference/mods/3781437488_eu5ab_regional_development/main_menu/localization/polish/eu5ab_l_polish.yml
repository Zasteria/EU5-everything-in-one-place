 eu5ab_operating_rules_title: "Reguły budowy"
 eu5ab_operating_rules_short_desc: "Skonfiguruj budynki specjalne, budowę źródeł i niedobory surowców."
 eu5ab_operating_rules_help: "Budynki specjalne muszą spełniać wymagania gry dotyczące odblokowania i budowy.\nNiedobory surowców mogą skłonić do budowy dostawców dozwolonych przez szablon, nawet gdy istniejące zakłady są w pełni obsadzone.\nPrzy włączonej ochronie surowców podaż wymaganych kluczowych surowców przemysłowych musi pokrywać 75% popytu. W miarę możliwości stosuje się bieżące metody produkcji, w przeciwnym razie szacuje dostępną metodę. Alternatywne metody są oceniane osobno; metody produkcji nie są zmieniane automatycznie."
 eu5ab_rgo_section_title: "Pozyskiwanie surowców"
 eu5ab_rgo_allow: "Zezwól temu szablonowi rozwijać pozyskiwanie surowców"
 eu5ab_toggle_special_buildings: "Zezwól na budynki specjalne"
 eu5ab_toggle_auto_build_input_sources: "Buduj źródła przy braku surowców"
 eu5ab_toggle_pause_low_workforce: "Wstrzymaj rozbudowę przy braku siły roboczej"
 eu5ab_ranking_mode_section_title: "Strategia decyzji budowlanych"
 eu5ab_town_rights_preference_desc: "Prawa miejskie i działanie „Promuj przemysł” niezależnie dodają do 500 punktów planowania każde. Wsparcie przemysłu dotyczy tylko bezpośrednio pasującej produkcji budynków w promowanym obszarze, ważonej wybraną recepturą w cenach bazowych; nie przenosi się wzdłuż łańcuchów dostaw. Oba bonusy sumują się z punktami za lokalne surowce. Tryb zysku używa tych punktów tylko do wstępnej selekcji. Rozbudowa pozyskiwania surowców zachowuje tylko premię za prawa miejskie. Wszystkie wymogi budowy nadal obowiązują."
 eu5ab_ranking_mode_current_label: "Bieżący tryb"
 eu5ab_ranking_mode_composite_value: "#G Planowanie podaży i popytu#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Wybór według przewidywanego zysku#!"
 eu5ab_ranking_mode_common_desc: "Obie strategie uwzględniają tylko odblokowane i możliwe do zbudowania budynki z priorytetem powyżej 0. Muszą też spełniać wymogi zwrotu, budżetu, rezerwy, surowców, siły roboczej i bezpieczeństwa. Kryzysy żywnościowe i automatyczna kolejność mają pierwszeństwo."
 eu5ab_ranking_mode_composite_desc: "Równoważy niedobory rynkowe, popyt strategiczny, wydajność, surowce lokalne, ceny i ryzyko siły roboczej, stawiając na pełne łańcuchy dostaw i stabilność."
 eu5ab_ranking_mode_actual_profit_desc: "Filtruje projekty kandydatów wg zasad szablonu i bezpieczeństwa, dając priorytet budowie wg szacowanego miesięcznego zysku netto, uwzględniając zyski z wiatraków i wartość żywności chronionej przed zepsuciem w spichlerzach. Przy zbliżonym zysku priorytety z szablonu stanowią kryterium pomocnicze."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Zachowuje skonfigurowane 3–30 alternatyw na lokację i typ zwykłej budowy. Zabezpieczenia żywnościowe i Automatyczna Kolejność Budowy mają pierwszeństwo; wymogi zysku i budowy nadal obowiązują. Projekty pozyskiwania surowców są oceniane osobno pod kątem niedoborów, cen, zatrudnienia i potrzeb strategicznych."
 eu5ab_ranking_mode_help: "Strategia decyzyjna\nZmień strategię w Community Mod Framework → Ustawienia modów → Zaawansowana automatyczna budowa → Bezpieczeństwo i ranking → Strategia decyzyjna budowy.\n• Planowanie popytu i podaży: Kładzie nacisk na popyt i podaż na rynku, pełne łańcuchy produkcyjne oraz długoterminową stabilność gospodarczą.\n• Wybór wg przewidywanego zysku: Wykorzystuje szacowany miesięczny zysk netto, w tym zyski z wiatraków i oszczędności na psuciu w spichlerzach, traktując priorytety szablonu jako kryterium rozstrzygające."
 eu5ab_workforce_section_title: "Siła robocza"
 eu5ab_pause_workforce_short_desc: "Określa, czy brak siły roboczej blokuje rozbudowę."
 eu5ab_job_fill_deadline_label: "Horyzont prognozy siły roboczej"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] mies."
 eu5ab_job_fill_deadline_value: "Horyzont prognozy siły roboczej: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] mies."
 eu5ab_job_fill_deadline_desc: "Ustawia maksymalny horyzont prognozy siły roboczej w miesiącach (0–240). Zero uwzględnia wyłącznie obecnie dostępnych pracowników, bez przyszłych awansów społecznych. Opcja „Wstrzymaj przy małej sile roboczej” określa, czy niedobór pracowników blokuje rozpoczęcie budowy: po włączeniu niewystarczająca prognozowana liczba pracowników uniemożliwia start; po wyłączeniu niedobór jedynie obniża priorytet budowy."
 eu5ab_deadline_0: "0 mies."
 eu5ab_deadline_3: "3 mies."
 eu5ab_deadline_6: "6 mies."
 eu5ab_deadline_12: "12 mies."
 eu5ab_toggle_stop_input_shortage: "Wstrzymaj rozbudowę przy krytycznym braku surowców"
 eu5ab_prediction_status_label: "Szacunek siły roboczej"
 eu5ab_status_promotion_forecast: "#G Prognoza awansu dla wybranego okresu#!"
 eu5ab_status_conservative_fallback: "#L Ostrożne szacunki wg obecnej siły roboczej#!"
 eu5ab_prediction_promotion_short_desc: "Łączy obecnie wolnych robotników z prognozowanymi awansami do wymaganej warstwy (do 240 miesięcy)."
 eu5ab_prediction_unavailable_short_desc: "Przy braku wiarygodnej prognozy opiera się wyłącznie na obecnych wolnych robotnikach."
 eu5ab_native_input_section_title: "Preferencja lokalnych surowców"
 eu5ab_native_input_short_desc: "Podnosi ranking budynków używających surowców z tej samej prowincji."
 eu5ab_native_input_priority_label: "Priorytet lokalnych surowców"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Priorytet lokalnych surowców: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Preferencja lokalnych surowców\nLokalny odnosi się do prowincji zawierającej budynek. System sprawdza surowce wymagane przez recepturę i przyznaje premię do rankingu, jeśli w prowincji istnieją odpowiadające im zakłady pozyskiwania surowców; większy udział surowca w recepturze daje wyższą premię.\n• 0 ignoruje lokalne surowce, 5 to zalecenie domyślne, a 10 nadaje maksymalną wagę.\n• Ustawienie wpływa wyłącznie na punkty rankingu; rzeczywista budowa zależy od innych braków, zysków, siły roboczej i warunków gry podstawowej.\n• Sprawdza jedynie istnienie odpowiedniego zakładu pozyskiwania surowców, a nie jego poziom czy produkcję.\n• Niedobory surowców, niski dostęp do rynku lub niska kontrola zmniejszają premię. Samo pozyskiwanie surowców nie otrzymuje tej premii. Szacunki opierają się na dostępnych metodach produkcji; metody produkcji nie są automatycznie zmieniane."
 eu5ab_price_section_title: "Zakres cen"
 eu5ab_price_short_desc: "Filtruje i klasyfikuje budynki produkcyjne według ceny rynkowej."
 eu5ab_price_min_label: "Cena minimalna"
 eu5ab_price_max_label: "Punkt odniesienia wysokiej ceny"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Ceny przyjmują cenę bazową jako 100%. Niskie ceny obniżają priorytet; wstrzymaj budowę, jeśli cała produkcja jest na poziomie lub poniżej minimum. Wielokrotna produkcja jest ważona ilością i ceną bazową. Premie za wysokie ceny przestają rosnąć powyżej punktu odniesienia; wysokie ceny nie blokują budowy. Budynki bez wytwarzanych dóbr są zwolnione. Zabezpieczenia żywnościowe działają zgodnie z konfiguracją."
