 eu5ab_local_governor_available_alert_tooltip: "Zalecana: [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1').GetLocation.GetName]\nTa lokalizacja oferuje najlepszy regionalny krańcowy zysk bliskości w planie najwyższych dróg, z wyłączeniem ulepszeń dróg współdzielonych przez istniejące siedziby. Kliknij lewym przyciskiem myszy, aby zobaczyć szczegóły; prawym, aby ukryć; Shift+prawy, aby wyciszyć."
