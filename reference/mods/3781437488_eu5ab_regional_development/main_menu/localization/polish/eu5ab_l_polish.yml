 eu5ab_rgo_short_desc: "Istniejące miejsca pracy muszą być obsadzone. Domyślnym trybem jest „Zrelaksowany”; wybierz „Uwzględniaj populację”, aby prognozować pracowników na nowe stanowiska."
 eu5ab_rgo_help: "Istniejące miejsca pracy przy pozyskiwaniu surowców muszą być w pełni obsadzone. Domyślny tryb „Zrelaksowany” nie prognozuje nowych pracowników; tryb „Uwzględniaj populację” wymaga, aby w wybranym okresie oczekiwano wystarczającej liczby pracowników.\nCeny na poziomie minimum lub poniżej wstrzymują rozbudowę. Niskie ceny obniżają priorytet, a wysokie go podnoszą. Projekty z wynikiem poniżej 0 nie rozpoczynają się.\nWłasne zwykłe budynki i projekty pozyskiwania surowców wytwarzające to samo dobro na tym samym rynku dzielą wspólny limit rozbudowy. Obejmuje on jeszcze niezrealizowane przyrosty produkcji z trwających lub ukończonych projektów oraz uwzględnia nowe zapotrzebowanie na surowce z planowanych budów. Dalsza budowa staje się mniej preferowana, gdy oczekiwane przyrosty zbliżają się do niedoboru popytu powiększonego o 10% popytu. Nowe rozpoczęcia wstrzymują się po osiągnięciu tej kwoty. Ostatni poziom może go przekroczyć; trwające projekty są kontynuowane.\nWyłączenie ochrony siły roboczej zatrzymuje prognozy, lecz bieżące niedobory nadal obniżają priorytet. Włączone zabezpieczenia żywnościowe mogą nadać priorytet odpowiednim projektom pozyskiwania surowców oraz uchylić limity cen i rozbudowy. Pełne obsadzenie istniejących miejsc pracy oraz wymogi siły roboczej, budżetu i zasad budowy gry nadal obowiązują."
 eu5ab_workforce_help: "Zwykłe budynki domyślnie korzystają z 12-miesięcznej prognozy; projekty pozyskiwania surowców w trybie „Uwzględniaj populację” używają 180 miesięcy. Szacunki wykorzystują bieżące tempo awansów, modyfikatory lokalne i krajowe, „Wiele możliwości”, piśmienność oraz uprawnioną populację. Migracja, zmieniające się tempo i konkurencyjne stanowiska mogą wpłynąć na wyniki.\nWyłączenie ochrony siły roboczej zatrzymuje prognozy. Bieżące niedobory obniżają priorytet bez zmiany przewidywanego zysku; zabezpieczenia żywnościowe nadal działają zgodnie z konfiguracją."
