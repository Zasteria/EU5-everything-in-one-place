 eu5ab_cash_label: "Rezerwa skarbca"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] złota"
 eu5ab_cash_help: "Przed rozpoczęciem budowy szacowane koszty tego i innych planowanych projektów muszą pozostawić wystarczającą ilość złota na rezerwę.\nPrzy 1050 złota i rezerwie 1000 projekt o szacowanym koszcie 100 nie może wystartować. Rzeczywiste koszty pozyskiwania surowców mogą różnić się od szacunków. W budżecie rocznym również musi pozostać część środków."
 eu5ab_budget_section_title: "Roczny budżet budowlany"
 eu5ab_budget_short_desc: "Wybierz stałą kwotę lub roczny limit oparty na całkowitym miesięcznym dochodzie."
 eu5ab_budget_mode_fixed: "Stały budżet"
 eu5ab_budget_mode_income: "Zależny od dochodu"
 eu5ab_budget_multiplier_4: "×4 Ostrożny"
