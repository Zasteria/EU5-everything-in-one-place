 eu5ab_prediction_section_title: "Reguły automatycznej budowy"
 eu5ab_prediction_diagnostics_title: "Szacunek siły roboczej i stan budowy"
 eu5ab_prediction_section_body: "Układa ulepszenia, zwykłe rozbudowy, rozbudowy pozyskiwania surowców i nowe budynki w wybranej Automatycznej Kolejności Budowy, próbując najpierw kwalifikujących się projektów bieżącego typu.\nGdy obowiązują aktywne zabezpieczenia żywnościowe, odpowiednie projekty żywnościowe mają pierwszeństwo, a wymogi zysku, cen lub inne są łagodzone zgodnie z konfiguracją. Włączone zabezpieczenia dla materiałów budowlanych, zaopatrzenia wojennego lub surowców strategicznych mogą również łagodzić wymogi rentowności.\nWymogi budżetu, rezerwy skarbca oraz odpowiednich surowców, siły roboczej, pojemności budowlanej i zasad budowy gry nadal obowiązują. Uwzględnia się tylko najnowszy odblokowany poziom zwykłych budynków; ulepszenia liczą tylko nowo utworzone miejsca pracy."
 eu5ab_diagnostics_title: "Stan automatycznej budowy"
 eu5ab_diagnostics_snapshot_note: "Ustawienia zapisują się natychmiast. Raporty aktualizują się w miarę postępu kontroli i rozpoczęcia budowy, zachowując wyniki po zakończeniu."
 eu5ab_diagnostics_snapshot_help: "Raport aktualizuje się w miarę postępu kontroli i rozpoczęcia budów, zachowując wyniki do następnej tury. Projekty są uruchamiane od 23. dnia, więc liczby i wydatki mogą zmieniać się stopniowo. Niektóre wyniki pozostają w toku do zakończenia kontroli."
