 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Ustaw budżet, wymagania budowy, strategię decyzji i wydajność wspólne dla wszystkich szablonów. Każdy szablon zachowuje własne włączenie, zasięg i priorytety."
 eu5ab_regional_development__general_name: "Sterowanie i limity"
 eu5ab_regional_development__finance_name: "Finanse i rynek"
 eu5ab_regional_development__automation_name: "Bezpieczeństwo i ranking"
 eu5ab_regional_development__performance_name: "Optymalizacja wydajności"
 eu5ab_regional_development__performance__preset_name: "Ustawienie wydajności"
 eu5ab_regional_development__performance__preset_desc: "Ustawienia dostosowują poniższe opcje. Ręczna zmiana opcji zaawansowanej przełącza na Własne; nowe wartości obowiązują od następnej kontroli."
 eu5ab_regional_development__performance__advanced_name: "Ustawienia zaawansowane"
 eu5ab_regional_development__performance__advanced_desc: "Dostosuj dzienne kontrole lokacji, nowe projekty na turę oraz liczbę alternatyw. Sprawdzanie większej liczby projektów może zająć więcej czasu."
 eu5ab_regional_development__general__limits_name: "Sterowanie i limit równoczesny"
 eu5ab_regional_development__general__limits_desc: "Kontroluje działanie Modu oraz limit jednocześnie prowadzonych cywilnych projektów budowlanych."
 eu5ab_regional_development__general__returns_name: "Reguły zwrotu i wyjątki awaryjne"
 eu5ab_regional_development__general__returns_desc: "Ustal minimalny zwrot zwykłych budynków i czy niedobór żywności, materiałów, dóbr wojskowych lub strategicznych nakładów może go zawiesić."
 eu5ab_regional_development__finance__budget_name: "Wspólny budżet roczny"
 eu5ab_regional_development__finance__budget_desc: "Wszystkie szablony, budynki i projekty pozyskiwania surowców dzielą jeden krajowy budżet roczny."
 eu5ab_regional_development__finance__market_name: "Zakres cen rynkowych"
 eu5ab_regional_development__finance__market_desc: "Ustaw wspólne procenty ceny minimalnej i wysokiej względem ceny bazowej."
 eu5ab_regional_development__automation__safety_name: "Zasady bezpieczeństwa budowy"
 eu5ab_regional_development__automation__safety_desc: "Wspólne reguły dla budynków specjalnych, źródeł wcześniejszych, siły roboczej i braków nakładów."
 eu5ab_regional_development__automation__rgo_name: "Rozbudowa pozyskiwania surowców"
 eu5ab_regional_development__automation__workforce_name: "Prognoza siły roboczej"
 eu5ab_regional_development__automation__workforce_desc: "Konfiguruje maksymalny horyzont czasowy przy prognozowaniu przyszłej podaży siły roboczej."
 eu5ab_regional_development__automation__ranking_name: "Strategia decyzji budowlanych"
 eu5ab_regional_development__automation__ranking_desc: "Wybierz strategię zwykłych budynków, kolejność ulepszeń, rozbudów, rozbudowy pozyskiwania surowców i nowych budów oraz wpływ lokalnych nakładów."
 eu5ab_regional_development__candidate_ranking_mode_name: "Strategia zwykłych budynków"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Próbuj innych projektów"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Jeśli wiodące projekty bieżącego typu nie mogą wystartować, próbuj niżej sklasyfikowanych alternatyw. Każda lokacja otrzymuje do 2 dodatkowych prób na turę w planowaniu podaży i popytu lub 5 w wyborze wg przewidywanego zysku, dzielonych między zwykłe typy. Zatrzymuje się, gdy rozpocznie się tam budowa zwykłego budynku. Wczytanie zapisu nie przywraca prób. Wszystkie wymagania nadal obowiązują. Domyślnie wyłączone; zaczyna obowiązywać w następnej turze i może wydłużyć czas kontroli."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Wybierz sposób priorytetyzacji kwalifikujących się zwykłych budynków. Zabezpieczenia żywnościowe i Automatyczna Kolejność Budowy mają pierwszeństwo. Projekty pozyskiwania surowców są oceniane osobno pod kątem niedoborów, cen, zatrudnienia i potrzeb strategicznych."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Podaż i popyt"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Ocenia projekty według niedoborów rynkowych, potrzeb strategicznych, wydajności receptur, lokalnych surowców, cen i ryzyka siły roboczej, premiując pełne łańcuchy i stabilność długoterminową."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Przewidywany zysk"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtruje kandydatów wg zasad szablonu i bezpieczeństwa, traktując priorytetowo budowę wg szacowanego miesięcznego zysku netto, w tym zysków z wiatraków i żywności ocalonej w spichlerzach. Przy zbliżonym zysku priorytety szablonu służą jako kryterium pomocnicze."
 eu5ab_regional_development__automation__candidate_priority_name: "Kolejność automatycznej budowy"
 eu5ab_regional_development__automation__candidate_priority_desc: "Przeciągnij cztery typy w pożądanej kolejności. Mod sprawdza wszystkie możliwe projekty w bieżącym typie przed przejściem do następnego; jeśli projekt nie może wystartować, szuka innego tego samego typu. Podczas kryzysu żywnościowego projekty żywnościowe mają pierwszeństwo, lecz zachowują tę kolejność."
 eu5ab_regional_development__candidate_priority_name: "Kolejność automatycznej budowy"
 eu5ab_regional_development__candidate_priority_desc: "Przeciągnij, aby uporządkować ulepszenia, zwykłe rozbudowy, rozbudowy pozyskiwania surowców i nowe budynki."
 eu5ab_regional_development__candidate_priority_item_column_name: "Typ budowy"
 eu5ab_regional_development__candidate_priority_i1_name: "Ulepszaj budynki"
 eu5ab_regional_development__candidate_priority_i1_desc: "Zastąp przestarzały budynek najnowszym odblokowanym poziomem jego łańcucha."
 eu5ab_regional_development__candidate_priority_i2_name: "Rozbuduj istniejące budynki"
 eu5ab_regional_development__candidate_priority_i2_desc: "Dodaj poziom do istniejącego zwykłego budynku, bez zastępstw i projektów pozyskiwania surowców."
 eu5ab_regional_development__candidate_priority_i3_name: "Rozbuduj pozyskiwanie surowców"
 eu5ab_regional_development__candidate_priority_i3_desc: "Rozbudowuje lokalne pozyskiwanie surowców; wymaga pełnego obsadzenia istniejących stanowisk oraz spełnienia zasad cen, rocznego budżetu budowlanego i rezerwy skarbca."
 eu5ab_regional_development__candidate_priority_i4_name: "Buduj nowe budynki"
 eu5ab_regional_development__candidate_priority_i4_desc: "Zbuduj od zera zwykły budynek, którego nie ma jeszcze w lokacji."
 eu5ab_regional_development__enabled_name: "Włącz automatyczną budowę"
 eu5ab_regional_development__enabled_desc: "Włącz lub wyłącz comiesięczne kontrole automatycznej budowy. Szablony i przypisania lokacji są zachowywane po wyłączeniu."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Dodatkowe projekty równoczesne"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Liczba projektów cywilnych, które ten Mod może prowadzić jednocześnie ponad miejsce bazowe. 0 oznacza łącznie 1 projekt, a 599 oznacza 600; budowa ręczna, drogi i inne mody nie korzystają z tego limitu."
 eu5ab_regional_development__budget_mode_name: "Tryb budżetu rocznego"
 eu5ab_regional_development__budget_mode_desc: "Wybierz stałą kwotę lub 4-, 6- albo 8-krotność całkowitego miesięcznego dochodu. Przeliczane przy pierwszej kontroli w nowym roku; zmiana ustawień zachowuje już zarejestrowane wydatki."
 eu5ab_regional_development__budget_mode_option_1_name: "Stały budżet roczny"
 eu5ab_regional_development__budget_mode_option_2_name: "Miesięczny dochód ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Miesięczny dochód ×6 (zalecane)"
 eu5ab_regional_development__budget_mode_option_4_name: "Miesięczny dochód ×8"
 eu5ab_regional_development__economic_metric_name: "Próg ekonomiczny zwykłych budynków"
 eu5ab_regional_development__economic_metric_desc: "Zwykłe budynki produkcyjne muszą spełniać wybrany warunek: dodatni prognozowany miesięczny dochód lub zysk albo 5% zwrot w skali roku. Rzeczywiste zyski mogą ulec zmianie. Zwykła infrastruktura publiczna jest zwolniona. Wiatraki wymagają dodatnich zysków netto z dodatkowej produkcji oraz 5% rocznego zwrotu w trybach stopy zwrotu. Spichlerze budowane w celu ograniczenia psucia zawsze wymagają 5%. Pozyskiwanie surowców podlega osobnym zasadom."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Dochód miesięczny > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Rozpocznij tylko, jeśli gra przewiduje dodatni miesięczny dochód."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Zysk miesięczny > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Rozpocznij tylko, jeśli gra przewiduje dodatni całkowity miesięczny zysk."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Roczna stopa zwrotu z dochodu ≥ 5%"
 eu5ab_regional_development__economic_metric_option_3_desc: "Prognozowany miesięczny dochód musi wynosić co najmniej 5% kosztów budowy podzielonych przez 12. Porównuje to dochód przed kosztami operacyjnymi."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Roczna stopa zwrotu z zysku ≥ 5%"
 eu5ab_regional_development__economic_metric_option_4_desc: "Prognozowany miesięczny zysk musi wynosić co najmniej 5% kosztów budowy podzielonych przez 12. Rzeczywisty zysk może zmieniać się wraz z warunkami działalności."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Żywność się wyczerpie: buduj najpierw, pomiń zwrot"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Gdy żywność ma się wyczerpać, obsłuż projekty żywnościowe najpierw i pomiń zwrot zwykłych budynków żywnościowych. Kolejność i wszystkie inne zasady nadal obowiązują."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Żywność 25% lub mniej: buduj najpierw, pomiń zwrot"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Gdy zapasy żywności na rynku wynoszą 25% lub mniej, projekty żywnościowe są priorytetowe i zwolnione z wymogu rentowności. Nadal obowiązuje Automatyczna Kolejność Budowy i pozostałe reguły bezpieczeństwa."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Podaż budowlana poniżej 65%: pomiń zwrot"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Gdy podaż kluczowego materiału budowlanego wynosi poniżej 65%, wytwarzające go budynki są zwolnione z wymogu rentowności. Wszystkie pozostałe reguły budowy obowiązują."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Podaż wojskowa podczas wojny poniżej 65%: pomiń zwrot"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "W czasie wojny, jeśli zaopatrzenie w dobra wojskowe wynosi poniżej 65%, produkujące je budynki są zwolnione z wymogu rentowności. Pozostałe reguły budowy obowiązują."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Produkcja strategiczna bez nakładów: pomiń zwrot wcześniejszych źródeł"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Gdy podaż surowca na rynku spada poniżej 65% popytu, a na tym samym rynku znajduje się otwarty krajowy budynek produkujący żywność, podstawowe materiały budowlane lub towary wojskowe, który zużywa ten surowiec i ma niedobór materiałów wejściowych, producenci tego surowca są zwolnieni z wybranego progu rentowności. Produkcja w budynku odbiorcy nie musi być wstrzymana, a brakującym materiałem nie musi być właśnie ten surowiec. Pozostałe zasady budowy nadal obowiązują."
 eu5ab_regional_development__fixed_annual_budget_name: "Stały budżet roczny"
 eu5ab_regional_development__fixed_annual_budget_desc: "Używane tylko w trybie stałym; wszystkie szablony dzielą tę kwotę."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Minimalna rezerwa skarbca"
 eu5ab_regional_development__min_cash_reserve_desc: "Zachowaj tę rezerwę po odliczeniu szacowanych kosztów wszystkich planowanych projektów. Rzeczywiste koszty pozyskiwania surowców mogą się różnić."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Procent ceny minimalnej"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Procent wysokiej ceny odniesienia"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Zezwól na budynki specjalne"
 eu5ab_regional_development__allow_special_buildings_desc: "Zezwól na uwzględnianie budynków specjalnych; wymagania budowy gry nadal obowiązują."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Uzupełniaj braki rynkowe wolnymi miejscami budowy"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "Po regularnych projektach wykorzystaj wolne miejsca budowy, aby uzupełnić niedobory we własnych lokacjach sprawdzonych w tej turze na tym samym rynku. Uwzględnia zapotrzebowanie planowanych projektów na surowce oraz jeszcze niezrealizowane przyrosty produkcji. Wbudowane szablony mogą dodawać nieplanowane gałęzie przemysłu; zakazy, własny priorytet 0 i inne wymogi budowy nadal obowiązują."
 eu5ab_regional_development__auto_build_input_sources_name: "Buduj źródła wcześniejsze przy niedoborze"
 eu5ab_regional_development__auto_build_input_sources_desc: "Niezależnie sprawdzaj niedobory na rynku surowców i buduj dozwolone zakłady dostawcze, w tym gdy zakłady przetwórcze są w pełni obsadzone, lecz brakuje im surowców."
 eu5ab_regional_development__pause_low_workforce_name: "Wstrzymaj przy małej sile roboczej"
 eu5ab_regional_development__stop_input_shortage_name: "Zatrzymaj przy braku krytycznych nakładów"
 eu5ab_regional_development__stop_input_shortage_desc: "Podaż rynkowa wymaganych kluczowych surowców przemysłowych musi pokrywać co najmniej 75% popytu, zanim będzie można zaplanować powiązaną budowę."
 eu5ab_regional_development__allow_rgo_name: "Zezwól na rozbudowę pozyskiwania surowców"
 eu5ab_regional_development__allow_rgo_desc: "Zezwól wszystkim szablonom uwzględniać rozbudowę pozyskiwania surowców."
 eu5ab_regional_development__native_input_priority_name: "Priorytet lokalnych surowców"
 eu5ab_regional_development__native_input_priority_desc: "0–10; wyższe wartości zwiększają priorytet budynków wykorzystujących surowce z tej samej prowincji."
 eu5ab_regional_development__performance_preset_name: "Ustawienie wydajności"
 eu5ab_regional_development__performance_preset_desc: "Ustawienie synchronizuje opcje zaawansowane poniżej. Własne zachowuje bieżące wartości."
 eu5ab_regional_development__performance_preset_option_1_name: "Ostrożne"
 eu5ab_regional_development__performance_preset_option_1_desc: "Sprawdza do 10 lokacji dziennie i rozpoczyna najwyżej 30 projektów na przebieg. Kandydaci planowania: 5; zysku: 15. Kończy po zebraniu wystarczającej liczby."
 eu5ab_regional_development__performance_preset_option_2_name: "Równowaga"
 eu5ab_regional_development__performance_preset_option_2_desc: "Sprawdza do 20 lokacji dziennie i rozpoczyna najwyżej 50 projektów na przebieg. Kandydaci planowania: 4; zysku: 12. Kończy po zebraniu wystarczającej liczby."
 eu5ab_regional_development__performance_preset_option_3_name: "Maksymalna przepustowość"
 eu5ab_regional_development__performance_preset_option_3_desc: "Dla państw z wieloma lokacjami. Sprawdza do 30 dziennie bez limitu na przebieg. Kandydaci planowania: 3; zysku: 10. Kończy po zebraniu wystarczającej liczby."
 eu5ab_regional_development__performance_preset_option_4_name: "Własne"
 eu5ab_regional_development__performance_preset_option_4_desc: "Użyj bieżących ustawień zaawansowanych."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Wiele lokacji z szablonami może obniżyć wydajność gry."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "W trybie Maksymalnej Przepustowości sprawdzanych jest do 30 lokacji dziennie bez limitu na cykl. Bardzo rozległe państwa mogą doświadczyć dłuższego czasu przejścia miesiąca."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Popyt i podaż\" trwa zbyt długo: zmniejsz \"Kandydatów planowania\"."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Tylko dla Podaży i popytu. Mniej Kandydatów planowania ogranicza projekty na lokację i typ wysyłane do dalszych kontroli."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Konsekwencja: mniej kandydatów alternatywnych może pominąć późniejsze wykonalne projekty."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Projekty są sprawdzane według wyniku planowania. Zmniejszenie limitu kandydatów pozostawia mniej opcji w razie niespełnienia warunków wstępnych, co może pominąć późniejsze wykonalne projekty."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "„Przewidywany zysk” trwa zbyt długo: zmniejsz wartość „Kandydaci zysku na lokację”."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Wyświetlane tylko w trybie „Przewidywany zysk”. Zmniejsz wartość „Kandydaci zysku na lokację”, aby ograniczyć liczbę alternatyw sprawdzanych później."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Mniej alternatyw może nie pozostawić innego wyboru, jeśli wiodące projekty nie wystartują."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Alternatywy są zachowywane po uszeregowaniu według przewidywanego zysku i preferencji budowlanych. Zachowanie mniejszej liczby pozostawia mniej opcji, gdy wiodące projekty nie mogą wystartować."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Zmniejsz też dzienne lokacje lub dodatki na przebieg."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Mniejsza dzienna liczba lokacji rozkłada kontrole na więcej dni. Mniej dodatków na turę ogranicza projekty uruchamiane jednocześnie. Ustawienie 0 znosi limit na turę."
 eu5ab_regional_development__parallel_location_scan_name: "Przetwarzaj lokacje osobno"
 eu5ab_regional_development__parallel_location_scan_desc: "Sprawdzaj lokacje osobno, aby ograniczyć przerwy, lub wspólnie każdego dnia, gdy wyłączone. Priorytety, budżet i kolejność budowy pozostają bez zmian."
 eu5ab_regional_development__daily_location_task_limit_name: "Lokacje sprawdzane dziennie"
 eu5ab_regional_development__daily_location_task_limit_desc: "Maksymalna liczba lokacji szczegółowo sprawdzanych każdego dnia. Niższe wartości oznaczają mniej pracy dziennie, lecz więcej dni na objęcie kraju."
 eu5ab_regional_development__max_additions_per_run_name: "Maksimum dodatków na przebieg"
 eu5ab_regional_development__max_additions_per_run_desc: "Ogranicza maksymalną liczbę projektów rozpoczętych w jednym cyklu (0 do 600). Zero oznacza brak limitu."
 eu5ab_regional_development__candidates_per_location_name: "Kandydaci planowania na lokację"
 eu5ab_regional_development__candidates_per_location_desc: "Aktywne tylko przy 'Planowaniu popytu i podaży'. Określa dla każdej lokacji i kategorii zwykłej budowy liczbę kandydatów zachowanych według wyniku planowania do dalszych sprawdzeń (3–30). Większa liczba zmniejsza ryzyko pominięcia opcji, ale zwiększa obciążenie procesora."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Kandydaci zysku na lokację"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Tylko dla Wyboru wg przewidywanego zysku. Zachowaj 3–30 alternatyw na lokację i typ zwykłej budowy, uszeregowanych według przewidywanego zysku i preferencji budowlanych. Więcej alternatyw daje większy wybór, gdy wiodące projekty nie mogą wystartować, lecz może spowolnić późniejsze kontrole."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Zatrzymaj po znalezieniu dość kandydatów"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Zatrzymaj szczegółowe sprawdzanie kolejnych lokacji, gdy liczba alternatyw osiągnie dwukrotność projektów, które można dodać w tej turze. Wolne miejsca i Maksimum dodatków na przebieg określają tę liczbę; 0 usuwa jedynie limit na turę. Wymagania budowy nadal obowiązują."
 eu5ab_diagnostics_cmm_hint: "Zmień wspólne zasady w Ustawieniach moda Community Mod Framework. Raport budowy pokazuje ostatni wynik automatyczny."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "Zwiększ o 10"
 eu5ab_cmm_shift_decrease_10: "Zmniejsz o 10"
 eu5ab_cmm_shift_increase_1000: "Zwiększ o 1000"
 eu5ab_cmm_shift_decrease_1000: "Zmniejsz o 1000"
 eu5ab_cmm_shift_increase_max: "Ustaw maksimum"
 eu5ab_cmm_shift_decrease_min: "Ustaw minimum"
 eu5ab_regional_development__automation__rgo_desc: "Rozważ rozbudowę pozyskiwania surowców po pełnym obsadzeniu istniejących stanowisk. Wybierz, czy prognozować pracowników na nowe miejsca."
 eu5ab_regional_development__rgo_workforce_mode_name: "Tryb siły roboczej pozyskiwania surowców"
 eu5ab_regional_development__rgo_forced_relaxed_name: "Tryb pozyskiwania surowców: Zrelaksowany (Wstrzymywanie siły roboczej wył.)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "Brak prognozy siły roboczej. Istniejące miejsca pracy muszą być obsadzone; braki na nowych stanowiskach jedynie obniżają priorytet budowy."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Domyślnie „Zrelaksowany”. Wyłączenie ochrony siły roboczej tymczasowo przełącza na tryb zrelaksowany i obniża priorytet przy bieżących brakach rąk do pracy. Ponowne włączenie przywraca wybrany tryb. Istniejące miejsca pracy muszą być zawsze w pełni obsadzone."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Zrelaksowany"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Zgodnie z ogólnymi regułami rozbudowy w grze: po pełnym obsadzeniu istniejących miejsc pracy ocenia ceny, potrzeby rynkowe i przewidywaną produkcję bez prognozowania nowych pracowników. Przy włączonej ochronie siły roboczej niedobory na nowych stanowiskach nie obniżają priorytetu."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Uwzględniaj populację"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "Po sprawdzeniu pełnego obsadzenia istniejących miejsc szacuje kwalifikujące się awanse w horyzoncie prognozy. Wstrzymuje budowę, jeśli pracownicy nie wystarczą do obsadzenia kolejnego poziomu."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "Horyzont prognozy populacji dla pozyskiwania surowców (Miesiące)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "W trybie „Uwzględniaj populację” rozbudowa wymaga, aby w tym okresie przewidywano wystarczającą liczbę pracowników do obsadzenia nowych miejsc. Domyślnie: 180 miesięcy. Zakres: 0–1200; zero uwzględnia tylko obecnie dostępnych pracowników. Szacunek bierze pod uwagę „Wiele możliwości”, piśmienność i populację uprawnioną do zmiany zawodu. Dłuższe prognozy mogą bardziej odbiegać od rzeczywistych wyników. Kliknij, aby zmienić o 1 miesiąc, przytrzymaj Ctrl, aby zmienić o 12 miesięcy, lub Shift dla 120 miesięcy."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "Gdy włączone, zwykłe budynki wymagają wystarczającej prognozowanej liczby pracowników; projekty pozyskiwania surowców korzystają z wybranego trybu. Wyłączenie zatrzymuje prognozy i tymczasowo stosuje tryb „Zrelaksowany” dla pozyskiwania surowców. Bieżące braki obniżają priorytet, nie blokując samodzielnie nowych projektów. Istniejące stanowiska pozyskiwania surowców muszą być nadal w pełni obsadzone. Ponowne włączenie przywraca poprzedni tryb pozyskiwania surowców."
 eu5ab_regional_development__job_fill_deadline_months_name: "Horyzont prognozy siły roboczej dla zwykłych budynków (Miesiące)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Niezależny horyzont dla zwykłych budynków: domyślnie 12 miesięcy, zakres 0–240. Zero uwzględnia tylko obecnie wykwalifikowanych wolnych pracowników. Projekty pozyskiwania surowców uwzględniające populację używają osobnego horyzontu. Bieżące tempo awansów jest szacunkiem, a nie gwarancją."
 eu5ab_regional_development__price_min_desc: "Domyślnie: 80% ceny bazowej. Niższe ceny obniżają priorytet. Wstrzymaj budowę, gdy cała produkcja jest na poziomie progu lub poniżej; waż wielokrotną produkcję ilością i ceną bazową. Przy 100% lub więcej stosuje się tylko próg. Włączone zabezpieczenia żywnościowe mogą uchylić limity cenowe."
 eu5ab_regional_development__price_max_desc: "Domyślnie: 125%. Ceny powyżej ceny bazowej stopniowo zwiększają priorytet aż do punktu odniesienia. Przy odniesieniu 125% cena 112,5% daje 70 punktów; 125% lub więcej daje 140. Jeśli odniesienie wynosi 100% lub mniej, każda cena powyżej bazowej dodaje 140."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
