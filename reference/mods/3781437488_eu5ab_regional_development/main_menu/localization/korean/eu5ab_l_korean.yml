 eu5ab_rgo_short_desc: "기존 일자리가 가득 차 있어야 합니다. 기본값은 '완화'이며, '인구 고려'를 선택해 새 일자리의 노동력을 예측할 수 있습니다."
 eu5ab_rgo_help: "기존 R.G.O. 일자리가 가득 차 있어야 합니다. 기본값인 '완화' 모드는 신규 노동자를 예측하지 않으며, '인구 고려'는 설정된 기간 내에 충분한 노동자가 예상되어야 합니다.\n가격이 최저치 이하일 경우 확장을 중단합니다. 낮은 가격은 우선순위를 낮추고 높은 가격은 우선순위를 높입니다. 0점 미만의 프로젝트는 착공하지 않습니다.\n동일 시장에서 동일 상품을 생산하는 소유 일반 건물과 RGO는 확장 한도를 공유합니다. 여기에는 진행 중이거나 완료되었으나 아직 실현되지 않은 생산량 증가분이 포함되며, 계획된 프로젝트의 새로운 투입재 수요도 고려됩니다. 예상 증가량이 '수요 부족분 + 수요의 10%'에 근접할수록 추가 건설 우선순위가 낮아지며, 해당 수치에 도달하면 신규 착공이 중단됩니다. 마지막 단계는 이를 초과할 수 있으며 기존 공사는 계속 진행됩니다.\n노동력 보호를 비활성화하면 예측이 중단되지만 현재 노동력 부족은 여전히 우선순위를 낮춥니다. 활성화된 긴급 식량 보호는 관련 RGO를 우선 배치하고 가격 및 확장 한도를 면제할 수 있습니다. 기존 일자리 완전 고용과 적용 가능한 노동력, 예산 및 게임 건설 요건은 계속 충족해야 합니다."
 eu5ab_workforce_help: "일반 건물은 기본적으로 12개월 예측을 사용하며, '인구 고려' 모드의 RGO는 180개월을 사용합니다. 현재 승격 속도, 지역 및 국가 수정치, 풍성한 기회, 문해력 및 적격 인구를 사용하여 추정합니다. 미래의 이주, 승격 속도 변화 및 타 직종과의 경쟁이 결과에 영향을 미칠 수 있습니다.\n노동력 보호를 비활성화하면 예측이 중단됩니다. 현재 인력 부족은 예상 이익을 변경하지 않고 우선순위만 낮춥니다. 긴급 식량 보호는 설정된 대로 계속 적용됩니다."
