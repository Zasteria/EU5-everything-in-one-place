 eu5ab_template_overview_title: "지역 개발 템플릿"
 eu5ab_presets_tab: "테마 템플릿"
 eu5ab_presets_tab_tooltip: "다양한 발전 목표에 맞춘 고정된 건물 우선순위입니다. 기본 프리셋을 사용자 지정 템플릿으로 복사하여 수정할 수 있습니다."
 eu5ab_custom_tab: "사용자 지정 템플릿"
 eu5ab_custom_tab_tooltip: "건물 우선순위와 적용 범위를 직접 설정합니다."
