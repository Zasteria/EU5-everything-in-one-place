 eu5ab_building_age_5: "절대주의 시대"
 eu5ab_building_age_6: "혁명의 시대"
 eu5ab_status_enabled: "#G 활성화#!"
 eu5ab_status_disabled: "#L 비활성화#!"
 eu5ab_status_currently_available: "#G 사용 가능#!"
 eu5ab_operating_rules_title: "자동 건설 규칙"
 eu5ab_operating_rules_short_desc: "특수 건물, 상류 보완 건설 및 투입재 부족 규칙을 설정합니다."
 eu5ab_operating_rules_help: "특수 건물은 게임의 잠금 해제 및 건설 요건을 충족해야 합니다.\n원자재 부족 시 기존 공장이 완전 고용 상태이더라도 템플릿에서 허용된 공급 시설의 보충 건설이 진행될 수 있습니다.\n원자재 보호가 활성화되면 필요한 핵심 산업 원자재 공급이 수요의 75% 이상이어야 합니다. 기존 건물은 가급적 현재 생산 방식을 기준으로 판단하며, 불확실한 경우 사용 가능한 방식을 추정합니다. 대체 방식은 개별적으로 평가되며 생산 방식이 자동으로 변경되지는 않습니다."
 eu5ab_rgo_section_title: "R.G.O."
 eu5ab_rgo_allow: "이 템플릿의 R.G.O. 확장 허용"
 eu5ab_toggle_special_buildings: "특수 건물 허용"
 eu5ab_toggle_auto_build_input_sources: "투입재 부족 시 상류 자동 건설"
 eu5ab_toggle_pause_low_workforce: "노동력 부족 시 건설 일시 정지"
 eu5ab_ranking_mode_section_title: "건설 결정 전략"
 eu5ab_town_rights_preference_desc: "도시권 선호와 산업 진흥는 각각 최대 500점의 계획 점수를 독립적으로 가산합니다. 산업 진흥은 장려 권역 내에서 직접 일치하는 생산 건물의 산출물에만 적용되며 기본 가격 기준 레시피 산출량 비율로 계산되고 공급망을 따라 전달되지 않습니다. 두 보너스 모두 현지 원자재 점수와 중첩됩니다. 이익 모드에서는 이 점수를 사전 선별에만 사용합니다. R.G.O. 확장은 도시권 보너스만 유지합니다. 모든 착공 조건은 계속 충족해야 합니다."
 eu5ab_ranking_mode_current_label: "현재 모드"
 eu5ab_ranking_mode_composite_value: "#G 수급 계획#!"
 eu5ab_ranking_mode_actual_profit_value: "#G 예상 이익 우선 선택#!"
 eu5ab_ranking_mode_common_desc: "두 전략 모두 해금되었고 건설 가능하며 우선순위가 0보다 큰 건물만 고려합니다. 수익, 예산, 준비금, 투입재, 노동력 등 안전 조건도 충족해야 합니다. 식량 비상 상황과 자동 건설 순서가 항상 우선합니다."
 eu5ab_ranking_mode_composite_desc: "시장 부족, 전략 수요, 효율성, 현지 원자재, 가격, 노동력 위험을 종합 평가하여 완전한 생산 체인과 장기적 안정을 중시합니다."
 eu5ab_ranking_mode_actual_profit_desc: "템플릿 및 안전 규칙으로 후보 프로젝트를 필터링하고 풍차의 자원 이득 및 곡물 저장고의 식량 부패 방지 가치를 포함한 예상 월간 순이득을 기준으로 건설 우선순위를 지정합니다. 예상 이득이 비슷할 경우 템플릿에 구성된 우선순위가 2차 기준이 됩니다."
 eu5ab_ranking_mode_actual_profit_scope_desc: "지점 및 일반 건설 유형별로 설정된 3~30개의 대체 후보를 유지합니다. 긴급 식량 보호와 자동 건설 순서가 우선하며, 착공 전 수익 및 건설 조건을 충족해야 합니다. RGO는 부족, 가격, 고용 및 전략적 필요에 따라 별도로 평가됩니다."
 eu5ab_ranking_mode_help: "결정 전략\nCommunity Mod Framework → 모드 설정 → 고급 자동 건설 → 안전 및 순위 → 건설 결정 전략에서 전략을 변경합니다.\n• 공급 및 수요 계획: 시장 수요와 공급, 완전한 생산 사슬, 장기적인 경제 안정을 강조합니다.\n• 예측 이익: 풍차 이득과 곡물 저장고 부패 절감을 포함한 예상 월간 순이득을 사용하며, 동점 시 템플릿 우선순위를 기준으로 사용합니다."
 eu5ab_workforce_section_title: "노동력"
 eu5ab_pause_workforce_short_desc: "노동력 부족이 건설을 직접 차단할지 여부를 설정합니다."
 eu5ab_job_fill_deadline_label: "노동력 예측 기간"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0]개월"
 eu5ab_job_fill_deadline_value: "노동력 예측 기간: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0]개월"
 eu5ab_job_fill_deadline_desc: "노동력의 최대 예측 기간을 개월 단위(0~240개월)로 설정합니다. 0이면 현재 이용 가능한 노동자만 계산하고 향후 계층 승격 인구는 포함하지 않습니다. 노동력 부족으로 착공을 막을지는 「노동력 부족 시 중지」 설정이 결정합니다. 켜져 있으면 예상 노동력이 부족할 때 착공을 막고, 꺼져 있으면 부족으로 인해 건설 우선순위만 낮아집니다."
