 eu5ab_governor_local_candidate_1_breakdown: "종합 점수 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = 자체 근접도 개선 효과 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + 주변 지점 근접도 개선 효과 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\n해당 지점을 포함하여 총 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0]개 지점의 근접도가 개선될 것으로 예상됩니다.\n점수는 각 지점의 가치에 예상 근접도 상승률을 곱하여 산출한 추정치이며 최종 지배 수치가 아닙니다. 현재 지배은 가감되지 않으며, 실제 지배은 최대 지배 등 기본 게임 메커니즘을 통해 지속적으로 변화합니다."
 eu5ab_governor_local_candidate_2_breakdown: "종합 점수 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = 자체 근접도 개선 효과 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + 주변 지점 근접도 개선 효과 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\n해당 지점을 포함하여 총 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0]개 지점의 근접도가 개선될 것으로 예상됩니다.\n점수는 각 지점의 가치에 예상 근접도 상승률을 곱하여 산출한 추정치이며 최종 지배 수치가 아닙니다. 현재 지배은 가감되지 않으며, 실제 지배은 최대 지배 등 기본 게임 메커니즘을 통해 지속적으로 변화합니다."
 eu5ab_governor_local_candidate_3_breakdown: "종합 점수 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = 자체 근접도 개선 효과 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + 주변 지점 근접도 개선 효과 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\n해당 지점을 포함하여 총 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0]개 지점의 근접도가 개선될 것으로 예상됩니다.\n점수는 각 지점의 가치에 예상 근접도 상승률을 곱하여 산출한 추정치이며 최종 지배 수치가 아닙니다. 현재 지배은 가감되지 않으며, 실제 지배은 최대 지배 등 기본 게임 메커니즘을 통해 지속적으로 변화합니다."
 eu5ab_governor_naval_candidate_1_breakdown: "종합 점수 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = 부지 근접도 개선 이득 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + 주변 근접도 개선 이득 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\n근접도는 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0]개 지점(해당 부지 포함)에서 개선될 것으로 예상됩니다.\n점수는 지점 가치에 예상 근접도 증가량을 곱하여 추정한 값이며 최종 지배 수치와 일치하지 않습니다. 현재 지배는 점수를 가감하지 않으며, 실제 지배는 최대 지배 및 일반 게임 메커니즘을 통해 계속 변화합니다."
 eu5ab_governor_naval_candidate_2_breakdown: "종합 점수 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = 부지 근접도 개선 이득 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + 주변 근접도 개선 이득 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\n근접도는 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0]개 지점(해당 부지 포함)에서 개선될 것으로 예상됩니다.\n점수는 지점 가치에 예상 근접도 증가량을 곱하여 추정한 값이며 최종 지배 수치와 일치하지 않습니다. 현재 지배는 점수를 가감하지 않으며, 실제 지배는 최대 지배 및 일반 게임 메커니즘을 통해 계속 변화합니다."
 eu5ab_governor_naval_candidate_3_breakdown: "종합 점수 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = 부지 근접도 개선 이득 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + 주변 근접도 개선 이득 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\n근접도는 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0]개 지점(해당 부지 포함)에서 개선될 것으로 예상됩니다.\n점수는 지점 가치에 예상 근접도 증가량을 곱하여 추정한 값이며 최종 지배 수치와 일치하지 않습니다. 현재 지배는 점수를 가감하지 않으며, 실제 지배는 최대 지배 및 일반 게임 메커니즘을 통해 계속 변화합니다."
