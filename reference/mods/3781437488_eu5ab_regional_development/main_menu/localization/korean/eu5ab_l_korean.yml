 eu5ab_diag_result_help: "활성화된 식량 보호가 적용되면 식량 관련 프로젝트를 우선합니다. 나머지 프로젝트는 자동 건설 순서를 따르며, 착공할 수 없으면 대체 후보를 시도합니다.\nR.G.O.는 부족량, 가격, 고용 및 전략적 수요에 따라 평가되며 게임의 건설 요건을 충족해야 합니다.\n착공에 성공한 경우에만 예산과 건설 슬롯을 사용합니다. 새 프로젝트가 배정된 지점은 라운드 종료 후 3개월 동안 추가 건설을 기다립니다."
 eu5ab_diag_rgo_title: "R.G.O. 후보 검사"
 eu5ab_diag_rgo_short_desc: "각 지점은 결과 하나만 기록하며 탈락 시 첫 번째 사유로 집계합니다."
 eu5ab_diag_rgo_help: "최근 R.G.O. 확장 검사 결과를 표시합니다. 기존 일자리는 모두 채워져 있어야 합니다. 인구 고려 모드는 새 노동자를 예측하지만 완화 모드는 예측하지 않습니다. 가격, 아직 실현되지 않은 생산량 증가분 및 현재 노동자 부족이 우선순위에 영향을 줍니다. 생산량 증가분은 같은 시장에서 같은 재화를 생산하는 모든 소유 프로젝트를 합산합니다. 데이터가 불완전하면 확인된 수량만 표시합니다. 한도에 도달하면 신규 착공을 중단하지만 진행 중인 프로젝트는 계속됩니다."
