 eu5ab_open_confirmation: "확인 이벤트 열기"
 eu5ab_reset_confirm: "초기화 확인"
 eu5ab_reset_confirm_desc: "템플릿과 설정은 유지하지만 지점 할당, 계획, 대기 기간, 보고서, 총독부 추천, 진행 중인 공사 및 연간 지출 기록을 삭제합니다. 사용한 금화는 환불되지 않으며 기존 공사는 계속 진행됩니다. 이후 템플릿을 다시 할당해야 합니다.\n국가를 전환한 경우, 전환 전에 저장된 템플릿과 설정으로 현재 국가의 해당 설정을 대체합니다."
 eu5ab_deep_confirm_desc: "활성화된 템플릿을 사용하는 전국의 소유 지점을 재점검하고 이번 달의 미실행 계획을 대체합니다. 현재 전략, 긴급 식량 보호 및 건설 순서를 적용하며 마지막 프로젝트는 잔여 예산을 초과할 수 있습니다.\n영토가 넓은 국가는 시간이 걸릴 수 있으며 계획이 완료될 때까지 창을 닫을 수 없습니다. 저장 후에는 이번 달의 설정 변경이 이 계획에 영향을 미치지 않습니다. 23일부터 착공을 진행하며 다음 달에 정기 검사를 재개합니다."
 eu5ab_decision_continue: "계속하여 계산 시작"
 eu5ab_decision_cancel: "취소"
 eu5ab_decision_done: "완료"
 eu5ab_deep_event_finish: "완료"
 eu5ab_deep_event_cancel: "취소"
 eu5ab_manual_before_23: "매월 23일 이전에 사용해야 합니다 (1~22일)"
 eu5ab_manual_not_dispatched: "이번 달 건설 지침이 아직 시작되지 않았습니다"
 eu5ab_manual_waiting: "이번 달 건설 계획을 수립 중입니다. 잠시 기다려 주십시오. 완료되면 이 창을 닫을 수 있습니다."
 eu5ab_manual_rgo: "R.G.O. 확장"
 eu5ab_manual_expired: "게임 날짜가 다음 달로 넘어갔습니다. 이 미실행 계획은 만료되었으며 정상 일정이 재개되었습니다."
 eu5ab_manual_results: "이번 달 계획이 저장되었습니다.\n계획된 프로젝트: [Player.MakeScope.ScriptValue('eu5ab_manual_count_ui')|0]건\n예상 지출: [Player.MakeScope.ScriptValue('eu5ab_manual_cost_ui')|2]\n23일부터 착공이 진행됩니다. 0건은 적격한 프로젝트가 없음을 의미합니다."
 eu5ab_reset_decision.title: "자동 건설 초기화"
 eu5ab_reset_decision.desc: "템플릿과 설정은 유지하고 지점 할당을 해제하며 건설 기록을 초기화합니다. 이후 템플릿을 다시 할당해야 합니다."
 eu5ab_deep_decision.title: "이번 달 전국 건설 재계획"
 eu5ab_deep_decision.desc: "활성화된 템플릿을 사용하는 전국의 소유 지점을 재평가하여 이번 달 계획을 저장하고 23일부터 착공을 진행합니다."
