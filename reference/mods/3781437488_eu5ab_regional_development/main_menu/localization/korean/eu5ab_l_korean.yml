 eu5ab_cmm_shift_increase_10: "10 증가"
 eu5ab_cmm_shift_decrease_10: "10 감소"
 eu5ab_cmm_shift_increase_1000: "1000 증가"
 eu5ab_cmm_shift_decrease_1000: "1000 감소"
 eu5ab_cmm_shift_increase_max: "최댓값으로 설정"
 eu5ab_cmm_shift_decrease_min: "최솟값으로 설정"
 eu5ab_regional_development__automation__rgo_desc: "기존 일자리가 가득 찬 후에만 R.G.O. 확장을 고려합니다. 새 일자리에 필요한 노동자를 예측할지 여부를 선택합니다."
 eu5ab_regional_development__rgo_workforce_mode_name: "R.G.O. 노동력 모드"
 eu5ab_regional_development__rgo_forced_relaxed_name: "R.G.O. 모드: 완화 (노동력 일시정지 비활성화)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "노동력을 예측하지 않습니다. 기존 일자리는 가득 차 있어야 하며, 새 일자리의 부족은 건설 우선순위만 낮춥니다."
 eu5ab_regional_development__rgo_workforce_mode_desc: "기본값은 '완화'입니다. 노동력 보호를 비활성화하면 일시적으로 '완화' 모드가 사용되며 현재 노동자 부족으로 인해 우선순위가 낮아집니다. 다시 활성화하면 선택한 모드로 복원됩니다. 기존 일자리는 항상 가득 차 있어야 합니다."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "완화"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "게임의 일반적인 확장 규칙을 따릅니다. 기존 일자리가 가득 차면 새 노동자를 예측하지 않고 가격, 시장 수요 및 예상 생산량을 평가합니다. 노동력 보호가 활성화된 경우 새 일자리의 인력 부족으로 우선순위가 낮아지지 않습니다."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "인구 고려"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "기존 일자리가 완전 고용 상태인지 확인한 후, 예측 기간 내에 승격 가능한 적격 인구를 추정합니다. 노동자가 다음 단계를 채울 수 없다면 일시 중단합니다."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "R.G.O. 인구 예측 기간 (개월)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "'인구 고려' 모드에서는 이 기간 내에 새 일자리를 채울 수 있는 충분한 노동자가 예상되어야 확장됩니다. 기본값: 180개월. 범위: 0~1200개월이며 0은 현재 이용 가능한 노동자만 계산합니다. 추정치는 풍성한 기회, 문해력 및 전직 적격 인구를 고려합니다. 예측 기간이 길어질수록 실제 결과와 차이가 커질 수 있습니다. 클릭 시 1개월, Ctrl 누른 채 클릭 시 12개월, Shift 누른 채 클릭 시 120개월 단위로 조정합니다."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "활성화하면 일반 건물은 충분한 예상 노동력이 필요하며 RGO는 선택한 모드를 사용합니다. 이를 비활성화하면 예측이 중단되고 RGO는 일시적으로 '완화' 모드를 사용합니다. 현재 인력 부족은 우선순위만 낮추며 그 자체로 신규 프로젝트를 차단하지는 않습니다. 기존 R.G.O. 일자리는 여전히 가득 차 있어야 합니다. 다시 활성화하면 이전 R.G.O. 모드가 복원됩니다."
 eu5ab_regional_development__job_fill_deadline_months_name: "일반 건물 노동력 예측 기간 (개월)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "일반 건물을 위한 독립적인 기간입니다. 기본값은 12개월이며 범위는 0~240개월입니다. 0은 현재 자격을 갖춘 유휴 노동자만 계산합니다. 인구를 고려하는 RGO는 별도의 기간을 사용합니다. 현재 승격 속도는 추정치이며 미래의 충원을 보장하지 않습니다."
 eu5ab_regional_development__price_min_desc: "기본값: 기본 가격의 80%. 낮은 가격은 우선순위를 낮춥니다. 모든 산출물이 기준치 이하일 경우 건설을 일시 중단합니다. 여러 산출물은 수량과 기본 가격으로 가중 평가합니다. 100% 이상일 때는 기준치만 적용됩니다. 활성화된 긴급 식량 보호는 가격 제한을 면제할 수 있습니다."
 eu5ab_regional_development__price_max_desc: "기본값: 125%. 기본 가격을 초과하는 가격은 기준값까지 점진적으로 우선순위 가산점을 부여합니다. 125% 기준에서 가격이 112.5%이면 70점이 가산되고, 125% 이상이면 140점이 가산됩니다. 기준값이 100% 이하인 경우 기본 가격을 초과하면 140점이 가산됩니다."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
