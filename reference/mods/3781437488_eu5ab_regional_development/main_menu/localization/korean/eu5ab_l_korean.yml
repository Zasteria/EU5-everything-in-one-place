 eu5ab_regional_development__governors_name: "총독부 추천"
 eu5ab_regional_development__governors__recommendations_name: "추천 및 새로고침"
 eu5ab_regional_development__governors__recommendations_desc: "건물을 직접 건설, 철거 또는 이전하지 않고 지방 총독부 및 해상 총독부 후보 지점을 분석합니다."
 eu5ab_regional_development__governors__scoring_name: "점수 평가 설정"
 eu5ab_regional_development__governors__scoring_desc: "지점 가치 가중 방식과 제한된 전략적 가치 반영 여부를 선택합니다."
 eu5ab_regional_development__governor_recommendations_enabled_name: "총독부 추천 활성화"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "지방 및 해상 총독부 입지를 주기적으로 제안합니다. 비활성화하면 마지막 결과는 유지되지만 추천 알림은 표시되지 않습니다."
 eu5ab_regional_development__governor_refresh_interval_name: "새로고침 주기"
 eu5ab_regional_development__governor_refresh_interval_desc: "총독부 추천의 갱신 주기를 설정합니다. 영토, 수도, 지점 등급 및 정부 형태의 일부 변경 사항은 조기 갱신을 유발할 수 있습니다. 도로 및 기타 근접도 변화는 정기 평가에 포함됩니다."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "매월"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "변화를 가장 빠르게 반영하며 소규모 국가에 적합합니다. 잦은 검사는 대규모 국가에서 더 긴 지연을 유발할 수 있습니다."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "3개월마다"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "도로 변화 반응성과 대규모 국가 성능 간의 균형."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "6개월마다"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "대규모 국가를 위한 낮은 재계산 빈도."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "12개월마다"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "가장 낮은 연산 비용이지만 도로 및 근접도 변화 반영에 최대 1년이 걸릴 수 있습니다."
 eu5ab_regional_development__governor_refresh_now_name: "지금 재계산"
 eu5ab_regional_development__governor_refresh_now_text: "지금 재계산"
 eu5ab_regional_development__governor_refresh_now_desc: "일시 정지 중에도 지방 총독부 및 해상 총독부 추천지를 즉시 다시 계산합니다. 대규모 국가에서는 일시적으로 지연이 발생할 수 있습니다."
 eu5ab_regional_development__governor_scoring_profile_name: "지점 가치 프로필"
 eu5ab_regional_development__governor_scoring_profile_desc: "잠재적 세원, 인구, 발전도의 상대적 가중치를 조절합니다. 점수는 지점 가치와 예상 근접도 개선을 종합하여 추정되며, 최종 지배 수치가 아닙니다. 현재 지배은 가감되지 않습니다."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "혼합"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "경제적 가치와 행정·인구 가치의 균형을 맞춥니다."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "경제"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "잠재 과세 자산과 기존 경제 규모를 강조합니다."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "행정·인구"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "인구와 개발을 강조합니다."
 eu5ab_regional_development__governor_strategic_value_name: "전략적 가치 반영"
 eu5ab_regional_development__governor_strategic_value_desc: "항구, 국경 지점, 요새화된 지점에 제한된 가중치를 부여합니다. 이는 지점 가치만 조정하며 별도의 점수 항목이 아닙니다."
 eu5ab_governor_window_title: "총독부 추천 세부 정보"
 eu5ab_governor_window_intro: "신규 부지 및 이전 제안을 확인합니다. 건물 변경은 플레이어의 판단에 따릅니다."
 eu5ab_governor_road_tier_help: "추정치는 해금된 최고 등급 도로를 기준으로 계산되며, 실제 이득은 다를 수 있습니다.\n각 계획은 다른 총독부 유형을 고정합니다. 변경 후 다시 계산해야 하며 이득은 합산되지 않습니다."
 eu5ab_governor_refresh_button: "재계산"
 eu5ab_governor_refresh_button_tt: "지방 및 해상 총독부의 신규 부지, 이전 및 배치 계획을 재평가합니다. 대규모 국가에서는 일시적인 지연이 발생할 수 있으며 미완료 시 알림이 표시됩니다."
 eu5ab_governor_local_section: "지방 총독부"
 eu5ab_governor_local_diagnostics: "최근 지방 총독부 계산: 단계 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0], 상태 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0]; 수용량 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0], 엔진 집계 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0]개 지방 총독부 및 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0]개 지방 총독청; 기타 점유 슬롯 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0].\n지점별 집계: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0]개 지방 총독부 및 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0]개 지방 총독청; 기타 점유 슬롯 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0]; 잔여 슬롯(엔진/지점) [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0]; 불일치 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0] (1은 다름).\n신규 후보지 이득 기준치 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1]; 후보지 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0]개, 평가 완료 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]개."
