 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "모든 템플릿이 공유하는 예산, 건설 조건, 결정 전략 및 성능을 설정합니다. 각 템플릿은 활성 상태, 범위 및 우선순위를 따로 저장합니다."
