 eu5ab_deadline_6: "6개월"
 eu5ab_deadline_12: "12개월"
 eu5ab_toggle_stop_input_shortage: "핵심 투입물 부족 시 건설 중단"
 eu5ab_prediction_status_label: "노동력 추정 방식"
 eu5ab_status_promotion_forecast: "#G 선택 기간의 승격 예측#!"
 eu5ab_status_conservative_fallback: "#L 현재 노동력 기준 보수적 추정#!"
 eu5ab_prediction_promotion_short_desc: "현재 가용 노동력과 예측 기간 내 대상 계층으로 승격 예정인 인구를 합산합니다 (최대 240개월)."
 eu5ab_prediction_unavailable_short_desc: "미래 예측이 불가능한 경우 현재 가용 노동력만으로 보수적으로 판단합니다."
 eu5ab_native_input_section_title: "현지 원료 선호"
 eu5ab_native_input_short_desc: "같은 지방의 원료를 사용하는 생산 건물의 순위를 높입니다."
 eu5ab_native_input_priority_label: "현지 원료 우선순위"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "현지 원료 우선순위: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "지역 원자재 선호도\n'지역'은 건물이 위치한 지방을 의미합니다. 시스템은 건물의 제조법에 필요한 원자재를 확인하고 해당 지방에 일치하는 R.G.O.가 존재할 경우 순위 보너스를 부여합니다. 제조법에서 차지하는 비중이 큰 원자재일수록 더 높은 보너스를 받습니다.\n• 0은 지역 원자재를 무시하고, 5는 기본 권장값이며, 10은 최대 가중치를 부여합니다.\n• 이 설정은 순위 점수에만 영향을 미치며, 실제 건설은 기타 부족, 수익, 노동력 및 기본 게임 조건의 적용을 받습니다.\n• 일치하는 R.G.O.의 존재 여부만 확인하며 등급이나 생산량은 고려하지 않습니다.\n• 투입재 부족, 낮은 시장 접근성 또는 낮은 지배는 보너스를 감소시킵니다. R.G.O. 자체는 이 보너스를 받지 않습니다. 사용 가능한 생산 방식을 기준으로 추정하며, 생산 방식을 자동으로 변경하지 않습니다."
 eu5ab_price_section_title: "가격 범위"
 eu5ab_price_short_desc: "시장 가격으로 생산 건물을 필터링하고 순위를 정합니다."
 eu5ab_price_min_label: "최저 가격"
 eu5ab_price_max_label: "고가 기준"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "기본 가격을 100%로 간주합니다. 낮은 가격은 우선순위를 낮추며 모든 산출물이 최저 가격 이하인 경우 건설을 일시 중단합니다. 여러 산출물은 수량과 기본 가격으로 가중 평가합니다. 높은 가격 가산점은 기준값에서 상한에 도달하며 가격이 너무 높다고 해서 건설이 차단되지는 않습니다. 산출 상품이 없는 건물은 제외됩니다. 긴급 식량 보호는 설정된 대로 적용됩니다."
 eu5ab_active_cash_value: "국고 준비금: [GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "최저 가격: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "고가 기준: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0Y]%"
