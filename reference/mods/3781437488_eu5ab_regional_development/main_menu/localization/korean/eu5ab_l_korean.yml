 eu5ab_regional_development__performance_name: "성능 최적화"
 eu5ab_regional_development__performance__preset_name: "성능 사전 설정"
 eu5ab_regional_development__performance__preset_desc: "사전 설정은 아래 옵션을 함께 조정합니다. 고급 설정을 직접 바꾸면 사용자 지정으로 전환되고 다음 월간 검사부터 적용됩니다."
 eu5ab_regional_development__performance__advanced_name: "고급 설정"
 eu5ab_regional_development__performance__advanced_desc: "일일 지점 검사 수, 라운드당 신규 프로젝트 수 및 대체 후보 수를 조정합니다. 검사하고 비교하는 프로젝트가 많을수록 시간이 더 걸릴 수 있습니다."
 eu5ab_regional_development__general__limits_name: "일반 제어 및 동시 건설 한도"
 eu5ab_regional_development__general__limits_desc: "Mod의 작동 여부 및 본 Mod가 동시에 관리할 수 있는 민간 공사 총한도를 설정합니다."
 eu5ab_regional_development__general__returns_name: "수익 규칙 및 긴급 완화"
 eu5ab_regional_development__general__returns_desc: "일반 생산 건물의 최저 수익과 식량, 건설재, 군수품 또는 전략 투입재 부족 시 완화 여부를 설정합니다."
 eu5ab_regional_development__finance__budget_name: "공유 연간 예산"
 eu5ab_regional_development__finance__budget_desc: "모든 템플릿, 건물 및 RGO가 하나의 국가 연간 예산을 공유합니다."
 eu5ab_regional_development__finance__market_name: "시장 가격 범위"
 eu5ab_regional_development__finance__market_desc: "기본 가격 대비 공유 최저 가격 및 고가 기준 비율을 설정합니다."
 eu5ab_regional_development__automation__safety_name: "건설 안전 규칙"
 eu5ab_regional_development__automation__safety_desc: "특수 건물, 상류 보완, 노동력 및 투입재 부족에 관한 공유 안전 규칙입니다."
 eu5ab_regional_development__automation__rgo_name: "R.G.O. 확장"
 eu5ab_regional_development__automation__workforce_name: "노동력 예측"
 eu5ab_regional_development__automation__workforce_desc: "향후 노동력 공급을 추정할 때 허용할 최대 예측 기간을 설정합니다."
 eu5ab_regional_development__automation__ranking_name: "건설 결정 전략"
 eu5ab_regional_development__automation__ranking_desc: "일반 건물 전략, 업그레이드·확장·R.G.O.·신규 건설 순서 및 현지 투입재 영향을 설정합니다."
 eu5ab_regional_development__candidate_ranking_mode_name: "일반 건물 전략"
 eu5ab_regional_development__candidate_backfill_enabled_name: "기타 프로젝트 시도"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "현재 유형의 상위 프로젝트가 착공할 수 없는 경우 순위가 낮은 대체 후보를 시도합니다. 지점당 라운드별로 수급 계획의 경우 최대 2회, 예측 이익의 경우 최대 5회의 추가 시도 횟수가 주어지며 일반 건물 유형 전체에서 공유됩니다. 해당 지점에서 일반 건물이 착공하면 중단됩니다. 저장 데이터를 불러와도 시도 횟수는 복원되지 않습니다. 모든 요건은 계속 적용됩니다. 기본적으로 비활성화되어 있으며 다음 라운드부터 적용되고 검사 시간이 늘어날 수 있습니다."
 eu5ab_regional_development__candidate_ranking_mode_desc: "요건을 충족하는 일반 건물의 우선순위 지정 방식을 선택합니다. 긴급 식량 보호와 자동 건설 순서가 우선합니다. RGO는 부족, 가격, 고용 및 전략적 필요에 따라 별도로 평가됩니다."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "수요·공급 계획"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "시장 부족, 전략 수요, 생산식 효율, 현지 원료, 가격 및 노동력 위험을 종합해 순위를 정하고 완전한 산업망과 장기 안정을 중시합니다."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "예측 이익"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "템플릿 및 안전 규칙으로 후보를 필터링하고 풍차 이득 및 곡물 저장고 절감 식량을 포함한 예상 월간 순이득으로 건설 우선순위를 지정합니다. 이득이 비슷할 경우 템플릿 우선순위가 2차 기준이 됩니다."
 eu5ab_regional_development__automation__candidate_priority_name: "자동 건설 순서"
 eu5ab_regional_development__automation__candidate_priority_desc: "4가지 건설 유형(건물 업그레이드, 일반 확장, R.G.O. 확장, 신규 건축)을 원하는 순서로 드래그하십시오. 현재 유형의 착공 가능한 프로젝트를 모두 진행한 후 다음 유형으로 이동합니다. 식량 위기 시 식량 프로젝트가 우선 처리되지만 이 순서를 준수합니다."
 eu5ab_regional_development__candidate_priority_name: "자동 건설 순서"
 eu5ab_regional_development__candidate_priority_desc: "끌어서 업그레이드, 일반 확장, R.G.O. 확장 및 신규 건설 순서를 정합니다."
 eu5ab_regional_development__candidate_priority_item_column_name: "건설 유형"
 eu5ab_regional_development__candidate_priority_i1_name: "건물 업그레이드"
 eu5ab_regional_development__candidate_priority_i1_desc: "구식 건물을 업그레이드 계열에서 해금된 최신 단계로 교체합니다."
 eu5ab_regional_development__candidate_priority_i2_name: "기존 건물 확장"
 eu5ab_regional_development__candidate_priority_i2_desc: "기존 일반 건물에 단계를 추가합니다. 교체 업그레이드와 RGO는 제외됩니다."
 eu5ab_regional_development__candidate_priority_i3_name: "R.G.O. 확장"
 eu5ab_regional_development__candidate_priority_i3_desc: "현지 RGO를 확장하며 기존 일자리의 완전 고용과 가격, 연간 건설 예산, 국고 준비금 및 기타 규칙 준수가 필요합니다."
 eu5ab_regional_development__candidate_priority_i4_name: "신규 건물 건설"
 eu5ab_regional_development__candidate_priority_i4_desc: "해당 지점에 아직 없는 일반 건물을 새로 건설합니다."
 eu5ab_regional_development__enabled_name: "자동 건설 활성화"
 eu5ab_regional_development__enabled_desc: "마스터 토글입니다. 비활성화해도 템플릿 설정과 지점 할당은 유지되지만 매월 자동 건설 검사는 중단됩니다."
 eu5ab_regional_development__monthly_build_hard_cap_name: "추가 동시 건설 사업"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "기본 1개 슬롯 외에 본 Mod가 동시에 진행할 수 있는 민간 프로젝트 수. 0은 총 1개, 599는 600개를 의미합니다. 수동 건설, 도로 및 타 Mod는 이 한도를 사용하지 않습니다."
 eu5ab_regional_development__budget_mode_name: "연간 예산 방식"
 eu5ab_regional_development__budget_mode_desc: "고정 금액 또는 월간 총수입의 4배, 6배, 8배로 연간 예산을 정합니다. 새해 첫 번째 검사 시 재계산되며, 연중에 설정을 변경해도 이미 기록된 지출은 유지됩니다."
 eu5ab_regional_development__budget_mode_option_1_name: "고정 연간 예산"
 eu5ab_regional_development__budget_mode_option_2_name: "월간 수입 ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "월간 수입 ×6(권장)"
 eu5ab_regional_development__budget_mode_option_4_name: "월간 수입 ×8"
 eu5ab_regional_development__economic_metric_name: "일반 건물 경제성 기준"
 eu5ab_regional_development__economic_metric_desc: "일반 생산 건물은 선택한 조건인 양의 예상 월간 수입 또는 이익, 혹은 연환산 수익률 5%를 충족해야 합니다. 실제 수익은 달라질 수 있습니다. 일반 공공 기반 시설은 면제됩니다. 풍차는 추가 생산으로 인한 순이익이 양수여야 하며 수익률 모드에서는 연간 수익률 5%도 필요합니다. 부패 손실을 줄이기 위해 짓는 곡물 저장고는 항상 5%가 필요합니다. R.G.O.에는 별도의 규칙이 적용됩니다."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! 월간 수입 > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "게임이 양의 월간 수입을 예측할 때만 착공합니다."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! 월간 이익 > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "게임이 양의 월간 총이익을 예측할 때만 착공합니다."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! 연환산 수입 수익률 ≥ 5%"
 eu5ab_regional_development__economic_metric_option_3_desc: "예상 월 수입이 건설 비용의 5%÷12 이상이어야 이 요건을 충족합니다. 이는 운영 비용을 차감하지 않고 수입만을 비교한 것입니다. "
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! 연환산 이익 수익률 ≥ 5%"
 eu5ab_regional_development__economic_metric_option_4_desc: "예상 월 이익이 건설 비용의 5%÷12 이상이어야 이 요건을 충족합니다. 실제 이익은 운영 상황에 따라 변동될 수 있습니다."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "식량 고갈 예상: 우선 건설, 수익 무시"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "식량 고갈이 예상되면 식량 사업을 우선하고 일반 식량 건물의 수익 조건을 면제합니다. 순서와 다른 모든 규칙은 유지됩니다."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "식량 25% 이하: 우선 건설, 수익 무시"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "시장 식량 비축량이 25% 이하로 떨어지면 식량 프로젝트를 최우선으로 처리하고 일반 식량 건물의 수익성 기준을 면제합니다. 자동 건설 순서와 안전 규칙은 계속 적용됩니다."
 eu5ab_regional_development__emergency_construction_goods_override_name: "건설재 공급 65% 미만: 수익 무시"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "목재, 석재, 도구 등 핵심 건설 자재의 시장 공급률이 65% 미만인 경우, 해당 자재를 생산하는 건물은 수익성 기준 검사를 면제받습니다. 기타 모든 건설 규칙은 유지됩니다."
 eu5ab_regional_development__emergency_wartime_military_override_name: "전시 군수품 공급 65% 미만: 수익 무시"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "전시 상태에서 군수품 시장 공급률이 65% 미만일 때 해당 군수품 생산 건물은 수익성 기준을 면제받습니다. 기타 건설 규칙은 계속 유효합니다."
 eu5ab_regional_development__emergency_strategic_input_override_name: "전략 생산 투입재 부족: 상류 수익 무시"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "원자재의 시장 공급량이 수요의 65% 미만이고, 같은 시장에 해당 원자재를 소비하면서 폐쇄되지 않은 상태로 투입품 부족을 겪는 자국의 식량·핵심 건설 자재·군수품 생산 건물이 있으면, 해당 원자재의 상류 생산 건물은 선택한 수익성 기준을 면제받습니다. 하류 건물이 이미 생산을 중단했을 필요는 없으며, 부족한 투입품이 반드시 해당 원자재일 필요도 없습니다. 다른 모든 건설 규칙은 그대로 적용됩니다."
 eu5ab_regional_development__fixed_annual_budget_name: "고정 연간 예산"
 eu5ab_regional_development__fixed_annual_budget_desc: "고정 예산 방식에서만 사용하며 모든 템플릿이 이 금액을 공유합니다."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "최저 국고 준비금"
 eu5ab_regional_development__min_cash_reserve_desc: "계획된 모든 프로젝트의 예상 비용을 제외한 후에도 이 국고 준비금을 유지합니다. 실제 R.G.O. 비용은 다를 수 있습니다."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "최저 가격 비율"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "고가 기준 비율"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "특수 건물 허용"
 eu5ab_regional_development__allow_special_buildings_desc: "특수 건물을 후보로 고려합니다. 게임의 건설 조건은 유지됩니다."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "여유 건설 슬롯으로 시장 부족 산업 보충"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "일반 프로젝트를 배정한 후 남은 건설 슬롯을 사용하여 같은 시장에서 이번 라운드에 검사한 소유 지점의 부족분을 보충합니다. 계획된 프로젝트의 투입재 수요와 아직 실현되지 않은 생산량 증가분을 고려합니다. 기본 프리셋은 계획에 없던 산업도 추가할 수 있습니다. 금지 설정, 사용자 지정 우선순위 0 및 기타 건설 요건은 계속 적용됩니다."
 eu5ab_regional_development__auto_build_input_sources_name: "부족 시 상류 산업 건설"
 eu5ab_regional_development__auto_build_input_sources_desc: "원자재 시장 부족을 독립적으로 확인하고 기존 하류 건물이 완전 고용 상태이지만 여전히 원자재가 부족한 경우에도 템플릿에서 허용된 상류 공급 시설의 건설을 시도합니다. 건물의 잠금 해제 및 모든 건설 조건은 계속 적용됩니다."
 eu5ab_regional_development__pause_low_workforce_name: "노동력 부족 시 중지"
 eu5ab_regional_development__stop_input_shortage_name: "핵심 투입재 부족 시 중지"
 eu5ab_regional_development__stop_input_shortage_desc: "활성화하면 필요한 핵심 산업 원자재의 시장 공급이 수요의 75% 이상을 충족해야 관련 공사를 진행할 수 있습니다."
 eu5ab_regional_development__allow_rgo_name: "R.G.O. 확장 허용"
 eu5ab_regional_development__allow_rgo_desc: "모든 템플릿에서 R.G.O. 확장을 후보로 고려하도록 허용합니다."
 eu5ab_regional_development__native_input_priority_name: "현지 원료 우선순위"
 eu5ab_regional_development__native_input_priority_desc: "0–10; 수치가 높을수록 동일 지방에서 생산된 원자재를 직접 소비할 수 있는 건물의 우선순위가 높아집니다."
 eu5ab_regional_development__performance_preset_name: "성능 사전 설정"
 eu5ab_regional_development__performance_preset_desc: "사전 설정은 아래 고급 옵션을 동기화합니다. 사용자 지정은 현재 값을 유지합니다."
 eu5ab_regional_development__performance_preset_option_1_name: "보수적"
 eu5ab_regional_development__performance_preset_option_1_desc: "하루 최대 10개 지점, 실행당 최대 30개 사업. 계획 후보 5개, 이익 후보 15개. 후보가 충분하면 남은 검사를 중지합니다."
 eu5ab_regional_development__performance_preset_option_2_name: "균형"
 eu5ab_regional_development__performance_preset_option_2_desc: "하루 최대 20개 지점, 실행당 최대 50개 사업. 계획 후보 4개, 이익 후보 12개. 후보가 충분하면 남은 검사를 중지합니다."
 eu5ab_regional_development__performance_preset_option_3_name: "최대 처리량"
 eu5ab_regional_development__performance_preset_option_3_desc: "적용 지점이 많은 국가용입니다. 하루 최대 30개 지점, 실행당 착공 수 무제한. 계획 후보 3개, 이익 후보 10개. 후보가 충분하면 중지합니다."
 eu5ab_regional_development__performance_preset_option_4_name: "사용자 지정"
 eu5ab_regional_development__performance_preset_option_4_desc: "현재 고급 설정을 사용합니다."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "템플릿 적용 지점이 많으면 게임 성능이 저하될 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "최대 처리량 모드에서는 매일 최대 30개 지점을 검사하며 1회당 한도가 없습니다. 영토가 매우 방대한 국가는 월말 틱 시간이 늘어날 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_action_name: "'수급 계획' 처리 지연 시: '계획 후보 수'를 낮추십시오."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "수요·공급 계획에서만 표시됩니다. 계획 후보 수를 줄이면 지점 및 일반 건설 유형별 후속 검사 사업 수가 줄어듭니다."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "결과: 대체 후보 수가 줄어들어 이후의 실행 가능한 프로젝트를 놓칠 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "프로젝트는 계획 점수 순으로 검사됩니다. 후보 한도를 줄이면 상위 프로젝트가 실패했을 때 대체할 후보가 줄어들어 후속 유효 프로젝트를 놓칠 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "“예측 이익” 처리가 느리면 “지점당 이익 후보” 값을 낮추십시오."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "“예측 이익” 모드에서만 표시됩니다. “지점당 이익 후보” 값을 낮추면 후속 검사에서 확인하는 대체 후보 수가 줄어듭니다."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "대체 후보가 줄어들어 상위 프로젝트가 착공할 수 없을 때 다른 선택지가 없을 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "예상 이익과 건설 선호도에 따라 순위를 매긴 후 대체 후보가 유지됩니다. 이 수를 줄이면 상위 프로젝트가 차단되었을 때 대체할 수 있는 선택지가 줄어듭니다."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "일일 검사 지점 또는 실행당 추가 수도 줄일 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "일일 검사 지점 수를 줄이면 검사가 더 많은 날짜로 분산됩니다. 신규 프로젝트 한도를 낮추면 1회 실행당 작업이 줄어듭니다. 0으로 설정하면 신규 프로젝트에 제한이 없습니다."
 eu5ab_regional_development__parallel_location_scan_name: "지점을 개별 처리"
 eu5ab_regional_development__parallel_location_scan_desc: "지점을 개별적으로 검사하여 지연을 줄이거나, 매일 단일 단계로 한꺼번에 검사합니다. 우선순위, 예산 및 건설 순서는 동일하게 유지됩니다."
 eu5ab_regional_development__daily_location_task_limit_name: "일일 검사 지점 한도"
 eu5ab_regional_development__daily_location_task_limit_desc: "매일 세부적으로 검사하는 최대 지점 수입니다. 숫자가 낮을수록 하루에 처리하는 작업량은 적어지지만 전국을 스캔하는 데 더 많은 날이 걸립니다."
 eu5ab_regional_development__max_additions_per_run_name: "실행당 최대 추가"
 eu5ab_regional_development__max_additions_per_run_desc: "1회 실행 시 착공 가능한 최대 프로젝트 수(0~600). 0은 무제한을 의미합니다."
 eu5ab_regional_development__candidates_per_location_name: "지점당 계획 후보"
 eu5ab_regional_development__candidates_per_location_desc: "'수급 계획'에서만 적용됩니다. 각 지점 및 일반 건설 범주별로 계획 점수에 따라 후속 조건 검사에 유지할 후보 수(3–30)를 설정합니다. 후보를 많이 남길수록 대체 방안을 놓치지 않지만 성능 부담이 증가합니다."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "지점당 이익 후보"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "예측 이익 모드에만 적용됩니다. 지점과 일반 건설 유형별로 예측 이익 및 건물 선호도에 따라 순위를 매긴 대체 후보 3~30개를 유지합니다. 후보가 많으면 상위 프로젝트가 착공할 수 없을 때 선택지가 늘어나지만 후속 검사가 느려질 수 있습니다."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "후보가 충분하면 검사 중지"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "대체 후보 수가 이번 라운드에 추가할 수 있는 프로젝트 수의 2배에 도달하면 다른 지점의 상세 검사를 중단합니다. 이 수는 빈 건설 슬롯과 실행당 최대 추가 설정으로 결정됩니다. 0은 라운드당 추가 한도만 해제합니다. 건설 요건은 계속 적용됩니다."
 eu5ab_diagnostics_cmm_hint: "공유 규칙은 Community Mod Framework의 모드 설정에서 변경합니다. 건설 보고서는 최근 자동 건설 결과를 표시합니다."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
