 eu5ab_prediction_section_title: "자동 건설 규칙"
 eu5ab_prediction_diagnostics_title: "노동력 추정 및 건설 상태"
 eu5ab_prediction_section_body: "선택한 '자동 건설 순서'에 따라 업그레이드, 일반 확장, R.G.O. 확장 및 신규 건설을 배치하며 현재 유형의 가능한 프로젝트를 먼저 시도합니다.\n활성화된 긴급 식량 보호가 적용되면 관련 식량 프로젝트가 우선 처리되고 설정에 따라 수익성 및 가격 등의 제한이 완화됩니다. 건축 자재, 전시 군수품 또는 전략적 원자재 보호가 활성화된 경우에도 수익 요건이 완화될 수 있습니다.\n예산, 국고 준비금 및 적용 가능한 원자재, 노동력, 건물 한도, 게임 건설 요건은 계속 충족해야 합니다. 일반 건물은 잠금 해제된 최신 단계만 고려되며 업그레이드는 새로 추가된 일자리만 계산합니다."
 eu5ab_diagnostics_title: "자동 건설 상태"
 eu5ab_diagnostics_snapshot_note: "설정은 즉시 저장됩니다. 보고서는 검사 및 착공 진행에 따라 갱신되며 완료 후 결과가 유지됩니다."
 eu5ab_diagnostics_snapshot_help: "보고서는 검사 진행과 착공에 따라 갱신되며 다음 라운드까지 결과를 유지합니다. 프로젝트는 23일부터 배정되므로 건수와 지출은 점진적으로 바뀔 수 있습니다. 검사가 끝날 때까지 일부 결과는 미확정 상태로 남습니다."
