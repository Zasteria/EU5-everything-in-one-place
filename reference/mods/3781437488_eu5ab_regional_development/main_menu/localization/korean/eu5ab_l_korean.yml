 eu5ab_building_rules_title: "건물 규칙"
 eu5ab_building_rules_desc: "첫째 줄에서 노동 계층, 둘째 줄에서 해금 시대를 필터링합니다. 우선순위는 0.0~10.0이며 0은 건설 금지입니다. 특수 페이지에는 국가가 소유한 지점 중 하나 이상에서 건설할 수 있는 특수 건물만 표시됩니다."
