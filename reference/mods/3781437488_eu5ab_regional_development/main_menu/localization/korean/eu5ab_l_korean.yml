 eu5ab_priority_scale_hint: "0은 금지"
 eu5ab_clear_visible_priorities_button: "현재 목록 모두 0으로"
 eu5ab_clear_visible_priorities_tooltip: "현재 필터에서 보이는 모든 건물의 우선순위를 즉시 0으로 만들고 저장합니다. 숨겨진 건물은 변경되지 않습니다."
