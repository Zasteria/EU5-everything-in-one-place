 eu5ab_new_template_plus_button: "+ 새 템플릿"
 eu5ab_new_blank_template_button: "+ 빈 템플릿"
 eu5ab_new_recommended_template_button: "+ 추천 템플릿"
 eu5ab_custom_empty_detail: "왼쪽 목록에서 사용자 지정 템플릿을 선택하거나, 빈 템플릿 또는 권장 우선순위 템플릿을 새로 만드십시오."
 eu5ab_template_intro_title: "템플릿 편집기"
 eu5ab_automation_buildings_intro: "사용자 지정 템플릿을 사용하면 건물 우선순위를 자유롭게 설정하고 지점을 할당할 수 있습니다. 기본 프리셋의 우선순위는 고정되어 있으며, 이를 수정하려면 사용자 지정 템플릿으로 복사하십시오."
 eu5ab_player_templates_button: "사용자 지정 템플릿"
 eu5ab_copy_preset_to_player_button: "사용자 지정 템플릿으로 복사"
 eu5ab_delete_template_button: "템플릿 삭제"
 eu5ab_delete_template_tooltip: "이 사용자 지정 템플릿을 삭제합니다. 확인 후 이 템플릿을 사용하는 지점의 할당도 해제됩니다."
 eu5ab_delete_template_confirm_prompt: "현재 템플릿을 삭제하시겠습니까?"
 eu5ab_delete_template_confirm_button: "삭제 확인"
 eu5ab_delete_template_confirm_tooltip: "이 템플릿을 영구적으로 삭제하고 할당된 모든 지점에서 제거합니다. 이 작업은 되돌릴 수 없습니다."
 eu5ab_delete_template_cancel_button: "취소"
 eu5ab_delete_template_cancel_tooltip: "삭제를 취소하고 템플릿 작업으로 돌아갑니다."
 eu5ab_pause_template_button: "템플릿 일시정지"
 eu5ab_resume_template_button: "템플릿 재개"
 eu5ab_template_paused_badge: " (일시정지됨)"
 eu5ab_pause_template_tooltip: "이 템플릿을 일시정지하거나 재개합니다. 우선순위와 지점 할당은 유지되지만 일시정지 중에는 자동 건설이 해당 지점을 건너뜁니다."
 eu5ab_select_template_tooltip: "이 템플릿을 선택하고 규칙 세부 정보를 확인합니다."
 eu5ab_preset_readonly_desc: "테마 템플릿은 고정된 우선순위를 가지며 개별적으로 일시정지, 재개 또는 지점에 할당할 수 있습니다. 우선순위를 편집하려면 사용자 지정 템플릿으로 복사하십시오. 공유 규칙은 CMF 모드 설정에서 조정합니다."
 eu5ab_template_name_pencil_hint: "템플릿 이름"
 eu5ab_template_name_click_hint: "이름을 클릭하여 변경"
 eu5ab_template_name_click_tooltip: "현재 템플릿의 새 이름을 입력합니다."
 eu5ab_template_rename_desc: "현재 템플릿의 새 이름을 최대 42자로 입력합니다."
 eu5ab_template_rename_input: "템플릿 이름"
 eu5ab_template_rename_accept: "확인"
 eu5ab_template_rename_cancel: "취소"
 eu5ab_target_location_title: "대상 지점"
 eu5ab_target_location_desc: "설정을 지우거나 지방 템플릿 연동을 중지하기 전에 지점을 선택하십시오. 템플릿을 할당하려면 해당 템플릿 카드의 선택 버튼을 사용합니다."
 eu5ab_template_editor_desc: "이 템플릿의 건물 우선순위와 적용 범위를 설정합니다. 전국에서 공유하는 예산, 시장, 노동력 및 건설 안전 규칙은 Community Mod Framework 모드 설정에서 구성합니다."
 eu5ab_template_auto_save_hint: "변경 사항은 즉시 저장됩니다. 창을 닫으면 돌아갑니다."
 eu5ab_rules_tab_finance: "재정 및 건설"
 eu5ab_rules_tab_automation: "노동력 및 건설 선호"
 eu5ab_rules_tab_diagnostics: "건설 보고서"
 eu5ab_template_editor_sections_title: "템플릿 설정"
 eu5ab_template_editor_sections_desc: "각 템플릿은 활성 상태, 적용 범위 및 건물 우선순위를 개별 저장합니다. 최근 월간 결과는 건설 보고서에서 확인할 수 있습니다."
 eu5ab_open_buildings_editor_button: "건물 규칙"
 eu5ab_open_rules_editor_button: "건설 보고서"
 eu5ab_edit_template_button: "편집"
 eu5ab_copy_to_slot_button: "여기에 복사"
 eu5ab_policy_section_title: "템플릿 규칙"
 eu5ab_cash_section_title: "국고 준비금"
 eu5ab_cash_short_desc: "국고에 남겨야 하는 최소 잔액입니다."
 eu5ab_cash_label: "국고 준비금"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] 금화"
 eu5ab_cash_help: "착공 전, 해당 프로젝트와 기타 계획된 프로젝트의 예상 비용을 제외하고도 준비금을 충족할 만큼의 금화가 국고에 남아 있어야 합니다.\n예를 들어 국고에 1,050골드가 있고 준비금이 1,000골드일 때, 예상 비용이 100골드인 프로젝트는 착공할 수 없습니다. RGO의 실제 비용은 예상과 다를 수 있습니다. 또한 연간 건설 예산에도 잔액이 남아 있어야 합니다."
 eu5ab_budget_section_title: "연간 건설 예산"
 eu5ab_budget_short_desc: "고정 금액 또는 월간 총수입을 기반으로 한 연간 예산 한도를 선택합니다."
 eu5ab_budget_mode_fixed: "고정 예산"
 eu5ab_budget_mode_income: "수입 연동"
 eu5ab_budget_multiplier_4: "×4 보수적"
 eu5ab_budget_multiplier_6: "×6 권장"
 eu5ab_budget_multiplier_8: "×8 적극적"
 eu5ab_budget_effective_label: "올해 예산"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] 금화"
 eu5ab_budget_label: "연간 예산"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] 금화/년"
 eu5ab_budget_cash_comparison: "연간 건설 예산은 올해 계획된 지출을 정하고, 국고 준비금은 국고에 남겨둘 금화 수량을 정합니다. 마지막 프로젝트는 남은 예산을 초과할 수 있지만 준비금 검사를 통과해야 합니다."
 eu5ab_budget_reset_note: "새해 첫 번째 검사 시 재설정되며, 착공에 성공한 후에만 실제 지출이 차감됩니다. 연중에 예산을 변경해도 기록된 지출은 삭제되지 않습니다."
 eu5ab_budget_help: "일반 건물과 R.G.O. 확장은 연간 건설 예산을 공유하며, 고정 금액 또는 월간 총수입의 4배, 6배, 8배로 설정할 수 있습니다. 새해 첫 번째 검사 시 재설정되며, 연중에 예산을 변경해도 이미 기록된 지출은 유지됩니다.\n실제 착공에 성공한 프로젝트만 실제 비용으로 차감됩니다. 마지막 프로젝트는 잔여 예산을 초과할 수 있으나 이후 추가 프로젝트는 중단됩니다. 국고 준비금 조건도 계속 충족해야 합니다."
 eu5ab_quota_section_title: "이 Mod의 동시 건설 한도"
 eu5ab_quota_short_desc: "기본 1개 슬롯 외에 본 Mod가 동시에 진행할 수 있는 민간 프로젝트 수를 설정합니다."
 eu5ab_hard_cap_label: "추가 동시 프로젝트"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0]개 프로젝트 (총 한도는 이 값 + 1)"
 eu5ab_quota_help: "첫 번째 프로젝트 외의 추가 슬롯을 설정합니다. 0은 최대 동시 공사 1개, 599는 600개를 허용합니다. 일반 건물과 RGO가 이를 공유합니다. 본 Mod에서 시작하여 아직 완료되지 않은 공사만 집계되며 수동 건설, 도로 및 타 Mod는 제외됩니다. 매 라운드마다 남은 슬롯만 보충합니다. 공간이 허용되면 한 지점에 여러 프로젝트를 배치할 수 있으며 라운드 종료 후 3개월간 대기한 뒤 새로운 공사를 배치합니다."
 eu5ab_template_cash_value: "국고 준비금: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
