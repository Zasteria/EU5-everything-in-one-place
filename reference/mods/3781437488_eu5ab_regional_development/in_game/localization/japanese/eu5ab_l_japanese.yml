 eu5ab_rules_tab_diagnostics: "建設レポート"
 eu5ab_template_editor_sections_title: "テンプレート設定"
 eu5ab_template_editor_sections_desc: "各テンプレートは有効状態、適用範囲、建造物優先度を個別に保存します。最新の月次結果は建設レポートで確認できます。"
 eu5ab_open_buildings_editor_button: "建築ルール"
 eu5ab_open_rules_editor_button: "建設レポート"
 eu5ab_edit_template_button: "編集"
 eu5ab_copy_to_slot_button: "ここにコピー"
 eu5ab_policy_section_title: "テンプレートルール"
 eu5ab_cash_section_title: "国庫準備金"
 eu5ab_cash_short_desc: "国庫に残す必要がある最低残高です。"
 eu5ab_cash_label: "国庫準備金"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] ゴールド"
 eu5ab_cash_help: "着工前に、本計画および他の計画中プロジェクトの予定費用を差し引いた後も、準備金を満たすだけの金貨が国庫に残っている必要があります。\n例えば国庫に1,050金、準備金が1,000金の場合、予定費用100金のプロジェクトは着工できません。RGOの実際の費用は見積もりと異なる場合があります。また、年間建設予算にも残額が必要です。"
 eu5ab_budget_section_title: "年間建設予算"
 eu5ab_budget_short_desc: "固定額、または月間総収入に基づいた年間予算枠を選択します。"
 eu5ab_budget_mode_fixed: "固定予算"
 eu5ab_budget_mode_income: "収入連動"
 eu5ab_budget_multiplier_4: "×4 保守的"
 eu5ab_budget_multiplier_6: "×6 おすすめ"
 eu5ab_budget_multiplier_8: "×8 積極的"
 eu5ab_budget_effective_label: "今年度予算"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] ゴールド"
 eu5ab_budget_label: "年間予算"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] ゴールド/年"
 eu5ab_budget_cash_comparison: "年間建設予算は今年計画する支出額を定め、国庫準備金は国庫に残すべき金貨の量を定めます。最後の1件は残余予算を超過できますが、準備金判定を通過する必要があります。"
 eu5ab_budget_reset_note: "新年の初回判定時にリセットされ、着工成功後にのみ実際の支出額が差し引かれます。年内に予算を変更しても記録済みの支出は消去されません。"
 eu5ab_budget_help: "通常建造物とRGO拡張は年間建設予算を共有し、固定額または月間総収入の4倍、6倍、8倍に設定できます。新年の初回判定時にリセットされ、年内に変更しても記録済みの支出は保持されます。\n実際に着工に成功したプロジェクトのみが実費用で計上されます。最後の1件は残余予算を超過できますが、その後は新たな追加が停止されます。国庫準備金の要件も引き続き満たす必要があります。"
 eu5ab_quota_section_title: "このModの同時建設上限"
 eu5ab_quota_short_desc: "基本1枠に加え、本Modが同時に進行可能な民用工事数の上限を設定します。"
 eu5ab_hard_cap_label: "追加同時プロジェクト"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] 件（総上限はこの値 + 1）"
 eu5ab_quota_help: "最初の1件に加える追加枠を設定します：0は最大同時建設1件、599は600件を許可します。通常建造物とRGOで共有されます。本Modによる未完了の工事のみが計上され、手動建設、道路、他のModは計上されません。各巡回では空き枠のみを補充します。枠に余裕があれば同一ロケーションに複数の工事を手配できますが、その巡回の終了後は新しい工事が手配されるまで3か月待機します。"
 eu5ab_template_cash_value: "国庫準備金：[GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_step_dec_10k: "-10K"
 eu5ab_step_dec_1k: "-1K"
 eu5ab_step_inc_1k: "+1K"
