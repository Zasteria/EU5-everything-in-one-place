 eu5ab_prediction_diagnostics_title: "労働力推定と建設状況"
 eu5ab_prediction_section_body: "選択した「自動建設順序」に従ってアップグレード、通常拡張、RGO拡張、新規建設を順に手配し、現在の種類の実行可能なプロジェクトを優先して試行します。\n有効な食料緊急保護が適用される場合、関連する食料プロジェクトが最優先され、設定に応じて収益や価格などの制限が緩和されます。建材、戦時軍需品、戦略的原料の不足に対する保護が有効な場合も収益要件が緩和されることがあります。\n予算、国庫準備金、適用される原料、労働力、建設上限、ゲームの建設要件は引き続き満たす必要があります。通常建造物はアンロック済みの最新段階のみが考慮され、アップグレードでは新規追加された職のみを計算します。"
