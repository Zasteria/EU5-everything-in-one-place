 eu5ab_priority_decrease_default_tt: "優先度を0.1下げる"
 eu5ab_priority_decrease_ctrl_tt: "Ctrl：優先度を0.5下げる"
 eu5ab_priority_decrease_shift_tt: "Shift：優先度を1.0下げる"
 eu5ab_priority_increase_default_tt: "優先度を0.1上げる"
 eu5ab_priority_increase_ctrl_tt: "Ctrl：優先度を0.5上げる"
 eu5ab_priority_increase_shift_tt: "Shift：優先度を1.0上げる"
 eu5ab_priority_scale_hint: "0で禁止"
 eu5ab_clear_visible_priorities_button: "現在の一覧をすべて0にする"
 eu5ab_clear_visible_priorities_tooltip: "現在のフィルターで表示されているすべての建造物の優先度を0にして保存します。非表示の建造物には影響しません。"
 eu5ab_priority_low: "低"
