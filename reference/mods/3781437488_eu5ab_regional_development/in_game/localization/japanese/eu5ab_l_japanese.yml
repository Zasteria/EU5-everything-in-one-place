 EU5AB_CMM_NUMERIC_DECREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_decrease_12', 'eu5ab_cmm_ctrl_decrease_default')]"
