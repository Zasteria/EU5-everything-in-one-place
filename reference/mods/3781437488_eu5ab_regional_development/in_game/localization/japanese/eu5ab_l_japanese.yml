 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "総合評価 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = ロケーション自身の近接性改善効果 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + 周辺ロケーションの近接性改善効果 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1]。\nロケーション自身を含む [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] か所のロケーションで近接性の改善が見込まれます。\n評価値は各ロケーションの価値に予想近接性上昇率を乗じて算出したものであり、最終的な支配度そのものではありません。現在の支配度は加減算されず、実際の支配度は最大支配度などの通常メカニクスに従って自然に推移します。"
 eu5ab_governor_local_candidate_2_breakdown: "総合評価 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = ロケーション自身の近接性改善効果 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + 周辺ロケーションの近接性改善効果 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1]。\nロケーション自身を含む [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] か所のロケーションで近接性の改善が見込まれます。\n評価値は各ロケーションの価値に予想近接性上昇率を乗じて算出したものであり、最終的な支配度そのものではありません。現在の支配度は加減算されず、実際の支配度は最大支配度などの通常メカニクスに従って自然に推移します。"
 eu5ab_governor_local_candidate_3_breakdown: "総合評価 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = ロケーション自身の近接性改善効果 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + 周辺ロケーションの近接性改善効果 [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1]。\nロケーション自身を含む [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] か所のロケーションで近接性の改善が見込まれます。\n評価値は各ロケーションの価値に予想近接性上昇率を乗じて算出したものであり、最終的な支配度そのものではありません。現在の支配度は加減算されず、実際の支配度は最大支配度などの通常メカニクスに従って自然に推移します。"
 eu5ab_governor_naval_candidate_1_breakdown: "総合スコア [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = ロケーション近接性改善利得 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + 周辺近接性改善利得 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1]。\n近接性は [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] 箇所（当ロケーションを含む）で改善する見込みです。\nスコアは各ロケーションの価値に期待近接性増加量を乗じて推定されたものであり、最終支配度そのものではありません。現在の支配度は加減点されず、実際の支配度は最大支配度と通常のゲームメカニクスに従って推移します。"
 eu5ab_governor_naval_candidate_2_breakdown: "総合スコア [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = ロケーション近接性改善利得 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + 周辺近接性改善利得 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1]。\n近接性は [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] 箇所（当ロケーションを含む）で改善する見込みです。\nスコアは各ロケーションの価値に期待近接性増加量を乗じて推定されたものであり、最終支配度そのものではありません。現在の支配度は加減点されず、実際の支配度は最大支配度と通常のゲームメカニクスに従って推移します。"
 eu5ab_governor_naval_candidate_3_breakdown: "総合スコア [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = ロケーション近接性改善利得 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + 周辺近接性改善利得 [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1]。\n近接性は [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] 箇所（当ロケーションを含む）で改善する見込みです。\nスコアは各ロケーションの価値に期待近接性増加量を乗じて推定されたものであり、最終支配度そのものではありません。現在の支配度は加減点されず、実際の支配度は最大支配度と通常のゲームメカニクスに従って推移します。"
