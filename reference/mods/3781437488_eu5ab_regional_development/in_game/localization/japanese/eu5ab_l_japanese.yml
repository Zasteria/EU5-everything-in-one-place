 eu5ab_rgo_short_desc: "既存の職が満員である必要があります。デフォルトは「寛容」です。「人口考慮」を選択して新規の職の労働力を予測することもできます。"
 eu5ab_rgo_help: "既存のRGOの職が満員である必要があります。デフォルトの「寛容」モードでは新規労働者を予測しません。「人口考慮」では選択した期間内に十分な労働者が見込める必要があります。\n価格が最低価格以下の場合は拡張を停止します。低価格は優先度を下げ、高価格は優先度を上げます。スコアが0未満のプロジェクトは着工しません。\n同一市場で同じ商品を生産する所有通常建造物とRGOは拡張上限を共有します。これには建設中または完了後にまだ実現していない生産増分が含まれ、計画中プロジェクトによる新たな原料需要も考慮されます。予想増分が「需要不足分＋需要の10%」に近づくほど追加建設の優先度は下がり、その量に達すると新規着工が停止します。最後の1段階は超過でき、既存の工事は継続します。\n労働力保護をオフにすると予測が停止しますが、現在の不足は依然として優先度を下げます。有効化された食料緊急保護は関連RGOを優先し、価格および拡張制限を免除できます。既存の完全雇用、適用される労働力、予算、ゲームの建設要件は引き続き満たす必要があります。"
 eu5ab_workforce_help: "通常建造物はデフォルトで12か月の予測期間を用い、「人口考慮」モードのRGOは180か月を用います。現在の昇格速度、地域および全国の修正、可能性にあふれた土地、識字率、適格人口を用いて試算します。将来の移住、速度の変化、他の職業との競争が結果に影響を与える可能性があります。\n労働力保護をオフにすると予測が停止します。現在の不足は予測利益を変えることなく優先度を下げるのみとなります。食料緊急保護は設定通りに適用されます。"
