 eu5ab_template_intro_title: "テンプレート編集"
 eu5ab_automation_buildings_intro: "カスタムテンプレートでは建造物の優先度を自由に設定し、ロケーションに割り当てることができます。テーマテンプレートの優先度は固定ですが、編集するにはカスタムテンプレートとして複製してください。"
