 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "全テンプレート共通の予算、建設条件、決定戦略、性能設定を行います。各テンプレートは有効状態、範囲、優先度を個別に保存します。"
 eu5ab_regional_development__general_name: "全般設定と上限"
 eu5ab_regional_development__finance_name: "財政と市場"
 eu5ab_regional_development__automation_name: "安全設定と順位"
 eu5ab_regional_development__performance_name: "性能最適化"
 eu5ab_regional_development__performance__preset_name: "性能プリセット"
 eu5ab_regional_development__performance__preset_desc: "プリセットは下の設定を連動変更します。高度な設定を手動変更すると「カスタム」になり、次回の月次確認から有効です。"
 eu5ab_regional_development__performance__advanced_name: "高度な設定"
 eu5ab_regional_development__performance__advanced_desc: "1日のロケーション確認数、1巡ごとの新規プロジェクト数、および代替候補の数を調整します。確認および比較するプロジェクトが多いほど、処理に時間がかかる場合があります。"
 eu5ab_regional_development__general__limits_name: "全般設定と同時建設上限"
 eu5ab_regional_development__general__limits_desc: "Modの動作可否および本Modが同時に管理できる民用工事総数の上限を設定します。"
 eu5ab_regional_development__general__returns_name: "収益条件と緊急緩和"
 eu5ab_regional_development__general__returns_desc: "通常生産建造物の最低収益と、食料・建設資材・軍需品・戦略投入品不足時の緩和を設定します。"
 eu5ab_regional_development__finance__budget_name: "共通年間予算"
 eu5ab_regional_development__finance__budget_desc: "全テンプレート、通常建造物、RGO拡張で全国共通の年間予算を使用します。"
 eu5ab_regional_development__finance__market_name: "市場価格範囲"
 eu5ab_regional_development__finance__market_desc: "基本価格に対する共通の最低価格率と高価格基準率を設定します。"
 eu5ab_regional_development__automation__safety_name: "建設安全ルール"
 eu5ab_regional_development__automation__safety_desc: "特殊建造物、上流補完、労働力、投入品不足に関する共通安全設定です。"
 eu5ab_regional_development__automation__rgo_name: "RGO拡張"
 eu5ab_regional_development__automation__workforce_name: "労働力予測"
 eu5ab_regional_development__automation__workforce_desc: "将来の労働力供給を試算する際の最長予測期間を設定します。"
 eu5ab_regional_development__automation__ranking_name: "建設判断戦略"
 eu5ab_regional_development__automation__ranking_desc: "通常建造物の戦略、アップグレード・拡張・RGO・新規建設の順序、現地投入品の影響を設定します。"
 eu5ab_regional_development__candidate_ranking_mode_name: "通常建造物の決定戦略"
 eu5ab_regional_development__candidate_backfill_enabled_name: "他のプロジェクトを試行"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "現在の種類の優先プロジェクトが着工できない場合、下位の代替候補を試行します。ロケーションごとに1巡あたり需給計画では最大2回、「予測利益」では最大5回の追加試行枠があり、通常建造物の種類全体で共有されます。そのロケーションで通常建造物が着工すると停止します。セーブデータのロードで試行回数は回復しません。すべての要件は引き続き適用されます。デフォルトは無効で、次回の巡回から有効になり、確認時間が増加する可能性があります。"
 eu5ab_regional_development__candidate_ranking_mode_desc: "要件を満たす通常建造物の優先順位の付け方を選択します。食料緊急保護と自動建設順序が優先されます。RGOは不足、価格、雇用、戦略的需要に基づいて個別に評価されます。"
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "需給計画"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "市場不足、戦略需要、配合効率、現地原料、価格、労働力リスクを総合して順位付けし、完全な産業チェーンと長期安定を重視します。"
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "予測利益"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "候補をテンプレートと安全ルールで絞り込み、風車の利得や穀物庫で節約された食料を含む予想月間純利得で建設を優先します。利得が僅差の場合、テンプレートの優先度が第2基準となります。"
 eu5ab_regional_development__automation__candidate_priority_name: "自動建設順序"
 eu5ab_regional_development__automation__candidate_priority_desc: "4種類の建設区分（建築改築、通常拡張、RGO拡張、新規建築）をドラッグして優先順位を設定します。現在の区分で着工可能な計画をすべて処理してから次の区分に進みます。食料危機時は食料生産が優先されますが、この順序に従います。"
 eu5ab_regional_development__candidate_priority_name: "自動建設順序"
 eu5ab_regional_development__candidate_priority_desc: "ドラッグしてアップグレード、通常拡張、RGO拡張、新規建設を並べ替えます。"
 eu5ab_regional_development__candidate_priority_item_column_name: "建設種類"
 eu5ab_regional_development__candidate_priority_i1_name: "建造物をアップグレード"
 eu5ab_regional_development__candidate_priority_i1_desc: "旧式建造物を、アップグレード系列で解除済みの最新世代に置き換えます。"
 eu5ab_regional_development__candidate_priority_i2_name: "既存建造物を拡張"
 eu5ab_regional_development__candidate_priority_i2_desc: "既存の通常建造物にレベルを追加します。置換アップグレードとRGOは含みません。"
 eu5ab_regional_development__candidate_priority_i3_name: "RGOを拡張"
 eu5ab_regional_development__candidate_priority_i3_desc: "地元のRGOを拡張します。既存の完全雇用が必要であり、価格、年間建設予算、国庫準備金などの規則に準拠している必要があります。"
 eu5ab_regional_development__candidate_priority_i4_name: "新規建造物を建設"
 eu5ab_regional_development__candidate_priority_i4_desc: "そのロケーションにまだ存在しない通常建造物を新規建設します。"
 eu5ab_regional_development__enabled_name: "自動建設を有効化"
 eu5ab_regional_development__enabled_desc: "マスター切り替えです。無効にしてもテンプレート設定とロケーション割り当ては保持されますが、毎月の自動建設判定は停止します。"
 eu5ab_regional_development__monthly_build_hard_cap_name: "追加同時建設上限"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "基本1枠に加えて本Modが同時に進行可能な民用工事数の上限。0は全体で1件、599は600件を意味します。手動建設、道路、他Modはこの枠を消費しません。"
 eu5ab_regional_development__budget_mode_name: "年間予算方式"
 eu5ab_regional_development__budget_mode_desc: "固定額、または月間総収入の4倍、6倍、8倍で年間予算枠を決定します。新年の初回判定時に再計算され、年内に設定を変更しても記録済みの支出は保持されます。"
 eu5ab_regional_development__budget_mode_option_1_name: "固定年間予算"
 eu5ab_regional_development__budget_mode_option_2_name: "月間収入 ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "月間収入 ×6（推奨）"
 eu5ab_regional_development__budget_mode_option_4_name: "月間収入 ×8"
 eu5ab_regional_development__economic_metric_name: "通常建築の経済収益基準"
 eu5ab_regional_development__economic_metric_desc: "通常の生産建造物は、予測月間収入または利益がプラス、あるいは年換算収益率が5%という、選択した条件を満たす必要があります。実際の収益は変動する場合があります。通常の公共インフラは対象外です。風車には追加産出による純利益がプラスであることが必要で、収益率モードでは年利5%も必要です。腐敗による損失を抑えるために建設する穀物庫には、常に5%が必要です。RGOには別の規則が適用されます。"
 eu5ab_regional_development__economic_metric_option_1_name: "@income! 月間収入 > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "ゲーム予測月収入が正の場合だけ着工します。"
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! 月間利益 > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "ゲーム予測月間総利益が正の場合だけ着工します。"
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! 年率換算収入利回り ≥ 5%"
 eu5ab_regional_development__economic_metric_option_3_desc: "予測月間収入が建設費用の5%÷12以上である必要があります。これは収入のみを比較したものであり、運営費は控除されていません。"
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! 年率換算利益利回り ≥ 5%"
 eu5ab_regional_development__economic_metric_option_4_desc: "予測月間利益が建設費用の5%÷12以上である必要があります。実際の利益は運営状況によって変化する場合があります。"
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "食料枯渇見込み：優先建設、収益無視"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "食料枯渇見込みなら食料計画を優先し、通常食料建造物の収益条件を免除します。順序と他の全条件は維持されます。"
 eu5ab_regional_development__emergency_food_stockpile_override_name: "食料25%以下：優先建設、収益無視"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "市場の食料備蓄が25%以下になった場合、食料生産を最優先し通常の食料建築の収益基準を免除します。自動建設順序や安全基準は維持されます。"
 eu5ab_regional_development__emergency_construction_goods_override_name: "建設資材供給65%未満：収益無視"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "木材、石材、工具などの重要建材の市場充足率が65%未満の場合、該当建材を生産する施設は収益基準の判定を免除されます。その他の建設順序や財務制限は有効です。"
 eu5ab_regional_development__emergency_wartime_military_override_name: "戦時軍需供給65%未満：収益無視"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "戦時中に軍需品の市場充足率が65%未満の場合、該当軍需品を生産する施設は収益基準の判定を免除されます。その他の規則は有効です。"
 eu5ab_regional_development__emergency_strategic_input_override_name: "戦略生産の原料不足：上流収益を無視"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "原料の市場供給量が需要の65%未満で、同じ市場にその原料を消費する自国の食料・主要建材・軍需品の生産施設があり、その施設が閉鎖されておらず投入品不足になっている場合、その原料を生産する上流施設は選択中の収益基準を免除されます。下流施設がすでに生産を停止している必要はなく、不足している投入品がその原料である必要もありません。その他の建設ルールは引き続き適用されます。"
 eu5ab_regional_development__fixed_annual_budget_name: "固定年間予算"
 eu5ab_regional_development__fixed_annual_budget_desc: "固定予算方式だけで使用し、全テンプレートがこの額を共有します。"
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "最低国庫準備金"
 eu5ab_regional_development__min_cash_reserve_desc: "すべての計画中プロジェクトの予定費用を差し引いた後も、この国庫準備金を保持します。RGOの実際の費用は異なる場合があります。"
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "最低価格率"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "高価格基準率"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "特殊建造物を許可"
 eu5ab_regional_development__allow_special_buildings_desc: "特殊建造物を候補に含めます。ゲーム本来の建設条件は維持されます。"
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "空き建設枠で市場の不足産業を補填"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "通常のプロジェクトを割り当てた後、空いている建設枠を使い、同じ市場内で今回のラウンドに確認した自国のロケーションの不足を補います。計画済みプロジェクトの原材料需要と、まだ実現していない産出量の増加を考慮します。組み込みプリセットでは予定外の産業を追加する場合があります。禁止設定、カスタム優先度0、その他の建設要件は引き続き適用されます。"
 eu5ab_regional_development__auto_build_input_sources_name: "不足時に上流産業を建設"
 eu5ab_regional_development__auto_build_input_sources_desc: "原料市場の不足を独自に確認し、下流の建物が満員であっても原料が不足している場合は、テンプレートで許可されている上流供給施設の建設を試行します。建物のアンロックとすべての建設条件は引き続き適用されます。"
 eu5ab_regional_development__pause_low_workforce_name: "労働力不足時に停止"
 eu5ab_regional_development__stop_input_shortage_name: "重要投入品不足時に停止"
 eu5ab_regional_development__stop_input_shortage_desc: "有効化すると、必要な主要工業原料の市場供給が需要の75%以上を満たしている場合にのみ、関連工事の着工が許可されます。"
 eu5ab_regional_development__allow_rgo_name: "RGO拡張を許可"
 eu5ab_regional_development__allow_rgo_desc: "すべてのテンプレートでRGO拡張を候補に含めることを許可します。"
 eu5ab_regional_development__native_input_priority_name: "現地原料優先度"
 eu5ab_regional_development__native_input_priority_desc: "0～10。数値を上げると、同州内で産出される原料を直接消費できる建築の優先度が高くなります。"
 eu5ab_regional_development__performance_preset_name: "性能プリセット"
 eu5ab_regional_development__performance_preset_desc: "プリセットは下の高度な設定を同期します。「カスタム」は現在値を維持します。"
 eu5ab_regional_development__performance_preset_option_1_name: "保守的"
 eu5ab_regional_development__performance_preset_option_1_desc: "1日最大10ロケーション、1回最大30件。計画候補5件、利益候補15件。候補が十分なら残りの確認を停止します。"
 eu5ab_regional_development__performance_preset_option_2_name: "平衡的"
 eu5ab_regional_development__performance_preset_option_2_desc: "1日最大20ロケーション、1回最大50件。計画候補4件、利益候補12件。候補が十分なら残りの確認を停止します。"
 eu5ab_regional_development__performance_preset_option_3_name: "処理量優先"
 eu5ab_regional_development__performance_preset_option_3_desc: "適用ロケーションが多い国家向け。1日最大30ロケーション、1回の着工数は無制限。計画候補3件、利益候補10件。候補が十分なら停止します。"
 eu5ab_regional_development__performance_preset_option_4_name: "カスタム"
 eu5ab_regional_development__performance_preset_option_4_desc: "現在の高度な設定を使用します。"
 eu5ab_regional_development__performance_throughput_warning_summary_name: "テンプレート適用ロケーションが多いと性能が低下する場合があります。"
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "最大スループット設定では1日最大30ロケーションを検査し回数制限もありません。領土が極めて広大な場合は月末処理が延びる可能性があります。"
 eu5ab_regional_development__performance_throughput_warning_action_name: "「需給計画」の処理が長い場合：「計画候補数」を下げてください。"
 eu5ab_regional_development__performance_throughput_warning_action_desc: "需給計画でのみ表示。計画候補数を減らすと、ロケーション・通常建設種類ごとに後続確認へ送る件数が減ります。"
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "影響：代替候補が減り、後続の実行可能計画を見落とす可能性があります。"
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "計画スコア順に検査します。候補上限を下げると上位が条件未達だった場合の代替候補が減り、後続の実行可能計画を見落とす恐れがあります。"
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "「予測利益」の処理が遅い場合：「ロケーションごとの利益候補数」を減らしてください。"
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "「予測利益」の場合のみ表示されます。「ロケーションごとの利益候補数」を減らすと、後続の確認で調べる代替候補が少なくなります。"
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "候補が減るため、優先プロジェクトが着工できない場合に他の選択肢がなくなる可能性があります。"
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "予測利益と建設選好で順位付けした後に代替候補が保持されます。この数を減らすと、上位プロジェクトが阻止されたときにフォールバックできる選択肢が少なくなります。"
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "1日の確認ロケーション数や1回の追加数も減らせます。"
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "1日のロケーション数を減らすと、確認処理がより多くの日に分散されます。新規プロジェクトの上限を下げると、1回の巡回あたりの作業が減少します。0に設定すると新規プロジェクトは無制限になります。"
 eu5ab_regional_development__parallel_location_scan_name: "ロケーションを個別処理"
 eu5ab_regional_development__parallel_location_scan_desc: "ロケーションを個別に確認して処理の遅延を減らすか、毎日の単一ステップでまとめて確認します。優先度、予算、建設順序はまったく同じです。"
 eu5ab_regional_development__daily_location_task_limit_name: "1日の確認ロケーション上限"
 eu5ab_regional_development__daily_location_task_limit_desc: "毎日詳細に確認する最大ロケーション数です。数値を低くすると1日あたりの処理は少なくなりますが、全国を走査するのにより多くの日数がかかります。"
 eu5ab_regional_development__max_additions_per_run_name: "1回の最大追加数"
 eu5ab_regional_development__max_additions_per_run_desc: "1回の月次判定で着工できる最大計画数（0～600）。0は無制限。"
 eu5ab_regional_development__candidates_per_location_name: "ロケーションごとの計画候補数"
 eu5ab_regional_development__candidates_per_location_desc: "「需給計画」時のみ有効。各ロケーション・通常建設カテゴリごとに、計画スコアに基づいて後続の条件確認へ引き渡す候補数（3～30）を設定します。候補数を増やすと実行可能な選択肢を逃しにくくなりますが、処理負荷が増加します。"
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "ロケーションごとの利益候補数"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "「予測利益」の場合のみ適用されます。ロケーションと通常建設タイプごとに、予測利益と建造物の優先設定に基づいて順位付けした代替候補を3～30件保持します。候補を増やすと上位のプロジェクトが着工できない場合の選択肢が増えますが、後続の確認に時間がかかる場合があります。"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "候補が十分なら確認を停止"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "代替候補の数が今回のラウンドで追加できるプロジェクト数の2倍に達したら、他のロケーションの詳細確認を停止します。この数は空き建設枠と「1回の最大追加数」で決まります。0はラウンドごとの追加上限のみを解除します。建設要件は引き続き適用されます。"
 eu5ab_diagnostics_cmm_hint: "共通ルールはCommunity Mod FrameworkのMod設定で変更します。建設レポートには最新の自動建設結果が表示されます。"
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "10増加"
 eu5ab_cmm_shift_decrease_10: "10減少"
 eu5ab_cmm_shift_increase_1000: "1000増加"
 eu5ab_cmm_shift_decrease_1000: "1000減少"
 eu5ab_cmm_shift_increase_max: "最大値に設定"
 eu5ab_cmm_shift_decrease_min: "最小値に設定"
 eu5ab_regional_development__automation__rgo_desc: "既存の職が満員になった後にのみRGO拡張を検討します。新規の職に必要な労働者を予測するかどうかを選択します。"
 eu5ab_regional_development__rgo_workforce_mode_name: "RGO労働力モード"
 eu5ab_regional_development__rgo_forced_relaxed_name: "RGOモード：寛容（労働力保護オフ）"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "労働力の予測は行いません。既存の職は満員である必要があります。新規の職の人員不足は建設優先度を下げるのみとなります。"
 eu5ab_regional_development__rgo_workforce_mode_desc: "デフォルトは「寛容」です。労働力保護をオフにすると一時的に「寛容」モードが使用され、現在の労働者不足によって優先度が下がります。再度有効にすると選択したモードに戻ります。既存の職は常に満員である必要があります。"
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "寛容"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "ゲーム本体の一般的な拡張規則に準拠します：既存の職が満員になった後、新規労働者の予測を行わずに価格、市場需要、予想産出量を評価します。労働力保護が有効な場合、新規の職の人員不足によって優先度が下がることはありません。"
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "人口考慮"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "既存の職が完全雇用であることを確認した後、予測期間内に昇格可能な適格人口を見積もります。労働者が次のレベルを埋められない場合は一時停止します。"
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "RGO人口予測期間（月）"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "「人口考慮」モードでは、この期間内に新しい職を埋めるのに十分な労働者が見込まれる場合にのみ拡張されます。デフォルト：180か月。範囲：0〜1200。0に設定すると現在利用可能な労働者のみを計算します。試算では「可能性にあふれた土地」、識字率、転職可能な適格人口が考慮されます。予測期間が長いほど実際の結果との差が大きくなる可能性があります。クリックで1か月、Ctrlを押しながらで12か月、Shiftを押しながらで120か月調整します。"
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "有効にすると、通常建造物は十分な予測労働者が必要となり、RGOは選択したモードを使用します。これをオフにすると予測が停止し、RGOは一時的に「寛容」モードを使用します。現在の不足は優先度を下げるのみで、それ単独で新規プロジェクトを阻止することはありません。既存のRGOの職は引き続き満員である必要があります。再度有効にすると以前のRGOモードに戻ります。"
 eu5ab_regional_development__job_fill_deadline_months_name: "通常建造物の労働力予測期間（月）"
 eu5ab_regional_development__job_fill_deadline_months_desc: "通常建造物専用の独立した期間です：デフォルトは12か月、範囲は0〜240です。0に設定すると現在資格を満たす待機労働者のみを計算します。人口考慮モードのRGOは個別の期間を使用します。現在の昇格速度は見積もりであり、将来の充足を保証するものではありません。"
 eu5ab_regional_development__price_min_desc: "デフォルト：基本価格の80%。低価格は優先度を下げます。すべての産出物が基準値以下の場合は建設を一時停止します。複数の産出物は数量と基本価格で加重評価します。100%以上の場合は基準値のみが適用されます。有効化された食料緊急保護は価格制限を免除できます。"
 eu5ab_regional_development__price_max_desc: "デフォルト：125%。基本価格を上回る価格は基準値まで徐々に優先度を加点します。基準値が125%の場合、価格112.5%で70点、125%以上で140点が加算されます。基準値が100%以下の場合は基本価格を上回ると一律140点が加算されます。"
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
 eu5ab_cmm_shift_increase_120: "120か月増加"
