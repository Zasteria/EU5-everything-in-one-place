 eu5ab_building_age_2: "ルネサンスの時代"
 eu5ab_building_age_3: "大航海時代"
 eu5ab_building_age_4: "宗教改革の時代"
 eu5ab_building_age_5: "絶対主義の時代"
 eu5ab_building_age_6: "革命の時代"
 eu5ab_status_enabled: "#G 有効#!"
 eu5ab_status_disabled: "#L 無効#!"
 eu5ab_status_currently_available: "#G 利用可能#!"
 eu5ab_operating_rules_title: "自動建設ルール"
 eu5ab_operating_rules_short_desc: "特殊建造物、上流補完、投入品不足のルールを設定します。"
 eu5ab_operating_rules_help: "特殊建造物はゲーム本体のアンロックおよび建設要件を満たす必要があります。\n原材料が不足している場合、既存の工場が満員であっても、テンプレートで許可されている関連原料供給施設の追加建設が促されることがあります。\n原料保護が有効な場合、必要な主要工業原料の供給が需要の75%を満たしている必要があります。既存の建物は可能な限り現在の生産方式で判定し、不明な場合は利用可能な方式で見積もります。代替方式は個別に評価され、生産方式が自動的に切り替わることはありません。"
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "このテンプレートでRGO拡張を許可"
 eu5ab_toggle_special_buildings: "特殊建造物を許可"
 eu5ab_toggle_auto_build_input_sources: "投入品不足時に上流を自動建設"
 eu5ab_toggle_pause_low_workforce: "労働力不足時に建設を一時停止"
 eu5ab_ranking_mode_section_title: "建設判断戦略"
 eu5ab_town_rights_preference_desc: "都市特権の選好と「産業を振興」は、それぞれ独立して最大500の計画ポイントを加算します。産業振興は奨励地域内で直接一致する産出物を持つ建物にのみ適用され、選択された製法の基本価格に基づく産出比率で計算され、サプライチェーンには伝播しません。どちらも地元原料のポイントと重複適用可能です。利益モードではこれらのポイントを事前選考にのみ使用します。RGO拡張は都市特権のボーナスのみを引き継ぎます。すべての着工条件は引き続き適用されます。"
 eu5ab_ranking_mode_current_label: "現在のモード"
 eu5ab_ranking_mode_composite_value: "#G 需給計画#!"
 eu5ab_ranking_mode_actual_profit_value: "#G 予測利益による選択#!"
 eu5ab_ranking_mode_common_desc: "両戦略とも、解禁済みで建設可能かつ優先度が0より大きい建造物だけを検討します。収益、予算、準備金、投入品、労働力などの安全条件も満たす必要があります。食料緊急対応と自動建設順序が常に優先されます。"
 eu5ab_ranking_mode_composite_desc: "市場不足、戦略需要、効率、現地原料、価格、労働力リスクを総合評価し、産業チェーンの完結と長期的な需給安定を重視します。"
 eu5ab_ranking_mode_actual_profit_desc: "候補プロジェクトをテンプレートおよび安全ルールで絞り込み、風車の資源利得や穀物庫による食料腐敗防止価値を含めた予想月間純利得に基づいて建設を優先します。予想利得が僅差の場合は、テンプレートで設定された優先順位が第2基準として適用されます。"
 eu5ab_ranking_mode_actual_profit_scope_desc: "ロケーションおよび通常建設の種類ごとに設定された3〜30件の代替候補を保持します。食料緊急保護と自動建設順序が優先されますが、着工前に収益および建設条件を満たす必要があります。RGOは不足、価格、雇用、戦略的需要によって個別に判定されます。"
 eu5ab_ranking_mode_help: "決定戦略\nCommunity Mod Framework → Mod設定 → 高度自動建設 → 安全と順位付け → 建設決定戦略 で戦略を切り替えます。\n• 需要供給計画：市場の需要と供給、完全な生産チェーン、長期的な経済安定性を重視します。\n• 予測利益：風車の利得や穀物庫の腐敗削減を含む予想月間純利得を使用し、同点時の判断基準としてテンプレート優先度を用います。"
 eu5ab_workforce_section_title: "労働力"
 eu5ab_pause_workforce_short_desc: "労働力不足時に建設を直接阻止するかどうかを設定します。"
 eu5ab_job_fill_deadline_label: "労働力予測期間"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0]か月"
 eu5ab_job_fill_deadline_value: "労働力予測期間：[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] か月"
 eu5ab_job_fill_deadline_desc: "労働力の最長予測期間を月数（0～240か月）で設定します。0では現在利用できる労働者のみを数え、将来の階層昇格は含めません。人手不足で着工を止めるかどうかは「労働力不足時に停止」で決まります。有効なら予測労働力が不足する工事は着工せず、無効なら不足は建設優先度を下げるだけです。"
 eu5ab_deadline_0: "0か月"
 eu5ab_deadline_3: "3か月"
 eu5ab_deadline_6: "6か月"
 eu5ab_deadline_12: "12か月"
 eu5ab_toggle_stop_input_shortage: "重要原料不足時に建設を停止"
 eu5ab_prediction_status_label: "労働力推定方法"
 eu5ab_status_promotion_forecast: "#G 選択期間の昇進予測#!"
 eu5ab_status_conservative_fallback: "#L 現在の労働力に基づく保守的試算#!"
 eu5ab_prediction_promotion_short_desc: "現在の利用可能労働力と期間内に目標階級へ昇格見込みの人口を合算します（最大240か月）。"
 eu5ab_prediction_unavailable_short_desc: "将来予測が不可能な場合は現在の利用可能人数のみで保守的に判定します。"
 eu5ab_native_input_section_title: "現地原料の優先"
 eu5ab_native_input_short_desc: "同じ州に存在する原料を使う生産建造物の順位を上げます。"
 eu5ab_native_input_priority_label: "現地原料優先度"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "現地原料優先度：[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "地元原材料の優先度\n「地元」とは建物が所在する州を指します。システムは建物のレシピで必要な原材料を確認し、該当するRGOが州内に存在する場合に順位ボーナスを付与します。レシピ内での割合が大きい原材料ほど高いボーナスが得られます。\n• 0は地元原材料を無視、5はデフォルトの推奨値、10は最大ウェイトを付与します。\n• この設定は順位スコアにのみ影響し、実際の建設は他の不足、利益、労働力、ゲームの建設条件に従います。\n• 該当するRGOが存在するかのみを確認し、そのレベルや生産量は参照しません。\n• 原材料不足、低い市場アクセス、または低い支配度はボーナスを減少させます。RGO自体はこのボーナスを受け取りません。利用可能な生産方法に基づく推定であり、生産方法を自動で切り替えることはありません。"
 eu5ab_price_section_title: "価格範囲"
 eu5ab_price_short_desc: "市場価格で生産建造物を絞り込み、順位付けします。"
 eu5ab_price_min_label: "最低価格"
 eu5ab_price_max_label: "高価格基準"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "基本価格を100%とします。低価格は優先度を下げ、すべての産出物が最低価格以下の場合は建設を一時停止します。複数の産出物は数量と基本価格で加重評価します。高価格の加点は基準値で上限に達しますが、価格が高すぎることで建設が阻止されることはありません。産出商品のない建物は除外されます。食料緊急保護は設定通りに適用されます。"
 eu5ab_active_cash_value: "国庫準備金：[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "最低価格：[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0Y]%"
