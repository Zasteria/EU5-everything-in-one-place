 eu5ab_step_dec_100: "-100"
 eu5ab_step_inc_100: "+100"
 eu5ab_building_rules_title: "建造物ルール"
 eu5ab_building_rules_desc: "1行目で就業階層、2行目で解禁時代を絞り込みます。優先度は0.0～10.0で、0は建設禁止です。特殊ページには、自国領の少なくとも1ロケーションで建設条件を満たす特殊建造物だけが表示されます。"
 eu5ab_allow_button: "許可"
 eu5ab_ban_button: "禁止"
