 eu5ab_diag_result_help: "有効な食料保護が適用される場合、食料関連のプロジェクトを優先します。それ以外は自動建設順序に従い、着工できない場合は代替候補を試します。\nRGOは不足、価格、雇用、戦略的需要に基づいて評価され、ゲームの建設要件にも従います。\n着工に成功した場合のみ予算と建設枠を消費します。新規プロジェクトが割り当てられたロケーションでは、ラウンド終了後3か月間、追加の建設を待機します。"
 eu5ab_diag_rgo_title: "RGO候補確認"
 eu5ab_diag_rgo_short_desc: "各ロケーションは結果を1件だけ記録し、除外時は最初の理由に計上します。"
 eu5ab_diag_rgo_help: "直近のRGO拡張確認を表示します。既存の職はすべて埋まっている必要があります。「人口考慮」は新規労働者を予測しますが、「寛容」は予測しません。価格、まだ実現していない産出量の増加、現在の労働者不足が優先度に影響します。産出量の増加は、同じ市場で同じ商品を生産する自国のプロジェクト全体で合算します。データが不完全な場合は、判明している量のみを表示します。上限に達すると新規着工を停止しますが、進行中のプロジェクトは継続します。"
