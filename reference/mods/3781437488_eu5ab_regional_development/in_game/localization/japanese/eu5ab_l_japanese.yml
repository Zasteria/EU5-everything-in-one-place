 eu5ab_diagnostics_snapshot_help: "レポートは確認の進行と着工に応じて更新され、次のラウンドまで結果を保持します。23日からプロジェクトが割り当てられるため、件数や支出は段階的に変わる場合があります。確認が完了するまで、一部の結果は未確定のままです。"
