 eu5ab_deep_decision: "今月の全国建設を再計画"
 eu5ab_deep_decision_desc: "有効化されたテンプレートを使用している全国の所有ロケーションを再評価し、今月の計画を保存して23日から着工を手配します。"
 eu5ab_open_confirmation: "確認イベントを開く"
 eu5ab_reset_confirm: "リセットを確認"
 eu5ab_reset_confirm_desc: "テンプレートと設定は保持しますが、ロケーションの割り当て、計画、待機期間、レポート、総督の提案、進行中の工事および年間支出記録を消去します。消費した金貨は返還されず、既存の工事は続行されます。その後、テンプレートを再割り当てしてください。\n国家を切り替えた直後の場合、現在の国家のテンプレートと設定を切り替え前に保存された内容に置き換えます。"
 eu5ab_deep_confirm_desc: "有効化されたテンプレートを使用している全国の所有ロケーションを再確認し、今月の未実行計画を置き換えます。現在の戦略、食料緊急保護、自動建設順序を適用し、最後の1件は残余予算を超過できます。\n領土が多い国家では時間がかかる場合があり、計画が完了するまでウィンドウを閉じることができません。保存後、今月中の設定変更はこの計画に影響しません。23日から着工を手配し、翌月に通常の判定を再開します。"
