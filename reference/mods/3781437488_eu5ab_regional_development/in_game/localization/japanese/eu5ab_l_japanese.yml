 eu5ab_select_template_tooltip: "このテンプレートを選択してルールの詳細を表示します。"
 eu5ab_preset_readonly_desc: "テーマテンプレートは固定の優先度を持ち、個別に一時停止、再開、ロケーションへの割り当てが可能です。優先度を編集するにはカスタムテンプレートとして複製してください。共有ルールはCMFのMod設定で変更します。"
 eu5ab_template_name_pencil_hint: "テンプレート名"
