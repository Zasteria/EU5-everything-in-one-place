 eu5ab_regional_development__governors_name: "総督府の推薦"
 eu5ab_regional_development__governors__recommendations_name: "推薦と更新"
 eu5ab_regional_development__governors__recommendations_desc: "建築物の自動建設・撤去・移転を行わずに、地方総督府および海軍総督府の候補ロケーションを分析します。"
 eu5ab_regional_development__governors__scoring_name: "評価の優先設定"
 eu5ab_regional_development__governors__scoring_desc: "ロケーション価値の重み付け方法や、限定的な戦略的価値を含めるかどうかを選択します。"
 eu5ab_regional_development__governor_recommendations_enabled_name: "総督府の推薦を有効化"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "地方および海軍総督府の設置候補地を定期的に提案します。無効にすると前回の結果は保持されますが、推薦のアラートは表示されなくなります。"
 eu5ab_regional_development__governor_refresh_interval_name: "更新間隔"
 eu5ab_regional_development__governor_refresh_interval_desc: "総督府提案の更新間隔を設定します。領土、首都、ロケーションランク、政府の変更により早期に更新が促される場合があります。道路やその他の近接性の変化は定期評価に含まれます。"
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "毎月"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "最も素早く変化を反映し、小国に適しています。頻繁な評価は大国でより顕著な遅延を引き起こす可能性があります。"
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "3か月ごと"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "街道の変化への応答性と大国のパフォーマンスのバランスを取ります。"
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "6か月ごと"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "大国における再計算頻度を抑えます。"
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "12か月ごと"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "最も負荷が低いですが、街道や近接性の変化が反映されるまでに最大1年かかる場合があります。"
 eu5ab_regional_development__governor_refresh_now_name: "今すぐ再計算"
 eu5ab_regional_development__governor_refresh_now_text: "今すぐ再計算"
 eu5ab_regional_development__governor_refresh_now_desc: "一時停止中であっても、地方総督府および海軍総督府の推奨地を今すぐ再計算します。大国では一時的に処理が重くなる場合があります。"
 eu5ab_regional_development__governor_scoring_profile_name: "ロケーション価値プロファイル"
 eu5ab_regional_development__governor_scoring_profile_desc: "課税対象、人口、開発度の相対的重みを調整します。評価値はロケーションの価値と見込まれる近接性改善に基づき算出され、最終的な支配度そのものではありません。現在の支配度は加減算されません。"
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "混合"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "経済的価値と行政・人口価値のバランスを取ります。"
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "経済"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "潜在的な税基盤と既存の経済規模を重視します。"
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "行政・人口"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "人口と開発度を重視します。"
 eu5ab_regional_development__governor_strategic_value_name: "戦略的価値を含める"
 eu5ab_regional_development__governor_strategic_value_desc: "港、国境ロケーション、要塞化ロケーションに限定的な重みを与えます。これはロケーション価値のみを変更し、独立したスコア要素ではありません。"
 eu5ab_governor_window_title: "総督府推薦の詳細"
 eu5ab_governor_window_intro: "新規建設地および移転の提案を確認します。建物の変更はプレイヤーの判断で行います。"
 eu5ab_governor_road_tier_help: "試算には解放済みの最高位の道路ランクを使用します。実際の利得とは異なる場合があります。\n各計画はもう一方の総督府タイプを固定します。変更後は再計算してください。利得を合算することはできません。"
 eu5ab_governor_refresh_button: "再計算"
 eu5ab_governor_refresh_button_tt: "地方および海軍総督府の新設候補地、移転、配置計画を再評価します。大国では一時的に処理が重くなる場合があります。未完了の場合は通知が表示されます。"
 eu5ab_governor_local_section: "地方総督府"
 eu5ab_governor_local_diagnostics: "直近の地方総督府計算：ステージ [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0]、状態 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0]；上限 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0]、エンジン判定 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0] 地方総督府および [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0] 副官庁舎；その他占有枠 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0]。\nロケーション別集計：[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0] 地方総督府および [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0] 副官庁舎；その他占有枠 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0]；空き枠（エンジン/ロケーション） [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0]；不一致 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0]（1は不一致）。\n新設利得基準値 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1]；候補地 [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0]、評価済み [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]。"
 eu5ab_governor_naval_section: "海軍総督府"
 eu5ab_governor_naval_diagnostics: "直近の海軍総督府計算：状態 [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_status_ui')|0]；更新回数 [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_runs_ui')|0]。"
 eu5ab_governor_new_slot_state: "空き枠があります。これらのロケーションのいずれかに総督府を建設できます。"
