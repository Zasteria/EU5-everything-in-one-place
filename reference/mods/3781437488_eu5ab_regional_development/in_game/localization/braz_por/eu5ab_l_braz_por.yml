 eu5ab_budget_label: "Orçamento anual"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] ouro/ano"
 eu5ab_budget_cash_comparison: "O orçamento anual define o gasto planejado; a reserva do tesouro define quanto ouro manter. O projeto final pode exceder o orçamento restante, mas deve passar na verificação da reserva."
 eu5ab_budget_reset_note: "Redefine na primeira verificação do novo ano; debita gastos reais somente após o início da construção. Alterar o orçamento não apaga gastos registrados."
 eu5ab_budget_help: "Edifícios comuns e expansões de O.C.R. compartilham um orçamento anual: um valor fixo ou 4, 6 ou 8 vezes a renda mensal total. Ele é redefinido na primeira verificação do novo ano; alterá-lo durante o ano mantém os gastos já registrados.\nApenas inícios bem-sucedidos contam, pelo seu custo real. O projeto final pode exceder o orçamento restante; nenhum outro projeto será adicionado depois. Os requisitos de reserva do tesouro ainda se aplicam."
 eu5ab_quota_section_title: "Limite de construções simultâneas deste Mod"
 eu5ab_quota_short_desc: "Define quantos projetos civis este Mod pode executar ao mesmo tempo além do espaço base."
 eu5ab_hard_cap_label: "Projetos simultâneos extras"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] projetos (o limite total é este valor + 1)"
 eu5ab_quota_help: "Define o espaço extra além do primeiro projeto: 0 permite 1 projeto simultâneo; 599 permite 600. Edifícios comuns e O.C.R. compartilham esse limite. Apenas projetos inacabados deste Mod contam; construção manual, estradas e outros mods não contam. Cada rodada preenche apenas as vagas livres. Um local pode receber vários projetos se o espaço permitir, aguardando 3 meses após a rodada antes que novos projetos sejam organizados."
