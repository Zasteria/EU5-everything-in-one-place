 eu5ab_open_panel_tooltip: "Abra o painel de política de desenvolvimento regional."
 eu5ab_open_regional_development_policy: "Este Mod: ver controles de construção automatizada"
 eu5ab_open_regional_development_policy_desc: "Escolha Construção Automática Avançada nas Configurações de Mod do Community Mod Framework."
 eu5ab_set_cash_reserve_0: "Este Mod: reserva do tesouro 0"
 eu5ab_set_cash_reserve_0_desc: "Defina como 0 a reserva mínima do tesouro para construção automatizada deste local."
 eu5ab_set_cash_reserve_500: "Este Mod: reserva do tesouro 500"
 eu5ab_set_cash_reserve_500_desc: "Defina como 500 a reserva mínima do tesouro para construção automatizada deste local."
 eu5ab_set_cash_reserve_1000: "Este Mod: reserva do tesouro 1000"
 eu5ab_set_cash_reserve_1000_desc: "Defina como 1000 a reserva mínima do tesouro para construção automatizada deste local."
 eu5ab_set_cash_reserve_2000: "Este Mod: reserva do tesouro 2000"
 eu5ab_set_cash_reserve_2000_desc: "Defina como 2000 a reserva mínima do tesouro para construção automatizada deste local."
 eu5ab_enable_special_buildings_for_location: "Este Mod: permitir edifícios especiais"
 eu5ab_enable_special_buildings_for_location_desc: "Permita que a construção automatizada construa ou melhore edifícios especiais no local selecionado."
 eu5ab_disable_special_buildings_for_location: "Este Mod: proibir edifícios especiais"
 eu5ab_disable_special_buildings_for_location_desc: "Impeça a construção automatizada de construir ou melhorar edifícios especiais no local selecionado."
 eu5ab_decouple_selected_location: "Este Mod: parar de seguir o modelo da província"
 eu5ab_decouple_selected_location_desc: "Mudanças futuras no modelo da província não atualizarão o local selecionado."
 eu5ab_clear_selected_location_policy: "Este Mod: limpar política do local"
 eu5ab_clear_selected_location_policy_desc: "Selecione um local e remova sua atribuição de modelo e configurações relacionadas."
 eu5ab_rgo_short_desc: "Os postos existentes devem estar preenchidos. O padrão é Relaxado; escolha Considerar População para prever trabalhadores para novos postos."
 eu5ab_rgo_help: "Os postos de trabalho existentes nas O.C.R. devem estar totalmente preenchidos. O modo Relaxado, o padrão, não prevê novos trabalhadores; Considerar População exige que trabalhadores suficientes sejam esperados dentro do período escolhido.\nPreços iguais ou inferiores ao mínimo pausam a expansão. Preços baixos reduzem a prioridade e preços altos a aumentam. Projetos com pontuação abaixo de 0 não iniciam.\nEdifícios comuns próprios e O.C.R. próprias que produzem o mesmo bem no mesmo mercado compartilham um limite de expansão. Ele inclui ganhos de produção ainda não realizados de projetos em andamento ou concluídos e considera a nova demanda de insumos dos projetos planejados. Novas construções tornam-se menos preferidas à medida que os ganhos esperados se aproximam do déficit de demanda mais 10% da demanda. Novos inícios são pausados nessa quantia. O nível final pode ultrapassá-la; os projetos existentes continuam.\nDesativar a proteção de força de trabalho interrompe as previsões, mas a escassez atual ainda reduz a prioridade. Salvaguardas de alimentos ativadas podem priorizar O.C.R. relevantes e dispensar limites de preço e expansão. O emprego total existente e os requisitos aplicáveis de força de trabalho, orçamento e construção do jogo ainda se aplicam."
 eu5ab_workforce_help: "Edifícios comuns usam por padrão uma previsão de 12 meses; O.C.R. no modo Considerar População usam 180 meses. As estimativas usam taxas atuais de promoção, modificadores locais e nacionais, Muitas Oportunidades, alfabetização e população elegível. Migração, alteração de taxas e postos concorrentes podem afetar os resultados.\nDesativar a proteção de força de trabalho encerra as previsões. A escassez atual reduz a prioridade sem alterar o lucro previsto; salvaguardas alimentares ainda se aplicam conforme configurado."
