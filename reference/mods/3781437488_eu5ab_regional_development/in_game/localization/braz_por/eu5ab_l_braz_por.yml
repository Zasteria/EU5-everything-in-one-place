 eu5ab_open_confirmation: "Abrir confirmação"
 eu5ab_reset_confirm: "Confirmar redefinição"
 eu5ab_reset_confirm_desc: "Mantém modelos e configurações, mas limpa atribuições de locais, planos, períodos de espera, relatórios, recomendações e registros de projetos e gastos anuais. O ouro gasto não é reembolsado; construções em andamento continuam. Reatribua modelos depois.\nApós trocar de país, substitui os modelos e configurações deste país por aqueles salvos antes da troca."
 eu5ab_deep_confirm_desc: "Verifica novamente os locais próprios com modelos ativados e substitui o plano não executado deste mês. Usa a estratégia atual, salvaguardas alimentares e ordem de construção; o projeto final pode ultrapassar o orçamento restante.\nPaíses grandes podem demorar; a janela não pode ser fechada até o planejamento terminar. Alterações posteriores nas configurações não mudarão este plano. Organiza construções a partir do dia 23; retoma as verificações regulares no próximo mês."
