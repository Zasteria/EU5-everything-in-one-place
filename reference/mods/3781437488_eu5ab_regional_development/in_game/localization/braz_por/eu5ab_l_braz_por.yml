 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Defina orçamento, requisitos de construção, estratégia de decisão e desempenho compartilhados por todos os modelos. Cada modelo guarda ativação, cobertura e prioridades próprias."
 eu5ab_regional_development__general_name: "Controles e limites"
 eu5ab_regional_development__finance_name: "Finanças e mercado"
 eu5ab_regional_development__automation_name: "Segurança e classificação"
 eu5ab_regional_development__performance_name: "Otimização de desempenho"
 eu5ab_regional_development__performance__preset_name: "Predefinição de desempenho"
 eu5ab_regional_development__performance__preset_desc: "As predefinições ajustam as opções abaixo. Alterar uma opção avançada muda para Personalizado; os novos valores valem na próxima verificação mensal."
 eu5ab_regional_development__performance__advanced_name: "Configurações avançadas"
 eu5ab_regional_development__performance__advanced_desc: "Ajusta as verificações diárias de locais, novos projetos por rodada e o número de alternativas. Verificar mais projetos pode levar mais tempo."
 eu5ab_regional_development__general__limits_name: "Controles e limite simultâneo"
 eu5ab_regional_development__general__limits_desc: "Controla se o Mod está ativo e quantos projetos civis pode gerenciar ao mesmo tempo."
 eu5ab_regional_development__general__returns_name: "Regras de retorno e exceções de emergência"
 eu5ab_regional_development__general__returns_desc: "Defina o retorno mínimo de edifícios comuns e se faltas de alimentos, materiais, bens militares ou insumos estratégicos podem dispensá-lo."
 eu5ab_regional_development__finance__budget_name: "Orçamento anual compartilhado"
 eu5ab_regional_development__finance__budget_desc: "Todos os modelos, edifícios e O.C.R. compartilham um único orçamento anual nacional."
 eu5ab_regional_development__finance__market_name: "Faixa de preços do mercado"
 eu5ab_regional_development__finance__market_desc: "Defina percentuais compartilhados de preço mínimo e referência de preço alto em relação ao preço-base."
 eu5ab_regional_development__automation__safety_name: "Regras de segurança da construção"
 eu5ab_regional_development__automation__safety_desc: "Regras compartilhadas para edifícios especiais, fontes a montante, mão de obra e falta de insumos."
 eu5ab_regional_development__automation__rgo_name: "Expansão de O.C.R."
 eu5ab_regional_development__automation__workforce_name: "Previsão da mão de obra"
 eu5ab_regional_development__automation__workforce_desc: "Configura o horizonte máximo de previsão ao projetar o suprimento futuro de força de trabalho."
 eu5ab_regional_development__automation__ranking_name: "Estratégia de decisão de construção"
 eu5ab_regional_development__automation__ranking_desc: "Escolha a estratégia para edifícios comuns, ordene melhorias, expansões, O.C.R. e novas construções e defina a influência dos insumos locais."
 eu5ab_regional_development__candidate_ranking_mode_name: "Estratégia para edifícios comuns"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Tentar outros projetos"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Se os projetos principais no tipo atual não puderem iniciar, tenta alternativas de classificação inferior. Cada local recebe até 2 tentativas extras por rodada para Planejamento de Oferta e Demanda ou 5 para Seleção por Lucro Previsto, compartilhadas entre os tipos comuns. Para assim que um edifício comum iniciar ali. Carregar um jogo salvo não restaura tentativas. Todos os requisitos ainda se aplicam. Desativado por padrão; entra em vigor na próxima rodada e pode aumentar o tempo de verificação."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Escolha como os edifícios comuns elegíveis são priorizados. Salvaguardas alimentares e a Ordem de Construção Automática têm precedência. O.C.R. são avaliadas separadamente por escassez, preços, emprego e necessidades estratégicas."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Oferta e demanda"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Classifica projetos por escassez do mercado, necessidade estratégica, eficiência da receita, insumos locais, preços e risco de mão de obra, favorecendo cadeias completas e estabilidade de longo prazo."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Lucro previsto"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtra candidatos pelas regras do modelo e de segurança e prioriza a construção pelo benefício líquido mensal previsto, incluindo ganhos de moinhos de vento e alimentos preservados por celeiros. Quando os benefícios são próximos, as prioridades do modelo servem como referência secundária."
 eu5ab_regional_development__automation__candidate_priority_name: "Ordem de construção automatizada"
 eu5ab_regional_development__automation__candidate_priority_desc: "Arraste os quatro tipos para a ordem desejada. O Mod tenta todos os projetos que pode iniciar no tipo atual antes de passar para o próximo; se um projeto não puder iniciar, procura outro do mesmo tipo. Durante emergência alimentar, projetos de comida são priorizados mas ainda seguem esta ordem."
 eu5ab_regional_development__candidate_priority_name: "Ordem de construção automatizada"
 eu5ab_regional_development__candidate_priority_desc: "Arraste para ordenar melhorias, expansões comuns, expansões de O.C.R. e novos edifícios."
 eu5ab_regional_development__candidate_priority_item_column_name: "Tipo de construção"
 eu5ab_regional_development__candidate_priority_i1_name: "Melhorar edifícios"
 eu5ab_regional_development__candidate_priority_i1_desc: "Substitua um edifício obsoleto pelo nível desbloqueado mais recente da sua cadeia."
 eu5ab_regional_development__candidate_priority_i2_name: "Expandir edifícios existentes"
 eu5ab_regional_development__candidate_priority_i2_desc: "Adicione um nível a um edifício comum existente, sem substituições nem O.C.R."
 eu5ab_regional_development__candidate_priority_i3_name: "Expandir O.C.R."
 eu5ab_regional_development__candidate_priority_i3_desc: "Expande O.C.R. locais, exigindo pleno emprego existente e cumprindo as regras de preço, orçamento anual e reserva do tesouro."
 eu5ab_regional_development__candidate_priority_i4_name: "Construir novos edifícios"
 eu5ab_regional_development__candidate_priority_i4_desc: "Construa do zero um edifício comum que ainda não existe no local."
 eu5ab_regional_development__enabled_name: "Ativar construção automatizada"
 eu5ab_regional_development__enabled_desc: "Ativa ou desativa as verificações mensais de construção automatizada. Modelos e atribuições de locais são mantidos quando desativado."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Projetos simultâneos extras"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Quantos projetos civis este Mod pode executar ao mesmo tempo além do espaço base. 0 significa 1 projeto no total e 599 significa 600; construções manuais, estradas e outros Mods não usam este limite."
 eu5ab_regional_development__budget_mode_name: "Modo de orçamento anual"
 eu5ab_regional_development__budget_mode_desc: "Escolha um valor fixo ou 4, 6 ou 8 vezes a renda mensal total. Recalcula na primeira verificação do novo ano; alterar as configurações preserva os gastos já registrados."
 eu5ab_regional_development__budget_mode_option_1_name: "Orçamento anual fixo"
 eu5ab_regional_development__budget_mode_option_2_name: "Renda mensal ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Renda mensal ×6 (recomendado)"
 eu5ab_regional_development__budget_mode_option_4_name: "Renda mensal ×8"
 eu5ab_regional_development__economic_metric_name: "Limiar Econômico de Edifícios Comuns"
 eu5ab_regional_development__economic_metric_desc: "Edifícios de produção comuns devem atender à condição selecionada: renda ou lucro mensal previsto positivo, ou um retorno anualizado de 5%. Retornos reais podem mudar. Infraestrutura pública comum é isenta. Moinhos de vento precisam de ganhos líquidos positivos da produção extra e um retorno anual de 5% nos modos de taxa de retorno. Celeiros construídos para economia de deterioração sempre precisam de 5%. O.C.R. seguem regras separadas."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Renda Mensal > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Inicie apenas se o jogo prever renda mensal positiva."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Lucro Mensal > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Inicie apenas se o jogo prever lucro mensal total positivo."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Retorno Anualizado da Renda ≥ 5%"
 eu5ab_regional_development__economic_metric_option_3_desc: "A renda mensal prevista deve ser de pelo menos 5% do custo de construção dividido por 12. Isso compara a renda antes dos custos operacionais."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Retorno Anualizado do Lucro ≥ 5%"
 eu5ab_regional_development__economic_metric_option_4_desc: "O lucro mensal previsto deve ser de pelo menos 5% do custo de construção dividido por 12. O lucro real pode mudar com as condições operacionais."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Alimentos vão acabar: construir primeiro, ignorar retorno"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Quando houver previsão de esgotamento de alimentos no mercado, trate projetos alimentares primeiro e dispense edifícios de comida da exigência de retorno. Os projetos alimentares ainda seguem a Ordem de Construção Automática, e todas as regras de orçamento, tesouro, força de trabalho, insumos, materiais e construção do jogo continuam em vigor."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Alimentos em 25% ou menos: construir primeiro, ignorar retorno"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Enquanto a comida no mercado estiver em 25% ou menos, prioriza projetos alimentares e isenta edifícios de comida do retorno mínimo. Os projetos alimentares ainda seguem a Ordem de Construção Automática e todas as outras regras de segurança permanecem em vigor."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Oferta de construção abaixo de 65%: ignorar retorno"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Quando um material básico de construção tiver menos de 65% do suprimento necessário, os edifícios que o produzem não precisam atender ao retorno econômico. Todas as outras regras de construção continuam aplicáveis."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Oferta militar em guerra abaixo de 65%: ignorar retorno"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Em guerra, se um bem militar tiver menos de 65% do suprimento necessário, os edifícios que o produzem ficam isentos do retorno econômico. Todas as outras regras de construção continuam ativas."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Produção estratégica sem insumos: ignorar retorno a montante"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Quando a oferta de uma matéria-prima no mercado for inferior a 65% da demanda e houver, nesse mesmo mercado, um edifício nacional de alimentos, materiais básicos de construção ou produtos militares que esteja aberto, consuma essa matéria-prima e sofra falta de insumos, os produtores dessa matéria-prima ficam isentos do limite de retorno selecionado. O edifício consumidor não precisa ter parado de produzir, e o insumo em falta não precisa ser essa matéria-prima específica. Todas as outras regras de construção continuam em vigor."
 eu5ab_regional_development__fixed_annual_budget_name: "Orçamento anual fixo"
 eu5ab_regional_development__fixed_annual_budget_desc: "Usado apenas no modo fixo; todos os modelos compartilham este valor."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Reserva mínima do tesouro"
 eu5ab_regional_development__min_cash_reserve_desc: "Mantém esta reserva após os custos estimados de todos os projetos planejados. Os custos reais de O.C.R. podem diferir."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Percentual de preço mínimo"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Percentual de referência de preço alto"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Permitir edifícios especiais"
 eu5ab_regional_development__allow_special_buildings_desc: "Permita considerar edifícios especiais; os requisitos de construção do jogo continuam válidos."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Suprir escassez de mercado com vagas livres de construção"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "Após projetos regulares, usa o espaço de construção livre para suprir a escassez em locais próprios verificados nesta rodada no mesmo mercado. Considera as necessidades de insumos de projetos planejados e ganhos de produção ainda não realizados. Predefinições integradas podem adicionar indústrias não planejadas; proibições, prioridade personalizada 0 e outros requisitos de construção ainda se aplicam."
 eu5ab_regional_development__auto_build_input_sources_name: "Construir fontes a montante na escassez"
 eu5ab_regional_development__auto_build_input_sources_desc: "Verifica de forma independente a escassez de insumos no mercado e constrói fontes a montante permitidas, inclusive quando as fábricas a jusante estiverem com pessoal completo, mas sem insumos."
 eu5ab_regional_development__pause_low_workforce_name: "Pausar com pouca mão de obra"
 eu5ab_regional_development__stop_input_shortage_name: "Parar com falta de insumos críticos"
 eu5ab_regional_development__stop_input_shortage_desc: "Os principais insumos industriais necessários devem ter oferta de mercado cobrindo pelo menos 75% da demanda antes que a construção relacionada possa ser organizada."
 eu5ab_regional_development__allow_rgo_name: "Permitir expansão de O.C.R."
 eu5ab_regional_development__allow_rgo_desc: "Permita que todos os modelos considerem expandir O.C.R."
 eu5ab_regional_development__native_input_priority_name: "Prioridade de insumos locais"
 eu5ab_regional_development__native_input_priority_desc: "0–10; valores maiores aumentam a prioridade de edifícios que consom matérias-primas produzidas na mesma província."
 eu5ab_regional_development__performance_preset_name: "Predefinição de desempenho"
 eu5ab_regional_development__performance_preset_desc: "Uma predefinição sincroniza as opções avançadas abaixo. Personalizado mantém os valores atuais."
 eu5ab_regional_development__performance_preset_option_1_name: "Conservador"
 eu5ab_regional_development__performance_preset_option_1_desc: "Verifica até 10 locais por dia e inicia no máximo 30 projetos por rodada. Candidatos de Planejamento: 5; de Lucro: 15. Para ao encontrar candidatos suficientes."
 eu5ab_regional_development__performance_preset_option_2_name: "Equilibrada"
 eu5ab_regional_development__performance_preset_option_2_desc: "Verifica até 20 locais por dia e inicia no máximo 50 projetos por rodada. Candidatos de Planejamento: 4; de Lucro: 12. Para ao encontrar candidatos suficientes."
 eu5ab_regional_development__performance_preset_option_3_name: "Desempenho máximo"
 eu5ab_regional_development__performance_preset_option_3_desc: "Para países com muitos locais. Verifica até 30 por dia, sem limite por rodada. Candidatos de Planejamento: 3; de Lucro: 10. Para quando há candidatos suficientes."
 eu5ab_regional_development__performance_preset_option_4_name: "Personalizado"
 eu5ab_regional_development__performance_preset_option_4_desc: "Use as configurações avançadas atuais."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Muitos locais com modelos podem reduzir o desempenho."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "No modo de Taxa Máxima de Processamento, até 30 locais são verificados diariamente sem limite por rodada. Reinos muito extensos podem sofrer lentidão na passagem mensal."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Oferta e Demanda\" muito lento: reduza \"Candidatos de Planejamento\"."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Só aparece em Oferta e Demanda. Menos Candidatos de Planejamento reduz os projetos por local e tipo enviados às verificações seguintes."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Consequência: menos candidatos alternativos podem ignorar projetos viáveis posteriores."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Os projetos são verificados em ordem decrescente de pontuação. Reduzir o limite de candidatos deixa menos alternativas se os projetos do topo falharem, podendo ignorar projetos viáveis posteriores."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "“Lucro previsto” está lento: reduza “Candidatos de lucro por local”."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Exibido apenas com “Lucro previsto”. Reduza “Candidatos de lucro por local” para diminuir as alternativas verificadas depois."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Menos alternativas podem não deixar outra escolha se os projetos principais não puderem iniciar."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Alternativas são retidas após classificação por lucro previsto e preferências de edifícios. Manter menos deixa menos opções quando os projetos principais não puderem iniciar."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Também reduza locais diários ou adições por rodada."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Menos locais diários distribuem as verificações por mais dias. Menos adições por rodada reduzem os projetos organizados de uma só vez. Definir adições como 0 remove o limite por rodada."
 eu5ab_regional_development__parallel_location_scan_name: "Processar locais separadamente"
 eu5ab_regional_development__parallel_location_scan_desc: "Verifica locais separadamente para reduzir pausas, ou juntos a cada dia quando desativado. Prioridades, orçamento e ordem de construção continuam os mesmos."
 eu5ab_regional_development__daily_location_task_limit_name: "Locais verificados por dia"
 eu5ab_regional_development__daily_location_task_limit_desc: "Máximo de locais verificados em detalhes a cada dia. Valores menores significam menos trabalho diário, mas mais dias para cobrir o país."
 eu5ab_regional_development__max_additions_per_run_name: "Máximo de adições por rodada"
 eu5ab_regional_development__max_additions_per_run_desc: "Limita o número máximo de projetos iniciados em uma rodada, de 0 a 600. Zero significa sem limite."
 eu5ab_regional_development__candidates_per_location_name: "Candidatos de planejamento por local"
 eu5ab_regional_development__candidates_per_location_desc: "Ativo apenas em 'Planejamento de Oferta e Demanda'. Define, para cada local e categoria de construção comum, o número de candidatos retidos pela pontuação de planejamento para verificações subsequentes (3–30). Reter mais candidatos reduz o risco de ignorar alternativas viáveis, mas aumenta o impacto no desempenho."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Candidatos de lucro por local"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Apenas para Seleção por Lucro Previsto. Mantém 3–30 alternativas por local e tipo de construção comum, classificadas por lucro previsto e preferências de edifícios. Mais alternativas oferecem mais opções quando projetos principais não puderem iniciar, mas podem desacelerar verificações posteriores."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Parar ao encontrar candidatos suficientes"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Interrompe as verificações detalhadas de outros locais quando as alternativas atingirem o dobro dos projetos que podem ser adicionados nesta rodada. O espaço livre e as Adições Máximas por Execução definem este número; 0 remove apenas o limite por rodada. Requisitos de construção ainda se aplicam."
 eu5ab_diagnostics_cmm_hint: "Altere as regras compartilhadas nas Configurações de Mod do Community Mod Framework. O Relatório de construção mostra o último resultado automatizado."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "Aumentar em 10"
 eu5ab_cmm_shift_decrease_10: "Diminuir em 10"
 eu5ab_cmm_shift_increase_1000: "Aumentar em 1000"
 eu5ab_cmm_shift_decrease_1000: "Diminuir em 1000"
 eu5ab_cmm_shift_increase_max: "Definir como máximo"
 eu5ab_cmm_shift_decrease_min: "Definir como mínimo"
 eu5ab_regional_development__automation__rgo_desc: "Considera a expansão de O.C.R. quando os postos existentes estiverem preenchidos. Escolha se deseja prever trabalhadores para novos postos."
 eu5ab_regional_development__rgo_workforce_mode_name: "Modo de força de trabalho das O.C.R."
 eu5ab_regional_development__rgo_forced_relaxed_name: "Modo de O.C.R.: Relaxado (pausa por força de trabalho desativada)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "Sem previsão de força de trabalho. Os postos existentes devem estar preenchidos; a escassez para novos postos apenas reduz a prioridade de construção."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Relaxado por padrão. Desativar a proteção de força de trabalho usa temporariamente o modo Relaxado e reduz a prioridade por escassez atual de trabalhadores. Reativar restaura o modo selecionado. Os postos existentes devem estar sempre preenchidos."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Relaxado"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Segue as regras gerais de expansão do jogo: quando os postos existentes estiverem preenchidos, avalia preços, necessidades de mercado e produção esperada sem prever novos trabalhadores. Com a proteção de força de trabalho ativada, a escassez para novos postos não reduz a prioridade."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Considerar População"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "Após verificar o pleno emprego existente, estima promoções qualificadas ao longo do horizonte. Pausa se os trabalhadores não puderem preencher o próximo nível."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "Horizonte populacional de O.C.R. (meses)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "No modo Considerar População, a expansão exige que trabalhadores suficientes sejam esperados dentro deste período para preencher os novos postos. Padrão: 180 meses. Intervalo: 0–1200; zero conta apenas trabalhadores disponíveis no momento. A estimativa leva em conta Muitas Oportunidades, alfabetização e a população elegível para mudar de profissão. Previsões mais longas podem divergir mais dos resultados reais. Clique para ajustar em 1 mês, segure Ctrl para 12 meses ou Shift para 120 meses."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "Quando ativado, edifícios comuns precisam de previsão suficiente de trabalhadores; O.C.R. usam seu modo selecionado. Desativar isso interrompe previsões e usa temporariamente o modo Relaxado para O.C.R. A escassez atual reduz a prioridade sem bloquear novos projetos por si só. Postos existentes de O.C.R. ainda devem estar preenchidos. Reativar restaura o modo anterior de O.C.R."
 eu5ab_regional_development__job_fill_deadline_months_name: "Horizonte de força de trabalho de edifícios comuns (meses)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Horizonte independente para edifícios comuns: padrão de 12 meses, intervalo de 0 a 240. Zero conta apenas trabalhadores ociosos qualificados no momento. O.C.R. que consideram população usam seu horizonte separado. Taxas de promoção atuais são uma estimativa, não uma garantia."
 eu5ab_regional_development__price_min_desc: "Padrão: 80% do preço-base. Preços menores reduzem a prioridade. Pausa a construção quando todas as produções estiverem no limite ou abaixo dele; pondera múltiplas produções por quantidade e preço-base. Em 100% ou acima, apenas o limite se aplica. Salvaguardas de alimentos ativadas podem dispensar limites de preço."
 eu5ab_regional_development__price_max_desc: "Padrão: 125%. Preços acima da base adicionam prioridade gradualmente até a referência. Com uma referência de 125%, um preço de 112,5% adiciona 70 pontos; 125% ou mais adiciona 140. Se a referência for 100% ou menor, qualquer preço acima da base adiciona 140."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
 eu5ab_cmm_shift_increase_120: "Aumentar em 120 meses"
 eu5ab_cmm_ctrl_increase_12: "Aumentar em 12 meses"
 eu5ab_cmm_ctrl_increase_default: "Aumentar em [Multiply_CFixedPoint(Player.MakeScope.GetVariableFromVariableMap('cmm_step', MakeScopeFlag(Scope.GetFlagName)).GetValue, '(CFixedPoint)5')]"
 EU5AB_CMM_NUMERIC_DECREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_decrease_12', 'eu5ab_cmm_ctrl_decrease_default')]"
 eu5ab_cmm_shift_decrease_120: "Diminuir em 120 meses"
 eu5ab_cmm_ctrl_decrease_12: "Diminuir em 12 meses"
 eu5ab_cmm_ctrl_decrease_default: "Diminuir em [Multiply_CFixedPoint(Player.MakeScope.GetVariableFromVariableMap('cmm_step', MakeScopeFlag(Scope.GetFlagName)).GetValue, '(CFixedPoint)5')]"
 eu5ab_regional_development__governors_name: "Recomendações de governadores"
 eu5ab_regional_development__governors__recommendations_name: "Recomendações e atualização"
 eu5ab_regional_development__governors__recommendations_desc: "Analisa candidatos a Governador Local e Governador Naval sem construir, remover ou realocar edifícios."
 eu5ab_regional_development__governors__scoring_name: "Preferências de pontuação"
 eu5ab_regional_development__governors__scoring_desc: "Escolha como o valor do local é ponderado e se o valor estratégico limitado é incluído."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Habilitar recomendações de governadores"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Sugere periodicamente locais de Governador Local e Naval. Desativar mantém os últimos resultados, mas remove alertas de recomendação."
 eu5ab_regional_development__governor_refresh_interval_name: "Intervalo de atualização"
 eu5ab_regional_development__governor_refresh_interval_desc: "Define o intervalo de atualização. Algumas mudanças de território, capital, classificação de local e governo acionam atualizações antecipadas. Estradas e outras mudanças de proximidade são incluídas nas verificações programadas."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "A cada mês"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "Atualiza mais rapidamente e é adequado para países menores. Verificações frequentes podem causar pausas mais longas em países grandes."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "A cada 3 meses"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Equilíbrio entre resposta a mudanças em estradas e desempenho em países grandes."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "A cada 6 meses"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Frequência menor de recálculo para países grandes."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "A cada 12 meses"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "Menor custo, mas mudanças em estradas e proximidade podem levar até um ano para aparecer."
 eu5ab_regional_development__governor_refresh_now_name: "Recalcular agora"
 eu5ab_regional_development__governor_refresh_now_text: "Recalcular agora"
 eu5ab_regional_development__governor_refresh_now_desc: "Recalcula as recomendações de sedes locais e navais agora, inclusive durante a pausa. Países grandes podem ter uma breve lentidão."
 eu5ab_regional_development__governor_scoring_profile_name: "Perfil de valor do local"
 eu5ab_regional_development__governor_scoring_profile_desc: "Pondera a base tributária potencial, população e desenvolvimento. As pontuações são estimadas a partir dos valores dos locais multiplicados pelas melhorias esperadas de Proximidade, em vez de um valor final de Controle; o Controle atual não é somado nem deduzido."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Misto"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Equilibra valor econômico e administrativo-populacional."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Econômico"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Enfatiza a base fiscal potencial e a escala econômica estabelecida."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "População administrativa"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Enfatiza população e desenvolvimento."
 eu5ab_regional_development__governor_strategic_value_name: "Incluir valor estratégico"
 eu5ab_regional_development__governor_strategic_value_desc: "Aplica peso limitado a portos, locais de fronteira e locais fortificados. Isso altera apenas o valor do local e não é um componente separado de pontuação."
 eu5ab_governor_window_title: "Detalhes das recomendações de governadores"
 eu5ab_governor_window_intro: "Veja sugestões de novos locais e de realocação. As alterações de edifícios cabem a você."
 eu5ab_governor_road_tier_help: "As estimativas usam o nível mais alto de estrada desbloqueado; os ganhos reais podem variar.\nCada plano mantém fixo o outro tipo de sede. Recalcule após as alterações; os ganhos não podem ser somados."
 eu5ab_governor_refresh_button: "Recalcular"
 eu5ab_governor_refresh_button_tt: "Reavalia novos locais, realocações e disposições para sedes de Governador Local e Naval. Países grandes podem ter uma breve pausa; verificações incompletas exibem um aviso."
 eu5ab_governor_local_section: "Governador Local"
 eu5ab_governor_local_diagnostics: "Último cálculo de sede local: estágio [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0], status [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0]; capacidade [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0], contagem da engine [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0] sedes locais e [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0] tenências; outras vagas ocupadas [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0].\nContagem por local: [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0] sedes locais e [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0] tenências; outras vagas ocupadas [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0]; vaga livre (engine/local) [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0]; divergência [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0] (1 significa diferente).\nLimiar de ganho para novo local [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1]; locais candidatos [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0], locais pontuados [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]."
 eu5ab_governor_naval_section: "Governador Naval"
 eu5ab_governor_naval_diagnostics: "Último cálculo de sede naval: status [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_status_ui')|0]; atualizações [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_runs_ui')|0]."
 eu5ab_governor_new_slot_state: "Um espaço está disponível. Você pode construir uma sede em um destes locais."
 eu5ab_governor_empty_title: "Nenhum candidato adequado"
 eu5ab_governor_no_recommendation: "#weak Recalcule após o desenvolvimento de seu território ou cidades.#!"
 eu5ab_governor_candidate_1: "Ranque 1"
 eu5ab_governor_candidate_2: "Ranque 2"
 eu5ab_governor_candidate_3: "Ranque 3"
 eu5ab_governor_view_location: "Ver local"
 eu5ab_governor_view_location_tt: "Move a câmera do mapa para este candidato."
 eu5ab_governor_local_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1').GetLocation.GetName]"
 eu5ab_governor_local_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2').GetLocation.GetName]"
 eu5ab_governor_local_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "Pontuação geral [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Ganho de Melhoria de Proximidade Local [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Ganho de Melhoria de Proximidade Circundante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nEspera-se que a Proximidade melhore em [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] locais (incluindo a sede).\nAs pontuações são estimadas multiplicando o valor dos locais pelo aumento esperado de Proximidade, não sendo um valor final de Controle; o Controle atual não é somado nem deduzido, e o Controle real continuará evoluindo através do Controle Máximo e da mecânica normal do jogo."
 eu5ab_governor_local_candidate_2_breakdown: "Pontuação geral [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Ganho de Melhoria de Proximidade Local [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Ganho de Melhoria de Proximidade Circundante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nEspera-se que a Proximidade melhore em [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] locais (incluindo a sede).\nAs pontuações são estimadas multiplicando o valor dos locais pelo aumento esperado de Proximidade, não sendo um valor final de Controle; o Controle atual não é somado nem deduzido, e o Controle real continuará evoluindo através do Controle Máximo e da mecânica normal do jogo."
 eu5ab_governor_local_candidate_3_breakdown: "Pontuação geral [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Ganho de Melhoria de Proximidade Local [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Ganho de Melhoria de Proximidade Circundante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nEspera-se que a Proximidade melhore em [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] locais (incluindo a sede).\nAs pontuações são estimadas multiplicando o valor dos locais pelo aumento esperado de Proximidade, não sendo um valor final de Controle; o Controle atual não é somado nem deduzido, e o Controle real continuará evoluindo através do Controle Máximo e da mecânica normal do jogo."
 eu5ab_governor_naval_candidate_1_breakdown: "Pontuação geral [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = Ganho de Melhoria de Proximidade do Local [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Ganho de Melhoria de Proximidade ao Redor [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nEspera-se que a proximidade melhore em [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] locais (incluindo o próprio local).\nAs pontuações são estimadas multiplicando os valores dos locais pelos aumentos esperados de proximidade, não correspondendo ao valor final de controle; o controle atual não adiciona nem deduz pontos, e o controle real continuará evoluindo através do controle máximo e da mecânica normal do jogo."
 eu5ab_governor_naval_candidate_2_breakdown: "Pontuação geral [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_score').GetValue|1] = Ganho de Melhoria de Proximidade do Local [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_site_gain').GetValue|1] + Ganho de Melhoria de Proximidade ao Redor [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_surrounding_gain').GetValue|1].\nEspera-se que a proximidade melhore em [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2_coverage').GetValue|0] locais (incluindo o próprio local).\nAs pontuações são estimadas multiplicando os valores dos locais pelos aumentos esperados de proximidade, não correspondendo ao valor final de controle; o controle atual não adiciona nem deduz pontos, e o controle real continuará evoluindo através do controle máximo e da mecânica normal do jogo."
 eu5ab_governor_naval_candidate_3_breakdown: "Pontuação geral [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_score').GetValue|1] = Ganho de Melhoria de Proximidade do Local [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_site_gain').GetValue|1] + Ganho de Melhoria de Proximidade ao Redor [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_surrounding_gain').GetValue|1].\nEspera-se que a proximidade melhore em [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3_coverage').GetValue|0] locais (incluindo o próprio local).\nAs pontuações são estimadas multiplicando os valores dos locais pelos aumentos esperados de proximidade, não correspondendo ao valor final de controle; o controle atual não adiciona nem deduz pontos, e o controle real continuará evoluindo através do controle máximo e da mecânica normal do jogo."
