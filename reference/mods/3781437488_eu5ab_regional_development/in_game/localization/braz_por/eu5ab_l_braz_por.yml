 eu5ab_diag_result_help: "Quando as salvaguardas alimentares ativadas se aplicam, os projetos de alimentos vêm primeiro. Outros projetos seguem a Ordem de Construção Automática, tentando alternativas se um projeto não puder iniciar.\nO.C.R. são avaliadas por escassez, preços, emprego e necessidades estratégicas, sujeitos aos requisitos de construção do jogo.\nApenas inícios bem-sucedidos usam orçamento e espaço de construção. Após a rodada, locais com novos projetos aguardam 3 meses antes de novas construções."
 eu5ab_diag_rgo_title: "Verificações de candidatos O.C.R."
 eu5ab_diag_rgo_short_desc: "Cada local registra um resultado; uma rejeição conta para o primeiro motivo encontrado."
 eu5ab_diag_rgo_help: "Mostra a última verificação de expansão de O.C.R. Os postos existentes devem estar preenchidos. Considerar População prevê novos trabalhadores; Relaxado não. Preços, ganhos de produção ainda não realizados e a escassez atual de trabalhadores afetam a prioridade. Ganhos de produção são combinados para projetos próprios que produzem o mesmo bem no mesmo mercado; dados incompletos mostram apenas valores conhecidos. Atingir o limite pausa novos inícios, não projetos existentes."
