 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] ouro"
 eu5ab_cash_help: "Antes da construção, os custos estimados deste e de outros projetos planejados devem deixar ouro suficiente para a reserva do tesouro.\nCom 1.050 de ouro e uma reserva de 1.000, um projeto estimado em 100 não pode iniciar. Os custos reais de O.C.R. podem diferir das estimativas. Algum orçamento anual também deve restar."
