 eu5ab_operating_rules_title: "Regras de construção"
 eu5ab_operating_rules_short_desc: "Configure edifícios especiais, construção a montante e escassez de insumos."
 eu5ab_operating_rules_help: "Edifícios especiais devem atender aos requisitos de desbloqueio e construção do jogo.\nA escassez de insumos pode estimular a construção de fornecedores permitidos pelo modelo, mesmo quando as fábricas existentes estiverem com pessoal completo.\nCom a proteção de insumos ativada, a oferta dos principais insumos industriais necessários deve cobrir 75% da demanda. Usa os métodos de produção atuais sempre que possível, caso contrário estima um método disponível. Métodos alternativos são avaliados separadamente; métodos de produção não são alterados automaticamente."
 eu5ab_rgo_section_title: "O.C.R."
 eu5ab_rgo_allow: "Permitir que este modelo expanda O.C.R."
 eu5ab_toggle_special_buildings: "Permitir edifícios especiais"
 eu5ab_toggle_auto_build_input_sources: "Construir fontes quando faltarem insumos"
 eu5ab_toggle_pause_low_workforce: "Pausar Expansão com Pouca Força de Trabalho"
 eu5ab_ranking_mode_section_title: "Estratégia de decisão de construção"
 eu5ab_town_rights_preference_desc: "Direitos urbanos e Fomentar Indústria adicionam até 500 pontos de planejamento cada um, de forma independente. O apoio à indústria aplica-se apenas a saídas diretas de edifícios compatíveis na sua área promovida, ponderadas pela saída da receita selecionada a preços-base; não se propaga pelas cadeias de suprimentos. Ambos acumulam com pontos de insumos locais. O modo de lucro usa esses pontos apenas para pré-seleção. A expansão de O.C.R. retém apenas o bônus de direitos urbanos. Todos os requisitos de construção ainda se aplicam."
 eu5ab_ranking_mode_current_label: "Modo atual"
 eu5ab_ranking_mode_composite_value: "#G Planejamento de oferta e demanda#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Seleção por lucro previsto#!"
 eu5ab_ranking_mode_common_desc: "Ambas as estratégias consideram apenas edifícios desbloqueados e construíveis com prioridade acima de 0. Também exigem retorno, orçamento, reserva, insumos, força de trabalho e demais regras de segurança. Emergências alimentares e a ordem automática vêm primeiro."
 eu5ab_ranking_mode_composite_desc: "Equilibra escassez de mercado, demanda estratégica, eficiência de produção, matérias-primas locais, preços e risco de força de trabalho, priorizando cadeias produtivas completas e estabilidade a longo prazo."
 eu5ab_ranking_mode_actual_profit_desc: "Filtra os projetos candidatos pelas regras do modelo e de segurança e prioriza a construção pelo benefício líquido mensal previsto, incluindo os ganhos de recursos dos moinhos de vento e o valor dos alimentos preservados pelos celeiros. Quando os benefícios previstos são próximos, as prioridades configuradas no modelo servem como referência secundária."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Mantém de 3 a 30 alternativas configuradas por local e tipo de construção comum. Salvaguardas de alimentos e a Ordem de Construção Automática têm precedência; requisitos de retorno e construção ainda se aplicam. O.C.R. são avaliadas separadamente por escassez, preços, emprego e necessidades estratégicas."
 eu5ab_ranking_mode_help: "Estratégia de Decisão\nAlterne estratégias em Community Mod Framework → Configurações de Mods → Construção Automática Avançada → Segurança e Classificação → Estratégia de Decisão de Construção.\n• Planejamento de Oferta e Demanda: Enfatiza a oferta e demanda do mercado, cadeias produtivas completas e estabilidade econômica a longo prazo.\n• Seleção por Lucro Previsto: Usa o benefício líquido mensal previsto, incluindo ganhos de moinhos de vento e economia de deterioração em celeiros, com as prioridades do modelo como critério de desempate."
 eu5ab_workforce_section_title: "Força de trabalho"
 eu5ab_pause_workforce_short_desc: "Controla se a escassez de força de trabalho impede a expansão."
 eu5ab_job_fill_deadline_label: "Horizonte de Previsão da Força de Trabalho"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_value: "Horizonte de previsão da força de trabalho: [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_desc: "Define o horizonte máximo de previsão da força de trabalho em meses (0–240). Zero considera apenas os trabalhadores disponíveis atualmente, sem futuras promoções. «Pausar com pouca mão de obra» determina se a falta de trabalhadores impede o início da obra: quando ativado, uma previsão insuficiente bloqueia a obra; quando desativado, a falta de trabalhadores apenas reduz a prioridade."
 eu5ab_deadline_0: "0 mês"
 eu5ab_deadline_3: "3 meses"
 eu5ab_deadline_6: "6 meses"
 eu5ab_deadline_12: "12 meses"
 eu5ab_toggle_stop_input_shortage: "Parar Expansão com Escassez Crítica de Insumos"
 eu5ab_prediction_status_label: "Estimativa de força de trabalho"
 eu5ab_status_promotion_forecast: "#G Previsão de promoção no prazo selecionado#!"
 eu5ab_status_conservative_fallback: "#L Estimativa Conservadora da Força de Trabalho Atual#!"
 eu5ab_prediction_promotion_short_desc: "Combina trabalhadores disponíveis com a população elegível para promoção na classe-alvo no horizonte (até 240 meses)."
 eu5ab_prediction_unavailable_short_desc: "Quando não há previsão confiável, baseia-se estritamente nos trabalhadores ociosos atuais."
 eu5ab_native_input_section_title: "Preferência por insumos locais"
 eu5ab_native_input_short_desc: "Eleva a classificação de edifícios que usam matérias-primas da mesma província."
 eu5ab_native_input_priority_label: "Prioridade de insumos locais"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Prioridade de insumos locais: [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Preferência por Matérias-Primas Locais\nLocal refere-se à província que contém o edifício. O sistema verifica as matérias-primas exigidas pela receita do edifício e concede um bônus de classificação quando OCRs correspondentes existem na província; insumos com maior participação na receita geram um bônus maior.\n• 0 ignora matérias-primas locais, 5 é a recomendação padrão e 10 concede peso máximo.\n• Esta configuração afeta apenas as pontuações de classificação; a construção real permanece sujeita a outras faltas, lucros, mão de obra e condições do jogo base.\n• Verifica apenas se uma O.C.R. correspondente existe, não seu nível ou produção.\n• Escassez de insumos, baixo acesso ao mercado ou baixo controle reduzem o bônus. Os próprios OCRs não recebem esse bônus. As estimativas usam métodos de produção elegíveis; os métodos de produção não são alterados automaticamente."
 eu5ab_price_section_title: "Faixa de preços"
 eu5ab_price_short_desc: "Filtra e classifica edifícios de produção pelo preço de mercado."
 eu5ab_price_min_label: "Preço mínimo"
 eu5ab_price_max_label: "Referência de preço alto"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Os preços usam o preço-base como 100%. Preços baixos reduzem a prioridade; pausa a construção se todas as produções estiverem no mínimo ou abaixo dele. Pondera múltiplas produções por quantidade e preço-base. Bônus de preço alto param de crescer na referência; preços altos não bloqueiam a construção. Edifícios sem bens produzidos são isentos. Salvaguardas de alimentos aplicam-se conforme configurado."
 eu5ab_active_cash_value: "Reserva do tesouro: [GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Preço mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Referência de preço alto: [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Preço mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Referência de preço alto: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Regras de construção automatizada"
 eu5ab_prediction_diagnostics_title: "Estimativa de força de trabalho e estado da construção"
 eu5ab_prediction_section_body: "Organiza melhorias, expansões comuns, expansões de O.C.R. e novos edifícios na sua Ordem de Construção Automática escolhida, tentando primeiro os projetos elegíveis do tipo atual.\nQuando as salvaguardas alimentares ativadas se aplicam, projetos de alimentos relevantes vêm primeiro e limites de retorno, preço ou outros são relaxados conforme configurado. Salvaguardas ativadas para materiais de construção, suprimentos de guerra ou insumos estratégicos também podem relaxar os requisitos de retorno.\nOrçamento, reserva do tesouro e requisitos aplicáveis de insumos, força de trabalho, capacidade de edifícios e regras de construção do jogo ainda se aplicam. Apenas o nível desbloqueado mais recente de edifícios comuns é considerado; melhorias contam apenas postos de trabalho adicionados."
 eu5ab_diagnostics_title: "Estado da construção automatizada"
 eu5ab_diagnostics_snapshot_note: "As configurações são salvas imediatamente. Os relatórios são atualizados conforme as verificações avançam e os projetos iniciam, mantendo os resultados posteriormente."
 eu5ab_diagnostics_snapshot_help: "O relatório é atualizado conforme as verificações avançam e a construção começa, mantendo os resultados até a próxima rodada. Os projetos são organizados a partir do dia 23, de modo que contagens e gastos podem mudar gradualmente. Alguns resultados permanecem pendentes até o término das verificações."
