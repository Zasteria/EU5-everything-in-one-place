 eu5ab_cash_label: "Réserve du trésor"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_min_cash_reserve').GetValue|0] or"
 eu5ab_cash_help: "Avant la construction, les coûts estimés de ce chantier et des autres projets prévus doivent laisser suffisamment d'or pour la réserve du trésor.\nAvec 1 050 d'or et une réserve de 1 000, un projet estimé à 100 ne peut pas commencer. Les coûts réels des O.C.R. peuvent différer des estimations. Une part du budget annuel doit également subsister."
 eu5ab_budget_section_title: "Budget annuel de construction"
 eu5ab_budget_short_desc: "Choisissez un montant fixe ou une dotation annuelle basée sur les revenus mensuels totaux."
 eu5ab_budget_mode_fixed: "Budget fixe"
 eu5ab_budget_mode_income: "Lié au revenu"
 eu5ab_budget_multiplier_4: "×4 Prudent"
 eu5ab_budget_multiplier_6: "×6 Recommandé"
 eu5ab_budget_multiplier_8: "×8 Actif"
 eu5ab_budget_effective_label: "Budget de l'année en cours"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_budget_limit').GetValue|0] or"
 eu5ab_budget_label: "Budget annuel"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_fixed_annual_budget').GetValue|0] or/an"
 eu5ab_budget_cash_comparison: "Le budget annuel définit les dépenses prévues ; la réserve du trésor fixe la quantité d'or à conserver. Le dernier projet peut dépasser le budget restant, mais doit réussir la vérification de réserve."
 eu5ab_budget_reset_note: "Réinitialisé lors de la première vérification de la nouvelle année ; ne déduit les dépenses réelles qu'après le début de la construction. Modifier le budget n'efface pas les dépenses enregistrées."
 eu5ab_budget_help: "Les bâtiments ordinaires et les extensions d'O.C.R. partagent un budget annuel : un montant fixe ou 4, 6 ou 8 fois les revenus mensuels totaux. Il est réinitialisé lors de la première vérification d'une nouvelle année ; le modifier au cours de l'année conserve les dépenses déjà enregistrées.\nSeuls les démarrages réussis sont pris en compte, à leur coût réel. Le dernier projet peut dépasser le budget restant ; aucun autre projet n'est ajouté par la suite. Les exigences de réserve du trésor s'appliquent toujours."
 eu5ab_quota_section_title: "Limite de constructions simultanées de ce Mod"
 eu5ab_quota_short_desc: "Définit le nombre de projets civils que ce Mod peut mener de front en plus du créneau de base."
 eu5ab_hard_cap_label: "Projets simultanés supplémentaires"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] projets (la limite totale est cette valeur + 1)"
 eu5ab_quota_help: "Définit les places supplémentaires au-delà du premier projet : 0 autorise 1 chantier simultané ; 599 en autorise 600. Les bâtiments ordinaires et les O.C.R. les partagent. Seuls les projets non terminés de ce Mod comptent ; la construction manuelle, les routes et les autres mods ne comptent pas. Chaque passage ne comble que les places libres. Un lieu peut recevoir plusieurs projets si l'espace le permet, puis attend 3 mois après le passage avant que de nouveaux chantiers n'y soient organisés."
