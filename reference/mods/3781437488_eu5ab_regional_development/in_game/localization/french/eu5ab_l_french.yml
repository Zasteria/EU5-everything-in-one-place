 eu5ab_operating_rules_title: "Règles de construction"
 eu5ab_operating_rules_short_desc: "Configurez les bâtiments spéciaux, les constructions en amont et les pénuries d'intrants."
 eu5ab_operating_rules_help: "Les bâtiments spéciaux doivent remplir les conditions de déblocage et de construction du jeu.\nLes pénuries d'intrants peuvent inciter à construire des fournisseurs autorisés par le modèle, même lorsque les ateliers existants ont tout leur personnel.\nLorsque la protection des intrants est activée, l'offre des intrants industriels clés requis doit couvrir 75 % de la demande. Utilise les méthodes de production actuelles si possible, sinon estime une méthode disponible. Les méthodes alternatives sont évaluées séparément ; les méthodes de production ne sont pas modifiées automatiquement."
 eu5ab_rgo_section_title: "O.C.R."
 eu5ab_rgo_allow: "Autoriser ce modèle à développer les O.C.R."
 eu5ab_toggle_special_buildings: "Autoriser les bâtiments spéciaux"
 eu5ab_toggle_auto_build_input_sources: "Construire les sources en cas de manque d'intrants"
 eu5ab_toggle_pause_low_workforce: "Suspendre l'expansion en cas de manque de main-d'œuvre"
 eu5ab_ranking_mode_section_title: "Stratégie de décision de construction"
 eu5ab_town_rights_preference_desc: "Les droits urbains et Promouvoir l'industrie ajoutent chacun jusqu'à 500 points de planification indépendamment. Le soutien industriel ne s'applique qu'aux productions directes de bâtiments correspondants dans votre contrée soutenue, pondérées par la production de la recette choisie aux prix de base ; il ne se propage pas le long des chaînes d'approvisionnement. Les deux se cumulent avec les points d'intrants locaux. Le mode profit n'utilise ces points que pour la présélection. L'extension d'O.C.R. ne conserve que le bonus des droits urbains. Toutes les conditions de construction restent applicables."
 eu5ab_ranking_mode_current_label: "Mode actuel"
 eu5ab_ranking_mode_composite_value: "#G Planification de l'offre et de la demande#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Sélection par bénéfice prévu#!"
 eu5ab_ranking_mode_common_desc: "Les deux stratégies ne considèrent que les bâtiments déverrouillés et constructibles avec une priorité supérieure à 0. Elles exigent aussi rendement, budget, réserve, intrants, main-d'œuvre et autres règles de sécurité. Les urgences alimentaires et l'ordre automatique passent avant tout."
 eu5ab_ranking_mode_composite_desc: "Équilibre pénuries du marché, besoins stratégiques, efficacité de production, matières premières locales, cours et risque de main-d'œuvre, privilégiant chaînes complètes et stabilité durable."
 eu5ab_ranking_mode_actual_profit_desc: "Filtre les projets candidats selon les règles du modèle et de sécurité, puis priorise la construction selon le bénéfice net mensuel prévu, en tenant compte des gains de ressources des moulins et de la nourriture préservée par les greniers. En cas de bénéfices proches, les priorités définies dans le modèle servent de référence secondaire."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Conserve les 3 à 30 alternatives configurées par lieu et type de construction ordinaire. Les sécurités alimentaires et l'Ordre de construction automatique ont la priorité ; les critères de rendement et de construction restent obligatoires. Les O.C.R. sont évaluées séparément selon les pénuries, les prix, l'emploi et les besoins stratégiques."
 eu5ab_ranking_mode_help: "Stratégie de décision\nChangez de stratégie dans Community Mod Framework → Paramètres des mods → Construction automatique avancée → Sécurité & classement → Stratégie de décision de construction.\n• Planification offre-demande : Privilégie l'offre et la demande du marché, les chaînes de production complètes et la stabilité économique à long terme.\n• Sélection par profit prévu : Utilise le bénéfice net mensuel prévu, y compris les gains des moulins et la réduction des pertes par les greniers, avec les priorités du modèle comme critère d'arbitrage."
 eu5ab_workforce_section_title: "Main-d'œuvre"
 eu5ab_pause_workforce_short_desc: "Détermine si le manque de main-d'œuvre bloque l'expansion."
 eu5ab_job_fill_deadline_label: "Horizon de prévision de la main-d'œuvre"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] mois"
 eu5ab_job_fill_deadline_value: "Horizon de prévision de la main-d'œuvre : [GetPlayer.MakeScope.GetVariable('eu5ab_global_job_fill_deadline_months').GetValue|0] mois"
 eu5ab_job_fill_deadline_desc: "Définit l'horizon maximal de prévision de la main-d'œuvre en mois (0–240). Zéro ne compte que les travailleurs actuellement disponibles, sans promotions futures. « Suspendre si la main-d'œuvre manque » détermine si le manque de main-d'œuvre bloque la mise en chantier : si cette option est activée, une prévision insuffisante empêche le démarrage ; sinon, le manque de travailleurs réduit seulement la priorité."
 eu5ab_deadline_0: "0 mois"
 eu5ab_deadline_3: "3 mois"
 eu5ab_deadline_6: "6 mois"
 eu5ab_deadline_12: "12 mois"
 eu5ab_toggle_stop_input_shortage: "Arrêter l'expansion en cas de pénurie critique d'intrants"
 eu5ab_prediction_status_label: "Estimation de la main-d'œuvre"
 eu5ab_status_promotion_forecast: "#G Prévision des promotions sur l'horizon choisi#!"
 eu5ab_status_conservative_fallback: "#L Estimation prudente sur la main-d'œuvre actuelle#!"
 eu5ab_prediction_promotion_short_desc: "Combine les ouvriers actuels et les promotions attendues vers la classe requise dans l'horizon imparti (jusqu'à 240 mois)."
 eu5ab_prediction_unavailable_short_desc: "Faute de prévision fiable, se base strictement sur les ouvriers inactifs actuels."
 eu5ab_native_input_section_title: "Préférence pour les intrants locaux"
 eu5ab_native_input_short_desc: "Améliore le classement des bâtiments utilisant des matières premières de la même province."
 eu5ab_native_input_priority_label: "Priorité des intrants locaux"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Priorité des intrants locaux : [GetPlayer.MakeScope.GetVariable('eu5ab_global_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Préférence pour les matières premières locales\nLocal désigne la province contenant le bâtiment. Le système vérifie les matières premières requises par la recette du bâtiment et accorde un bonus de classement lorsque des O.C.R. correspondantes existent dans la province ; une part plus importante d'intrants rapporte un bonus accru.\n• 0 ignore les matières premières locales, 5 est la valeur recommandée par défaut et 10 accorde le poids maximal.\n• Ce paramètre affecte uniquement les scores de classement ; la construction reste soumise aux autres pénuries, aux profits, à la main-d'œuvre et aux conditions du jeu de base.\n• Vérifie uniquement l'existence d'une O.C.R. correspondante, non son niveau ou sa production.\n• Les pénuries d'intrants, un faible accès au marché ou un faible contrôle réduisent le bonus. Les O.C.R. elles-mêmes ne reçoivent pas ce bonus. Les estimations utilisent les méthodes de production disponibles ; elles ne sont pas modifiées automatiquement."
 eu5ab_price_section_title: "Plage de prix"
 eu5ab_price_short_desc: "Filtre et classe les bâtiments de production selon le prix du marché."
 eu5ab_price_min_label: "Prix minimal"
 eu5ab_price_max_label: "Référence de prix élevé"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Les cours utilisent le prix de base comme 100 %. Les prix bas réduisent la priorité ; suspend la construction si toutes les productions sont inférieures ou égales au seuil minimal. Pondère les productions multiples par quantité et prix de base. Les bonus de prix élevé cessent de croître au niveau de référence ; les prix élevés ne bloquent pas la construction. Les bâtiments sans biens marchands sont exemptés. Les sécurités alimentaires s'appliquent selon la configuration."
