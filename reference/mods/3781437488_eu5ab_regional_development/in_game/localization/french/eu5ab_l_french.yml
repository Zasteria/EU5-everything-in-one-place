 eu5ab_regional_development__governors_name: "Recommandations de gouverneurs"
 eu5ab_regional_development__governors__recommendations_name: "Recommandations et actualisation"
 eu5ab_regional_development__governors__recommendations_desc: "Analyse les candidats aux postes de Gouverneur local et Gouverneur naval sans construire, démolir ni déplacer de bâtiments."
 eu5ab_regional_development__governors__scoring_name: "Préférences d'évaluation"
 eu5ab_regional_development__governors__scoring_desc: "Choisissez la pondération de la valeur du lieu et si une valeur stratégique limitée est incluse."
 eu5ab_regional_development__governor_recommendations_enabled_name: "Activer les recommandations de gouverneurs"
 eu5ab_regional_development__governor_recommendations_enabled_desc: "Suggère périodiquement des sites de gouverneur local et naval. Désactiver conserve les derniers résultats mais retire les alertes de recommandation."
 eu5ab_regional_development__governor_refresh_interval_name: "Intervalle d'actualisation"
 eu5ab_regional_development__governor_refresh_interval_desc: "Définit l'intervalle d'actualisation. Certains changements de territoire, de capitale, de rang de lieu et de gouvernement déclenchent des mises à jour anticipées. Les routes et autres changements de proximité sont inclus dans les vérifications planifiées."
 eu5ab_regional_development__governor_refresh_interval_option_1_name: "Chaque mois"
 eu5ab_regional_development__governor_refresh_interval_option_1_desc: "S'actualise le plus rapidement et convient aux petits pays. Des vérifications fréquentes peuvent causer des pauses plus longues dans les grands pays."
 eu5ab_regional_development__governor_refresh_interval_option_2_name: "Tous les 3 mois"
 eu5ab_regional_development__governor_refresh_interval_option_2_desc: "Équilibre entre réactivité aux changements de routes et performances des grands pays."
 eu5ab_regional_development__governor_refresh_interval_option_3_name: "Tous les 6 mois"
 eu5ab_regional_development__governor_refresh_interval_option_3_desc: "Fréquence de recalcul réduite pour les grands pays."
 eu5ab_regional_development__governor_refresh_interval_option_4_name: "Tous les 12 mois"
 eu5ab_regional_development__governor_refresh_interval_option_4_desc: "Coût minimal, mais les changements de routes et de proximité peuvent mettre jusqu'à un an à apparaître."
 eu5ab_regional_development__governor_refresh_now_name: "Recalculer maintenant"
 eu5ab_regional_development__governor_refresh_now_text: "Recalculer maintenant"
 eu5ab_regional_development__governor_refresh_now_desc: "Recalcule immédiatement les recommandations de sièges locaux et navals, y compris en pause. Les grands pays peuvent subir un bref ralentissement."
 eu5ab_regional_development__governor_scoring_profile_name: "Profil de valeur du lieu"
 eu5ab_regional_development__governor_scoring_profile_desc: "Pondère l'assiette fiscale potentielle, la population et le développement. Les scores sont estimés à partir de la valeur des lieux multipliée par les améliorations attendues de proximité, plutôt qu'une valeur finale de contrôle ; le contrôle actuel n'est ni ajouté ni déduit."
 eu5ab_regional_development__governor_scoring_profile_option_1_name: "Mixte"
 eu5ab_regional_development__governor_scoring_profile_option_1_desc: "Équilibre valeur économique et valeur administrative-démographique."
 eu5ab_regional_development__governor_scoring_profile_option_2_name: "Économique"
 eu5ab_regional_development__governor_scoring_profile_option_2_desc: "Met l'accent sur l'assiette fiscale potentielle et l'échelle économique établie."
 eu5ab_regional_development__governor_scoring_profile_option_3_name: "Population administrative"
 eu5ab_regional_development__governor_scoring_profile_option_3_desc: "Met l'accent sur la population et le développement."
 eu5ab_regional_development__governor_strategic_value_name: "Inclure la valeur stratégique"
 eu5ab_regional_development__governor_strategic_value_desc: "Applique une pondération limitée aux ports, lieux frontaliers et lieux fortifiés. Cela modifie uniquement la valeur du lieu et ne constitue pas une composante de score distincte."
 eu5ab_governor_window_title: "Détails des recommandations de gouverneurs"
 eu5ab_governor_window_intro: "Consultez les suggestions de nouveaux sites et de relocalisation. Les modifications de bâtiments restent à votre discrétion."
 eu5ab_governor_road_tier_help: "Les estimations utilisent le niveau de route débloqué le plus élevé ; les gains réels peuvent varier.\nChaque plan fige l'autre type de siège. Recalculez après modification ; les gains ne peuvent pas s'additionner."
 eu5ab_governor_refresh_button: "Recalculer"
 eu5ab_governor_refresh_button_tt: "Réévalue les nouveaux sites, relocalisations et agencements pour les sièges de gouverneur local et naval. Les grands pays peuvent subir une courte pause ; les vérifications incomplètes affichent un avertissement."
 eu5ab_governor_local_section: "Gouverneur local"
 eu5ab_governor_local_diagnostics: "Dernier calcul de siège local : étape [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_stage_ui')|0], statut [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_status_ui')|0] ; capacité [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_capacity_ui')|0], décompte moteur [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_occupied_ui')|0] sièges locaux et [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_lieutenancies_ui')|0] lieutenances ; autres emplacements occupés [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_other_slots_ui')|0].\nDécompte par lieu : [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_occupied_ui')|0] sièges locaux et [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_lieutenancies_ui')|0] lieutenances ; autres emplacements occupés [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_other_slots_ui')|0] ; emplacement libre (moteur/lieu) [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_available_ui')|0]/[GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_fresh_slot_available_ui')|0] ; divergence [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_slot_cache_mismatch_ui')|0] (1 signifie différent).\nSeuil de gain pour nouveau site [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_threshold_ui')|1] ; sites candidats [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_candidates_ui')|0], sites évalués [GetPlayer.MakeScope.ScriptValue('eu5ab_gov_sync_shortlisted_ui')|0]."
 eu5ab_governor_naval_section: "Gouverneur naval"
 eu5ab_governor_naval_diagnostics: "Dernier calcul de siège naval : statut [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_status_ui')|0] ; actualisations [GetPlayer.MakeScope.ScriptValue('eu5ab_naval_gov_sync_runs_ui')|0]."
 eu5ab_governor_new_slot_state: "Un emplacement est disponible. Vous pouvez construire un siège sur l'un de ces sites."
 eu5ab_governor_empty_title: "Aucun candidat approprié"
 eu5ab_governor_no_recommendation: "#weak Recalculez après le développement de votre territoire ou de vos villes.#!"
 eu5ab_governor_candidate_1: "Rang 1"
 eu5ab_governor_candidate_2: "Rang 2"
 eu5ab_governor_candidate_3: "Rang 3"
 eu5ab_governor_view_location: "Voir le lieu"
 eu5ab_governor_view_location_tt: "Déplace la caméra vers ce candidat."
 eu5ab_governor_local_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1').GetLocation.GetName]"
 eu5ab_governor_local_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2').GetLocation.GetName]"
 eu5ab_governor_local_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_1_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_2_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_2').GetLocation.GetName]"
 eu5ab_governor_naval_candidate_3_name: "[GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_3').GetLocation.GetName]"
 eu5ab_governor_local_candidate_1_breakdown: "Score global [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_score').GetValue|1] = Gain d'amélioration de la proximité du site [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_site_gain').GetValue|1] + Gain d'amélioration de la proximité environnante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_surrounding_gain').GetValue|1].\nLa proximité devrait s'améliorer dans [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_1_coverage').GetValue|0] lieux (y compris le site).\nLes scores sont estimés en multipliant la valeur des lieux par l'augmentation attendue de la proximité, et non une valeur finale de contrôle ; le contrôle actuel n'est ni ajouté ni déduit, et le contrôle réel continue d'évoluer via le contrôle maximal et les mécaniques de jeu normales."
 eu5ab_governor_local_candidate_2_breakdown: "Score global [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_score').GetValue|1] = Gain d'amélioration de la proximité du site [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_site_gain').GetValue|1] + Gain d'amélioration de la proximité environnante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_surrounding_gain').GetValue|1].\nLa proximité devrait s'améliorer dans [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_2_coverage').GetValue|0] lieux (y compris le site).\nLes scores sont estimés en multipliant la valeur des lieux par l'augmentation attendue de la proximité, et non une valeur finale de contrôle ; le contrôle actuel n'est ni ajouté ni déduit, et le contrôle réel continue d'évoluer via le contrôle maximal et les mécaniques de jeu normales."
 eu5ab_governor_local_candidate_3_breakdown: "Score global [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_score').GetValue|1] = Gain d'amélioration de la proximité du site [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_site_gain').GetValue|1] + Gain d'amélioration de la proximité environnante [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_surrounding_gain').GetValue|1].\nLa proximité devrait s'améliorer dans [GetPlayer.MakeScope.GetVariable('eu5ab_local_top_3_coverage').GetValue|0] lieux (y compris le site).\nLes scores sont estimés en multipliant la valeur des lieux par l'augmentation attendue de la proximité, et non une valeur finale de contrôle ; le contrôle actuel n'est ni ajouté ni déduit, et le contrôle réel continue d'évoluer via le contrôle maximal et les mécaniques de jeu normales."
 eu5ab_governor_naval_candidate_1_breakdown: "Score global [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_score').GetValue|1] = Gain d'amélioration de la proximité du site [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_site_gain').GetValue|1] + Gain d'amélioration de la proximité environnante [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_surrounding_gain').GetValue|1].\nLa proximité devrait s'améliorer dans [GetPlayer.MakeScope.GetVariable('eu5ab_naval_top_1_coverage').GetValue|0] lieux (y compris le site).\nLes scores sont estimés en multipliant la valeur des lieux par la hausse de proximité attendue, sans constituer une valeur finale de contrôle ; le contrôle actuel n'est ni ajouté ni déduit, et le contrôle réel évolue selon le contrôle maximal et les mécaniques normales du jeu."
