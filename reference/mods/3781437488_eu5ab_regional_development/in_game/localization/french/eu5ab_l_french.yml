 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Définissez le budget, les conditions de construction, la stratégie de décision et les performances communs à tous les modèles. Chaque modèle conserve son activation, sa couverture et ses priorités."
 eu5ab_regional_development__general_name: "Commandes et limites"
 eu5ab_regional_development__finance_name: "Finances et marché"
 eu5ab_regional_development__automation_name: "Sécurité et classement"
 eu5ab_regional_development__performance_name: "Optimisation des performances"
 eu5ab_regional_development__performance__preset_name: "Préréglage de performances"
 eu5ab_regional_development__performance__preset_desc: "Les préréglages ajustent les options ci-dessous. Modifier une option avancée passe en mode Personnalisé ; les nouvelles valeurs s'appliquent à la prochaine vérification mensuelle."
 eu5ab_regional_development__performance__advanced_name: "Paramètres avancés"
 eu5ab_regional_development__performance__advanced_desc: "Ajuste les vérifications quotidiennes de lieux, les nouveaux chantiers par passage et le nombre d'alternatives. Examiner davantage de projets peut prendre plus de temps."
 eu5ab_regional_development__general__limits_name: "Commandes et limite simultanée"
 eu5ab_regional_development__general__limits_desc: "Contrôle si le Mod s'exécute et le nombre de projets civils qu'il peut gérer simultanément."
 eu5ab_regional_development__general__returns_name: "Règles de rendement et dérogations d'urgence"
 eu5ab_regional_development__general__returns_desc: "Définissez le rendement minimal des bâtiments ordinaires et si les pénuries alimentaires, matérielles, militaires ou stratégiques peuvent le lever."
 eu5ab_regional_development__finance__budget_name: "Budget annuel commun"
 eu5ab_regional_development__finance__budget_desc: "Tous les modèles, bâtiments et O.C.R. partagent un seul budget annuel national."
 eu5ab_regional_development__finance__market_name: "Plage de prix du marché"
 eu5ab_regional_development__finance__market_desc: "Définissez des pourcentages communs de prix minimal et de référence élevée par rapport au prix de base."
 eu5ab_regional_development__automation__safety_name: "Règles de sécurité de construction"
 eu5ab_regional_development__automation__safety_desc: "Règles communes pour les bâtiments spéciaux, les sources en amont, la main-d'œuvre et les pénuries d'intrants."
 eu5ab_regional_development__automation__rgo_name: "Extension O.C.R."
 eu5ab_regional_development__automation__workforce_name: "Prévision de la main-d'œuvre"
 eu5ab_regional_development__automation__workforce_desc: "Configure l'horizon maximal de prévision de la main-d'œuvre disponible."
 eu5ab_regional_development__automation__ranking_name: "Stratégie de décision de construction"
 eu5ab_regional_development__automation__ranking_desc: "Choisissez la stratégie des bâtiments ordinaires, ordonnez améliorations, extensions, O.C.R. et nouvelles constructions, et réglez l'influence des intrants locaux."
 eu5ab_regional_development__candidate_ranking_mode_name: "Stratégie des bâtiments ordinaires"
 eu5ab_regional_development__candidate_backfill_enabled_name: "Tenter d'autres projets"
 eu5ab_regional_development__candidate_backfill_enabled_desc: "Si les projets principaux du type actuel ne peuvent démarrer, tente des alternatives moins bien classées. Chaque lieu bénéficie de jusqu'à 2 tentatives supplémentaires par passage en Planification offre-demande ou 5 en Sélection par profit prévu, partagées entre les types ordinaires. S'arrête dès qu'un bâtiment ordinaire y démarre. Charger une sauvegarde ne restaure pas les tentatives. Toutes les conditions s'appliquent toujours. Désactivé par défaut ; prend effet au prochain passage et peut allonger le temps de calcul."
 eu5ab_regional_development__candidate_ranking_mode_desc: "Choisissez comment prioriser les bâtiments ordinaires éligibles. Les sécurités alimentaires et l'Ordre de construction automatique ont la priorité. Les O.C.R. sont évaluées séparément selon les pénuries, les prix, l'emploi et les besoins stratégiques."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Offre et demande"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Classe les projets selon les pénuries du marché, les besoins stratégiques, l'efficacité des recettes, les intrants locaux, les prix et le risque de main-d'œuvre, en favorisant les chaînes complètes et la stabilité à long terme."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Bénéfice prévu"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtre les candidats selon le modèle et les règles de sécurité, puis donne la priorité de construction au bénéfice net mensuel prévu, en tenant compte des gains des moulins et des pertes évitées par les greniers. En cas de bénéfices proches, les priorités du modèle servent d'arbitrage secondaire."
 eu5ab_regional_development__automation__candidate_priority_name: "Ordre de construction automatisée"
 eu5ab_regional_development__automation__candidate_priority_desc: "Glissez les quatre types dans l'ordre souhaité. Le Mod tente chaque projet possible dans le type actuel avant de passer au suivant ; si un projet ne peut débuter, il en cherche un autre du même type. En cas de crise alimentaire, les projets vivriers sont traités en premier tout en respectant cet ordre."
 eu5ab_regional_development__candidate_priority_name: "Ordre de construction automatisée"
 eu5ab_regional_development__candidate_priority_desc: "Faites glisser pour ordonner améliorations, extensions ordinaires, extensions O.C.R. et nouveaux bâtiments."
 eu5ab_regional_development__candidate_priority_item_column_name: "Type de construction"
 eu5ab_regional_development__candidate_priority_i1_name: "Améliorer les bâtiments"
 eu5ab_regional_development__candidate_priority_i1_desc: "Remplacez un bâtiment obsolète par le niveau débloqué le plus récent de sa chaîne."
 eu5ab_regional_development__candidate_priority_i2_name: "Étendre les bâtiments existants"
 eu5ab_regional_development__candidate_priority_i2_desc: "Ajoutez un niveau à un bâtiment ordinaire existant, hors remplacements et O.C.R."
 eu5ab_regional_development__candidate_priority_i3_name: "Étendre les O.C.R."
 eu5ab_regional_development__candidate_priority_i3_desc: "Agrandit les O.C.R. locales, exigeant le plein emploi actuel et respectant les règles de prix, de budget annuel et de réserve du trésor."
 eu5ab_regional_development__candidate_priority_i4_name: "Construire de nouveaux bâtiments"
 eu5ab_regional_development__candidate_priority_i4_desc: "Construisez de zéro un bâtiment ordinaire qui n'existe pas encore dans le lieu."
 eu5ab_regional_development__enabled_name: "Activer la construction automatisée"
 eu5ab_regional_development__enabled_desc: "Active ou désactive les vérifications mensuelles de construction automatisée. Les modèles et affectations de lieux sont conservés lorsque désactivé."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Projets simultanés supplémentaires"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Nombre de projets civils que ce Mod peut mener de front en plus du créneau de base. 0 signifie 1 projet au total et 599 signifie 600 ; les constructions manuelles, routes et autres Mods ne comptent pas dans cette limite."
 eu5ab_regional_development__budget_mode_name: "Mode de budget annuel"
 eu5ab_regional_development__budget_mode_desc: "Choisissez un montant fixe ou 4, 6 ou 8 fois les revenus mensuels totaux. Recalcule lors de la première vérification d'une nouvelle année ; modifier les paramètres conserve les dépenses déjà enregistrées."
 eu5ab_regional_development__budget_mode_option_1_name: "Budget annuel fixe"
 eu5ab_regional_development__budget_mode_option_2_name: "Revenu mensuel ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Revenu mensuel ×6 (recommandé)"
 eu5ab_regional_development__budget_mode_option_4_name: "Revenu mensuel ×8"
 eu5ab_regional_development__economic_metric_name: "Seuil économique des bâtiments ordinaires"
 eu5ab_regional_development__economic_metric_desc: "Les bâtiments de production ordinaires doivent remplir la condition choisie : revenu ou profit mensuel prévu positif, ou rendement annualisé de 5 %. Les rendements réels peuvent varier. Les infrastructures publiques ordinaires sont exemptées. Les moulins nécessitent des gains nets positifs de la production supplémentaire et un rendement annuel de 5 % dans les modes de taux de rendement. Les greniers construits pour éviter le pourrissement requièrent toujours 5 %. Les O.C.R. suivent des règles distinctes."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Revenu mensuel > 0"
 eu5ab_regional_development__economic_metric_option_1_desc: "Lancez uniquement si le jeu prévoit un revenu mensuel positif."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Profit mensuel > 0"
 eu5ab_regional_development__economic_metric_option_2_desc: "Lancez uniquement si le jeu prévoit un bénéfice mensuel total positif."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Rendement annualisé du revenu ≥ 5 %"
 eu5ab_regional_development__economic_metric_option_3_desc: "Le revenu mensuel prévu doit être d'au moins 5 % du coût de construction divisé par 12. Cela compare le revenu avant les coûts d'exploitation."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Rendement annualisé du profit ≥ 5 %"
 eu5ab_regional_development__economic_metric_option_4_desc: "Le profit mensuel prévu doit être d'au moins 5 % du coût de construction divisé par 12. Le profit réel peut changer avec les conditions d'exploitation."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Épuisement alimentaire prévu : construire d'abord, ignorer le rendement"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Quand les réserves alimentaires du marché risquent de s'épuiser, traitez d'abord les projets alimentaires et dispensez les bâtiments alimentaires ordinaires du seuil de rentabilité. Les projets alimentaires suivent toujours l'Ordre de construction automatique, et toutes les règles de budget, trésor, main-d'œuvre, intrants, matériaux et construction du jeu restent en vigueur."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Aliments à 25 % ou moins : construire d'abord, ignorer le rendement"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Quand les réserves de nourriture du marché sont à 25 % ou moins, priorise les projets vivriers et dispense les bâtiments alimentaires ordinaires du seuil de rentabilité. Les projets alimentaires respectent toujours l'Ordre de construction automatique."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Offre de construction sous 65 % : ignorer le rendement"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Quand un matériau de construction essentiel a moins de 65 % de l'offre requise, ses producteurs sont dispensés du seuil de rentabilité. Toutes les autres règles de construction restent en vigueur."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Offre militaire en guerre sous 65 % : ignorer le rendement"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "En temps de guerre, si un bien militaire a moins de 65 % de l'offre requise, les bâtiments qui le produisent sont dispensés du seuil de rentabilité. Toutes les autres règles de construction restent en vigueur."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Production stratégique sans intrants : ignorer le rendement en amont"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Lorsque l'offre d'une matière première sur le marché est inférieure à 65 % de la demande et que ce même marché contient un bâtiment national ouvert produisant des aliments, des matériaux de construction essentiels ou des biens militaires, qui consomme cette matière première et manque d'intrants, les producteurs de cette matière première sont dispensés du seuil de rentabilité sélectionné. Le bâtiment consommateur n'a pas besoin d'avoir arrêté sa production, et l'intrant manquant n'est pas nécessairement cette matière première. Toutes les autres règles de construction restent applicables."
 eu5ab_regional_development__fixed_annual_budget_name: "Budget annuel fixe"
 eu5ab_regional_development__fixed_annual_budget_desc: "Utilisé uniquement en mode fixe ; tous les modèles partagent ce montant."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Réserve minimale du trésor"
 eu5ab_regional_development__min_cash_reserve_desc: "Conserve cette réserve après déduction des coûts estimés de tous les projets prévus. Les coûts réels des O.C.R. peuvent être différents."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Pourcentage de prix minimal"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Pourcentage de référence de prix élevé"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Autoriser les bâtiments spéciaux"
 eu5ab_regional_development__allow_special_buildings_desc: "Autorisez les bâtiments spéciaux ; les conditions de construction du jeu restent valables."
 eu5ab_regional_development__fill_market_shortages_when_idle_name: "Combler les pénuries du marché avec les créneaux de construction libres"
 eu5ab_regional_development__fill_market_shortages_when_idle_desc: "Après les projets habituels, utilise les créneaux de construction libres pour combler les pénuries dans les lieux possédés examinés ce passage sur le même marché. Tient compte des besoins en intrants des projets prévus et des gains de production non encore réalisés. Les préréglages intégrés peuvent ajouter des industries non planifiées ; les interdictions, la priorité personnalisée 0 et les autres critères de construction restent applicables."
 eu5ab_regional_development__auto_build_input_sources_name: "Construire les sources en amont en cas de pénurie"
 eu5ab_regional_development__auto_build_input_sources_desc: "Vérifie indépendamment les pénuries du marché des intrants et construit les sources en amont autorisées, y compris lorsque les ateliers en aval ont tout leur personnel mais manquent d'intrants."
 eu5ab_regional_development__pause_low_workforce_name: "Suspendre si la main-d'œuvre manque"
 eu5ab_regional_development__stop_input_shortage_name: "Arrêter en cas de pénurie d'intrants critiques"
 eu5ab_regional_development__stop_input_shortage_desc: "Les intrants industriels clés requis doivent avoir une offre sur le marché couvrant au moins 75 % de la demande avant que la construction associée ne puisse être organisée."
 eu5ab_regional_development__allow_rgo_name: "Autoriser l'extension O.C.R."
 eu5ab_regional_development__allow_rgo_desc: "Autorisez tous les modèles à envisager l'extension des O.C.R."
 eu5ab_regional_development__native_input_priority_name: "Priorité des intrants locaux"
 eu5ab_regional_development__native_input_priority_desc: "0 à 10 ; des valeurs élevées augmentent la priorité des bâtiments pouvant consommer des matières premières produites dans la même province."
 eu5ab_regional_development__performance_preset_name: "Préréglage de performances"
 eu5ab_regional_development__performance_preset_desc: "Un préréglage synchronise les options avancées ci-dessous. Personnalisé conserve leurs valeurs actuelles."
 eu5ab_regional_development__performance_preset_option_1_name: "Prudent"
 eu5ab_regional_development__performance_preset_option_1_desc: "Vérifie jusqu'à 10 lieux par jour et lance au plus 30 projets par passage. Candidats de planification : 5 ; de bénéfice : 15. S'arrête dès qu'il y en a assez."
 eu5ab_regional_development__performance_preset_option_2_name: "Équilibrée"
 eu5ab_regional_development__performance_preset_option_2_desc: "Vérifie jusqu'à 20 lieux par jour et lance au plus 50 projets par passage. Candidats de planification : 4 ; de bénéfice : 12. S'arrête dès qu'il y en a assez."
 eu5ab_regional_development__performance_preset_option_3_name: "Débit maximal"
 eu5ab_regional_development__performance_preset_option_3_desc: "Pour les pays avec beaucoup de lieux. Vérifie jusqu'à 30 lieux par jour sans limite par passage. Candidats de planification : 3 ; de bénéfice : 10. S'arrête dès qu'il y en a assez."
 eu5ab_regional_development__performance_preset_option_4_name: "Personnalisé"
 eu5ab_regional_development__performance_preset_option_4_desc: "Utilisez les paramètres avancés actuels."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "De nombreux lieux avec modèles peuvent réduire les performances."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "En mode Rendement maximal, jusqu'à 30 lieux sont vérifiés chaque jour sans limite par passage. Les très grands pays peuvent subir un allongement du passage de mois."
 eu5ab_regional_development__performance_throughput_warning_action_name: "\"Offre et demande\" trop lent : réduisez \"Candidats de planification\"."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Affiché uniquement en Offre et demande. Moins de Candidats de planification réduit les projets par lieu et type envoyés aux vérifications suivantes."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Conséquence : moins de candidats alternatifs peuvent faire manquer des projets viables ultérieurs."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Les projets sont vérifiés par score décroissant. Réduire la limite de candidats laisse moins d'options de repli si les premiers projets échouent, risquant de sauter des projets viables ultérieurs."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "« Bénéfice prévu » est trop lent : réduisez « Candidats de bénéfice par lieu »."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Affiché uniquement avec « Bénéfice prévu ». Réduisez « Candidats de bénéfice par lieu » pour diminuer le nombre d'alternatives vérifiées ensuite."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Moins d'alternatives peut ne laisser aucun autre choix si les projets principaux ne peuvent démarrer."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Les alternatives sont conservées après classement par profit prévu et préférences de bâtiment. En conserver moins laisse moins de choix lorsque les projets principaux ne peuvent démarrer."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Réduisez aussi les lieux quotidiens ou les ajouts par passage."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Moins de lieux par jour étale les vérifications sur davantage de jours. Moins d'ajouts par passage réduit les chantiers organisés en une fois. Définir les ajouts sur 0 supprime la limite par passage."
 eu5ab_regional_development__parallel_location_scan_name: "Traiter les lieux séparément"
 eu5ab_regional_development__parallel_location_scan_desc: "Examine les lieux séparément pour réduire les ralentissements, ou ensemble chaque jour si désactivé. Les priorités, le budget et l'ordre de construction restent identiques."
 eu5ab_regional_development__daily_location_task_limit_name: "Lieux vérifiés par jour"
 eu5ab_regional_development__daily_location_task_limit_desc: "Nombre maximal de lieux examinés en détail chaque jour. Des valeurs plus faibles allègent le travail quotidien mais nécessitent plus de jours pour couvrir le pays."
 eu5ab_regional_development__max_additions_per_run_name: "Ajouts maximum par passage"
 eu5ab_regional_development__max_additions_per_run_desc: "Limite le nombre maximal de projets lancés en un seul passage (0 à 600). Zéro signifie illimité."
 eu5ab_regional_development__candidates_per_location_name: "Candidats de planification par lieu"
 eu5ab_regional_development__candidates_per_location_desc: "Actif uniquement sous 'Planification offre-demande'. Définit, pour chaque lieu et catégorie de construction ordinaire, le nombre de candidats retenus par score de planification pour les vérifications ultérieures (3–30). En retenir davantage évite de manquer des alternatives viables, mais augmente la charge de calcul."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Candidats de bénéfice par lieu"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Pour la Sélection par profit prévu uniquement. Conserve 3 à 30 alternatives par lieu et type de construction ordinaire, classées par profit prévu et préférences de bâtiment. Plus d'alternatives offrent plus de choix lorsque les projets principaux ne peuvent démarrer, mais peuvent ralentir les vérifications ultérieures."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Arrêter quand assez de candidats sont trouvés"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Arrête les vérifications détaillées d'autres lieux dès que les alternatives atteignent deux fois le nombre de projets pouvant être ajoutés ce passage. Les créneaux libres et les Ajouts maximum par passage déterminent ce nombre ; 0 supprime uniquement le plafond par passage. Les critères de construction s'appliquent toujours."
 eu5ab_diagnostics_cmm_hint: "Modifiez les règles communes dans les Paramètres de mod de Community Mod Framework. Le rapport de construction affiche le dernier résultat automatisé."
 EU5AB_CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_increase_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max')))]"
 EU5AB_CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_shift_decrease_120', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__governor_migration_threshold_percent'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__naval_governor_migration_threshold_percent'))), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min')))]"
 eu5ab_cmm_shift_increase_10: "Augmenter de 10"
 eu5ab_cmm_shift_decrease_10: "Diminuer de 10"
 eu5ab_cmm_shift_increase_1000: "Augmenter de 1000"
 eu5ab_cmm_shift_decrease_1000: "Diminuer de 1000"
 eu5ab_cmm_shift_increase_max: "Définir au maximum"
 eu5ab_cmm_shift_decrease_min: "Définir au minimum"
 eu5ab_regional_development__automation__rgo_desc: "Envisage l'extension des O.C.R. dès que les emplois existants sont pourvus. Choisissez si vous souhaitez prévoir les ouvriers pour les nouveaux postes."
 eu5ab_regional_development__rgo_workforce_mode_name: "Mode de main-d'œuvre des O.C.R."
 eu5ab_regional_development__rgo_forced_relaxed_name: "Mod'O.C.R. : Assoupli (suspension par manque de main-d'œuvre désactivée)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "Aucune prévision de main-d'œuvre. Les emplois existants doivent être pourvus ; le manque de main-d'œuvre pour les nouveaux postes réduit seulement la priorité de construction."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Assoupli par défaut. Désactiver la protection de la main-d'œuvre utilise temporairement le mode Assoupli et réduit la priorité en cas de pénurie actuelle de main-d'œuvre. La réactiver rétablit le mode sélectionné. Les emplois existants doivent toujours être pourvus."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Assoupli"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Suit les règles générales d'agrandissement du jeu : dès que les postes existants sont pourvus, évalue les prix, les besoins du marché et la production prévue sans projeter de nouveaux ouvriers. Avec la protection de la main-d'œuvre activée, le manque de main-d'œuvre pour les nouveaux postes ne réduit pas la priorité."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Prendre en compte la population"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "Après vérification du plein emploi actuel, estime les promotions qualifiées sur l'horizon de prévision. Suspend si les ouvriers ne peuvent pas pourvoir le niveau suivant."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "Horizon de population des O.C.R. (mois)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "En mode Prendre en compte la population, l'agrandissement exige que suffisamment d'ouvriers soient attendus durant cette période pour pourvoir les nouveaux postes. Par défaut : 180 mois. Plage : 0-1200 ; zéro ne compte que les ouvriers actuellement disponibles. L'estimation prend en compte Nombreuses opportunités, l'alphabétisation et la population susceptible de changer de métier. Les prévisions plus longues peuvent s'éloigner davantage des résultats réels. Cliquez pour ajuster d'un mois, maintenez Ctrl pour 12 mois ou Shift pour 120 mois."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "Lorsqu'activé, les bâtiments ordinaires ont besoin de prévisions de main-d'œuvre suffisantes ; les O.C.R. utilisent leur mode sélectionné. Désactiver cela arrête les prévisions et applique temporairement le mode Assoupli aux O.C.R. Les pénuries actuelles réduisent la priorité sans bloquer les nouveaux projets à elles seules. Les postes existants des O.C.R. doivent toujours être pourvus. Réactiver rétablit le mode d'O.C.R. précédent."
 eu5ab_regional_development__job_fill_deadline_months_name: "Horizon de main-d'œuvre des bâtiments ordinaires (mois)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Horizon indépendant pour les bâtiments ordinaires : par défaut 12 mois, plage de 0 à 240. Zéro ne compte que les ouvriers inactifs qualifiés actuels. Les O.C.R. tenant compte de la population utilisent leur propre horizon. Les taux de promotion actuels sont une estimation, pas une garantie."
 eu5ab_regional_development__price_min_desc: "Par défaut : 80 % du prix de base. Des prix plus bas réduisent la priorité. Suspend la construction lorsque toutes les productions sont inférieures ou égales au seuil ; pondère les productions multiples par quantité et prix de base. À 100 % ou plus, seul le seuil s'applique. Les sécurités alimentaires activées peuvent lever les limites de prix."
 eu5ab_regional_development__price_max_desc: "Par défaut : 125 %. Les prix supérieurs à la base augmentent progressivement la priorité jusqu'à la référence. Avec une référence de 125 %, un prix de 112,5 % ajoute 70 points ; 125 % ou plus ajoute 140 points. Si la référence est de 100 % ou moins, tout prix supérieur à la base ajoute 140 points."
 EU5AB_CMM_NUMERIC_INCREASE_5X: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__rgo_job_fill_deadline_months'), 'eu5ab_cmm_ctrl_increase_12', 'eu5ab_cmm_ctrl_increase_default')]"
 eu5ab_cmm_shift_increase_120: "Augmenter de 120 mois"
