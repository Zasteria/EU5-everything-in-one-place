 eu5ab_active_price_min_value: "Prix minimal : [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Référence de prix élevé : [GetPlayer.MakeScope.GetVariable('eu5ab_global_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Prix minimal : [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Référence de prix élevé : [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Règles de construction automatisée"
 eu5ab_prediction_diagnostics_title: "Estimation de la main-d'œuvre et état de la construction"
 eu5ab_prediction_section_body: "Organise les améliorations, extensions ordinaires, extensions d'O.C.R. et nouveaux bâtiments selon l'Ordre de construction automatique choisi, en essayant d'abord les projets éligibles du type en cours.\nLorsque les sécurités alimentaires activées s'appliquent, les projets vivriers pertinents passent en premier et les limites de rendement, de prix ou autres sont assouplies selon la configuration. Les sécurités activées pour les matériaux de construction, le ravitaillement militaire ou les intrants stratégiques peuvent aussi assouplir les exigences de rendement.\nLe budget, la réserve du trésor et les critères applicables d'intrants, de main-d'œuvre, de capacité des bâtiments et de construction du jeu s'appliquent toujours. Seul le niveau débloqué le plus récent des bâtiments ordinaires est pris en compte ; les améliorations ne comptent que les emplois créés."
 eu5ab_diagnostics_title: "État de la construction automatisée"
 eu5ab_diagnostics_snapshot_note: "Les paramètres sont enregistrés immédiatement. Les rapports s'actualisent au fil des vérifications et du lancement des projets, en conservant les résultats par la suite."
 eu5ab_diagnostics_snapshot_help: "Le rapport s'actualise au fur et à mesure des vérifications et du début des constructions, conservant les résultats jusqu'au prochain passage. Les projets sont organisés à partir du 23, de sorte que le nombre de chantiers et les dépenses peuvent évoluer progressivement. Certains résultats restent en attente jusqu'à la fin des vérifications."
