 eu5ab_diag_result_help: "Lorsque les sécurités alimentaires activées s'appliquent, les projets vivriers sont prioritaires. Les autres projets suivent l'Ordre de construction automatique, en tentant des alternatives si un projet ne peut démarrer.\nLes O.C.R. sont évaluées selon les pénuries, les prix, l'emploi et les besoins stratégiques, sous réserve des conditions de construction du jeu.\nSeuls les démarrages réussis consomment du budget et des créneaux de construction. Après le passage, les lieux accueillant de nouveaux projets attendent 3 mois avant tout nouveau chantier."
 eu5ab_diag_rgo_title: "Vérifications des candidats O.C.R."
 eu5ab_diag_rgo_short_desc: "Chaque lieu enregistre un résultat ; un rejet est compté sous la première cause rencontrée."
 eu5ab_diag_rgo_help: "Affiche la dernière vérification d'extension d'O.C.R. Les emplois existants doivent être pourvus. Prendre en compte la population prévoit les nouveaux ouvriers ; Assoupli ne le fait pas. Les prix, les gains de production non encore réalisés et le manque actuel d'ouvriers influent sur la priorité. Les gains de production sont combinés pour les projets possédés produisant le même bien sur le même marché ; les chiffres incomplets n'affichent que les montants connus. Atteindre la limite suspend les nouveaux chantiers, pas les projets existants."
