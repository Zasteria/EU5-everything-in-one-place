 eu5ab_set_cash_reserve_2000_desc: "Fixez à 2000 la réserve minimale du trésor pour la construction automatisée de ce lieu."
 eu5ab_enable_special_buildings_for_location: "Ce Mod : autoriser les bâtiments spéciaux"
 eu5ab_enable_special_buildings_for_location_desc: "Autorisez la construction automatisée à construire ou améliorer les bâtiments spéciaux du lieu sélectionné."
 eu5ab_disable_special_buildings_for_location: "Ce Mod : interdire les bâtiments spéciaux"
 eu5ab_disable_special_buildings_for_location_desc: "Empêchez la construction automatisée de construire ou améliorer les bâtiments spéciaux du lieu sélectionné."
 eu5ab_decouple_selected_location: "Ce Mod : cesser de suivre le modèle de province"
 eu5ab_decouple_selected_location_desc: "Les futures modifications du modèle de province ne mettront plus à jour le lieu sélectionné."
 eu5ab_clear_selected_location_policy: "Ce Mod : effacer la politique du lieu"
 eu5ab_clear_selected_location_policy_desc: "Sélectionnez un lieu, puis retirez son affectation de modèle et ses paramètres associés."
 eu5ab_rgo_short_desc: "Les postes existants doivent être pourvus. Le mode par défaut est Assoupli ; choisissez Prendre en compte la population pour prévoir les ouvriers des nouveaux postes."
 eu5ab_rgo_help: "Les emplois existants des O.C.R. doivent être entièrement pourvus. Le mode Assoupli, actif par défaut, ne prévoit pas de nouveaux ouvriers ; Prendre en compte la population exige qu'un nombre suffisant d'ouvriers soit attendu dans le délai imparti.\nLes prix inférieurs ou égaux au seuil minimal suspendent l'extension. Les prix bas réduisent la priorité et les prix élevés l'augmentent. Les projets ayant un score inférieur à 0 ne démarrent pas.\nLes bâtiments ordinaires possédés et les O.C.R. possédées produisant le même bien sur le même marché partagent une limite d'extension. Elle inclut les gains de production non encore réalisés des chantiers en cours ou achevés, et tient compte de la nouvelle demande d'intrants des projets prévus. Les constructions supplémentaires deviennent moins prioritaires à mesure que les gains prévus approchent du déficit de la demande plus 10 % de la demande. Les nouveaux départs sont suspendus à ce montant. Le dernier niveau peut le dépasser ; les projets existants se poursuivent.\nDésactiver la protection de la main-d'œuvre arrête les prévisions, mais la pénurie actuelle réduit toujours la priorité. Les sécurités alimentaires activées peuvent prioriser les O.C.R. concernées et dispenser des limites de prix et d'extension. Le plein emploi actuel et les critères applicables de main-d'œuvre, de budget et de construction du jeu s'appliquent toujours."
 eu5ab_workforce_help: "Les bâtiments ordinaires utilisent par défaut une prévision de 12 mois ; les O.C.R. en mode Prendre en compte la population utilisent 180 mois. Les estimations s'appuient sur les taux actuels de promotion, les modificateurs locaux et nationaux, Nombreuses opportunités, l'alphabétisation et la population éligible. L'émigration/immigration, l'évolution des taux et la concurrence d'autres emplois peuvent influer sur les résultats.\nDésactiver la protection de la main-d'œuvre arrête les prévisions. Les pénuries actuelles réduisent la priorité sans modifier le bénéfice prévu ; les sécurités alimentaires s'appliquent toujours selon la configuration."
