 eu5ab_reset_decision: "Réinitialiser Advanced Auto Build"
 eu5ab_reset_decision_desc: "Conserve les modèles et les paramètres, retire les affectations de lieux et réinitialise l'historique de construction. Réaffectez les modèles ensuite."
 eu5ab_deep_decision: "Replanifier la construction nationale de ce mois"
 eu5ab_deep_decision_desc: "Réévalue les lieux possédés utilisant des modèles activés, enregistre le plan de ce mois et organise les chantiers à partir du 23."
 eu5ab_open_confirmation: "Ouvrir la confirmation"
 eu5ab_reset_confirm: "Confirmer la réinitialisation"
 eu5ab_reset_confirm_desc: "Conserve les modèles et les paramètres, mais efface les affectations de lieux, plans, délais d'attente, rapports, recommandations et historiques de dépenses de projet et annuelles. L'or dépensé n'est pas remboursé ; les chantiers en cours continuent. Réaffectez les modèles ensuite.\nAprès avoir changé de pays, remplace les modèles et paramètres de ce pays par ceux enregistrés avant le changement."
 eu5ab_deep_confirm_desc: "Revérifie les lieux possédés utilisant des modèles activés et remplace le plan non exécuté de ce mois. Utilise la stratégie actuelle, les sécurités alimentaires et l'ordre de construction ; le dernier projet peut dépasser le budget restant.\nLes grands pays peuvent prendre du temps ; la fenêtre ne peut être fermée tant que la planification n'est pas terminée. Les modifications ultérieures de paramètres ne changeront pas ce plan. Organise les chantiers à partir du 23 ; reprend les vérifications normales le mois prochain."
