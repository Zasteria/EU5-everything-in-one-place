 eu5ab_set_cash_reserve_0: "Ce Mod : réserve du trésor 0"
 eu5ab_set_cash_reserve_0_desc: "Fixez à 0 la réserve minimale du trésor pour la construction automatisée de ce lieu."
 eu5ab_set_cash_reserve_500: "Ce Mod : réserve du trésor 500"
 eu5ab_set_cash_reserve_500_desc: "Fixez à 500 la réserve minimale du trésor pour la construction automatisée de ce lieu."
