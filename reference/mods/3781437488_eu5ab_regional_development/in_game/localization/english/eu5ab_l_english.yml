 eu5ab_cmm_shift_decrease_10: "Decrease by 10"
 eu5ab_cmm_shift_increase_1000: "Increase by 1000"
 eu5ab_cmm_shift_decrease_1000: "Decrease by 1000"
 eu5ab_cmm_shift_increase_max: "Set to Maximum"
 eu5ab_cmm_shift_decrease_min: "Set to Minimum"
 eu5ab_regional_development__automation__rgo_desc: "Consider RGO expansion once existing jobs are full. Choose whether to forecast workers for new jobs."
 eu5ab_regional_development__rgo_workforce_mode_name: "RGO Workforce Mode"
 eu5ab_regional_development__rgo_forced_relaxed_name: "RGO Mode: Relaxed (Workforce Pausing Off)"
 eu5ab_regional_development__rgo_forced_relaxed_desc: "No workforce forecast. Existing jobs must be full; shortages for new jobs only lower construction priority."
 eu5ab_regional_development__rgo_workforce_mode_desc: "Relaxed by default. Turning workforce protection off temporarily uses Relaxed mode and lowers priority for current worker shortages. Re-enabling restores the selected mode. Existing jobs must always be full."
 eu5ab_regional_development__rgo_workforce_mode_option_1_name: "Relaxed"
 eu5ab_regional_development__rgo_workforce_mode_option_1_desc: "Follows the game's general expansion rules: once existing jobs are full, assess prices, market needs, and expected output without forecasting new workers. With workforce protection on, shortages for new jobs do not lower priority."
 eu5ab_regional_development__rgo_workforce_mode_option_2_name: "Consider Population"
 eu5ab_regional_development__rgo_workforce_mode_option_2_desc: "After checking full existing employment, estimate qualified promotions over the horizon. Pause if workers cannot fill the next level."
 eu5ab_regional_development__rgo_job_fill_deadline_months_name: "RGO Population Horizon (Months)"
 eu5ab_regional_development__rgo_job_fill_deadline_months_desc: "In Consider Population mode, expansion requires enough workers to be expected within this period to fill the new jobs. Default: 180 months. Range: 0-1200; zero counts only currently available workers. The estimate accounts for Plenty of Opportunities, literacy and the population eligible to change jobs. Longer forecasts may differ more from actual results. Click to adjust by 1 month, hold Ctrl for 12 months, or Shift for 120 months."
 eu5ab_regional_development__rgo_job_fill_deadline_months_format: "[CMMV('eu5ab_regional_development__rgo_job_fill_deadline_months')]"
 eu5ab_regional_development__pause_low_workforce_desc: "When enabled, ordinary buildings need sufficient forecast workers; RGOs use their selected mode. Turning this off stops forecasts and temporarily uses Relaxed mode for RGOs. Current shortages lower priority without blocking new projects by themselves. Existing RGO jobs must still be full. Re-enabling restores the previous RGO mode."
 eu5ab_regional_development__job_fill_deadline_months_name: "Ordinary-Building Workforce Horizon (Months)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Independent horizon for ordinary buildings: default 12 months, range 0-240. Zero counts only currently qualified idle workers. Population-aware RGOs use their separate horizon. Current promotion rates are an estimate, not a guarantee."
 eu5ab_regional_development__price_min_desc: "Default: 80% of base price. Lower prices reduce priority. Pause construction when all outputs are at or below the threshold; weight multiple outputs by quantity and base price. At 100% or above, only the threshold applies. Enabled food safeguards can waive price limits."
 eu5ab_regional_development__price_max_desc: "Default: 125%. Prices above base gradually add priority up to the reference. At a 125% reference, a price of 112.5% adds 70 points; 125% or more adds 140. If the reference is 100% or lower, any price above base adds 140."
