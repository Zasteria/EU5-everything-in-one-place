l_japanese:
 bul_bulgaria_mission_pack: "新ビザンティオン——第二次帝国の遺産とバルカンの覇権"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "第二次ブルガリア帝国の遺産を継ぐ者として、独立を確立し、バルカン半島に覇を唱え、オスマンの脅威を退けて、コンスタンティノープルに新たなビザンティオンを打ち立てよ。"
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "独立を確立し、バルカン帝国を再興し、オスマンを退け、新ビザンティオンを打ち立てよ。"
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "タルノヴォの古都から、バルカンに輝く新帝国へ。"
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "「ツァリグラードの主」——第二次帝国の栄光を受け継ぎ、第三次ブルガリア帝国を打ち立てよ！"
 bul_second_bulgarian_legacy: "分裂する帝国"
 bul_second_bulgarian_legacy_desc: "イヴァン・アセン1世とイヴァン・アセン2世が築いた栄光の帝国は、今や貴族たちの野心によってタルノヴォ・ヴィディン・ドブロジャへと分裂しつつある——この衰退を食い止めよ。"
 bul_assert_independence: "ツァリグラードの威光"
 bul_assert_independence_desc: "分裂の危機にある帝国——タルノヴォのツァリとして、いかなる勢力にも屈せぬ揺るぎない権威を打ち立てよ。"
 bul_tarnovo_capital: "タルノヴォの発展"
 bul_tarnovo_capital_desc: "「第二のツァリグラード」と称された古都タルノヴォ——かつての帝都の威光を、再びこの地に蘇らせよ。"
 bul_bulgarian_patriarchate: "ブルガリア総主教座"
 bul_bulgarian_patriarchate_desc: "コンスタンティノープルから独立した自主教会——ブルガリア正教会の権威を、揺るぎないものとせよ。"
 bul_boyar_council: "ボヤールの評議会"
 bul_boyar_council_desc: "古くからブルガリアを支えてきた貴族ボヤール——彼らの評議会を、統治の柱として活用せよ。"
 bul_reunite_bulgaria: "ブルガリアの再統合"
 bul_reunite_bulgaria_desc: "ブルガリアとシリストリアの地——この歴史的中核地を、一つの旗のもとに再統合せよ。"
 bul_bulgarian_independence: "帝国の再統一"
 bul_bulgarian_independence_desc: "ヴィディンとドブロジャへと分裂した帝国——これらの地を再び一つの王冠のもとに統べ、タルノヴォを中心とした帝国の再統一を果たせ。"
 bul_sofia: "聖なる知恵の都"
 bul_sofia_desc: "セルディカ、スレデツ、トリアディツァ——幾つもの名を経てきたこの街を、新たな時代にふさわしい名で呼び直せ。"
 bul_conquer_macedonia: "マケドニア征服"
 bul_conquer_macedonia_desc: "古代からブルガリア文化の中心地であったマケドニア——この地を我が版図に取り戻せ。"
 bul_conquer_serbia: "セルビア征服"
 bul_conquer_serbia_desc: "隣接するセルビアの地——バルカンの覇権をめぐる好敵手を制せよ。"
 bul_bulgarian_empire: "ブルガリア帝国"
 bul_bulgarian_empire_desc: "ブルガリアはかつて、バルカンの大部分を治める大帝国であった。これらの地を再び我が版図へと戻すのだ！"
 bul_conquer_wallachia: "ワラキア征服"
 bul_conquer_wallachia_desc: "ドナウ川北岸のワラキア公国——この地に我が影響力を打ち立てよ。"
 bul_conquer_moldavia: "モルダヴィア征服"
 bul_conquer_moldavia_desc: "カルパティア山脈東方のモルダヴィア公国——この豊かな地を我が版図に組み込め。"
 bul_conquer_transylvania: "トランシルヴァニア征服"
 bul_conquer_transylvania_desc: "山々に囲まれたトランシルヴァニアの地——この地方を我が帝国の一部とせよ。"
 bul_conquer_thrace_greece: "トラキア・北ギリシャ征服"
 bul_conquer_thrace_greece_desc: "古代トラキア人の地、そして北ギリシャ——この地方を我が帝国に組み込め。"
 bul_extend_the_empire: "帝国の拡大"
 bul_extend_the_empire_desc: "帝国の版図は、さらに押し広げられねばならない——ギリシャとカルパティアへの遠征を続けよ。"
 bul_chitalishte_movement: "チタリシュテ制度"
 bul_chitalishte_movement_desc: "「読書室（チタリシュテ）」と呼ばれる民衆の文化拠点——都市の民に読み書きと民族意識を育むこの場を、各地に根付かせよ。ブルガリア民族覚醒の狼煙は、ここに上がる。"
 bul_chitalishte_unlock_tt: "都市特権「チタリシュテの町」が使用可能になる。"
 bul_ottoman_wars: "対オスマン戦争"
 bul_ottoman_wars_desc: "勃興するオスマン帝国——この新たな脅威との戦いに臨め。"
 bul_varna_crusade: "ヴァルナ十字軍"
 bul_varna_crusade_desc: "ハンガリーと共に立ち上がり、オスマンに対する十字軍を率いよ。1444年、ヴァルナの地で歴史が動く。"
 bul_end_ottoman_threat: "オスマンの脅威の終焉"
 bul_end_ottoman_threat_desc: "かつて恐れられたオスマンの脅威——これに終止符を打ち、バルカンにおける我が地位を確固たるものとせよ。"
 bul_constantinople_ambition: "コンスタンティノープルへの野心"
 bul_constantinople_ambition_desc: "かつて正教世界の中心であった都——この都市への野心を抱け。"
 bul_new_byzantium: "コンスタンティノープルとローマの領有"
 bul_new_byzantium_desc: "正教世界の中心コンスタンティノープル、そして西方教会の総本山ローマ——この二つの都を共に掌握し、ブルガリアは東西キリスト教世界に君臨する新たな帝国となる。"
 bul_black_sea_trade: "黒海交易"
 bul_black_sea_trade_desc: "黒海に面する港湾都市ヴァルナ——これを整備し、黒海交易への足がかりとせよ。"
 bul_black_sea_dominion: "黒海の覇権"
 bul_black_sea_dominion_desc: "黒海沿岸の広大な地——この海域における交易の覇権を確立せよ。"
 bul_third_bulgarian_empire: "第三次ブルガリア帝国"
 bul_third_bulgarian_empire_desc: "独立、バルカンの統一、オスマンの打倒、そして新ビザンティオンの樹立——ここに、第三次ブルガリア帝国が完成する。"
 bul_events.1.t: "帝国再統一の宣言"
 bul_events.1.d: "分裂していたタルノヴォ・ヴィディン・ドブロジャは、再び一つの帝国として統一された。第二次ブルガリア帝国は、ここに新たな力を得る。"
 bul_events.1.a: "ブルガリアに栄光あれ！"
 bul_events.4.t: "ソフィアの歴史"
 bul_events.4.d: "この街は、ローマ人がセルディカと呼び、後にスラヴ人がスレデツと名付けた古き都——そして今、聖なる知恵（ソフィア）の教会にちなみ、新たな名で呼ばれることとなる。トラキア人、ローマ人、ビザンツ人、そしてブルガリア人——幾多の文明がこの盆地を行き交った、その歴史の重みを胸に刻め。"
 bul_events.4.a: "ソフィアと名付けよ"
 bul_events.4.b: "ソフィアと名付け、この地を新たな帝都とせよ"
 bul_events.2.t: "ブルガリア帝国の宣言"
 bul_events.2.d: "マケドニア、セルビア、ラシュカを統べる者として、ブルガリアはここに帝国を宣言する。"
 bul_events.2.a: "皇帝万歳！"
 bul_events.3.t: "新ビザンティオンの夢"
 bul_events.3.d: "コンスタンティノープルの城壁の内側に、そして永遠の都ローマの丘に、ブルガリアの旗が共に翻る。正教世界の新たな中心、そして西方教会の総本山——この二つの都は、ここに新たな帝国の柱として生まれ変わる。"
 bul_events.3.a: "神は我らと共にあり！"
 bul_events.99.t: "第三次ブルガリア帝国の宣言"
 bul_events.99.d: "タルノヴォの古都から始まった長き道のりは、バルカンの統一、オスマンの打倒、そして新ビザンティオンの樹立を経て、ここに真の完成を迎えた。"
 bul_events.99.a: "第三次ブルガリア帝国、永遠なれ！"
 bul_hagia_sophia_sofia: "聖ソフィア教会"
 bul_hagia_sophia_sofia_desc: "6世紀、ユスティニアヌス帝の治世に建てられたバシリカ様式の聖堂——「聖なる知恵」を意味するその名は、やがてこの街自体の呼び名となった。幾多の時代を生き抜いたこの教会は、ブルガリアの首都に据えられた新たな都の魂として、その歴史を静かに物語り続けている。"
 STATIC_MODIFIER_NAME_bul_legacy_mod: "第二次ブルガリア帝国の遺産"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "内紛の嵐の中でも、宮廷における法と書記の営みは辛うじてその機能を保っている。"
 STATIC_MODIFIER_NAME_bul_independence_mod: "独立の確立"
 STATIC_MODIFIER_DESC_bul_independence_mod: "タルノヴォの玉座に座す者の権威は、もはや疑う者なき正統性を纏う。"
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "ヴェリコ・タルノヴォ"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "ツァレヴェツの丘に築かれた宮殿と聖堂が、帝都の威容を取り戻しつつある。"
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "ブルガリア総主教座"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "総主教の祝福が、あらゆる信徒の心に安らぎをもたらしている。"
 STATIC_MODIFIER_NAME_bul_boyar_mod: "ボヤールの評議会"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "ボヤールたちは、玉座への忠誠を新たにした。"
 STATIC_MODIFIER_NAME_bul_reunite_mod: "ブルガリアの再統合"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "分かたれていた地に、再び一つの旗が翻る。"
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "マケドニア征服"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "サモイルの栄光を刻んだ山々が、再びツァーリの版図に加わった。"
 STATIC_MODIFIER_NAME_bul_serbia_mod: "セルビア征服"
 STATIC_MODIFIER_DESC_bul_serbia_mod: "セルビアの平原に、ブルガリアの軍旗が立てられた。"
 STATIC_MODIFIER_NAME_bul_wallachia_mod: "ワラキア征服"
 STATIC_MODIFIER_DESC_bul_wallachia_mod: "ドナウの北岸において、我らの意志が重んじられるようになった。"
 STATIC_MODIFIER_NAME_bul_moldavia_mod: "モルダヴィア征服"
 STATIC_MODIFIER_DESC_bul_moldavia_mod: "モルダヴィアの穀倉地帯から、富がタルノヴォへと流れ込む。"
 STATIC_MODIFIER_NAME_bul_transylvania_mod: "トランシルヴァニア征服"
 STATIC_MODIFIER_DESC_bul_transylvania_mod: "カルパティアの山峡を越え、新たな地が我らに服した。"
 STATIC_MODIFIER_NAME_bul_thrace_mod: "トラキア・北ギリシャ征服"
 STATIC_MODIFIER_DESC_bul_thrace_mod: "古のトラキアの地に、再び戦の記憶が刻まれた。"
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "帝国の拡大"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "版図の広がりは、諸国に我らの力を知らしめている。"
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "対オスマン戦争"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "トルコの脅威と幾度となく刃を交えた経験が、兵たちを鍛え上げた。"
 STATIC_MODIFIER_NAME_bul_varna_mod: "ヴァルナ十字軍"
 STATIC_MODIFIER_DESC_bul_varna_mod: "ヴァルナの丘に散った十字軍の記憶は、いまも語り継がれている。"
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "オスマンの脅威の終焉"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "長きにわたる脅威が去り、バルカンの地に安堵の声が響く。"
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "コンスタンティノープルへの野心"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "黒海と地中海を結ぶ海路に、我が軍船の影が差している。"
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "黒海交易"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "ヴァルナの港には、異国の商人たちの船が絶えず出入りしている。"
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "黒海の覇権"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "黒海の波間を、ブルガリアの商船が我が物顔で行き交う。"
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "第三次ブルガリア帝国"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "タルノヴォより発した光は、いまやバルカン全土を照らしている。"
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "ブルガリアの独立"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "分裂した地はふたたび一つとなり、諸国はこの再興を認めざるを得ない。"
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "新ビザンティオン"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "コンスタンティノープルの聖堂に、新たな祈りの声が響き始めた。"
