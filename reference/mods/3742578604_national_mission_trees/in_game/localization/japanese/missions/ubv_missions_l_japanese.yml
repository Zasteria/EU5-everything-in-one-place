l_japanese:
 ubv_oberbayern_mission_pack: "ミュンヘン家の遺産——バイエルン再統一への道"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "皇帝ルートヴィヒ4世の血を引くミュンヘン家として、分裂したバイエルンを再び一つに統べよ。"
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "ミュンヘンを発展させ、バイエルンを再統一せよ。"
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "ミュンヘンを発展させ、バイエルンを再統一せよ。"
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "全バイエルンの公として立て！"
 ubv_wittelsbach_legacy: "ヴィッテルスバッハの遺産"
 ubv_wittelsbach_legacy_desc: "1329年のパヴィア条約により分割されたバイエルン公領——皇帝ルートヴィヒ4世の血を引くミュンヘン家として、その遺産を受け継げ。"
 ubv_secure_munich: "ミュンヘンの発展"
 ubv_secure_munich_desc: "イーザル川沿いの都市ミュンヘン——皇帝ルートヴィヒ4世が愛したこの都を、公領の中心として発展させよ。"
 ubv_salt_trade: "岩塩交易"
 ubv_salt_trade_desc: "「白い金」と称された岩塩——ライヒェンハルの塩坑を掌握し、この貴重な資源からの富を確保せよ。"
 ubv_imperial_relations: "帝国との関係"
 ubv_imperial_relations_desc: "ルートヴィヒ4世が戴いた皇帝の座——神聖ローマ帝国との関係を、この栄光の記憶にふさわしいものとせよ。"
 ubv_bavarian_ambition: "バイエルン統一への野心"
 ubv_bavarian_ambition_desc: "ミュンヘンの発展、岩塩交易、帝国との関係、そしてインゴルシュタットとの角逐——これらを礎に、バイエルン全土への野心を抱け。"
 ubv_reunite_bavaria: "バイエルンの再統合"
 ubv_reunite_bavaria_desc: "分裂した公領——ニーダーバイエルンの地を我が手に取り戻し、バイエルンを再び一つに統べよ。"
 ubv_duke_of_all_bavaria: "全バイエルンの公"
 ubv_duke_of_all_bavaria_desc: "ミュンヘン家の血脈のもと、バイエルン全土がついに一つの旗のもとに統べられる。"
 ubv_events.1.t: "バイエルン統一の宣言"
 ubv_events.1.d: "ミュンヘン家の血脈のもと、バイエルンはついに一つに統べられた。分裂の時代は終わりを告げる。"
 ubv_events.1.a: "バイエルンに栄光あれ！"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "ヴィッテルスバッハの遺産"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "皇帝を戴いた家門の記憶が、国家に威信をもたらしている。"
 STATIC_MODIFIER_NAME_ubv_munich_mod: "ミュンヘンの発展"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "イーザル川沿いの都が、公領の中心として繁栄している。"
 STATIC_MODIFIER_NAME_ubv_salt_mod: "岩塩交易"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "ライヒェンハルの塩坑が、国庫に富をもたらしている。"
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "帝国との関係"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "帝国との良好な関係が、外交上の威信を高めている。"
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "バイエルンの再統合"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "再統合された公領が、統合速度を高めている。"
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "全バイエルンの公"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "統一の完成が、国家の威信を高めた。"
 ubv_unified_duchy: "統一バイエルン公国"
 ubv_unified_duchy_desc: "分裂の時代は終わった——統一されたバイエルン公国として、新たな時代を切り開け。"
 ubv_landrecht: "バイエルン法典"
 ubv_landrecht_desc: "統一された公領に、統一された法を——バイエルン国法典（ラントレヒト）を制定し、統治の基盤を固めよ。"
 ubv_tyrol_ambition: "チロルへの野心"
 ubv_tyrol_ambition_desc: "アルプスの山々に抱かれたチロル伯領——この地への野心を抱け。"
 ubv_swabian_expansion: "シュヴァーベンへの進出"
 ubv_swabian_expansion_desc: "南西に広がるシュヴァーベンの地——この地方への影響力を強めよ。"
 ubv_greater_bavaria: "大バイエルンの実現"
 ubv_greater_bavaria_desc: "法典、等族会議、チロル、シュヴァーベン——これらを礎に、より大きなバイエルンを実現せよ。"
 ubv_counter_reformation_leader: "対抗宗教改革の旗手"
 ubv_counter_reformation_leader_desc: "トリエント公会議の精神を体現し、対抗宗教改革の先頭に立て。"
 ubv_electoral_dignity: "選帝侯の尊厳"
 ubv_electoral_dignity_desc: "1623年、マクシミリアン1世がついに選帝侯の地位を獲得する——この栄誉を、バイエルンの永遠の誇りとせよ。"
 ubv_austrian_rivalry: "オーストリアとの対抗"
 ubv_austrian_rivalry_desc: "帝国内の覇権を巡るハプスブルク家との対抗——この好敵手との角逐に臨め。"
 ubv_war_of_austrian_succession: "オーストリア継承戦争"
 ubv_war_of_austrian_succession_desc: "カール7世の帝位主張を巡る戦い——この継承戦争に乗じ、バイエルンの威信を高めよ。"
 ubv_imperial_crown: "帝冠の戴冠"
 ubv_imperial_crown_desc: "1742年、バイエルン公カール7世が神聖ローマ皇帝として戴冠する——ハプスブルク家以外による、実に数世紀ぶりの帝冠である。"
 ubv_enlightened_absolutism: "啓蒙専制主義"
 ubv_enlightened_absolutism_desc: "理性と学問を重んじる啓蒙の時代——この新たな思潮を、バイエルンの統治に取り入れよ。"
 ubv_napoleonic_alliance: "フランスへの対抗"
 ubv_napoleonic_alliance_desc: "革命とナポレオンの野心によって揺さぶられるヨーロッパ——バイエルンは、この強大な隣国に対する王位継承権を確保し、独自の道を切り開く。"
 ubv_kingdom_of_bavaria: "バイエルン王国の樹立"
 ubv_kingdom_of_bavaria_desc: "1806年、選帝侯マクシミリアン4世ヨーゼフはバイエルン王国の王を宣言する——ヴィッテルスバッハ家の長き歴史は、ここに新たな頂点を迎える。"
 ubv_events.2.t: "三十年戦争への参戦"
 ubv_events.2.d: "帝国全土を巻き込む未曾有の大戦——バイエルンは、カトリックの大義のためにこの戦いに身を投じる。"
 ubv_events.2.a: "神とカトリックの大義のために！"
 ubv_events.3.t: "帝冠の戴冠"
 ubv_events.3.d: "1742年、バイエルン公カール7世が、フランクフルトの聖堂にて神聖ローマ皇帝として戴冠した。ハプスブルク家以外の者が帝冠を戴くのは、実に数世紀ぶりのことである。"
 ubv_events.3.a: "皇帝陛下に栄光あれ！"
 ubv_events.99.t: "バイエルン王国の宣言"
 ubv_events.99.d: "1806年、選帝侯マクシミリアン4世ヨーゼフは、ライン同盟のもとバイエルン王国の王を宣言した。ヴィッテルスバッハ家の長き歴史は、ここに新たな頂点を迎える。"
 ubv_events.99.a: "バイエルン王国、永遠なれ！"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "統一バイエルン公国"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "統一の記憶が、国家に威信と規律をもたらしている。"
 STATIC_MODIFIER_NAME_ubv_greater_mod: "大バイエルンの実現"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "拡大した公国が、国威を高めている。"
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "対抗宗教改革の旗手"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "改宗運動の推進が、布教速度を高めている。"
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "オーストリア継承戦争"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "継承戦争の経験が、戦果を高めている。"
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "帝冠の戴冠"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "帝冠を戴いた記憶が、国家の威信と外交上の評価を大きく高めた。"
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "啓蒙専制主義"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "啓蒙思潮の導入が、識字率の向上をもたらしている。"
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "選帝侯の尊厳"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "選帝侯の地位が、外交上の威信と関係改善の手腕を高めている。"
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "バイエルン王国の樹立"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "王国の樹立が、国威のすべてを頂点へと導いた。"
