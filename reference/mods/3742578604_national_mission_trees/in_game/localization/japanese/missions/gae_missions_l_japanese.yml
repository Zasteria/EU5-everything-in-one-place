l_japanese:
 gae_gaelic_ireland_mission_pack: "ゲール人アイルランドの逆襲"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "黒死病とブルース侵攻で揺らぐイングランド支配——ゲール人の氏族長として巻き返しを図り、高王の座に就いてアイルランドを統一し、ついには海を渡ってイングランドそのものを征服せよ。"
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "氏族を統一し、アイルランド全土を統べる高王となり、イングランドを征服せよ。"
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "分裂した氏族から、イングランドを征服する高王へ。"
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "エメラルドの島に、ゲール人の旗を——そして海の向こうにも！"
 gae_gaelic_resurgence: "ゲール人の巻き返し"
 gae_gaelic_resurgence_desc: "黒死病とブルース侵攻の混乱を経て、イングランドの植民地支配は揺らいでいる——ゲール人諸侯の時代が、再びこの島に訪れようとしている。"
 gae_brehon_law: "ブレホン法の護持"
 gae_brehon_law_desc: "ローマ法にもイングランド法にも属さぬ独自の法体系、ブレホン法——この伝統ある法を、統治の礎として守り抜け。"
 gae_fili_and_bards: "フィリと吟遊詩人"
 gae_fili_and_bards_desc: "氏族の歴史と系譜を語り継ぐフィリ（学識詩人）たち——彼らの技芸を保護し、氏族の誉れを歌い継がせよ。"
 gae_gallowglass_recruitment: "ガロウグラスの雇用"
 gae_gallowglass_recruitment_desc: "スコットランドの島々からやってきた屈強な戦士たち——この「ガロウグラス」を軍に迎え入れ、氏族の武力を高めよ。"
 gae_clan_unification: "氏族の統合"
 gae_clan_unification_desc: "分裂した傍系や係争地——これらを一つにまとめ上げ、氏族長としての権威を確立せよ。"
 gae_lord_of_the_clan: "氏族の長"
 gae_lord_of_the_clan_desc: "法、詩歌、武力、そして統合された血脈——これらすべてを礎に、真の氏族の長として立て。"
 gae_rout_the_settlers: "入植者たちの撃退"
 gae_rout_the_settlers_desc: "黒死病で数を減らしたイングランド系入植者たち——この好機を逃さず、彼らをこの地から追い払え。"
 gae_ostmen_towns: "オストマンの町"
 gae_ostmen_towns_desc: "古来ヴァイキングの末裔（オストマン）が築いた港町——ダブリンやウォーターフォードといったこれらの都市を掌握せよ。"
 gae_resurgence_triumphant: "巻き返しの完成"
 gae_resurgence_triumphant_desc: "入植者の撃退、辺境の奪還、そしてオストマンの町の掌握——ゲール人の巻き返しは、ここに一つの成果を迎える。"
 gae_ulster_hegemony: "アルスターの覇権"
 gae_ulster_hegemony_desc: "オニール家やオドネル家の勢力圏、北の大地アルスター——この地方における覇権を確立せよ。"
 gae_connaught_hegemony: "コナートの覇権"
 gae_connaught_hegemony_desc: "西の荒野コナート——オコナー家の栄光を継ぐ者として、この地方を統べよ。"
 gae_munster_hegemony: "マンスターの覇権"
 gae_munster_hegemony_desc: "マクカーシー家やオブライエン家の地、南のマンスター——この豊かな地方における覇権を握れ。"
 gae_leinster_hegemony: "レンスターの覇権"
 gae_leinster_hegemony_desc: "ペイルに隣接するレンスターの地——この戦略的要衝における覇権を確立せよ。"
 gae_high_king_of_ireland: "アイルランド高王"
 gae_high_king_of_ireland_desc: "タラの丘に眠る古の称号「アード・リー（高王）」——分裂した時代を超え、この栄誉ある地位を復活させよ。"
 gae_conquer_the_pale: "ペイルの征服"
 gae_conquer_the_pale_desc: "ダブリンを中心とするイングランドの最後の橋頭堡、ペイル——この地をゲール人の手中に収めよ。"
 gae_expel_the_english: "イングランド人の駆逐"
 gae_expel_the_english_desc: "この島に残るイングランドの権威の最後の残滓——これを完全に一掃せよ。"
 gae_master_of_the_emerald_isle: "エメラルドの島の支配者"
 gae_master_of_the_emerald_isle_desc: "高王の座、ペイルの征服、そしてイングランド人の完全な駆逐——アイルランドは、真にゲール人のものとなった。"
 gae_gaelic_fleet: "ゲール人艦隊の建造"
 gae_gaelic_fleet_desc: "海を越えてイングランドへ向かうため——強力な艦隊を建造し、かつての侵略者の本国に狙いを定めよ。"
 gae_invade_wales: "ウェールズへの侵攻"
 gae_invade_wales_desc: "同じケルトの血を引くウェールズの地——この地に上陸し、イングランドへの足がかりとせよ。"
 gae_war_on_england: "対イングランド戦争"
 gae_war_on_england_desc: "歴史を覆す時が来た——かつての侵略者イングランドに対し、正面から戦いを挑め。"
 gae_conquest_of_england: "イングランド征服の完成"
 gae_conquest_of_england_desc: "かつてこの島を蹂躙した者たちの本国——その地が、いまやゲール人の王の支配下にある。歴史は、ここに完全に覆された。"
 gae_events.1.t: "高王の即位"
 gae_events.1.d: "タラの丘にて、古の慣わしに則り、新たなる高王の即位が宣言された。分裂の時代は、ここに終わりを告げる。"
 gae_events.1.a: "高王に栄光あれ！"
 gae_events.2.t: "エメラルドの島の支配者"
 gae_events.2.d: "ペイルの陥落とイングランド人の完全な駆逐によって、この島はついに真にゲール人のものとなった。"
 gae_events.2.a: "アイルランドに栄光あれ！"
 gae_events.99.t: "イングランド征服の完成"
 gae_events.99.d: "かつてこの島を蹂躙したイングランドの本国が、いまやゲール人の王の玉座の前にひれ伏している。歴史は、完全に覆された。"
 gae_events.99.a: "歴史は覆された！"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "ゲール人の巻き返し"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "黒死病が入植地の人口を激減させた今、この地の言葉と習俗は再び野に広がりつつある。"
 STATIC_MODIFIER_NAME_gae_brehon_mod: "ブレホン法の護持"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "ブレホン（法官）の家系が代々伝える判例の記憶が、いかなる成文法よりも民の信頼を集めている。"
 STATIC_MODIFIER_NAME_gae_bards_mod: "フィリと吟遊詩人"
 STATIC_MODIFIER_DESC_gae_bards_mod: "フィリの徒弟たちは今なお、氏族の系譜と武勲を七年の歳月をかけて暗誦で学び続けている。"
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "ガロウグラスの雇用"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "ヘブリディーズ諸島から海を渡ってきた斧持つ戦士たちが、いまや氏族の常備兵力の中核をなしている。"
 STATIC_MODIFIER_NAME_gae_clan_mod: "氏族の統合"
 STATIC_MODIFIER_DESC_gae_clan_mod: "婚姻と盟約によって結ばれた近隣の氏族長たちが、いまや互いの争いよりも共通の敵に目を向けている。"
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "氏族の長"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "タニストリー（氏族継承法）に則って選ばれたこの長のもとに、傍系の一族もまた剣を捧げている。"
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "入植者たちの撃退"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "疫病で数を減らした入植者たちの荘園は、次々と放棄され野に還りつつある。"
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "オストマンの町"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "北欧の血を引くオストマンの子孫たちが営む波止場から、皮革と羊毛を積んだ船が絶えず出港していく。"
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "巻き返しの完成"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "半世紀にわたる後退を経て、イングランドの植民地はいまや沿岸のわずかな地にまで押し戻されている。"
 STATIC_MODIFIER_NAME_gae_ulster_mod: "アルスターの覇権"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "オニール家の名のもとに、北の九つの郡から集められた戦士たちが結集している。"
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "コナートの覇権"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "オコナー家の血を引く者として、西の荒野に住まう氏族たちからの軍役を当然のものとして受けている。"
 STATIC_MODIFIER_NAME_gae_munster_mod: "マンスターの覇権"
 STATIC_MODIFIER_DESC_gae_munster_mod: "デシーズの丘陵からコークの港まで、南の豊かな地から集まる富が国庫を潤している。"
 STATIC_MODIFIER_NAME_gae_leinster_mod: "レンスターの覇権"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "ペイルの柵のすぐ外側まで、いまやゲール人の徴税人が足を踏み入れるようになった。"
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "ペイルの征服"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "ダブリン城の尖塔に掲げられていたイングランドの旗は、いまや降ろされている。"
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "イングランド人の駆逐"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "ヘンリー2世以来続いたこの島への異国の支配は、ついに完全に終わりを告げた。"
 STATIC_MODIFIER_NAME_gae_fleet_mod: "ゲール人艦隊の建造"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "かつて略奪者として恐れられたゲール人の船乗りたちが、いまや正規の艦隊を率いている。"
 STATIC_MODIFIER_NAME_gae_war_england_mod: "対イングランド戦争"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "150年前に彼らがこの島に持ち込んだ戦を、いまや彼ら自身の土地で味わわせている。"
 STATIC_MODIFIER_NAME_gae_high_king_mod: "アイルランド高王"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "ブライアン・ボルー以来途絶えていたアード・リーの座が、タラの丘にて再びその主を迎えた。"
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "エメラルドの島の支配者"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "海岸から海岸まで、この島のいかなる土地にも、もはや異国の役人の姿は見られない。"
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "覆されし歴史"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "かつて征服者を名乗った者たちの王座に、いまやゲール人の王が座している。"
