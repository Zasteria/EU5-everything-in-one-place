l_japanese:
 ple_english_pale_mission_pack: "ザ・ペイル——王権の橋頭堡からアイルランド王国へ"
 ple_english_pale_mission_pack_DESCRIPTION:0 "ダブリンを中心とする狭いイングランド領ペイル——ヒベルノ＝ノルマン諸侯と手を結び、ゲール人の地を征服し、全アイルランドを統べる王国を打ち立てよ。"
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "ペイルを統合し、アイルランド全土を征服して王国を樹立せよ。"
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "小さな橋頭堡から、エメラルドの島全土を統べる王国へ。"
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "「王よりもアイルランド的に」——ペイルの旗を、アイルランド全土に打ち立てよ！"
 ple_english_pale: "イングランド領ペイル"
 ple_english_pale_desc: "ダブリンを中心とする狭い沿岸地帯——ここは、広大なゲール人の海に浮かぶイングランド王権の最後の橋頭堡である。"
 ple_dublin_castle: "ダブリン城の発展"
 ple_dublin_castle_desc: "1204年に築かれたダブリン城——アイルランドにおけるイングランド統治の中枢を、さらに強固なものとせよ。"
 ple_pale_defense: "ペイルの防塁"
 ple_pale_defense_desc: "ゲール人の襲撃からペイルを守る土塁と堀——「ペイルの溝（ザ・ディッチ）」と呼ばれるこの防衛線を強化せよ。"
 ple_lord_deputy: "アイルランド総督"
 ple_lord_deputy_desc: "イングランド王の代理としてアイルランドを統べるアイルランド総督（ロード・デピュティ）——この地位を確固たるものとせよ。"
 ple_anglo_irish_parliament: "アングロ＝アイリッシュ議会"
 ple_anglo_irish_parliament_desc: "ドロエダやダブリンに召集されるアイルランド議会——アングロ＝アイリッシュの諸侯と都市代表からなるこの場を機能させよ。"
 ple_pale_consolidated: "ペイルの統合"
 ple_pale_consolidated_desc: "防塁、総督、法、そして議会——これらすべてを礎に、ペイルの統治を不動のものとせよ。"
 ple_hiberno_norman_lords: "ヒベルノ＝ノルマン諸侯"
 ple_hiberno_norman_lords_desc: "「イングランドよりもイングランド的」と評されたアングロ＝ノルマン系の諸侯たち——彼らとの関係を築け。"
 ple_fitzgerald_kildare: "キルデア伯フィッツジェラルド家"
 ple_fitzgerald_kildare_desc: "「全アイルランドはキルデア伯を統べることはできぬ」——それほどまでに強大なフィッツジェラルド家との関係を築け。"
 ple_butler_ormond: "オーモンド伯バトラー家"
 ple_butler_ormond_desc: "キルデア家の好敵手、オーモンド伯バトラー家——王権への忠誠篤きこの一族との関係を築け。"
 ple_statutes_of_kilkenny: "キルケニー法"
 ple_statutes_of_kilkenny_desc: "1367年に制定されたキルケニー法——イングランド系入植者がゲール化することを禁じるこの法を施行せよ。"
 ple_gaelic_frontier_wars: "ゲール人辺境戦争"
 ple_gaelic_frontier_wars_desc: "ペイルを取り囲むゲール人諸侯——この辺境における絶え間ない戦いに臨め。"
 ple_conquer_leinster: "レンスターの征服"
 ple_conquer_leinster_desc: "ペイルの南に広がるレンスターの地——この地方を我が版図に組み込め。"
 ple_conquer_munster: "マンスターの征服"
 ple_conquer_munster_desc: "デズモンド伯の勢力圏、マンスターの地——この豊かな地方を征服せよ。"
 ple_conquer_connacht: "コナートの征服"
 ple_conquer_connacht_desc: "西の彼方に広がるコナートの地——この辺境を我が手に収めよ。"
 ple_conquer_ulster: "アルスターの征服"
 ple_conquer_ulster_desc: "北の最も頑強なゲール人抵抗の地、アルスター——この地方を征服せよ。"
 ple_master_of_ireland: "アイルランドの支配者"
 ple_master_of_ireland_desc: "レンスター、マンスター、コナート、そしてアルスター——これらすべてを統べ、真のアイルランドの支配者として立て。"
 ple_reformation_choice: "宗教改革の選択"
 ple_reformation_choice_desc: "ルターとカルヴァンの教えが海を越えてやってくる——信仰の岐路に立つ我らは、いかなる道を選ぶべきか。"
 ple_church_of_ireland: "アイルランド国教会"
 ple_church_of_ireland_desc: "イングランド国教会に連なるアイルランド国教会——この新たな信仰を、統治の道具として確立せよ。"
 ple_recusant_catholics: "忌避派カトリック"
 ple_recusant_catholics_desc: "ローマへの忠誠を捨てぬ「忌避派（リキューザント）」——彼らの信仰を、統治の柱として受け入れよ。"
 ple_dublin_university: "ダブリン大学"
 ple_dublin_university_desc: "トリニティ・カレッジに代表されるダブリンの学問の府——この地を、学芸の中心地として発展させよ。"
 ple_english_crown_relations: "イングランド王室との関係"
 ple_english_crown_relations_desc: "海の向こうのイングランド王室——この宗主国との関係を、我が国の未来を左右するものとして見極めよ。"
 ple_kingdom_of_ireland: "アイルランド王国の樹立"
 ple_kingdom_of_ireland_desc: "ペイルの小さな橋頭堡から始まった道のりは、全アイルランドを統べる王国としてここに実を結ぶ——だが、この新たな王国が進むべき道は、まだ定まっていない。"
 ple_events.99.t: "アイルランド王国の宣言"
 ple_events.99.d: "ダブリンの小さな橋頭堡から始まった長き歴史は、全アイルランドを統べる王国として、ここに新たな時代を迎える。"
 ple_events.99.a: "アイルランドに栄光あれ！"
 ple_defy_the_crown: "王権への反抗"
 ple_defy_the_crown_desc: "アイルランド王国はもはやイングランドの従僕にあらず——この対立を、真の主権を求める第一歩とせよ。"
 ple_war_of_irish_independence: "アイルランド独立戦争"
 ple_war_of_irish_independence_desc: "海の向こうの王権との、避けられぬ戦い——この独立戦争に勝利し、鎖を断ち切れ。"
 ple_sovereign_kingdom_of_ireland: "主権国家アイルランド"
 ple_sovereign_kingdom_of_ireland_desc: "もはやいかなる王権にも従わぬ、真に独立したアイルランド王国——エメラルドの島は、ついに自らの運命の主となった。"
 ple_loyal_crown_partnership: "王権との協調"
 ple_loyal_crown_partnership_desc: "対立ではなく協調を——アイルランド王国は、イングランド王室との対等な同盟関係を選び取る。"
 ple_anglo_irish_union: "英愛連合"
 ple_anglo_irish_union_desc: "婚姻、あるいは緊密な政治的結びつきを通じ、二つの王国はより深い連合へと歩みを進める。"
 ple_united_kingdoms: "連合王国の一翼として"
 ple_united_kingdoms_desc: "対立ではなく協調の道を選んだアイルランド王国は、イングランドと肩を並べる連合の一翼として、共に繁栄の時代を築く。"
 STATIC_MODIFIER_NAME_ple_pale_mod: "イングランド領ペイル"
 STATIC_MODIFIER_DESC_ple_pale_mod: "ヘンリー2世以来、この地はイングランド王権が大陸の外に持つ唯一の足場であり続けている。"
 STATIC_MODIFIER_NAME_ple_dublin_mod: "ダブリン城の発展"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "ヴァイキングの築いた古き港市は、いまやアイルランドにおける統治と商いの中心地として賑わっている。"
 STATIC_MODIFIER_NAME_ple_defense_mod: "ペイルの防塁"
 STATIC_MODIFIER_DESC_ple_defense_mod: "土塁と堀が巡らされた「ザ・ディッチ」の内側では、ゲール人の急襲を恐れることなく畑を耕せるようになった。"
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "アイルランド総督"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "海の向こうの王に代わりダブリン城に座す総督の名は、諸侯の間でも重んじられている。"
 STATIC_MODIFIER_NAME_ple_parliament_mod: "アングロ＝アイリッシュ議会"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "城壁の内側に集う都市代表たちの声が、以前よりも統治の場に届くようになった。"
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "ペイルの統合"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "ダブリンはもはや異郷の飛び地ではなく、正真正銘この王家の中核地として台帳に記されている。"
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "ヒベルノ＝ノルマン諸侯"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "城砦に暮らすノルマン系の諸侯たちは、もはや「イングランドよりもイングランド的」と評されるほど土地に根を張っている。"
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "キルケニー法"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "1367年に定められたこの法令は、入植者がゲール語やアイルランド式の習俗に染まることを固く禁じている。"
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "ゲール人辺境戦争"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "ペイルの柵を越えた先で幾度となく刃を交えた経験が、兵たちを辺境の戦いに慣れさせている。"
 STATIC_MODIFIER_NAME_ple_leinster_mod: "レンスターの征服"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "ペイルに隣接するレンスターの穀倉地帯が、いまや王家の徴税台帳に組み込まれている。"
 STATIC_MODIFIER_NAME_ple_munster_mod: "マンスターの征服"
 STATIC_MODIFIER_DESC_ple_munster_mod: "デズモンド伯の旧領マンスターの港からは、羊毛と皮革を積んだ船が絶えず出港していく。"
 STATIC_MODIFIER_NAME_ple_connacht_mod: "コナートの征服"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "西の荒野コナートの氏族たちも、いまや王家の召集に応じて兵を差し出すようになった。"
 STATIC_MODIFIER_NAME_ple_ulster_mod: "アルスターの征服"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "オニール家やオドネル家が長く支配してきた北の頑強な地も、ついに王旗の下に服した。"
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "アイルランドの支配者"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "レンスターからアルスターまで、エメラルドの島の全土がいまや一つの旗のもとにある。"
 STATIC_MODIFIER_NAME_ple_reformation_mod: "宗教改革の選択"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "海を越えて届いたルターとカルヴァンの教えが、この島の教会にも静かな波紋を広げている。"
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "アイルランド国教会"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "カンタベリーに連なる新たな国教会の礼拝堂で、英語の聖書が読み上げられている。"
 STATIC_MODIFIER_NAME_ple_recusant_mod: "忌避派カトリック"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "「忌避派」と呼ばれる者たちは罰金を科されながらも、ひそかにローマへの祈りを絶やさずにいる。"
 STATIC_MODIFIER_NAME_ple_university_mod: "ダブリン大学"
 STATIC_MODIFIER_DESC_ple_university_mod: "トリニティ・カレッジの回廊に、新たな時代の学徒たちの足音が響いている。"
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "イングランド王室との関係"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "海の向こうの宮廷から届く書簡の一枚一枚が、この王国の行く末を静かに左右している。"
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "アイルランド王国の樹立"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "ダブリン城の玉座の間に、新たに戴冠したアイルランド王の姿がある。"
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "王権への反抗"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "海の向こうへの忠誠を捨てた者たちの間に、抑えきれぬ高揚が広がっている。"
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "アイルランド独立戦争"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "海を越えてきた王権の軍と幾度も刃を交えた経験が、この島の兵たちを歴戦の戦術家へと鍛え上げている。"
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "主権国家アイルランド"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "いかなる王権にも仕えぬ、真に自由なアイルランドの旗が、いまダブリン城の尖塔に翻っている。各地に派遣された総督たちが、独立国家としての統治網を築き上げている。"
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "王権との協調"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "対立ではなく信頼を選んだ両王家の使者たちが、いまも頻繁に海を行き来している。"
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "英愛連合"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "海の向こうの宮廷に仕える使節たちの働きにより、二つの王冠は以前にも増して固く結ばれている。"
