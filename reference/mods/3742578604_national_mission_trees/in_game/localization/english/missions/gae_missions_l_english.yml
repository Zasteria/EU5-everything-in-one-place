l_english:
 gae_gaelic_ireland_mission_pack: "The Gaelic Irish Counterstrike"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "English rule falters amid plague and the Bruce invasion — as a Gaelic chieftain, lead the resurgence, claim the throne of the High King to unite Ireland, and at last cross the sea to conquer England itself."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Unify the clan, become High King over all Ireland, and conquer England."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "From a divided clan to a High King who conquers England."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "Raise the Gaelic banner over the Emerald Isle — and across the sea as well!"
 gae_gaelic_resurgence: "The Gaelic Resurgence"
 gae_gaelic_resurgence_desc: "Amid the chaos of the Black Death and the Bruce invasion, English colonial rule falters — the age of the Gaelic lords is returning to this isle once more."
 gae_brehon_law: "Uphold the Brehon Law"
 gae_brehon_law_desc: "The Brehon Law, a legal tradition beholden to neither Roman nor English custom — preserve this ancient system as the foundation of governance."
 gae_fili_and_bards: "The Filí and the Bards"
 gae_fili_and_bards_desc: "The filí, learned poets who preserve the history and lineage of the clan — patronize their art, and let the honor of the clan be sung for generations."
 gae_gallowglass_recruitment: "Recruit the Gallowglass"
 gae_gallowglass_recruitment_desc: "Formidable warriors from the Scottish isles — welcome these 'gallowglass' into your ranks, and strengthen the might of the clan."
 gae_clan_unification: "Unify the Clan"
 gae_clan_unification_desc: "Divided cadet branches and contested lands — bring these together as one, and establish your authority as chieftain."
 gae_lord_of_the_clan: "Lord of the Clan"
 gae_lord_of_the_clan_desc: "Law, poetry, arms, and a unified bloodline — build upon all of these, and stand as the true lord of the clan."
 gae_rout_the_settlers: "Rout the Settlers"
 gae_rout_the_settlers_desc: "The English settlers, their numbers thinned by plague — seize this opportunity, and drive them from this land."
 gae_ostmen_towns: "The Towns of the Ostmen"
 gae_ostmen_towns_desc: "Port towns founded long ago by the descendants of the Vikings, the Ostmen — seize cities such as Dublin and Waterford."
 gae_resurgence_triumphant: "The Resurgence Triumphant"
 gae_resurgence_triumphant_desc: "The rout of the settlers, the reclamation of the marches, and the seizure of the Ostmen towns — the Gaelic resurgence here reaches its first triumph."
 gae_ulster_hegemony: "Hegemony over Ulster"
 gae_ulster_hegemony_desc: "Ulster, the northern land of the O'Neills and O'Donnells — establish hegemony over this region."
 gae_connaught_hegemony: "Hegemony over Connaught"
 gae_connaught_hegemony_desc: "Connaught, the wild land of the west — as heir to the glory of the O'Connors, rule over this region."
 gae_munster_hegemony: "Hegemony over Munster"
 gae_munster_hegemony_desc: "Munster in the south, land of the MacCarthys and O'Briens — seize hegemony over this rich region."
 gae_leinster_hegemony: "Hegemony over Leinster"
 gae_leinster_hegemony_desc: "Leinster, bordering the Pale itself — establish hegemony over this strategically vital region."
 gae_high_king_of_ireland: "High King of Ireland"
 gae_high_king_of_ireland_desc: "The ancient title of Ard Rí, High King, sleeping upon the Hill of Tara — transcend the age of division, and revive this most honored rank."
 gae_conquer_the_pale: "Conquer the Pale"
 gae_conquer_the_pale_desc: "The Pale, England's last bridgehead centered on Dublin — bring this land into Gaelic hands."
 gae_expel_the_english: "Expel the English"
 gae_expel_the_english_desc: "The last remnants of English authority clinging to this isle — sweep them away entirely."
 gae_master_of_the_emerald_isle: "Master of the Emerald Isle"
 gae_master_of_the_emerald_isle_desc: "The throne of the High King, the conquest of the Pale, and the complete expulsion of the English — Ireland has truly become Gaelic once more."
 gae_gaelic_fleet: "Build a Gaelic Fleet"
 gae_gaelic_fleet_desc: "To cross the sea toward England itself — build a mighty fleet, and set your sights on the homeland of the former invaders."
 gae_invade_wales: "Invade Wales"
 gae_invade_wales_desc: "Wales, land of fellow Celtic blood — land upon these shores, and secure a foothold toward England."
 gae_war_on_england: "War against England"
 gae_war_on_england_desc: "The time has come to overturn history — challenge England, the former invader, head-on."
 gae_conquest_of_england: "The Conquest of England Complete"
 gae_conquest_of_england_desc: "The homeland of those who once trampled this isle — that very land now lies beneath the rule of a Gaelic king. History has here been utterly overturned."
 gae_events.1.t: "The High King Enthroned"
 gae_events.1.d: "Upon the Hill of Tara, in accordance with ancient custom, a new High King has been proclaimed. The age of division comes here to an end."
 gae_events.1.a: "Glory to the High King!"
 gae_events.2.t: "Master of the Emerald Isle"
 gae_events.2.d: "With the fall of the Pale and the complete expulsion of the English, this isle has at last become truly Gaelic once more."
 gae_events.2.a: "Glory to Ireland!"
 gae_events.99.t: "The Conquest of England Complete"
 gae_events.99.d: "The homeland of England, which once trampled this isle, now kneels before the throne of a Gaelic king. History has been utterly overturned."
 gae_events.99.a: "History is overturned!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "The Gaelic Resurgence"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "With plague having thinned the settler population, the tongue and customs of this land spread once more across the countryside."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "The Brehon Law Upheld"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "The memory of precedent passed down through generations of brehon lawgivers commands more trust than any written code."
 STATIC_MODIFIER_NAME_gae_bards_mod: "The Filí and the Bards"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Apprentice filí still spend seven years committing the clan's lineage and deeds to memory."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "The Gallowglass Recruited"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Axe-bearing warriors who crossed the sea from the Hebrides now form the core of the clan's standing strength."
 STATIC_MODIFIER_NAME_gae_clan_mod: "The Clan Unified"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Neighboring chieftains, bound by marriage and pact, now look past old feuds toward a common foe."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Lord of the Clan"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Chosen under the ancient custom of tanistry, this chieftain now commands the swords of every cadet branch."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "The Settlers Routed"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "The manors of settlers thinned by plague stand abandoned, one after another returning to the wild."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "The Ostmen Towns"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "From the wharves worked by descendants of Norse blood, ships laden with hide and wool sail forth without end."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "The Resurgence Triumphant"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "After half a century of retreat, the English colony has been pushed back to a mere strip of coastline."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Hegemony over Ulster"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "Under the O'Neill name, warriors gathered from the nine counties of the north now stand assembled."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Hegemony over Connaught"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "As heir to the O'Connor blood, the levies of the clans dwelling in the western wilds are taken as a matter of course."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Hegemony over Munster"
 STATIC_MODIFIER_DESC_gae_munster_mod: "From the hills of the Decies to the port of Cork, the wealth of the rich south fills the treasury."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Hegemony over Leinster"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Gaelic tax collectors now walk right up to the very ditch of the Pale itself."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "The Pale Conquered"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "The English banner that once flew from the spires of Dublin Castle has at last been lowered."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "The English Expelled"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "The foreign dominion over this isle, begun in the days of Henry II, has at last come to a complete end."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "The Gaelic Fleet Built"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Gaelic seafarers, once feared only as raiders, now command a proper fleet of their own."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "War against England"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "The war they brought to this isle a century and a half ago is now visited upon their own soil."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "High King of Ireland"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "The seat of Ard Rí, vacant since the days of Brian Boru, has once more found its master upon the Hill of Tara."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Master of the Emerald Isle"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "From coast to coast, no foreign official remains anywhere upon this isle."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "History Overturned"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "Upon the throne once claimed by self-styled conquerors, a Gaelic king now sits."
