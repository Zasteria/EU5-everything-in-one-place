l_japanese:
 hol_holland_mission_pack: "真の自由——ホラント伯国から連邦共和国へ"
 hol_holland_mission_pack_DESCRIPTION:0 "ヴィッテルスバッハ家に治められるホラント伯国——ハンザ同盟との角逐に打ち勝ち、スペインの圧政から独立を勝ち取り、君主を持たぬ真の共和国として黄金時代を築け。"
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "伯国を統一し、独立を勝ち取り、州議会主権の共和国として黄金時代を実現せよ。"
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "小さな伯国から、商業と自由に満ちた連邦共和国へ。"
 hol_holland_mission_pack_BUTTON_DETAILS:0 "「団結は力なり」——君主を持たぬ真の共和国を、低地諸国に打ち立てよ！"
 hol_county_of_holland: "ホラント伯国"
 hol_county_of_holland_desc: "低地諸国の中枢に位置する、水運と交易に恵まれたホラント伯国——アヴェーヌ家の老伯ウィレム3世が、その治世の終わりを迎えようとしている。"
 hol_secure_dordrecht: "ドルドレヒトの発展"
 hol_secure_dordrecht_desc: "ライン川とマース川の合流点に位置する古き交易都市ドルドレヒト——この地に与えられた「停泊権」を礎に、さらなる発展をもたらせ。"
 hol_hoekse_kabeljauwse: "フック派とカベリャウ派"
 hol_hoekse_kabeljauwse_desc: "貴族派（フック）と都市派（カベリャウ）——伯位継承を巡り伯国を二分するこの内紛を鎮め、安定した統治を打ち立てよ。"
 hol_zeeland_unification: "ゼーラント統合"
 hol_zeeland_unification_desc: "北海に浮かぶ島々からなるゼーラントの地——この地を伯国の版図に組み込め。"
 hol_frisian_freedom: "西フリースラントの自由"
 hol_frisian_freedom_desc: "自治を重んじる西フリースラントの民——彼らに、伯国の旗の下での自由を与えよ。"
 hol_utrecht_relations: "ユトレヒト司教領との関係"
 hol_utrecht_relations_desc: "広大な世俗権力を有するユトレヒト司教領——この隣国との関係を、我が影響下に置くべく築け。"
 hol_wittelsbach_inheritance: "エノーとの合同"
 hol_wittelsbach_inheritance_desc: "皇帝ルートヴィヒ4世に嫁いだ王女マルガレーテを通じ、隣接するエノー伯国との結びつきを深めよ——婚姻、服属、あるいはその断絶を通じ、ホラント・ゼーラント・エノーを一つの旗のもとに統べよ。"
 hol_herring_industry: "ニシン漁業の発展"
 hol_herring_industry_desc: "「大いなる漁業（グローテ・フィッセライ）」と呼ばれるニシン漁——塩漬け技術と共に、この一大産業をさらに発展させよ。"
 hol_hansa_rivalry: "ハンザ同盟との角逐"
 hol_hansa_rivalry_desc: "バルト海交易を牛耳るハンザ同盟——安価な運賃と効率的な商船を武器に、この老舗同盟との角逐に打ち勝て。"
 hol_amsterdam_rise: "アムステルダムの興隆"
 hol_amsterdam_rise_desc: "アイ湾に面する小さな漁村アムステルダム——この地を、北海交易の一大拠点へと発展させよ。"
 hol_moedernegotie: "母なる交易（モーデルネゴティ）"
 hol_moedernegotie_desc: "バルト海の穀物交易——「あらゆる交易の母」と称されるこの交易を掌握し、繁栄の礎とせよ。"
 hol_contest_brabant: "ブラバントへの野心"
 hol_contest_brabant_desc: "低地諸国のもう一つの雄、ブラバント公国——この地への野心の目を向けよ。"
 hol_absorb_brabant: "ブラバントの併合"
 hol_absorb_brabant_desc: "ブラバント公国を併合、あるいは服属させよ——ホラントこそが低地諸国の主であると知らしめよ。"
 hol_reformation_choice: "宗教改革の選択"
 hol_reformation_choice_desc: "ルターとカルヴァンの教えが低地諸国を揺るがす——信仰の岐路に立つ我らは、いかなる道を選ぶべきか。"
 hol_calvinist_merchants: "カルヴァン派商人"
 hol_calvinist_merchants_desc: "質実剛健な信仰を説くカルヴァン派——商都に生きる市民たちの心を捉えたこの教えを、国教として受け入れよ。"
 hol_spanish_tyranny: "スペインの圧政"
 hol_spanish_tyranny_desc: "フェリペ2世とアルバ公による重税と異端審問——この圧政に対する民の怒りは、もはや抑えられない。"
 hol_union_of_utrecht: "ユトレヒト同盟"
 hol_union_of_utrecht_desc: "低地諸国北部の諸州が結んだユトレヒト同盟——この盟約の中核として、共通の敵に立ち向かえ。"
 hol_watergeuzen: "海乞食団（ワーテルヘーゼン）"
 hol_watergeuzen_desc: "「海の乞食」を自称する私掠船団——彼らの活躍が、スペインの海上支配に風穴を開ける。"
 hol_dutch_republic_proper: "連邦共和国の樹立"
 hol_dutch_republic_proper_desc: "七つの州が対等な立場で結ぶ連邦——君主を持たぬ、商人と市民による真の共和国をここに打ち立てよ。"
 hol_east_india_company: "東インド会社の設立"
 hol_east_india_company_desc: "アジア交易の独占を目指し、連合東インド会社（VOC）を設立せよ。"
 hol_amsterdam_bank: "アムステルダム為替銀行"
 hol_amsterdam_bank_desc: "乱立する貨幣の混乱を正すため、為替銀行（ヴィッセルバンク）を設立し、安定した信用制度を築け。"
 hol_stock_exchange: "アムステルダム証券取引所"
 hol_stock_exchange_desc: "世界初の証券取引所——株式の売買が行われるこの場を、ヨーロッパ金融の中心地とせよ。"
 hol_dutch_golden_age: "オランダ黄金時代"
 hol_dutch_golden_age_desc: "レンブラント、フェルメール、そして繁栄する商業——「オランダ黄金時代」の絶頂を極めよ。"
 hol_estates_of_holland: "ホラント州議会"
 hol_estates_of_holland_desc: "都市代表からなるホラント州議会——この議会を、共和国統治の中核として機能させよ。"
 hol_regent_oligarchy: "レヘントの寡頭制"
 hol_regent_oligarchy_desc: "富裕な商人門閥「レヘント」たち——彼らによる寡頭統治を、共和国の実質的な支配体制として確立せよ。"
 hol_stadtholderless_era: "無総督時代（真の自由）"
 hol_stadtholderless_era_desc: "総督を戴かず、州議会が主権を握るこの時代——ヨハン・デ・ウィットの唱えた「真の自由」を体現せよ。"
 hol_states_sovereignty: "州議会主権の確立"
 hol_states_sovereignty_desc: "君主を持たぬ共和国——その主権のあり方を、恒久の制度として確立せよ。"
 hol_anglo_dutch_rivalry: "英蘭の角逐"
 hol_anglo_dutch_rivalry_desc: "海上交易の覇権を巡るイングランドとの対立——航海法に象徴されるこの角逐に立ち向かえ。"
 hol_navigation_act_response: "航海法への対抗"
 hol_navigation_act_response_desc: "イングランドの航海法——この保護主義的な法に対抗し、我が交易船団を守り抜け。"
 hol_channel_trade_dominance: "海峡交易の覇権"
 hol_channel_trade_dominance_desc: "北海と大西洋を結ぶ海峡——この要衝における交易と海軍の優位を確立せよ。"
 hol_french_relations: "フランスとの関係"
 hol_french_relations_desc: "太陽王ルイ14世の野心——この強大な隣国との関係に、細心の注意を払え。"
 hol_rampjaar_survival: "災厄の年（ランプヤール）の生存"
 hol_rampjaar_survival_desc: "1672年、英仏の同時侵攻に見舞われた「災厄の年」——この国家存亡の危機を耐え抜け。"
 hol_glorious_revolution: "太陽王への勝利"
 hol_glorious_revolution_desc: "災厄の年を耐え抜いた共和国は、いまや反攻に転じる——フランス本土深くまで軍を進め、太陽王ルイ14世にその野心の代償を払わせよ。"
 hol_united_provinces: "ネーデルラント連邦共和国"
 hol_united_provinces_desc: "伯国の礎から、独立戦争、そして黄金時代を経て、真の共和国がここに完成する。"
 hol_events.1.t: "八十年戦争の開始"
 hol_events.1.d: "ユトレヒト同盟と海乞食団の活躍によって、スペインとの長き戦いの火蓋が切られた。この戦いこそ、我らの独立を決定づけるものとなるだろう。"
 hol_events.1.a: "自由か、死か！"
 hol_events.2.t: "ネーデルラント連邦共和国の宣言"
 hol_events.2.d: "七つの州が対等な立場で結ぶ連邦——君主を持たぬ、商人と市民による真の共和国が、ここに産声を上げた。"
 hol_events.2.a: "共和国に栄光あれ！"
 hol_events.3.t: "災厄の年（ランプヤール）"
 hol_events.3.d: "1672年——フランス、イングランド、ミュンスター、ケルンによる同時侵攻。「国民は非理性的、政府は無能、国家は絶望的」と評されたこの危機を、我らは耐え抜いた。"
 hol_events.3.a: "共和国は生き延びた！"
 hol_events.4.t: "太陽王への勝利"
 hol_events.4.d: "フランス本土深くにまで軍を進めた我が軍は、ついにルイ14世の野心を打ち砕いた。共和国の名は、これよりヨーロッパの列強として広く知れ渡るだろう。"
 hol_events.4.a: "共和国に栄光あれ！"
 hol_events.5.t: "ホラント州議会の岐路"
 hol_events.5.d: "共和国の統治形態を巡り、州議会は重大な選択を迫られている——総督を戴く君主的な色合いを強めるか、あるいは市民と商人による真の共和政を貫くか。"
 hol_events.5.a: "総督家に権威を集中させる"
 hol_events.5.b: "州議会主権による共和政を貫く"
 hol_events.99.t: "ネーデルラント連邦共和国の完成"
 hol_events.99.d: "ホラント伯国から始まった長き道のりは、独立戦争と黄金時代を経て、ここに真の共和国として完成した。"
 hol_events.99.a: "連邦共和国、永遠なれ！"
 STATIC_MODIFIER_NAME_hol_county_mod: "ホラント伯国"
 STATIC_MODIFIER_DESC_hol_county_mod: "水運と交易に育まれた伯国の記憶が、今なお民の誇りとして息づいている。"
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "ドルドレヒトの発展"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "ライン川とマース川の合流点で、停泊権を握るドルドレヒトの商船が絶えず荷を積み下ろししている。"
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "フック派とカベリャウ派"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "フックとカベリャウの旗を掲げた者たちも、今は共に伯の軍列に加わっている。"
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "ゼーラント統合"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "ミデルブルフの造船台では、島々から集められた木材が次々と船体へと姿を変えていく。"
 STATIC_MODIFIER_NAME_hol_frisian_mod: "西フリースラントの自由"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "「フリースラント人に主君なし」——その誇り高き自治の気風が、いざという時に多くの民を戦列へと導く。"
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "ユトレヒト司教領との関係"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "ユトレヒトの鐘楼から響く鐘の音が、伯国と司教領の穏やかな隣人関係を告げている。"
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "エノーとの合同"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "バイエルンから連なる新たな支配の系譜が、ホラント・ゼーラント・エノーの地に秩序をもたらしている。"
 STATIC_MODIFIER_NAME_hol_contest_brabant_mod: "ブラバントへの野心"
 STATIC_MODIFIER_DESC_hol_contest_brabant_mod: "南方の隣国への野心が、諸都市の徴税役人たちを俄然勢いづかせている。"
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "ブラバントの併合"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "ブリュッセルの宮廷にもホラントの紋章が掲げられ、南方の富がアムステルダムへと流れ込んでいる。"
 STATIC_MODIFIER_NAME_hol_herring_mod: "ニシン漁業の発展"
 STATIC_MODIFIER_DESC_hol_herring_mod: "塩漬けニシンを満載した漁船団が、北海の波間を縫って次々と港へ帰ってくる。"
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "ハンザ同盟との角逐"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "リューベックの商人たちが眉をひそめる中、我らの安価な運賃がバルト海の荷主たちの心を掴んでいる。"
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "アムステルダムの興隆"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "アイ湾の小さな漁村だったアムステルダムに、今や世界中の帆船が集う。"
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "母なる交易"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "バルト海から運ばれる穀物が、飢饉の年にも我が国の食卓と国庫を支え続ける。"
 STATIC_MODIFIER_NAME_hol_reformation_mod: "宗教改革の選択"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "教会の鐘の音に混じり、市井では新旧の信仰を巡る静かな議論が絶えない。"
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "カルヴァン派商人"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "聖書を自ら読み解こうとする商人たちの家々に、灯りが夜更けまで灯り続けている。"
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "ユトレヒト同盟"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "ユトレヒトで交わされた盟約の文書は、いまや北方諸州すべての希望の拠り所となっている。"
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "海乞食団"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "「王よりも乞食であれ」——その合言葉を胸に、海の男たちは今日もスペインの旗を狙っている。"
 STATIC_MODIFIER_NAME_hol_voc_mod: "東インド会社"
 STATIC_MODIFIER_DESC_hol_voc_mod: "バタヴィアから届く香辛料の香りが、アムステルダムの倉庫街に満ちている。"
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "アムステルダム為替銀行"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "為替銀行の金庫に眠る信用こそが、この都市の商人たちの何よりの後ろ盾である。"
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "為替銀行を擁する帝都"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "国庫の帳簿と為替銀行の金庫が同じ屋根の下にあることが、国政の運営を一段と円滑にしている。"
 STATIC_MODIFIER_NAME_hol_exchange_mod: "アムステルダム証券取引所"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "取引所の広場では、株券を手にした仲買人たちの怒号が絶えることなく響いている。"
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "オランダ黄金時代"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "レンブラントの筆が捉える光と影が、この繁栄の時代を後世に語り継ぐだろう。"
 STATIC_MODIFIER_NAME_hol_regent_mod: "レヘントの寡頭制"
 STATIC_MODIFIER_DESC_hol_regent_mod: "富裕な門閥の当主たちが交わす密やかな会合こそが、この共和国の真の意思決定の場である。"
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "無総督時代"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "総督の座は空いたまま——それでも国政は、これまで以上に滑らかに動いている。"
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "英蘭の角逐"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "海峡を挟んだ好敵手との度重なる砲火の応酬が、我が水兵たちを歴戦の勇士へと鍛え上げた。"
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "航海法への対抗"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "イングランドの法令をものともせず、我が商船隊は今日も抜け道を見つけて航路を切り開いている。"
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "海峡交易の覇権"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "北海と大西洋を結ぶ狭い水路に、我が国旗を掲げた船以外の姿を見ることは稀となった。"
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "フランスとの関係"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "太陽王の宮廷から漂う不穏な噂に、国境の守備隊は絶えず気を引き締めている。"
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "ネーデルラント連邦共和国"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "君主を持たぬ七つの州の団結が、世界中の海と市場にその名を轟かせている。"
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "災厄の年の生存"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "「国民は非理性的、政府は無能、国家は絶望的」——その汚名を撥ね退けた記憶が、今も兵たちの誇りとなっている。"
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "太陽王への勝利"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "フランス本土深くまで進軍したという武勇伝が、いまや共和国の誇りとしてヨーロッパ中に語り継がれている。"
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "連邦共和国の宣言"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "君主のいない議事堂に、市民と商人の代表たちが誇らしげに集っている。"
