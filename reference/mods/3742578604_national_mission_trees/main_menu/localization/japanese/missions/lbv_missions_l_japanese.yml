l_japanese:
 lbv_niederbayern_mission_pack: "ランツフート家の遺産——バイエルン再統一への道"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "低地諸国にまで及んだアルブレヒト1世の遺産を継ぐランツフート家として、分裂したバイエルンを再び一つに統べよ。"
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "ランツフートを発展させ、バイエルンを再統一せよ。"
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "ランツフートを発展させ、バイエルンを再統一せよ。"
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "全バイエルンの公として立て！"
 lbv_straubing_holland_legacy: "シュトラウビング＝ホラントの遺産"
 lbv_straubing_holland_legacy_desc: "低地諸国にまで及んだアルブレヒト1世の遺産——ランツフート家として、この広大な相続領の記憶を受け継げ。"
 lbv_secure_landshut: "ランツフートの発展"
 lbv_secure_landshut_desc: "イーザル川上流の都ランツフート——ゴシック様式の壮麗な建築が並ぶこの都を、公領の中心として発展させよ。"
 lbv_danube_trade: "ドナウ交易"
 lbv_danube_trade_desc: "ドナウ川を行き交う商船——この水運の要衝を活かし、交易による富を確保せよ。"
 lbv_low_countries_ties: "低地諸国との結びつき"
 lbv_low_countries_ties_desc: "ホラント・ゼーラント・エノーを治めたアルブレヒト1世の遺産——低地諸国との結びつきを、今なお大切に育め。"
 lbv_bavarian_ambition: "バイエルン統一への野心"
 lbv_bavarian_ambition_desc: "ランツフートの発展、ドナウ交易、低地諸国との結びつき、そしてインゴルシュタットとの角逐——これらを礎に、バイエルン全土への野心を抱け。"
 lbv_reunite_bavaria: "バイエルンの再統合"
 lbv_reunite_bavaria_desc: "分裂した公領——オーバーバイエルンの地を我が手に取り戻し、バイエルンを再び一つに統べよ。"
 lbv_duke_of_all_bavaria: "全バイエルンの公"
 lbv_duke_of_all_bavaria_desc: "ランツフート家の血脈のもと、バイエルン全土がついに一つの旗のもとに統べられる。"
 lbv_events.1.t: "バイエルン統一の宣言"
 lbv_events.1.d: "ランツフート家の血脈のもと、バイエルンはついに一つに統べられた。分裂の時代は終わりを告げる。"
 lbv_events.1.a: "バイエルンに栄光あれ！"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "シュトラウビング＝ホラントの遺産"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "低地諸国にまで及んだ遺産の記憶が、国家に威信をもたらしている。"
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "ランツフートの発展"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "ゴシック建築の都が、公領の中心として繁栄している。"
 STATIC_MODIFIER_NAME_lbv_danube_mod: "ドナウ交易"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "ドナウ川の水運が、国庫に富をもたらしている。"
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "低地諸国との結びつき"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "低地諸国との縁が、外交上の威信を高めている。"
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "バイエルンの再統合"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "再統合された公領が、統合速度を高めている。"
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "全バイエルンの公"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "統一の完成が、国家の威信を高めた。"
 lbv_unified_duchy: "統一バイエルン公国"
 lbv_unified_duchy_desc: "分裂の時代は終わった——統一されたバイエルン公国として、新たな時代を切り開け。"
 lbv_landrecht: "バイエルン法典"
 lbv_landrecht_desc: "統一された公領に、統一された法を——バイエルン国法典（ラントレヒト）を制定し、統治の基盤を固めよ。"
 lbv_tyrol_ambition: "チロルへの野心"
 lbv_tyrol_ambition_desc: "アルプスの山々に抱かれたチロル伯領——この地への野心を抱け。"
 lbv_swabian_expansion: "シュヴァーベンへの進出"
 lbv_swabian_expansion_desc: "南西に広がるシュヴァーベンの地——この地方への影響力を強めよ。"
 lbv_greater_bavaria: "大バイエルンの実現"
 lbv_greater_bavaria_desc: "法典、等族会議、チロル、シュヴァーベン——これらを礎に、より大きなバイエルンを実現せよ。"
 lbv_counter_reformation_leader: "対抗宗教改革の旗手"
 lbv_counter_reformation_leader_desc: "トリエント公会議の精神を体現し、対抗宗教改革の先頭に立て。"
 lbv_electoral_dignity: "選帝侯の尊厳"
 lbv_electoral_dignity_desc: "1623年、マクシミリアン1世がついに選帝侯の地位を獲得する——この栄誉を、バイエルンの永遠の誇りとせよ。"
 lbv_austrian_rivalry: "オーストリアとの対抗"
 lbv_austrian_rivalry_desc: "帝国内の覇権を巡るハプスブルク家との対抗——この好敵手との角逐に臨め。"
 lbv_war_of_austrian_succession: "オーストリア継承戦争"
 lbv_war_of_austrian_succession_desc: "カール7世の帝位主張を巡る戦い——この継承戦争に乗じ、バイエルンの威信を高めよ。"
 lbv_imperial_crown: "帝冠の戴冠"
 lbv_imperial_crown_desc: "1742年、バイエルン公カール7世が神聖ローマ皇帝として戴冠する——ハプスブルク家以外による、実に数世紀ぶりの帝冠である。"
 lbv_enlightened_absolutism: "啓蒙専制主義"
 lbv_enlightened_absolutism_desc: "理性と学問を重んじる啓蒙の時代——この新たな思潮を、バイエルンの統治に取り入れよ。"
 lbv_napoleonic_alliance: "フランスへの対抗"
 lbv_napoleonic_alliance_desc: "革命とナポレオンの野心によって揺さぶられるヨーロッパ——バイエルンは、この強大な隣国に対する王位継承権を確保し、独自の道を切り開く。"
 lbv_kingdom_of_bavaria: "バイエルン王国の樹立"
 lbv_kingdom_of_bavaria_desc: "1806年、選帝侯マクシミリアン4世ヨーゼフはバイエルン王国の王を宣言する——ヴィッテルスバッハ家の長き歴史は、ここに新たな頂点を迎える。"
 lbv_events.2.t: "三十年戦争への参戦"
 lbv_events.2.d: "帝国全土を巻き込む未曾有の大戦——バイエルンは、カトリックの大義のためにこの戦いに身を投じる。"
 lbv_events.2.a: "神とカトリックの大義のために！"
 lbv_events.3.t: "帝冠の戴冠"
 lbv_events.3.d: "1742年、バイエルン公カール7世が、フランクフルトの聖堂にて神聖ローマ皇帝として戴冠した。ハプスブルク家以外の者が帝冠を戴くのは、実に数世紀ぶりのことである。"
 lbv_events.3.a: "皇帝陛下に栄光あれ！"
 lbv_events.99.t: "バイエルン王国の宣言"
 lbv_events.99.d: "1806年、選帝侯マクシミリアン4世ヨーゼフは、ライン同盟のもとバイエルン王国の王を宣言した。ヴィッテルスバッハ家の長き歴史は、ここに新たな頂点を迎える。"
 lbv_events.99.a: "バイエルン王国、永遠なれ！"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "統一バイエルン公国"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "統一の記憶が、国家に威信と規律をもたらしている。"
 STATIC_MODIFIER_NAME_lbv_greater_mod: "大バイエルンの実現"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "拡大した公国が、国威を高めている。"
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "対抗宗教改革の旗手"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "改宗運動の推進が、布教速度を高めている。"
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "オーストリア継承戦争"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "継承戦争の経験が、戦果を高めている。"
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "帝冠の戴冠"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "帝冠を戴いた記憶が、国家の威信と外交上の評価を大きく高めた。"
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "啓蒙専制主義"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "啓蒙思潮の導入が、識字率の向上をもたらしている。"
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "選帝侯の尊厳"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "選帝侯の地位が、外交上の威信と関係改善の手腕を高めている。"
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "バイエルン王国の樹立"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "王国の樹立が、国威のすべてを頂点へと導いた。"
