 eng_welsh_principality: "Allied Principality"
 eng_welsh_principality_plural: "Allied Principalities"
 eng_welsh_principality_desc: "A special status granted to a kingdom that has chosen partnership over rivalry — the overlord cannot compel it to join offensive wars, and this principality even holds the right to declare war on its own. In exchange, annexation is effectively impossible, and both realms prosper together under this unique bond."
