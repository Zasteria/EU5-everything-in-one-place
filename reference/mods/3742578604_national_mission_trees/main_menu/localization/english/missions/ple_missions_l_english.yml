l_english:
 ple_english_pale_mission_pack: "The Pale — From the Crown's Bridgehead to the Kingdom of Ireland"
 ple_english_pale_mission_pack_DESCRIPTION:0 "The narrow English Pale centered on Dublin — join hands with the Hiberno-Norman lords, conquer the Gaelic lands, and found a kingdom ruling all of Ireland."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Consolidate the Pale, conquer all of Ireland, and found a kingdom."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "From a small bridgehead to a kingdom ruling the whole Emerald Isle."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "'More Irish than the King himself' — plant the Pale's banner across all of Ireland!"
 ple_english_pale: "The English Pale"
 ple_english_pale_desc: "A narrow coastal strip centered on Dublin — this is the last bridgehead of English royal authority amid a vast Gaelic sea."
 ple_dublin_castle: "Develop Dublin Castle"
 ple_dublin_castle_desc: "Dublin Castle, built in 1204 — strengthen this center of English rule in Ireland further."
 ple_pale_defense: "Fortify the Pale"
 ple_pale_defense_desc: "The earthworks and ditches shielding the Pale from Gaelic raids — strengthen this defensive line known as 'The Ditch.'"
 ple_lord_deputy: "The Lord Deputy of Ireland"
 ple_lord_deputy_desc: "The Lord Deputy, ruling Ireland as the English King's representative — make this office unshakeable."
 ple_anglo_irish_parliament: "The Anglo-Irish Parliament"
 ple_anglo_irish_parliament_desc: "The Irish Parliament, convened at Drogheda or Dublin — make this assembly of Anglo-Irish lords and urban representatives function."
 ple_pale_consolidated: "The Pale Consolidated"
 ple_pale_consolidated_desc: "Fortifications, the Lord Deputy, the law, and the Parliament — build upon all of these, and make the governance of the Pale unshakeable."
 ple_hiberno_norman_lords: "The Hiberno-Norman Lords"
 ple_hiberno_norman_lords_desc: "The Anglo-Norman lords, said to be 'more English than the English themselves' — build relations with them."
 ple_fitzgerald_kildare: "The FitzGeralds of Kildare"
 ple_fitzgerald_kildare_desc: "'All Ireland cannot rule the Earl of Kildare' — so it was said. Build relations with this formidable house."
 ple_butler_ormond: "The Butlers of Ormond"
 ple_butler_ormond_desc: "The Butlers of Ormond, rivals of the Kildares — build relations with this house, staunchly loyal to the crown."
 ple_statutes_of_kilkenny: "The Statutes of Kilkenny"
 ple_statutes_of_kilkenny_desc: "Enacted in 1367, the Statutes of Kilkenny — enforce this law forbidding English settlers from becoming 'Gaelicized.'"
 ple_gaelic_frontier_wars: "The Gaelic Frontier Wars"
 ple_gaelic_frontier_wars_desc: "The Gaelic lords surrounding the Pale — face the ceaseless warfare of this frontier."
 ple_conquer_leinster: "Conquer Leinster"
 ple_conquer_leinster_desc: "Leinster, spreading south of the Pale — bring this region into our domain."
 ple_conquer_munster: "Conquer Munster"
 ple_conquer_munster_desc: "Munster, the sphere of the Earl of Desmond — conquer this rich region."
 ple_conquer_connacht: "Conquer Connaught"
 ple_conquer_connacht_desc: "Connaught, spreading into the western reaches — bring this frontier under our control."
 ple_conquer_ulster: "Conquer Ulster"
 ple_conquer_ulster_desc: "Ulster, the northern land of the most stubborn Gaelic resistance — conquer this region."
 ple_master_of_ireland: "Master of Ireland"
 ple_master_of_ireland_desc: "Leinster, Munster, Connaught, and Ulster — rule over all of these, and stand as the true master of Ireland."
 ple_reformation_choice: "The Choice of Reformation"
 ple_reformation_choice_desc: "The teachings of Luther and Calvin cross the sea — standing at this crossroads of faith, which path shall we choose?"
 ple_church_of_ireland: "The Church of Ireland"
 ple_church_of_ireland_desc: "The Church of Ireland, aligned with the Church of England — establish this new faith as an instrument of governance."
 ple_recusant_catholics: "Recusant Catholics"
 ple_recusant_catholics_desc: "The 'recusants,' who refuse to abandon their loyalty to Rome — accept their faith as a pillar of governance."
 ple_dublin_university: "Dublin University"
 ple_dublin_university_desc: "Dublin's seat of learning, epitomized by Trinity College — develop this place as a center of scholarship."
 ple_english_crown_relations: "Relations with the English Crown"
 ple_english_crown_relations_desc: "The English Crown across the sea — weigh our relations with this suzerain, for they shall decide our future."
 ple_kingdom_of_ireland: "The Kingdom of Ireland Proclaimed"
 ple_kingdom_of_ireland_desc: "The road that began at the small bridgehead of the Pale bears fruit here, as a kingdom ruling all of Ireland — yet the path this new kingdom shall take remains undecided."
 ple_events.99.t: "Proclamation of the Kingdom of Ireland"
 ple_events.99.d: "The long history that began at the small bridgehead of Dublin here enters a new era, as a kingdom ruling all of Ireland."
 ple_events.99.a: "Glory to Ireland!"
 ple_defy_the_crown: "Defiance of the Crown"
 ple_defy_the_crown_desc: "The Kingdom of Ireland is no longer a mere servant of England — make this rift the first step toward true sovereignty."
 ple_war_of_irish_independence: "The Irish War of Independence"
 ple_war_of_irish_independence_desc: "An unavoidable war with the crown across the sea — win this war of independence, and break the chains."
 ple_sovereign_kingdom_of_ireland: "A Sovereign Ireland"
 ple_sovereign_kingdom_of_ireland_desc: "A truly independent Kingdom of Ireland, subject to no crown — the Emerald Isle at last becomes master of its own destiny."
 ple_loyal_crown_partnership: "Partnership with the Crown"
 ple_loyal_crown_partnership_desc: "Partnership, not rivalry — the Kingdom of Ireland chooses an alliance of equals with the English crown."
 ple_anglo_irish_union: "The Anglo-Irish Union"
 ple_anglo_irish_union_desc: "Through marriage, or through close political ties, the two kingdoms take a step toward deeper union."
 ple_united_kingdoms: "A Partner in Union"
 ple_united_kingdoms_desc: "Having chosen partnership over rivalry, the Kingdom of Ireland stands alongside England as a partner in union, building an age of shared prosperity."
 STATIC_MODIFIER_NAME_ple_pale_mod: "The English Pale"
 STATIC_MODIFIER_DESC_ple_pale_mod: "Since Henry II's day, this land has remained the English crown's sole foothold beyond the mainland."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Dublin Castle Developed"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "The old Viking port now bustles as the seat of governance and commerce in Ireland."
 STATIC_MODIFIER_NAME_ple_defense_mod: "The Pale Fortified"
 STATIC_MODIFIER_DESC_ple_defense_mod: "Within the earthworks and ditches of 'The Pale,' farmers till their fields without fear of sudden Gaelic raids."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "The Lord Deputy"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "The Deputy who sits in Dublin Castle in the King's stead across the sea commands respect even among the great lords."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "The Anglo-Irish Parliament"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "The voices of the burghers gathered within the castle walls now carry further in matters of state."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "The Pale Consolidated"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Dublin is no longer a foreign enclave, but a true core territory recorded in the crown's own ledgers."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "The Hiberno-Norman Lords"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "The Norman lords in their castles have grown so rooted in this soil that they are said to be 'more Irish than the Irish themselves.'"
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "The Statutes of Kilkenny"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "Enacted in 1367, this law forbids settlers from adopting the Irish tongue or the customs of the Gael."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "The Gaelic Frontier Wars"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Countless skirmishes beyond the Pale's ditch have hardened the soldiers to the wars of the frontier."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Leinster Conquered"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "The granaries of Leinster, neighboring the Pale, are now entered into the crown's own tax rolls."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Munster Conquered"
 STATIC_MODIFIER_DESC_ple_munster_mod: "From the harbors of Munster, once the Earl of Desmond's domain, ships laden with wool and hide sail forth without end."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Connaught Conquered"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Even the clans of wild Connaught now answer the crown's call to arms."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ulster Conquered"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "The stubborn north, long held by the O'Neills and O'Donnells, has at last submitted to the royal banner."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "Master of Ireland"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "From Leinster to Ulster, the whole of the Emerald Isle now lies beneath a single banner."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "The Choice of Reformation"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "The teachings of Luther and Calvin, carried across the sea, send quiet ripples through the churches of this isle."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "The Church of Ireland"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "Within the chapels of the new church aligned with Canterbury, the English Bible is now read aloud."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Recusant Catholics"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Fined but unbowed, the 'recusants' continue their quiet prayers toward Rome."
 STATIC_MODIFIER_NAME_ple_university_mod: "Dublin University"
 STATIC_MODIFIER_DESC_ple_university_mod: "Along the cloisters of Trinity College, the footsteps of a new generation of scholars now echo."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "Relations with the English Crown"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Each letter that arrives from the court across the sea quietly shapes this kingdom's fate."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "The Kingdom of Ireland"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "A newly crowned King of Ireland now sits upon the throne within Dublin Castle."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Defiance of the Crown"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Among those who have cast off allegiance to the crown across the sea, an irrepressible fervor is spreading."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "The Irish War of Independence"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Countless clashes with the army sent across the sea have forged this island's soldiers into seasoned tacticians."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "A Sovereign Ireland"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "A banner of a truly free Ireland, beholden to no crown, now flies from the spires of Dublin Castle. Governors dispatched to every corner of the land are building the administrative sinews of a sovereign state."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Partnership with the Crown"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Having chosen trust over rivalry, envoys of the two crowns now cross the sea more often than ever."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "The Anglo-Irish Union"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Through the tireless work of envoys serving the court across the sea, the two crowns are bound more tightly than ever before."
