 # Fix for Destroy Building effect ("Сооружение «» в городе ... будет уничтожено")
 # Base game bug: effects_l_russian.yml:1842-1845 called [TARGET_BUILDING.GetName] instead of
 # [TARGET_BUILDING_TYPE.GetName], leaving the building name blank in "Проведение чистки" and destruction effects.

 # EN: DESTROY_BUILDING_EFFECT: "[TARGET_BUILDING_TYPE.GetName] will be destroyed"
 # RU: DESTROY_BUILDING_EFFECT: "Сооружение «[TARGET_BUILDING.GetName]» будет уничтожено"
 DESTROY_BUILDING_EFFECT: "Сооружение «[TARGET_BUILDING_TYPE.GetName]» будет уничтожено"

 # EN: THIRD_DESTROY_BUILDING_EFFECT: "[TARGET_BUILDING_TYPE.GetName] will be destroyed in [LOCATION.GetName]"
 # RU: THIRD_DESTROY_BUILDING_EFFECT: "Сооружение «[TARGET_BUILDING.GetName]» в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetName] будет уничтожено"
 THIRD_DESTROY_BUILDING_EFFECT: "Сооружение «[TARGET_BUILDING_TYPE.GetName]» в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetName] будет уничтожено"

 # EN: PAST_DESTROY_BUILDING_EFFECT: "[TARGET_BUILDING_TYPE.GetName] was destroyed"
 # RU: PAST_DESTROY_BUILDING_EFFECT: "[Concept('building', 'Сооружение')|e] уничтожено"
 PAST_DESTROY_BUILDING_EFFECT: "Сооружение «[TARGET_BUILDING_TYPE.GetName]» было уничтожено"

 # EN: PAST_THIRD_DESTROY_BUILDING_EFFECT: "[TARGET_BUILDING_TYPE.GetName] was destroyed in [LOCATION.GetName]"
 # RU: PAST_THIRD_DESTROY_BUILDING_EFFECT: "В [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetName] уничтожено [Concept('building', 'сооружение')|e]"
 PAST_THIRD_DESTROY_BUILDING_EFFECT: "Сооружение «[TARGET_BUILDING_TYPE.GetName]» в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetName] было уничтожено"
