l_russian:
 # Source relative paths in base game installation:
 #   EN: game/main_menu/localization/english/triggers_l_english.yml
 #   RU: game/main_menu/localization/russian/triggers_l_russian.yml

 # Fix for country existence triggers verb agreement (etyut -> end_etyut)
 # Base game bug: triggers_l_russian.yml:1662 mistakenly called Custom('etyut')
 # instead of Custom('end_etyut'), resulting in missing verb ending ("существу").

 # EN: country_exists_trigger: "[TARGET_COUNTRY.GetName|U] Exists"
 # RU: country_exists_trigger: "[TARGET_COUNTRY.GetName] существу[TARGET_COUNTRY.Custom('etyut')]"
 country_exists_trigger: "[TARGET_COUNTRY.GetName] существу[TARGET_COUNTRY.Custom('end_etyut')]"

 # EN: NOT_country_exists_trigger: "[TARGET_COUNTRY.GetName|U] does NOT exist"
 # RU: NOT_country_exists_trigger: "[TARGET_COUNTRY.GetName] НЕ существу[TARGET_COUNTRY.Custom('etyut')]"
 NOT_country_exists_trigger: "[TARGET_COUNTRY.GetName] НЕ существу[TARGET_COUNTRY.Custom('end_etyut')]"

 # EN: THIRD_HAS_BEEN_FORMED_TRIGGER: "[FORMABLE_COUNTRY.GetName] exists or has been formed already"
 # RU: THIRD_HAS_BEEN_FORMED_TRIGGER: "[FORMABLE_COUNTRY.GetName] существу[FORMABLE_COUNTRY.Custom('etyut')] или уже создавал[FORMABLE_COUNTRY.Custom('assya')]"
 THIRD_HAS_BEEN_FORMED_TRIGGER: "[FORMABLE_COUNTRY.GetName] существу[FORMABLE_COUNTRY.Custom('end_etyut')] или уже создавал[FORMABLE_COUNTRY.Custom('assya')]"

 # EN: NOT_THIRD_HAS_BEEN_FORMED_TRIGGER: "[FORMABLE_COUNTRY.GetName] does NOT exist and has NOT been formed already"
 # RU: NOT_THIRD_HAS_BEEN_FORMED_TRIGGER: "[FORMABLE_COUNTRY.GetName] НЕ существу[FORMABLE_COUNTRY.Custom('etyut')] и НЕ создавал[FORMABLE_COUNTRY.Custom('assya')]"
 NOT_THIRD_HAS_BEEN_FORMED_TRIGGER: "[FORMABLE_COUNTRY.GetName] НЕ существу[FORMABLE_COUNTRY.Custom('end_etyut')] и НЕ создавал[FORMABLE_COUNTRY.Custom('assya')]"
