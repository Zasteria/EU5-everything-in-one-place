l_braz_por:
 rule_qol_papal_auto_vote_rule: "#E Voto automático em bulas papais:#! Resoluções"
 setting_qol_papal_auto_vote_off: "Desativado"
 setting_qol_papal_auto_vote_off_desc: "Não vota automaticamente em nenhuma resolução papal. Os votos são emitidos quando o mês muda. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_papal_auto_vote_all: "Todas as resoluções"
 setting_qol_papal_auto_vote_all_desc: "Vota a favor em todas as resoluções papais ativas, incluindo excomunhão e convocação para cruzada. Os votos são emitidos quando o mês muda. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_papal_auto_vote_non_directed: "Resoluções não dirigidas"
 setting_qol_papal_auto_vote_non_directed_desc: "Vota a favor em todas as resoluções papais ativas, exceto excomunhão e convocação para cruzada, que permanecem manuais. Os votos são emitidos quando o mês muda. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
