l_german:
 rule_qol_papal_auto_vote_rule: "#E Auto-Abstimmung bei päpstlichen Bullen:#! Resolutionen"
 setting_qol_papal_auto_vote_off: "Deaktiviert"
 setting_qol_papal_auto_vote_off_desc: "Stimmt bei keiner päpstlichen Resolution automatisch ab. Die Stimmen werden beim Monatswechsel abgegeben. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
 setting_qol_papal_auto_vote_all: "Alle Resolutionen"
 setting_qol_papal_auto_vote_all_desc: "Stimmt bei jeder aktiven päpstlichen Resolution mit Ja, einschließlich Exkommunikation und Kreuzzugsaufruf. Die Stimmen werden beim Monatswechsel abgegeben. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
 setting_qol_papal_auto_vote_non_directed: "Nicht gerichtete Resolutionen"
 setting_qol_papal_auto_vote_non_directed_desc: "Stimmt bei jeder aktiven päpstlichen Resolution mit Ja, außer bei Exkommunikation und Kreuzzugsaufruf, die manuell bleiben. Die Stimmen werden beim Monatswechsel abgegeben. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
