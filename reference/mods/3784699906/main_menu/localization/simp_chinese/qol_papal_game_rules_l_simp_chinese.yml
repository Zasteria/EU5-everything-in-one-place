 setting_qol_papal_auto_vote_non_directed: "非定向决议"
 setting_qol_papal_auto_vote_non_directed_desc: "除绝罚和发动十字军（保持手动）外，对所有进行中的教皇决议自动投赞成票。投票在月份变更时生效。注意：如果你安装了Community Mod Framework (CMF)，此选项由该菜单控制。"
