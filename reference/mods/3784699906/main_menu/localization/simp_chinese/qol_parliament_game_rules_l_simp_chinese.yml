l_simp_chinese:
 rule_qol_parliament_auto_pause_rule: "#E 议会自动暂停:#! 会期结束"
 setting_qol_parliament_auto_pause_off: "停用"
 setting_qol_parliament_auto_pause_off_desc: "议会会期结束时不会暂停游戏。注意：如果你安装了Community Mod Framework (CMF)，此选项由该菜单控制。"
 setting_qol_parliament_auto_pause_always: "总是暂停"
 setting_qol_parliament_auto_pause_always_desc: "无论议题是否通过，都会在会期结束前1天暂停游戏。注意：如果你安装了Community Mod Framework (CMF)，此选项由该菜单控制。"
 setting_qol_parliament_auto_pause_if_fail: "仅当将失败时"
 setting_qol_parliament_auto_pause_if_fail_desc: "仅当支持度低于50%且议题即将失败时，才会在会期结束前1天暂停游戏。注意：如果你安装了Community Mod Framework (CMF)，此选项由该菜单控制。"
 rule_qol_parliament_availability_rule: "#E 议会自动暂停:#! 召集提醒"
 setting_qol_parliament_availability_enabled: "启用"
 setting_qol_parliament_availability_enabled_desc: "当可以召集新的议会会期时显示事件弹窗（并暂停游戏）。注意：如果你安装了Community Mod Framework (CMF)，此选项由该菜单控制。"
 setting_qol_parliament_availability_disabled: "停用"
 setting_qol_parliament_availability_disabled_desc: "当可以召集新的议会会期时不显示任何提醒。注意：如果你安装了Community Mod Framework (CMF)，此选项由该菜单控制。"
