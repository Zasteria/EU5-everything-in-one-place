l_polish:
 rule_qol_parliament_auto_pause_rule: "#E Automatyczna pauza parlamentu:#! Koniec sesji"
 setting_qol_parliament_auto_pause_off: "Wyłączone"
 setting_qol_parliament_auto_pause_off_desc: "Nie pauzuje gry, gdy kończy się sesja parlamentu. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja jest kontrolowana z jego menu."
 setting_qol_parliament_auto_pause_always: "Zawsze"
 setting_qol_parliament_auto_pause_always_desc: "Pauzuje grę 1 dzień przed końcem sesji, niezależnie od tego, czy kwestia zostanie przyjęta. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja jest kontrolowana z jego menu."
 setting_qol_parliament_auto_pause_if_fail: "Tylko przy porażce"
 setting_qol_parliament_auto_pause_if_fail_desc: "Pauzuje grę 1 dzień przed końcem sesji tylko wtedy, gdy poparcie jest poniżej 50% i kwestia ma szansę przepaść. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja jest kontrolowana z jego menu."
 rule_qol_parliament_availability_rule: "#E Automatyczna pauza parlamentu:#! Przypomnienie o zwołaniu"
 setting_qol_parliament_availability_enabled: "Włączone"
 setting_qol_parliament_availability_enabled_desc: "Pokazuje wyskakujące wydarzenie (i pauzuje grę), gdy można zwołać nową sesję parlamentu. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja jest kontrolowana z jego menu."
 setting_qol_parliament_availability_disabled: "Wyłączone"
 setting_qol_parliament_availability_disabled_desc: "Nie pokazuje żadnego przypomnienia, gdy można zwołać nową sesję parlamentu. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja jest kontrolowana z jego menu."
