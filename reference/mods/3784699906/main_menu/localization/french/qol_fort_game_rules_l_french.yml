l_french:
 rule_qol_fort_build_forbidden_rule: "#E Localités interdites pour les fortifications :#! Quand l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » est active"
 setting_qol_fort_build_forbidden_off: "Désactivé (vanilla)"
 setting_qol_fort_build_forbidden_off_desc: "L'automatisation peut construire des fortifications partout, comme dans le jeu de base. Remarque : si le Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
 setting_qol_fort_build_forbidden_rural: "Sans établissements ruraux"
 setting_qol_fort_build_forbidden_rural_desc: "L'automatisation ne peut pas construire de fortifications dans les établissements ruraux. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, un type de localité interdit bloque aussi la construction manuelle. Remarque : si le Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
 setting_qol_fort_build_forbidden_town: "Rien dans les bourgs ou inférieur"
 setting_qol_fort_build_forbidden_town_desc: "L'automatisation ne peut pas construire de fortifications dans les bourgs ni dans les niveaux inférieurs. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, un type de localité interdit bloque aussi la construction manuelle. Remarque : si le Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
 setting_qol_fort_build_forbidden_city: "Rien dans les villes ou inférieur"
 setting_qol_fort_build_forbidden_city_desc: "L'automatisation ne peut pas construire de fortifications dans les villes ni dans les niveaux inférieurs. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, un type de localité interdit bloque aussi la construction manuelle. Remarque : si le Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
 setting_qol_fort_build_forbidden_all: "Aucune fortification"
 setting_qol_fort_build_forbidden_all_desc: "L'automatisation ne peut construire aucune fortification où que ce soit : tous les types et niveaux de localité sont interdits, y compris les mégapoles. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, un type de localité interdit bloque aussi la construction manuelle. Remarque : si le Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
