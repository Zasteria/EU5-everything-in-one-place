l_japanese:
 rule_qol_fort_build_forbidden_rule: "#E 要塞の建設禁止:#! 「建造物」または「建造物の自動拡張」の自動化が有効な場合"
 setting_qol_fort_build_forbidden_off: "オフ（バニラ）"
 setting_qol_fort_build_forbidden_off_desc: "自動化は基本ゲーム同様、どこでも要塞を建設できます。注：Community Mod Framework（CMF）を導入している場合、このオプションはそのメニューから操作します。"
 setting_qol_fort_build_forbidden_rural: "農村集落なし"
 setting_qol_fort_build_forbidden_rural_desc: "自動化は農村集落に要塞を建設できません。「建造物」または「建造物の自動拡張」の自動化が有効な場合、禁止された場所の種類では手動建設もブロックされます。注：Community Mod Framework（CMF）を導入している場合、このオプションはそのメニューから操作します。"
 setting_qol_fort_build_forbidden_town: "町以下なし"
 setting_qol_fort_build_forbidden_town_desc: "自動化は町およびそれ以下の段階に要塞を建設できません。「建造物」または「建造物の自動拡張」の自動化が有効な場合、禁止された場所の種類では手動建設もブロックされます。注：Community Mod Framework（CMF）を導入している場合、このオプションはそのメニューから操作します。"
 setting_qol_fort_build_forbidden_city: "都市以下なし"
 setting_qol_fort_build_forbidden_city_desc: "自動化は都市およびそれ以下の段階に要塞を建設できません。「建造物」または「建造物の自動拡張」の自動化が有効な場合、禁止された場所の種類では手動建設もブロックされます。注：Community Mod Framework（CMF）を導入している場合、このオプションはそのメニューから操作します。"
 setting_qol_fort_build_forbidden_all: "要塞なし"
 setting_qol_fort_build_forbidden_all_desc: "自動化はどこにも、いかなる場所の種類や段階でも要塞を建設できません（大都市を含みます）。「建造物」または「建造物の自動拡張」の自動化が有効な場合、禁止された場所の種類では手動建設もブロックされます。注：Community Mod Framework（CMF）を導入している場合、このオプションはそのメニューから操作します。"
