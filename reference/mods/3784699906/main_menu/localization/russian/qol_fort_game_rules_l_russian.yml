l_russian:
 rule_qol_fort_build_forbidden_rule: "#E Запрещённые для укреплений локации:#! Когда включена автоматизация «Сооружения» или «Авторасширение сооружений»"
 setting_qol_fort_build_forbidden_off: "Выключено (ваниль)"
 setting_qol_fort_build_forbidden_off_desc: "Автоматизация может строить укрепления где угодно, как в базовой игре. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_fort_build_forbidden_rural: "Без сельских поселений"
 setting_qol_fort_build_forbidden_rural_desc: "Автоматизация не может строить укрепления в сельских поселениях. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» запрещённый тип локации блокирует и ручное строительство. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_fort_build_forbidden_town: "Ничего в местечках и ниже"
 setting_qol_fort_build_forbidden_town_desc: "Автоматизация не может строить укрепления в местечках и поселениях ниже. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» запрещённый тип локации блокирует и ручное строительство. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_fort_build_forbidden_city: "Ничего в городах и ниже"
 setting_qol_fort_build_forbidden_city_desc: "Автоматизация не может строить укрепления в городах и поселениях ниже. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» запрещённый тип локации блокирует и ручное строительство. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_fort_build_forbidden_all: "Вообще без укреплений"
 setting_qol_fort_build_forbidden_all_desc: "Автоматизация не может строить никакие укрепления нигде: запрещены все типы и ранги локаций, включая мегаполисы. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» запрещённый тип локации блокирует и ручное строительство. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
