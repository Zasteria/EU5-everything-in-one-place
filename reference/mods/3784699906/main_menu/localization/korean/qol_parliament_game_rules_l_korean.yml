 setting_qol_parliament_auto_pause_off_desc: "의회 회기가 끝나도 게임을 일시정지하지 않습니다. 참고: Community Mod Framework (CMF)가 설치되어 있으면 이 옵션은 해당 메뉴에서 제어됩니다."
