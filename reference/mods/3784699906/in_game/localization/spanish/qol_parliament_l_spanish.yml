l_spanish:
 qol_parliament.1.t: "Último día de la sesión parlamentaria"
 qol_parliament.1.d: "La [parliament|e] se reunirá por última vez mañana. Si queremos que la cuestión debatida salga adelante, debemos acudir a las cámaras ahora y asegurar el apoyo necesario antes de que sea demasiado tarde."
 qol_parliament.1.a: "Dirigirme a la [parliament|e] para asegurar el apoyo"
 qol_parliament.1.b: "Dejar que la sesión siga su curso."
 qol_parliament.3.t: "Nueva sesión parlamentaria posible"
 qol_parliament.3.d: "Han pasado meses desde la última convocatoria y ya podemos reunir a nuestros [estates|e] en la [parliament|e] para resolver sus [parliament_issues|e], solicitar un [casus_belli|e] o recaudar mayores [taxes|e] y [levies]. Acudir a las cámaras no hará sino reforzar nuestro gobierno."
 qol_parliament.3.a: "Reunir a los [estates|e] en una nueva sesión"
 qol_parliament.3.b: "Lo dejaremos para más adelante."
