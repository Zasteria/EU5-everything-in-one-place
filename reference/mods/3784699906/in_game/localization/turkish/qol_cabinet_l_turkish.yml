l_turkish:
 # Calidad de vida EU5 - kabine aksiyonu "maksimumda" uyarıları.
 # CMF uyarı görüntüleme sözleşmesi: qol_cab_ready_stabilize / qol_cab_ready_strengthen bayrakları.
 # _color (renk sözcüğü) ve _icon (metin ikonu); _name/_tooltip, aksiyonun maksimuma
 # ulaştığını ve maksimumda bakım maliyetini düşürmek için etkin kaldığını söyler.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "İstikrar maksimumda"
 qol_cab_ready_stabilize_tooltip: "[ShowCabinetActionName('stabilize_country')] aksiyonu etkinken istikrar maksimumuna ulaştı. Aksiyon, maksimumda bakım maliyetini düşürmek için bilerek etkin tutulur - yuvayı boşaltmak için elle iptal edin."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Hükûmet gücü maksimumda"
 qol_cab_ready_strengthen_tooltip: "[ShowCabinetActionName('strengthen_government')] aksiyonu etkinken hükûmet gücü maksimumuna ulaştı. Aksiyon, maksimumda bakım maliyetini düşürmek için bilerek etkin tutulur - yuvayı boşaltmak için elle iptal edin."