l_turkish:
 qol_parliament.1.t: "Parlamento oturumunun son günü"
 qol_parliament.1.d: "[parliament|e] yarın son kez toplanacak. Tartışılan meselenin kabul edilmesini istiyorsak, artık çok geç olmadan meclise gitmeli ve gereken desteği sağlamalıyız."
 qol_parliament.1.a: "Desteği sağlamak için [parliament|e] git"
 qol_parliament.1.b: "Oturumun kendi seyrinde sürmesine izin ver."
 qol_parliament.3.t: "Yeni bir parlamento oturumu mümkün"
 qol_parliament.3.d: "Son çağrının üzerinden aylar geçti ve artık [estates|e]imizi [parliament|e]de toplayıp sorunlarını ([parliament_issues|e]) çözebilir, [casus_belli|e] talep edebilir veya daha fazla [taxes|e] ve [levies] toplayabiliriz. Meclise gitmek hükümetimizi güçlendirmekten başka bir şey yapmaz."
 qol_parliament.3.a: "[estates|e]i yeni bir oturum için topla"
 qol_parliament.3.b: "Bununla daha sonra ilgileniriz."
