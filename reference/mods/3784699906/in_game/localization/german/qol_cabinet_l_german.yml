l_german:
 # Calidad de vida EU5 - Kabinettsaktions-Hinweise am Maximum.
 # CMF-Alert-Anzeigevertrag: Flags qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (Farbwort) und _icon (Text-Icon); _name/_tooltip informieren, dass die Aktion
 # das Maximum erreicht hat und aktiv bleibt, um die Unterhaltskosten am Maximum zu senken.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Stabilität am Maximum"
 qol_cab_ready_stabilize_tooltip: "Die Stabilität hat ihr Maximum erreicht, während die Aktion [ShowCabinetActionName('stabilize_country')] aktiv ist. Die Aktion bleibt bewusst aktiv, um die Unterhaltskosten am Maximum zu senken - brechen Sie sie manuell ab, um den Platz freizugeben."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Regierungsmacht am Maximum"
 qol_cab_ready_strengthen_tooltip: "Die Regierungsmacht hat ihr Maximum erreicht, während die Aktion [ShowCabinetActionName('strengthen_government')] aktiv ist. Die Aktion bleibt bewusst aktiv, um die Unterhaltskosten am Maximum zu senken - brechen Sie sie manuell ab, um den Platz freizugeben."