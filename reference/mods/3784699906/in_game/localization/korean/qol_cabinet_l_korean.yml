l_korean:
 # Calidad de vida EU5 - 내각 행동 최대치 알림.
 # CMF 알림 표시 규약: qol_cab_ready_stabilize / qol_cab_ready_strengthen 플래그.
 # _color(색상 단어) 및 _icon(텍스트 아이콘); _name/_tooltip은 행동이 최대치에
 # 도달했고 최대치 유지 비용을 낮추기 위해 활성 상태를 유지함을 알려줍니다.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "안정도 최대치 도달"
 qol_cab_ready_stabilize_tooltip: "[ShowCabinetActionName('stabilize_country')] 행동이 활성화된 동안 안정도가 최대치에 도달했습니다. 최대치 유지 비용을 낮추기 위해 행동은 의도적으로 계속 실행됩니다 - 슬롯을 비우려면 직접 취소하세요."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "정부 권력 최대치 도달"
 qol_cab_ready_strengthen_tooltip: "[ShowCabinetActionName('strengthen_government')] 행동이 활성화된 동안 정부 권력이 최대치에 도달했습니다. 최대치 유지 비용을 낮추기 위해 행동은 의도적으로 계속 실행됩니다 - 슬롯을 비우려면 직접 취소하세요."