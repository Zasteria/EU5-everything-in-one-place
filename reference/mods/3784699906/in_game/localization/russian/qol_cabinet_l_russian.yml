l_russian:
 # Calidad de vida EU5 - оповещения о действиях кабинета на максимуме.
 # Контракт отображения оповещений CMF: флаги qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (название цвета) и _icon (текстовая иконка); _name/_tooltip сообщают, что действие
 # достигло максимума и остаётся активным, чтобы снизить стоимость содержания на максимуме.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Стабильность на максимуме"
 qol_cab_ready_stabilize_tooltip: "Стабильность достигла максимума, пока активно действие [ShowCabinetActionName('stabilize_country')]. Действие намеренно остаётся активным, чтобы снизить стоимость содержания на максимуме - отмените его вручную, чтобы освободить слот."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Государственная власть на максимуме"
 qol_cab_ready_strengthen_tooltip: "Государственная власть достигла максимума, пока активно действие [ShowCabinetActionName('strengthen_government')]. Действие намеренно остаётся активным, чтобы снизить стоимость содержания на максимуме - отмените его вручную, чтобы освободить слот."