 cea__auto: "$cea__auto_name$"
 cea__depth_format: "[GetPlayer.MakeScope.GetVariable('cea_depth').GetValue|0]"
 cea_child_education_icon: "@heir!"
 cea_child_education_color: "green"
 cea__paid_name: "Paid education"
 cea__paid__paid_traits_name: "Expensive in-depth education"
 cea__paid__paid_traits_desc: "Children with the checked traits get the expensive in-depth education once a month, paid as in the game. If the country can't afford it, the Auto-education setting applies, and the paid one once it can. Works even with auto-education off."
 cea__paid_traits_name: "Expensive in-depth education"
 cea__paid_traits_desc: "Children with the checked traits get the expensive in-depth education once a month, paid as in the game. If the country can't afford it, the Auto-education setting applies, and the paid one once it can. Works even with auto-education off."
 cea__paid_traits: "$cea__paid_traits_name$"
 cea__paid_traits_item_column_name: "Trait"
 cea__paid_traits__boys_name: "Boys"
 cea__paid_traits__boys_desc: "Paid education for boys with this trait."
 cea__paid_traits__girls_name: "Girls"
 cea__paid_traits__girls_desc: "Paid education for girls with this trait."
