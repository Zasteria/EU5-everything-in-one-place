 cea_child_education_icon: "@heir!"
 cea_child_education_color: "green"
 cea__paid_name: "Ücretli eğitim"
 cea__paid__paid_traits_name: "Ücretli kapsamlı eğitim"
 cea__paid__paid_traits_desc: "İşaretlediğin özelliklere sahip çocuklara, koşulları karşılıyorlarsa ayda bir ücretli kapsamlı eğitim seçilir. Oyunun normal eğitim bedeli ödenir. Yeterli altın yoksa otomatik eğitim ayarındaki seçenek uygulanır; altın yeterli olduğunda çocuk kapsamlı eğitime geçirilir. Otomatik eğitim kapalıyken de çalışır. Elle seçtiğin eğitimler korunur."
 cea__paid_traits_name: "Ücretli kapsamlı eğitim"
 cea__paid_traits_desc: "İşaretlediğin özelliklere sahip çocuklara, koşulları karşılıyorlarsa ayda bir ücretli kapsamlı eğitim seçilir. Oyunun normal eğitim bedeli ödenir. Yeterli altın yoksa otomatik eğitim ayarındaki seçenek uygulanır; altın yeterli olduğunda çocuk kapsamlı eğitime geçirilir. Otomatik eğitim kapalıyken de çalışır. Elle seçtiğin eğitimler korunur."
 cea__paid_traits: "$cea__paid_traits_name$"
 cea__paid_traits_item_column_name: "Çocuğun özelliği"
 cea__paid_traits__boys_name: "Erkek"
 cea__paid_traits__boys_desc: "Bu özelliğe sahip erkek çocuklara ücretli kapsamlı eğitim seç."
 cea__paid_traits__girls_name: "Kız"
 cea__paid_traits__girls_desc: "Bu özelliğe sahip kız çocuklarına ücretli kapsamlı eğitim seç. Kız çocuklarını dahil et ayarının da açık olması gerekir."
