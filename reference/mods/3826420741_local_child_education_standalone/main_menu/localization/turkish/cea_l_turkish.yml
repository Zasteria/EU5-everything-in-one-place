l_turkish:
 cea_name: "Otomatik Çocuk Eğitimi"
 cea_desc: "Eğitim bekleyen çocukları takip et ve eğitimlerini otomatik olarak belirle."
 cea__settings_name: "Genel ayarlar"
 cea__settings__settings_name: "Otomatik Çocuk Eğitimi"
 cea__settings__settings_desc: "Eğitim uyarısı ve otomatik eğitim ayda bir kontrol edilir."
 cea__alert_enabled_name: "Eğitim uyarısı"
 cea__alert_enabled_desc: "İzlenen çocuklardan biri dengeli eğitim alıyorsa bir eğitim uyarısı göster."
 cea__who_name: "İzlenecek çocuklar"
 cea__who_desc: "Eğitim uyarısının, otomatik eğitimin ve ücretli eğitimin hangi çocukları kapsayacağını belirler."
 cea__who_option_1_name: "Hükümdar ve varislerin ailesi"
 cea__who_option_1_desc: "Hükümdarın çocukları ve torunları ile veraset sırasının başındaki varisleri ve onların çocuklarını ve torunlarını takip eder. Veraset sırası ayarı yalnızca kaç varisin ailesinin ekleneceğini belirler. Kız çocuklarını dahil et ayarı tüm bu çocuklara uygulanır."
 cea__who_option_2_name: "Saraydaki aile çocukları"
 cea__who_option_2_desc: "Sarayındaki tüm varisleri, onların çocuklarını ve torunlarını kapsar. Ayrıca hükümdarın hanedanındaki çocukları ve farklı bir hanedana mensup olsalar bile hükümdarın çocukları ile torunlarını da takip eder."
 cea__depth_name: "Veraset sırasındaki kişi sayısı"
 cea__depth_desc: "Veraset sırasının başından itibaren kaç varisin takip edileceğini belirler. Yalnızca varisleri izleme seçeneğinde kullanılır; tüm aile çocukları seçildiğinde devre dışı kalır. Örneğin 3 seçilirse ilk üç varis ile onların çocukları ve torunları kapsanır. Kız çocuklarını dahil et ayarı kapalıysa yalnızca erkek çocuklar takip edilir."
 cea__women_name: "Kız çocuklarını dahil et"
 cea__women_desc: "Kız çocuklarını da takip eder. Kapalıysa yalnızca erkek çocuklar kapsanır. Her iki takip seçeneğinde de eğitim uyarısına, otomatik eğitime ve ücretli eğitime uygulanır."
 cea__future_royals_name: "Gelecekteki kraliyet ailesiyle sınırla"
 cea__future_royals_desc: "Takip edilen çocuklar arasından, ilk varis hükümdar olduğunda kraliyet zümresinde kalacak olanları seçer: varisin kendisi ve yakın akrabaları. Buna çocukları, torunları, kardeşleri, yeğenleri, anne ve babası ile amca, dayı, hala ve teyzeleri dahildir. Örneğin varisin kardeşlerinin çocukları takip edilmeye devam eder. Kuzenleri ve onların çocukları ise hükümdar değiştiğinde soylu zümresine geçecekleri için kapsam dışında kalır."
 cea__auto_name: "Otomatik eğitim"
 cea__auto_desc: "Dengeli eğitim alan veya henüz eğitimi seçilmemiş çocukların eğitimini ayda bir belirler. Elle seçtiğin idari, diplomatik, askerî veya kapsamlı eğitimi değiştirmez."
 cea__auto_option_1_name: "Kapalı"
 cea__auto_option_1_desc: "Çocukların eğitimini kendin seçersin. Ücretli eğitim sekmesinde işaretlediğin özelliklere yönelik otomasyon ayrı olarak çalışmaya devam eder."
 cea__auto_option_2_name: "Özelliklerine göre"
 cea__auto_option_2_desc: "Akıllı çocuklara idari, arkadaş canlısı çocuklara diplomatik, gürültücü çocuklara askerî eğitim verilir. Hırslı çocuklarda idari ve diplomatik; yürekli çocuklarda diplomatik ve askerî; kurnaz çocuklarda askerî ve idari becerilerden yüksek olan seçilir. Diğer çocuklarda en yüksek beceriye uygun eğitim seçilir."
 cea__auto_option_3_name: "İdari"
 cea__auto_option_3_desc: "Koşulları karşılayan tüm çocuklara idari eğitim verilir."
 cea__auto_option_4_name: "Diplomatik"
 cea__auto_option_4_desc: "Koşulları karşılayan tüm çocuklara diplomatik eğitim verilir."
 cea__auto_option_5_name: "Askerî"
 cea__auto_option_5_desc: "Koşulları karşılayan tüm çocuklara askerî eğitim verilir."
 CEA_OPEN_SETTINGS: "Otomatik Çocuk Eğitimi"
 cea_child_education_name: "Eğitim bekleyen çocuklar"
 cea_child_education_tooltip: "İzlenen çocuklardan biri dengeli eğitim alıyor veya henüz eğitimi seçilmemiş. İdari, diplomatik ya da askerî eğitim, ilgili becerinin daha hızlı gelişmesini sağlar.\n\nAyarları ve çocuk listesini açmak için tıkla. Karakter panelini açmak için listeden bir çocuk seç. Kontroller ayda bir yapılır."
