 imperial_diet_petition_policy_locked_tt: "The Emperor has refused [SCOPE.sPolicy('root').GetName] already. We may propose it again from #Y [ShowExpirationDateInVariableListForTarget(SCOPE.sInternationalOrganization('io_recipient'), 'imperial_diet_petition_policy_lock', SCOPE.sPolicy('root'))]#!"
