l_english:

 INCOMING_OFFER_petition_imperial_diet: "[SCOPE.sCountry('actor').GetName] has petitioned us to call the Imperial Diet to a vote on the [SCOPE.sLaw('target').GetNameWithContext(SCOPE.sInternationalOrganization('io_recipient'))], proposing [SCOPE.sPolicy('vote').GetName] (#Y [SCOPE.sPolicy('vote').MakeScope.ScriptValue('imperial_diet_projected_votes')|0]#! votes).\nThe current [policy|e] is [SCOPE.sInternationalOrganization('io_recipient').GetImplementedPolicyForLaw(SCOPE.sLaw('target').Self).GetName] (#Y [SCOPE.sPolicy('vote').MakeScope.ScriptValue('imperial_diet_projected_votes_keep')|0]#! votes).\n\n#T Grant:#! We gain #G +[SCOPE.sCountry('actor').MakeScope.ScriptValue('imperial_diet_petition_accept_authority')|1]#! $imperial_authority$.\n#T Refuse:#! [SCOPE.sCountry('actor').GetName] lose #R [ShowBiasValue('opinion_emperor_rejected_our_petition')|0]#! [opinion|e] of us and #R [ShowNamedValue('prestige_weak_penalty')|0]#! [prestige|e]."

 ACTION_petition_imperial_diet_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetName] has petitioned us to call a vote on the [SCOPE.sLaw('target').GetNameWithContext(SCOPE.sInternationalOrganization('io_recipient'))], proposing [SCOPE.sPolicy('vote').GetName]."
